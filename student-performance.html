<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Student Performance</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #f97316; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden transition-colors duration-500">

    <!-- Ambient Background -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <!-- Header -->
    <header id="main-header" class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex flex-col sm:flex-row sm:items-center justify-between shadow-xl sticky top-0 z-[100] gap-4 border-b-4 border-indigo-500 transition-colors duration-500">
        <div class="flex items-center gap-4 w-full sm:w-auto">
            <button onclick="window.location.replace('student-portal.html')" class="p-3 sm:p-4 bg-black/20 hover:bg-black/40 rounded-xl transition-colors shadow-sm shrink-0 border border-white/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex-1">
                <h1 class="text-2xl sm:text-3xl font-black tracking-widest uppercase leading-none">Performance Hub</h1>
                <div class="flex items-center gap-2 mt-1.5">
                    <p class="text-xs sm:text-sm text-indigo-300 font-bold uppercase tracking-widest bg-black/20 px-2 py-0.5 rounded">Analytics & Exams</p>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="text-right">
                <p id="student-name" class="font-black text-sm uppercase tracking-widest text-white"></p>
                <p id="student-class-sec" class="text-[10px] font-bold text-indigo-200 uppercase tracking-widest"></p>
            </div>
            <div class="bg-indigo-600 p-2 rounded-xl border border-indigo-500 shadow-inner">
                <span class="text-xl">🎓</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 mt-4 space-y-8 relative z-10">
        
        <!-- UPCOMING EXAMS NOTIFICATION BUTTON -->
        <div class="w-full flex justify-center relative z-20">
            <button id="exam-btn" onclick="toggleExamView()" class="relative group bg-white border-2 border-slate-200 hover:border-indigo-400 p-6 rounded-[2rem] shadow-lg hover:shadow-2xl hover:-translate-y-1 transition-all flex items-center gap-5 w-full sm:w-auto min-w-[300px]">
                <div class="bg-indigo-50 text-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center text-3xl shadow-inner group-hover:scale-110 transition-transform">
                    📝
                </div>
                <div class="text-left flex-1">
                    <h3 class="font-black text-slate-800 text-xl uppercase tracking-tighter">Upcoming Exams</h3>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Check your schedule & syllabus</p>
                </div>
                <div id="exam-count-badge" class="absolute -top-3 -right-3 bg-rose-500 text-white w-8 h-8 flex items-center justify-center rounded-full font-black text-sm shadow-[0_0_15px_rgba(225,29,72,0.5)] border-2 border-white hidden transition-all">
                    0
                </div>
            </button>
        </div>

        <!-- EXAM LIST CONTAINER (Hidden by default) -->
        <div id="exam-list-container" class="hidden glass-card p-6 sm:p-8 rounded-[2.5rem] mt-4 transform origin-top transition-all">
            <div class="flex justify-between items-center border-b border-slate-200 pb-4 mb-6">
                <div>
                    <h2 class="text-2xl font-black text-indigo-900 uppercase tracking-tighter">Your Exam Schedule</h2>
                    <p class="text-xs font-bold text-indigo-500 uppercase tracking-widest mt-1">Targetted for your section</p>
                </div>
                <button onclick="toggleExamView()" class="text-slate-400 hover:text-rose-500 bg-slate-100 p-2 rounded-xl transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            
            <div id="exam-list" class="space-y-4">
                <div class="text-center py-10"><span class="loader border-t-indigo-600"></span></div>
            </div>
        </div>

        <!-- PERFORMANCE METRICS PLACEHOLDER -->
        <div class="glass-card p-8 sm:p-12 rounded-[2.5rem] text-center border-2 border-dashed border-slate-300 bg-white/50 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-slate-100/50 pointer-events-none"></div>
            <div class="relative z-10 flex flex-col items-center justify-center">
                <span class="text-6xl mb-4 opacity-50 grayscale filter">📈</span>
                <h2 class="text-2xl sm:text-3xl font-black text-slate-400 uppercase tracking-tighter">Performance Analytics</h2>
                <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mt-2 max-w-md mx-auto leading-relaxed">
                    Detailed insights, subject-wise scoring, and rank predictions are currently under development.
                </p>
                <div class="mt-6 inline-block bg-slate-200 text-slate-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-inner">
                    Coming Soon
                </div>
            </div>
        </div>

    </main>

    <!-- SYLLABUS MODAL (Updated with Exam Name, Class, Sec, Date, Subject) -->
    <div id="student-syllabus-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[300] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-6 sm:p-8 bg-indigo-50 border-b border-indigo-100 flex justify-between items-start shrink-0">
                <div>
                    <h3 id="student-syll-title" class="font-black text-indigo-900 text-xl uppercase tracking-tighter"></h3>
                    <div class="flex flex-wrap gap-2 mt-2">
                        <span id="student-syll-type" class="text-[10px] font-black text-white bg-indigo-600 uppercase tracking-widest px-2.5 py-1 rounded-md shadow-sm inline-block"></span>
                        <span id="student-syll-date" class="text-[10px] font-black text-indigo-700 uppercase tracking-widest bg-white border border-indigo-200 px-2.5 py-1 rounded-md shadow-sm inline-block"></span>
                        <span id="student-syll-sub" class="text-[10px] font-black text-indigo-700 uppercase tracking-widest bg-white border border-indigo-200 px-2.5 py-1 rounded-md shadow-sm inline-block"></span>
                    </div>
                </div>
                <button onclick="closeStudentSyllabusModal()" class="bg-indigo-100 text-indigo-500 hover:bg-rose-100 hover:text-rose-600 w-10 h-10 rounded-full font-black text-xl transition-colors flex items-center justify-center shrink-0">✕</button>
            </div>
            
            <div class="p-6 sm:p-8 flex-1 overflow-y-auto bg-white custom-scroll">
                <div id="student-syll-content" class="text-sm font-bold text-slate-700 leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStudent = null;
        let activeCenter = "GHUMARWIN";

        window.onload = async () => {
            const isAuth = sessionStorage.getItem('minervaStudentAuth');
            activeStudent = JSON.parse(sessionStorage.getItem('minervaStudentData'));

            if (!isAuth || isAuth !== 'true' || !activeStudent) {
                window.location.replace('student-login.html');
                return;
            }

            activeCenter = activeStudent.center ? activeStudent.center.toUpperCase() : "GHUMARWIN";
            
            // Set UI details
            document.getElementById('student-name').innerText = activeStudent.name || activeStudent.email || "Student";
            document.getElementById('student-class-sec').innerText = `${activeStudent.className} | Sec ${activeStudent.section}`;

            applyBranchTheme();
            await fetchUpcomingExams();
        };

        function applyBranchTheme() {
            if (activeCenter === "DHARAMSHALA") {
                document.getElementById('main-header').classList.replace('bg-[#1e1b4b]', 'bg-purple-950');
                document.getElementById('main-header').classList.replace('border-indigo-500', 'border-purple-400');
                document.body.style.backgroundColor = '#faf5ff'; 
            }
        }

        function getCollection(name) {
            return activeCenter === "GHUMARWIN" ? db.collection(name) : db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        function toggleExamView() {
            const container = document.getElementById('exam-list-container');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                // Scroll down slightly to show exams
                setTimeout(() => {
                    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            } else {
                container.classList.add('hidden');
            }
        }

        function viewStudentSyllabus(examType, examDate, className, section, subject, syllabusText) {
            const dateObj = new Date(examDate);
            const prettyDate = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

            document.getElementById('student-syll-title').innerText = `Class ${className} | Sec ${section}`;
            document.getElementById('student-syll-type').innerText = examType;
            document.getElementById('student-syll-date').innerText = prettyDate;
            document.getElementById('student-syll-sub').innerText = subject;
            document.getElementById('student-syll-content').innerHTML = syllabusText || "No syllabus provided.";
            
            document.getElementById('student-syllabus-modal').classList.remove('hidden');
            document.getElementById('student-syllabus-modal').classList.add('flex');
        }

        function closeStudentSyllabusModal() {
            document.getElementById('student-syllabus-modal').classList.add('hidden');
            document.getElementById('student-syllabus-modal').classList.remove('flex');
        }

        async function fetchUpcomingExams() {
            const offset = (new Date()).getTimezoneOffset() * 60000;
            const todayIso = (new Date(Date.now() - offset)).toISOString().split('T')[0];

            try {
                // Fetch exams exclusively for this student's class and section
                const snap = await getCollection("exam_schedules")
                    .where("className", "==", activeStudent.className)
                    .where("section", "==", activeStudent.section)
                    .get();
                
                let upcoming = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.date >= todayIso) {
                        upcoming.push(data);
                    }
                });

                // Sort chronologically
                upcoming.sort((a,b) => a.date.localeCompare(b.date));

                // Update Notification Badge
                const badge = document.getElementById('exam-count-badge');
                const btn = document.getElementById('exam-btn');
                
                if (upcoming.length > 0) {
                    badge.innerText = upcoming.length;
                    badge.classList.remove('hidden');
                    btn.classList.add('animate-pulse');
                    // Stop pulsing after 3 seconds
                    setTimeout(() => btn.classList.remove('animate-pulse'), 3000);
                } else {
                    badge.classList.add('hidden');
                }

                // Render Exam Cards
                const listContainer = document.getElementById('exam-list');
                
                if (upcoming.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                            <span class="text-4xl mb-2 block opacity-50">🏖️</span>
                            <p class="text-slate-400 font-black uppercase text-sm tracking-widest">No upcoming exams scheduled.</p>
                            <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-1">Focus on your daily revisions!</p>
                        </div>`;
                    return;
                }

                let html = "";
                upcoming.forEach(exam => {
                    const dateObj = new Date(exam.date);
                    const prettyDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                    
                    let typeColor = "bg-slate-100 text-slate-700";
                    if (exam.type === 'UT') typeColor = "bg-blue-600 text-white";
                    if (exam.type === 'OT') typeColor = "bg-amber-500 text-white";
                    if (['Terminal Exams', 'Preboard', 'Board Exam'].includes(exam.type)) typeColor = "bg-rose-600 text-white";

                    // Build subjects and syllabus
                    let subsHtml = (exam.subjects || []).map(sub => {
                        let syllabusBtnHtml = "";
                        
                        // Check if syllabus was uploaded for this specific subject
                        if (exam.syllabi && exam.syllabi[sub] && exam.syllabi[sub].trim() !== "") {
                            const safeSyllabus = encodeURIComponent(exam.syllabi[sub]);
                            syllabusBtnHtml = `
                                <button onclick="viewStudentSyllabus('${exam.type}', '${exam.date}', '${exam.className}', '${exam.section}', '${sub}', decodeURIComponent('${safeSyllabus}'))" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest border border-emerald-200 shadow-sm transition-colors whitespace-nowrap mt-4 w-full flex items-center justify-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> 
                                    View Syllabus
                                </button>
                            `;
                        } else {
                            syllabusBtnHtml = `
                                <div class="bg-rose-50 text-rose-600 px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest border border-rose-200 shadow-sm whitespace-nowrap mt-4 text-center animate-pulse">
                                    ⚠️ Syllabus Pending
                                </div>
                            `;
                        }

                        return `
                            <div class="mt-3 bg-white border border-slate-200 rounded-[1.25rem] p-5 shadow-sm hover:border-indigo-300 transition-colors flex flex-col justify-between">
                                <div class="flex items-center gap-3">
                                    <span class="bg-indigo-50 text-indigo-700 w-10 h-10 flex items-center justify-center rounded-xl text-lg font-black shadow-inner shrink-0">📘</span>
                                    <h4 class="font-black text-slate-800 uppercase text-sm tracking-widest leading-tight">${sub}</h4>
                                </div>
                                ${syllabusBtnHtml}
                            </div>
                        `;
                    }).join('');

                    html += `
                        <div class="bg-indigo-50/30 border-2 border-indigo-100 rounded-[1.5rem] p-5 sm:p-6 shadow-sm hover:shadow-md transition-shadow">
                            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center border-b border-indigo-100/50 pb-4 mb-2 gap-3">
                                <div>
                                    <h3 class="font-black text-indigo-900 text-lg sm:text-xl uppercase tracking-tighter flex items-center gap-2">
                                        ${prettyDate}
                                    </h3>
                                    <p class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mt-1">Scheduled for Sec ${exam.section}</p>
                                </div>
                                <span class="${typeColor} text-[10px] font-black uppercase px-4 py-2 rounded-xl tracking-widest shadow-sm self-start sm:self-auto">${exam.type}</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${subsHtml}
                            </div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;

            } catch(e) {
                console.error("Error fetching exams:", e);
                document.getElementById('exam-list').innerHTML = `
                    <div class="text-center py-10 bg-rose-50 rounded-2xl border-2 border-dashed border-rose-200">
                        <p class="text-rose-500 font-black uppercase text-sm tracking-widest">Error loading schedule.</p>
                        <p class="text-rose-400 font-bold text-[10px] uppercase tracking-widest mt-1">Please check your connection and refresh.</p>
                    </div>`;
            }
        }
    </script>
</body>
</html>
