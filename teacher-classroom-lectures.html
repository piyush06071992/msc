<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | AI Hub & Digital Notebook</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- KaTeX for Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        /* Notebook Specific Styles */
        .block-container:hover .block-controls { opacity: 1; }
        canvas.drawing-board { cursor: crosshair; touch-action: none; }
    </style>
</head>
<body class="pb-20 transition-all">

    <!-- ========================================== -->
    <!-- VIEW 1: DASHBOARD HUB (Default)          -->
    <!-- ========================================== -->
    <div id="hub-view" class="block">
        <header class="bg-indigo-950 text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='teacher-portal.html'" class="bg-white/10 p-2 rounded-lg hover:bg-white/20 transition-colors">🔙</button>
                <h1 class="font-black text-xl uppercase tracking-tighter">AI Lecture Hub</h1>
            </div>
            <div id="classroom-key-display" class="bg-amber-400 text-amber-900 px-4 py-2 rounded-xl font-black text-sm shadow-lg animate-pulse hidden">
                KEY: <span id="active-key-val">------</span>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-4 sm:p-8 space-y-8">
            
            <!-- MASTER CONTROLS -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="toggleNotebook()" class="bg-gradient-to-br from-emerald-600 to-teal-800 text-white p-6 rounded-[2rem] shadow-lg flex flex-col items-center justify-center text-center border-b-4 border-emerald-900 hover:scale-[1.02] transition-transform">
                    <span class="text-3xl mb-2">📓</span>
                    <h2 class="font-black text-lg uppercase tracking-widest leading-tight">Open Manual<br>Notebook</h2>
                </button>
                <div class="bg-white rounded-[2rem] p-6 border border-slate-200 shadow-sm flex flex-col justify-center">
                    <h2 class="font-black text-slate-900 text-lg uppercase mb-1">Smartboard Link</h2>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Launch files in class</p>
                    <button onclick="generateClassroomKey()" class="w-full bg-amber-500 text-amber-950 py-3 rounded-xl font-black text-xs uppercase tracking-widest shadow-md hover:bg-amber-400 transition-colors">🔑 Generate Magic Key</button>
                </div>
            </div>

            <!-- STEP 1: PROMPT GENERATOR -->
            <section class="bg-white rounded-[2.5rem] p-6 sm:p-8 border border-slate-200 shadow-sm">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-12 bg-indigo-100 rounded-2xl flex items-center justify-center text-2xl">✨</div>
                    <div>
                        <h2 class="font-black text-slate-900 text-lg uppercase">AI Prompt Architect</h2>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Generate master code for Gemini</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <textarea id="lecture-topic" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-indigo-500" placeholder="Describe the topic (e.g. Integration by parts)"></textarea>
                    <button onclick="generateAIPrompt()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg hover:bg-indigo-500 transition-all">🚀 Generate Prompt</button>
                </div>
                <div id="prompt-output-area" class="hidden mt-6 bg-slate-900 rounded-2xl p-5 relative">
                    <div id="ai-prompt-text" class="text-slate-300 text-xs font-mono leading-relaxed max-h-40 overflow-y-auto custom-scroll mb-4 whitespace-pre-wrap"></div>
                    <button onclick="copyPrompt()" class="w-full bg-indigo-400/20 text-indigo-200 border border-indigo-400/30 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest">📋 Copy to Clipboard</button>
                </div>
            </section>

            <!-- STEP 2: LECTURE UPLOADER -->
            <section class="bg-white rounded-[2.5rem] p-6 sm:p-8 border border-slate-200 shadow-sm">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-12 bg-slate-100 rounded-2xl flex items-center justify-center text-2xl">📁</div>
                    <div>
                        <h2 class="font-black text-slate-900 text-lg uppercase">Save AI Lecture</h2>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Paste Gemini's code here</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <input type="text" id="lec-title" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none" placeholder="Lecture Title">
                    <textarea id="lec-html" rows="4" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-[10px] font-mono outline-none" placeholder="Paste <html> code here..."></textarea>
                    <button onclick="saveLecture()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl hover:bg-slate-800 transition-all">💾 Save AI Lecture to Vault</button>
                </div>
            </section>

            <!-- VAULT LIST -->
            <section class="bg-indigo-50/50 rounded-[2.5rem] p-6 sm:p-8 border border-indigo-100">
                <h2 class="font-black text-indigo-950 text-lg uppercase tracking-tighter mb-6">Your Classroom Vault</h2>
                <div id="lecture-list" class="space-y-3">
                    <div class="text-center py-10 text-slate-400 font-bold text-xs uppercase tracking-widest">Loading vault...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: FULLSCREEN NOTEBOOK (Hidden)     -->
    <!-- ========================================== -->
    <div id="notebook-view" class="hidden fixed inset-0 z-50 bg-white flex h-screen text-slate-800">
        
        <!-- SIDEBAR -->
        <aside class="w-64 sm:w-72 bg-slate-900 text-white flex flex-col h-full shadow-2xl z-20 flex-shrink-0">
            <div class="p-5 border-b border-slate-800">
                <button onclick="toggleNotebook()" class="text-slate-400 hover:text-white mb-4 text-xs font-bold uppercase tracking-widest flex items-center gap-2">
                    <span>🔙</span> Back to Hub
                </button>
                <h1 class="font-black text-xl uppercase tracking-tighter text-emerald-400">Minerva Notes</h1>
            </div>
            <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-6">
                <!-- SECTIONS -->
                <div>
                    <div class="flex justify-between items-center mb-3 text-slate-400 px-2">
                        <span class="text-xs font-black uppercase tracking-widest">Sections</span>
                        <button class="hover:text-white font-black">+</button>
                    </div>
                    <ul class="space-y-1">
                        <li class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm cursor-pointer shadow-md">Mathematics</li>
                        <li class="hover:bg-slate-800 text-slate-300 px-4 py-2.5 rounded-xl font-bold text-sm cursor-pointer transition-colors">Physics</li>
                    </ul>
                </div>
                <!-- PAGES -->
                <div>
                    <div class="flex justify-between items-center mb-3 text-slate-400 px-2">
                        <span class="text-xs font-black uppercase tracking-widest">Pages</span>
                        <button onclick="addNotebookPage()" class="hover:text-white font-black bg-slate-800 w-6 h-6 rounded-full flex items-center justify-center pb-0.5">+</button>
                    </div>
                    <ul id="page-list" class="space-y-1 pl-2 border-l-2 border-slate-800 ml-3">
                        <li class="text-emerald-400 font-bold text-sm py-1.5 cursor-pointer flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>New Worksheet 1</li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- MAIN WORKSPACE -->
        <main class="flex-1 flex flex-col h-full bg-slate-50 relative">
            <!-- TOP TOOLBAR -->
            <header class="bg-white border-b border-slate-200 p-4 px-6 sm:px-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 shadow-sm z-10">
                <input type="text" id="notebook-page-title" value="New Worksheet 1" class="text-2xl font-black text-slate-900 outline-none w-full sm:w-1/3 uppercase tracking-tight bg-transparent" placeholder="Page Title...">
                
                <div class="flex flex-wrap items-center gap-2">
                    <div class="flex gap-1 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
                        <button onclick="addTextBlock()" class="px-3 py-2 hover:bg-white rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:text-indigo-600 shadow-sm">📝 Text/Math</button>
                        <button onclick="addCanvasBlock()" class="px-3 py-2 hover:bg-white rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:text-rose-600 shadow-sm">🖌️ Draw</button>
                        <button onclick="addImageBlock()" class="px-3 py-2 hover:bg-white rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:text-emerald-600 shadow-sm">🖼️ Image</button>
                    </div>
                    <button id="save-notebook-btn" onclick="saveNotebookToVault()" class="bg-slate-900 hover:bg-emerald-600 text-white px-5 py-2.5 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-colors shadow-md">
                        💾 Compile & Save to Vault
                    </button>
                </div>
            </header>

            <!-- BLOCK AREA -->
            <div id="workspace" class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-8 pb-32 space-y-6">
                <!-- Blocks injected here -->
                <div class="block-container relative group bg-white border border-slate-200 rounded-3xl p-6 transition-all hover:border-indigo-300 hover:shadow-md">
                    <div class="block-controls absolute -top-3 -right-3 opacity-0 transition-opacity flex gap-1 bg-slate-800 p-1 rounded-xl shadow-xl z-50">
                        <button onclick="this.closest('.block-container').remove()" class="w-8 h-8 flex items-center justify-center text-white hover:bg-rose-500 rounded-lg text-xs" title="Delete">🗑️</button>
                    </div>
                    <textarea rows="2" class="w-full bg-transparent outline-none resize-none font-bold text-slate-700" placeholder="Type notes or $$ LaTeX $$ here..."></textarea>
                </div>
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- SCRIPTS                                  -->
    <!-- ========================================== -->
    <script>
        // --- 1. FIREBASE & CORE LOGIC ---
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
        let myLectures = [];

        window.onload = () => {
            if(!activeStaff) window.location.replace('staff-login.html');
            fetchLectures();
        };

        // View Toggler
        function toggleNotebook() {
            document.getElementById('hub-view').classList.toggle('hidden');
            document.getElementById('notebook-view').classList.toggle('hidden');
            document.body.classList.toggle('overflow-hidden');
        }

        // --- 2. DASHBOARD HUB LOGIC ---
        function generateAIPrompt() {
            const topic = document.getElementById('lecture-topic').value;
            if(!topic) return alert("Enter a topic first!");
            const dept = activeStaff.dept || "General Faculty";
            const prompt = `Act as a Senior ${dept} Faculty at Minerva Study Circle. Create a professional, interactive HTML-based lecture slide for the topic: "${topic}".\n\nREQUIREMENTS:\n1. Visuals: Use Tailwind CSS, dark mode (slate-950).\n2. Animations: Use GSAP.\n3. Math: Use KaTeX.\n4. Structure: Step-by-step reveal on mouse click. Provide COMPLETE HTML file code.`;
            document.getElementById('ai-prompt-text').innerText = prompt;
            document.getElementById('prompt-output-area').classList.remove('hidden');
        }

        function copyPrompt() {
            navigator.clipboard.writeText(document.getElementById('ai-prompt-text').innerText);
            alert("Prompt Copied! Paste this into Gemini.");
        }

        async function saveLecture() {
            const title = document.getElementById('lec-title').value;
            const html = document.getElementById('lec-html').value;
            if(!title || !html) return alert("Fill all fields!");
            try {
                await db.collection("classroom_lectures").add({ title, htmlCode: html, teacherEmail: activeStaff.email, teacherName: activeStaff.name, timestamp: Date.now() });
                alert("Lecture Saved!"); location.reload();
            } catch(e) { alert("Error saving."); }
        }

        async function fetchLectures() {
            const snap = await db.collection("classroom_lectures").where("teacherEmail", "==", activeStaff.email).orderBy("timestamp", "desc").get();
            myLectures = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const list = document.getElementById('lecture-list');
            if(myLectures.length === 0) return list.innerHTML = `<div class="bg-white/50 p-10 rounded-3xl border border-dashed border-slate-300 text-center text-slate-400 font-bold text-xs uppercase">No lectures in vault.</div>`;
            list.innerHTML = myLectures.map(l => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                    <div>
                        <h4 class="font-black text-slate-800 text-sm uppercase">${l.title}</h4>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${new Date(l.timestamp).toLocaleDateString()}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="previewLecture('${l.id}')" class="p-2 bg-indigo-50 text-indigo-600 rounded-lg">👁️</button>
                        <button onclick="deleteLecture('${l.id}')" class="p-2 bg-rose-50 text-rose-600 rounded-lg">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function generateClassroomKey() {
            const key = Math.floor(100000 + Math.random() * 900000).toString();
            try {
                await db.collection("classroom_keys").doc(key).set({ teacherEmail: activeStaff.email, createdAt: Date.now(), expiresAt: Date.now() + (30 * 60000) });
                document.getElementById('active-key-val').innerText = key;
                document.getElementById('classroom-key-display').classList.remove('hidden');
            } catch(e) { alert("Key generation failed."); }
        }

        function previewLecture(id) {
            const lec = myLectures.find(l => l.id === id);
            const win = window.open("", "_blank"); win.document.write(lec.htmlCode); win.document.close();
        }

        async function deleteLecture(id) {
            if(confirm("Delete permanently?")) { await db.collection("classroom_lectures").doc(id).delete(); fetchLectures(); }
        }

        // --- 3. NOTEBOOK BUILDER LOGIC ---
        const workspace = document.getElementById('workspace');

        function createBlock(html) {
            const div = document.createElement('div');
            div.className = "block-container relative group bg-white border border-slate-200 rounded-3xl p-6 transition-all shadow-sm mb-4";
            div.innerHTML = `<div class="block-controls absolute -top-3 -right-3 opacity-0 transition-opacity flex gap-1 bg-slate-800 p-1 rounded-xl shadow-xl z-50"><button onclick="this.closest('.block-container').remove()" class="w-8 h-8 flex items-center justify-center text-white hover:bg-rose-500 rounded-lg text-xs" title="Delete">🗑️</button></div>${html}`;
            workspace.appendChild(div);
            div.scrollIntoView({ behavior: "smooth", block: "end" });
            return div;
        }

        function addTextBlock() { createBlock(`<textarea rows="3" class="w-full bg-transparent outline-none resize-none font-bold text-slate-700" placeholder="Enter text or $$ Math Equations $$..."></textarea>`); }
        
        function addImageBlock() { 
            createBlock(`
                <div class="flex flex-col items-center justify-center py-6 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 cursor-pointer" onclick="this.querySelector('input').click()">
                    <span class="text-2xl mb-1">📸</span><span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Click to upload image</span>
                    <input type="file" class="hidden" accept="image/*" onchange="handleImage(this)">
                </div>
            `); 
        }

        function handleImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { input.parentElement.innerHTML = `<img src="${e.target.result}" class="max-w-full h-auto rounded-xl">`; };
                reader.readAsDataURL(file);
            }
        }

        function addCanvasBlock() {
            const block = createBlock(`
                <div class="flex justify-between items-center mb-2"><span class="text-[10px] font-black uppercase tracking-widest text-emerald-600">Drawing Board</span><button onclick="clearSpecificCanvas(this)" class="text-[10px] bg-slate-100 px-2 py-1 rounded font-bold">Clear</button></div>
                <canvas class="drawing-board w-full h-64 bg-slate-50 rounded-xl border border-slate-200"></canvas>
            `);
            initCanvas(block.querySelector('canvas'));
        }

        function initCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
            canvas.ctx = ctx; let drawing = false;

            const startPos = (e) => { drawing = true; const rect = canvas.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo((e.clientX || e.touches[0].clientX) - rect.left, (e.clientY || e.touches[0].clientY) - rect.top); };
            const drawPos = (e) => { if (!drawing) return; e.preventDefault(); const rect = canvas.getBoundingClientRect(); ctx.lineTo((e.clientX || e.touches[0].clientX) - rect.left, (e.clientY || e.touches[0].clientY) - rect.top); ctx.stroke(); };
            const stopPos = () => drawing = false;

            canvas.addEventListener('mousedown', startPos); canvas.addEventListener('mousemove', drawPos); canvas.addEventListener('mouseup', stopPos);
            canvas.addEventListener('touchstart', startPos); canvas.addEventListener('touchmove', drawPos); canvas.addEventListener('touchend', stopPos);
        }

        function clearSpecificCanvas(btn) { const canvas = btn.closest('.block-container').querySelector('canvas'); canvas.ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function addNotebookPage() {
            const list = document.getElementById('page-list');
            const li = document.createElement('li');
            li.className = "text-slate-400 hover:text-slate-200 font-medium text-sm py-1.5 cursor-pointer";
            li.innerText = `New Worksheet ${list.children.length + 1}`;
            list.appendChild(li);
        }

        // Live KaTeX Render on Typing Finish
        workspace.addEventListener('focusout', (e) => {
            if(e.target.tagName === 'TEXTAREA') renderMathInElement(e.target.parentElement, { delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false} ] });
        });

        // --- 4. NOTEBOOK HTML COMPILER ---
        async function saveNotebookToVault() {
            const title = document.getElementById('notebook-page-title').value || "Untitled Note";
            const btn = document.getElementById('save-notebook-btn');
            btn.innerText = "Compiling..."; btn.disabled = true;

            let compiledHTML = `<div class="max-w-5xl mx-auto p-10 space-y-8 text-slate-800"><h1 class="text-5xl font-black mb-10 uppercase tracking-tighter border-b-4 border-emerald-500 pb-4">${title}</h1>`;
            
            document.querySelectorAll('#workspace .block-container').forEach(block => {
                const textarea = block.querySelector('textarea');
                const img = block.querySelector('img');
                const canvas = block.querySelector('canvas');
                
                compiledHTML += `<div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-200 mb-8">`;
                if(textarea) compiledHTML += `<div class="text-2xl font-semibold leading-relaxed whitespace-pre-wrap">${textarea.value}</div>`;
                else if (img) compiledHTML += `<img src="${img.src}" class="w-full rounded-2xl shadow-sm">`;
                else if (canvas) compiledHTML += `<img src="${canvas.toDataURL()}" class="w-full border border-slate-200 rounded-2xl shadow-sm">`;
                compiledHTML += `</div>`;
            });
            compiledHTML += `</div>`;
            
            // Smartboard Boilerplate Wrapper
            const fullPageHTML = `<!DOCTYPE html><html><head><title>${title}</title><script src="https://cdn.tailwindcss.com"><\/script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script><style>body{background:#f8fafc; font-family:sans-serif;}</style></head><body onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]})">${compiledHTML}</body></html>`;
            
            try {
                await db.collection("classroom_lectures").add({ title: "📓 " + title, htmlCode: fullPageHTML, teacherEmail: activeStaff.email, teacherName: activeStaff.name, timestamp: Date.now() });
                alert("Notebook Compiled & Saved to Vault!");
                fetchLectures();
                toggleNotebook(); // Go back to hub to see it
            } catch(e) { alert("Error saving."); }
            finally { btn.innerText = "💾 Compile & Save to Vault"; btn.disabled = false; }
        }
    </script>
</body>
</html>
