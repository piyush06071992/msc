<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Classroom Notes Hub</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        * { -webkit-tap-highlight-color: transparent; outline: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .a4-page {
            width: 794px; height: 1123px; 
            background-color: var(--page-bg, #ffffff);
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            flex-shrink: 0;
            user-select: none;
        }

        .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.05; z-index: 1; }
        .watermark span { font-size: 5rem; font-weight: 900; transform: rotate(-45deg); white-space: nowrap; color: #000; }

        .bg-style-ruled { background-image: repeating-linear-gradient(transparent, transparent 30px, rgba(0,0,0,0.1) 30px, rgba(0,0,0,0.1) 31px); }
        .bg-style-grid { background-image: linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px); background-size: 30px 30px; }
        
        .dom-layer { position: absolute; inset: 0; z-index: 10; }
        .canvas-layer { position: absolute; inset: 0; z-index: 20; touch-action: none; }
        
        /* Fixed Button Highlighting */
        .tool-btn.active { background-color: #4f46e5 !important; color: white !important; }
    </style>
</head>
<body class="pb-20">

    <div id="hub-view" class="block">
        <header class="bg-indigo-950 text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='teacher-portal.html'" class="bg-white/10 p-2 rounded-lg">🔙</button>
                <h1 class="font-black text-xl uppercase tracking-tighter">Classroom Notes Hub</h1>
            </div>
            <div id="classroom-key-display" class="bg-amber-400 text-amber-900 px-4 py-2 rounded-xl font-black text-sm hidden">
                KEY: <span id="active-key-val">------</span>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-8 space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center text-3xl mb-6">📓</div>
                        <h2 class="font-black text-2xl uppercase mb-2">Digital Notebook</h2>
                        <p class="text-slate-500 mb-6"> stylus-optimized continuous A4 scroll.</p>
                    </div>
                    <button onclick="toggleNotebook()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-sm shadow-lg hover:bg-emerald-600 transition-all">Open Notebook Editor ➡️</button>
                </div>

                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-200 shadow-sm space-y-6">
                    <h2 class="font-black text-2xl uppercase">AI Lecture Builder</h2>
                    <div class="space-y-4">
                        <input type="text" id="lecture-topic" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold" placeholder="Topic name...">
                        <button onclick="generateAIPrompt()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-black uppercase text-xs">Generate Prompt</button>
                        <div id="prompt-output-area" class="hidden bg-slate-100 p-3 rounded-xl">
                            <p id="ai-prompt-text" class="text-[10px] font-mono text-slate-600 mb-2"></p>
                            <button onclick="copyPrompt()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-[10px] font-black uppercase">Copy</button>
                        </div>
                    </div>
                    <div class="pt-4 border-t border-slate-100 space-y-4">
                        <input type="text" id="lec-title" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold" placeholder="Final Title">
                        <textarea id="lec-html" rows="2" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-mono text-xs" placeholder="Paste HTML..."></textarea>
                        <button onclick="saveLecture()" class="w-full bg-indigo-950 text-white py-3 rounded-xl font-black uppercase text-xs">Save to Vault</button>
                    </div>
                </div>
            </div>

            <section class="bg-indigo-50/50 rounded-[2.5rem] p-8 border border-indigo-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-black text-xl uppercase tracking-tighter">Classroom Vault</h2>
                    <button onclick="generateClassroomKey()" class="bg-amber-500 text-amber-950 px-5 py-2 rounded-xl font-black text-xs uppercase">🔑 Magic Key</button>
                </div>
                <div id="lecture-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>
        </main>
    </div>

    <div id="notebook-view" class="hidden fixed inset-0 z-50 bg-slate-200 flex h-screen overflow-hidden">
        <aside class="w-72 bg-slate-900 text-white flex flex-col h-full flex-shrink-0 z-20">
            <div class="p-5 border-b border-slate-800">
                <button onclick="toggleNotebook()" class="text-slate-400 hover:text-white mb-6 text-[10px] font-black uppercase">🔙 Hub</button>
                <select id="notebook-selector" onchange="switchNotebook(this.value)" class="w-full bg-slate-800 text-emerald-400 font-black p-2 rounded outline-none border border-slate-700"></select>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-6">
                <div>
                    <div class="flex justify-between items-center mb-3 text-slate-400 px-2 uppercase text-xs font-black">Sections <button onclick="createSection()">+</button></div>
                    <ul id="section-list" class="space-y-1"></ul>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative">
            <header class="bg-white border-b border-slate-200 p-2 px-4 flex flex-col gap-2 z-30">
                <div class="flex items-center gap-2">
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                        <button onclick="setTool('pen')" id="btn-pen" class="tool-btn active px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">✏️ Pen</button>
                        <button onclick="setTool('eraser')" id="btn-eraser" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">🧽 Erase</button>
                        <button onclick="setTool('text')" id="btn-text" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">📝 Text</button>
                        <button onclick="setTool('image')" id="btn-image" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">🖼️ Img</button>
                    </div>
                    
                    <div class="flex items-center gap-2 ml-4">
                        <div class="relative w-10 h-10 rounded-full border-2 border-slate-200 overflow-hidden shadow-sm">
                            <input type="color" id="color-picker" onchange="updateMasterColor(this.value)" class="absolute -top-2 -left-2 w-16 h-16 cursor-pointer border-none p-0 bg-transparent">
                        </div>
                        <span class="text-[10px] font-black uppercase text-slate-400">Pen Color</span>
                    </div>

                    <button onclick="saveA4NotebookToVault()" class="ml-auto bg-slate-900 text-white px-6 py-2 rounded-xl font-black text-xs uppercase">💾 Save Section</button>
                </div>
                <div class="flex items-center gap-4 bg-slate-50 p-2 rounded-lg text-[10px] font-bold text-slate-500">
                    <label>Pen Size:</label><input type="range" id="pen-size" min="1" max="15" value="3">
                    <label>Paper:</label>
                    <select onchange="setPageColor(this.value)" class="bg-white border rounded"><option value="#ffffff">White</option><option value="#fef9c3">Yellow</option><option value="#0f172a">Dark</option></select>
                    <select onchange="setPageStyle(this.value)" class="bg-white border rounded"><option value="bg-style-plain">Plain</option><option value="bg-style-ruled">Ruled</option><option value="bg-style-grid">Grid</option></select>
                </div>
            </header>

            <div id="a4-workspace" class="flex-1 overflow-y-auto custom-scroll p-10 flex flex-col items-center">
                <div id="pages-container" class="flex flex-col items-center"></div>
                <button onclick="addA4Page()" class="my-10 w-[794px] py-6 border-2 border-dashed border-slate-400 text-slate-400 rounded-2xl font-black uppercase hover:bg-white">+ Add Page</button>
            </div>
        </main>
    </div>

    <input type="file" id="image-upload" accept="image/*" class="hidden">

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff')) || { email: 'piyush@minerva.com', name: 'Piyush Rana' };
        let appData = { activeNotebookId: 'nb1', notebooks: [{ id: 'nb1', name: `Math Master`, sections: [{ id: 's1', name: 'Unit 1', pages: [] }] }] };
        let activeSec = 's1';
        let activeTool = 'pen';
        let activeColor = '#0f172a';
        let pageBgStyle = 'bg-style-plain';

        window.onload = () => { fetchLectures(); initNotebookUI(); };

        function toggleNotebook() {
            document.getElementById('hub-view').classList.toggle('hidden');
            document.getElementById('hub-view').classList.toggle('block');
            document.getElementById('notebook-view').classList.toggle('hidden');
            if (!document.getElementById('notebook-view').classList.contains('hidden') && getActiveSec().pages.length === 0) addA4Page();
        }

        // --- HUB ---
        async function fetchLectures() {
            const snap = await db.collection("classroom_lectures").where("teacherEmail", "==", activeStaff.email).orderBy("timestamp", "desc").get();
            document.getElementById('lecture-list').innerHTML = snap.docs.map(d => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center"><span class="font-bold text-xs uppercase">${d.data().title}</span><button onclick="previewL('${d.id}')" class="text-indigo-600">👁️</button></div>
            `).join('');
        }
        function generateAIPrompt() { 
            const t = document.getElementById('lecture-topic').value;
            document.getElementById('ai-prompt-text').innerText = `Senior Math Prompt for: ${t}`;
            document.getElementById('prompt-output-area').classList.remove('hidden');
        }
        function copyPrompt() { navigator.clipboard.writeText(document.getElementById('ai-prompt-text').innerText); alert("Copied"); }

        // --- NOTEBOOK TOOL LOGIC ---
        function setTool(t) {
            activeTool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + t).classList.add('active');
        }
        
        function updateMasterColor(c) { 
            activeColor = c; 
            // In case we're in text mode, new text uses this color
        }

        function setPageColor(c) { document.documentElement.style.setProperty('--page-bg', c); }
        function setPageStyle(s) { 
            pageBgStyle = s; 
            document.querySelectorAll('.a4-page').forEach(p => { p.className = `a4-page ${s}`; });
        }

        function addA4Page() {
            const wrap = document.getElementById('wrap-' + activeSec) || document.getElementById('pages-container');
            const pid = 'p' + Date.now();
            getActiveSec().pages.push({ id: pid });
            const p = document.createElement('div');
            p.className = `a4-page ${pageBgStyle}`; p.id = pid;
            p.innerHTML = `<div class="watermark"><span>Minerva</span></div><div class="dom-layer" onclick="handleDomClick(event, this)"></div><canvas class="canvas-layer"></canvas>`;
            wrap.appendChild(p);
            initCanvas(p.querySelector('canvas'));
        }

        // --- FIX: IMAGE UPLOAD & TEXT ---
        function handleDomClick(e, dom) {
            if (activeTool !== 'text' && activeTool !== 'image') return;
            
            const rect = dom.getBoundingClientRect();
            const scale = 794 / rect.width;
            const x = (e.clientX - rect.left) * scale;
            const y = (e.clientY - rect.top) * scale;

            if (activeTool === 'text') {
                const t = document.createElement('div');
                t.contentEditable = true; t.className = "absolute font-bold p-2 z-50 text-2xl outline-none min-w-[50px]";
                t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.color = activeColor;
                dom.appendChild(t); t.focus();
                t.onblur = () => renderMathInElement(t, { delimiters: [{left: '$$', right: '$$', display: true}] });
            } else if (activeTool === 'image') {
                const input = document.getElementById('image-upload');
                input.value = ""; // CRITICAL FIX: Reset so same image can be picked
                input.onchange = (evt) => {
                    const f = evt.target.files[0];
                    if(!f) return;
                    const r = new FileReader();
                    r.onload = (ev) => {
                        const img = document.createElement('img'); img.src = ev.target.result;
                        img.className = "absolute max-w-[50%] z-40 rounded shadow-md";
                        img.style.left = x + 'px'; img.style.top = y + 'px';
                        dom.appendChild(img);
                    };
                    r.readAsDataURL(f);
                };
                input.click(); // Open file browser
            }
        }

        // --- FIX: CANVAS ENGINE ---
        function initCanvas(canvas) {
            const ctx = canvas.getContext('2d', { desynchronized: true });
            canvas.width = 794; canvas.height = 1123;
            let drawing = false; let lx = 0; let ly = 0;

            const getC = (e) => {
                const r = canvas.getBoundingClientRect();
                const sx = 794 / r.width; const sy = 1123 / r.height;
                const cx = (e.clientX || (e.touches ? e.touches[0].clientX : 0));
                const cy = (e.clientY || (e.touches ? e.touches[0].clientY : 0));
                return { x: (cx - r.left) * sx, y: (cy - r.top) * sy };
            };

            canvas.addEventListener('pointerdown', (e) => {
                if(activeTool === 'text' || activeTool === 'image') return;
                drawing = true; const {x,y} = getC(e); lx = x; ly = y;
                canvas.setPointerCapture(e.pointerId);
            });
            
            canvas.addEventListener('pointermove', (e) => {
                if(!drawing) return;
                const {x,y} = getC(e);
                const size = document.getElementById('pen-size').value;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.lineWidth = activeTool === 'eraser' ? size * 15 : size * 2;
                ctx.strokeStyle = activeColor;
                ctx.globalCompositeOperation = activeTool === 'eraser' ? 'destination-out' : 'source-over';
                ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
                lx = x; ly = y;
            });
            canvas.addEventListener('pointerup', () => drawing = false);
        }

        // --- HIERARCHY HELPERS ---
        function getActiveSec() { return appData.notebooks[0].sections.find(s => s.id === activeSec); }
        function initNotebookUI() {
            document.getElementById('notebook-selector').innerHTML = `<option value="nb1">${appData.notebooks[0].name}</option>`;
            renderSections();
        }
        function renderSections() {
            document.getElementById('section-list').innerHTML = appData.notebooks[0].sections.map(s => `
                <li class="p-3 rounded-xl cursor-pointer font-bold text-xs uppercase ${s.id === activeSec ? 'bg-emerald-600 text-white' : 'text-slate-400'}" onclick="setActiveSection('${s.id}')">${s.name}</li>
            `).join('');
        }
        function setActiveSection(id) { activeSec = id; renderSections(); }
    </script>
</body>
</html>
