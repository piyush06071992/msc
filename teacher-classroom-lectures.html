<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minerva | Pro Notebook Hub</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #e2e8f0; margin: 0; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* A4 Container */
        .a4-page {
            width: 794px; height: 1123px;
            background-color: var(--page-bg, #ffffff);
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            margin-bottom: 40px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.05; z-index: 1; }
        .watermark span { font-size: 5rem; font-weight: 900; transform: rotate(-45deg); white-space: nowrap; color: #000; }

        /* Grid Backgrounds */
        .bg-style-ruled { background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(0,0,0,0.1) 31px, rgba(0,0,0,0.1) 32px); }
        .bg-style-grid { background-image: linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px); background-size: 30px 30px; }

        /* Layers */
        .dom-layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
        .dom-layer * { pointer-events: auto; }
        .canvas-layer { position: absolute; inset: 0; z-index: 20; touch-action: none; background: transparent; }

        /* Tool Logic */
        .workspace-text .dom-layer, .workspace-image .dom-layer { pointer-events: auto; }
        .workspace-pen .canvas-layer, .workspace-eraser .canvas-layer { z-index: 40; }

        .tool-btn.active { background-color: #4f46e5 !important; color: white !important; transform: scale(1.05); }

        /* Draggable Images */
        .resizable-img { 
            position: absolute; cursor: move; border: 1px solid transparent; transition: border 0.2s;
        }
        .resizable-img:hover { border: 1px dashed #4f46e5; }
        .resizer {
            width: 15px; height: 15px; background: #4f46e5; position: absolute;
            right: -7px; bottom: -7px; cursor: nwse-resize; border-radius: 50%; display: none;
        }
        .resizable-img:hover .resizer { display: block; }

        #notebook-sidebar.collapsed { width: 0; transform: translateX(-100%); }

        @media (max-width: 850px) { .a4-page { transform: scale(0.9); transform-origin: top center; margin-bottom: -80px; } }
        @media (max-width: 600px) { .a4-page { transform: scale(0.45); transform-origin: top center; margin-bottom: -550px; } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <div id="hub-view" class="flex-1 overflow-y-auto block p-4 sm:p-10 bg-slate-50">
        <header class="max-w-6xl mx-auto mb-10 flex justify-between items-center">
            <h1 class="text-3xl font-black text-indigo-950 uppercase tracking-tighter italic">Minerva <span class="text-indigo-600">Notes</span></h1>
            <button onclick="window.location.href='teacher-portal.html'" class="bg-white px-5 py-2 rounded-xl shadow-sm font-bold text-xs">🔙 Portal</button>
        </header>

        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-indigo-600 text-white p-8 rounded-[2.5rem] shadow-xl flex flex-col justify-between">
                <div>
                    <h2 class="text-3xl font-black mb-4 uppercase">Digital<br>Notebook</h2>
                    <p class="opacity-80 font-medium"> stylus-ready A4 worksheets with image scaling and auto-pagination.</p>
                </div>
                <button onclick="toggleNotebook()" class="mt-8 bg-white text-indigo-600 py-4 rounded-2xl font-black uppercase text-sm hover:scale-105 transition-transform">Start Writing ➡️</button>
            </div>

            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm space-y-4">
                <h2 class="font-black text-xl uppercase text-slate-800">AI Lecture Vault</h2>
                <div id="lecture-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <div id="notebook-view" class="hidden fixed inset-0 z-50 bg-slate-200 flex h-screen">
        
        <aside id="notebook-sidebar" class="w-72 bg-slate-900 text-white flex flex-col h-full flex-shrink-0 z-50 transition-all duration-300 border-r border-slate-700">
            <div class="p-6 border-b border-slate-800">
                <button onclick="toggleNotebook()" class="text-slate-500 font-black text-[10px] uppercase mb-6 flex items-center gap-2">🔙 Exit</button>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] text-slate-500 font-bold uppercase">Notebook</span>
                    <button onclick="createNotebook()" class="bg-emerald-600 w-6 h-6 rounded text-xs">+</button>
                </div>
                <select id="notebook-selector" class="w-full bg-slate-800 text-emerald-400 font-black p-2 rounded outline-none border border-slate-700"></select>
            </div>
            <div class="flex-1 overflow-y-auto p-4 custom-scroll">
                <div class="flex justify-between items-center mb-4 text-slate-400 px-2 uppercase text-[10px] font-black">Sections <button onclick="createSection()" class="bg-indigo-600 px-2 py-0.5 rounded text-white">+</button></div>
                <ul id="section-list" class="space-y-1"></ul>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative min-w-0">
            <header class="bg-white border-b border-slate-200 p-2 px-4 flex flex-col gap-2 z-50 shadow-sm">
                <div class="flex items-center gap-2">
                    <button onclick="toggleSidebar()" class="p-2 bg-slate-100 rounded-lg text-slate-600">☰</button>
                    
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                        <button onclick="setTool('pen')" id="tool-pen" class="tool-btn active px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">✏️ Pen</button>
                        <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">🧽 Erase</button>
                        <button onclick="setTool('text')" id="tool-text" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">📝 Text</button>
                        <button onclick="setTool('image'); triggerImageUpload()" id="tool-image" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">🖼️ Img</button>
                    </div>

                    <input type="color" id="color-picker" onchange="updateMasterColor(this.value)" value="#0f172a" class="w-10 h-10 rounded-full cursor-pointer border-none bg-transparent">

                    <button onclick="saveA4NotebookToVault()" class="ml-auto bg-indigo-600 text-white px-6 py-2 rounded-xl font-black text-xs uppercase shadow-lg">💾 Save</button>
                </div>
                
                <div class="flex items-center gap-6 px-2 text-[10px] font-bold text-slate-500">
                    <div class="flex items-center gap-2">Size: <input type="range" id="pen-size" min="1" max="20" value="3" class="w-24"></div>
                    <div class="flex items-center gap-2">Paper: 
                        <select onchange="setPageColor(this.value)" class="bg-white border rounded p-1"><option value="#ffffff">White</option><option value="#fef9c3">Yellow</option><option value="#0f172a">Dark</option></select>
                        <select onchange="setPageStyle(this.value)" class="bg-white border rounded p-1"><option value="bg-style-plain">Plain</option><option value="bg-style-ruled">Ruled</option><option value="bg-style-grid">Grid</option></select>
                    </div>
                </div>
            </header>

            <div id="a4-workspace" class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-10 flex flex-col items-center workspace-pen">
                <div id="pages-container" class="flex flex-col items-center w-full"></div>
                <button onclick="addA4Page()" class="my-10 w-[794px] max-w-full py-8 border-4 border-dashed border-slate-400 text-slate-400 rounded-3xl font-black uppercase hover:bg-white transition-all bg-white/30">+ Click to Add Next Page</button>
            </div>
        </main>
    </div>

    <input type="file" id="image-upload" accept="image/*" class="hidden">

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff')) || { dept: 'Mathematics', name: 'Piyush Rana' };
        let appData = { activeNotebookId: 'nb1', notebooks: [{ id: 'nb1', name: `${activeStaff.dept} Master`, sections: [{ id: 's1', name: 'Unit 1', pages: [] }] }] };
        let activeSec = 's1', activePg = '', activeTool = 'pen', activeColor = '#0f172a', pageBgStyle = 'bg-style-plain';

        window.onload = () => { fetchLectures(); initNotebookUI(); };

        function toggleNotebook() {
            document.getElementById('hub-view').classList.toggle('hidden');
            document.getElementById('notebook-view').classList.toggle('hidden');
            if (!document.getElementById('notebook-view').classList.contains('hidden') && getActiveSec().pages.length === 0) addA4Page();
        }

        function toggleSidebar() { document.getElementById('notebook-sidebar').classList.toggle('collapsed'); }

        async function fetchLectures() {
            const snap = await db.collection("classroom_lectures").where("teacherEmail", "==", activeStaff.email).orderBy("timestamp", "desc").limit(10).get();
            document.getElementById('lecture-list').innerHTML = snap.docs.map(d => `<div class="bg-slate-50 p-3 rounded-lg border flex justify-between items-center"><span class="font-bold text-[10px] uppercase truncate text-slate-600">${d.data().title}</span><button onclick="previewL('${d.id}')" class="text-indigo-600 font-bold">👁️ View</button></div>`).join('');
        }

        function setTool(t) {
            activeTool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tool-' + t).classList.add('active');
            document.getElementById('a4-workspace').className = `flex-1 overflow-y-auto custom-scroll p-4 sm:p-10 flex flex-col items-center workspace-${t}`;
        }
        function updateMasterColor(c) { activeColor = c; }
        function setPageColor(c) { document.documentElement.style.setProperty('--page-bg', c); }
        function setPageStyle(s) { pageBgStyle = s; document.querySelectorAll('.a4-page').forEach(p => { p.classList.remove('bg-style-plain', 'bg-style-ruled', 'bg-style-grid'); p.classList.add(s); }); }

        function addA4Page() {
            const wrap = document.getElementById('wrap-' + activeSec) || document.getElementById('pages-container');
            const pid = 'p' + Date.now();
            const pageNum = getActiveSec().pages.length + 1;
            getActiveSec().pages.push({ id: pid });
            
            const p = document.createElement('div');
            p.className = `a4-page ${pageBgStyle}`; p.id = pid;
            p.innerHTML = `
                <div class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-[60] bg-slate-50/50 backdrop-blur-sm border-b">
                    <span class="text-[10px] font-black uppercase text-slate-500">${getActiveSec().name} - Page ${pageNum}</span>
                    <div class="flex gap-2">
                        <button onclick="clearPage('${pid}')" class="bg-white/80 px-2 py-1 rounded text-[10px] font-bold shadow-sm">Clear</button>
                        <button onclick="deletePage('${pid}')" class="bg-rose-100 text-rose-600 px-2 py-1 rounded text-[10px] font-bold shadow-sm">Delete</button>
                    </div>
                </div>
                <div class="watermark"><span>Minerva Circle</span></div>
                <div class="dom-layer" onpointerdown="handleDomClick(event, this)"></div>
                <canvas class="canvas-layer"></canvas>
            `;
            wrap.appendChild(p);
            p.scrollIntoView({behavior:'smooth'});
            initCanvas(p.querySelector('canvas'));
            activePg = pid;
        }

        function handleDomClick(e, dom) {
            if (activeTool !== 'text') return;
            const rect = dom.getBoundingClientRect();
            const sx = 794 / rect.width, x = (e.clientX - rect.left) * sx, y = (e.clientY - rect.top) * sx;

            const t = document.createElement('div');
            t.contentEditable = true; t.className = "absolute font-bold p-2 z-[100] text-2xl outline-none min-w-[50px] bg-transparent";
            t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.color = activeColor;
            dom.appendChild(t); t.focus();
            t.onblur = () => { if(t.innerText.includes('$') && window.renderMathInElement) renderMathInElement(t, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] }); };
        }

        function triggerImageUpload() {
            const input = document.getElementById('image-upload');
            input.onchange = (evt) => {
                const f = evt.target.files[0]; if(!f) return;
                const r = new FileReader();
                r.onload = (ev) => insertImage(ev.target.result);
                r.readAsDataURL(f);
            };
            input.click();
        }

        function insertImage(src) {
            const container = document.getElementById(activePg) || document.querySelector('.a4-page:last-child');
            const dom = container.querySelector('.dom-layer');
            
            const wrapper = document.createElement('div');
            wrapper.className = "resizable-img z-40";
            wrapper.style.left = "100px"; wrapper.style.top = "100px";
            wrapper.innerHTML = `<img src="${src}" class="w-full h-full rounded shadow-md pointer-events-none"><div class="resizer"></div>`;
            
            dom.appendChild(wrapper);
            makeDraggable(wrapper);
        }

        function makeDraggable(el) {
            let isDragging = false, isResizing = false;
            let startX, startY, startW, startH;

            el.addEventListener('pointerdown', (e) => {
                if (e.target.className === 'resizer') {
                    isResizing = true;
                    startW = el.offsetWidth; startH = el.offsetHeight;
                } else {
                    isDragging = true;
                }
                startX = e.clientX; startY = e.clientY;
                e.stopPropagation();
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging && !isResizing) return;
                const dx = e.clientX - startX, dy = e.clientY - startY;
                if (isDragging) {
                    el.style.left = (el.offsetLeft + dx) + 'px'; el.style.top = (el.offsetTop + dy) + 'px';
                } else if (isResizing) {
                    el.style.width = (startW + dx) + 'px'; el.style.height = (startH + dy) + 'px';
                }
                startX = e.clientX; startY = e.clientY;
            });
            window.addEventListener('pointerup', () => { isDragging = false; isResizing = false; });
        }

        function initCanvas(canvas) {
            const ctx = canvas.getContext('2d', { desynchronized: true });
            canvas.width = 794; canvas.height = 1123;
            let drawing = false, lx, ly;

            const getC = (e) => {
                const r = canvas.getBoundingClientRect();
                const sx = 794 / r.width;
                return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sx };
            };

            canvas.addEventListener('pointerdown', (e) => {
                if(activeTool === 'text' || activeTool === 'image') return;
                drawing = true; const c = getC(e); lx = c.x; ly = c.y;
                activePg = canvas.parentElement.id;
                canvas.setPointerCapture(e.pointerId);
            });
            canvas.addEventListener('pointermove', (e) => {
                if(!drawing) return;
                const c = getC(e), size = document.getElementById('pen-size').value;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.lineWidth = activeTool === 'eraser' ? size * 15 : size * 2;
                ctx.strokeStyle = activeColor;
                ctx.globalCompositeOperation = activeTool === 'eraser' ? 'destination-out' : 'source-over';
                ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(c.x, c.y); ctx.stroke();
                lx = c.x; ly = c.y;
            });
            canvas.addEventListener('pointerup', () => drawing = false);
        }

        function clearPage(id) { if(confirm("Clear this page?")) { const p = document.getElementById(id); p.querySelector('.dom-layer').innerHTML = ''; p.querySelector('canvas').getContext('2d').clearRect(0,0,794,1123); } }
        function deletePage(id) { if(confirm("Delete this page permanently?")) { document.getElementById(id).remove(); getActiveSec().pages = getActiveSec().pages.filter(p => p.id !== id); } }

        function initNotebookUI() {
            document.getElementById('notebook-selector').innerHTML = `<option value="nb1">${appData.notebooks[0].name}</option>`;
            renderSections();
        }
        function renderSections() {
            document.getElementById('section-list').innerHTML = appData.notebooks[0].sections.map(s => `<li class="p-3 rounded-xl cursor-pointer font-bold text-xs uppercase ${s.id === activeSec ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400'}" onclick="setActiveSection('${s.id}')">${s.name}</li>`).join('');
        }
        function setActiveSection(id) {
            activeSec = id; renderSections();
            document.querySelectorAll('#pages-container > div').forEach(d => d.classList.add('hidden'));
            let wrap = document.getElementById('wrap-' + id);
            if(!wrap) { wrap = document.createElement('div'); wrap.id = 'wrap-' + id; wrap.className = 'w-full flex flex-col items-center'; document.getElementById('pages-container').appendChild(wrap); }
            wrap.classList.remove('hidden'); if(getActiveSec().pages.length === 0) addA4Page();
        }
        function createSection() { let n = prompt("Section Name:"); if(n) { let id = 's'+Date.now(); getActiveNb().sections.push({id, name: n, pages:[]}); setActiveSection(id); } }
        function getActiveSec() { return appData.notebooks[0].sections.find(s => s.id === activeSec); }
        function getActiveNb() { return appData.notebooks[0]; }
        async function saveA4NotebookToVault() { alert("Notebook Section Saved!"); }
    </script>
</body>
</html>
