<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | AI Hub & Digital Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* A4 Page & Notebook Styles */
        .a4-page {
            width: 794px; /* Standard A4 Web Width */
            height: 1123px; /* Standard A4 Web Height */
            background-color: var(--page-bg, #ffffff);
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            flex-shrink: 0;
            transform-origin: top center;
        }
        
        /* Watermark */
        .watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0.05;
            z-index: 1;
        }
        .watermark span {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            transform: rotate(-45deg);
            white-space: nowrap;
            color: #000;
        }

        /* Background Styles */
        .bg-style-ruled { background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(0,0,0,0.1) 31px, rgba(0,0,0,0.1) 32px); }
        .bg-style-grid { background-image: linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px); background-size: 30px 30px; }
        
        .dom-layer { position: absolute; inset: 0; z-index: 10; }
        .canvas-layer { position: absolute; inset: 0; z-index: 20; touch-action: none; }
        
        /* Tool active states */
        .tool-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        .color-btn.active { transform: scale(1.2); border: 2px solid #000; }
        .bg-btn.active { border-color: #4f46e5; background-color: #e0e7ff; }
        
        /* Dynamic Cursor based on tool */
        .workspace-pen .canvas-layer { cursor: crosshair; pointer-events: auto; }
        .workspace-eraser .canvas-layer { cursor: cell; pointer-events: auto; }
        .workspace-text .canvas-layer { pointer-events: none; }
        .workspace-image .canvas-layer { pointer-events: none; }
        .workspace-shape .canvas-layer { cursor: crosshair; pointer-events: auto; }
        
        .workspace-text .dom-layer { cursor: text; }
        .workspace-image .dom-layer { cursor: copy; }

        @media (max-width: 850px) {
            .a4-page { transform: scale(0.8); margin-bottom: -200px; }
        }
        @media (max-width: 600px) {
            .a4-page { transform: scale(0.5); margin-bottom: -500px; }
        }
    </style>
</head>
<body class="pb-20 transition-all">

    <div id="hub-view" class="block">
        <header class="bg-indigo-950 text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='teacher-portal.html'" class="bg-white/10 p-2 rounded-lg hover:bg-white/20 transition-colors">🔙</button>
                <h1 class="font-black text-xl uppercase tracking-tighter">AI Lecture Hub</h1>
            </div>
            <div id="classroom-key-display" class="bg-amber-400 text-amber-900 px-4 py-2 rounded-xl font-black text-sm shadow-lg animate-pulse hidden">
                KEY: <span id="active-key-val">------</span>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-4 sm:p-8 space-y-8">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="toggleNotebook()" class="bg-gradient-to-br from-emerald-600 to-teal-800 text-white p-6 rounded-[2rem] shadow-lg flex flex-col items-center justify-center text-center border-b-4 border-emerald-900 hover:scale-[1.02] transition-transform">
                    <span class="text-3xl mb-2">📓</span>
                    <h2 class="font-black text-lg uppercase tracking-widest leading-tight">Open Manual<br>Notebook</h2>
                </button>
                <div class="bg-white rounded-[2rem] p-6 border border-slate-200 shadow-sm flex flex-col justify-center">
                    <h2 class="font-black text-slate-900 text-lg uppercase mb-1">Smartboard Link</h2>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Launch files in class</p>
                    <button onclick="generateClassroomKey()" class="w-full bg-amber-500 text-amber-950 py-3 rounded-xl font-black text-xs uppercase tracking-widest shadow-md hover:bg-amber-400 transition-colors">🔑 Generate Magic Key</button>
                </div>
            </div>

            <section class="bg-white rounded-[2.5rem] p-6 sm:p-8 border border-slate-200 shadow-sm">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-12 bg-indigo-100 rounded-2xl flex items-center justify-center text-2xl">✨</div>
                    <div>
                        <h2 class="font-black text-slate-900 text-lg uppercase">AI Prompt Architect</h2>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Generate master code for Gemini</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <textarea id="lecture-topic" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-indigo-500" placeholder="Describe the topic (e.g. Integration by parts)"></textarea>
                    <button onclick="generateAIPrompt()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg hover:bg-indigo-500 transition-all">🚀 Generate Prompt</button>
                </div>
                <div id="prompt-output-area" class="hidden mt-6 bg-slate-900 rounded-2xl p-5 relative">
                    <div id="ai-prompt-text" class="text-slate-300 text-xs font-mono leading-relaxed max-h-40 overflow-y-auto custom-scroll mb-4 whitespace-pre-wrap"></div>
                    <button onclick="copyPrompt()" class="w-full bg-indigo-400/20 text-indigo-200 border border-indigo-400/30 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest">📋 Copy to Clipboard</button>
                </div>
            </section>

            <section class="bg-white rounded-[2.5rem] p-6 sm:p-8 border border-slate-200 shadow-sm">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-12 bg-slate-100 rounded-2xl flex items-center justify-center text-2xl">📁</div>
                    <div>
                        <h2 class="font-black text-slate-900 text-lg uppercase">Save AI Lecture</h2>
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Paste Gemini's code here</p>
                    </div>
                </div>
                <div class="space-y-4">
                    <input type="text" id="lec-title" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none" placeholder="Lecture Title">
                    <textarea id="lec-html" rows="4" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-[10px] font-mono outline-none" placeholder="Paste <html> code here..."></textarea>
                    <button onclick="saveLecture()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl hover:bg-slate-800 transition-all">💾 Save AI Lecture to Vault</button>
                </div>
            </section>

            <section class="bg-indigo-50/50 rounded-[2.5rem] p-6 sm:p-8 border border-indigo-100">
                <h2 class="font-black text-indigo-950 text-lg uppercase tracking-tighter mb-6">Your Classroom Vault</h2>
                <div id="lecture-list" class="space-y-3">
                    <div class="text-center py-10 text-slate-400 font-bold text-xs uppercase tracking-widest">Loading vault...</div>
                </div>
            </section>
        </main>
    </div>

    <div id="notebook-view" class="hidden fixed inset-0 z-50 bg-slate-200 flex h-screen text-slate-800">
        
        <aside class="w-64 sm:w-72 bg-slate-900 text-white flex flex-col h-full shadow-2xl z-20 flex-shrink-0">
            <div class="p-5 border-b border-slate-800">
                <button onclick="toggleNotebook()" class="text-slate-400 hover:text-white mb-4 text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                    <span>🔙</span> Back to Hub
                </button>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Notebook</p>
                <h1 id="notebook-title" class="font-black text-xl uppercase tracking-tighter text-emerald-400 leading-tight">General Notebook</h1>
            </div>
            <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-6">
                <div>
                    <div class="flex justify-between items-center mb-3 text-slate-400 px-2">
                        <span class="text-xs font-black uppercase tracking-widest">Sections</span>
                        <button class="hover:text-white font-black">+</button>
                    </div>
                    <ul class="space-y-1">
                        <li class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm cursor-pointer shadow-md">Unit 1: Fundamentals</li>
                        <li class="hover:bg-slate-800 text-slate-300 px-4 py-2.5 rounded-xl font-bold text-sm cursor-pointer transition-colors">Unit 2: Advanced</li>
                    </ul>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative overflow-hidden">
            <header class="bg-white border-b border-slate-200 p-3 px-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-sm z-30 flex-shrink-0">
                <div class="flex items-center gap-3 w-full sm:w-auto overflow-x-auto custom-scroll pb-2 sm:pb-0">
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 shrink-0">
                        <button onclick="setTool('pen')" class="tool-btn active px-3 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-white border border-transparent text-slate-700">✏️ Pen</button>
                        <button onclick="setTool('eraser')" class="tool-btn px-3 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-transparent border border-transparent text-slate-700 hover:bg-white">🧽 Eraser</button>
                        <button onclick="setTool('text')" class="tool-btn px-3 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-transparent border border-transparent text-slate-700 hover:bg-white">📝 Text</button>
                        <button onclick="setTool('image')" class="tool-btn px-3 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-transparent border border-transparent text-slate-700 hover:bg-white">🖼️ Img</button>
                        <button onclick="setTool('shape')" class="tool-btn px-3 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-transparent border border-transparent text-slate-700 hover:bg-white">⬛ Shape</button>
                    </div>
                    
                    <div class="w-px h-8 bg-slate-300 mx-1 shrink-0"></div>
                    
                    <div class="flex gap-2 shrink-0 items-center">
                        <button onclick="setColor('#0f172a')" class="color-btn active w-6 h-6 rounded-full bg-slate-900 border-2 border-transparent transition-transform"></button>
                        <button onclick="setColor('#dc2626')" class="color-btn w-6 h-6 rounded-full bg-red-600 border-2 border-transparent transition-transform"></button>
                        <button onclick="setColor('#2563eb')" class="color-btn w-6 h-6 rounded-full bg-blue-600 border-2 border-transparent transition-transform"></button>
                        <button onclick="setColor('#16a34a')" class="color-btn w-6 h-6 rounded-full bg-green-600 border-2 border-transparent transition-transform"></button>
                        <input type="color" onchange="setColor(this.value)" class="w-6 h-6 rounded cursor-pointer border-0 p-0 shrink-0">
                    </div>

                    <div class="w-px h-8 bg-slate-300 mx-1 shrink-0"></div>

                    <div class="flex gap-1 shrink-0 items-center">
                        <select onchange="setPageColor(this.value)" class="text-xs font-bold bg-slate-100 border border-slate-200 rounded-lg px-2 py-1.5 outline-none cursor-pointer">
                            <option value="#ffffff">White Paper</option>
                            <option value="#fef9c3">Yellow Pad</option>
                            <option value="#0f172a">Dark Board</option>
                        </select>
                        <select onchange="setPageStyle(this.value)" class="text-xs font-bold bg-slate-100 border border-slate-200 rounded-lg px-2 py-1.5 outline-none cursor-pointer">
                            <option value="bg-style-plain">Plain</option>
                            <option value="bg-style-ruled">Ruled Lines</option>
                            <option value="bg-style-grid">Grid Math</option>
                        </select>
                    </div>
                </div>

                <button id="save-notebook-btn" onclick="saveA4NotebookToVault()" class="bg-slate-900 hover:bg-emerald-600 text-white px-5 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest transition-colors shadow-lg shrink-0">
                    💾 Save to Vault
                </button>
            </header>

            <div id="a4-workspace" class="flex-1 overflow-y-auto custom-scroll p-6 sm:p-10 flex flex-col items-center gap-10 workspace-pen">
                <button onclick="addA4Page()" class="bg-white border-2 border-dashed border-slate-400 text-slate-500 hover:text-indigo-600 hover:border-indigo-400 hover:bg-indigo-50 w-[794px] max-w-full py-6 rounded-2xl font-black uppercase tracking-widest transition-all">
                    + Add New A4 Page
                </button>
            </div>
            
            <input type="file" id="image-upload" accept="image/*" class="hidden">
        </main>
    </div>

    <script>
        // --- 1. FIREBASE & CORE LOGIC ---
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
        let myLectures = [];
        let pagesCount = 0;

        // Tool States
        let activeTool = 'pen'; // pen, eraser, text, image, shape
        let activeColor = '#0f172a';
        let pageBgColor = '#ffffff';
        let pageBgStyle = 'bg-style-plain';

        window.onload = () => {
            if(!activeStaff) { window.location.replace('staff-login.html'); return; }
            document.getElementById('notebook-title').innerText = (activeStaff.dept || "General") + " Notebook";
            fetchLectures();
        };

        function toggleNotebook() {
            const isOpening = document.getElementById('hub-view').classList.contains('block');
            document.getElementById('hub-view').classList.toggle('hidden');
            document.getElementById('hub-view').classList.toggle('block');
            document.getElementById('notebook-view').classList.toggle('hidden');
            document.body.classList.toggle('overflow-hidden');
            
            if (isOpening && pagesCount === 0) {
                addA4Page(); // Auto add first page
            }
        }

        // --- 2. DASHBOARD HUB LOGIC ---
        function generateAIPrompt() {
            const topic = document.getElementById('lecture-topic').value;
            if(!topic) return alert("Enter a topic first!");
            const prompt = `Act as a Senior ${activeStaff.dept || "Faculty"} at Minerva Study Circle. Create a professional, interactive HTML-based lecture slide for the topic: "${topic}".\n\nREQUIREMENTS:\n1. Visuals: Use Tailwind CSS, dark mode (slate-950).\n2. Animations: Use GSAP.\n3. Math: Use KaTeX.\n4. Structure: Step-by-step reveal on mouse click. Provide COMPLETE HTML file code.`;
            document.getElementById('ai-prompt-text').innerText = prompt;
            document.getElementById('prompt-output-area').classList.remove('hidden');
        }

        function copyPrompt() {
            navigator.clipboard.writeText(document.getElementById('ai-prompt-text').innerText);
            alert("Prompt Copied! Paste this into Gemini.");
        }

        async function saveLecture() {
            const title = document.getElementById('lec-title').value;
            const html = document.getElementById('lec-html').value;
            if(!title || !html) return alert("Fill all fields!");
            try {
                await db.collection("classroom_lectures").add({ title, htmlCode: html, teacherEmail: activeStaff.email, teacherName: activeStaff.name, timestamp: Date.now() });
                alert("Lecture Saved!"); location.reload();
            } catch(e) { alert("Error saving."); }
        }

        async function fetchLectures() {
            const snap = await db.collection("classroom_lectures").where("teacherEmail", "==", activeStaff.email).orderBy("timestamp", "desc").get();
            myLectures = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const list = document.getElementById('lecture-list');
            if(myLectures.length === 0) return list.innerHTML = `<div class="bg-white/50 p-10 rounded-3xl border border-dashed border-slate-300 text-center text-slate-400 font-bold text-xs uppercase">No lectures in vault.</div>`;
            list.innerHTML = myLectures.map(l => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                    <div><h4 class="font-black text-slate-800 text-sm uppercase">${l.title}</h4><p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${new Date(l.timestamp).toLocaleDateString()}</p></div>
                    <div class="flex gap-2"><button onclick="previewLecture('${l.id}')" class="p-2 bg-indigo-50 text-indigo-600 rounded-lg">👁️</button><button onclick="deleteLecture('${l.id}')" class="p-2 bg-rose-50 text-rose-600 rounded-lg">🗑️</button></div>
                </div>`).join('');
        }

        async function generateClassroomKey() {
            const key = Math.floor(100000 + Math.random() * 900000).toString();
            try {
                await db.collection("classroom_keys").doc(key).set({ teacherEmail: activeStaff.email, createdAt: Date.now(), expiresAt: Date.now() + (30 * 60000) });
                document.getElementById('active-key-val').innerText = key;
                document.getElementById('classroom-key-display').classList.remove('hidden');
            } catch(e) { alert("Key generation failed."); }
        }

        function previewLecture(id) {
            const lec = myLectures.find(l => l.id === id);
            const win = window.open("", "_blank"); win.document.write(lec.htmlCode); win.document.close();
        }

        async function deleteLecture(id) {
            if(confirm("Delete permanently?")) { await db.collection("classroom_lectures").doc(id).delete(); fetchLectures(); }
        }

        // --- 3. A4 NOTEBOOK ENGINE ---
        function setTool(toolName) {
            activeTool = toolName;
            document.querySelectorAll('.tool-btn').forEach(b => { b.classList.remove('active', 'bg-white', 'text-white', 'border-indigo-600'); b.style.backgroundColor = ''; });
            event.currentTarget.classList.add('active');
            event.currentTarget.style.backgroundColor = '#4f46e5';
            event.currentTarget.style.color = '#fff';
            
            const workspace = document.getElementById('a4-workspace');
            workspace.className = `flex-1 overflow-y-auto custom-scroll p-6 sm:p-10 flex flex-col items-center gap-10 workspace-${toolName}`;
        }

        function setColor(hex) {
            activeColor = hex;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            if(event && event.currentTarget.classList) event.currentTarget.classList.add('active');
            if(pageBgColor === '#0f172a' && activeColor === '#0f172a') activeColor = '#ffffff'; // Auto-invert black on dark mode
        }

        function setPageColor(hex) {
            pageBgColor = hex;
            document.documentElement.style.setProperty('--page-bg', hex);
            // Auto adjust text color
            const isDark = hex === '#0f172a';
            document.querySelectorAll('.dom-layer div[contenteditable]').forEach(div => {
                div.style.color = isDark ? '#f8fafc' : '#0f172a';
            });
        }

        function setPageStyle(styleClass) {
            pageBgStyle = styleClass;
            document.querySelectorAll('.a4-page').forEach(page => {
                page.className = `a4-page ${pageBgStyle}`;
            });
        }

        function addA4Page() {
            pagesCount++;
            const pageDiv = document.createElement('div');
            pageDiv.className = `a4-page ${pageBgStyle}`;
            pageDiv.id = `page-${pagesCount}`;
            
            pageDiv.innerHTML = `
                <div class="watermark"><span style="color: ${pageBgColor === '#0f172a' ? '#fff' : '#000'}">Minerva Study Circle</span></div>
                <div class="dom-layer" onclick="handleDomClick(event, this)"></div>
                <canvas class="canvas-layer"></canvas>
                <div class="absolute bottom-4 right-6 text-xs font-bold text-slate-400 z-30">Page ${pagesCount}</div>
            `;
            
            const btn = document.querySelector('#a4-workspace > button');
            document.getElementById('a4-workspace').insertBefore(pageDiv, btn);
            pageDiv.scrollIntoView({ behavior: 'smooth' });

            initCanvas(pageDiv.querySelector('canvas'));
        }

        // DOM Layer Interactions (Text, Image)
        function handleDomClick(e, domLayer) {
            if (activeTool === 'text') {
                const rect = domLayer.getBoundingClientRect();
                // Handle CSS scaling
                const scale = 794 / rect.width;
                const x = (e.clientX - rect.left) * scale;
                const y = (e.clientY - rect.top) * scale;

                const textDiv = document.createElement('div');
                textDiv.contentEditable = true;
                textDiv.className = "absolute font-bold outline-none border border-dashed border-indigo-400 p-2 cursor-text min-w-[100px] z-50 text-xl";
                textDiv.style.left = x + 'px';
                textDiv.style.top = y + 'px';
                textDiv.style.color = pageBgColor === '#0f172a' ? '#f8fafc' : '#0f172a';
                textDiv.innerHTML = "";
                
                domLayer.appendChild(textDiv);
                textDiv.focus();

                textDiv.addEventListener('blur', () => { 
                    textDiv.classList.remove('border', 'border-dashed', 'border-indigo-400'); 
                    renderMathInElement(textDiv, { delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false} ] });
                });
                textDiv.addEventListener('focus', () => { textDiv.classList.add('border', 'border-dashed', 'border-indigo-400'); });
                
                setTool('pen'); // Auto revert to pen
            } else if (activeTool === 'image') {
                const input = document.getElementById('image-upload');
                input.onchange = function(evt) {
                    const file = evt.target.files[0];
                    if(file) {
                        const reader = new FileReader();
                        reader.onload = function(re) {
                            const rect = domLayer.getBoundingClientRect();
                            const scale = 794 / rect.width;
                            const x = (e.clientX - rect.left) * scale;
                            const y = (e.clientY - rect.top) * scale;
                            
                            const img = document.createElement('img');
                            img.src = re.target.result;
                            img.className = "absolute max-w-[80%] rounded shadow-sm z-40";
                            img.style.left = x + 'px';
                            img.style.top = y + 'px';
                            domLayer.appendChild(img);
                        }
                        reader.readAsDataURL(file);
                    }
                    input.value = ''; // reset
                    setTool('pen');
                };
                input.click();
            }
        }

        // Canvas Drawing Engine with Pressure
        function initCanvas(canvas) {
            // High perf context
            const ctx = canvas.getContext('2d', { desynchronized: true });
            canvas.width = 794; canvas.height = 1123; // Fixed internal resolution
            canvas.ctx = ctx;
            
            let isDrawing = false;
            let lastX = 0; let lastY = 0;
            let shapeStartX = 0; let shapeStartY = 0;

            const getScaledCoords = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                // Handle touch or mouse
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const { x, y } = getScaledCoords(e);
                
                if (activeTool === 'shape') return; // Handled on pointerup

                // Hardware pressure sensitivity (fallback to 0.5 for mouse)
                let pressure = e.pressure !== undefined && e.pressure !== 0 ? e.pressure : 0.5;

                ctx.lineWidth = (activeTool === 'eraser' ? 30 : 3) * (pressure * 2);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = activeTool === 'eraser' ? 'rgba(0,0,0,1)' : activeColor;
                ctx.globalCompositeOperation = activeTool === 'eraser' ? 'destination-out' : 'source-over';

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();

                lastX = x; lastY = y;
            };

            canvas.addEventListener('pointerdown', (e) => {
                if (activeTool === 'text' || activeTool === 'image') return;
                isDrawing = true;
                const { x, y } = getScaledCoords(e);
                lastX = x; lastY = y;
                shapeStartX = x; shapeStartY = y;
                canvas.setPointerCapture(e.pointerId);
                draw(e);
            });
            canvas.addEventListener('pointermove', draw);
            canvas.addEventListener('pointerup', (e) => { 
                if(!isDrawing) return;
                isDrawing = false; 
                canvas.releasePointerCapture(e.pointerId); 
                
                if(activeTool === 'shape') {
                    const { x, y } = getScaledCoords(e);
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = activeColor;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(shapeStartX, shapeStartY, x - shapeStartX, y - shapeStartY);
                }
            });
            // Touch fallbacks to prevent scrolling while drawing
            canvas.addEventListener('touchstart', (e) => { if(activeTool !== 'text' && activeTool !== 'image') e.preventDefault(); }, {passive: false});
            canvas.addEventListener('touchmove', (e) => { if(activeTool !== 'text' && activeTool !== 'image') e.preventDefault(); }, {passive: false});
        }

        // --- 4. COMPILE TO VAULT ---
        async function saveA4NotebookToVault() {
            const sectionName = document.querySelector('#notebook-view aside ul li.bg-emerald-600')?.innerText || "General";
            const title = `📓 ${activeStaff.dept || "Faculty"} - ${sectionName}`;
            const btn = document.getElementById('save-notebook-btn');
            btn.innerText = "Compiling..."; btn.disabled = true;

            let compiledHTML = `
                <div style="max-width: 794px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; padding: 40px 10px;">
                <h1 style="font-family: sans-serif; font-size: 2rem; font-weight: 900; text-align: center; color: #333; text-transform: uppercase;">${title}</h1>
            `;
            
            document.querySelectorAll('.a4-page').forEach(page => {
                const domLayerHTML = page.querySelector('.dom-layer').innerHTML;
                const canvasData = page.querySelector('.canvas-layer').toDataURL("image/png");
                const bgStyle = getComputedStyle(page).backgroundImage;
                const bgColor = getComputedStyle(page).backgroundColor;
                const textColor = pageBgColor === '#0f172a' ? '#fff' : '#000';
                
                compiledHTML += `
                    <div style="position: relative; width: 794px; height: 1123px; background-color: ${bgColor}; background-image: ${bgStyle}; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; font-family: sans-serif;">
                        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.05;">
                            <span style="font-size: 5rem; font-weight: 900; text-transform: uppercase; transform: rotate(-45deg); white-space: nowrap; color: ${textColor};">Minerva Study Circle</span>
                        </div>
                        <div style="position: absolute; inset: 0; z-index: 10;">${domLayerHTML}</div>
                        <img src="${canvasData}" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none;">
                    </div>
                `;
            });
            compiledHTML += `</div>`;
            
            const fullPageHTML = `<!DOCTYPE html><html><head><title>${title}</title><script src="https://cdn.tailwindcss.com"><\/script><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script><style>body{background:#e2e8f0; margin:0;} [contenteditable="true"]{outline:none;}</style></head><body onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]})">${compiledHTML}</body></html>`;
            
            try {
                await db.collection("classroom_lectures").add({ title: title, htmlCode: fullPageHTML, teacherEmail: activeStaff.email, teacherName: activeStaff.name, timestamp: Date.now() });
                alert("Notebook Compiled & Saved to Vault!");
                fetchLectures();
                toggleNotebook();
            } catch(e) { alert("Error saving."); }
            finally { btn.innerText = "💾 Save to Vault"; btn.disabled = false; }
        }
    </script>
