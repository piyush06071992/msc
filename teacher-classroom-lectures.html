<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | AI Hub & Digital Notebook</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* A4 Page Styles */
        .a4-page {
            width: 794px; height: 1123px; /* Standard A4 at 96 DPI */
            background-color: var(--page-bg, #ffffff);
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            flex-shrink: 0; transform-origin: top center;
        }
        
        /* 2-Column Splitter */
        .layout-2col::after {
            content: ''; position: absolute; top: 5%; bottom: 5%; left: 50%;
            width: 2px; background-color: rgba(0,0,0,0.1); z-index: 5; pointer-events: none;
        }

        /* Watermark */
        .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.05; z-index: 1; }
        .watermark span { font-size: 5rem; font-weight: 900; text-transform: uppercase; transform: rotate(-45deg); white-space: nowrap; color: #000; }

        /* Dynamic Grids */
        .bg-style-ruled { background-image: repeating-linear-gradient(transparent, transparent calc(var(--grid-size) - 1px), rgba(0,0,0,0.2) calc(var(--grid-size) - 1px), rgba(0,0,0,0.2) var(--grid-size)); }
        .bg-style-grid { background-image: linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px); background-size: var(--grid-size) var(--grid-size); }
        
        .dom-layer { position: absolute; inset: 0; z-index: 10; }
        .canvas-layer { position: absolute; inset: 0; z-index: 20; touch-action: none; }
        
        /* Tool active states */
        .tool-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        .color-btn.active { transform: scale(1.2); border: 2px solid #000; }
        
        /* Cursors */
        .workspace-pen .canvas-layer { cursor: crosshair; pointer-events: auto; }
        .workspace-eraser .canvas-layer { cursor: cell; pointer-events: auto; }
        .workspace-shape .canvas-layer { cursor: crosshair; pointer-events: auto; }
        .workspace-graph .canvas-layer { cursor: crosshair; pointer-events: auto; }
        .workspace-text .canvas-layer, .workspace-image .canvas-layer { pointer-events: none; }
        .workspace-text .dom-layer { cursor: text; }
        .workspace-image .dom-layer { cursor: copy; }

        @media (max-width: 850px) { .a4-page { transform: scale(0.8); margin-bottom: -200px; } }
        @media (max-width: 600px) { .a4-page { transform: scale(0.5); margin-bottom: -500px; } }
    </style>
</head>
<body class="pb-20 transition-all">

    <div id="hub-view" class="block">
        <header class="bg-indigo-950 text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-40">
            <h1 class="font-black text-xl uppercase tracking-tighter">AI Lecture Hub</h1>
        </header>
        <main class="max-w-4xl mx-auto p-4 sm:p-8 space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="toggleNotebook()" class="bg-gradient-to-br from-emerald-600 to-teal-800 text-white p-6 rounded-[2rem] shadow-lg flex flex-col items-center justify-center text-center border-b-4 border-emerald-900 hover:scale-[1.02] transition-transform">
                    <span class="text-3xl mb-2">📓</span><h2 class="font-black text-lg uppercase tracking-widest leading-tight">Open Manual<br>Notebook</h2>
                </button>
            </div>
        </main>
    </div>

    <div id="notebook-view" class="hidden fixed inset-0 z-50 bg-slate-200 flex h-screen text-slate-800">
        
        <aside class="w-64 sm:w-72 bg-slate-900 text-white flex flex-col h-full shadow-2xl z-20 flex-shrink-0">
            <div class="p-5 border-b border-slate-800">
                <button onclick="toggleNotebook()" class="text-slate-400 hover:text-white mb-4 text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><span>🔙</span> Back to Hub</button>
                
                <div class="flex justify-between items-center mb-1">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Notebook</p>
                    <button onclick="renameEntity('notebook')" class="text-slate-500 hover:text-white text-xs">✏️</button>
                </div>
                <select id="notebook-selector" class="w-full bg-slate-800 text-emerald-400 font-black text-lg uppercase tracking-tighter rounded outline-none p-1 border border-slate-700 cursor-pointer"></select>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-6">
                <div>
                    <div class="flex justify-between items-center mb-3 text-slate-400 px-2">
                        <span class="text-xs font-black uppercase tracking-widest">Sections</span>
                        <button onclick="createSection()" class="hover:text-white font-black bg-slate-800 w-6 h-6 rounded-full flex items-center justify-center pb-0.5">+</button>
                    </div>
                    <ul id="section-list" class="space-y-1"></ul>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-3 text-slate-400 px-2">
                        <span class="text-xs font-black uppercase tracking-widest">Pages</span>
                        <button onclick="addA4Page()" class="hover:text-white font-black bg-slate-800 w-6 h-6 rounded-full flex items-center justify-center pb-0.5">+</button>
                    </div>
                    <ul id="page-list" class="space-y-1 pl-2 border-l-2 border-slate-800 ml-3"></ul>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative overflow-hidden">
            <header class="bg-white border-b border-slate-200 p-2 px-4 flex flex-col gap-2 shadow-sm z-30 flex-shrink-0">
                
                <div class="flex items-center gap-2 overflow-x-auto custom-scroll pb-1">
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 shrink-0">
                        <button onclick="setTool('pen')" class="tool-btn active px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-white border border-transparent text-slate-700">✏️ Pen</button>
                        <button onclick="setTool('eraser')" class="tool-btn px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-transparent border border-transparent text-slate-700 hover:bg-white">🧽 Erase</button>
                        <button onclick="setTool('text')" class="tool-btn px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-transparent border border-transparent text-slate-700 hover:bg-white">📝 Text</button>
                        <button onclick="setTool('image')" class="tool-btn px-3 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest transition-colors shadow-sm bg-transparent border border-transparent text-slate-700 hover:bg-white">🖼️ Img</button>
                    </div>

                    <div class="w-px h-6 bg-slate-300 shrink-0"></div>

                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 shrink-0">
                        <select id="shape-selector" onchange="setTool('shape')" class="text-xs font-bold bg-transparent outline-none cursor-pointer text-slate-700">
                            <option value="line">📏 Line</option>
                            <option value="rect">⬛ Rect</option>
                            <option value="triangle">🔺 Triangle</option>
                        </select>
                        <button onclick="setTool('graph')" class="tool-btn px-2 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest text-slate-700 hover:bg-white">📈 Graph 2D</button>
                    </div>

                    <div class="w-px h-6 bg-slate-300 shrink-0"></div>

                    <div class="flex gap-2 shrink-0 items-center">
                        <button onclick="setColor('#0f172a')" class="color-btn active w-5 h-5 rounded-full bg-slate-900 border-2 border-transparent transition-transform"></button>
                        <button onclick="setColor('#dc2626')" class="color-btn w-5 h-5 rounded-full bg-red-600 border-2 border-transparent transition-transform"></button>
                        <button onclick="setColor('#2563eb')" class="color-btn w-5 h-5 rounded-full bg-blue-600 border-2 border-transparent transition-transform"></button>
                        <button onclick="setColor('#16a34a')" class="color-btn w-5 h-5 rounded-full bg-green-600 border-2 border-transparent transition-transform"></button>
                    </div>
                    
                    <div class="ml-auto flex gap-2 shrink-0">
                        <button onclick="clearCurrentPage()" class="text-[10px] font-bold bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg hover:bg-rose-200">Clear Page</button>
                        <button onclick="saveA4NotebookToVault()" class="bg-slate-900 hover:bg-emerald-600 text-white px-4 py-1.5 rounded-xl font-black text-xs uppercase tracking-widest transition-colors shadow-md">💾 Compile</button>
                    </div>
                </div>

                <div class="flex items-center gap-4 overflow-x-auto custom-scroll text-xs font-bold text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-200">
                    <div class="flex items-center gap-2 shrink-0">
                        <label>Pen Size:</label>
                        <input type="range" id="pen-size" min="1" max="10" value="3" class="w-20 cursor-pointer">
                    </div>
                    <div class="w-px h-4 bg-slate-300 shrink-0"></div>
                    <div class="flex items-center gap-2 shrink-0">
                        <label>Layout:</label>
                        <select onchange="setPageLayout(this.value)" class="bg-white border border-slate-200 rounded px-2 py-1 outline-none cursor-pointer">
                            <option value="layout-1col">1 Column</option>
                            <option value="layout-2col">2 Columns</option>
                        </select>
                    </div>
                    <div class="w-px h-4 bg-slate-300 shrink-0"></div>
                    <div class="flex items-center gap-2 shrink-0">
                        <label>Paper:</label>
                        <select onchange="setPageColor(this.value)" class="bg-white border border-slate-200 rounded px-2 py-1 outline-none cursor-pointer">
                            <option value="#ffffff">White</option>
                            <option value="#fef9c3">Yellow</option>
                            <option value="#0f172a">Dark Board</option>
                        </select>
                        <select onchange="setPageStyle(this.value)" class="bg-white border border-slate-200 rounded px-2 py-1 outline-none cursor-pointer">
                            <option value="bg-style-plain">Plain</option>
                            <option value="bg-style-ruled">Ruled</option>
                            <option value="bg-style-grid">Grid</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <label>Grid Size:</label>
                        <input type="range" onchange="setGridSize(this.value)" min="20" max="60" value="30" class="w-20 cursor-pointer">
                    </div>
                </div>
            </header>

            <div id="a4-workspace" class="flex-1 overflow-y-auto custom-scroll p-6 sm:p-10 flex flex-col items-center gap-10 workspace-pen" style="--grid-size: 30px;">
                </div>
            
            <input type="file" id="image-upload" accept="image/*" capture="environment" class="hidden">
        </main>
    </div>

    <script>
        // --- DATA & HIERARCHY ENGINE ---
        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff')) || { dept: 'Mathematics' };
        
        let notebookData = {
            name: `${activeStaff.dept} Notebook`,
            sections: [ { id: 's1', name: 'Unit 1: Fundamentals', pages: [{ id: 'p1', name: 'Page 1' }] } ]
        };
        let activeSec = 's1'; let activePg = 'p1';

        window.onload = () => { initNotebookUI(); addA4Page(); };
        function toggleNotebook() { document.getElementById('hub-view').classList.toggle('hidden'); document.getElementById('notebook-view').classList.toggle('hidden'); document.body.classList.toggle('overflow-hidden'); }

        function initNotebookUI() {
            document.getElementById('notebook-selector').innerHTML = `<option>${notebookData.name}</option>`;
            renderSections(); renderPages();
        }

        function renderSections() {
            const list = document.getElementById('section-list');
            list.innerHTML = notebookData.sections.map(s => `
                <li class="flex justify-between items-center px-4 py-2 rounded-xl text-sm font-bold cursor-pointer transition-colors ${s.id === activeSec ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800'}" onclick="setActiveSection('${s.id}')">
                    <span class="truncate">${s.name}</span>
                    <div class="flex gap-1">
                        <button onclick="event.stopPropagation(); editSection('${s.id}')" class="text-slate-400 hover:text-white">✏️</button>
                        <button onclick="event.stopPropagation(); deleteSection('${s.id}')" class="text-rose-400 hover:text-rose-500">🗑️</button>
                    </div>
                </li>`).join('');
        }

        function renderPages() {
            const sec = notebookData.sections.find(s => s.id === activeSec);
            const list = document.getElementById('page-list');
            list.innerHTML = sec.pages.map(p => `
                <li class="flex justify-between items-center py-1.5 cursor-pointer text-sm font-medium ${p.id === activePg ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                    <div class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full ${p.id === activePg ? 'bg-emerald-500' : 'bg-transparent'}"></span> <span class="truncate">${p.name}</span></div>
                    <button onclick="deletePage('${p.id}')" class="text-rose-400 hover:text-rose-500 text-xs">🗑️</button>
                </li>`).join('');
        }

        // CRUD Actions
        function renameEntity(type) {
            let newVal = prompt(`Enter new ${type} name:`);
            if(newVal) { notebookData.name = newVal; initNotebookUI(); }
        }
        function createSection() {
            let name = prompt("New Section Name:");
            if(name) {
                let newId = 's' + Date.now();
                notebookData.sections.push({ id: newId, name: name, pages: [] });
                activeSec = newId; initNotebookUI();
            }
        }
        function editSection(id) {
            let sec = notebookData.sections.find(s => s.id === id);
            let name = prompt("Rename section:", sec.name);
            if(name) { sec.name = name; renderSections(); }
        }
        function deleteSection(id) {
            if(notebookData.sections.length === 1) return alert("Cannot delete last section.");
            if(confirm("Delete this section and all its pages?")) {
                notebookData.sections = notebookData.sections.filter(s => s.id !== id);
                activeSec = notebookData.sections[0].id; initNotebookUI();
            }
        }
        function setActiveSection(id) { activeSec = id; renderSections(); renderPages(); }

        // --- CANVAS ENGINE ---
        let activeTool = 'pen'; let activeColor = '#0f172a';
        let pageBgColor = '#ffffff'; let pageBgStyle = 'bg-style-plain'; let pageLayout = 'layout-1col';

        function setTool(toolName) {
            activeTool = toolName;
            document.querySelectorAll('.tool-btn').forEach(b => { b.classList.remove('active', 'bg-white', 'text-white', 'border-indigo-600'); b.style.backgroundColor = ''; });
            event.currentTarget.classList.add('active'); event.currentTarget.style.backgroundColor = '#4f46e5'; event.currentTarget.style.color = '#fff';
            document.getElementById('a4-workspace').className = `flex-1 overflow-y-auto custom-scroll p-6 sm:p-10 flex flex-col items-center gap-10 workspace-${toolName}`;
        }

        function setColor(hex) {
            activeColor = hex;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            if(event && event.currentTarget.classList) event.currentTarget.classList.add('active');
            if(pageBgColor === '#0f172a' && activeColor === '#0f172a') activeColor = '#ffffff';
        }

        function setPageColor(hex) {
            pageBgColor = hex; document.documentElement.style.setProperty('--page-bg', hex);
            document.querySelectorAll('.dom-layer div[contenteditable]').forEach(div => div.style.color = hex === '#0f172a' ? '#f8fafc' : '#0f172a');
        }
        function setPageStyle(style) { pageBgStyle = style; updatePageClasses(); }
        function setPageLayout(layout) { pageLayout = layout; updatePageClasses(); }
        function setGridSize(val) { document.getElementById('a4-workspace').style.setProperty('--grid-size', val + 'px'); }
        function updatePageClasses() { document.querySelectorAll('.a4-page').forEach(page => page.className = `a4-page ${pageBgStyle} ${pageLayout}`); }

        function addA4Page() {
            let sec = notebookData.sections.find(s => s.id === activeSec);
            let newId = 'p' + Date.now();
            sec.pages.push({ id: newId, name: `Page ${sec.pages.length + 1}` });
            activePg = newId; renderPages();

            const pageDiv = document.createElement('div');
            pageDiv.className = `a4-page ${pageBgStyle} ${pageLayout}`; pageDiv.id = newId;
            pageDiv.innerHTML = `
                <div class="watermark"><span style="color: ${pageBgColor === '#0f172a' ? '#fff' : '#000'}">Minerva Study Circle</span></div>
                <div class="dom-layer" onclick="handleDomClick(event, this)"></div>
                <canvas class="canvas-layer"></canvas>
                <div class="absolute bottom-4 right-6 text-xs font-bold text-slate-400 z-30">${sec.name} - ${sec.pages[sec.pages.length-1].name}</div>
            `;
            document.getElementById('a4-workspace').appendChild(pageDiv);
            pageDiv.scrollIntoView({ behavior: 'smooth' });
            initCanvas(pageDiv.querySelector('canvas'));
        }

        function clearCurrentPage() {
            if(confirm("Clear everything on the current page?")) {
                const page = document.getElementById(activePg);
                page.querySelector('.dom-layer').innerHTML = '';
                const canvas = page.querySelector('canvas');
                canvas.ctx.clearRect(0,0, canvas.width, canvas.height);
            }
        }

        // Handle Text & Image
        function handleDomClick(e, domLayer) {
            const rect = domLayer.getBoundingClientRect(); const scale = 794 / rect.width;
            const x = (e.clientX - rect.left) * scale; const y = (e.clientY - rect.top) * scale;

            if (activeTool === 'text') {
                const textDiv = document.createElement('div');
                textDiv.contentEditable = true; textDiv.className = "absolute font-bold outline-none border border-dashed border-indigo-400 p-2 cursor-text min-w-[100px] z-50 text-xl";
                textDiv.style.left = x + 'px'; textDiv.style.top = y + 'px'; textDiv.style.color = pageBgColor === '#0f172a' ? '#f8fafc' : '#0f172a';
                domLayer.appendChild(textDiv); textDiv.focus();

                textDiv.addEventListener('blur', () => { 
                    textDiv.classList.remove('border', 'border-dashed', 'border-indigo-400'); 
                    renderMathInElement(textDiv, { delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false} ] });
                });
                textDiv.addEventListener('focus', () => textDiv.classList.add('border', 'border-dashed', 'border-indigo-400'));
                setTool('pen'); 
            } else if (activeTool === 'image') {
                const input = document.getElementById('image-upload');
                input.onchange = function(evt) {
                    const file = evt.target.files[0];
                    if(file) {
                        const reader = new FileReader();
                        reader.onload = function(re) {
                            const img = document.createElement('img'); img.src = re.target.result;
                            img.className = "absolute max-w-[80%] rounded shadow-sm z-40";
                            img.style.left = x + 'px'; img.style.top = y + 'px'; domLayer.appendChild(img);
                        }
                        reader.readAsDataURL(file);
                    }
                    input.value = ''; setTool('pen');
                };
                input.click();
            }
        }

        // Advanced Drawing: Pen, Eraser, Stretch Shapes, Graph Stamp
        function initCanvas(canvas) {
            const ctx = canvas.getContext('2d', { desynchronized: true });
            canvas.width = 794; canvas.height = 1123; canvas.ctx = ctx;
            
            let isDrawing = false; let lastX = 0; let lastY = 0;
            let startX = 0; let startY = 0; let snapshot;

            const getCoords = (e) => {
                const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
                return { x: ((e.clientX || e.touches[0].clientX) - rect.left) * scaleX, y: ((e.clientY || e.touches[0].clientY) - rect.top) * scaleY };
            };

            canvas.addEventListener('pointerdown', (e) => {
                if (activeTool === 'text' || activeTool === 'image') return;
                isDrawing = true; const { x, y } = getCoords(e);
                lastX = x; lastY = y; startX = x; startY = y;
                
                // Store snapshot for shapes/graphs
                if(activeTool === 'shape' || activeTool === 'graph') snapshot = ctx.getImageData(0,0, canvas.width, canvas.height);
                
                canvas.setPointerCapture(e.pointerId);
                if(activeTool === 'pen' || activeTool === 'eraser') draw(e); // Start dot
            });

            const draw = (e) => {
                if (!isDrawing) return;
                const { x, y } = getCoords(e);
                const penSize = parseInt(document.getElementById('pen-size').value) || 3;
                let pressure = e.pressure !== undefined && e.pressure !== 0 ? e.pressure : 0.5;

                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                
                if (activeTool === 'pen' || activeTool === 'eraser') {
                    ctx.lineWidth = (activeTool === 'eraser' ? penSize * 10 : penSize * 2) * (pressure * 2);
                    ctx.strokeStyle = activeTool === 'eraser' ? 'rgba(0,0,0,1)' : activeColor;
                    ctx.globalCompositeOperation = activeTool === 'eraser' ? 'destination-out' : 'source-over';
                    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
                } 
                else if (activeTool === 'shape') {
                    ctx.putImageData(snapshot, 0, 0); // Restore canvas to pre-shape state
                    ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = activeColor; ctx.lineWidth = penSize;
                    const type = document.getElementById('shape-selector').value;
                    ctx.beginPath();
                    if(type === 'line') { ctx.moveTo(startX, startY); ctx.lineTo(x, y); }
                    else if(type === 'rect') { ctx.rect(startX, startY, x - startX, y - startY); }
                    else if(type === 'triangle') { ctx.moveTo(startX + (x-startX)/2, startY); ctx.lineTo(x, y); ctx.lineTo(startX, y); ctx.closePath(); }
                    ctx.stroke();
                }
                else if (activeTool === 'graph') {
                    ctx.putImageData(snapshot, 0, 0);
                    ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = activeColor; ctx.lineWidth = 2;
                    // Draw Axes box
                    const w = x - startX; const h = y - startY;
                    ctx.strokeRect(startX, startY, w, h);
                    // Draw Grid lines inside box
                    ctx.lineWidth = 0.5; ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                    for(let i=1; i<10; i++) {
                        ctx.beginPath(); ctx.moveTo(startX, startY + (h/10)*i); ctx.lineTo(x, startY + (h/10)*i); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(startX + (w/10)*i, startY); ctx.lineTo(startX + (w/10)*i, y); ctx.stroke();
                    }
                    // Draw Main Axes
                    ctx.lineWidth = 2; ctx.strokeStyle = activeColor;
                    ctx.beginPath(); ctx.moveTo(startX, startY + h/2); ctx.lineTo(x, startY + h/2); ctx.stroke(); // X
                    ctx.beginPath(); ctx.moveTo(startX + w/2, startY); ctx.lineTo(startX + w/2, y); ctx.stroke(); // Y
                }
                lastX = x; lastY = y;
            };

            canvas.addEventListener('pointermove', draw);
            canvas.addEventListener('pointerup', (e) => { isDrawing = false; canvas.releasePointerCapture(e.pointerId); });
            canvas.addEventListener('touchstart', (e) => { if(activeTool !== 'text' && activeTool !== 'image') e.preventDefault(); }, {passive: false});
            canvas.addEventListener('touchmove', (e) => { if(activeTool !== 'text' && activeTool !== 'image') e.preventDefault(); }, {passive: false});
            
            // Mark page active on interact
            canvas.addEventListener('pointerdown', () => { activePg = canvas.parentElement.id; renderPages(); });
        }
