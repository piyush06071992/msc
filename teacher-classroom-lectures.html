<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | AI Animated Lectures</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-indigo-950 text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="bg-white/10 p-2 rounded-lg hover:bg-white/20 transition-colors">🔙</button>
            <h1 class="font-black text-xl uppercase tracking-tighter">AI Lecture Hub</h1>
        </div>
        <div id="classroom-key-display" class="bg-amber-400 text-amber-900 px-4 py-2 rounded-xl font-black text-sm shadow-lg animate-pulse hidden">
            KEY: <span id="active-key-val">------</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8 space-y-8">
        
        <!-- STEP 1: PROMPT GENERATOR -->
        <section class="bg-white rounded-[2.5rem] p-6 sm:p-8 border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-12 h-12 bg-indigo-100 rounded-2xl flex items-center justify-center text-2xl">✨</div>
                <div>
                    <h2 class="font-black text-slate-900 text-lg uppercase">AI Prompt Architect</h2>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Generate the master code instruction</p>
                </div>
            </div>

            <div class="space-y-4">
                <textarea id="lecture-topic" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold outline-none focus:border-indigo-500" placeholder="Describe the topic (e.g. Integration by parts with 5 visualization steps)"></textarea>
                <button onclick="generateAIPrompt()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg hover:bg-indigo-500 transition-all">🚀 Generate Master Prompt</button>
            </div>

            <div id="prompt-output-area" class="hidden mt-6 bg-slate-900 rounded-2xl p-5 relative">
                <label class="block text-[10px] font-black text-indigo-300 uppercase tracking-widest mb-3">Copy this to Gemini:</label>
                <div id="ai-prompt-text" class="text-slate-300 text-xs font-mono leading-relaxed max-h-40 overflow-y-auto custom-scroll mb-4 whitespace-pre-wrap"></div>
                <button onclick="copyPrompt()" class="w-full bg-indigo-400/20 text-indigo-200 border border-indigo-400/30 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-indigo-400/40">📋 Copy to Clipboard</button>
            </div>
        </section>

        <!-- STEP 2: LECTURE UPLOADER -->
        <section class="bg-white rounded-[2.5rem] p-6 sm:p-8 border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-12 h-12 bg-emerald-100 rounded-2xl flex items-center justify-center text-2xl">📁</div>
                <div>
                    <h2 class="font-black text-slate-900 text-lg uppercase">Save New Lecture</h2>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Paste the HTML code from Gemini below</p>
                </div>
            </div>

            <div class="space-y-4">
                <input type="text" id="lec-title" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold outline-none" placeholder="Lecture Title (e.g. Calculus Basics)">
                <textarea id="lec-html" rows="6" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-[10px] font-mono outline-none" placeholder="Paste Gemini's <html> code here..."></textarea>
                <button onclick="saveLecture()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs shadow-xl hover:bg-emerald-600 transition-all">💾 Save to Classroom Vault</button>
            </div>
        </section>

        <!-- STEP 3: RECENT LECTURES & MAGIC KEY -->
        <section class="bg-indigo-50/50 rounded-[2.5rem] p-6 sm:p-8 border border-indigo-100">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <h2 class="font-black text-indigo-950 text-lg uppercase tracking-tighter">Your Classroom Vault</h2>
                <button onclick="generateClassroomKey()" class="bg-amber-500 text-amber-950 px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md hover:scale-105 transition-transform">🔑 Generate Magic Key</button>
            </div>
            <div id="lecture-list" class="space-y-3">
                <div class="text-center py-10 text-slate-400 font-bold text-xs uppercase tracking-widest">Loading vault...</div>
            </div>
        </section>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
        let myLectures = [];

        async function init() {
            if(!activeStaff) window.location.replace('staff-login.html');
            fetchLectures();
        }

        function generateAIPrompt() {
            const topic = document.getElementById('lecture-topic').value;
            if(!topic) return alert("Enter a topic first!");

            const dept = activeStaff.dept || "General Faculty";
            const prompt = `Act as a Senior ${dept} Faculty at Minerva Study Circle. 
Create a professional, interactive HTML-based lecture slide for the topic: "${topic}".

REQUIREMENTS:
1. Visuals: Use Tailwind CSS for a modern, clean UI. Use dark mode background (slate-950).
2. Animations: Use GSAP (GreenSock) for fluid reveal animations.
3. Math: Use KaTeX for beautiful mathematical equations. 
4. Structure: 
   - A clear Title slide.
   - Step-by-step reveal of concepts/solutions on mouse click.
   - Interactive high-contrast buttons for 'Next Step' and 'Previous'.
5. Code: Provide the COMPLETE HTML file code in one block including all CDN scripts.`;

            document.getElementById('ai-prompt-text').innerText = prompt;
            document.getElementById('prompt-output-area').classList.remove('hidden');
        }

        function copyPrompt() {
            const text = document.getElementById('ai-prompt-text').innerText;
            navigator.clipboard.writeText(text);
            alert("Prompt Copied! Paste this into Gemini.");
        }

        async function saveLecture() {
            const title = document.getElementById('lec-title').value;
            const html = document.getElementById('lec-html').value;
            if(!title || !html) return alert("Fill all fields!");

            const btn = event.target;
            btn.disabled = true; btn.innerText = "Uploading...";

            try {
                await db.collection("classroom_lectures").add({
                    title: title,
                    htmlCode: html,
                    teacherEmail: activeStaff.email,
                    teacherName: activeStaff.name,
                    timestamp: Date.now()
                });
                alert("Lecture Saved Successfully!");
                location.reload();
            } catch(e) { alert("Error saving."); btn.disabled = false; }
        }

        async function fetchLectures() {
            const snap = await db.collection("classroom_lectures")
                .where("teacherEmail", "==", activeStaff.email)
                .orderBy("timestamp", "desc").get();
            
            myLectures = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const list = document.getElementById('lecture-list');
            
            if(myLectures.length === 0) {
                list.innerHTML = `<div class="bg-white/50 p-10 rounded-3xl border border-dashed border-slate-300 text-center text-slate-400 font-bold text-xs uppercase">No lectures in vault.</div>`;
                return;
            }

            list.innerHTML = myLectures.map(l => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                    <div>
                        <h4 class="font-black text-slate-800 text-sm uppercase">${l.title}</h4>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${new Date(l.timestamp).toLocaleDateString()}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="previewLecture('${l.id}')" class="p-2 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-600 hover:text-white transition-colors">👁️</button>
                        <button onclick="deleteLecture('${l.id}')" class="p-2 bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-600 hover:text-white transition-colors">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function generateClassroomKey() {
            const key = Math.floor(100000 + Math.random() * 900000).toString();
            try {
                await db.collection("classroom_keys").doc(key).set({
                    teacherEmail: activeStaff.email,
                    createdAt: Date.now(),
                    expiresAt: Date.now() + (30 * 60000) // Valid for 30 mins
                });
                document.getElementById('active-key-val').innerText = key;
                document.getElementById('classroom-key-display').classList.remove('hidden');
                alert("Your Magic Key is: " + key + "\nUse this on the classroom Smart Board to unlock your files.");
            } catch(e) { alert("Key generation failed."); }
        }

        function previewLecture(id) {
            const lec = myLectures.find(l => l.id === id);
            const win = window.open("", "_blank");
            win.document.write(lec.htmlCode);
            win.document.close();
        }

        async function deleteLecture(id) {
            if(confirm("Delete this lecture permanently?")) {
                await db.collection("classroom_lectures").doc(id).delete();
                fetchLectures();
            }
        }

        init();
    </script>
</body>
</html>
