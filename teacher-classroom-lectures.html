<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Lecture Drive</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .folder-card:hover { transform: translateY(-2px); border-color: #4f46e5; }
        .file-card:hover { transform: translateY(-2px); border-color: #10b981; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-[#1e1b4b] text-white p-4 shadow-xl flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="bg-white/10 p-2 rounded-lg hover:bg-white/20 transition-all">🔙</button>
            <h1 class="font-black text-xl uppercase tracking-tighter italic">Minerva <span class="text-indigo-400">Lecture Drive</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <div id="key-display" class="hidden bg-amber-400 text-amber-950 px-4 py-1.5 rounded-full font-black text-xs animate-pulse">
                KEY: <span id="active-key-val">------</span>
            </div>
            <button onclick="generateClassroomKey()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg">🔑 Generate Smart Key</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full p-4 sm:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <section class="lg:col-span-4 space-y-6">
            <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200">
                <div class="flex items-center gap-3 mb-4">
                    <span class="text-2xl">🪄</span>
                    <h2 class="font-black text-slate-800 uppercase text-sm">AI Architect</h2>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] font-black uppercase text-slate-400 mb-1 block">1. Topic to Prompt</label>
                        <textarea id="prompt-topic" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-indigo-500" placeholder="e.g. Integration by parts with visuals"></textarea>
                        <button onclick="generateAIPrompt()" class="w-full mt-2 bg-indigo-50 text-indigo-700 py-2 rounded-xl font-black uppercase text-[10px]">Get Gemini Prompt</button>
                        <div id="prompt-out-box" class="hidden mt-2 p-3 bg-slate-900 rounded-xl relative">
                            <p id="prompt-text" class="text-[9px] text-slate-300 font-mono leading-relaxed max-h-24 overflow-y-auto custom-scroll"></p>
                            <button onclick="copyPrompt()" class="w-full mt-2 bg-white/10 text-white py-1 rounded text-[9px] font-black uppercase">Copy Prompt</button>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100">
                        <label class="text-[10px] font-black uppercase text-slate-400 mb-1 block">2. Save / Edit HTML</label>
                        <input type="text" id="lec-title" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold mb-2 outline-none" placeholder="Lecture Title">
                        <textarea id="lec-code" rows="6" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-[10px] font-mono mb-3 outline-none" placeholder="Paste <html> here..."></textarea>
                        <input type="hidden" id="editing-id" value="">
                        <button onclick="saveLecture()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black uppercase text-xs shadow-lg hover:bg-black transition-all">💾 Save to Current Folder</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="lg:col-span-8 space-y-6">
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                <div id="breadcrumb" class="flex items-center gap-2 text-xs font-black uppercase tracking-tight text-slate-400">
                    <span onclick="navigateToFolder('root')" class="text-indigo-600 cursor-pointer hover:underline">DRIVE</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="createNewFolder()" class="bg-emerald-50 text-emerald-700 px-4 py-2 rounded-xl font-black text-[10px] uppercase border border-emerald-100 hover:bg-emerald-100 transition-all">+ New Folder</button>
                </div>
            </div>

            <div id="explorer-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                </div>

            <div id="empty-state" class="hidden text-center py-20">
                <div class="text-4xl mb-2">📂</div>
                <p class="text-slate-400 font-bold uppercase text-xs tracking-widest">This folder is empty</p>
            </div>
        </section>
    </main>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff')) || { email: 'piyush@minerva.com' };
        let currentFolderId = 'root';
        let folderHistory = [{ id: 'root', name: 'DRIVE' }];

        window.onload = () => { fetchDriveContent(); };

        // --- 2. AI ARCHITECT LOGIC ---
        function generateAIPrompt() {
            const topic = document.getElementById('prompt-topic').value;
            if(!topic) return alert("Enter a topic!");
            const prompt = `Act as a Senior Faculty at Minerva Study Circle. Create a professional, interactive HTML lecture slide for: "${topic}".\n\nRequirements:\n1. Use Tailwind CSS & GSAP for animations.\n2. Use KaTeX for beautiful math equations.\n3. Content should reveal step-by-step on mouse clicks.\n4. Provide a SINGLE complete HTML file code.`;
            document.getElementById('prompt-text').innerText = prompt;
            document.getElementById('prompt-out-box').classList.remove('hidden');
        }

        function copyPrompt() {
            navigator.clipboard.writeText(document.getElementById('prompt-text').innerText);
            alert("Prompt Copied! Paste into Gemini.");
        }

        async function saveLecture() {
            const title = document.getElementById('lec-title').value;
            const htmlCode = document.getElementById('lec-code').value;
            const editingId = document.getElementById('editing-id').value;

            if(!title || !htmlCode) return alert("Fill title and code!");

            try {
                const data = {
                    title,
                    htmlCode,
                    teacherEmail: activeStaff.email,
                    folderId: currentFolderId,
                    timestamp: Date.now()
                };

                if(editingId) {
                    await db.collection("classroom_lectures").doc(editingId).update(data);
                    alert("Lecture Updated!");
                } else {
                    await db.collection("classroom_lectures").add(data);
                    alert("Lecture Saved to Drive!");
                }
                
                resetEditor();
                fetchDriveContent();
            } catch(e) { alert("Save failed: " + e.message); }
        }

        function resetEditor() {
            document.getElementById('lec-title').value = "";
            document.getElementById('lec-code').value = "";
            document.getElementById('editing-id').value = "";
        }

        // --- 3. EXPLORER LOGIC ---
        async function fetchDriveContent() {
            const grid = document.getElementById('explorer-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '<div class="col-span-full text-center p-10 font-bold text-slate-300 text-[10px] uppercase">Scanning Drive...</div>';

            try {
                // Fetch Folders
                const fSnap = await db.collection("lecture_folders")
                    .where("teacherEmail", "==", activeStaff.email)
                    .where("parentId", "==", currentFolderId)
                    .get();

                // Fetch Files
                const lSnap = await db.collection("classroom_lectures")
                    .where("teacherEmail", "==", activeStaff.email)
                    .where("folderId", "==", currentFolderId)
                    .orderBy("timestamp", "desc")
                    .get();

                grid.innerHTML = "";
                
                if(fSnap.empty && lSnap.empty) {
                    empty.classList.remove('hidden');
                } else {
                    empty.classList.add('hidden');
                    
                    // Render Folders
                    fSnap.forEach(doc => {
                        const d = doc.data();
                        grid.innerHTML += `
                            <div onclick="navigateToFolder('${doc.id}', '${d.name}')" class="folder-card bg-white p-4 rounded-2xl border-2 border-slate-100 flex flex-col items-center justify-center text-center cursor-pointer transition-all shadow-sm group">
                                <span class="text-3xl mb-2 group-hover:scale-110 transition-transform">📂</span>
                                <h4 class="text-[10px] font-black uppercase text-slate-700 truncate w-full px-2">${d.name}</h4>
                                <button onclick="event.stopPropagation(); deleteFolder('${doc.id}')" class="mt-2 text-[8px] text-rose-400 font-bold opacity-0 group-hover:opacity-100">DELETE</button>
                            </div>`;
                    });

                    // Render Files
                    lSnap.forEach(doc => {
                        const d = doc.data();
                        grid.innerHTML += `
                            <div class="file-card bg-white p-4 rounded-2xl border-2 border-slate-100 flex flex-col items-center justify-center text-center cursor-pointer transition-all shadow-sm group relative">
                                <div onclick="launchLecture('${doc.id}')" class="flex flex-col items-center">
                                    <span class="text-3xl mb-2 group-hover:scale-110 transition-transform">📄</span>
                                    <h4 class="text-[10px] font-black uppercase text-slate-700 truncate w-full px-2">${d.title}</h4>
                                </div>
                                <div class="flex gap-2 mt-3 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="editLecture('${doc.id}')" class="text-[8px] bg-slate-100 px-2 py-1 rounded-lg font-bold text-slate-500">EDIT</button>
                                    <button onclick="deleteLecture('${doc.id}')" class="text-[8px] bg-rose-50 px-2 py-1 rounded-lg font-bold text-rose-500">DEL</button>
                                </div>
                            </div>`;
                    });
                }
            } catch(e) { grid.innerHTML = "Error loading drive."; console.error(e); }
        }

        async function createNewFolder() {
            const name = prompt("Enter Folder Name:");
            if(!name) return;
            try {
                await db.collection("lecture_folders").add({
                    name,
                    teacherEmail: activeStaff.email,
                    parentId: currentFolderId,
                    timestamp: Date.now()
                });
                fetchDriveContent();
            } catch(e) { alert("Error creating folder."); }
        }

        function navigateToFolder(id, name) {
            if(id === 'root') {
                folderHistory = [{ id: 'root', name: 'DRIVE' }];
            } else {
                folderHistory.push({ id, name });
            }
            currentFolderId = id;
            updateBreadcrumbs();
            fetchDriveContent();
        }

        function updateBreadcrumbs() {
            const bc = document.getElementById('breadcrumb');
            bc.innerHTML = folderHistory.map((folder, idx) => `
                <span onclick="sliceHistory(${idx})" class="${idx === folderHistory.length - 1 ? 'text-slate-400' : 'text-indigo-600 cursor-pointer hover:underline'}">
                    ${folder.name}
                </span>
                ${idx < folderHistory.length - 1 ? '<span>/</span>' : ''}
            `).join('');
        }

        function sliceHistory(idx) {
            const target = folderHistory[idx];
            folderHistory = folderHistory.slice(0, idx + 1);
            currentFolderId = target.id;
            updateBreadcrumbs();
            fetchDriveContent();
        }

        async function editLecture(id) {
            const doc = await db.collection("classroom_lectures").doc(id).get();
            if(doc.exists) {
                const d = doc.data();
                document.getElementById('lec-title').value = d.title;
                document.getElementById('lec-code').value = d.htmlCode;
                document.getElementById('editing-id').value = id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function deleteLecture(id) {
            if(confirm("Permanently delete this HTML lecture?")) {
                await db.collection("classroom_lectures").doc(id).delete();
                fetchDriveContent();
            }
        }

        async function deleteFolder(id) {
            if(confirm("Delete this folder? This will NOT delete lectures inside, they will move to Drive root.")) {
                // In a production app, you'd recursively delete or move children.
                await db.collection("lecture_folders").doc(id).delete();
                fetchDriveContent();
            }
        }

        async function generateClassroomKey() {
            const key = Math.floor(100000 + Math.random() * 900000).toString();
            try {
                await db.collection("classroom_keys").doc(key).set({
                    teacherEmail: activeStaff.email,
                    createdAt: Date.now(),
                    expiresAt: Date.now() + (60 * 60000) // 1 Hour
                });
                document.getElementById('active-key-val').innerText = key;
                document.getElementById('key-display').classList.remove('hidden');
            } catch(e) { alert("Key generation failed."); }
        }

        // --- 4. LECTURE PLAYER WITH NAV OVERLAY ---
        async function launchLecture(id) {
            const doc = await db.collection("classroom_lectures").doc(id).get();
            if(!doc.exists) return;
            const d = doc.data();
            
            // Build the presentation window with a floating navigator
            const win = window.open("", "_blank");
            
            // Inject navigation helper script
            const navOverlay = `
                <div id="minerva-nav-hub" style="position:fixed; bottom:20px; right:20px; z-index:9999; display:flex; gap:10px;">
                    <button onclick="window.close()" style="background:#be123c; color:white; border:none; padding:10px 20px; border-radius:12px; font-weight:900; font-family:sans-serif; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.3);">EXIT LECTURE</button>
                </div>
            `;

            win.document.write(d.htmlCode);
            win.document.body.insertAdjacentHTML('beforeend', navOverlay);
            win.document.close();
        }
    </script>
</body>
</html>
