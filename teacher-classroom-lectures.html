<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Classroom Notes Hub</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        * { -webkit-tap-highlight-color: transparent; outline: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* A4 Page Layout */
        .a4-page {
            width: 794px; height: 1123px; 
            background-color: var(--page-bg, #ffffff);
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            margin-bottom: 3rem;
            flex-shrink: 0; transform-origin: top center;
            user-select: none;
        }
        
        .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.05; z-index: 1; }
        .watermark span { font-size: 5rem; font-weight: 900; text-transform: uppercase; transform: rotate(-45deg); white-space: nowrap; color: #000; }

        .bg-style-ruled { background-image: repeating-linear-gradient(transparent, transparent 30px, rgba(0,0,0,0.1) 30px, rgba(0,0,0,0.1) 31px); }
        .bg-style-grid { background-image: linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px); background-size: 30px 30px; }
        
        .dom-layer { position: absolute; inset: 0; z-index: 10; }
        .canvas-layer { position: absolute; inset: 0; z-index: 20; touch-action: none; }
        
        /* Sidebar transition logic */
        #notebook-sidebar.collapsed { width: 0; transform: translateX(-100%); overflow: hidden; }
        
        .tool-btn.active { background-color: #4f46e5 !important; color: white !important; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }

        @media (max-width: 850px) { .a4-page { transform: scale(0.85); margin-bottom: -100px; } }
        @media (max-width: 600px) { .a4-page { transform: scale(0.45); margin-bottom: -600px; } }
    </style>
</head>
<body class="pb-20">

    <div id="hub-view" class="block">
        <header class="bg-indigo-950 text-white p-5 shadow-xl flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='teacher-portal.html'" class="bg-white/10 p-2 rounded-lg hover:bg-white/20">🔙</button>
                <h1 class="font-black text-xl uppercase tracking-tighter">Classroom Notes Hub</h1>
            </div>
            <div id="classroom-key-display" class="bg-amber-400 text-amber-900 px-4 py-2 rounded-xl font-black text-sm hidden">
                KEY: <span id="active-key-val">------</span>
            </div>
        </header>

        <main class="max-w-6xl mx-auto p-4 sm:p-8 space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center text-3xl mb-6">📓</div>
                        <h2 class="font-black text-2xl uppercase mb-2 text-slate-900">Digital Notebook</h2>
                        <p class="text-slate-500 mb-6">Stylus-optimized A4 continuous scroll with sidebar toggling and image pasting.</p>
                    </div>
                    <button onclick="toggleNotebook()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-sm hover:bg-emerald-600 transition-all">Open Notebook Editor ➡️</button>
                </div>

                <div class="bg-white rounded-[2.5rem] p-8 border border-slate-200 shadow-sm space-y-4">
                    <h2 class="font-black text-xl uppercase text-slate-900">AI Lecture Builder</h2>
                    <input type="text" id="lecture-topic" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold" placeholder="Topic name...">
                    <button onclick="generateAIPrompt()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-black uppercase text-xs">Generate Prompt</button>
                    <div id="prompt-output-area" class="hidden bg-slate-100 p-3 rounded-xl">
                        <p id="ai-prompt-text" class="text-[10px] font-mono text-slate-600 mb-2 max-h-20 overflow-auto"></p>
                        <button onclick="copyPrompt()" class="w-full bg-slate-800 text-white py-1 rounded text-[10px] uppercase">Copy Prompt</button>
                    </div>
                    <div class="pt-4 border-t border-slate-100 space-y-3">
                        <input type="text" id="lec-title" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-xs" placeholder="Final Title">
                        <textarea id="lec-html" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-[10px]" placeholder="Paste AI HTML code here..."></textarea>
                        <button onclick="saveLecture()" class="w-full bg-indigo-950 text-white py-2 rounded-xl font-black uppercase text-xs">Save to Vault</button>
                    </div>
                </div>
            </div>

            <section class="bg-indigo-50/50 rounded-[2.5rem] p-8 border border-indigo-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-black text-xl uppercase tracking-tighter text-indigo-950">Your Vault</h2>
                    <button onclick="generateClassroomKey()" class="bg-amber-500 text-amber-950 px-5 py-2 rounded-xl font-black text-xs uppercase shadow-md hover:scale-105 transition-transform">🔑 Magic Key</button>
                </div>
                <div id="lecture-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center text-slate-400 font-bold uppercase text-xs">Loading files...</div>
            </section>
        </main>
    </div>

    <div id="notebook-view" class="hidden fixed inset-0 z-50 bg-slate-300 flex h-screen overflow-hidden">
        
        <aside id="notebook-sidebar" class="w-72 bg-slate-900 text-white flex flex-col h-full flex-shrink-0 z-40 transition-all duration-300 border-r border-slate-700">
            <div class="p-5 border-b border-slate-800">
                <button onclick="toggleNotebook()" class="text-slate-400 hover:text-white mb-6 text-[10px] font-black uppercase flex items-center gap-2"><span>🔙</span> Back to Hub</button>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Notebook</span>
                    <button onclick="createNotebook()" class="bg-emerald-600 w-6 h-6 rounded flex items-center justify-center font-black text-xs hover:bg-emerald-500">+</button>
                </div>
                <select id="notebook-selector" onchange="switchNotebook(this.value)" class="w-full bg-slate-800 text-emerald-400 font-black p-2 rounded outline-none border border-slate-700 text-sm"></select>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-6 custom-scroll">
                <div>
                    <div class="flex justify-between items-center mb-3 text-slate-400 px-2 uppercase text-[10px] font-black tracking-widest">Sections <button onclick="createSection()" class="bg-slate-800 px-2 py-1 rounded hover:bg-indigo-600">+</button></div>
                    <ul id="section-list" class="space-y-1"></ul>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative min-w-0">
            <header class="bg-white border-b border-slate-200 p-2 px-4 flex flex-col gap-2 z-30 shadow-sm">
                <div class="flex items-center gap-2">
                    <button onclick="toggleSidebar()" class="p-2 bg-slate-100 rounded-lg text-slate-600 hover:bg-slate-200" title="Toggle Sidebar">☰</button>
                    
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 shrink-0">
                        <button onclick="setTool('pen')" id="tool-pen" class="tool-btn active px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">✏️ Pen</button>
                        <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">🧽 Erase</button>
                        <button onclick="setTool('text')" id="tool-text" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">📝 Text</button>
                        <button onclick="setTool('image'); triggerImageUpload()" id="tool-image" class="tool-btn px-4 py-2 rounded-lg text-xs font-black uppercase text-slate-700">🖼️ Img</button>
                    </div>
                    
                    <div class="flex items-center gap-2 ml-2 bg-slate-100 p-1 rounded-xl border border-slate-200">
                        <div class="relative w-8 h-8 rounded-full border-2 border-slate-300 overflow-hidden shadow-inner">
                            <input type="color" id="color-picker" onchange="updateMasterColor(this.value)" value="#0f172a" class="absolute -top-2 -left-2 w-12 h-12 cursor-pointer border-none bg-transparent">
                        </div>
                        <span class="text-[10px] font-black uppercase text-slate-400 pr-2">Color</span>
                    </div>

                    <div class="ml-auto flex gap-2">
                        <button onclick="toggleFullscreen()" class="p-2 bg-slate-100 rounded-lg text-slate-600" title="Full Screen">⛶</button>
                        <button onclick="saveA4NotebookToVault()" class="bg-slate-900 text-white px-5 py-2 rounded-xl font-black text-xs uppercase shadow-md active:scale-95 transition-all">💾 Save</button>
                    </div>
                </div>

                <div class="flex items-center gap-4 bg-slate-50 p-1.5 rounded-lg text-[10px] font-bold text-slate-500 overflow-x-auto">
                    <div class="flex items-center gap-2 shrink-0">
                        <label>Size:</label><input type="range" id="pen-size" min="1" max="15" value="3" class="w-20">
                    </div>
                    <div class="w-px h-4 bg-slate-200"></div>
                    <div class="flex items-center gap-2 shrink-0">
                        <label>Paper:</label>
                        <select onchange="setPageColor(this.value)" class="bg-white border rounded p-0.5"><option value="#ffffff">White</option><option value="#fef9c3">Yellow</option><option value="#0f172a">Dark</option></select>
                        <select onchange="setPageStyle(this.value)" class="bg-white border rounded p-0.5"><option value="bg-style-plain">Plain</option><option value="bg-style-ruled">Ruled</option><option value="bg-style-grid">Grid</option></select>
                    </div>
                </div>
            </header>

            <div id="a4-workspace" class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-10 flex flex-col items-center workspace-pen bg-slate-300/40">
                <div id="pages-container" class="flex flex-col items-center w-full"></div>
                <button onclick="addA4Page()" class="my-10 w-[794px] max-w-full py-6 border-2 border-dashed border-slate-400 text-slate-400 rounded-2xl font-black uppercase hover:bg-white transition-all bg-white/30">+ Add New Page</button>
            </div>
        </main>
    </div>

    <input type="file" id="image-upload" accept="image/*" class="hidden">

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff')) || { dept: 'Mathematics', name: 'Piyush Rana' };
        let myLectures = [];
        let appData = { activeNotebookId: 'nb1', notebooks: [{ id: 'nb1', name: `${activeStaff.dept} Master`, sections: [{ id: 's1', name: 'Unit 1', pages: [] }] }] };
        let activeSec = 's1', activePg = '', activeTool = 'pen', activeColor = '#0f172a', pageBgStyle = 'bg-style-plain';

        window.onload = () => { fetchLectures(); initNotebookUI(); };

        // SIDEBAR TOGGLE
        function toggleSidebar() {
            const sidebar = document.getElementById('notebook-sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // FULLSCREEN
        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        function toggleNotebook() {
            document.getElementById('hub-view').classList.toggle('hidden');
            document.getElementById('hub-view').classList.toggle('block');
            document.getElementById('notebook-view').classList.toggle('hidden');
            if (!document.getElementById('notebook-view').classList.contains('hidden') && getActiveSec().pages.length === 0) addA4Page();
        }

        // --- HUB FUNCTIONS ---
        async function fetchLectures() {
            const snap = await db.collection("classroom_lectures").where("teacherEmail", "==", activeStaff.email).orderBy("timestamp", "desc").get();
            document.getElementById('lecture-list').innerHTML = snap.docs.map(d => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
                    <span class="font-bold text-[10px] uppercase truncate pr-4 text-slate-700">${d.data().title}</span>
                    <button onclick="previewL('${d.id}')" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg hover:bg-indigo-600 hover:text-white transition-colors">👁️</button>
                </div>`).join('');
        }
        function generateAIPrompt() { 
            const t = document.getElementById('lecture-topic').value;
            if(!t) return alert("Enter topic");
            document.getElementById('ai-prompt-text').innerText = `Act as Senior Faculty at Minerva Circle. Topic: "${t}". Provide complete professional HTML/JS code (Tailwind, GSAP, KaTeX) with step-by-step reveal.`;
            document.getElementById('prompt-output-area').classList.remove('hidden');
        }
        function copyPrompt() { navigator.clipboard.writeText(document.getElementById('ai-prompt-text').innerText); alert("Prompt Copied"); }
        async function saveLecture() {
            const title = document.getElementById('lec-title').value, htmlCode = document.getElementById('lec-html').value;
            if(!title || !htmlCode) return alert("Fill all fields");
            await db.collection("classroom_lectures").add({ title, htmlCode, teacherEmail: activeStaff.email, teacherName: activeStaff.name, timestamp: Date.now() });
            alert("Saved to Vault!"); location.reload();
        }
        function previewL(id) { db.collection("classroom_lectures").doc(id).get().then(d => { let w = window.open(); w.document.write(d.data().htmlCode); w.document.close(); }); }
        async function generateClassroomKey() {
            const key = Math.floor(100000 + Math.random() * 900000).toString();
            await db.collection("classroom_keys").doc(key).set({ teacherEmail: activeStaff.email, expiresAt: Date.now() + 1800000 });
            document.getElementById('active-key-val').innerText = key; document.getElementById('classroom-key-display').classList.remove('hidden');
        }

        // --- NOTEBOOK TOOL LOGIC ---
        function setTool(t) {
            activeTool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tool-' + t).classList.add('active');
            document.getElementById('a4-workspace').className = `flex-1 overflow-y-auto custom-scroll p-4 sm:p-10 flex flex-col items-center workspace-${t}`;
        }
        function updateMasterColor(c) { activeColor = c; }
        function setPageColor(c) { document.documentElement.style.setProperty('--page-bg', c); }
        function setPageStyle(s) { 
            pageBgStyle = s; 
            document.querySelectorAll('.a4-page').forEach(p => { p.className = `a4-page ${s}`; });
        }

        function addA4Page() {
            const wrap = document.getElementById('wrap-' + activeSec) || document.getElementById('pages-container');
            const pid = 'p' + Date.now();
            getActiveSec().pages.push({ id: pid });
            const p = document.createElement('div');
            p.className = `a4-page ${pageBgStyle}`; p.id = pid;
            p.innerHTML = `<div class="watermark"><span>Minerva Circle</span></div><div class="dom-layer" onclick="handleDomClick(event, this)"></div><canvas class="canvas-layer"></canvas>`;
            wrap.appendChild(p);
            p.scrollIntoView({behavior:'smooth'});
            initCanvas(p.querySelector('canvas'));
            activePg = pid;
        }

        // --- IMAGE & TEXT HANDLING ---
        function handleDomClick(e, dom) {
            if (activeTool !== 'text') return; // Image now handled by direct trigger
            const rect = dom.getBoundingClientRect();
            const sx = 794 / rect.width, x = (e.clientX - rect.left) * sx, y = (e.clientY - rect.top) * sx;

            if (activeTool === 'text') {
                const t = document.createElement('div');
                t.contentEditable = true; t.className = "absolute font-bold p-2 z-50 text-2xl outline-none min-w-[50px] bg-transparent";
                t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.color = activeColor;
                dom.appendChild(t); t.focus();
                t.onblur = () => { if(t.innerText.includes('$') && window.renderMathInElement) renderMathInElement(t, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] }); };
            }
        }

        // LAPTOP DIRECT UPLOAD
        function triggerImageUpload() {
            const input = document.getElementById('image-upload');
            input.value = "";
            input.onchange = (evt) => {
                const file = evt.target.files[0];
                if(!file) return;
                const r = new FileReader();
                r.onload = (ev) => insertImageToActivePage(ev.target.result);
                r.readAsDataURL(file);
            };
            input.click();
        }

        // LAPTOP DIRECT PASTE (Ctrl+V)
        window.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf("image") !== -1) {
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    reader.onload = (ev) => insertImageToActivePage(ev.target.result);
                    reader.readAsDataURL(blob);
                }
            }
        });

        function insertImageToActivePage(src) {
            const img = document.createElement('img');
            img.src = src;
            img.className = "absolute max-w-[60%] z-40 rounded shadow-md pointer-events-auto cursor-move";
            img.style.left = "100px"; img.style.top = "100px";
            // Append to current page or last page
            const container = document.getElementById(activePg) || document.querySelector('.a4-page:last-child');
            if(container) container.querySelector('.dom-layer').appendChild(img);
        }

        // --- CANVAS ENGINE ---
        function initCanvas(canvas) {
            const ctx = canvas.getContext('2d', { desynchronized: true });
            canvas.width = 794; canvas.height = 1123;
            let drawing = false, lx = 0, ly = 0;
            const getC = (e) => {
                const r = canvas.getBoundingClientRect();
                const sx = 794 / r.width;
                const cx = (e.clientX || (e.touches ? e.touches[0].clientX : 0)), cy = (e.clientY || (e.touches ? e.touches[0].clientY : 0));
                return { x: (cx - r.left) * sx, y: (cy - r.top) * sx };
            };
            canvas.addEventListener('pointerdown', (e) => {
                if(activeTool === 'text' || activeTool === 'image') return;
                drawing = true; const {x,y} = getC(e); lx = x; ly = y;
                activePg = canvas.parentElement.id;
                canvas.setPointerCapture(e.pointerId);
            });
            canvas.addEventListener('pointermove', (e) => {
                if(!drawing) return;
                const {x,y} = getC(e), size = document.getElementById('pen-size').value;
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.lineWidth = activeTool === 'eraser' ? size * 15 : size * 2;
                ctx.strokeStyle = activeColor;
                ctx.globalCompositeOperation = activeTool === 'eraser' ? 'destination-out' : 'source-over';
                ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(x, y); ctx.stroke();
                lx = x; ly = y;
            });
            canvas.addEventListener('pointerup', () => drawing = false);
        }

        // --- HIERARCHY HELPERS ---
        function getActiveSec() { return appData.notebooks[0].sections.find(s => s.id === activeSec); }
        function initNotebookUI() {
            document.getElementById('notebook-selector').innerHTML = `<option value="nb1">${appData.notebooks[0].name}</option>`;
            renderSections();
        }
        function renderSections() {
            document.getElementById('section-list').innerHTML = appData.notebooks[0].sections.map(s => `
                <li class="p-3 rounded-xl cursor-pointer font-bold text-xs uppercase ${s.id === activeSec ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400'}" onclick="setActiveSection('${s.id}')">${s.name}</li>
            `).join('');
        }
        function setActiveSection(id) {
            activeSec = id; renderSections();
            document.querySelectorAll('#pages-container > div').forEach(d => d.classList.add('hidden'));
            let wrap = document.getElementById('wrap-' + id);
            if(!wrap) { 
                wrap = document.createElement('div'); wrap.id = 'wrap-' + id; wrap.className = 'w-full flex flex-col items-center'; 
                document.getElementById('pages-container').appendChild(wrap); 
            }
            wrap.classList.remove('hidden'); if(getActiveSec().pages.length === 0) addA4Page();
        }
        function createSection() { let n = prompt("Section Name:"); if(n) { let id = 's'+Date.now(); appData.notebooks[0].sections.push({id, name: n, pages:[]}); setActiveSection(id); } }
        function createNotebook() { let n = prompt("Notebook Name:"); if(n) { appData.notebooks[0].name = n; initNotebookUI(); } }
        function switchNotebook() {}
        async function saveA4NotebookToVault() { alert("Section Saved to Vault!"); }
    </script>
</body>
</html>
