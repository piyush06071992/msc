<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Minerva | Classroom Notes Hub</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        
        :root { --grid-size: 30px; --page-bg: #ffffff; }
        * { -webkit-tap-highlight-color: transparent; outline: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; margin: 0; }
        
        /* A4 Page Styling */
        .a4-page {
            width: 794px; height: 1123px;
            background-color: var(--page-bg);
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin: 20px auto;
            flex-shrink: 0;
            overflow: hidden;
        }

        .watermark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.04; z-index: 1; }
        .watermark span { font-size: 6rem; font-weight: 900; transform: rotate(-45deg); white-space: nowrap; color: #000; }

        /* Grid Backgrounds */
        .bg-style-ruled { background-image: repeating-linear-gradient(transparent, transparent calc(var(--grid-size) - 1px), rgba(0,0,0,0.08) calc(var(--grid-size) - 1px), rgba(0,0,0,0.08) var(--grid-size)); }
        .bg-style-grid { background-image: linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px); background-size: var(--grid-size) var(--grid-size); }

        /* Hard Mode Layering */
        .layer { position: absolute; inset: 0; }
        #dom-container { z-index: 10; pointer-events: none; }
        #canvas-layer { z-index: 20; touch-action: none; background: transparent; }

        .mode-text #dom-container { z-index: 50; pointer-events: auto; }
        .mode-pen #canvas-layer { z-index: 50; }

        .tool-btn.active { background-color: #4f46e5 !important; color: white !important; transform: scale(1.05); }

        /* Image Drag & Resize */
        .resizable-img { position: absolute; cursor: move; border: 2px solid transparent; z-index: 40; }
        .resizable-img:hover { border-color: #4f46e5; }
        .resizer { width: 14px; height: 14px; background: #4f46e5; position: absolute; right: -7px; bottom: -7px; border-radius: 50%; cursor: nwse-resize; }

        /* Pagination Style */
        .page-footer { position: absolute; bottom: 30px; right: 40px; text-align: right; pointer-events: none; z-index: 60; }

        @media (max-width: 600px) { .a4-page { transform: scale(0.45); transform-origin: top center; margin-bottom: -550px; } }
    </style>
</head>
<body class="mode-pen">

    <div id="hub-view" class="block min-h-screen overflow-y-auto p-4 sm:p-8 bg-slate-50">
        <header class="max-w-6xl mx-auto flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='teacher-portal.html'" class="bg-white p-2 rounded-lg shadow-sm border border-slate-200">🔙</button>
                <h1 class="text-2xl font-black text-slate-900 uppercase italic">Minerva Hub</h1>
            </div>
            <button onclick="generateClassroomKey()" class="bg-amber-500 text-amber-950 px-4 py-2 rounded-xl font-black text-[10px] uppercase shadow-md">🔑 Generate Key</button>
        </header>

        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm flex flex-col justify-between">
                <div>
                    <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center text-3xl mb-6">📓</div>
                    <h2 class="text-2xl font-black uppercase text-slate-900 mb-2">Digital Notebook</h2>
                    <p class="text-sm font-medium text-slate-400 leading-relaxed mb-6">Create manual continuous-scrolling A4 worksheets, draw diagrams, and write with precision stylus control.</p>
                </div>
                <button onclick="toggleNotebook()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-sm hover:bg-emerald-600 transition-all">Open Notebook Editor ➡️</button>
            </div>

            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm space-y-4">
                <h2 class="font-black text-xl uppercase text-slate-900 mb-2">AI Animated Lecture</h2>
                <div class="space-y-3 bg-slate-50 p-4 rounded-2xl">
                    <input type="text" id="lecture-topic" class="w-full p-3 bg-white border border-slate-200 rounded-xl font-bold text-sm" placeholder="Topic name...">
                    <button onclick="generateAIPrompt()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-black uppercase text-xs">Generate AI Prompt</button>
                    <div id="prompt-output-area" class="hidden bg-slate-200 p-2 rounded-lg text-[10px] font-mono text-slate-600 relative">
                        <p id="ai-prompt-text" class="max-h-20 overflow-auto"></p>
                        <button onclick="copyPrompt()" class="mt-2 w-full bg-slate-800 text-white py-1 rounded text-[10px] font-black">COPY PROMPT</button>
                    </div>
                </div>
                <div class="pt-4 border-t border-slate-100 space-y-3">
                    <input type="text" id="lec-title" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold" placeholder="Save As Title">
                    <textarea id="lec-html" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-mono text-[10px]" placeholder="Paste Gemini's code here..."></textarea>
                    <button onclick="saveLecture()" class="w-full bg-indigo-950 text-white py-3 rounded-xl font-black uppercase text-xs shadow-lg">💾 Save AI Lecture to Vault</button>
                </div>
            </div>
        </div>

        <section class="max-w-6xl mx-auto mt-10 bg-indigo-50/50 rounded-[2.5rem] p-8 border border-indigo-100">
            <h2 class="font-black text-indigo-950 text-xl uppercase tracking-tighter mb-6">Your Unified Vault</h2>
            <div id="lecture-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
        </section>
    </div>

    <div id="notebook-view" class="hidden fixed inset-0 z-50 bg-slate-300 flex h-screen overflow-hidden">
        
        <aside id="notebook-sidebar" class="w-64 sm:w-72 bg-slate-900 text-white flex flex-col h-full flex-shrink-0 z-50 transition-all duration-300 border-r border-slate-700">
            <div class="p-5 border-b border-slate-800">
                <button onclick="toggleNotebook()" class="text-slate-500 hover:text-white font-black text-[10px] uppercase mb-6 flex items-center gap-2">🔙 Exit to Hub</button>
                <select id="notebook-selector" class="w-full bg-slate-800 text-emerald-400 font-black p-2 rounded outline-none border border-slate-700 text-sm"></select>
            </div>
            <div class="flex-1 overflow-y-auto p-4 custom-scroll">
                <div class="flex justify-between items-center mb-4 text-slate-400 px-2 uppercase text-[10px] font-black">Sections <button onclick="createSection()" class="bg-indigo-600 px-2 py-0.5 rounded text-white">+</button></div>
                <ul id="section-list" class="space-y-1"></ul>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full relative min-w-0">
            <header class="bg-white border-b border-slate-200 p-2 px-4 flex flex-col gap-2 z-50 shadow-sm shrink-0">
                <div class="flex items-center gap-2">
                    <button onclick="document.getElementById('notebook-sidebar').classList.toggle('w-0')" class="p-2 bg-slate-100 rounded-lg text-slate-600">☰</button>
                    
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                        <button onclick="setTool('pen')" id="tool-pen" class="tool-btn active px-4 py-2 rounded-lg text-[10px] font-black uppercase text-slate-700">✏️ Pen</button>
                        <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn px-4 py-2 rounded-lg text-[10px] font-black uppercase text-slate-700">🧽 Erase</button>
                        <button onclick="setTool('text')" id="tool-text" class="tool-btn px-4 py-2 rounded-lg text-[10px] font-black uppercase text-slate-700">📝 Text</button>
                        <button onclick="triggerImageUpload()" class="px-4 py-2 rounded-lg text-[10px] font-black uppercase text-slate-700 hover:bg-slate-200">🖼️ Img</button>
                    </div>

                    <input type="color" id="color-picker" onchange="updateMasterColor(this.value)" value="#0f172a" class="w-10 h-10 rounded-full cursor-pointer bg-transparent border-none">

                    <button onclick="saveToVault()" class="ml-auto bg-indigo-600 text-white px-5 py-2 rounded-xl font-black text-[10px] uppercase shadow-md">💾 Save</button>
                </div>
                
                <div class="flex items-center gap-4 px-2 text-[9px] font-black text-slate-400 uppercase">
                    <div class="flex items-center gap-2">Pen Size: <input type="range" id="pen-size" min="0.5" max="10" step="0.5" value="2" class="w-16"></div>
                    <div class="flex items-center gap-2 border-l pl-4">Grid Size: <input type="range" id="grid-size-slider" oninput="updateGridSize(this.value)" min="10" max="100" value="30" class="w-16"></div>
                    <div class="flex items-center gap-2 border-l pl-4">
                        Paper: 
                        <select onchange="setPageColor(this.value)" class="bg-white border p-1 rounded"><option value="#ffffff">White</option><option value="#fef9c3">Yellow</option><option value="#0f172a">Dark</option></select>
                        <select onchange="setPageStyle(this.value)" class="bg-white border p-1 rounded"><option value="bg-style-plain">Plain</option><option value="bg-style-ruled">Ruled</option><option value="bg-style-grid">Grid</option></select>
                    </div>
                </div>
            </header>

            <div id="a4-workspace" class="flex-1 overflow-auto custom-scroll p-4 sm:p-10 flex flex-col items-center workspace-pen">
                <div id="pages-container" class="flex flex-col items-center w-full"></div>
                <button onclick="addA4Page()" class="my-10 w-[794px] max-w-full py-8 border-4 border-dashed border-slate-400 text-slate-400 rounded-3xl font-black uppercase hover:bg-white transition-all bg-white/20">+ Add Page</button>
            </div>
        </main>
    </div>

    <input type="file" id="image-upload" accept="image/*" class="hidden">

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff')) || { dept: 'Mathematics', name: 'Piyush Rana' };
        let myLectures = [];
        let appData = { activeNotebookId: 'nb1', notebooks: [{ id: 'nb1', name: `${activeStaff.dept} Master`, sections: [{ id: 's1', name: 'Unit 1', pages: [] }] }] };
        let activeSec = 's1', activePg = '', activeTool = 'pen', activeColor = '#0f172a', pageBgStyle = 'bg-style-plain';

        window.onload = () => { fetchLectures(); initNotebookUI(); };

        // --- HUB FUNCTIONS ---
        function toggleNotebook() {
            document.getElementById('hub-view').classList.toggle('hidden');
            document.getElementById('notebook-view').classList.toggle('hidden');
            if (!document.getElementById('notebook-view').classList.contains('hidden') && getActiveSec().pages.length === 0) addA4Page();
        }
        function generateAIPrompt() {
            const t = document.getElementById('lecture-topic').value;
            if(!t) return alert("Enter topic");
            document.getElementById('ai-prompt-text').innerText = `Act as Senior Faculty at Minerva Circle. Topic: "${t}". Provide complete HTML code with Tailwind and GSAP reveal animations.`;
            document.getElementById('prompt-output-area').classList.remove('hidden');
        }
        function copyPrompt() { navigator.clipboard.writeText(document.getElementById('ai-prompt-text').innerText); alert("Copied"); }
        async function saveLecture() {
            const title = document.getElementById('lec-title').value, htmlCode = document.getElementById('lec-html').value;
            await db.collection("classroom_lectures").add({ title, htmlCode, teacherEmail: activeStaff.email, timestamp: Date.now() });
            alert("Saved"); fetchLectures();
        }
        async function fetchLectures() {
            const snap = await db.collection("classroom_lectures").where("teacherEmail", "==", activeStaff.email).orderBy("timestamp", "desc").limit(10).get();
            document.getElementById('lecture-list').innerHTML = snap.docs.map(d => `<div class="bg-white p-3 rounded-xl border flex justify-between items-center shadow-sm"><span class="font-bold text-[10px] uppercase truncate text-slate-700">${d.data().title}</span><button onclick="previewL('${d.id}')" class="text-indigo-600">👁️</button></div>`).join('');
        }
        function previewL(id) { db.collection("classroom_lectures").doc(id).get().then(d => { let w = window.open(); w.document.write(d.data().htmlCode); w.document.close(); }); }

        // --- NOTEBOOK TOOL LOGIC ---
        function setTool(t) {
            activeTool = t;
            document.body.className = `mode-${t}`;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tool-' + t).classList.add('active');
            document.getElementById('a4-workspace').className = `flex-1 overflow-auto p-4 sm:p-10 flex flex-col items-center workspace-${t}`;
        }
        function updateMasterColor(c) { activeColor = c; }
        function setPageColor(c) { document.documentElement.style.setProperty('--page-bg', c); }
        function updateGridSize(v) { document.documentElement.style.setProperty('--grid-size', v + 'px'); }
        function setPageStyle(s) { 
            pageBgStyle = s; 
            document.querySelectorAll('.a4-page').forEach(p => { p.classList.remove('bg-style-plain', 'bg-style-ruled', 'bg-style-grid'); p.classList.add(s); });
        }

        function addA4Page() {
            const wrap = document.getElementById('wrap-' + activeSec) || document.getElementById('pages-container');
            const pid = 'p' + Date.now();
            const pageNum = getActiveSec().pages.length + 1;
            getActiveSec().pages.push({ id: pid });
            const p = document.createElement('div');
            p.className = `a4-page ${pageBgStyle}`; p.id = pid;
            p.innerHTML = `
                <div class="absolute top-2 left-2 flex gap-1 z-[60] no-print">
                    <button onclick="confirmClear('${pid}')" class="bg-white/80 p-1 rounded text-[8px] font-bold">CLR</button>
                    <button onclick="confirmDelete('${pid}')" class="bg-rose-500 text-white p-1 rounded text-[8px] font-bold">DEL</button>
                </div>
                <div class="watermark"><span>Minerva Study Circle</span></div>
                <div id="dom-container" class="layer" onpointerdown="handleDomClick(event, this)"></div>
                <canvas id="canvas-layer" class="layer"></canvas>
                <div class="page-footer">
                    <p class="text-[9px] font-black text-slate-300 uppercase">${activeStaff.dept} - ${getActiveSec().name}</p>
                    <p class="text-[14px] font-black text-indigo-500/50">PAGE ${pageNum}</p>
                </div>
            `;
            wrap.appendChild(p);
            initCanvas(p.querySelector('canvas'));
            activePg = pid;
        }

        function handleDomClick(e, dom) {
            if (activeTool !== 'text') return;
            const rect = dom.getBoundingClientRect();
            const sx = 794 / rect.width, x = (e.clientX - rect.left) * sx, y = (e.clientY - rect.top) * sx;
            const t = document.createElement('div');
            t.contentEditable = true; t.className = "absolute font-bold p-2 z-[100] text-2xl outline-none min-w-[30px] bg-transparent";
            t.style.left = x + 'px'; t.style.top = y + 'px'; t.style.color = activeColor;
            dom.appendChild(t); t.focus();
            t.onblur = () => { if(t.innerText.includes('$') && window.renderMathInElement) renderMathInElement(t, { delimiters: [{left:'$$', right:'$$', display:true}] }); };
        }

        function triggerImageUpload() {
            const input = document.getElementById('image-upload');
            input.onchange = (evt) => {
                const f = evt.target.files[0]; if(!f) return;
                const r = new FileReader();
                r.onload = (ev) => insertImage(ev.target.result);
                r.readAsDataURL(f);
            };
            input.click();
        }

        function insertImage(src) {
            const container = document.getElementById(activePg) || document.querySelector('.a4-page:last-child');
            const dom = container.querySelector('#dom-container');
            const wrap = document.createElement('div');
            wrap.className = "resizable-img"; wrap.style.left = "100px"; wrap.style.top = "100px"; wrap.style.width = "300px";
            wrap.innerHTML = `<img src="${src}" class="w-full h-full rounded shadow-md pointer-events-none"><div class="resizer"></div>`;
            dom.appendChild(wrap);
            makeTransformable(wrap);
        }

        function makeTransformable(el) {
            let drg = false, res = false, sx, sy, sw, sh, sl, st;
            el.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                if(e.target.className === 'resizer') { res = true; } else { drg = true; }
                sx = e.clientX; sy = e.clientY; sw = el.offsetWidth; sh = el.offsetHeight; sl = el.offsetLeft; st = el.offsetTop;
            });
            window.addEventListener('pointermove', (e) => {
                if (!drg && !res) return;
                const dx = e.clientX - sx, dy = e.clientY - sy;
                if (drg) { el.style.left = (sl + dx) + 'px'; el.style.top = (st + dy) + 'px'; }
                if (res) { el.style.width = (sw + dx) + 'px'; el.style.height = (sh + dy) + 'px'; }
            });
            window.addEventListener('pointerup', () => { drg = false; res = false; });
        }

        function initCanvas(canvas) {
            const ctx = canvas.getContext('2d', { desynchronized: true });
            canvas.width = 794; canvas.height = 1123;
            let drw = false, lx, ly;
            const getC = (e) => { const r = canvas.getBoundingClientRect(); const s = 794/r.width; return { x: (e.clientX - r.left) * s, y: (e.clientY - r.top) * s }; };
            canvas.addEventListener('pointerdown', (e) => { if(activeTool === 'text') return; drw = true; const c = getC(e); lx = c.x; ly = c.y; canvas.setPointerCapture(e.pointerId); });
            canvas.addEventListener('pointermove', (e) => {
                if(!drw) return; const c = getC(e), sz = parseFloat(document.getElementById('pen-size').value);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.lineWidth = activeTool === 'eraser' ? sz * 15 : sz;
                ctx.strokeStyle = activeColor; ctx.globalCompositeOperation = activeTool === 'eraser' ? 'destination-out' : 'source-over';
                ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(c.x, c.y); ctx.stroke(); lx = c.x; ly = c.y;
            });
            canvas.addEventListener('pointerup', () => drw = false);
        }

        // HIERARCHY HELPERS
        function getActiveSec() { return appData.notebooks[0].sections.find(s => s.id === activeSec); }
        function initNotebookUI() { document.getElementById('notebook-selector').innerHTML = `<option value="nb1">${appData.notebooks[0].name}</option>`; renderSections(); }
        function renderSections() { document.getElementById('section-list').innerHTML = appData.notebooks[0].sections.map(s => `<li class="p-3 rounded-xl cursor-pointer font-bold text-xs uppercase ${s.id === activeSec ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400'}" onclick="setActiveSection('${s.id}')">${s.name}</li>`).join(''); }
        function setActiveSection(id) {
            activeSec = id; renderSections();
            document.querySelectorAll('#pages-container > div').forEach(d => d.classList.add('hidden'));
            let wrap = document.getElementById('wrap-' + id);
            if(!wrap) { wrap = document.createElement('div'); wrap.id = 'wrap-' + id; wrap.className = 'w-full flex flex-col items-center'; document.getElementById('pages-container').appendChild(wrap); }
            wrap.classList.remove('hidden'); if(getActiveSec().pages.length === 0) addA4Page();
        }
        function createSection() { let n = prompt("Section:"); if(n) { let id = 's'+Date.now(); appData.notebooks[0].sections.push({id, name: n, pages:[]}); setActiveSection(id); } }
        async function saveToVault() { alert("Notebook Snapshot Saved!"); }
    </script>
</body>
</html>
