<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Lesson Planner Delegation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex items-center gap-4 shadow-lg sticky top-0 z-50">
        <button onclick="window.history.back()" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
            <h1 class="text-lg sm:text-xl font-black tracking-widest uppercase">Planner Delegation</h1>
            <p class="text-[10px] text-indigo-300 font-bold uppercase tracking-widest mt-1">Manage Planner & Summary Permissions</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <div class="bg-white border-2 border-indigo-100 rounded-[2rem] p-6 sm:p-8 shadow-sm h-fit">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-2xl mb-4">🔐</div>
            <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter mb-6">Authorize Faculty</h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">1. Select Center</label>
                    <select id="center-select" onchange="populateDepartments()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer">
                        <option value="">-- Choose Center --</option>
                        <option value="GHUMARWIN">Ghumarwin</option>
                        <option value="DHARAMSHALA">Dharamshala</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">2. Select Department</label>
                    <select id="dept-select" disabled onchange="populateStaff()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer disabled:opacity-50">
                        <option value="">-- Choose Department --</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">3. Select Staff Member</label>
                    <select id="staff-select" disabled class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer disabled:opacity-50">
                        <option value="">-- Choose Faculty --</option>
                    </select>
                </div>

                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest">4. Assign Rights</label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="check-edit" class="w-5 h-5 accent-indigo-600">
                        <span class="text-xs font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Allow Syllabus Creation/Editing</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="check-summary" class="w-5 h-5 accent-indigo-600">
                        <span class="text-xs font-bold text-slate-700 group-hover:text-indigo-600 transition-colors">Allow Summary Dashboard View</span>
                    </label>
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="check-unlock" class="w-5 h-5 accent-emerald-600">
                        <span class="text-xs font-bold text-slate-700 group-hover:text-emerald-600 transition-colors">Allow Approving Teacher Unlocks (HOD)</span>
                    </label>
                </div>

                <button onclick="grantAccess()" class="w-full py-4 mt-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-black uppercase tracking-widest text-[11px] shadow-lg shadow-indigo-500/30 transition-all active:scale-95">
                    Grant Selected Permissions
                </button>
            </div>
        </div>

        <div class="bg-slate-100/50 border border-slate-200 rounded-[2rem] p-6 sm:p-8 shadow-inner">
            <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter mb-2">Active Privileges</h2>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-6">Staff with planner access</p>
            
            <div id="authorized-list" class="space-y-3">
                <div class="text-center py-10 text-slate-400 font-bold text-xs uppercase animate-pulse">Loading data...</div>
            </div>
        </div>

    </main>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", 
            authDomain: "shop-portal-bbbbb.firebaseapp.com", 
            projectId: "shop-portal-bbbbb", 
            storageBucket: "shop-portal-bbbbb.firebasestorage.app", 
            messagingSenderId: "701377739976", 
            appId: "1:701377739976:web:99998220272090e56e79fd" 
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStaff = [];

        window.onload = async () => {
            if (sessionStorage.getItem('minervaAdminAuth') !== 'true') {
                window.location.replace('admin-login.html');
                return;
            }
            await fetchStaffData();
        };

async function fetchStaffData() {
            try {
                const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
                allStaff = snap.docs.map(doc => {
                    const data = doc.data();
                    const det = data.details || {};
                    let n = data.email;
                    for (let k in det) { if (k.toLowerCase().includes('name')) n = det[k]; }
                    
                    const deptKey = Object.keys(det).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                    let d = deptKey ? det[deptKey] : 'General';
                    
                    // Identify which center the teacher belongs to
                    const centerKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                    const teacherCenter = centerKey ? String(det[centerKey]).toUpperCase() : "GHUMARWIN";

                    return { 
                        id: doc.id, 
                        name: n, 
                        dept: d,
                        center: teacherCenter,
                        canEditPlanner: data.canEditLessonPlanner || false,
                        canViewSummary: data.canViewLessonPlannerSummary || false,
                        canUnlockPlanner: data.canUnlockLessonPlanner || false
                    };
                });
                
                renderAuthorizedList();
                
                // Repopulate if center is already selected
                if (document.getElementById('center-select') && document.getElementById('center-select').value) {
                    populateDepartments();
                }
            } catch (e) { console.error(e); }
        }

        function populateDepartments() {
            const centerVal = document.getElementById('center-select').value;
            const deptSelect = document.getElementById('dept-select');
            const staffSelect = document.getElementById('staff-select');
            
            deptSelect.innerHTML = '<option value="">-- Choose Department --</option>';
            staffSelect.innerHTML = '<option value="">-- Choose Faculty --</option>';
            staffSelect.disabled = true;

            if (!centerVal) {
                deptSelect.disabled = true;
                return;
            }
            deptSelect.disabled = false;
            
            let depts = new Set();
            
            allStaff.forEach(s => {
                // Only pull departments for teachers inside the selected center
                if (s.center.includes(centerVal)) {
                    const subList = s.dept.toString().split(',');
                    subList.forEach(item => {
                        const cleanItem = item.trim();
                        if(cleanItem && cleanItem !== 'undefined' && cleanItem !== 'General') {
                            depts.add(cleanItem);
                        }
                    });
                }
            });

            deptSelect.innerHTML += '<option value="General">General</option>';
            [...depts].sort().forEach(d => {
                deptSelect.innerHTML += `<option value="${d}">${d}</option>`;
            });
        }

        function populateStaff() {
            const centerVal = document.getElementById('center-select').value;
            const deptVal = document.getElementById('dept-select').value;
            const staffSelect = document.getElementById('staff-select');
            
            staffSelect.innerHTML = '<option value="">-- Choose Faculty --</option>';
            
            if(!deptVal || !centerVal) { staffSelect.disabled = true; return; }
            staffSelect.disabled = false;

            allStaff.filter(s => s.center.includes(centerVal) && s.dept.toString().includes(deptVal))
                    .sort((a,b) => a.name.localeCompare(b.name))
                    .forEach(s => {
                        staffSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                    });
        }

        async function grantAccess() {
            const centerVal = document.getElementById('center-select').value;
            const staffId = document.getElementById('staff-select').value;
            const editRight = document.getElementById('check-edit').checked;
            const summaryRight = document.getElementById('check-summary').checked;
            const unlockRight = document.getElementById('check-unlock').checked; 

            if(!centerVal) return alert("Please select a center.");
            if(!staffId) return alert("Please select a faculty member.");
            if(!editRight && !summaryRight && !unlockRight) return alert("Please select at least one permission.");

            try {
                // Save branch name if checked, else save false
                await db.collection("staff_applications").doc(staffId).update({
                    canEditLessonPlanner: editRight ? centerVal : false,
                    canViewLessonPlannerSummary: summaryRight ? centerVal : false,
                    canUnlockLessonPlanner: unlockRight ? centerVal : false 
                });
                alert("Permissions updated!");
                location.reload();
            } catch (e) { alert("Error: " + e.message); }
        }

        async function revokeAccess(staffId) {
            if(!confirm("Revoke all Lesson Planner access for this member?")) return;
            try {
                await db.collection("staff_applications").doc(staffId).update({
                    canEditLessonPlanner: false,
                    canViewLessonPlannerSummary: false,
                    canUnlockLessonPlanner: false 
                });
                location.reload();
            } catch (e) { alert("Error: " + e.message); }
        }

        function renderAuthorizedList() {
            const listArea = document.getElementById('authorized-list');
            const authorized = allStaff.filter(s => s.canEditPlanner || s.canViewSummary || s.canUnlockPlanner);

            if (authorized.length === 0) {
                listArea.innerHTML = `<div class="bg-white border-2 border-dashed border-slate-200 p-6 rounded-2xl text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">No delegates found.</div>`;
                return;
            }

            listArea.innerHTML = authorized.map(s => {
                // Determine branch text dynamically based on what permission they hold
                let branchText = 'Global';
                if (typeof s.canEditPlanner === 'string') branchText = s.canEditPlanner;
                else if (typeof s.canViewSummary === 'string') branchText = s.canViewSummary;
                else if (typeof s.canUnlockPlanner === 'string') branchText = s.canUnlockPlanner;

                return `
                <div class="bg-white border border-slate-200 p-4 rounded-xl flex justify-between items-center shadow-sm">
                    <div>
                        <div class="flex items-center gap-2">
                            <h3 class="font-black text-slate-800 text-sm uppercase tracking-tighter">${s.name}</h3>
                            <span class="bg-indigo-100 text-indigo-700 text-[8px] px-1.5 py-0.5 rounded font-black uppercase">${branchText}</span>
                        </div>
                        <div class="flex flex-wrap gap-2 mt-1">
                            ${s.canEditPlanner ? '<span class="text-[7px] font-black bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full uppercase tracking-tighter">Syllabus Editor</span>' : ''}
                            ${s.canViewSummary ? '<span class="text-[7px] font-black bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full uppercase tracking-tighter">Summary Viewer</span>' : ''}
                            ${s.canUnlockPlanner ? '<span class="text-[7px] font-black bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-full uppercase tracking-tighter">Unlock Approver</span>' : ''}
                        </div>
                    </div>
                    <button onclick="revokeAccess('${s.id}')" class="bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white px-4 py-2 rounded-lg font-black text-[9px] uppercase tracking-widest transition-colors shadow-sm border border-rose-100">
                        Revoke
                    </button>
                </div>
            `}).join('');
        }
    </script>
</body>
</html>
