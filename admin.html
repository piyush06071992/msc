        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>

    // --- NEW: LEAVE NOTICE BOARD FOR ADMIN ---
        async function loadLeaveNoticeBoard() {
            const center = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            
            // --- CACHE STAFF DEPARTMENTS TO SAVE READS ---
            let staffDeptMap = JSON.parse(sessionStorage.getItem('minervaStaffDepts_' + center)) || {};
            if (Object.keys(staffDeptMap).length === 0) {
                try {
                    const staffSnap = await db.collection("staff_applications").where("status", "==", "approved").get();
                    staffSnap.forEach(d => {
                        const data = d.data();
                        const dept = data.details?.Department || data.details?.Subject || data.dept || "General";
                        staffDeptMap[(data.email || "").toLowerCase()] = dept;
                    });
                    sessionStorage.setItem('minervaStaffDepts_' + center, JSON.stringify(staffDeptMap));
                } catch(e) { console.error("Error fetching staff depts", e); }
            }
            
            const d = new Date();
            const todayIso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            db.collection(prefix + "leave_requests")
              .where("endDate", ">=", todayIso)
              .onSnapshot(snap => {
                  const board = document.getElementById('leave-notice-board');
                  if (!board) return;

               let records = [];
                  let todayCount = 0;
                  let upcomingCount = 0;

                  snap.forEach(doc => {
                      const data = doc.data();
                      if (data.status === "APPROVED" || data.status === "PENDING") {
                          records.push(data);
                          
                          // Count Today vs Upcoming
                          if (todayIso >= data.startDate && todayIso <= data.endDate) {
                              todayCount++;
                          } else if (data.startDate > todayIso) {
                              upcomingCount++;
                          }
                      }
                  });

                  // Update UI counts
                  const countTodayEl = document.getElementById('leave-count-today');
                  const countUpcomingEl = document.getElementById('leave-count-upcoming');
                  if(countTodayEl) countTodayEl.innerText = `Today: ${todayCount}`;
                  if(countUpcomingEl) countUpcomingEl.innerText = `Upcoming: ${upcomingCount}`;

                  if (records.length === 0) {
                      board.innerHTML = `<div class="text-center py-6"><p class="text-2xl mb-2">🌴</p><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">No active or upcoming leaves.</p></div>`;
                      return;
                  }

                  records.sort((a,b) => a.startDate.localeCompare(b.startDate));

let html = "";
                  records.forEach(req => {
                      const sDate = new Date(req.startDate + "T00:00:00").toLocaleDateString('en-GB', {day:'numeric', month:'short'});
                      const eDate = new Date(req.endDate + "T00:00:00").toLocaleDateString('en-GB', {day:'numeric', month:'short'});
                      const dateStr = req.startDate === req.endDate ? sDate : `${sDate} - ${eDate}`;
                      
                     // Lookup department from cache
                      const reqDept = staffDeptMap[(req.teacherEmail || "").toLowerCase()] || req.department || "General";

                      // Bulletproof Time Badge Logic
                      let timeBadge = "FULL DAY";
                      if (req.startTime && req.endTime && req.type && req.type !== "FULL") {
                          const format12 = (t24) => {
                              let [h, m] = t24.split(':');
                              let ampm = h >= 12 ? 'PM' : 'AM';
                              h = h % 12 || 12;
                              return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
                          };
                          timeBadge = `${format12(req.startTime)} - ${format12(req.endTime)}`;
                      } else if (req.type && req.type !== "FULL") {
                          timeBadge = req.type.replace('_', ' ') + " LEAVE";
                      }

                      let statusPill = req.status === 'APPROVED' ? `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest border border-emerald-200 shadow-sm">Approved</span>` : `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest border border-amber-200 shadow-sm">Pending Auth</span>`;

                      let adjHtml = "";
                      if (req.adjustments && req.adjustments.length > 0) {
                          req.adjustments.forEach(adj => {
                              let subStatus = `<span class="text-[8px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-black uppercase shadow-sm">Pending</span>`;
                              if (adj.substituteResponse === "ACCEPTED") subStatus = `<span class="text-[8px] bg-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded font-black uppercase shadow-sm border border-emerald-300">Accepted</span>`;
                              if (adj.substituteResponse === "DECLINED") subStatus = `<span class="text-[8px] bg-rose-200 text-rose-800 px-1.5 py-0.5 rounded font-black uppercase shadow-sm border border-rose-300">Declined</span>`;
                              
                              adjHtml += `
                                <div class="flex justify-between items-center bg-white p-2.5 rounded-lg border border-slate-200 mb-1.5 shadow-sm">
                                    <div class="flex flex-col leading-tight">
                                        <span class="text-[10px] font-black text-slate-800 uppercase tracking-tighter">${adj.sub}</span>
                                        <span class="text-[8px] font-bold text-slate-500 uppercase mt-0.5">${adj.title} (${adj.date})</span>
                                    </div>
                                    <div class="flex flex-col items-end gap-1">
                                        <span class="text-[9px] font-black text-sky-700 uppercase">Sub: ${adj.adjustedTo || "Admin"}</span>
                                        ${subStatus}
                                    </div>
                                </div>
                              `;
                          });
                      } else {
                          adjHtml = `<p class="text-[9px] font-bold text-slate-400 uppercase italic p-3 text-center bg-slate-50 rounded-lg border border-slate-100">No classes require substitution.</p>`;
                      }

                      html += `
                        <details class="bg-white rounded-xl border border-slate-200 shadow-sm transition-all group overflow-hidden">
                            <summary class="p-3.5 flex justify-between items-center cursor-pointer outline-none hover:bg-slate-50">
<div>
                                    <h4 class="font-black text-slate-800 text-sm uppercase tracking-tighter">${req.teacherName}</h4>
                                    <div class="flex items-center gap-2 mt-1 flex-wrap">
                                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">${reqDept}</span>
                                        <p class="text-[10px] font-bold text-slate-500 uppercase">${dateStr}</p>
                                        <span class="text-[9px] font-black text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-200 tracking-widest uppercase shadow-sm">${timeBadge}</span>
                                        ${statusPill}
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                    <span class="text-[9px] font-black text-sky-600 bg-sky-50 px-3 py-1.5 rounded uppercase group-open:hidden border border-sky-100 shadow-sm">View Details</span>
                                    <span class="text-[10px] text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                                </div>
                            </summary>
                            <div class="p-3 bg-slate-50/80 border-t border-slate-100">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Class Adjustments</p>
                                ${adjHtml}
                            </div>
                        </details>
                      `;
                  });

                board.innerHTML = html;
              }, error => console.error("Notice board error:", error));
        }
        loadLeaveNoticeBoard();

        // --- NEW: THE EXAM WATCHTOWER ---
        function listenForUnconfiguredExams() {
            const center = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";

            const offset = new Date().getTimezoneOffset() * 60000;
            const todayIso = new Date(Date.now() - offset).toISOString().split('T')[0];

            // 1. Listen for any upcoming exams that have been staged
            db.collection(prefix + "exam_schedules").where("date", ">=", todayIso).onSnapshot(async (examSnap) => {
                const banner = document.getElementById('unconfigured-exams-banner');
                if (examSnap.empty) {
                    if(banner) banner.classList.add('hidden');
                    return;
                }

                // Group exams by date
                const examsByDate = {};
                examSnap.docs.forEach(doc => {
                    const data = doc.data();
                    if (!examsByDate[data.date]) examsByDate[data.date] = [];
                    examsByDate[data.date].push(data);
                });

               let missingData = {}; 
                const SPECIAL_EXAMS = ['EXAM', 'UT', 'OT', 'TERMINAL EXAMS', 'PREBOARD', 'BOARD EXAM'];
                const norm = str => (str||"").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

                // 2. Cross-reference each date with the Timetable History
                for (const date of Object.keys(examsByDate)) {
                    try {
                        const historyDoc = await db.collection(prefix + "timetable_history").doc(date).get();
                        let historySchedule = [];
                        
                        if (historyDoc.exists) {
                            historySchedule = historyDoc.data().schedule || [];
                        }

                        // Check if the specific sections scheduled for the exam actually have "EXAM" or "UT/OT" slots on that day
                        examsByDate[date].forEach(examReq => {
                            const secSlots = historySchedule.filter(s => norm(s.className) === norm(examReq.className) && norm(s.section) === norm(examReq.section));
                            const hasExamSlot = secSlots.some(s => SPECIAL_EXAMS.includes((s.subject || "").toUpperCase()));

                            // If no exam slot exists, the timetable hasn't been generated for this section!
                            if (!hasExamSlot) {
                                if (!missingData[date]) missingData[date] = {};
                                const safeType = examReq.type || "EXAM";
                                if (!missingData[date][safeType]) missingData[date][safeType] = {};
                                if (!missingData[date][safeType][examReq.className]) missingData[date][safeType][examReq.className] = [];
                                
                                if (!missingData[date][safeType][examReq.className].includes(examReq.section)) {
                                    missingData[date][safeType][examReq.className].push(examReq.section);
                                }
                            }
                        });
                    } catch(e) { console.error("Watchtower Error:", e); }
                }

                // 3. Trigger the Banner UI
                const list = document.getElementById('unconfigured-exams-list');
                if (banner && list) {
                    // Update banner classes so the button aligns nicely with the large blocks
                    banner.classList.replace('sm:items-center', 'sm:items-start');

                    if (Object.keys(missingData).length > 0) {
                        let html = '<div class="flex flex-col gap-3 w-full mt-3">';
                        Object.keys(missingData).sort().forEach(d => {
                            const shortDate = new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
                            html += `<div class="bg-rose-900/40 rounded-xl p-4 border border-rose-500/50 shadow-inner w-full">
                                        <div class="font-black text-rose-50 text-sm sm:text-base mb-3 pb-2 border-b border-rose-500/50 flex items-center gap-2">
                                            <span>📅</span> ${shortDate}
                                        </div>
                                        <div class="flex flex-col gap-3">`;
                            
                            Object.keys(missingData[d]).sort().forEach(type => {
                                Object.keys(missingData[d][type]).sort((a,b) => a.localeCompare(b, undefined, {numeric: true})).forEach(cls => {
                                    const secs = missingData[d][type][cls].sort().map(sec => 
                                        `<span class="bg-rose-500 border border-rose-400 text-white text-[10px] px-2.5 py-1 rounded-md shadow-sm font-bold uppercase tracking-widest whitespace-nowrap">Sec ${sec}</span>`
                                    ).join('');
                                    
                                    const typeColor = type.toUpperCase() === 'OT' ? 'bg-amber-400 text-amber-900' : 'bg-sky-400 text-sky-900';

                                    html += `<div class="flex flex-col sm:flex-row sm:items-start gap-2 sm:gap-3">
                                                <div class="flex items-center gap-1.5 shrink-0">
                                                    <span class="${typeColor} text-[9px] font-black px-2 py-1 rounded shadow-sm uppercase tracking-widest min-w-[36px] text-center">${type}</span>
                                                    <span class="bg-rose-100 text-rose-800 text-[10px] font-black px-2 py-1 rounded uppercase tracking-widest min-w-[75px] text-center shadow-sm">Class ${cls}</span>
                                                </div>
                                                <div class="flex flex-wrap gap-1.5 items-center mt-0.5 sm:mt-0">${secs}</div>
                                             </div>`;
                                });
                            });
                            
                            html += `</div></div>`;
                        });
                        html += '</div>';

                        // Wipe the old restricted classes so the new layout spans correctly
                        list.className = "w-full";
                        list.innerHTML = html;
                        banner.classList.remove('hidden');
                        banner.classList.add('flex');
                    } else {
                        banner.classList.add('hidden');
                        banner.classList.remove('flex');
                    }
                }
            });
        }
        listenForUnconfiguredExams();
