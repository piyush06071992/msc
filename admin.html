<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Minerva</title>
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#1e40af">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 sm:p-8 flex flex-col relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <header class="w-full max-w-6xl mx-auto flex justify-between items-center glass-card p-4 sm:px-6 rounded-2xl shadow-sm mb-8 z-10">
        <div class="flex items-center gap-3">
            <img src="logo.png?v=2" alt="Minerva Logo" class="w-10 h-10 sm:w-12 sm:h-12 object-contain bg-white rounded-xl shadow-sm border border-slate-100 p-1">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Admin Portal</h1>
                <p class="text-xs sm:text-sm text-blue-600 font-medium">Minerva Study Circle</p>
            </div>
        </div>
        <button onclick="logout()" class="flex items-center gap-2 text-slate-500 hover:text-red-600 font-bold text-sm transition-colors px-4 py-2.5 rounded-xl hover:bg-red-50 border border-transparent hover:border-red-100 shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span class="hidden sm:inline">Logout</span>
        </button>
    </header>

    <main class="w-full max-w-6xl mx-auto flex-1 flex flex-col z-10">
        <div class="mb-10 px-2">
            <h2 id="admin-greeting" class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">
                Welcome Admin: <span id="admin-name-display" class="text-blue-700 block sm:inline">...</span>
            </h2>
            <div class="flex items-center gap-2 mt-4 text-slate-500">
                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold uppercase tracking-wider">Management Hub</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">

            <!-- EXISTING BUTTONS ABOVE -->

            <!-- NEW ROOM MANAGEMENT BUTTON -->
            <button onclick="window.location.href='admin-rooms.html'" class="group relative overflow-hidden glass-card rounded-[2.5rem] p-8 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-left border-2 border-transparent hover:border-sky-400">
                <div class="relative z-10">
                    <div class="bg-gradient-to-br from-sky-500 to-blue-700 w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg mb-6 transform group-hover:rotate-3 transition-transform">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10l9-7 9 7v10a2 2 0 01-2 2h-4a2 2 0 01-2-2v-4H9v4a2 2 0 01-2 2H3a2 2 0 01-2-2V10z"/>
                        </svg>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2 leading-tight">Room Management</h3>
                    <p class="text-slate-500 text-sm leading-relaxed">Create, assign and manage classrooms and availability.</p>
                </div>
            </button>

        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const authStatus = sessionStorage.getItem('minervaAdminAuth');
        const adminEmail = sessionStorage.getItem('minervaAdminEmail');

        if (authStatus !== 'true') {
            window.location.replace('admin-login.html');
        } else {
            let exactName = "Admin";
            if (adminEmail === "rakeshchandel1990@gmail.com") {
                exactName = "Rakesh Chandel";
            } else if (adminEmail === "info.minervastudycircle@gmail.com") {
                exactName = "Prashant Patial";
            } else {
                exactName = sessionStorage.getItem('minervaAdminName') || "Admin";
            }
            document.getElementById('admin-name-display').innerText = exactName;
        }

        function listenForPendingRequests() {
            db.collection("staff_applications").where("status", "==", "pending")
              .onSnapshot((snapshot) => {
                  const badge = document.getElementById('pending-badge');
                  const countSpan = document.getElementById('pending-count');
                  if (snapshot.size > 0) {
                      badge.classList.remove('hidden');
                      countSpan.innerText = snapshot.size;
                  } else { badge.classList.add('hidden'); }
              });
        }
        listenForPendingRequests();

        function logout() {
            sessionStorage.clear();
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
