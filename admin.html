<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Minerva</title>
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#0f172a">
    <script src="tailwind-engine.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .pulse-red { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="overflow-hidden bg-slate-50">

    <div class="flex h-screen w-full relative">
        <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
            <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        </div>

        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-[150] hidden md:hidden backdrop-blur-sm transition-opacity"></div>

        <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-slate-900 text-white transform -translate-x-full md:translate-x-0 md:relative transition-transform duration-300 z-[200] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="logo.png?v=2" alt="Minerva" class="w-10 h-10 bg-white rounded-xl p-1">
                    <h2 class="font-black text-xl tracking-widest uppercase text-sky-400">Minerva</h2>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white">✕</button>
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scroll">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest px-2 mb-2 mt-4">Main Menu</p>
                <a href="#" class="flex items-center gap-3 bg-sky-600 text-white px-4 py-3 rounded-xl font-bold text-sm shadow-md">
                    <span class="text-lg">📊</span> Dashboard
                </a>
                <a href="admin-settings.html" class="flex items-center gap-3 text-slate-400 hover:text-white hover:bg-slate-800 px-4 py-3 rounded-xl font-bold text-sm transition-colors">
                    <span class="text-lg">⚙️</span> Settings
                </a>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white px-4 py-3 rounded-xl font-black text-sm uppercase tracking-widest transition-all border border-rose-500/20 hover:border-transparent">Log Out</button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col h-screen overflow-y-auto custom-scroll relative z-10">
            <header class="p-4 sm:p-6 lg:p-8 flex justify-between items-center sticky top-0 bg-slate-50/80 backdrop-blur-md z-50 border-b border-slate-200/50">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="md:hidden p-2 bg-white rounded-lg shadow-sm border border-slate-200 text-slate-600 hover:bg-slate-50">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight leading-none">Welcome, <span id="admin-name-display" class="text-sky-600">Admin</span></h1>
                        <div class="flex items-center gap-3 mt-1.5">
                            <span class="text-[10px] sm:text-xs font-bold text-slate-500 uppercase tracking-widest bg-slate-200 px-2 py-0.5 rounded">Management Hub</span>
                            <select id="global-center-switch" onchange="switchAdminCenter(this.value)" class="text-[10px] sm:text-xs font-black text-sky-700 bg-sky-50 border border-sky-200 outline-none rounded px-2 py-0.5 cursor-pointer uppercase tracking-widest shadow-sm">
                                <option value="GHUMARWIN">📍 Ghumarwin</option>
                                <option value="DHARAMSHALA">📍 Dharamshala</option>
                            </select>
                        </div>
                    </div>
                </div>
            </header>

            <main class="p-4 sm:p-6 lg:p-8 flex-1">
                <div id="compliance-alert-area" class="max-w-4xl mx-auto mb-8 hidden">
                    <div class="bg-rose-50 border border-rose-200 p-6 rounded-2xl flex items-center justify-between shadow-sm">
                        <div>
                            <h3 class="font-black text-rose-800 uppercase text-xs tracking-widest mb-1">🚨 Missing Daily Reports</h3>
                            <p id="compliance-msg" class="text-[10px] font-bold text-rose-600 mt-1 uppercase"></p>
                        </div>
                        <button onclick="notifyMissingStaff()" class="bg-rose-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-rose-700">Notify All</button>
                    </div>
                </div>

                <div class="bg-white border-2 border-sky-100 rounded-2xl shadow-sm overflow-hidden flex flex-col mb-8 max-w-4xl">
                    <div class="bg-sky-50 p-4 border-b border-sky-100 flex items-center justify-between shrink-0">
                        <h3 class="font-black text-sky-900 text-sm uppercase tracking-widest flex items-center gap-2">
                            <span class="text-xl">📢</span> Staff Leave & Substitutions
                        </h3>
                    </div>
                    <div id="leave-notice-board" class="p-3 overflow-y-auto custom-scroll flex-1 space-y-2 bg-slate-50/50 max-h-[280px]"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const db = firebase.firestore();

        // 1. GLOBAL HELPER AT THE TOP
        function getCollection(name) {
            const activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
            const globalCollections = ['configs', 'staff_applications', 'system_metadata', 'daily_reports', 'timetable_history'];
            if (globalCollections.includes(name)) return db.collection(name);
            if (activeCenter === "GHUMARWIN") return db.collection(name);
            return db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        // 2. AUDITOR LOGIC
        async function runComplianceAudit() {
            try {
                let lwd = new Date();
                lwd.setDate(lwd.getDate() - 1);
                // Simple skip Sunday (0)
                while(lwd.getDay() === 0) { lwd.setDate(lwd.getDate() - 1); }
                const lwdStr = lwd.toISOString().split('T')[0];
                window.lwdStr = lwdStr;

                const staffSnap = await getCollection("staff_applications").where("status", "==", "approved").get();
                const reportsSnap = await getCollection("daily_reports").where("date", "==", lwdStr).get();
                
                const allStaff = staffSnap.docs.map(d => {
                    const data = d.data();
                    const name = (data.details && data.details.name) ? data.details.name : (data.name || data.email);
                    return { email: data.email, name: name };
                });
                
                const submittedEmails = reportsSnap.docs.map(d => d.data().teacherEmail);
                const missingStaff = allStaff.filter(s => !submittedEmails.includes(s.email));

                if (missingStaff.length > 0) {
                    document.getElementById('compliance-alert-area').classList.remove('hidden');
                    document.getElementById('compliance-msg').innerText = `Missing reports for ${lwdStr}: ${missingStaff.map(s => s.name).join(', ')}`;
                    window.missingReportStaff = missingStaff;
                }
            } catch(e) { console.error("Audit Error:", e); }
        }

        function notifyMissingStaff() {
            if(!window.missingReportStaff) return;
            const emails = window.missingReportStaff.map(s => s.email).join(',');
            window.location.href = `mailto:${emails}?subject=Missing Daily Report for ${window.lwdStr}&body=Please submit your daily end-of-day report for ${window.lwdStr} immediately.`;
        }

        // --- APP INITIALIZATION ---
        const authStatus = sessionStorage.getItem('minervaAdminAuth');
        const adminEmail = sessionStorage.getItem('minervaAdminEmail');

        if (authStatus !== 'true') { window.location.replace('admin-login.html'); }
        else {
            let exactName = sessionStorage.getItem('minervaAdminName') || "Admin";
            document.getElementById('admin-name-display').innerText = exactName;
            let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
            document.getElementById('global-center-switch').value = activeCenter;
            
            // Run startup functions
            runComplianceAudit();
            listenForPendingRequests();
            loadLeaveNoticeBoard();
        }

        function switchAdminCenter(centerName) {
            sessionStorage.setItem('minervaAdminCenter', centerName);
            window.location.reload(); 
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function listenForPendingRequests() {
            db.collection("staff_applications").where("status", "==", "pending")
              .onSnapshot((snapshot) => {
                  const badge = document.getElementById('pending-badge');
                  const countSpan = document.getElementById('pending-count');
                  if (snapshot.size > 0) { badge.classList.remove('hidden'); countSpan.innerText = snapshot.size; } 
                  else { badge.classList.add('hidden'); }
              });
        }

        function loadLeaveNoticeBoard() {
            const center = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            const d = new Date();
            const todayIso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            db.collection(prefix + "leave_requests")
              .where("endDate", ">=", todayIso)
              .onSnapshot(snap => {
                  const board = document.getElementById('leave-notice-board');
                  if (!board) return;
                  let records = [];
                  snap.forEach(doc => { const data = doc.data(); if (data.status === "APPROVED" || data.status === "PENDING") { records.push(data); } });

                  if (records.length === 0) {
                      board.innerHTML = `<div class="text-center py-6"><p class="text-2xl mb-2">🌴</p><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">No active or upcoming leaves.</p></div>`;
                      return;
                  }

                  records.sort((a,b) => a.startDate.localeCompare(b.startDate));
                  let html = "";
                  records.forEach(req => {
                      const sDate = new Date(req.startDate + "T00:00:00").toLocaleDateString('en-GB', {day:'numeric', month:'short'});
                      const eDate = new Date(req.endDate + "T00:00:00").toLocaleDateString('en-GB', {day:'numeric', month:'short'});
                      const dateStr = req.startDate === req.endDate ? sDate : `${sDate} - ${eDate}`;
                      let statusPill = req.status === 'APPROVED' ? `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest border border-emerald-200 shadow-sm">Approved</span>` : `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest border border-amber-200 shadow-sm">Pending Auth</span>`;
                      let adjHtml = "";
                      if (req.adjustments && req.adjustments.length > 0) {
                          req.adjustments.forEach(adj => {
                              let subStatus = `<span class="text-[8px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-black uppercase shadow-sm">Pending</span>`;
                              if (adj.substituteResponse === "ACCEPTED") subStatus = `<span class="text-[8px] bg-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded font-black uppercase shadow-sm border border-emerald-300">Accepted</span>`;
                              if (adj.substituteResponse === "DECLINED") subStatus = `<span class="text-[8px] bg-rose-200 text-rose-800 px-1.5 py-0.5 rounded font-black uppercase shadow-sm border border-rose-300">Declined</span>`;
                              adjHtml += `<div class="flex justify-between items-center bg-white p-2.5 rounded-lg border border-slate-200 mb-1.5 shadow-sm"><div class="flex flex-col leading-tight"><span class="text-[10px] font-black text-slate-800 uppercase tracking-tighter">${adj.sub}</span><span class="text-[8px] font-bold text-slate-500 uppercase mt-0.5">${adj.title} (${adj.date})</span></div><div class="flex flex-col items-end gap-1"><span class="text-[9px] font-black text-sky-700 uppercase">Sub: ${adj.adjustedTo || "Admin"}</span>${subStatus}</div></div>`;
                          });
                      } else { adjHtml = `<p class="text-[9px] font-bold text-slate-400 uppercase italic p-3 text-center bg-slate-50 rounded-lg border border-slate-100">No classes require substitution.</p>`; }

                      html += `
                        <details class="bg-white rounded-xl border border-slate-200 shadow-sm transition-all group overflow-hidden">
                            <summary class="p-3.5 flex justify-between items-center cursor-pointer outline-none hover:bg-slate-50">
                                <div><h4 class="font-black text-slate-800 text-sm uppercase tracking-tighter">${req.teacherName}</h4><div class="flex items-center gap-2 mt-1"><p class="text-[10px] font-bold text-slate-500 uppercase">${dateStr}</p>${statusPill}</div></div>
                                <div class="flex items-center gap-2 shrink-0"><span class="text-[9px] font-black text-sky-600 bg-sky-50 px-3 py-1.5 rounded uppercase group-open:hidden border border-sky-100 shadow-sm">View Details</span><span class="text-[10px] text-slate-400 group-open:rotate-180 transition-transform">▼</span></div>
                            </summary>
                            <div class="p-3 bg-slate-50/80 border-t border-slate-100"><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Class Adjustments</p>${adjHtml}</div>
                        </details>`;
                  });
                  board.innerHTML = html;
              }, error => console.error("Notice board error:", error));
        }

        function logout() { sessionStorage.clear(); window.location.replace('index.html'); }
    </script>
</body>
</html>
