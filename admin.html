<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Minerva</title>
    
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#1e40af">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Premium Frosted Glass Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 sm:p-8 flex flex-col relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <header class="w-full max-w-6xl mx-auto flex justify-between items-center glass-card p-4 sm:px-6 rounded-2xl shadow-sm mb-8 z-10">
        <div class="flex items-center gap-3">
            <img src="/logo.png?v=2" alt="Minerva Logo" class="w-10 h-10 sm:w-12 sm:h-12 object-contain bg-white rounded-xl shadow-sm border border-slate-100 p-1">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Admin Portal</h1>
                <p class="text-xs sm:text-sm text-blue-600 font-medium">Minerva Study Circle</p>
            </div>
        </div>
        
        <button onclick="logout()" class="flex items-center gap-2 text-slate-500 hover:text-red-600 font-bold text-sm transition-colors px-4 py-2.5 rounded-xl hover:bg-red-50 border border-transparent hover:border-red-100">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span class="hidden sm:inline">Logout</span>
        </button>
    </header>

    <main class="w-full max-w-6xl mx-auto flex-1 flex flex-col z-10">
        
        <div class="mb-8 px-2">
            <h2 id="greeting-title" class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Workspace</h2>
            <p class="text-slate-500 mt-2 text-base sm:text-lg">Select an action module below to manage the institute.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <button onclick="window.location.href='staff-register.html'" class="group relative overflow-hidden glass-card rounded-[2rem] p-8 shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5 text-left border-2 border-transparent hover:border-indigo-300">
                
                <div class="absolute -right-8 -top-8 w-32 h-32 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-20 group-hover:opacity-50 transition-opacity duration-300"></div>
                
                <div class="relative z-10">
                    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 w-16 h-16 sm:w-20 sm:h-20 rounded-2xl flex items-center justify-center shadow-md mb-6 transform group-hover:scale-105 transition-transform duration-300">
                        <svg class="w-8 h-8 sm:w-10 sm:h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                        </svg>
                    </div>
                    
                    <h3 class="text-2xl font-bold text-slate-800 mb-3 group-hover:text-indigo-700 transition-colors">Staff Registration</h3>
                    <p class="text-slate-500 text-sm sm:text-base leading-relaxed">
                        Add new teachers and staff members to the Minerva system, assign their roles, and generate login credentials.
                    </p>
                </div>
                
                <div class="absolute bottom-8 right-8 opacity-0 group-hover:opacity-100 transform translate-x-2 group-hover:translate-x-0 transition-all duration-300">
                    <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </div>
            </button>

        </div>
    </main>

    <script>
        // Check if the user went through the login page
        if (sessionStorage.getItem('minervaAdminAuth') !== 'true') {
            // Kick them out to the login page immediately
            window.location.replace('admin-login.html');
        } else {
            // Personalize the greeting with the Admin's name
            const adminName = sessionStorage.getItem('minervaAdminName');
            if (adminName) {
                document.getElementById('greeting-title').innerText = `Workspace - ${adminName}`;
            }
        }
        
        // Update the Logout button to clear security clearance
        function logout() {
            sessionStorage.removeItem('minervaAdminAuth');
            sessionStorage.removeItem('minervaAdminName');
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
