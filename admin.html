<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Admin Dashboard | Minerva</title>
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#0f172a">
 <script src="tailwind-engine.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const authStatus = sessionStorage.getItem('minervaAdminAuth');
        const adminEmail = sessionStorage.getItem('minervaAdminEmail');
        
     if (authStatus !== 'true') { 
            window.location.replace('admin-login.html'); 
        } else {
            let exactName = "Admin";
            if (adminEmail === "rakeshchandel1990@gmail.com") {
                exactName = "Rakesh Chandel";
            } else if (adminEmail === "info.minervastudycircle@gmail.com") {
                exactName = "Prashant Patial";
            } else {
                exactName = sessionStorage.getItem('minervaAdminName') || "Admin";
            }
            document.getElementById('admin-name-display').innerText = exactName;
            
            // --- MULTI-CENTER INITIALIZATION ---
            let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
            sessionStorage.setItem('minervaAdminCenter', activeCenter); // Ensure it's safely stored
            const dropdown = document.getElementById('global-center-switch');
            if(dropdown) dropdown.value = activeCenter;
        }

        // --- MULTI-CENTER SWITCHER LOGIC ---
        function switchAdminCenter(centerName) {
            sessionStorage.setItem('minervaAdminCenter', centerName);
            window.location.reload(); // Instantly reload to fetch the new center's data
        }

        // Sidebar Toggle Logic
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Pending Requests Listener
        function listenForPendingRequests() {
            db.collection("staff_applications").where("status", "==", "pending")
              .onSnapshot((snapshot) => {
                  const badge = document.getElementById('pending-badge');
                  const countSpan = document.getElementById('pending-count');
                  if (snapshot.size > 0) {
                      badge.classList.remove('hidden');
                      countSpan.innerText = snapshot.size;
                  } else { badge.classList.add('hidden'); }
              });
        }
        listenForPendingRequests();

        function logout() { 
            sessionStorage.clear(); 
            window.location.replace('index.html'); 
        }
    </script>
