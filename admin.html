<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Minerva</title>
    
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#1e40af">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* Pulse animation for the live counter */
        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 sm:p-8 flex flex-col relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <header class="w-full max-w-6xl mx-auto flex justify-between items-center glass-card p-4 sm:px-6 rounded-2xl shadow-sm mb-8 z-10">
        <div class="flex items-center gap-3">
            <img src="/logo.png?v=2" alt="Minerva Logo" class="w-10 h-10 sm:w-12 sm:h-12 object-contain bg-white rounded-xl shadow-sm border border-slate-100 p-1">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Admin Portal</h1>
                <p class="text-xs sm:text-sm text-blue-600 font-medium">Minerva Study Circle</p>
            </div>
        </div>
        
        <button onclick="logout()" class="flex items-center gap-2 text-slate-500 hover:text-red-600 font-bold text-sm transition-colors px-4 py-2.5 rounded-xl hover:bg-red-50 border border-transparent hover:border-red-100 shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            <span class="hidden sm:inline">Logout</span>
        </button>
    </header>

    <main class="w-full max-w-6xl mx-auto flex-1 flex flex-col z-10">
        
        <div class="mb-10 px-2">
            <h2 id="admin-greeting" class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">
                Welcome Admin: <span id="admin-name-display" class="text-blue-700 block sm:inline">User</span>
            </h2>
            <div class="flex items-center gap-2 mt-4 text-slate-500">
                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold uppercase tracking-wider">Staff Management Hub</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
            
            <button onclick="window.location.href='staff-form-builder.html'" class="group relative overflow-hidden glass-card rounded-[2.5rem] p-8 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-left border-2 border-transparent hover:border-indigo-400">
                <div class="relative z-10">
                    <div class="bg-gradient-to-br from-indigo-500 to-indigo-700 w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg mb-6 transform group-hover:rotate-3 transition-transform">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2 leading-tight">Create/Edit Staff Registration Form</h3>
                    <p class="text-slate-500 text-sm leading-relaxed">Design fields, set limits, and define compulsory questions.</p>
                </div>
            </button>

            <button onclick="window.location.href='staff-pending.html'" class="group relative overflow-hidden glass-card rounded-[2.5rem] p-8 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-left border-2 border-transparent hover:border-amber-400">
                <div class="relative z-10">
                    <div class="bg-gradient-to-br from-amber-500 to-orange-600 w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg mb-6 transform group-hover:rotate-3 transition-transform">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">View Pending Staff Registration Request</h3>
                    <p class="text-slate-500 text-sm leading-relaxed">Review submissions and grant official portal access.</p>
                </div>
                <div id="pending-badge" class="absolute top-6 right-6 bg-red-500 text-white text-xs font-black px-3 py-1 rounded-full shadow-md pulse-red hidden">
                    <span id="pending-count">0</span> NEW
                </div>
            </button>

            <button onclick="window.location.href='staff-list.html'" class="group relative overflow-hidden glass-card rounded-[2.5rem] p-8 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-left border-2 border-transparent hover:border-emerald-400">
                <div class="relative z-10">
                    <div class="bg-gradient-to-br from-emerald-500 to-teal-600 w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg mb-6 transform group-hover:rotate-3 transition-transform">
                        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">View Registered Staff</h3>
                    <p class="text-slate-500 text-sm leading-relaxed">Manage active faculty database and update records.</p>
                </div>
            </button>

        </div>
    </main>
<script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Security
        const authStatus = sessionStorage.getItem('minervaAdminAuth');
        if (authStatus !== 'true') { window.location.replace('admin-login.html'); }
        document.getElementById('admin-name-display').innerText = sessionStorage.getItem('minervaAdminName') || "Admin";

        // REAL-TIME CLOUD COUNTER
        function listenForPendingRequests() {
            const badge = document.getElementById('pending-badge');
            const countSpan = document.getElementById('pending-count');
            
            db.collection("staff_applications")
              .where("status", "==", "pending")
              .onSnapshot((snapshot) => {
                  const count = snapshot.size;
                  if (count > 0) {
                      badge.classList.remove('hidden');
                      countSpan.innerText = count;
                  } else {
                      badge.classList.add('hidden');
                  }
              });
        }
        listenForPendingRequests();

        function logout() { sessionStorage.clear(); window.location.replace('index.html'); }
    </script>
</body>
</html>
