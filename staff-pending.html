<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Admin | Pending Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .bulk-bar { transform: translateY(100px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bulk-bar.show { transform: translateY(0); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-32">

    <header class="h-20 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl"><svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
            <h1 class="text-xl font-black text-slate-800">New Staff Requests</h1>
        </div>
        <button onclick="toggleSelectAll()" id="select-all-btn" class="text-[10px] font-black uppercase tracking-widest text-blue-600 bg-blue-50 px-4 py-2 rounded-xl">Select All</button>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8">
        <div id="request-list" class="space-y-6"></div>
    </main>

    <div id="bulk-bar" class="bulk-bar fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md glass border border-blue-200 p-5 rounded-[2.5rem] shadow-2xl z-[100] flex items-center justify-between">
        <div class="pl-2">
            <p id="selected-text" class="text-[10px] font-black text-blue-600 uppercase tracking-widest">0 Selected</p>
        </div>
        <div class="flex gap-2">
            <button onclick="bulkUpdate('rejected')" class="px-6 py-3 bg-red-50 text-red-500 rounded-2xl font-black text-[10px] uppercase tracking-widest">Reject</button>
            <button onclick="bulkUpdate('approved')" class="px-8 py-3 bg-blue-700 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest shadow-lg">Approve All</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let selectedIds = [];

        async function loadRequests() {
            const list = document.getElementById('request-list');
            const snapshot = await db.collection("staff_applications").where("status", "==", "pending").get();
            
            if (snapshot.empty) {
                list.innerHTML = `<div class="text-center py-20 bg-white rounded-[2rem] border-2 border-dashed border-slate-200 text-slate-400 font-bold uppercase text-[10px] tracking-widest">No pending requests</div>`;
                updateBulkBar();
                return;
            }

            list.innerHTML = "";
            snapshot.forEach(doc => {
                const data = doc.data();
                const id = doc.id;
                const details = data.details || {};
                let detailsHtml = "";
                for (const [key, value] of Object.entries(details)) {
                    detailsHtml += `<div class="flex justify-between border-b border-slate-50 py-1"><span class="text-[8px] font-black text-slate-400 uppercase">${key}</span><span class="text-xs font-bold text-slate-700">${value}</span></div>`;
                }

                list.innerHTML += `
                    <div class="glass p-6 rounded-[2.5rem] border-2 ${selectedIds.includes(id) ? 'border-blue-500' : 'border-white'} transition-all flex gap-4 items-center">
                        <input type="checkbox" onchange="toggleSelect('${id}')" ${selectedIds.includes(id) ? 'checked' : ''} class="w-6 h-6 rounded-lg accent-blue-600 shrink-0">
                        <div class="flex-1">
                            <h3 class="text-lg font-black text-slate-900">${data.email}</h3>
                            <div class="mt-3 bg-slate-50/50 p-4 rounded-2xl">${detailsHtml}</div>
                        </div>
                    </div>`;
            });
            updateBulkBar();
        }

        function toggleSelect(id) {
            if (selectedIds.includes(id)) selectedIds = selectedIds.filter(i => i !== id);
            else selectedIds.push(id);
            loadRequests();
        }

        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            if (selectedIds.length > 0) selectedIds = [];
            else {
                db.collection("staff_applications").where("status", "==", "pending").get().then(s => {
                    s.forEach(doc => selectedIds.push(doc.id));
                    loadRequests();
                });
            }
            loadRequests();
        }

        function updateBulkBar() {
            const bar = document.getElementById('bulk-bar');
            const txt = document.getElementById('selected-text');
            if (selectedIds.length > 0) {
                bar.classList.add('show');
                txt.innerText = `${selectedIds.length} Staff Selected`;
            } else {
                bar.classList.remove('show');
            }
        }

        async function bulkUpdate(newStatus) {
            if (!confirm(`Process ${selectedIds.length} applications?`)) return;
            const batch = db.batch();
            selectedIds.forEach(id => {
                const ref = db.collection("staff_applications").doc(id);
                batch.update(ref, { status: newStatus, reviewedOn: firebase.firestore.FieldValue.serverTimestamp() });
            });
            await batch.commit();
            alert("Bulk Update Complete!");
            selectedIds = [];
            loadRequests();
        }

        loadRequests();
    </script>
</body>
</html>
