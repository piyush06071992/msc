<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Admin | Pending Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <header class="h-20 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">New Staff Requests</h1>
        </div>
        <div class="bg-blue-50 px-4 py-2 rounded-2xl border border-blue-100">
            <span id="pending-count" class="text-blue-700 font-black text-lg">0</span>
            <span class="text-blue-400 text-[10px] font-bold uppercase ml-1 tracking-widest">Pending</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8">
        <div id="request-list" class="space-y-6">
            <div class="text-center py-20 text-slate-300 font-bold uppercase text-xs animate-pulse tracking-[0.3em]">
                Checking for new applications...
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadRequests() {
            const list = document.getElementById('request-list');
            const countBadge = document.getElementById('pending-count');

            try {
                // REMOVED .orderBy() to prevent Index Error
                const snapshot = await db.collection("staff_applications")
                                   .where("status", "==", "pending")
                                   .get();
                
                countBadge.innerText = snapshot.size;
                
                if (snapshot.empty) {
                    list.innerHTML = `<div class="text-center py-20 bg-white rounded-[2rem] border-2 border-dashed border-slate-200 text-slate-400 font-bold uppercase text-[10px] tracking-widest">No pending requests found</div>`;
                    return;
                }

                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    const details = data.details || {};
                    
                    let detailsHtml = "";
                    for (const [key, value] of Object.entries(details)) {
                        detailsHtml += `
                            <div class="flex justify-between border-b border-slate-50 py-2">
                                <span class="text-[9px] font-black text-slate-400 uppercase tracking-wider">${key}</span>
                                <span class="text-sm font-bold text-slate-700">${Array.isArray(value) ? value.join(', ') : value}</span>
                            </div>`;
                    }

                    const card = `
                        <div class="glass p-6 sm:p-8 rounded-[2.5rem] shadow-xl border border-white">
                            <div class="flex justify-between items-start mb-6">
                                <div>
                                    <h3 class="text-xl font-black text-slate-900">${data.email}</h3>
                                    <p class="text-blue-600 font-bold text-sm">Mobile: ${data.mobile}</p>
                                </div>
                            </div>

                            <div class="bg-slate-50/50 p-5 rounded-2xl mb-6">
                                ${detailsHtml}
                            </div>

                            <div class="flex gap-4">
                                <button onclick="updateStatus('${id}', 'rejected')" class="flex-1 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest text-red-500 bg-red-50 hover:bg-red-100 transition-colors">Reject</button>
                                <button onclick="updateStatus('${id}', 'approved')" class="flex-1 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest text-white bg-blue-700 shadow-lg shadow-blue-200 hover:bg-blue-800 transition-all">Approve Staff</button>
                            </div>
                        </div>`;
                    list.innerHTML += card;
                });
            } catch (e) {
                console.error(e);
                list.innerHTML = `<div class="p-8 bg-red-50 text-red-500 rounded-2xl font-bold text-sm text-center">Sync Error: Please refresh the page.</div>`;
            }
        }

        async function updateStatus(docId, newStatus) {
            const confirmAction = confirm(`Are you sure you want to ${newStatus} this application?`);
            if (!confirmAction) return;

            try {
                await db.collection("staff_applications").doc(docId).update({
                    status: newStatus,
                    reviewedOn: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert(`Staff member is now ${newStatus.toUpperCase()}`);
                loadRequests();
            } catch (e) { alert("Error updating status: " + e.message); }
        }

        loadRequests();
    </script>
</body>
</html>
