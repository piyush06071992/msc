<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Admin | Pending Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        /* We explicitly declare translate(-50%, ...) so it never loses its horizontal centering! */
        .bulk-bar { transform: translate(-50%, 100px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bulk-bar.show { transform: translate(-50%, 0); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-32">

    <header class="h-20 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-black text-slate-800">New Staff Requests</h1>
        </div>
        <button onclick="toggleSelectAll()" id="select-all-btn" class="text-[10px] font-black uppercase tracking-widest text-blue-600 bg-blue-50 px-4 py-2 rounded-xl transition-all active:scale-95">Select All</button>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8">
        <div id="request-list" class="space-y-6">
            <div class="text-center py-20 text-slate-300 font-bold uppercase text-xs animate-pulse tracking-widest">
                Checking for new applications...
            </div>
        </div>
    </main>

 <div id="bulk-bar" class="bulk-bar fixed bottom-4 sm:bottom-6 left-1/2 w-[95%] max-w-md glass border border-blue-200 p-3 sm:p-5 rounded-[2rem] sm:rounded-[2.5rem] shadow-2xl z-[100] flex items-center justify-between gap-2">
        <div class="pl-1 sm:pl-2 shrink-0">
            <p id="selected-text" class="text-[9px] sm:text-[10px] font-black text-blue-600 uppercase tracking-widest">0 Selected</p>
        </div>
        <div class="flex gap-2 shrink-0">
            <button onclick="bulkUpdate('rejected')" class="px-4 sm:px-6 py-3 bg-red-50 text-red-500 rounded-xl sm:rounded-2xl font-black text-[9px] sm:text-[10px] uppercase tracking-widest transition-all active:scale-95">Reject</button>
            <button onclick="bulkUpdate('approved')" class="px-4 sm:px-8 py-3 bg-blue-700 text-white rounded-xl sm:rounded-2xl font-black text-[9px] sm:text-[10px] uppercase tracking-widest shadow-lg shadow-blue-200 transition-all active:scale-95">Approve All</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let selectedIds = [];

        async function loadRequests() {
            const list = document.getElementById('request-list');
            try {
                const snapshot = await db.collection("staff_applications").where("status", "==", "pending").get();
                
                if (snapshot.empty) {
                    list.innerHTML = `<div class="text-center py-20 bg-white rounded-[2rem] border-2 border-dashed border-slate-200 text-slate-400 font-bold uppercase text-[10px] tracking-widest">No pending requests</div>`;
                    updateBulkBar();
                    return;
                }

                list.innerHTML = "";
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;
                    const details = data.details || {};
                    const cleanMobile = data.mobile ? data.mobile.replace(/\D/g, '') : '';
                    
                    let detailsHtml = "";
                    for (const [key, value] of Object.entries(details)) {
                        detailsHtml += `
                            <div class="flex justify-between border-b border-slate-50 py-1.5">
                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">${key}</span>
                                <span class="text-xs font-bold text-slate-700">${Array.isArray(value) ? value.join(', ') : value}</span>
                            </div>`;
                    }

                    list.innerHTML += `
                        <div class="glass p-6 rounded-[2.5rem] border-2 ${selectedIds.includes(id) ? 'border-blue-500' : 'border-white'} transition-all flex gap-4 items-start">
                            <input type="checkbox" onchange="toggleSelect('${id}')" ${selectedIds.includes(id) ? 'checked' : ''} class="w-6 h-6 mt-1 rounded-lg accent-blue-600 shrink-0 cursor-pointer">
                            
                            <div class="flex-1">
                                <div class="mb-4">
                                    <h3 class="text-lg font-black text-slate-900 break-all leading-tight">${data.email}</h3>
                                    <p class="text-blue-600 font-black text-xs">Ph: ${data.mobile}</p>
                                </div>

                                <div class="flex gap-2 mb-4">
                                    <a href="tel:${cleanMobile}" class="flex-1 bg-blue-50 text-blue-700 py-2.5 rounded-xl flex items-center justify-center gap-2 hover:bg-blue-100 transition-colors">
                                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                                        <span class="text-[9px] font-black uppercase tracking-widest">Call</span>
                                    </a>
                                    <a href="https://wa.me/91${cleanMobile}" target="_blank" class="flex-1 bg-emerald-50 text-emerald-700 py-2.5 rounded-xl flex items-center justify-center gap-2 hover:bg-emerald-100 transition-colors">
                                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.038 3.284l-.569 2.103 2.181-.545c1 .512 1.89.842 3.118.842 3.18 0 5.765-2.586 5.766-5.766 0-3.18-2.586-5.765-5.766-5.765zm3.377 8.272c-.14.393-.8.758-1.103.812-.275.053-.632.091-1.012-.047-.247-.09-.546-.192-1.254-.484-2.997-1.238-4.94-4.29-5.09-4.489-.15-.199-1.219-1.621-1.219-3.092 0-1.471.769-2.194 1.042-2.493.272-.299.593-.374.792-.374s.397.001.57.009c.177.007.414-.067.649.492.235.559.816 1.99.888 2.139.071.149.118.323.018.522-.1.199-.15.323-.3.497-.15.174-.314.388-.447.521-.149.149-.304.31-.131.608.174.299.771 1.269 1.657 2.057.886.789 1.635 1.032 1.868 1.144.233.111.37.094.507-.06.137-.154.588-.686.746-.919.157-.233.314-.196.531-.115.216.081 1.368.646 1.604.758.236.112.393.167.45.263.056.096.056.559-.084.952z"/></svg>
                                        <span class="text-[9px] font-black uppercase tracking-widest">WhatsApp</span>
                                    </a>
                                </div>

                                <div class="mt-2 bg-slate-50/50 p-4 rounded-2xl">
                                    ${detailsHtml}
                                </div>
                            </div>
                        </div>`;
                });
                updateBulkBar();
            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        function toggleSelect(id) {
            if (selectedIds.includes(id)) selectedIds = selectedIds.filter(i => i !== id);
            else selectedIds.push(id);
            loadRequests();
        }

        async function toggleSelectAll() {
            if (selectedIds.length > 0) {
                selectedIds = [];
            } else {
                const snapshot = await db.collection("staff_applications").where("status", "==", "pending").get();
                snapshot.forEach(doc => selectedIds.push(doc.id));
            }
            loadRequests();
        }

        function updateBulkBar() {
            const bar = document.getElementById('bulk-bar');
            const txt = document.getElementById('selected-text');
            if (selectedIds.length > 0) {
                bar.classList.add('show');
                txt.innerText = `${selectedIds.length} Staff Selected`;
            } else {
                bar.classList.remove('show');
            }
        }

       async function bulkUpdate(newStatus) {
            if (!confirm(`Are you sure you want to ${newStatus.toUpperCase()} these ${selectedIds.length} applications?`)) return;
            
            const batch = db.batch();
            selectedIds.forEach(id => {
                const ref = db.collection("staff_applications").doc(id);
                if (newStatus === 'rejected') {
                    // Physically wipe the document from Firebase so they can cleanly re-apply
                    batch.delete(ref);
                } else {
                    batch.update(ref, { 
                        status: newStatus, 
                        reviewedOn: firebase.firestore.FieldValue.serverTimestamp() 
                    });
                }
            });
            
            try {
                await batch.commit();
                alert(`Successfully processed ${selectedIds.length} applications!`);
                selectedIds = [];
                loadRequests();
            } catch (err) {
                alert("Update failed: " + err.message);
            }
        }

        loadRequests();
    </script>
</body>
</html>
