        async function fetchAdminReports() {
            const dept = document.getElementById('view-dept').value;
            const tea = document.getElementById('view-teacher').value;
            const feed = document.getElementById('rm-feed');
            
            if(!dept) {
                feed.innerHTML = `<div class="text-center py-32 text-slate-400 font-black uppercase tracking-widest text-sm">Select a department to view reports.</div>`;
                return;
            }

            feed.innerHTML = `<div class="text-center py-32"><span class="loader mb-4 border-slate-300 border-t-indigo-600"></span><br><span class="text-slate-400 font-black uppercase tracking-widest text-xs">Loading Reports...</span></div>`;

            try {
                let query = getCollection("section_reports").where("department", "==", dept);
                if (tea) query = query.where("teacherEmail", "==", tea);
                
                const snap = await query.get();
                adminReportsList = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp);

                if(adminReportsList.length === 0) {
                    feed.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border border-slate-200"><p class="text-slate-400 font-black uppercase text-sm tracking-widest">No reports found.</p></div>`;
                    return;
                }

                feed.innerHTML = adminReportsList.map(rep => {
                    const dateStr = new Date(rep.timestamp).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
                    return `
                    <div class="bg-white border border-slate-200 p-6 rounded-[2rem] shadow-sm hover:shadow-md transition-all">
                        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 border-b border-slate-100 pb-4 mb-4">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-[9px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded uppercase tracking-widest font-black border border-slate-200">${dateStr}</span>
                                    ${rep.adminRemark ? '<span class="text-[9px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded uppercase tracking-widest font-black border border-emerald-200">Reviewed</span>' : '<span class="text-[9px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded uppercase tracking-widest font-black border border-rose-200">Pending Review</span>'}
                                </div>
                                <h4 class="font-black text-slate-900 text-lg uppercase tracking-tighter">${rep.title}</h4>
                                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">${rep.teacherName} • Class ${rep.className} | Sec ${rep.section}</p>
                            </div>
                            <button onclick="viewSectionReportDetail('${rep.id}')" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white px-5 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-colors border border-indigo-200 shadow-sm shrink-0">Open Report</button>
                        </div>
                        <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-100">
                            <span class="text-[9px] font-black text-amber-800 uppercase tracking-widest block mb-1">HOD Remark:</span>
                            <p class="text-xs font-bold text-slate-700 line-clamp-2">${rep.hodRemark}</p>
                        </div>
                    </div>`;
                }).join('');

            } catch(e) {
                console.error(e);
                feed.innerHTML = `<div class="text-center text-rose-500 font-black py-20">Error loading reports.</div>`;
            }
        }

     function viewSectionReportDetail(reportId) {
            const rep = adminReportsList.find(r => r.id === reportId);
            if(!rep) return;
            const feed = document.getElementById('rm-feed');

            let logsHtml = "";
            const days = Object.keys(rep.logs).sort();
            
            if(days.length === 0) {
                logsHtml = `<p class="text-slate-400 italic text-sm p-4">No daily activity logs attached to this report period.</p>`;
            } else {
                logsHtml = days.map(d => {
                    const dayData = rep.logs[d];
                    const dateObj = new Date(d);
                    const prettyDate = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
                    const dayName = dateObj.toLocaleDateString('en-GB', { weekday: 'long' });
                    
                    let dayContent = `
                        <div class="mb-10 last:mb-0 border-l-4 border-slate-200 pl-4 sm:pl-6 py-2">
                            <div class="mb-4">
                                <h5 class="text-lg font-black text-indigo-900 leading-none uppercase tracking-tighter">${dayName}</h5>
                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${prettyDate}</span>
                            </div>
                    `;

                    // 1. Classes & Topics (Point-wise)
                    if (dayData.classes && dayData.classes.length > 0) {
                        dayData.classes.forEach((cls, idx) => {
                            dayContent += `
                                <div class="mb-4">
                                    <div class="text-sm sm:text-base font-black text-slate-800 uppercase">
                                        ${idx + 1}. ${cls.subject} (${cls.time})
                                    </div>
                            `;
                            
                            // Nested Topics
                            const clsTopics = dayData.topics.filter(t => t.className === cls.className && t.section === cls.section);
                            if (clsTopics.length > 0) {
                                dayContent += `<ul class="mt-1 ml-5 space-y-1">`;
                                clsTopics.forEach(t => {
                                    dayContent += `<li class="text-sm font-bold text-emerald-700 flex gap-2"><span>•</span> <span>${t.chapter}: ${t.subtopic}</span></li>`;
                                });
                                dayContent += `</ul>`;
                            } else {
                                dayContent += `<p class="text-[10px] font-black text-rose-400 uppercase mt-1 ml-5 italic">No syllabus logged for this slot</p>`;
                            }
                            dayContent += `</div>`;
                        });
                    }

                    // 2. Duties
                    if (dayData.duties && dayData.duties.length > 0) {
                        dayContent += `<div class="mt-4 pt-3 border-t border-slate-100">`;
                        dayData.duties.forEach(duty => {
                            dayContent += `
                                <div class="text-sm font-bold text-amber-700 flex items-center gap-2">
                                    <span>🛡️</span> <strong>${duty.type}:</strong> ${duty.time}
                                </div>`;
                        });
                        dayContent += `</div>`;
                    }

                    dayContent += `</div>`;
                    return dayContent;
                }).join('');
            }

            feed.innerHTML = `
                <div class="bg-white border-2 border-indigo-100 p-6 sm:p-10 rounded-[2.5rem] shadow-xl relative animate-in fade-in duration-300">
                    <button onclick="fetchAdminReports()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-700 font-black text-[10px] uppercase tracking-widest bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 transition-all">🔙 Back</button>
                    
                    <div class="mb-8 pr-20">
                        <h3 class="font-black text-slate-900 text-2xl sm:text-3xl uppercase tracking-tighter mb-1">${rep.title}</h3>
                        <p class="text-xs sm:text-sm font-bold text-indigo-600 uppercase tracking-widest">
                            ${rep.teacherName} • ${rep.className} | Sec ${rep.section}
                        </p>
                        <div class="mt-2 text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50 inline-block px-3 py-1 rounded-lg border border-slate-100">
                            Range: ${rep.fromDate} to ${rep.toDate}
                        </div>
                    </div>

                    <div class="bg-amber-50/50 border-l-4 border-amber-400 p-6 rounded-r-2xl mb-10">
                        <span class="text-[10px] font-black text-amber-800 uppercase tracking-widest block mb-2">HOD Final Evaluation:</span>
                        <div class="text-sm sm:text-base font-bold text-slate-700 leading-relaxed italic">"${rep.hodRemark}"</div>
                    </div>

                    <div class="space-y-2 mb-10">
                        <h4 class="font-black text-slate-400 text-xs uppercase tracking-[0.2em] border-b border-slate-100 pb-3 mb-6">Daily Activity Records</h4>
                        <div class="custom-scroll">${logsHtml}</div>
                    </div>

                    <div class="border-t-2 border-slate-100 pt-8">
                        <label class="flex justify-between items-center text-[10px] font-black text-rose-700 uppercase tracking-widest mb-3 px-1">
                            <span>Administrator Final Remark</span>
                            ${currentUserRole !== 'ADMIN' ? '<span class="bg-rose-100 px-3 py-1 rounded-full text-rose-800 lowercase font-bold tracking-normal italic">view only</span>' : ''}
                        </label>
                        <textarea id="det-admin-rem" rows="5" class="w-full p-5 bg-rose-50/30 border-2 border-rose-100 rounded-[1.5rem] text-sm sm:text-base font-bold text-slate-800 outline-none focus:border-rose-400 custom-scroll placeholder-rose-300 shadow-inner" placeholder="Add final administrative notes..." ${currentUserRole !== 'ADMIN' ? 'disabled' : ''}>${rep.adminRemark || ''}</textarea>
                        
                        ${currentUserRole === 'ADMIN' ? `<button onclick="saveAdminRemark('${rep.id}')" class="mt-6 w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-xs uppercase tracking-[0.2em] shadow-2xl hover:bg-rose-600 active:scale-95 transition-all">💾 Save Final Remark</button>` : ''}
                    </div>
                </div>
            `;
        }

        async function saveAdminRemark(reportId) {
            const rem = document.getElementById('det-admin-rem').value.trim();
            const btn = event.target;
            const orig = btn.innerText;

            btn.disabled = true; btn.innerText = "Saving...";

            try {
                await getCollection("section_reports").doc(reportId).update({ adminRemark: rem });
                const rep = adminReportsList.find(r => r.id === reportId);
                if(rep) rep.adminRemark = rem;
                
                btn.innerText = "✅ Saved Successfully";
                btn.classList.replace('bg-slate-900', 'bg-emerald-600');
                btn.classList.replace('hover:bg-rose-600', 'hover:bg-emerald-500');
                
                setTimeout(() => {
                    btn.disabled = false; btn.innerText = orig;
                    btn.classList.replace('bg-emerald-600', 'bg-slate-900');
                    btn.classList.replace('hover:bg-emerald-500', 'hover:bg-rose-600');
                }, 2000);
            } catch(e) {
                alert("Error saving: " + e.message);
                btn.disabled = false; btn.innerText = orig;
            }
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12) hours = 0;
            if (modifier === 'PM') hours += 12;
            return hours * 60 + minutes;
        }

        async function toggleLiveStatus() {
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('live-icon');
            const text = document.getElementById('live-text');

            if (isLiveStatusActive) {
                isLiveStatusActive = false;
                icon.innerHTML = '🔴';
                icon.classList.add('animate-pulse');
                text.innerText = 'Live Status';
                btn.classList.replace('bg-slate-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-slate-400', 'hover:bg-rose-400');
                
                allStaff.forEach(staff => {
                    const statusDiv = document.getElementById(`live-status-${staff.id}`);
                    if(statusDiv) statusDiv.innerHTML = `<span class="inline-block px-4 py-2 bg-slate-50 text-slate-400 text-[10px] sm:text-xs font-black uppercase tracking-widest rounded-xl border border-slate-200">Status Paused - Click Live Status</span>`;
                });
                return;
            }

            isLiveStatusActive = true;
            icon.innerHTML = '⏳';
            icon.classList.add('animate-spin');
            icon.classList.remove('animate-pulse');
            text.innerText = 'Syncing...';
            btn.disabled = true;

            const todayStr = daysOfWeek[new Date().getDay() - 1]; // FIX: getDay() maps Sun=0 to Sat=6. We need to match array index properly
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();

            try {
                // APPLY OVERRIDES IN THE LIVE STATUS TRACKER TOO!
                const histSnap = await getCollection("timetable_history").get();
                const todayIso = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
                const todayOverride = histSnap.docs.map(d => d.data()).find(o => o.date === todayIso);
                
                const snap = await getCollection("timetable").where("day", "==", todayStr).get();
                let allTodaysClasses = [];

                if (todayOverride && todayOverride.schedule) {
                     allTodaysClasses = todayOverride.schedule.filter(s => s.day === todayStr);
                } else {
                     allTodaysClasses = snap.docs.map(d => d.data());
                }

                // Format missing times correctly
                allTodaysClasses = allTodaysClasses.map(cls => {
                    if (!cls.timeRange && cls.start24 && cls.end24) {
                        const f12 = (t24) => { let [h,m]=t24.split(':'); let ampm=h>=12?'PM':'AM'; h=h%12||12; return `${h.toString().padStart(2,'0')}:${m} ${ampm}`; };
                        cls.timeRange = `${f12(cls.start24)} - ${f12(cls.end24)}`;
                    }
                    return cls;
                });


                for (let staff of allStaff) {
                    const nameKey = Object.keys(staff.details).find(key => key.toLowerCase().includes('name'));
                    const staffName = nameKey ? staff.details[nameKey] : staff.email;
                    const statusDiv = document.getElementById(`live-status-${staff.id}`);
                    if (!statusDiv) continue;

                    const teacherClasses = allTodaysClasses.filter(c => c.teacherName === staffName || c.teacher === staffName);
                    let isBusy = false; let busyText = "";

                    for (let cls of teacherClasses) {
                        if (!cls.timeRange) continue;
                        const [startStr, endStr] = cls.timeRange.split(' - ');
                        const startMins = parseTimeToMinutes(startStr);
                        const endMins = parseTimeToMinutes(endStr);

                        if (currentMins >= startMins && currentMins <= endMins) {
                            isBusy = true;
                            busyText = `IN CLASS: ${cls.className} ${cls.section ? '| '+cls.section : ''} <br> <span class="text-rose-200">Room ${cls.room || '--'} (${cls.timeRange})</span>`;
                            break;
                        }
                    }

                    if (isBusy) {
                        statusDiv.innerHTML = `<div class="bg-rose-600 text-white p-3 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-widest leading-tight shadow-md animate-pulse border border-rose-700">${busyText}</div>`;
                    } else {
                        statusDiv.innerHTML = `<span class="inline-block px-4 py-2 bg-emerald-50 text-emerald-700 text-[10px] sm:text-xs font-black uppercase tracking-widest rounded-xl border border-emerald-200 shadow-sm">Currently Free</span>`;
                    }
                }
            } catch(e) {
                console.error("Error fetching live status:", e);
                alert("Failed to sync live status.");
                isLiveStatusActive = false; // Reset on failure
            } finally {
                icon.innerHTML = '⏹️';
                icon.classList.remove('animate-spin');
                text.innerText = 'Stop Live Status';
                btn.classList.replace('bg-rose-500', 'bg-slate-500');
                btn.classList.replace('hover:bg-rose-400', 'hover:bg-slate-400');
                btn.disabled = false;
            }
        }

        // --- EDIT PROFILE ---
        function openEditModal(staffId) {
            editingStaffId = staffId;
            const staff = allStaff.find(s => s.id === staffId);
            const area = document.getElementById('edit-form-area');
            area.innerHTML = `
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Mobile Number</label>
                    <input type="text" id="edit-mobile" value="${staff.mobile}" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-500 shadow-sm">
                </div>
                <div class="w-full h-px bg-slate-200 my-4"></div>
            `;

            Object.entries(staff.details).forEach(([key, value]) => {
                const fieldConfig = formConfig.fields.find(f => f.label === key);
                if (fieldConfig && fieldConfig.type === 'select') {
                    let options = `<option value="">Select...</option>`;
                    fieldConfig.options.split(',').forEach(opt => {
                        let selected = value === opt.trim() ? 'selected' : '';
                        options += `<option value="${opt.trim()}" ${selected}>${opt.trim()}</option>`;
                    });
                    area.innerHTML += `
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">${key}</label>
                            <select id="edit-det-${key}" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-500 shadow-sm cursor-pointer">${options}</select>
                        </div>
                    `;
                } else {
                    area.innerHTML += `
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">${key}</label>
                            <input type="text" id="edit-det-${key}" value="${value}" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-500 shadow-sm">
                        </div>
                    `;
                }
            });
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        async function saveProfileChanges() {
            const staff = allStaff.find(s => s.id === editingStaffId);
            const newMobile = document.getElementById('edit-mobile').value;
            let newDetails = {};
            Object.keys(staff.details).forEach(key => {
                const input = document.getElementById(`edit-det-${key}`);
                if(input) newDetails[key] = input.value;
            });
            try {
                await getCollection("staff_applications").doc(editingStaffId).update({ mobile: newMobile, details: newDetails });
                alert("Profile Updated Successfully!");
                closeModal('edit-modal'); fetchStaff(); 
            } catch (e) { alert("Error saving changes."); }
        }

        // --- TIMETABLE MODAL ---
        async function viewTimetable(staffId, staffName) {
            document.getElementById('tt-modal-name').innerText = staffName;
            const grid = document.getElementById('tt-modal-grid');
            grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest animate-pulse">Fetching schedule...</div>';
            document.getElementById('tt-modal').classList.remove('hidden');

            try {
                // APPLY OVERRIDES IN THE TIMETABLE VIEWER
                const histSnap = await getCollection("timetable_history").get();
                const todayIso = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
                const todayOverride = histSnap.docs.map(d => d.data()).find(o => o.date === todayIso);
                const snap = await getCollection("timetable").where("teacherName", "==", staffName).get();
                
                let dataList = [];
                if (todayOverride && todayOverride.schedule) {
                     dataList = todayOverride.schedule.filter(s => s.teacherName === staffName || s.teacher === staffName);
                } else {
                     dataList = snap.docs.map(d => d.data());
                }

                // Format missing times correctly
                dataList = dataList.map(cls => {
                    if (!cls.timeRange && cls.start24 && cls.end24) {
                        const f12 = (t24) => { let [h,m]=t24.split(':'); let ampm=h>=12?'PM':'AM'; h=h%12||12; return `${h.toString().padStart(2,'0')}:${m} ${ampm}`; };
                        cls.timeRange = `${f12(cls.start24)} - ${f12(cls.end24)}`;
                    }
                    return cls;
                });


                if (dataList.length === 0) {
                    grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest">No schedule found for this faculty.</div>';
                    return;
                }

                let ttHTML = "";
                daysOfWeek.forEach(day => {
                    if(day === 'Sunday') return; // Usually no classes on Sunday
                    
                    const dayClasses = dataList.filter(d => d.day === day).sort((a,b) => {
                        const timeA = a.timeRange ? a.timeRange.split(' - ')[0] : '12:00 AM';
                        const timeB = b.timeRange ? b.timeRange.split(' - ')[0] : '12:00 AM';
                        return new Date('1970/01/01 ' + timeA) - new Date('1970/01/01 ' + timeB);
                    });

                    if(dayClasses.length > 0) {
                        ttHTML += `
                        <div class="bg-white p-5 sm:p-6 rounded-[2rem] shadow-sm border border-slate-200">
                            <h4 class="font-black text-indigo-700 uppercase tracking-widest mb-4 border-b border-slate-100 pb-3 flex items-center gap-3">
                                <span class="bg-indigo-50 p-2 rounded-xl text-xl shadow-sm border border-indigo-100">📅</span> ${day}
                            </h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${dayClasses.map(item => `
                                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 flex flex-col justify-between hover:border-indigo-300 hover:shadow-md transition-all group">
                                        <div>
                                            <div class="font-black text-slate-800 text-sm uppercase mb-1">${item.className} ${item.section ? '| ' + item.section : ''}</div>
                                            <div class="text-[11px] font-bold text-indigo-600 uppercase tracking-widest mb-4">${item.subject || item.title || 'Duty'}</div>
                                        </div>
                                        <div class="mt-auto pt-4 border-t border-slate-200 flex justify-between items-center">
                                            <span class="text-[10px] font-black bg-white px-3 py-1.5 rounded-lg shadow-sm text-slate-600 border border-slate-100">🕒 ${item.timeRange || '--'}</span>
                                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">RM: ${item.room || '--'}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                    }
                });

                if(!ttHTML) {
                    grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest">No schedule found for this faculty.</div>';
                } else {
                    grid.innerHTML = ttHTML;
                }

            } catch(e) {
                grid.innerHTML = '<div class="text-rose-500 text-center font-bold p-8 uppercase text-xs tracking-widest">Error loading timetable.</div>';
            }
        }

        async function revokeStaff(id) {
            if(confirm("Revoke this staff member's access? They will move back to Pending list.")) {
                await getCollection("staff_applications").doc(id).update({ status: 'pending' });
                fetchStaff();
            }
        }

        init();
    </script>
