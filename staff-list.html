<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Registered Staff & Reports</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        
        /* Loader */
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-24 relative">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex flex-col sm:flex-row sm:items-center justify-between shadow-xl sticky top-0 z-50 gap-4 border-b-4 border-indigo-600">
        <div class="flex items-center justify-between w-full sm:w-auto gap-4">
            <button onclick="handleBack()" class="p-3 sm:p-4 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors shadow-sm shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex-1">
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none">Faculty Hub</h1>
                <p id="header-role" class="text-xs text-indigo-300 font-bold uppercase tracking-widest mt-1">Loading Role...</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto">
            <button onclick="openDateWiseReports()" class="flex-1 sm:flex-none justify-center bg-blue-600 hover:bg-blue-500 text-white px-4 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                📅 Daily Reports
            </button>
            <button id="export-btn" onclick="exportData()" class="flex-1 sm:flex-none justify-center bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                📥 Export Excel
            </button>
            <button id="refresh-btn" onclick="toggleLiveStatus()" class="flex-1 sm:flex-none justify-center bg-rose-500 hover:bg-rose-400 text-white px-4 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                <span class="animate-pulse" id="live-icon">🔴</span> <span id="live-text">Live Status</span>
            </button>
            <button id="auth-btn" onclick="openAuthModal()" class="hidden w-full sm:w-auto justify-center bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all mt-1 sm:mt-0 flex items-center gap-2">
                🔐 HOD Delegation
            </button>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto p-4 sm:p-8 mt-4">
        
        <div class="glass p-6 sm:p-8 rounded-[2rem] sm:rounded-[3rem] border border-white shadow-lg mb-8 space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-black text-slate-800 uppercase tracking-widest text-sm sm:text-base">Filter Directory</h2>
                <div class="text-xs font-black text-slate-400 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded-lg">
                    Total: <span id="staff-count" class="text-blue-600">0</span>
                </div>
            </div>
            
            <div id="search-container" class="hidden">
                <div class="relative">
                    <input type="text" id="search-input" oninput="applyFilters()" placeholder="Search staff by name, email, phone..." class="w-full p-4 sm:p-5 pl-12 sm:pl-14 bg-slate-100 border-none rounded-2xl font-bold text-sm sm:text-base outline-none focus:ring-4 focus:ring-blue-100 transition-all text-slate-700 placeholder-slate-400">
                    <svg class="w-6 h-6 text-slate-400 absolute left-4 sm:left-5 top-4 sm:top-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
            </div>
            <div id="filter-container" class="flex flex-wrap gap-3 mt-4"></div>
        </div>

        <div id="staff-grid" class="space-y-6">
            <div class="text-center py-20 bg-white rounded-[3rem] shadow-sm border border-slate-100">
                <span class="loader mb-4"></span>
                <div class="text-slate-400 font-black uppercase text-sm tracking-widest">Syncing Faculty Records...</div>
            </div>
        </div>
    </main>

    <div id="auth-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col h-[85vh]">
            <div class="p-6 bg-indigo-50 border-b border-indigo-100 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="font-black text-indigo-900 text-lg sm:text-xl uppercase tracking-tighter">HOD Delegation</h3>
                    <p class="text-[10px] sm:text-xs font-bold text-indigo-500 uppercase tracking-widest mt-1">Authorize staff to review reports & add remarks</p>
                </div>
                <button onclick="closeModal('auth-modal')" class="bg-indigo-100 text-indigo-400 hover:bg-rose-100 hover:text-rose-600 w-10 h-10 rounded-full font-black text-xl transition-colors flex items-center justify-center">✕</button>
            </div>
            
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 bg-slate-50 border-b border-slate-200 shrink-0">
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2">1. Select Department</label>
                    <select id="auth-dept" onchange="populateAuthStaff()" class="w-full p-4 bg-white border border-slate-300 rounded-xl font-bold text-sm text-slate-700 outline-none focus:border-indigo-500 cursor-pointer shadow-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2">2. Select Staff Member</label>
                    <select id="auth-staff" class="w-full p-4 bg-white border border-slate-300 rounded-xl font-bold text-sm text-slate-700 outline-none focus:border-indigo-500 cursor-pointer shadow-sm disabled:opacity-50" disabled></select>
                </div>
                <div class="md:col-span-2">
                    <button onclick="grantHODAuth()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-black uppercase tracking-widest text-xs shadow-lg hover:bg-indigo-700 transition-colors">Grant HOD Authority</button>
                </div>
            </div>

            <div class="p-6 flex-1 overflow-y-auto bg-white custom-scroll">
                <h4 class="font-black text-slate-800 uppercase tracking-widest text-xs mb-4">Currently Authorized HODs</h4>
                <div id="auth-list-container" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <div id="reports-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[300] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-6xl shadow-2xl overflow-hidden flex flex-col h-[95vh]">
            
            <div class="p-6 sm:p-8 bg-blue-50 border-b border-blue-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shrink-0">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 bg-white rounded-2xl shadow-sm flex items-center justify-center text-3xl">📊</div>
                    <div>
                        <h3 id="rm-title" class="font-black text-blue-900 text-xl sm:text-2xl uppercase tracking-tighter">Work Reports</h3>
                        <p id="rm-subtitle" class="text-xs font-bold text-blue-600 uppercase tracking-widest mt-1">Reviewing Submissions & Adding Remarks</p>
                    </div>
                </div>
                <button onclick="closeModal('reports-modal')" class="bg-white border border-blue-200 text-blue-400 hover:bg-rose-100 hover:text-rose-600 hover:border-rose-200 w-12 h-12 rounded-full font-black text-xl transition-all flex items-center justify-center shadow-sm">✕</button>
            </div>

            <div id="rm-filters" class="p-6 bg-slate-50 border-b border-slate-200 shrink-0 flex flex-col md:flex-row gap-4 items-end">
                </div>

            <div class="px-6 py-4 bg-white border-b border-slate-100 flex justify-between items-center shrink-0">
                <label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-slate-50 rounded-xl transition-colors">
                    <input type="checkbox" id="rm-remarks-only" onchange="renderReportsList()" class="w-6 h-6 accent-rose-600 cursor-pointer shadow-sm">
                    <span class="text-sm font-black text-slate-700 uppercase tracking-widest">🔍 View Confidential Remarks Only</span>
                </label>
                <div id="rm-stats" class="text-xs font-black text-slate-400 uppercase tracking-widest bg-slate-100 px-4 py-2 rounded-lg"></div>
            </div>

            <div id="rm-feed" class="p-4 sm:p-8 flex-1 overflow-y-auto bg-slate-100/50 custom-scroll space-y-6 sm:space-y-8">
                </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[400] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 sm:p-8 bg-slate-50 border-b flex justify-between items-center shrink-0">
                <h3 class="font-black text-slate-800 text-xl uppercase tracking-tighter">Edit Profile</h3>
                <button onclick="closeModal('edit-modal')" class="text-slate-400 hover:text-rose-500 font-black text-2xl">✕</button>
            </div>
            <div id="edit-form-area" class="p-6 sm:p-8 overflow-y-auto space-y-5 custom-scroll"></div>
            <div class="p-6 bg-white border-t flex gap-4 shrink-0">
                <button onclick="closeModal('edit-modal')" class="flex-1 py-4 rounded-2xl font-black uppercase tracking-widest text-xs text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancel</button>
                <button onclick="saveProfileChanges()" class="flex-[2] py-4 rounded-2xl font-black uppercase tracking-widest text-xs text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="tt-modal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-[400] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] shadow-2xl w-full max-w-6xl overflow-hidden flex flex-col h-[90vh]">
            <div class="p-6 sm:p-8 bg-indigo-50 border-b border-indigo-100 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="font-black text-indigo-900 text-xl sm:text-2xl uppercase tracking-tighter">Master Timetable</h3>
                    <p id="tt-modal-name" class="text-xs font-bold text-indigo-600 uppercase tracking-widest mt-1"></p>
                </div>
                <button onclick="closeModal('tt-modal')" class="text-indigo-400 hover:text-rose-500 font-black text-2xl bg-white w-12 h-12 rounded-full shadow-sm">✕</button>
            </div>
            <div id="tt-modal-grid" class="p-6 sm:p-8 overflow-y-auto bg-slate-50 custom-scroll space-y-6"></div>
        </div>
    </div>

    <script>
        // FIREBASE INIT
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStaff = [];
        let formConfig = null;
        let editingStaffId = null;
        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        // Role & Auth State
        let currentUserRole = 'NONE'; // 'ADMIN' or 'HOD'
        let currentUserDept = null;
        let activeStaffData = null;
        let isLiveStatusActive = false; // For toggle feature

        // Reports State
        let currentReportsData = [];
        let reportModalMode = 'NONE'; 
        let selectedStaffForReport = null; 

        async function init() {
            // Determine Access Level
            const isAdminAuth = sessionStorage.getItem('minervaAdminAuth') === 'true';
            activeStaffData = JSON.parse(localStorage.getItem('minervaActiveStaff'));

            // Prioritize Teacher HOD login if they accessed this from the Teacher Portal
            if (activeStaffData) {
                try {
                    const snap = await db.collection("staff_applications").where("email", "==", activeStaffData.email).get();
                    if (!snap.empty) {
                        const d = snap.docs[0].data();
                        if (d.isHOD === true) {
                            currentUserRole = 'HOD';
                            currentUserDept = d.hodDept;
                            document.getElementById('header-role').innerText = `HOD Access: ${currentUserDept}`;
                        } else if (isAdminAuth) {
                            currentUserRole = 'ADMIN';
                            document.getElementById('header-role').innerText = "Administrator Access";
                            document.getElementById('auth-btn').classList.remove('hidden');
                        } else {
                            alert("You are not authorized to view the Faculty Hub.");
                            window.location.replace('teacher-portal.html');
                            return;
                        }
                    } else {
                        window.location.replace('teacher-portal.html'); return;
                    }
                } catch(e) { window.location.replace('teacher-portal.html'); return; }
            } else if (isAdminAuth) {
                currentUserRole = 'ADMIN';
                document.getElementById('header-role').innerText = "Administrator Access";
                document.getElementById('auth-btn').classList.remove('hidden');
            } else {
                window.location.replace('staff-login.html'); return;
            }

            await fetchConfig();
            await fetchStaff();
        }

        function handleBack() {
            if (currentUserRole === 'HOD' || activeStaffData) {
                window.location.href = 'teacher-portal.html';
            } else {
                window.location.href = 'admin.html';
            }
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function fetchConfig() {
            const doc = await db.collection("configs").doc("staff_registration_form").get();
            if (doc.exists) {
                formConfig = doc.data();
                setupSearchAndFilters();
            }
        }

        function getPrimaryDept(rawDeptStr) {
            if (!rawDeptStr) return 'General';
            const parts = rawDeptStr.split(',');
            const primary = parts[0].trim();
            return (primary && primary !== 'undefined') ? primary : 'General';
        }

        function setupSearchAndFilters() {
            const filterArea = document.getElementById('filter-container');
            const searchArea = document.getElementById('search-container');
            const hasSearch = formConfig.fields.some(f => f.searchable);
            if (hasSearch) searchArea.classList.remove('hidden');

            formConfig.fields.filter(f => f.filterable).forEach(f => {
                const select = document.createElement('select');
                select.className = "p-4 bg-white border-2 border-slate-200 rounded-xl text-xs font-black uppercase tracking-widest outline-none focus:border-blue-500 cursor-pointer shadow-sm";
                select.id = `filter-${f.label}`;
                select.onchange = applyFilters;
                
                let options = `<option value="">All ${f.label}s</option>`;
                f.options.split(',').forEach(opt => {
                    options += `<option value="${opt.trim()}">${opt.trim()}</option>`;
                });
                select.innerHTML = options;
                filterArea.appendChild(select);
            });
        }

        async function fetchStaff() {
            const snapshot = await db.collection("staff_applications").where("status", "==", "approved").get();
            
            let rawStaff = snapshot.docs.map(doc => {
                const d = doc.data();
                const deptKey = Object.keys(d.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject') || k.toLowerCase().includes('branch'));
                let rawDept = deptKey ? d.details[deptKey] : 'General';
                if (rawDept === undefined || rawDept === null) rawDept = 'General';
                rawDept = rawDept.toString();
                
                return { id: doc.id, email: d.email, mobile: d.mobile, status: d.status, details: d.details, rawDept: rawDept, isHOD: d.isHOD, hodDept: d.hodDept };
            });

            if (currentUserRole === 'HOD') {
                rawStaff = rawStaff.filter(s => s.rawDept.includes(currentUserDept));
            }

            allStaff = rawStaff;
            document.getElementById('staff-count').innerText = allStaff.length;
            
            renderStaffGrouped(allStaff);
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            let filtered = allStaff.filter(s => {
                const matchesSearch = !searchTerm || 
                    s.email.toLowerCase().includes(searchTerm) || 
                    s.mobile.includes(searchTerm) ||
                    Object.values(s.details).some(v => String(v).toLowerCase().includes(searchTerm));

                const matchesFilters = formConfig.fields.filter(f => f.filterable).every(f => {
                    const filterVal = document.getElementById(`filter-${f.label}`).value;
                    if (!filterVal) return true;
                    return s.details[f.label] === filterVal || (Array.isArray(s.details[f.label]) && s.details[f.label].includes(filterVal));
                });
                return matchesSearch && matchesFilters;
            });
            
            renderStaffGrouped(filtered);
            
            // Re-apply live status if it is currently toggled ON
            if(isLiveStatusActive) {
                isLiveStatusActive = false; // temporarily shut off so toggle runs
                toggleLiveStatus();
            }
        }

        function renderStaffGrouped(data) {
            const container = document.getElementById('staff-grid');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `<div class="py-20 text-center bg-white rounded-[3rem] border border-slate-200"><p class="text-slate-400 font-black uppercase text-sm tracking-widest">No matching records found.</p></div>`;
                return;
            }

            const grouped = {};
            data.forEach(s => {
                const pDept = getPrimaryDept(s.rawDept);
                if (!grouped[pDept]) grouped[pDept] = [];
                grouped[pDept].push(s);
            });

            const sortedDepts = Object.keys(grouped).sort();

            sortedDepts.forEach(dept => {
                const staffList = grouped[dept].sort((a,b) => {
                    const nameA = Object.keys(a.details).find(k => k.toLowerCase().includes('name')) ? a.details[Object.keys(a.details).find(k => k.toLowerCase().includes('name'))] : a.email;
                    const nameB = Object.keys(b.details).find(k => k.toLowerCase().includes('name')) ? b.details[Object.keys(b.details).find(k => k.toLowerCase().includes('name'))] : b.email;
                    return nameA.localeCompare(nameB);
                });

                let cardsHtml = staffList.map(s => {
                    const nameKey = Object.keys(s.details).find(key => key.toLowerCase().includes('name'));
                    const staffName = nameKey ? s.details[nameKey] : s.email;
                    const cleanMobile = s.mobile.replace(/\D/g, ''); 
                    
                    return `
                    <details class="bg-white rounded-[2rem] border border-slate-200 shadow-md hover:shadow-xl transition-all group relative overflow-hidden">
                        <summary class="p-6 sm:p-8 cursor-pointer outline-none block">
                            ${s.isHOD ? `<div class="absolute top-0 right-0 bg-amber-400 text-amber-900 text-[9px] font-black px-4 py-1 rounded-bl-xl uppercase tracking-widest shadow-sm z-10">HOD</div>` : ''}
                            
                            <div class="flex justify-between items-start mb-4">
                                <div class="w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-br from-indigo-100 to-blue-50 rounded-[1.2rem] flex items-center justify-center text-indigo-600 font-black text-2xl border border-indigo-200 shadow-inner shrink-0">
                                    ${staffName.substring(0,1).toUpperCase()}
                                </div>
                                <div class="flex gap-2 relative z-20" onclick="event.preventDefault(); event.stopPropagation();">
                                    <button onclick="viewWorkReports('${s.email}', '${staffName.replace(/'/g, "\\'")}')" class="p-3 text-emerald-600 hover:text-white bg-emerald-50 hover:bg-emerald-500 transition-all rounded-xl shadow-sm border border-emerald-100" title="View Work Reports">📊</button>
                                    ${currentUserRole === 'ADMIN' ? `
                                        <button onclick="openEditModal('${s.id}')" class="p-3 text-blue-600 hover:text-white bg-blue-50 hover:bg-blue-500 transition-all rounded-xl shadow-sm border border-blue-100" title="Edit Profile">✏️</button>
                                        <button onclick="revokeStaff('${s.id}')" class="p-3 text-rose-600 hover:text-white bg-rose-50 hover:bg-rose-500 transition-all rounded-xl shadow-sm border border-rose-100" title="Revoke Access">🗑️</button>
                                    ` : ''}
                                </div>
                            </div>
                            
                            <h3 class="font-black text-slate-900 text-xl sm:text-2xl tracking-tighter leading-tight pr-4">${staffName}</h3>
                            <p class="text-slate-400 font-bold text-xs uppercase tracking-widest mb-1 mt-1 truncate" title="${s.email}">${s.email}</p>
                            
                            <div class="text-[10px] font-black text-blue-600 uppercase tracking-widest mt-4 flex items-center gap-2 group-open:hidden">
                                Expand Profile <span class="text-lg leading-none">▾</span>
                            </div>
                            <div class="text-[10px] font-black text-rose-600 uppercase tracking-widest mt-4 hidden items-center gap-2 group-open:flex">
                                Collapse Profile <span class="text-lg leading-none">▴</span>
                            </div>
                        </summary>
                        
                        <div class="px-6 pb-6 sm:px-8 sm:pb-8 pt-2 border-t border-slate-100">
                            <p class="text-indigo-600 font-black text-sm mb-4">${s.mobile}</p>

                            <div id="live-status-${s.id}" class="mb-5 text-left">
                                <span class="inline-block px-4 py-2 bg-slate-50 text-slate-400 text-[10px] sm:text-xs font-black uppercase tracking-widest rounded-xl border border-slate-200">Status Paused - Click Live Status</span>
                            </div>

                            <div class="flex gap-3 mb-6">
                                <a href="tel:${cleanMobile}" class="flex-1 bg-slate-50 text-slate-700 py-3 sm:py-4 rounded-xl border border-slate-200 flex items-center justify-center gap-2 hover:bg-slate-100 transition-colors shadow-sm">
                                    <span class="text-[10px] sm:text-xs font-black uppercase tracking-widest">Call</span>
                                </a>
                                <a href="https://wa.me/91${cleanMobile}" target="_blank" class="flex-1 bg-emerald-50 text-emerald-700 py-3 sm:py-4 rounded-xl border border-emerald-200 flex items-center justify-center gap-2 hover:bg-emerald-100 transition-colors shadow-sm">
                                    <span class="text-[10px] sm:text-xs font-black uppercase tracking-widest">WhatsApp</span>
                                </a>
                            </div>
                            
                            <div class="space-y-3 pt-5 border-t border-slate-100 flex-grow">
                                ${Object.entries(s.details)
                                    .filter(([k]) => !k.toLowerCase().includes('name'))
                                    .map(([k, v]) => `

        // --- EXCEL EXPORT ENGINE --- //
        async function exportData() {
            if (currentUserRole !== 'ADMIN') return alert("Only Administrators can run full exports.");
            const btn = document.getElementById('export-btn');
            const origHTML = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin">⏳</span> Exporting...`;
            btn.disabled = true;

            try {
                const workbook = new ExcelJS.Workbook();
                
                // --- SHEET 1: STAFF DIRECTORY ---
                const staffSheet = workbook.addWorksheet('Staff Directory');
                let detailKeys = new Set();
                allStaff.forEach(s => Object.keys(s.details).forEach(k => detailKeys.add(k)));
                detailKeys = Array.from(detailKeys);

                let staffColumns = [
                    { header: 'Name', key: 'name', width: 25 },
                    { header: 'Email', key: 'email', width: 30 },
                    { header: 'Mobile', key: 'mobile', width: 15 },
                    { header: 'Primary Dept', key: 'dept', width: 20 },
                    { header: 'Role', key: 'role', width: 15 }
                ];
                detailKeys.forEach(k => {
                    if(!k.toLowerCase().includes('name')) staffColumns.push({ header: k.toUpperCase(), key: k, width: 20 });
                });
                
                staffSheet.columns = staffColumns;
                staffSheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                staffSheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E1B4B' } }; // Indigo-900

                allStaff.forEach(s => {
                    const nameKey = Object.keys(s.details).find(k=>k.toLowerCase().includes('name'));
                    let rowData = {
                        name: nameKey ? s.details[nameKey] : s.email,
                        email: s.email,
                        mobile: s.mobile,
                        dept: getPrimaryDept(s.rawDept),
                        role: s.isHOD ? `HOD (${s.hodDept})` : 'Faculty'
                    };
                    detailKeys.forEach(k => {
                        if(!k.toLowerCase().includes('name')) {
                            const val = s.details[k];
                            rowData[k] = Array.isArray(val) ? val.join(', ') : val;
                        }
                    });
                    staffSheet.addRow(rowData);
                });

                // --- SHEET 2: ALL REPORTS & REMARKS ---
                const repSheet = workbook.addWorksheet('Daily Reports & Remarks');
                repSheet.columns = [
                    { header: 'Date', key: 'date', width: 15 },
                    { header: 'Teacher', key: 'teacher', width: 25 },
                    { header: 'Department', key: 'dept', width: 20 },
                    { header: 'Classes Taken', key: 'classes', width: 40 },
                    { header: 'Duties Completed', key: 'duties', width: 35 },
                    { header: 'Additional Work', key: 'work', width: 50 },
                    { header: 'HOD Remark', key: 'hod_rem', width: 40 },
                    { header: 'Admin Remark', key: 'admin_rem', width: 40 }
                ];
                repSheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                repSheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF047857' } }; // Emerald-700

                const repSnap = await db.collection("daily_reports").get();
                let reports = repSnap.docs.map(d => d.data());
                reports.sort((a,b) => new Date(b.date) - new Date(a.date));

                reports.forEach(r => {
                    const tObj = allStaff.find(s => s.email === r.teacherEmail);
                    const dept = tObj ? getPrimaryDept(tObj.rawDept) : 'Unknown';
                    
                    let clsStr = (r.classesConducted || []).map(c => `• ${c.className} ${c.section} (${c.subject})`).join('\n');
                    let dutStr = (r.dutiesCompleted || []).map(d => `• ${d.type} - ${d.className} ${d.section}`).join('\n');

                    repSheet.addRow({
                        date: new Date(r.date).toLocaleDateString('en-GB'),
                        teacher: r.teacherName,
                        dept: dept,
                        classes: clsStr || 'None',
                        duties: dutStr || 'None',
                        work: r.additionalWork || 'None',
                        hod_rem: r.hodRemark || '',
                        admin_rem: r.adminRemark || ''
                    });
                });

                // Format Rows for Text Wrapping
                repSheet.eachRow((row, rowNumber) => {
                    row.alignment = { vertical: 'top', wrapText: true };
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                saveAs(blob, `Minerva_Faculty_Data_${new Date().toISOString().split('T')[0]}.xlsx`);

            } catch (err) {
                console.error("Export Error:", err);
                alert("Failed to export data.");
            } finally {
                btn.innerHTML = origHTML;
                btn.disabled = false;
            }
        }

                const nb = Object.keys(b.details).find(k=>k.toLowerCase().includes('name')) ? b.details[Object.keys(b.details).find(k=>k.toLowerCase().includes('name'))] : b.email;

            staffSelect.innerHTML = `<option value="">-- Select Faculty --</option>` + staffInDept.map(s => {

        async function grantHODAuth() {
            const staffId = document.getElementById('auth-staff').value;
            const dept = document.getElementById('auth-dept').value;
            if(!staffId || !dept) return alert("Select both Department and Staff member.");
            try {
                await db.collection("staff_applications").doc(staffId).update({ isHOD: true, hodDept: dept });
                const staff = allStaff.find(s => s.id === staffId);
                if(staff) { staff.isHOD = true; staff.hodDept = dept; }
                renderAuthList();
                renderStaffGrouped(allStaff);
                alert("HOD Authority Granted!");
            } catch(e) { alert("Error granting rights."); }
        }

        async function revokeHODAuth(staffId) {
            if(!confirm("Revoke HOD Authority? They will lose access to department reports.")) return;
            try {
                await db.collection("staff_applications").doc(staffId).update({ isHOD: false, hodDept: firebase.firestore.FieldValue.delete() });
                const staff = allStaff.find(s => s.id === staffId);
                if(staff) { staff.isHOD = false; delete staff.hodDept; }
                renderAuthList();
                renderStaffGrouped(allStaff);
            } catch(e) { alert("Error revoking rights."); }
        }

      async function fetchAndRenderReports() {
            const feed = document.getElementById('rm-feed');
            feed.innerHTML = `<div class="text-center py-32"><span class="loader mb-4 border-slate-300 border-t-blue-600"></span><br><span class="text-slate-400 font-black uppercase tracking-widest text-xs">Compiling Auto-Synced System Reports...</span></div>`;
            
            try {
                // 1. Determine Target Dates
                let targetDates = [];
                if (reportModalMode === 'DATE_WISE') {
                    const dateVal = document.getElementById('rm-single-date').value;
                    if(!dateVal) return alert("Select a date.");
                    targetDates.push(dateVal);
                } else {
                    const fromDate = document.getElementById('rm-from-date').value;
                    const toDate = document.getElementById('rm-to-date').value;
                    if(!fromDate || !toDate) return alert("Select date range.");
                    let curr = new Date(fromDate);
                    let end = new Date(toDate);
                    while(curr <= end) {
                        targetDates.push(curr.toISOString().split('T')[0]);
                        curr.setDate(curr.getDate() + 1);
                    }
                }

                // 2. Fetch all necessary data
                const plannerSnap = await db.collection("lesson_planners").get();
                const assignSnap = await db.collection("lesson_planner_assignments").get();
                const dailySnap = await db.collection("daily_reports").get();
                const rosterSnap = await db.collection("duty_rosters").get();
                const holSnap = await db.collection("school_holidays").get();
                
                const planners = plannerSnap.docs.map(d => ({id: d.id, ...d.data()}));
                const assignments = assignSnap.docs.map(d => ({id: d.id, ...d.data()}));
                const holidaysData = holSnap.docs.map(d => d.data());
                
                let groupedReports = {}; 
                const allowedEmails = currentUserRole === 'HOD' ? allStaff.map(s => s.email) : null;
                const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

                const teacherLookup = (nameOrEmail) => {
                    if(!nameOrEmail) return { name: 'Unknown', email: 'unknown@example.com' };
                    const s = allStaff.find(st => {
                        let nKey = Object.keys(st.details).find(k=>k.toLowerCase().includes('name'));
                        return st.email === nameOrEmail || (nKey && st.details[nKey] === nameOrEmail);
                    });
                    if (s) {
                        let nKey = Object.keys(s.details).find(k=>k.toLowerCase().includes('name'));
                        return { name: nKey ? s.details[nKey] : s.email, email: s.email };
                    }
                    return { name: nameOrEmail, email: nameOrEmail };
                };

                // --- PHASE 1: BUILD VIRTUAL REPORTS FROM TIMETABLE & DUTIES (The Absolute Truth) ---
                for (let tDate of targetDates) {
                    const dateObj = new Date(tDate);
                    if (dateObj.getDay() === 0) continue; // Skip Sunday
                    const dayName = daysOfWeek[dateObj.getDay()];

                    // Filter Holidays automatically
                    let isHoliday = false;
                    const checkDate = new Date(tDate); checkDate.setHours(0,0,0,0);
                    for (let h of holidaysData) {
                        if (!h.startDate) continue;
                        const hStart = new Date(h.startDate); hStart.setHours(0,0,0,0);
                        const hEnd = new Date(h.endDate || h.startDate); hEnd.setHours(23,59,59,999);
                        if (checkDate >= hStart && checkDate <= hEnd && h.isFullDay) { isHoliday = true; break; }
                    }
                    if (isHoliday) continue; 

                    // Inject Timetable Classes
                    const dayTt = timetableData.filter(t => t.day === dayName);
                    dayTt.forEach(cls => {
                        const tStaff = teacherLookup(cls.teacherName || cls.teacher);
                        if (!tStaff.email || tStaff.email === 'unknown@example.com' || tStaff.email === 'NONE') return;
                        if (currentUserRole === 'HOD' && !allowedEmails.includes(tStaff.email)) return;
                        if (reportModalMode === 'INDIVIDUAL' && tStaff.email !== selectedStaffForReport) return;

                        const key = `${tStaff.email}_${tDate}`;
                        if (!groupedReports[key]) {
                            groupedReports[key] = { id: `${tDate}_${tStaff.email}`, date: tDate, teacherEmail: tStaff.email, teacherName: tStaff.name, classesConducted: [], dutiesCompleted: [], additionalWork: "", syllabusProgress: [], activityLogs: [] };
                        }

                        // Protect against duplicating same classes
                        let exists = groupedReports[key].classesConducted.find(c => c.className === cls.className && c.section === cls.section && c.subject === cls.subject);
                        if (!exists) {
                            groupedReports[key].classesConducted.push({
                                className: cls.className,
                                section: cls.section,
                                subject: cls.subject,
                                time: cls.timeRange || (format12Hour(cls.start24) + ' - ' + format12Hour(cls.end24))
                            });
                        }
                    });

                    // Inject Assigned Duties
                    const diffToMonday = dateObj.getDate() - dateObj.getDay() + (dateObj.getDay() === 0 ? -6 : 1);
                    const mondayDate = new Date(new Date(dateObj).setDate(diffToMonday));
                    const weekId = "week_starting_" + mondayDate.toISOString().split('T')[0];
                    const rosterDoc = rosterSnap.docs.find(d => d.id === weekId);
                    
                    if (rosterDoc) {
                        const rosterData = rosterDoc.data().rosterData;
                        Object.keys(rosterData).forEach(clsKey => {
                            const dayDuty = rosterData[clsKey].days[dayName];
                            if (dayDuty && dayDuty.status === 'ASSIGNED' && dayDuty.staff) {
                                const tStaff = teacherLookup(dayDuty.staff.email);
                                if (!tStaff.email || tStaff.email === 'unknown@example.com') return;
                                if (currentUserRole === 'HOD' && !allowedEmails.includes(tStaff.email)) return;
                                if (reportModalMode === 'INDIVIDUAL' && tStaff.email !== selectedStaffForReport) return;

                                const key = `${tStaff.email}_${tDate}`;
                                if (!groupedReports[key]) {
                                    groupedReports[key] = { id: `${tDate}_${tStaff.email}`, date: tDate, teacherEmail: tStaff.email, teacherName: tStaff.name, classesConducted: [], dutiesCompleted: [], additionalWork: "", syllabusProgress: [], activityLogs: [] };
                                }
                                
                                let className = rosterData[clsKey].cName; let sectionName = rosterData[clsKey].sName;
                                if(!className) { const pts = clsKey.split('|'); className = pts[0]; sectionName = pts[1]; }

                                groupedReports[key].dutiesCompleted.push({
                                    type: "Assigned Duty",
                                    className: className,
                                    section: sectionName,
                                    time: dayDuty.timing || "No Time Set"
                                });
                            }
                        });
                    }
                }

                // --- PHASE 2: OVERLAY LESSON PLANNERS (Syllabus & Activities) ---
                planners.forEach(p => {
                    const assign = assignments.find(a => a.id === p.id) || {};
                    let clsName = assign.className; let secName = assign.section; let subName = assign.subject;
                    if (!clsName) {
                        const pts = p.id.split('_');
                        if (pts.length >= 3) { clsName = pts[0]; secName = pts[1]; subName = pts[2].replace(/_/g, ' '); }
                    }

                    if (p.syllabusData) {
                        p.syllabusData.forEach(topic => {
                            if (topic.isDone && topic.completedDate && targetDates.includes(topic.completedDate)) {
                                const tStaff = teacherLookup(topic.tickedBy || assign.assignedTo);
                                const key = `${tStaff.email}_${topic.completedDate}`;
                                if (groupedReports[key]) {
                                    groupedReports[key].syllabusProgress.push({ className: clsName, section: secName, subject: subName, chapter: topic['CHAPTER NAME'], subtopic: topic['SUBTOPICS'] });
                                }
                            }
                        });
                    }

                    if (p.activityLogs) {
                        p.activityLogs.forEach(log => {
                            if (targetDates.includes(log.date)) {
                                const tStaff = teacherLookup(log.loggedBy || assign.assignedTo);
                                const key = `${tStaff.email}_${log.date}`;
                                if (groupedReports[key]) {
                                    groupedReports[key].activityLogs.push({ className: clsName, section: secName, subject: subName, reason: log.reason, minutes: log.minutes });
                                }
                            }
                        });
                    }
                });

                // --- PHASE 3: OVERLAY MANUAL REPORTS (Extra work & Remarks) ---
                dailySnap.docs.forEach(d => {
                    const data = d.data();
                    if(targetDates.includes(data.date)) {
                        const key = `${data.teacherEmail}_${data.date}`;
                        if (groupedReports[key]) {
                            if(data.hodRemark) groupedReports[key].hodRemark = data.hodRemark;
                            if(data.adminRemark) groupedReports[key].adminRemark = data.adminRemark;
                            if(data.additionalWork && data.additionalWork.trim() !== "") {
                                groupedReports[key].additionalWork = data.additionalWork.trim();
                            }
                            groupedReports[key].id = d.id; // Crucial for saving remarks
                        }
                    }
                });

                let rawReports = Object.values(groupedReports);
                rawReports.sort((a,b) => new Date(b.date) - new Date(a.date));
                currentReportsData = rawReports;
                document.getElementById('rm-stats').innerText = `${currentReportsData.length} Auto-Compiled Reports`;
                renderReportsList();
            } catch(e) { 
                console.error(e);
                feed.innerHTML = `<div class="text-center py-32 text-rose-500 font-black uppercase tracking-widest text-sm">Error compiling cross-database analytics.</div>`; 
            }
        }

        function renderReportsList() {
            const feed = document.getElementById('rm-feed');
            const remarksOnly = document.getElementById('rm-remarks-only').checked;
            if (currentReportsData.length === 0) {
                feed.innerHTML = `<div class="bg-white border-2 border-dashed border-slate-300 p-10 rounded-[2rem] text-center shadow-inner"><p class="text-sm font-black text-slate-400 uppercase tracking-widest">No reports submitted for the selected criteria.</p></div>`;
                return;
            }
            
            if (reportModalMode === 'DATE_WISE') {
                const grouped = {};
                currentReportsData.forEach(rep => {
                    const staffObj = allStaff.find(s => s.email === rep.teacherEmail);
                    const dept = staffObj ? getPrimaryDept(staffObj.rawDept) : 'General';
                    if(!grouped[dept]) grouped[dept] = [];
                    grouped[dept].push(rep);
                });
                feed.innerHTML = Object.keys(grouped).sort().map(dept => `
                    <details class="bg-white border-2 border-slate-200 rounded-[2.5rem] shadow-sm overflow-hidden group/rdept mb-6" open>
                        <summary class="p-6 bg-slate-100/50 border-b border-slate-200 font-black text-slate-800 text-lg uppercase tracking-widest cursor-pointer select-none flex justify-between items-center outline-none hover:bg-slate-200 transition-colors">
                            <div class="flex items-center gap-3"><span class="bg-white p-2 rounded-xl shadow-sm border border-slate-200">🏢</span> ${dept}</div>
                            <div class="flex items-center gap-4">
                                <span class="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs shadow-md">${grouped[dept].length} Reports</span>
                                <span class="text-slate-400 group-open/rdept:rotate-180 transition-transform text-2xl">▼</span>
                            </div>
                        </summary>
                        <div class="p-6 bg-slate-50/50 space-y-8">${grouped[dept].map(rep => generateReportCardHTML(rep, remarksOnly)).join('')}</div>
                    </details>
                `).join('');
            } else {
                feed.innerHTML = currentReportsData.map(rep => {
                    const prettyDate = new Date(rep.date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                    return `
                    <details class="bg-white border-2 border-slate-200 rounded-[2.5rem] shadow-sm overflow-hidden mb-6 group">
                        <summary class="p-6 sm:p-8 bg-slate-50 border-b border-slate-200 font-black text-slate-800 text-lg uppercase tracking-widest cursor-pointer select-none flex justify-between items-center outline-none hover:bg-slate-100 transition-colors">
                            <div class="flex items-center gap-4">
                                <span class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 text-2xl">📅</span>
                                <div><div class="text-base sm:text-lg tracking-tighter text-blue-700">${prettyDate}</div></div>
                            </div>
                            <span class="text-slate-400 group-open:rotate-180 transition-transform text-2xl">▼</span>
                        </summary>
                        <div class="p-0 bg-slate-50/50">
                            ${generateReportCardHTML(rep, remarksOnly)}
                        </div>
                    </details>
                    `;
                }).join('');
            }
        }

        function generateReportCardHTML(rep, remarksOnly) {
            const prettyDate = new Date(rep.date).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
            const isHOD = currentUserRole === 'HOD';
            const isAdmin = currentUserRole === 'ADMIN';
            const hodRemarkVal = rep.hodRemark || "";
            const adminRemarkVal = rep.adminRemark || "";
            const hodDisabled = isHOD ? '' : 'disabled';
            const adminDisabled = isAdmin ? '' : 'disabled';
            const hodBg = isHOD ? 'bg-white focus:border-amber-400 focus:ring-4 focus:ring-amber-50' : 'bg-slate-100 opacity-80';
            const adminBg = isAdmin ? 'bg-white focus:border-rose-400 focus:ring-4 focus:ring-rose-50' : 'bg-slate-100 opacity-80';

            const remarksHTML = `
                <div class="mt-6 border-4 border-rose-100 bg-rose-50/30 p-6 rounded-[2rem] shadow-inner relative">
                    <div class="absolute -top-3 left-6 bg-white px-4 py-1 border-2 border-rose-200 rounded-full text-[10px] font-black text-rose-600 uppercase tracking-widest shadow-sm">🔒 Confidential Remarks</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                        <div>
                            <label class="flex justify-between items-center text-xs font-black text-amber-700 uppercase tracking-widest mb-2 ml-1"><span>HOD Remark</span>${!isHOD && hodRemarkVal ? '<span class="text-[9px] bg-amber-100 px-2 py-0.5 rounded text-amber-800">Read Only</span>' : ''}</label>
                            <textarea id="hod-rem-${rep.id}" rows="3" class="w-full p-4 border border-amber-200 rounded-xl text-sm font-bold text-slate-700 outline-none transition-all custom-scroll shadow-sm placeholder-slate-300 ${hodBg}" placeholder="HOD review notes..." ${hodDisabled}>${hodRemarkVal}</textarea>
                        </div>
                        <div>
                            <label class="flex justify-between items-center text-xs font-black text-rose-700 uppercase tracking-widest mb-2 ml-1"><span>Admin Remark</span>${!isAdmin && adminRemarkVal ? '<span class="text-[9px] bg-rose-100 px-2 py-0.5 rounded text-rose-800">Read Only</span>' : ''}</label>
                            <textarea id="admin-rem-${rep.id}" rows="3" class="w-full p-4 border border-rose-200 rounded-xl text-sm font-bold text-slate-700 outline-none transition-all custom-scroll shadow-sm placeholder-slate-300 ${adminBg}" placeholder="Administrator final notes..." ${adminDisabled}>${adminRemarkVal}</textarea>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-end">
                        <button onclick="saveRemarks('${rep.id}')" class="bg-slate-800 text-white px-6 py-3 rounded-xl font-black text-xs uppercase tracking-widest shadow-md hover:bg-slate-700 transition-colors">💾 Save Remarks</button>
                    </div>
                </div>
            `;

            if (remarksOnly) {
                return `
                <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-md m-6 sm:m-8 mt-0">
                    <div class="flex justify-between items-center mb-2 border-b border-slate-100 pb-4">
                        <div><h4 class="font-black text-slate-900 text-lg uppercase tracking-tighter">${rep.teacherName}</h4><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">${prettyDate}</p></div>
                    </div>
                    ${remarksHTML}
                </div>`;
            }

         let classesHtml = `<div class="text-xs font-bold text-slate-400 uppercase tracking-widest p-4 bg-slate-50 rounded-xl border border-slate-100">No classes reported.</div>`;
            if (rep.classesConducted && rep.classesConducted.length > 0) {
                classesHtml = rep.classesConducted.map(c => {
                    let topics = rep.syllabusProgress ? rep.syllabusProgress.filter(s => s.className === c.className && s.section === c.section && s.subject === c.subject) : [];
                    let activities = rep.activityLogs ? rep.activityLogs.filter(a => a.className === c.className && a.section === c.section && a.subject === c.subject) : [];
                    
                    let sylHtml = "";
                    
                    if (topics.length > 0 || activities.length > 0) {
                        if (topics.length > 0) {
                            sylHtml += topics.map(t => `<div class="text-[10px] font-bold text-emerald-800 bg-emerald-50 p-3 rounded-xl border border-emerald-200 mt-3 shadow-sm">📚 <span class="font-black uppercase text-emerald-900">${t.chapter}</span> <br> <span class="text-emerald-600 mt-1 inline-block">${t.subtopic}</span></div>`).join('');
                        }
                        if (activities.length > 0) {
                            sylHtml += activities.map(a => `<div class="text-[10px] font-bold text-amber-800 bg-amber-50 p-3 rounded-xl border border-amber-200 mt-3 shadow-sm">🎯 <span class="font-black uppercase text-amber-900">Activity / Revision</span> <br> <span class="text-amber-700 mt-1 inline-block">${a.reason} (${Math.floor(a.minutes)}m)</span></div>`).join('');
                        }
                    } else {
                        sylHtml = `<div class="text-[10px] font-black text-rose-500 uppercase mt-4 bg-rose-50 px-3 py-2 rounded-lg border border-rose-200 inline-block shadow-sm">⚠️ No Syllabus or Activity Marked</div>`;
                    }

                    return `
                    <div class="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm">
                        <div class="flex justify-between items-start">
                            <div><div class="font-black text-slate-800 text-sm uppercase">${c.className} | ${c.section}</div><div class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mt-1">${c.subject}</div></div>
                            <div class="text-[9px] font-black bg-slate-100 px-3 py-1.5 rounded-lg uppercase tracking-widest text-slate-500 border border-slate-200">${c.time}</div>
                        </div>
                        ${sylHtml}
                    </div>`;
                }).join('');
            }

            let dutiesHtml = `<div class="text-xs font-bold text-slate-400 uppercase tracking-widest p-4 bg-slate-50 rounded-xl border border-slate-100">No duties reported.</div>`;
            if (rep.dutiesCompleted && rep.dutiesCompleted.length > 0) {
                dutiesHtml = rep.dutiesCompleted.map(d => `
                    <div class="flex justify-between items-center p-4 bg-amber-50 border border-amber-200 rounded-2xl shadow-sm">
                        <div><div class="font-black text-amber-900 text-sm uppercase">${d.type}</div><div class="text-[10px] font-bold text-amber-700 uppercase tracking-widest mt-1">${d.className} | Sec ${d.section}</div></div>
                        <div class="text-[9px] font-black bg-white px-3 py-1.5 rounded-lg uppercase tracking-widest text-amber-800 border border-amber-300">${d.time}</div>
                    </div>
                `).join('');
            }

            let workHtml = `<div class="text-xs font-bold text-slate-400 uppercase tracking-widest p-4 bg-slate-50 rounded-xl border border-slate-100">No additional work logged.</div>`;
            if (rep.additionalWork) workHtml = `<div class="p-5 bg-blue-50/50 border border-blue-100 rounded-2xl text-sm font-bold text-slate-700 leading-relaxed shadow-inner whitespace-pre-wrap">${rep.additionalWork}</div>`;

            return `
            <div class="bg-white p-6 sm:p-8 rounded-b-[2.5rem] border-t border-slate-200 m-0">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6 border-b border-slate-100 pb-6 gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center font-black text-xl shadow-inner border border-indigo-200">${rep.teacherName.substring(0,1).toUpperCase()}</div>
                        <div><h4 class="font-black text-slate-900 text-xl sm:text-2xl uppercase tracking-tighter">${rep.teacherName}</h4><p class="text-[10px] sm:text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">${rep.teacherEmail}</p></div>
                    </div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 sm:gap-8">
                    <div><h5 class="text-[10px] sm:text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><span>📚</span> Academic Classes</h5><div class="space-y-3">${classesHtml}</div></div>
                    <div class="space-y-6 sm:space-y-8">
                        <div><h5 class="text-[10px] sm:text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><span>🛡️</span> Assigned Duties</h5><div class="space-y-3">${dutiesHtml}</div></div>
                        <div><h5 class="text-[10px] sm:text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><span>📝</span> Additional Work & Revision</h5>${workHtml}</div>
                    </div>
                </div>
                ${remarksHTML}
            </div>`;
        }

        async function saveRemarks(reportId) {
            const hodEl = document.getElementById(`hod-rem-${reportId}`);
            const adminEl = document.getElementById(`admin-rem-${reportId}`);
            const btn = event.target;
            const orig = btn.innerText;

            btn.innerText = "Saving..."; btn.disabled = true;

            let updateData = {};
            if (currentUserRole === 'HOD' && hodEl && !hodEl.disabled) updateData.hodRemark = hodEl.value.trim();
            if (currentUserRole === 'ADMIN' && adminEl && !adminEl.disabled) updateData.adminRemark = adminEl.value.trim();

            const rep = currentReportsData.find(r => r.id === reportId);
            if(rep) {
                updateData.teacherEmail = rep.teacherEmail;
                updateData.teacherName = rep.teacherName;
                updateData.date = rep.date;
            }

            try {
                await db.collection("daily_reports").doc(reportId).set(updateData, { merge: true });
                
                if(rep) {
                    if (updateData.hodRemark !== undefined) rep.hodRemark = updateData.hodRemark;
                    if (updateData.adminRemark !== undefined) rep.adminRemark = updateData.adminRemark;
                }
                btn.innerText = "✅ Saved";
                btn.classList.replace('bg-slate-800', 'bg-emerald-600');
                btn.classList.replace('hover:bg-slate-700', 'hover:bg-emerald-500');
                setTimeout(() => {
                    btn.innerText = orig;
                    btn.disabled = false;
                    btn.classList.replace('bg-emerald-600', 'bg-slate-800');
                    btn.classList.replace('hover:bg-emerald-500', 'hover:bg-slate-700');
                }, 2000);
            } catch(e) {
                alert("Error saving remarks: " + e.message);
                btn.innerText = orig; btn.disabled = false;
            }
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12) hours = 0;
            if (modifier === 'PM') hours += 12;
            return hours * 60 + minutes;
        }

        async function toggleLiveStatus() {
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('live-icon');
            const text = document.getElementById('live-text');

            if (isLiveStatusActive) {
                isLiveStatusActive = false;
                icon.innerHTML = '🔴';
                icon.classList.add('animate-pulse');
                text.innerText = 'Live Status';
                btn.classList.replace('bg-slate-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-slate-400', 'hover:bg-rose-400');
                
                allStaff.forEach(staff => {
                    const statusDiv = document.getElementById(`live-status-${staff.id}`);
                    if(statusDiv) statusDiv.innerHTML = `<span class="inline-block px-4 py-2 bg-slate-50 text-slate-400 text-[10px] sm:text-xs font-black uppercase tracking-widest rounded-xl border border-slate-200">Status Paused - Click Live Status</span>`;
                });
                return;
            }

            isLiveStatusActive = true;
            icon.innerHTML = '⏳';
            icon.classList.add('animate-spin');
            icon.classList.remove('animate-pulse');
            text.innerText = 'Syncing...';
            btn.disabled = true;

            const todayStr = daysOfWeek[new Date().getDay()];
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();

            try {
                const snap = await db.collection("timetable").where("day", "==", todayStr).get();
                const allTodaysClasses = snap.docs.map(d => d.data());

                for (let staff of allStaff) {
                    const nameKey = Object.keys(staff.details).find(key => key.toLowerCase().includes('name'));
                    const staffName = nameKey ? staff.details[nameKey] : staff.email;
                    const statusDiv = document.getElementById(`live-status-${staff.id}`);
                    if (!statusDiv) continue;

                    const teacherClasses = allTodaysClasses.filter(c => c.teacherName === staffName);
                    let isBusy = false; let busyText = "";

                    for (let cls of teacherClasses) {
                        if (!cls.timeRange) continue;
                        const [startStr, endStr] = cls.timeRange.split(' - ');
                        const startMins = parseTimeToMinutes(startStr);
                        const endMins = parseTimeToMinutes(endStr);

                        if (currentMins >= startMins && currentMins <= endMins) {
                            isBusy = true;
                            busyText = `IN CLASS: ${cls.className} ${cls.section ? '| '+cls.section : ''} <br> <span class="text-rose-200">Room ${cls.room || '--'} (${cls.timeRange})</span>`;
                            break;
                        }
                    }

                    if (isBusy) {
                        statusDiv.innerHTML = `<div class="bg-rose-600 text-white p-3 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-widest leading-tight shadow-md animate-pulse border border-rose-700">${busyText}</div>`;
                    } else {
                        statusDiv.innerHTML = `<span class="inline-block px-4 py-2 bg-emerald-50 text-emerald-700 text-[10px] sm:text-xs font-black uppercase tracking-widest rounded-xl border border-emerald-200 shadow-sm">Currently Free</span>`;
                    }
                }
            } catch(e) {
                console.error("Error fetching live status:", e);
                alert("Failed to sync live status.");
                isLiveStatusActive = false; // Reset on failure
            } finally {
                icon.innerHTML = '⏹️';
                icon.classList.remove('animate-spin');
                text.innerText = 'Stop Live Status';
                btn.classList.replace('bg-rose-500', 'bg-slate-500');
                btn.classList.replace('hover:bg-rose-400', 'hover:bg-slate-400');
                btn.disabled = false;
            }
        }

        // --- EDIT PROFILE ---
        function openEditModal(staffId) {
            editingStaffId = staffId;
            const staff = allStaff.find(s => s.id === staffId);
            const area = document.getElementById('edit-form-area');
            area.innerHTML = `
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Mobile Number</label>
                    <input type="text" id="edit-mobile" value="${staff.mobile}" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-500 shadow-sm">
                </div>
                <div class="w-full h-px bg-slate-200 my-4"></div>
            `;

            Object.entries(staff.details).forEach(([key, value]) => {
                const fieldConfig = formConfig.fields.find(f => f.label === key);
                if (fieldConfig && fieldConfig.type === 'select') {
                    let options = `<option value="">Select...</option>`;
                    fieldConfig.options.split(',').forEach(opt => {
                        let selected = value === opt.trim() ? 'selected' : '';
                        options += `<option value="${opt.trim()}" ${selected}>${opt.trim()}</option>`;
                    });
                    area.innerHTML += `
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">${key}</label>
                            <select id="edit-det-${key}" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-500 shadow-sm cursor-pointer">${options}</select>
                        </div>
                    `;
                } else {
                    area.innerHTML += `
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">${key}</label>
                            <input type="text" id="edit-det-${key}" value="${value}" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-500 shadow-sm">
                        </div>
                    `;
                }
            });
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        async function saveProfileChanges() {
            const staff = allStaff.find(s => s.id === editingStaffId);
            const newMobile = document.getElementById('edit-mobile').value;
            let newDetails = {};
            Object.keys(staff.details).forEach(key => {
                const input = document.getElementById(`edit-det-${key}`);
                if(input) newDetails[key] = input.value;
            });
            try {
                await db.collection("staff_applications").doc(editingStaffId).update({ mobile: newMobile, details: newDetails });
                alert("Profile Updated Successfully!");
                closeModal('edit-modal'); fetchStaff(); 
            } catch (e) { alert("Error saving changes."); }
        }

        // --- TIMETABLE MODAL ---
        async function viewTimetable(staffId, staffName) {
            document.getElementById('tt-modal-name').innerText = staffName;
            const grid = document.getElementById('tt-modal-grid');
            grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest animate-pulse">Fetching schedule...</div>';
            document.getElementById('tt-modal').classList.remove('hidden');

            try {
                const snap = await db.collection("timetable").where("teacherName", "==", staffName).get();
                let dataList = snap.docs.map(d => d.data());

                if (dataList.length === 0) {
                    grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest">No schedule found for this faculty.</div>';
                    return;
                }

                let ttHTML = "";
                daysOfWeek.forEach(day => {
                    if(day === 'Sunday') return; // Usually no classes on Sunday
                    
                    const dayClasses = dataList.filter(d => d.day === day).sort((a,b) => {
                        const timeA = a.timeRange ? a.timeRange.split(' - ')[0] : '12:00 AM';
                        const timeB = b.timeRange ? b.timeRange.split(' - ')[0] : '12:00 AM';
                        return new Date('1970/01/01 ' + timeA) - new Date('1970/01/01 ' + timeB);
                    });

                    if(dayClasses.length > 0) {
                        ttHTML += `
                        <div class="bg-white p-5 sm:p-6 rounded-[2rem] shadow-sm border border-slate-200">
                            <h4 class="font-black text-indigo-700 uppercase tracking-widest mb-4 border-b border-slate-100 pb-3 flex items-center gap-3">
                                <span class="bg-indigo-50 p-2 rounded-xl text-xl shadow-sm border border-indigo-100">📅</span> ${day}
                            </h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${dayClasses.map(item => `
                                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 flex flex-col justify-between hover:border-indigo-300 hover:shadow-md transition-all group">
                                        <div>
                                            <div class="font-black text-slate-800 text-sm uppercase mb-1">${item.className} ${item.section ? '| ' + item.section : ''}</div>
                                            <div class="text-[11px] font-bold text-indigo-600 uppercase tracking-widest mb-4">${item.subject || item.title || 'Duty'}</div>
                                        </div>
                                        <div class="mt-auto pt-4 border-t border-slate-200 flex justify-between items-center">
                                            <span class="text-[10px] font-black bg-white px-3 py-1.5 rounded-lg shadow-sm text-slate-600 border border-slate-100">🕒 ${item.timeRange || '--'}</span>
                                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">RM: ${item.room || '--'}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                    }
                });

                if(!ttHTML) {
                    grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest">No schedule found for this faculty.</div>';
                } else {
                    grid.innerHTML = ttHTML;
                }

            } catch(e) {
                grid.innerHTML = '<div class="text-rose-500 text-center font-bold p-8 uppercase text-xs tracking-widest">Error loading timetable.</div>';
            }
        }

        async function revokeStaff(id) {
            if(confirm("Revoke this staff member's access? They will move back to Pending list.")) {
                await db.collection("staff_applications").doc(id).update({ status: 'pending' });
                fetchStaff();
            }
        }

        init();
    </script>
</body>
