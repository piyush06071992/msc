<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Registered Staff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <header class="h-20 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Registered Faculty</h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="refresh-btn" onclick="checkLiveStatus()" class="bg-rose-100 text-rose-600 hover:bg-rose-200 px-4 py-2 rounded-lg font-black uppercase tracking-widest text-[10px] transition-colors flex items-center gap-2">
                <span class="animate-pulse">🔴</span> Refresh Live Status
            </button>
            <div id="total-stats" class="hidden sm:block text-[10px] font-black text-slate-400 uppercase tracking-widest">
                Total Approved: <span id="staff-count" class="text-blue-600">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8">
        
        <div class="glass p-6 rounded-[2.5rem] border border-white shadow-xl mb-8 space-y-4">
            <div id="search-container" class="hidden">
                <div class="relative">
                    <input type="text" id="search-input" oninput="applyFilters()" placeholder="Search staff records..." class="w-full p-4 pl-12 bg-slate-100 border-none rounded-2xl font-bold outline-none focus:ring-2 focus:ring-blue-500">
                    <svg class="w-5 h-5 text-slate-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
            </div>
            
            <div id="filter-container" class="flex flex-wrap gap-3"></div>
        </div>

        <div id="staff-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-slate-300 font-bold uppercase text-xs animate-pulse tracking-widest">
                Syncing Faculty Records...
            </div>
        </div>
    </main>

    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                <h3 class="font-black text-slate-800 text-xl tracking-tight">Edit Profile</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-rose-500 font-black text-xl">✕</button>
            </div>
            <div id="edit-form-area" class="p-6 overflow-y-auto space-y-4">
                </div>
            <div class="p-6 border-t bg-slate-50 flex gap-3">
                <button onclick="closeEditModal()" class="flex-1 py-3 rounded-xl font-black uppercase tracking-widest text-[10px] text-slate-500 hover:bg-slate-200 transition-colors">Cancel</button>
                <button onclick="saveProfileChanges()" class="flex-1 py-3 rounded-xl font-black uppercase tracking-widest text-[10px] text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="tt-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
                <h3 class="font-black text-slate-800 text-xl tracking-tight">Master Schedule: <span id="tt-modal-name" class="text-blue-600"></span></h3>
                <button onclick="closeTTModal()" class="text-slate-400 hover:text-rose-500 font-black text-xl">✕</button>
            </div>
            <div id="tt-modal-grid" class="p-6 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 bg-slate-100/50">
                </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStaff = [];
        let formConfig = null;
        let editingStaffId = null;

        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        async function init() {
            await fetchConfig();
            await fetchStaff();
        }

        async function fetchConfig() {
            const doc = await db.collection("configs").doc("staff_registration_form").get();
            if (doc.exists) {
                formConfig = doc.data();
                setupSearchAndFilters();
            }
        }

        function setupSearchAndFilters() {
            const filterArea = document.getElementById('filter-container');
            const searchArea = document.getElementById('search-container');
            const hasSearch = formConfig.fields.some(f => f.searchable);
            if (hasSearch) searchArea.classList.remove('hidden');

            formConfig.fields.filter(f => f.filterable).forEach(f => {
                const select = document.createElement('select');
                select.className = "p-3 bg-white border-2 border-slate-100 rounded-xl text-[10px] font-black uppercase tracking-widest outline-none focus:border-blue-500 cursor-pointer";
                select.id = `filter-${f.label}`;
                select.onchange = applyFilters;
                
                let options = `<option value="">All ${f.label}s</option>`;
                f.options.split(',').forEach(opt => {
                    options += `<option value="${opt.trim()}">${opt.trim()}</option>`;
                });
                select.innerHTML = options;
                filterArea.appendChild(select);
            });
        }

        async function fetchStaff() {
            const snapshot = await db.collection("staff_applications").where("status", "==", "approved").get();
            allStaff = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            document.getElementById('staff-count').innerText = allStaff.length;
            
            // Render staff, but DO NOT run the heavy live status check automatically.
            renderStaff(allStaff);
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            let filtered = allStaff.filter(s => {
                const matchesSearch = !searchTerm || 
                    s.email.toLowerCase().includes(searchTerm) || 
                    s.mobile.includes(searchTerm) ||
                    Object.values(s.details).some(v => String(v).toLowerCase().includes(searchTerm));

                const matchesFilters = formConfig.fields.filter(f => f.filterable).every(f => {
                    const filterVal = document.getElementById(`filter-${f.label}`).value;
                    if (!filterVal) return true;
                    return s.details[f.label] === filterVal || (Array.isArray(s.details[f.label]) && s.details[f.label].includes(filterVal));
                });
                return matchesSearch && matchesFilters;
            });
            
            // Re-render, reset status labels
            renderStaff(filtered);
        }

        function renderStaff(data) {
            const grid = document.getElementById('staff-grid');
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-bold uppercase text-[10px] tracking-widest">No matching records found</div>`;
                return;
            }

            grid.innerHTML = data.map(s => {
                const nameKey = Object.keys(s.details).find(key => key.toLowerCase().includes('name'));
                const staffName = nameKey ? s.details[nameKey] : s.email;
                const cleanMobile = s.mobile.replace(/\D/g, ''); 
                
                return `
                <div class="glass p-8 rounded-[2.5rem] border border-white shadow-lg hover:shadow-2xl transition-all group flex flex-col h-full">
                    
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 font-black">
                            ${staffName.substring(0,1).toUpperCase()}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openEditModal('${s.id}')" class="p-2 text-slate-300 hover:text-blue-500 transition-all bg-slate-50 hover:bg-blue-50 rounded-lg" title="Edit Profile">
                                ✏️
                            </button>
                            <button onclick="revokeStaff('${s.id}')" class="p-2 text-slate-300 hover:text-rose-500 transition-all bg-slate-50 hover:bg-rose-50 rounded-lg" title="Revoke Access">
                                🗑️
                            </button>
                        </div>
                    </div>
                    
                    <h3 class="font-black text-slate-900 text-xl tracking-tighter">${staffName}</h3>
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-1">${s.email}</p>
                    <p class="text-blue-600 font-black text-xs mb-4">${s.mobile}</p>

                    <div id="live-status-${s.id}" class="mb-4 text-center">
                        <span class="inline-block px-3 py-1 bg-slate-100 text-slate-400 text-[9px] font-black uppercase tracking-widest rounded-lg border border-slate-200">Status Paused - Click Refresh</span>
                    </div>

                    <div class="flex gap-2 mb-6">
                        <a href="tel:${cleanMobile}" class="flex-1 bg-blue-50 text-blue-700 py-3 rounded-2xl flex items-center justify-center gap-2 hover:bg-blue-100 transition-colors">
                            <span class="text-[10px] font-black uppercase tracking-widest">Call</span>
                        </a>
                        <a href="https://wa.me/91${cleanMobile}" target="_blank" class="flex-1 bg-emerald-50 text-emerald-700 py-3 rounded-2xl flex items-center justify-center gap-2 hover:bg-emerald-100 transition-colors">
                            <span class="text-[10px] font-black uppercase tracking-widest">WhatsApp</span>
                        </a>
                    </div>
                    
                    <div class="space-y-2 pt-4 border-t border-slate-100 flex-grow">
                        ${Object.entries(s.details)
                            .filter(([k]) => !k.toLowerCase().includes('name'))
                            .map(([k, v]) => `
                            <div class="flex justify-between items-center">
                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">${k}</span>
                                <span class="text-[11px] font-bold text-slate-700">${Array.isArray(v) ? v.join(', ') : v}</span>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="viewTimetable('${s.id}', '${staffName}')" class="mt-6 w-full py-3 bg-slate-900 text-white rounded-xl font-black uppercase tracking-widest text-[10px] hover:bg-slate-800 transition-colors shadow-md">
                        View Timetable
                    </button>
                </div>
            `}).join('');
        }

        // --- OPTIMIZED SINGLE-QUERY LIVE STATUS ENGINE --- //
        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12) hours = 0;
            if (modifier === 'PM') hours += 12;
            return hours * 60 + minutes;
        }

        async function checkLiveStatus() {
            const btn = document.getElementById('refresh-btn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin">⏳</span> Syncing...`;
            btn.disabled = true;

            const todayStr = daysOfWeek[new Date().getDay()];
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();

            try {
                // THE OPTIMIZATION: We fetch today's timetable EXACTLY ONE TIME. (Costs 1 Read instead of 50 reads!)
                const snap = await db.collection("timetable").where("day", "==", todayStr).get();
                const allTodaysClasses = snap.docs.map(d => d.data());

                for (let staff of allStaff) {
                    const nameKey = Object.keys(staff.details).find(key => key.toLowerCase().includes('name'));
                    const staffName = nameKey ? staff.details[nameKey] : staff.email;
                    const statusDiv = document.getElementById(`live-status-${staff.id}`);
                    if (!statusDiv) continue;

                    // Filter locally from our single query
                    const teacherClasses = allTodaysClasses.filter(c => c.teacherName === staffName);
                    
                    let isBusy = false;
                    let busyText = "";

                    for (let cls of teacherClasses) {
                        if (!cls.timeRange) continue;
                        
                        const [startStr, endStr] = cls.timeRange.split(' - ');
                        const startMins = parseTimeToMinutes(startStr);
                        const endMins = parseTimeToMinutes(endStr);

                        if (currentMins >= startMins && currentMins <= endMins) {
                            isBusy = true;
                            busyText = `IN CLASS: ${cls.className} ${cls.section ? '| '+cls.section : ''} <br> <span class="text-rose-300">Room ${cls.room || '--'} (${cls.timeRange})</span>`;
                            break;
                        }
                    }

                    if (isBusy) {
                        statusDiv.innerHTML = `<div class="bg-rose-600 text-white p-2 rounded-xl text-[10px] font-black uppercase tracking-widest leading-tight shadow-md animate-pulse border border-rose-700">${busyText}</div>`;
                    } else {
                        statusDiv.innerHTML = `<span class="inline-block px-3 py-1 bg-emerald-50 text-emerald-600 text-[9px] font-black uppercase tracking-widest rounded-lg border border-emerald-100">Currently Free</span>`;
                    }
                }
            } catch(e) {
                console.error("Error fetching live status:", e);
                alert("Failed to sync live status.");
            } finally {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        }

        // --- FEATURE 2: EDIT PROFILE --- //
        function openEditModal(staffId) {
            editingStaffId = staffId;
            const staff = allStaff.find(s => s.id === staffId);
            const area = document.getElementById('edit-form-area');
            area.innerHTML = '';

            area.innerHTML += `
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Mobile Number</label>
                    <input type="text" id="edit-mobile" value="${staff.mobile}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-blue-500">
                </div>
                <div class="w-full h-px bg-slate-200 my-4"></div>
            `;

            Object.entries(staff.details).forEach(([key, value]) => {
                const fieldConfig = formConfig.fields.find(f => f.label === key);
                
                if (fieldConfig && fieldConfig.type === 'select') {
                    let options = `<option value="">Select...</option>`;
                    fieldConfig.options.split(',').forEach(opt => {
                        let selected = value === opt.trim() ? 'selected' : '';
                        options += `<option value="${opt.trim()}" ${selected}>${opt.trim()}</option>`;
                    });
                    area.innerHTML += `
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">${key}</label>
                            <select id="edit-det-${key}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-blue-500">${options}</select>
                        </div>
                    `;
                } else {
                    area.innerHTML += `
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">${key}</label>
                            <input type="text" id="edit-det-${key}" value="${value}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-blue-500">
                        </div>
                    `;
                }
            });

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            editingStaffId = null;
        }

        async function saveProfileChanges() {
            const staff = allStaff.find(s => s.id === editingStaffId);
            const newMobile = document.getElementById('edit-mobile').value;
            let newDetails = {};

            Object.keys(staff.details).forEach(key => {
                const input = document.getElementById(`edit-det-${key}`);
                if(input) newDetails[key] = input.value;
            });

            try {
                await db.collection("staff_applications").doc(editingStaffId).update({
                    mobile: newMobile,
                    details: newDetails
                });
                alert("Profile Updated Successfully!");
                closeEditModal();
                fetchStaff(); 
            } catch (e) {
                console.error(e);
                alert("Error saving changes.");
            }
        }

        // --- FEATURE 3: VIEW TIMETABLE --- //
        async function viewTimetable(staffId, staffName) {
            document.getElementById('tt-modal-name').innerText = staffName;
            const grid = document.getElementById('tt-modal-grid');
            grid.innerHTML = '<div class="col-span-full text-center text-slate-400 font-bold p-8">Fetching schedule...</div>';
            document.getElementById('tt-modal').classList.remove('hidden');

            try {
                const snap = await db.collection("timetable").where("teacherName", "==", staffName).get();
                let dataList = snap.docs.map(d => d.data());

                if (dataList.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center text-slate-400 font-bold p-8 uppercase text-[10px] tracking-widest">No schedule found for this faculty.</div>';
                    return;
                }

                dataList.sort((a, b) => {
                    if (daysOfWeek.indexOf(a.day) !== daysOfWeek.indexOf(b.day)) return daysOfWeek.indexOf(a.day) - daysOfWeek.indexOf(b.day);
                    const timeA = a.timeRange ? a.timeRange.split(' - ')[0] : '12:00 AM';
                    const timeB = b.timeRange ? b.timeRange.split(' - ')[0] : '12:00 AM';
                    return new Date('1970/01/01 ' + timeA) - new Date('1970/01/01 ' + timeB);
                });

                grid.innerHTML = dataList.map(item => `
                    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-black text-slate-800 uppercase text-sm">${item.className} ${item.section ? '| '+item.section : ''}</h4>
                                <span class="bg-indigo-50 text-indigo-600 px-2 py-1 rounded-lg text-[8px] font-black uppercase tracking-widest">${item.day}</span>
                            </div>
                            <p class="text-xs font-bold text-slate-500 mb-4">${item.subject || item.title || 'Duty'}</p>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
                            <span class="text-[9px] font-black text-slate-600 bg-slate-50 px-2 py-1 rounded border">🕒 ${item.timeRange || '--'}</span>
                            <span class="text-[9px] font-black text-slate-400 uppercase">Room: ${item.room || '--'}</span>
                        </div>
                    </div>
                `).join('');

            } catch(e) {
                console.error(e);
                grid.innerHTML = '<div class="col-span-full text-rose-500 text-center font-bold p-8">Error loading timetable.</div>';
            }
        }

        function closeTTModal() {
            document.getElementById('tt-modal').classList.add('hidden');
        }

        async function revokeStaff(id) {
            if(confirm("Revoke this staff member's access? They will move back to Pending list.")) {
                await db.collection("staff_applications").doc(id).update({ status: 'pending' });
                fetchStaff();
            }
        }

        init();
    </script>
</body>
</html>
