    <script>
        // --- SUPABASE INIT ---
        const SUPABASE_URL = "https://lpccpiozrqgxgusculbs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwY2NwaW96cnFneGd1c2N1bGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzMzNzQsImV4cCI6MjEwOTU0OTM3NH0.b2cNwu7y-uoFTOOK-Qy2-XX7QbrSMYzJ5Ja2EBO98Hc";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DYNAMIC BRANCH & SESSION ROUTER ---
        let branchesList = [];
        let sessionsList = [];
        let activeBranch = null;   // { id, name, ... }
        let activeSession = null;  // { id, branch_id, session_name, ... }
        let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";

        let allStaff = [];
        let formConfig = { fields: [] };
        let editingStaffId = null;
        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        // Role & Auth State
        let currentUserRole = 'NONE'; // 'ADMIN' or 'HOD'
        let currentUserDept = null;
        let activeStaffData = null;
        let isLiveStatusActive = false;

        // Reports State
        let currentExtractedSections = {};
        let adminReportsList = [];

        function normStr(str) {
            return String(str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        async function loadBranchesAndSessions() {
            const [branchRes, sessionRes] = await Promise.all([
                sb.from("branches").select("*").order("created_at", { ascending: true }),
                sb.from("branch_sessions").select("*").order("start_date", { ascending: false })
            ]);

            if (branchRes.error) throw branchRes.error;
            if (sessionRes.error) throw sessionRes.error;

            branchesList = (branchRes.data || []).filter(b => b.is_active !== false);
            sessionsList = sessionRes.data || [];

            if (branchesList.length === 0) {
                throw new Error("No active branches found in Supabase `branches` table.");
            }

            const storedBranchId = sessionStorage.getItem('minervaAdminBranchId');
            const storedCenterName = (sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN").toUpperCase();

            activeBranch =
                branchesList.find(b => b.id === storedBranchId) ||
                branchesList.find(b => String(b.name || "").toUpperCase().includes(storedCenterName)) ||
                branchesList[0];

            activeCenter = String(activeBranch.name || "GHUMARWIN").trim().toUpperCase();
            sessionStorage.setItem('minervaAdminBranchId', activeBranch.id);
            sessionStorage.setItem('minervaAdminCenter', activeCenter);

            const branchDropdown = document.getElementById('global-center-switch');
            branchDropdown.innerHTML = branchesList.map(b =>
                `<option value="${b.id}">📍 ${escapeHtml(b.name)}</option>`
            ).join('');
            branchDropdown.value = activeBranch.id;

            populateSessionDropdown();
        }

        function populateSessionDropdown() {
            const branchSessions = sessionsList.filter(s => s.branch_id === activeBranch.id);
            const sessionDropdown = document.getElementById('global-session-switch');

            if (branchSessions.length === 0) {
                activeSession = null;
                sessionDropdown.innerHTML = `<option value="">No Sessions</option>`;
                return;
            }

            const storedSessionId = sessionStorage.getItem(`minervaAdminSessionId_${activeBranch.id}`);
            activeSession =
                branchSessions.find(s => s.id === storedSessionId) ||
                branchSessions.find(s => s.is_active === true && String(s.session_name || "").includes("2026")) ||
                branchSessions.find(s => s.is_active === true) ||
                branchSessions[0];

            sessionStorage.setItem(`minervaAdminSessionId_${activeBranch.id}`, activeSession.id);

            sessionDropdown.innerHTML = branchSessions.map(s =>
                `<option value="${s.id}">🗓️ ${escapeHtml(s.session_name)}</option>`
            ).join('');
            sessionDropdown.value = activeSession.id;
        }

        function switchAdminCenter(branchId) {
            const chosen = branchesList.find(b => b.id === branchId);
            if (!chosen) return;
            sessionStorage.setItem('minervaAdminBranchId', chosen.id);
            sessionStorage.setItem('minervaAdminCenter', String(chosen.name || "").trim().toUpperCase());
            sessionStorage.removeItem('minerva_struct');
            sessionStorage.removeItem('minerva_teachers');
            window.location.reload();
        }

        function switchAdminSession(sessionId) {
            const chosen = sessionsList.find(s => s.id === sessionId);
            if (!chosen || !activeBranch) return;
            activeSession = chosen;
            sessionStorage.setItem(`minervaAdminSessionId_${activeBranch.id}`, chosen.id);

            // Reset live status & open reports so session-scoped queries re-fetch cleanly
            if (isLiveStatusActive) {
                isLiveStatusActive = false;
                const btn = document.getElementById('refresh-btn');
                const icon = document.getElementById('live-icon');
                const text = document.getElementById('live-text');
                icon.innerHTML = '🔴';
                icon.classList.add('animate-pulse');
                icon.classList.remove('animate-spin');
                text.innerText = 'Live Status';
                btn.classList.replace('bg-slate-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-slate-400', 'hover:bg-rose-400');
            }
            closeModal('reports-modal');
            closeModal('tt-modal');
        }

        // Helper for session-scoped Supabase SELECT queries (gracefully falls back if a table has no session_id column)
        async function fetchBranchSessionRows(tableName, extraFilterFn = null) {
            let query = sb.from(tableName).select("*").eq("branch_id", activeBranch.id);
            if (activeSession) {
                query = query.eq("session_id", activeSession.id);
            }
            if (extraFilterFn) {
                query = extraFilterFn(query);
            }

            let { data, error } = await query;
            if (error && activeSession && String(error.message || "").toLowerCase().includes("session_id")) {
                let fallbackQuery = sb.from(tableName).select("*").eq("branch_id", activeBranch.id);
                if (extraFilterFn) fallbackQuery = extraFilterFn(fallbackQuery);
                const fallbackRes = await fallbackQuery;
                if (fallbackRes.error) throw fallbackRes.error;
                return fallbackRes.data || [];
            }
            if (error) throw error;
            return data || [];
        }

        function applyBranchTheme() {
            const existingWm = document.getElementById('branch-watermark');
            if (existingWm) existingWm.remove();

            const isNonPrimary = !activeCenter.includes("GHUMARWIN");
            if (isNonPrimary) {
                document.getElementById('main-header').classList.replace('bg-[#1e1b4b]', 'bg-purple-950');
                document.getElementById('main-header').classList.replace('border-indigo-600', 'border-purple-600');
                document.body.classList.replace('bg-slate-50', 'bg-purple-50/50');
            }

            const watermark = document.createElement('div');
            watermark.id = 'branch-watermark';
            watermark.innerHTML = escapeHtml(activeBranch ? activeBranch.name : activeCenter);
            watermark.className = "fixed inset-0 pointer-events-none flex items-center justify-center text-[10vw] font-black opacity-[0.03] text-slate-900 z-[1] tracking-widest uppercase overflow-hidden whitespace-nowrap";
            if (isNonPrimary) watermark.classList.replace('text-slate-900', 'text-purple-900');
            document.body.appendChild(watermark);
        }

        async function init() {
            try {
                await loadBranchesAndSessions();
                applyBranchTheme();
            } catch (e) {
                console.error("Branch initialization error:", e);
                alert("Failed to load branches from Supabase: " + e.message);
                return;
            }

            const isAdminAuth = sessionStorage.getItem('minervaAdminAuth') === 'true';
            activeStaffData = JSON.parse(localStorage.getItem('minervaActiveStaff'));

            if (activeStaffData) {
                try {
                    const { data, error } = await sb
                        .from("staff_applications")
                        .select("*")
                        .eq("email", activeStaffData.email);

                    if (error) throw error;
                    if (data && data.length > 0) {
                        const d = data[0];
                        const isHOD = d.is_hod === true || d.isHOD === true;
                        const hodDept = d.hod_dept || d.hodDept || "";

                        if (isHOD) {
                            currentUserRole = 'HOD';
                            currentUserDept = hodDept;
                            document.getElementById('header-role').innerText = `HOD Access: ${currentUserDept}`;
                        } else if (isAdminAuth) {
                            currentUserRole = 'ADMIN';
                            document.getElementById('header-role').innerText = "Administrator Access";
                            document.getElementById('auth-btn').classList.remove('hidden');
                        } else {
                            alert("You are not authorized to view the Faculty Hub.");
                            window.location.replace('teacher-portal.html');
                            return;
                        }
                    } else {
                        window.location.replace('teacher-portal.html');
                        return;
                    }
                } catch (e) {
                    console.error(e);
                    window.location.replace('teacher-portal.html');
                    return;
                }
            } else if (isAdminAuth) {
                currentUserRole = 'ADMIN';
                document.getElementById('header-role').innerText = "Administrator Access";
                document.getElementById('auth-btn').classList.remove('hidden');
            } else {
                window.location.replace('staff-login.html');
                return;
            }

            await fetchConfig();
            await fetchStaff();
        }

        function handleBack() {
            if (currentUserRole === 'HOD' || activeStaffData) {
                window.location.href = 'teacher-portal.html';
            } else {
                window.location.href = 'admin.html';
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        async function fetchConfig() {
            try {
                const { data, error } = await sb.from("form_configs").select("*");
                if (error) throw error;

                const matched = (data || []).find(row =>
                    String(row.id || row.form_name || row.name || row.firestore_id || "")
                        .toLowerCase()
                        .includes("staff")
                ) || (data || [])[0];

                if (matched) {
                    const fields = matched.fields || matched.config?.fields || matched.schema?.fields || [];
                    formConfig = { fields: Array.isArray(fields) ? fields : [] };
                } else {
                    formConfig = { fields: [] };
                }
                setupSearchAndFilters();
            } catch (e) {
                console.error("Config fetch error:", e);
                formConfig = { fields: [] };
                setupSearchAndFilters();
            }
        }

        function getPrimaryDept(rawDeptStr) {
            if (!rawDeptStr) return 'General';
            const parts = String(rawDeptStr).split(',');
            const primary = parts[0].trim();
            return (primary && primary !== 'undefined') ? primary : 'General';

        function setupSearchAndFilters() {
            const filterArea = document.getElementById('filter-container');
            const searchArea = document.getElementById('search-container');
            filterArea.innerHTML = '';

            searchArea.classList.remove('hidden');

                select.className = "p-4 bg-white border-2 border-slate-200 rounded-xl text-xs font-black uppercase tracking-widest outline-none focus:border-blue-500 cursor-pointer shadow-sm";

        async function fetchStaff() {
            try {
                const { data, error } = await sb.from("staff_applications").select("*");
                if (error) throw error;

                let rawStaff = (data || [])
                    .filter(d => {
                        const det = (d.details && typeof d.details === "object") ? d.details : {};
                        const statusVal = String(d.status || det.status || "approved").toLowerCase();
                        return statusVal === "approved";
                    })
                    .map(d => {
                        const det = (d.details && typeof d.details === "object") ? d.details : {};
                        const centerKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                        const deptKey = Object.keys(det).find(k =>
                            k.toLowerCase().includes('department') ||
                            k.toLowerCase().includes('subject') ||
                            k.toLowerCase().includes('branch')
                        );

                        let rawDept = deptKey ? det[deptKey] : (d.hod_dept || 'General');
                        if (rawDept === undefined || rawDept === null) rawDept = 'General';
                        rawDept = Array.isArray(rawDept) ? rawDept.join(', ') : String(rawDept);

                        const isHOD = d.is_hod === true || d.isHOD === true;
                        const hodDept = d.hod_dept || d.hodDept || null;
                        const isLeaveIncharge = d.is_leave_incharge === true || d.isLeaveIncharge === true;

                        // Branch match via branch_id first, then fallback to details center name
                        const matchesBranchId = d.branch_id && activeBranch && d.branch_id === activeBranch.id;
                        const detCenterUpper = centerKey ? String(det[centerKey]).toUpperCase() : "";
                        const matchesCenterName = !d.branch_id && (
                            (detCenterUpper && detCenterUpper.includes(activeCenter)) ||
                            (!detCenterUpper && activeCenter.includes("GHUMARWIN"))
                        );

                        return {
                            id: d.id,
                            email: d.email || "",
                            mobile: d.mobile || "",
                            branchId: d.branch_id || null,
                            matchesActiveBranch: Boolean(matchesBranchId || matchesCenterName),
                            details: det,
                            rawDept: rawDept,
                            isHOD: isHOD,
                            hodDept: hodDept,
                            isLeaveIncharge: isLeaveIncharge
                        };
                    })
                    .filter(s => s.matchesActiveBranch);

                if (currentUserRole === 'HOD' && currentUserDept) {
                    rawStaff = rawStaff.filter(s => s.rawDept.includes(currentUserDept));
                }

                allStaff = rawStaff;
                document.getElementById('staff-count').innerText = allStaff.length;
                renderStaffGrouped(allStaff);
            } catch (e) {
                console.error("Fetch staff error:", e);
                document.getElementById('staff-grid').innerHTML =
                    `<div class="py-20 text-center bg-white rounded-[3rem] border border-rose-200 text-rose-600 font-black uppercase text-sm tracking-widest">Failed to load staff from Supabase.</div>`;
            }
        }

        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            let filtered = allStaff.filter(s => {
                const matchesSearch = !searchTerm || 
                    s.email.toLowerCase().includes(searchTerm) || 
                    s.mobile.includes(searchTerm) ||
                    Object.values(s.details).some(v => String(v).toLowerCase().includes(searchTerm));

                const matchesFilters = (formConfig.fields || []).filter(f => f.filterable).every(f => {
                    const el = document.getElementById(`filter-${f.label}`);
                    if (!el) return true;
                    const filterVal = el.value;
                    if (!filterVal) return true;
                    return s.details[f.label] === filterVal || (Array.isArray(s.details[f.label]) && s.details[f.label].includes(filterVal));
                });
                return matchesSearch && matchesFilters;
            });
            
            renderStaffGrouped(filtered);
            
            if (isLiveStatusActive) {
                isLiveStatusActive = false;
                toggleLiveStatus();
            }
        }

        // --- EXCEL EXPORT ENGINE ---
        async function exportData() {
            if (currentUserRole !== 'ADMIN') return alert("Only Administrators can run full exports.");
            const btn = document.getElementById('export-btn');
            const origHTML = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin">⏳</span> Exporting...`;
            btn.disabled = true;

            try {
                const workbook = new ExcelJS.Workbook();
                
                // --- SHEET 1: STAFF DIRECTORY (PERMANENT BRANCH-LEVEL) ---
                const staffSheet = workbook.addWorksheet('Staff Directory');
                let detailKeys = new Set();
                allStaff.forEach(s => Object.keys(s.details).forEach(k => detailKeys.add(k)));
                detailKeys = Array.from(detailKeys);

                let staffColumns = [
                    { header: 'Name', key: 'name', width: 25 },
                    { header: 'Email', key: 'email', width: 30 },
                    { header: 'Mobile', key: 'mobile', width: 15 },
                    { header: 'Primary Dept', key: 'dept', width: 20 },
                    { header: 'Role', key: 'role', width: 15 }
                ];
                detailKeys.forEach(k => {
                    if (!k.toLowerCase().includes('name')) staffColumns.push({ header: k.toUpperCase(), key: k, width: 20 });
                });
                
                staffSheet.columns = staffColumns;
                staffSheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                staffSheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1E1B4B' } };

                allStaff.forEach(s => {
                    const nameKey = Object.keys(s.details).find(k => k.toLowerCase().includes('name'));
                    let rowData = {
                        name: nameKey ? s.details[nameKey] : s.email,
                        email: s.email,
                        mobile: s.mobile,
                        dept: getPrimaryDept(s.rawDept),
                        role: s.isHOD ? `HOD (${s.hodDept})` : 'Faculty'
                    };
                    detailKeys.forEach(k => {
                        if (!k.toLowerCase().includes('name')) {
                            const val = s.details[k];
                            rowData[k] = Array.isArray(val) ? val.join(', ') : val;
                        }
                    });
                    staffSheet.addRow(rowData);
                });

                // --- SHEET 2: DAILY REPORTS & REMARKS (BRANCH + SESSION SCOPED) ---
                const repSheet = workbook.addWorksheet('Daily Reports & Remarks');
                repSheet.columns = [
                    { header: 'Date', key: 'date', width: 15 },
                    { header: 'Teacher', key: 'teacher', width: 25 },
                    { header: 'Department', key: 'dept', width: 20 },
                    { header: 'Classes Taken', key: 'classes', width: 40 },
                    { header: 'Duties Completed', key: 'duties', width: 35 },
                    { header: 'Additional Work', key: 'work', width: 50 },
                    { header: 'HOD Remark', key: 'hod_rem', width: 40 },
                    { header: 'Admin Remark', key: 'admin_rem', width: 40 }
                ];
                repSheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
                repSheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF047857' } };

                const reports = await fetchBranchSessionRows("daily_reports");
                reports.sort((a, b) => new Date(b.date) - new Date(a.date));

                reports.forEach(r => {
                    const tEmail = r.teacher_email || r.teacherEmail;
                    const tName = r.teacher_name || r.teacherName;
                    const classesArr = r.classes_conducted || r.classesConducted || [];
                    const dutiesArr = r.duties_completed || r.dutiesCompleted || [];

                    const tObj = allStaff.find(s => s.email === tEmail);
                    const dept = tObj ? getPrimaryDept(tObj.rawDept) : 'Unknown';
                    
                    let clsStr = classesArr.map(c => `• ${c.className} ${c.section} (${c.subject})`).join('\n');
                    let dutStr = dutiesArr.map(d => `• ${d.type} - ${d.className} ${d.section}`).join('\n');

                    repSheet.addRow({
                        date: r.date ? new Date(r.date).toLocaleDateString('en-GB') : '',
                        teacher: tName,
                        dept: dept,
                        classes: clsStr || 'None',
                        duties: dutStr || 'None',
                        work: r.additional_work || r.additionalWork || 'None',
                        hod_rem: r.hod_remark || r.hodRemark || '',
                        admin_rem: r.admin_remark || r.adminRemark || ''
                    });
                });

                repSheet.eachRow((row) => {
                    row.alignment = { vertical: 'top', wrapText: true };
                });

                const sessTag = activeSession ? `_${activeSession.session_name.replace(/[^a-zA-Z0-9-]/g, '')}` : '';
                const buffer = await workbook.xlsx.writeBuffer();
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                saveAs(blob, `Minerva_${activeBranch.name.replace(/\s+/g, '_')}${sessTag}_${new Date().toISOString().split('T')[0]}.xlsx`);

            } catch (err) {
                console.error("Export Error:", err);
                alert("Failed to export data: " + err.message);
            } finally {
                btn.innerHTML = origHTML;
                btn.disabled = false;
            }
        }

        function openAuthModal() {
            if (currentUserRole !== 'ADMIN') return;
            document.getElementById('auth-modal').classList.remove('hidden');
            let depts = new Set();
            allStaff.forEach(s => {
                s.rawDept.split(',').forEach(item => {
                    const c = item.trim();
                    if (c && c !== 'undefined' && c !== 'General') depts.add(c);
                });
            });
            const deptArray = Array.from(depts).sort();
            document.getElementById('auth-dept').innerHTML = `<option value="">-- Choose Department --</option>` + deptArray.map(d => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
            document.getElementById('auth-staff').innerHTML = `<option value="">-- Select Dept First --</option>`;
            document.getElementById('auth-staff').disabled = true;
            renderAuthList();
        }

        function populateAuthStaff() {
            const dept = document.getElementById('auth-dept').value;
            const staffSelect = document.getElementById('auth-staff');
            if (!dept) {
                staffSelect.innerHTML = `<option value="">-- Select Dept First --</option>`;
                staffSelect.disabled = true;
                return;
            }
            const staffInDept = allStaff.filter(s => s.rawDept.includes(dept)).sort((a, b) => {
                const nameKeyA = Object.keys(a.details).find(k => k.toLowerCase().includes('name'));
                const nameKeyB = Object.keys(b.details).find(k => k.toLowerCase().includes('name'));
                const na = nameKeyA ? String(a.details[nameKeyA]) : a.email;
                const nb = nameKeyB ? String(b.details[nameKeyB]) : b.email;
                return na.localeCompare(nb);
            });
            staffSelect.innerHTML = `<option value="">-- Select Faculty --</option>` + staffInDept.map(s => {
                const nameKey = Object.keys(s.details).find(k => k.toLowerCase().includes('name'));
                const n = nameKey ? String(s.details[nameKey]) : s.email;
                return `<option value="${s.id}">${escapeHtml(n)}</option>`;
            }).join('');
            staffSelect.disabled = false;
        }

        async function grantHODAuth() {
            const staffId = document.getElementById('auth-staff').value;
            const dept = document.getElementById('auth-dept').value;
            if (!staffId || !dept) return alert("Select both Department and Staff member.");
            try {
                const { error } = await sb
                    .from("staff_applications")
                    .update({ is_hod: true, hod_dept: dept })
                    .eq("id", staffId);
                if (error) throw error;

                const staff = allStaff.find(s => String(s.id) === String(staffId));
                if (staff) { staff.isHOD = true; staff.hodDept = dept; }
                renderAuthList();
                renderStaffGrouped(allStaff);
                alert("HOD Authority Granted!");
            } catch (e) {
                console.error(e);
                alert("Error granting rights: " + e.message);
            }
        }

        async function revokeHODAuth(staffId) {
            if (!confirm("Revoke HOD Authority? They will lose access to department reports.")) return;
            try {
                const { error } = await sb
                    .from("staff_applications")
                    .update({ is_hod: false, hod_dept: null })
                    .eq("id", staffId);
                if (error) throw error;

                const staff = allStaff.find(s => String(s.id) === String(staffId));
                if (staff) { staff.isHOD = false; staff.hodDept = null; }
                renderAuthList();
                renderStaffGrouped(allStaff);
            } catch (e) {
                console.error(e);
                alert("Error revoking rights: " + e.message);
            }
        }

        async function grantLeaveInchargeAuth() {
            const staffId = document.getElementById('auth-staff').value;
            if (!staffId) return alert("Select a Staff member.");
            try {
                const { error } = await sb
                    .from("staff_applications")
                    .update({ is_leave_incharge: true })
                    .eq("id", staffId);
                if (error) throw error;

                const staff = allStaff.find(s => String(s.id) === String(staffId));
                if (staff) staff.isLeaveIncharge = true;
                renderAuthList();
                alert("Leave Incharge Authority Granted!");
            } catch (e) {
                console.error(e);
                alert("Error granting rights: " + e.message);
            }
        }

        async function revokeLeaveInchargeAuth(staffId) {
            if (!confirm("Revoke Leave Incharge Authority?")) return;
            try {
                const { error } = await sb
                    .from("staff_applications")
                    .update({ is_leave_incharge: false })

                alert("Error revoking rights: " + e.message);

                    revokeBtns += `<button onclick="revokeLeaveInchargeAuth('${s.id}')" class="w-full bg-orange-50 text-orange-600 hover:bg-orange-500 hover:text-white px-3 py-2 rounded-lg font-black text-[9px] uppercase tracking-widest transition-colors shadow-sm border border-orange-200">Revoke Leave Incharge</button>`;

                return `

                    <div>
                        <h3 class="font-black text-slate-800 text-sm uppercase tracking-tighter mb-2">${escapeHtml(name)}</h3>

            `}).join('');
        }

        // --- SECTION-BASED WORK REPORTS ENGINE (SESSION-SCOPED) ---

            if (currentUserRole === 'ADMIN') openAdminReportViewer();
            else openHODReportGenerator();
        }

                            const staffDropdown = document.getElementById('view-teacher');

                setTimeout(() => {

                    if (staffDropdown) staffDropdown.value = staffEmail;

            document.getElementById('rm-dynamic-controls').className = "p-4 bg-slate-50 border-b border-slate-200 shrink-0";
            document.getElementById('rm-dynamic-controls').innerHTML = `
                <div class="w-full grid grid-cols-2 md:grid-cols-5 gap-3 items-end">
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Department</label>
                        <select id="gen-dept" onchange="updateGenTeacherList()" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs font-bold outline-none shadow-sm cursor-pointer" ${currentUserRole === 'HOD' ? 'disabled' : ''}>
                            ${deptOptions}

                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Staff Member</label>
                        <select id="gen-staff" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs font-bold outline-none shadow-sm cursor-pointer">
                            <option value="">-- Select Dept First --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">From</label>
                        <input type="date" id="gen-from" value="${lastWeekIso}" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs font-bold outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">To</label>
                        <input type="date" id="gen-to" value="${todayIso}" class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs font-bold outline-none shadow-sm">
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <button onclick="fetchTeacherSectionsForRange()" class="w-full bg-indigo-600 text-white p-2.5 rounded-lg font-black uppercase tracking-widest text-[10px] shadow-md hover:bg-indigo-500 transition-colors">Fetch Sections</button>

                </div>
            `;
            document.getElementById('rm-feed').innerHTML = `<div class="text-center py-32 text-slate-400 font-black uppercase tracking-widest text-sm">Select criteria and fetch sections.</div>`;
            document.getElementById('reports-modal').classList.remove('hidden');

            if (currentUserRole === 'HOD') updateGenTeacherList();

        function updateGenTeacherList() {
            const dept = document.getElementById('gen-dept').value;
            const staffSelect = document.getElementById('gen-staff');
            
            if (!dept) {
                staffSelect.innerHTML = `<option value="">-- Select Dept First --</option>`;
                return;
            }

            let staffInDept = allStaff.filter(s => getPrimaryDept(s.rawDept).includes(dept));
            staffInDept.sort((a, b) => {
                const nameKeyA = Object.keys(a.details).find(k => k.toLowerCase().includes('name'));
                const nameKeyB = Object.keys(b.details).find(k => k.toLowerCase().includes('name'));
                const na = nameKeyA ? String(a.details[nameKeyA]) : a.email;
                const nb = nameKeyB ? String(b.details[nameKeyB]) : b.email;
                return na.localeCompare(nb);
            });

            let opts = `<option value="">-- Select Teacher --</option>`;
            staffInDept.forEach(s => {
                const nameKey = Object.keys(s.details).find(k => k.toLowerCase().includes('name'));
                const name = nameKey ? String(s.details[nameKey]) : s.email;
                opts += `<option value="${escapeHtml(s.email)}">${escapeHtml(name)}</option>`;
            });
            
            staffSelect.innerHTML = opts;
        }

        async function fetchTeacherSectionsForRange() {
            const email = document.getElementById('gen-staff').value;
            const fromDate = document.getElementById('gen-from').value;
            const toDate = document.getElementById('gen-to').value;
            
            if (!email || !fromDate || !toDate) return alert("Please fill all fields.");

            const feed = document.getElementById('rm-feed');
            feed.innerHTML = `<div class="text-center py-20"><span class="loader mb-4 border-slate-300 border-t-indigo-600"></span><br><span class="text-slate-400 font-black uppercase tracking-widest text-xs">Cross-referencing Timetable & Submissions...</span></div>`;

            try {
                let targetDates = [];
                let curr = new Date(fromDate);
                let end = new Date(toDate);
                while (curr <= end) {
                    targetDates.push(curr.toISOString().split('T')[0]);
                    curr.setDate(curr.getDate() + 1);
                }

                const [
                    historyOverrides,
                    structures,
                    planners,
                    assignments,
                    timetableData,
                    rosters,
                    allDailyReports
                ] = await Promise.all([
                    fetchBranchSessionRows("timetable_history"),
                    fetchBranchSessionRows("institute_structure"),
                    fetchBranchSessionRows("lesson_planners"),
                    fetchBranchSessionRows("lesson_planner_assignments"),
                    fetchBranchSessionRows("timetable"),
                    fetchBranchSessionRows("duty_rosters"),
                    fetchBranchSessionRows("daily_reports")
                ]);

                const dailyReports = allDailyReports.filter(r => {
                    const rEmail = r.teacher_email || r.teacherEmail;
                    return rEmail === email && r.date >= fromDate && r.date <= toDate;
                });

                const weekDaysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                let virtualReports = [];

                const tObj = allStaff.find(s => s.email === email);
                const tNameKey = tObj ? Object.keys(tObj.details).find(k => k.toLowerCase().includes('name')) : null;
                const tName = tNameKey ? String(tObj.details[tNameKey]) : email;

                // 1. Rebuild Classes & Duties
                for (let tDate of targetDates) {
                    const dateObj = new Date(tDate);
                    if (dateObj.getDay() === 0) continue;
                    const dayName = weekDaysArr[dateObj.getDay()];

                    let dailyObj = { date: tDate, classes: [], topics: [], activities: [], duties: [], additionalWork: "" };
                    
                    const todayOverride = historyOverrides.find(o => o.date === tDate);
                    let dayTt = [];

                    if (todayOverride && Array.isArray(todayOverride.schedule)) {
                        dayTt = todayOverride.schedule.filter(s =>
                            (normStr(s.teacherName) === normStr(tName) || normStr(s.teacher) === normStr(tName)) && s.day === dayName
                        );
                    } else {
                        dayTt = timetableData.filter(t => {
                            const tEmail = t.teacher_email || t.teacherEmail;
                            const teacherN = t.teacher_name || t.teacherName || t.teacher;
                            return t.day === dayName && (tEmail === email || normStr(teacherN) === normStr(tName));
                        });
                    }
                    
                    dayTt = dayTt.map(cls => {
                        const cName = cls.class_name || cls.className;
                        const sec = cls.section;
                        const sub = cls.subject;
                        const s24 = cls.start_24 || cls.start24;
                        const e24 = cls.end_24 || cls.end24;
                        let tRange = cls.time_range || cls.timeRange;

                        if (!tRange && s24 && e24) {
                            const f12 = (t24) => {
                                let [h, m] = t24.split(':');
                                let ampm = h >= 12 ? 'PM' : 'AM';
                                h = h % 12 || 12;
                                return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
                            };
                            tRange = `${f12(s24)} - ${f12(e24)}`;
                        }
                        return { className: cName, section: sec, subject: sub, time: tRange || `${s24 || ''} - ${e24 || ''}` };
                    });

                    dayTt.forEach(cls => {
                        dailyObj.classes.push(cls);
                    });

                    const diffToMonday = dateObj.getDate() - dateObj.getDay() + (dateObj.getDay() === 0 ? -6 : 1);
                    const mondayDate = new Date(new Date(dateObj).setDate(diffToMonday));
                    const monIso = mondayDate.toISOString().split('T')[0];
                    const weekId = "week_starting_" + monIso;
                    const lunchId = "lunch_duty_" + monIso;

                    const rDoc = rosters.find(r =>
                        r.firestore_id === weekId || r.firestore_id === lunchId ||
                        r.id === weekId || r.id === lunchId
                    );
                    const rData = rDoc ? (rDoc.roster_data || rDoc.rosterData) : null;

                    if (rData) {
                        let dType = rDoc.type ? String(rDoc.type) : "Assigned Duty";
                        Object.keys(rData).forEach(clsKey => {
                            const entry = rData[clsKey];
                            const daySlots = entry.days || entry.columns || {};
                            const dayDuty = daySlots[dayName];
                            if (dayDuty && dayDuty.status === 'ASSIGNED' && dayDuty.staff && dayDuty.staff.email === email) {
                                let cName = entry.cName;
                                let sName = entry.sName;
                                if (!cName) {
                                    const pts = clsKey.split('|');
                                    cName = pts[0] || "Room";
                                    sName = pts[1] || clsKey;
                                }
                                dailyObj.duties.push({ type: dType, className: cName, section: sName, time: dayDuty.timing || "No Time" });
                            }
                        });
                    }
                    virtualReports.push(dailyObj);
                }

                // 2. Rebuild Topics & Activities
                planners.forEach(p => {
                    const pKey = p.firestore_id || String(p.id);
                    const assign = assignments.find(a => (a.firestore_id || String(a.id)) === pKey) || {};
                    let clsName = assign.class_name || assign.className;
                    let secName = assign.section;
                    let subName = assign.subject;

                    if (!clsName) {
                        const struct = structures.find(s => {
                            const sKey = s.firestore_id || String(s.id);
                            return pKey.startsWith(sKey);
                        });
                        if (struct) {
                            const sKey = struct.firestore_id || String(struct.id);
                            clsName = struct.class_name || struct.className;
                            secName = struct.section_name || struct.sectionName;
                            subName = pKey.substring(sKey.length + 1).replace(/_/g, ' ');
                        } else {
                            const pts = pKey.split('_');
                            if (pts.length >= 3) {
                                clsName = pts[0];
                                secName = pts[1];
                                subName = pts[2].replace(/_/g, ' ');
                            }
                        }
                    }

                    const sylData = p.syllabus_data || p.syllabusData;
                    if (Array.isArray(sylData)) {
                        sylData.forEach(topic => {
                            if (topic.isDone && topic.completedDate && targetDates.includes(topic.completedDate)) {
                                const assignedTo = assign.assigned_to || assign.assignedTo;
                                if (topic.tickedBy === email || topic.tickedBy === tName || assignedTo === email) {
                                    let r = virtualReports.find(v => v.date === topic.completedDate);
                                    if (r) r.topics.push({ className: clsName, section: secName, subject: subName, chapter: topic['CHAPTER NAME'], subtopic: topic['SUBTOPICS'] });
                                }
                            }
                        });
                    }

                    const actLogs = p.activity_logs || p.activityLogs;
                    if (Array.isArray(actLogs)) {
                        actLogs.forEach(act => {
                            if (act.date && targetDates.includes(act.date)) {
                                const assignedTo = assign.assigned_to || assign.assignedTo;
                                if (act.loggedBy === email || act.loggedBy === tName || assignedTo === email) {
                                    let r = virtualReports.find(v => v.date === act.date);
                                    if (r) r.activities.push({ className: clsName, section: secName, subject: subName, reason: act.reason, minutes: act.minutes });
                                }
                            }
                        });
                    }
                });

                // 3. Merge Manual Overrides & Extra Work
                dailyReports.forEach(rep => {
                    let v = virtualReports.find(r => r.date === rep.date);
                    if (!v) {
                        v = { date: rep.date, classes: [], topics: [], activities: [], duties: [], additionalWork: "" };
                        virtualReports.push(v);
                    }
                    const addWork = rep.additional_work || rep.additionalWork;
                    if (addWork) v.additionalWork = addWork;
                    
                    const clsCond = rep.classes_conducted || rep.classesConducted;
                    if (Array.isArray(clsCond)) {
                        clsCond.forEach(c => {
                            if (!v.classes.some(vc => normStr(vc.className) === normStr(c.className) && normStr(vc.section) === normStr(c.section))) {
                                v.classes.push(c);
                            }
                        });
                    }

                    const dutComp = rep.duties_completed || rep.dutiesCompleted;
                    if (Array.isArray(dutComp)) {
                        dutComp.forEach(d => {
                            if (!v.duties.some(vd => vd.className === d.className && vd.section === d.section)) {
                                v.duties.push(d);
                            }
                        });
                    }
                });

                // Slice and Dice by Section
                currentExtractedSections = {};
                window.currentGeneralLogs = {};

                virtualReports.forEach(rep => {
                    const processAcademic = (arr, type) => {
                        arr.forEach(item => {
                            let cName = item.className || 'General';
                            let sName = item.section || 'General';
                            if (cName === 'General') return;
                            
                            let secKey = Object.keys(currentExtractedSections).find(k => {
                                const [kC, kS] = k.split('|');
                                return normStr(kC) === normStr(cName) && normStr(kS) === normStr(sName);
                            });
                            if (!secKey) {
                                secKey = `${cName}|${sName}`;
                                currentExtractedSections[secKey] = { className: cName, section: sName, dayLogs: {} };
                            }
                            if (!currentExtractedSections[secKey].dayLogs[rep.date]) {
                                currentExtractedSections[secKey].dayLogs[rep.date] = { date: rep.date, classes: [], topics: [], activities: [] };
                            }
                            if (!currentExtractedSections[secKey].dayLogs[rep.date][type].some(x => JSON.stringify(x) === JSON.stringify(item))) {
                                currentExtractedSections[secKey].dayLogs[rep.date][type].push(item);
                            }
                        });
                    };

                    processAcademic(rep.classes, 'classes');
                    processAcademic(rep.topics, 'topics');
                    processAcademic(rep.activities, 'activities');
                    
                    if (!window.currentGeneralLogs[rep.date]) {
                        window.currentGeneralLogs[rep.date] = { date: rep.date, duties: [], extWork: [] };
                    }
                    
                    if (rep.duties) {
                        rep.duties.forEach(d => {
                            if (!window.currentGeneralLogs[rep.date].duties.some(xd => xd.type === d.type && xd.time === d.time)) {
                                window.currentGeneralLogs[rep.date].duties.push(d);
                            }
                        });
                    }
                    
                    if (rep.additionalWork && !window.currentGeneralLogs[rep.date].extWork.includes(rep.additionalWork)) {
                        window.currentGeneralLogs[rep.date].extWork.push(rep.additionalWork);
                    }
                });

                const secKeys = Object.keys(currentExtractedSections).sort();
                
                // Render General Duties & Extra Work
                const genDates = Object.keys(window.currentGeneralLogs || {}).sort();
                let generalHtml = "";
                if (genDates.length > 0) {
                    let genRows = "";
                    genDates.forEach(d => {
                        const log = window.currentGeneralLogs[d];
                        if ((!log.duties || log.duties.length === 0) && (!log.extWork || log.extWork.length === 0)) return;
                        
                        const prettyDate = new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                        let dutiesStr = (log.duties || []).map(dt => `<span class="bg-amber-50 text-amber-700 px-2 py-1 rounded border border-amber-100 whitespace-nowrap">🛡️ ${escapeHtml(dt.type || 'Duty')} (${escapeHtml(dt.time || '')})</span>`).join('<div class="h-2"></div>') || '-';
                        let extStr = (log.extWork || []).map(w => `<div class="mb-1 leading-relaxed">— ${escapeHtml(w)}</div>`).join('') || '-';
                        
                        genRows += `
                            <tr class="border-b border-slate-100 hover:bg-slate-50/50 transition-colors">
                                <td class="p-4 text-sm font-black text-slate-700 whitespace-nowrap align-top">${prettyDate}</td>
                                <td class="p-4 text-sm font-bold text-slate-800 align-top">${dutiesStr}</td>
                                <td class="p-4 text-sm font-bold text-slate-600 align-top">${extStr}</td>
                            </tr>
                        `;
                    });

                    if (genRows) {
                        generalHtml = `
                            <div class="mb-8 bg-white border-2 border-slate-200 rounded-[2rem] shadow-sm overflow-hidden">
                                <div class="bg-slate-50 p-6 border-b border-slate-200 flex items-center gap-4">
                                    <span class="text-3xl bg-white p-2 rounded-xl border border-slate-200 shadow-sm">📋</span>
                                    <div>
                                        <h4 class="font-black text-slate-900 text-xl uppercase tracking-tighter">Daily Overview</h4>
                                        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-0.5">Duties & Extra Work (Independent of Sections)</p>
                                    </div>
                                </div>
                                <div class="w-full overflow-x-auto custom-scroll">
                                    <table class="w-full text-left border-collapse min-w-[600px]">
                                        <thead>
                                            <tr class="bg-slate-100/50 border-b border-slate-200">
                                                <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest w-32">Date</th>
                                                <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest w-1/3">Duties Performed</th>
                                                <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest">Extra Work Logged</th>
                                            </tr>
                                        </thead>
                                        <tbody>${genRows}</tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    }
                }

                if (secKeys.length === 0 && !generalHtml) {
                    feed.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border border-slate-200"><p class="text-slate-400 font-black uppercase text-sm tracking-widest">No activity found for this teacher in this range.</p></div>`;
                    return;
                }

                // Render Section Reports
                let sectionHtml = secKeys.map(key => {
                    const sec = currentExtractedSections[key];
                    const daysActive = Object.keys(sec.dayLogs || {}).length;
                    const safeCls = sec.className.replace(/'/g, "\\'");
                    const safeSec = sec.section.replace(/'/g, "\\'");
                    
                    let tableRows = Object.keys(sec.dayLogs || {}).sort().map(d => {
                        const dayData = sec.dayLogs[d];
                        const prettyDate = new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                        
                        let clsStr = (dayData.classes || []).map(c => `<div class="mb-2 text-indigo-700 leading-tight">🕒 ${escapeHtml(c.time || '')}<br><span class="uppercase font-black text-[10px] tracking-widest">${escapeHtml(c.subject || '')}</span></div>`).join('') || '-';
                        let topStr = (dayData.topics || []).map(t => `<div class="mb-2 text-emerald-700 leading-snug">✅ <strong class="uppercase text-xs tracking-widest">${escapeHtml(t.chapter || '')}</strong><br>${escapeHtml(t.subtopic || '')}</div>`).join('') || '<span class="text-rose-400 italic text-[10px] uppercase font-black tracking-widest">No syllabus logged</span>';
                        let actStr = (dayData.activities || []).map(a => `<div class="mb-2 text-blue-700 leading-snug">🎯 ${escapeHtml(a.reason || '')}<br><span class="text-[10px] font-black uppercase tracking-widest opacity-70">${a.minutes || 0} mins</span></div>`).join('') || '-';

                        return `
                            <tr class="border-b border-slate-100 hover:bg-slate-50/50 transition-colors">
                                <td class="p-4 text-sm font-black text-slate-700 whitespace-nowrap align-top">${prettyDate}</td>
                                <td class="p-4 text-sm font-bold align-top">${clsStr}</td>
                                <td class="p-4 text-sm font-bold align-top">${topStr}</td>
                                <td class="p-4 text-sm font-bold align-top">${actStr}</td>
                            </tr>
                        `;
                    }).join('');

                    return `
                    <details class="bg-white border-2 border-slate-200 rounded-[2.5rem] shadow-sm hover:border-indigo-400 transition-all group mb-4 overflow-hidden">
                        <summary class="p-6 sm:p-8 flex flex-col gap-5 cursor-pointer outline-none list-none">
                            <div class="flex items-center justify-between w-full">
                                <div class="flex items-center gap-4">
                                    <div class="w-14 h-14 sm:w-16 sm:h-16 bg-slate-50 rounded-2xl border border-slate-100 flex items-center justify-center text-3xl sm:text-4xl grayscale group-open:grayscale-0 transition-all shadow-inner shrink-0">🏫</div>
                                    <div>
                                        <h4 class="font-black text-slate-900 text-lg sm:text-2xl uppercase tracking-tighter leading-none">Class ${escapeHtml(sec.className)} | Sec ${escapeHtml(sec.section)}</h4>
                                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Academic Logs (${daysActive} Days)</p>
                                    </div>
                                </div>
                                <span class="text-slate-300 group-open:rotate-180 transition-transform text-3xl">▾</span>
                            </div>
                            <button onclick="event.preventDefault(); event.stopPropagation(); openReportDraftForm('${safeCls}', '${safeSec}')" class="w-full bg-slate-900 text-white py-4 sm:py-5 rounded-[1.5rem] font-black text-sm uppercase tracking-[0.2em] shadow-xl shadow-slate-200 active:scale-95 transition-all">📝 Create Section Report</button>
                        </summary>
                        <div class="border-t border-slate-100">
                            <div class="w-full overflow-x-auto custom-scroll">
                                <table class="w-full text-left border-collapse min-w-[600px]">
                                    <thead>
                                        <tr class="bg-slate-50/80 border-b border-slate-200">
                                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest w-32">Date</th>
                                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest w-1/5">Classes</th>
                                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest w-2/5">Syllabus Covered</th>
                                            <th class="p-4 text-xs font-black text-slate-400 uppercase tracking-widest">Activities</th>
                                        </tr>
                                    </thead>
                                    <tbody>${tableRows}</tbody>
                                </table>
                            </div>
                        </div>
                    </details>`;
                }).join('');

                feed.innerHTML = generalHtml + sectionHtml;

            } catch (e) {
                console.error(e);
                feed.innerHTML = `<div class="text-center text-rose-500 font-black py-20">Error compiling sections: ${escapeHtml(e.message)}</div>`;
            }
        }

        function openReportDraftForm(className, section) {
            const feed = document.getElementById('rm-feed');
            const teacherEmail = document.getElementById('gen-staff').value;
            const tObj = allStaff.find(s => s.email === teacherEmail);

        async function submitSectionReport(className, section, tEmail, tName, fromDate, toDate) {
            const title = document.getElementById('draft-title').value.trim();
            const remark = document.getElementById('draft-remark').value.trim();
            const btn = event.target;
            
            if (!title || !remark) return alert("Please provide a Title and a Remark.");
            if (!confirm("Submit this report? It cannot be edited later.")) return;

            btn.disabled = true;
            btn.innerText = "Submitting...";

            const secKey = `${className}|${section}`;
            const secData = currentExtractedSections[secKey];
            const tObj = allStaff.find(s => s.email === tEmail);
            const dept = tObj ? getPrimaryDept(tObj.rawDept) : 'General';

            const insertPayload = {
                branch_id: activeBranch.id,
                session_id: activeSession ? activeSession.id : null,
                title: title,
                class_name: className,
                section: section,
                teacher_email: tEmail,
                teacher_name: tName,
                department: dept,
                from_date: fromDate,
                to_date: toDate,
                hod_remark: remark,
                admin_remark: "",
                timestamp: Date.now(),
                submitted_by: activeStaffData ? activeStaffData.email : 'admin',
                logs: secData ? secData.dayLogs : {}
            };

            try {
                const { error } = await sb.from("section_reports").insert([insertPayload]);
                if (error) throw error;

                alert("✅ Report Submitted Successfully!");
                fetchTeacherSectionsForRange();
            } catch (e) {
                console.error(e);
                alert("Error submitting report: " + e.message);
                btn.disabled = false;
                btn.innerText = "Submit Section Report";
            }
        }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const [time, modifier] = timeStr.trim().split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12) hours = 0;
            if (modifier === 'PM') hours += 12;
            return hours * 60 + minutes;
        }

        // --- LIVE STATUS TRACKER (BRANCH + SESSION SCOPED) ---
        async function toggleLiveStatus() {
            const btn = document.getElementById('refresh-btn');
            const icon = document.getElementById('live-icon');
            const text = document.getElementById('live-text');

            if (isLiveStatusActive) {
                isLiveStatusActive = false;
                icon.innerHTML = '🔴';
                icon.classList.add('animate-pulse');
                text.innerText = 'Live Status';
                btn.classList.replace('bg-slate-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-slate-400', 'hover:bg-rose-400');
                
                allStaff.forEach(staff => {
                    const statusDiv = document.getElementById(`live-status-${staff.id}`);
                    if (statusDiv) statusDiv.innerHTML = `<span class="inline-block px-4 py-2 bg-slate-50 text-slate-400 text-[10px] sm:text-xs font-black uppercase tracking-widest rounded-xl border border-slate-200">Status Paused - Click Live Status</span>`;
                });
                return;
            }

            isLiveStatusActive = true;
            icon.innerHTML = '⏳';
            icon.classList.add('animate-spin');
            icon.classList.remove('animate-pulse');
            text.innerText = 'Syncing...';
            btn.disabled = true;

            const weekDaysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayStr = weekDaysArr[new Date().getDay()];
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();

            try {
                const [historyRows, ttRows] = await Promise.all([
                    fetchBranchSessionRows("timetable_history"),
                    fetchBranchSessionRows("timetable", q => q.eq("day", todayStr))
                ]);

                const todayIso = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
                const todayOverride = historyRows.find(o => o.date === todayIso);
                
                let allTodaysClasses = [];
                if (todayOverride && Array.isArray(todayOverride.schedule)) {
                    allTodaysClasses = todayOverride.schedule.filter(s => s.day === todayStr);
                } else {
                    allTodaysClasses = ttRows;
                }

                allTodaysClasses = allTodaysClasses.map(cls => {
                    const s24 = cls.start_24 || cls.start24;
                    const e24 = cls.end_24 || cls.end24;
                    let tRange = cls.time_range || cls.timeRange;
                    if (!tRange && s24 && e24) {
                        const f12 = (t24) => {
                            let [h, m] = t24.split(':');
                            let ampm = h >= 12 ? 'PM' : 'AM';
                            h = h % 12 || 12;
                            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
                        };
                        tRange = `${f12(s24)} - ${f12(e24)}`;
                    }
                    return {
                        teacherName: cls.teacher_name || cls.teacherName || cls.teacher || "",
                        teacherEmail: cls.teacher_email || cls.teacherEmail || "",
                        className: cls.class_name || cls.className || "",
                        section: cls.section || "",
                        room: cls.room || "",
                        timeRange: tRange
                    };
                });

                for (let staff of allStaff) {
                    const nameKey = Object.keys(staff.details).find(key => key.toLowerCase().includes('name'));
                    const staffName = nameKey ? String(staff.details[nameKey]) : staff.email;
                    const statusDiv = document.getElementById(`live-status-${staff.id}`);
                    if (!statusDiv) continue;

                    const teacherClasses = allTodaysClasses.filter(c =>
                        normStr(c.teacherName) === normStr(staffName) ||
                        (c.teacherEmail && c.teacherEmail.toLowerCase() === staff.email.toLowerCase())
                    );
                    let isBusy = false;
                    let busyText = "";

                    for (let cls of teacherClasses) {
                        if (!cls.timeRange || !cls.timeRange.includes(' - ')) continue;
                        const [startStr, endStr] = cls.timeRange.split(' - ');
                        const startMins = parseTimeToMinutes(startStr);
                        const endMins = parseTimeToMinutes(endStr);

                        if (currentMins >= startMins && currentMins <= endMins) {
                            isBusy = true;
                            busyText = `IN CLASS: ${escapeHtml(cls.className)} ${cls.section ? '| ' + escapeHtml(cls.section) : ''} <br> <span class="text-rose-200">Room ${escapeHtml(cls.room || '--')} (${escapeHtml(cls.timeRange)})</span>`;
                            break;
                        }
                    }

                    if (isBusy) {
                        statusDiv.innerHTML = `<div class="bg-rose-600 text-white p-3 rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-widest leading-tight shadow-md animate-pulse border border-rose-700">${busyText}</div>`;
                    } else {
                        statusDiv.innerHTML = `<span class="inline-block px-4 py-2 bg-emerald-50 text-emerald-700 text-[10px] sm:text-xs font-black uppercase tracking-widest rounded-xl border border-emerald-200 shadow-sm">Currently Free</span>`;
                    }
                }
            } catch (e) {
                console.error("Error fetching live status:", e);
                alert("Failed to sync live status: " + e.message);
                isLiveStatusActive = false;
            } finally {
                icon.innerHTML = '⏹️';
                icon.classList.remove('animate-spin');
                text.innerText = 'Stop Live Status';
                btn.classList.replace('bg-rose-500', 'bg-slate-500');
                btn.classList.replace('hover:bg-rose-400', 'hover:bg-slate-400');
                btn.disabled = false;
            }
        }

            const safeFields = (formConfig && formConfig.fields) ? formConfig.fields : [];

            Object.entries(staff.details || {}).forEach(([key, value]) => {
                const fieldConfig = safeFields.find(f => f.label === key);
                const isMultiSelect = Array.isArray(value) || key.toLowerCase().includes('department') || key.toLowerCase().includes('subject');
                
                let valueArray = [];
                if (Array.isArray(value)) valueArray = value;
                else if (typeof value === 'string' && value) valueArray = value.split(',').map(v => v.trim());

                if (fieldConfig && fieldConfig.options) {
                    if (isMultiSelect) {
                        let checkboxes = `<div class="grid grid-cols-2 gap-3 mt-2">`;
                        String(fieldConfig.options).split(',').forEach(opt => {
                            let checked = valueArray.includes(opt.trim()) ? 'checked' : '';
                            checkboxes += `
                                <label class="flex items-center gap-2 text-sm font-bold text-slate-700 cursor-pointer bg-white p-2 rounded-lg border border-slate-200 shadow-sm hover:border-blue-400">
                                    <input type="checkbox" value="${escapeHtml(opt.trim())}" class="multi-edit-cb-${key.replace(/\s+/g, '')} w-4 h-4 text-blue-600 rounded border-slate-300" ${checked}>
                                    <span class="truncate">${escapeHtml(opt.trim())}</span>
                                </label>`;
                        });
                        checkboxes += `</div>`;
                        
                        area.innerHTML += `
                            <div class="mb-4">
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">${escapeHtml(key)} (Select Multiple)</label>
                                ${checkboxes}
                            </div>
                        `;
                    } else {
                        let options = `<option value="">Select...</option>`;
                        String(fieldConfig.options).split(',').forEach(opt => {
                            let selected = valueArray.includes(opt.trim()) ? 'selected' : '';
                            options += `<option value="${escapeHtml(opt.trim())}" ${selected}>${escapeHtml(opt.trim())}</option>`;
                        });
                        area.innerHTML += `
                            <div class="mb-4">
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">${escapeHtml(key)}</label>
                                <select id="edit-det-${key.replace(/\s+/g, '')}" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-500 shadow-sm cursor-pointer">${options}</select>
                            </div>
                        `;
                    }
                } else {
                    area.innerHTML += `
                        <div class="mb-4">
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">${escapeHtml(key)}</label>
                            <input type="text" id="edit-det-${key.replace(/\s+/g, '')}" value="${escapeHtml(value || '')}" class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-500 shadow-sm">
                        </div>
                    `;
                }
            });
            document.getElementById('edit-modal').classList.remove('hidden');
        }  

        async function saveProfileChanges() {
            const staff = allStaff.find(s => String(s.id) === String(editingStaffId));
            if (!staff) return;
            const newMobile = document.getElementById('edit-mobile').value;
            let newDetails = {};
            
            Object.keys(staff.details).forEach(key => {
                const safeKey = key.replace(/\s+/g, '');
                const isMultiSelect = Array.isArray(staff.details[key]) || key.toLowerCase().includes('department') || key.toLowerCase().includes('subject');
                
                if (isMultiSelect) {
                    const checkedBoxes = document.querySelectorAll(`.multi-edit-cb-${safeKey}:checked`);
                    newDetails[key] = Array.from(checkedBoxes).map(cb => cb.value).join(',');
                } else {
                    const input = document.getElementById(`edit-det-${safeKey}`);
                    if (input) newDetails[key] = input.value;
                }
            });
            
            try {
                const { error } = await sb
                    .from("staff_applications")
                    .update({ mobile: newMobile, details: newDetails })
                    .eq("id", editingStaffId);
                if (error) throw error;

                alert("Profile Updated Successfully!");
                closeModal('edit-modal');
                fetchStaff();
            } catch (e) {
                alert("Error saving changes: " + e.message);
            }
        }

        // --- TIMETABLE MODAL (BRANCH + SESSION SCOPED) ---
        async function viewTimetable(staffId, staffName) {
            document.getElementById('tt-modal-name').innerText = `${staffName} • ${activeBranch.name}${activeSession ? ' (' + activeSession.session_name + ')' : ''}`;
            const grid = document.getElementById('tt-modal-grid');
            grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest animate-pulse">Fetching schedule...</div>';
            document.getElementById('tt-modal').classList.remove('hidden');

            try {
                const staffObj = allStaff.find(s => String(s.id) === String(staffId));
                const staffEmail = staffObj ? staffObj.email.toLowerCase() : "";

                const [historyRows, ttRows] = await Promise.all([
                    fetchBranchSessionRows("timetable_history"),
                    fetchBranchSessionRows("timetable")
                ]);

                const todayIso = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
                const todayOverride = historyRows.find(o => o.date === todayIso);
                
                let rawList = [];
                if (todayOverride && Array.isArray(todayOverride.schedule)) {
                    rawList = todayOverride.schedule.filter(s =>
                        normStr(s.teacherName) === normStr(staffName) ||
                        normStr(s.teacher) === normStr(staffName) ||
                        (staffEmail && String(s.teacherEmail || "").toLowerCase() === staffEmail)
                    );
                } else {
                    rawList = ttRows.filter(t => {
                        const tName = t.teacher_name || t.teacherName || t.teacher || "";
                        const tEmail = String(t.teacher_email || t.teacherEmail || "").toLowerCase();
                        return normStr(tName) === normStr(staffName) || (staffEmail && tEmail === staffEmail);
                    });
                }

                const dataList = rawList.map(cls => {
                    const s24 = cls.start_24 || cls.start24;
                    const e24 = cls.end_24 || cls.end24;
                    let tRange = cls.time_range || cls.timeRange;
                    if (!tRange && s24 && e24) {
                        const f12 = (t24) => {
                            let [h, m] = t24.split(':');
                            let ampm = h >= 12 ? 'PM' : 'AM';
                            h = h % 12 || 12;
                            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
                        };
                        tRange = `${f12(s24)} - ${f12(e24)}`;
                    }
                    return {
                        day: cls.day,
                        className: cls.class_name || cls.className || "",
                        section: cls.section || "",
                        subject: cls.subject || cls.title || "Duty",
                        room: cls.room || "--",
                        timeRange: tRange || "--"
                    };
                });

                if (dataList.length === 0) {
                    grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest">No schedule found for this faculty.</div>';
                    return;
                }

                let ttHTML = "";
                daysOfWeek.forEach(day => {
                    if (day === 'Sunday') return;
                    
                    const dayClasses = dataList.filter(d => d.day === day).sort((a, b) => {
                        const timeA = a.timeRange && a.timeRange !== '--' ? a.timeRange.split(' - ')[0] : '12:00 AM';
                        const timeB = b.timeRange && b.timeRange !== '--' ? b.timeRange.split(' - ')[0] : '12:00 AM';
                        return new Date('1970/01/01 ' + timeA) - new Date('1970/01/01 ' + timeB);
                    });

                    if (dayClasses.length > 0) {
                        ttHTML += `
                        <div class="bg-white p-5 sm:p-6 rounded-[2rem] shadow-sm border border-slate-200">
                            <h4 class="font-black text-indigo-700 uppercase tracking-widest mb-4 border-b border-slate-100 pb-3 flex items-center gap-3">
                                <span class="bg-indigo-50 p-2 rounded-xl text-xl shadow-sm border border-indigo-100">📅</span> ${day}
                            </h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${dayClasses.map(item => `
                                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 flex flex-col justify-between hover:border-indigo-300 hover:shadow-md transition-all group">
                                        <div>
                                            <div class="font-black text-slate-800 text-sm uppercase mb-1">${escapeHtml(item.className)} ${item.section ? '| ' + escapeHtml(item.section) : ''}</div>
                                            <div class="text-[11px] font-bold text-indigo-600 uppercase tracking-widest mb-4">${escapeHtml(item.subject)}</div>
                                        </div>
                                        <div class="mt-auto pt-4 border-t border-slate-200 flex justify-between items-center">
                                            <span class="text-[10px] font-black bg-white px-3 py-1.5 rounded-lg shadow-sm text-slate-600 border border-slate-100">🕒 ${escapeHtml(item.timeRange)}</span>
                                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">RM: ${escapeHtml(item.room)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                    }
                });

                if (!ttHTML) {
                    grid.innerHTML = '<div class="text-center text-slate-400 font-bold p-8 uppercase text-xs tracking-widest">No schedule found for this faculty.</div>';
                } else {
                    grid.innerHTML = ttHTML;
                }

            } catch (e) {
                console.error(e);
                grid.innerHTML = '<div class="text-rose-500 text-center font-bold p-8 uppercase text-xs tracking-widest">Error loading timetable.</div>';
            }
        }

        async function revokeStaff(id) {
            if (confirm("Revoke this staff member's access? They will move back to Pending list.")) {
                try {
                    const staff = allStaff.find(s => String(s.id) === String(id));
                    const updatedDetails = { ...(staff ? staff.details : {}), status: 'pending' };
                    const { error } = await sb
                        .from("staff_applications")
                        .update({ details: updatedDetails })
                        .eq("id", id);
                    if (error) throw error;
                    fetchStaff();
                } catch (e) {
                    alert("Error revoking access: " + e.message);
                }
            }
        }

        init();
    </script>
