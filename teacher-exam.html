<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Exams & Invigilation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 4px solid #f1f5f9; border-top: 4px solid #0d9488; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden">

    <!-- Background Gradients -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-teal-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <!-- Header -->
    <header class="bg-[#1e1b4b] text-white p-4 sm:px-6 sm:py-5 flex items-center justify-between shadow-xl sticky top-0 z-[100] border-b-4 border-teal-500">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="p-3 bg-white/10 hover:bg-white/20 rounded-xl transition-colors shadow-sm shrink-0 backdrop-blur-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none">Exams Hub</h1>
                <p class="text-[10px] sm:text-xs text-teal-300 font-bold uppercase tracking-widest mt-1" id="teacher-center-label">Loading...</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8 mt-2 space-y-6 sm:space-y-8 relative z-10">
        
        <!-- SECURE ADMIN LINK (Hidden by default) -->
        <div id="admin-access-banner" class="hidden">
            <button onclick="window.location.href='admin-exam.html'" class="w-full bg-gradient-to-r from-indigo-600 to-purple-700 text-white p-5 rounded-2xl shadow-lg hover:shadow-xl hover:from-indigo-500 hover:to-purple-600 transition-all flex items-center justify-between group active:scale-95">
                <div class="flex items-center gap-4">
                    <span class="bg-white/20 p-3 rounded-xl text-2xl shadow-inner">⚙️</span>
                    <div class="text-left">
                        <h3 class="font-black uppercase tracking-widest text-sm sm:text-lg leading-tight">Manage Master Exams</h3>
                        <p class="text-[10px] sm:text-xs font-bold text-indigo-200 uppercase tracking-widest mt-0.5">You have Admin Authority</p>
                    </div>
                </div>
                <span class="text-2xl font-black opacity-50 group-hover:opacity-100 group-hover:translate-x-2 transition-all">➔</span>
            </button>
        </div>

        <!-- UPCOMING & LIVE EXAMS -->
        <div class="glass-card p-5 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                <span class="text-3xl sm:text-4xl bg-teal-50 p-3 sm:p-4 rounded-2xl border border-teal-200">🟢</span>
                <div class="flex-1">
                    <h2 class="text-xl sm:text-3xl font-black text-slate-900 uppercase tracking-tight">Live & Upcoming</h2>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">Scheduled school exams</p>
                </div>
            </div>

            <div id="upcoming-exams-list" class="space-y-4">
                <div class="text-center py-10"><span class="loader border-t-teal-500"></span></div>
            </div>
        </div>

        <!-- PAST EXAMS -->
        <div class="glass-card p-5 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                <span class="text-3xl sm:text-4xl bg-slate-100 p-3 sm:p-4 rounded-2xl border border-slate-200">🕰️</span>
                <div class="flex-1">
                    <h2 class="text-xl sm:text-3xl font-black text-slate-900 uppercase tracking-tight">Past Exams</h2>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">Historical records</p>
                </div>
            </div>

            <div id="past-exams-list" class="space-y-4">
                <div class="text-center py-10"><span class="loader border-t-slate-500"></span></div>
            </div>
        </div>

    </main>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- AUTH & CENTER LOGIC ---
        const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));

        if (!activeStaff || !activeStaff.uid) {
            window.location.replace('staff-login.html');
        }

        let activeCenter = activeStaff.center || "GHUMARWIN";

        window.onload = async () => {
            document.getElementById('teacher-center-label').innerText = `📍 ${activeCenter}`;
            await checkAdminAuthority();
            listenForExams();
        };

        // Check if this teacher has been delegated Exam Admin rights
        async function checkAdminAuthority() {
            try {
                const docSnap = await db.collection("staff_applications").doc(activeStaff.uid).get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.canManageExams === true) {
                        document.getElementById('admin-access-banner').classList.remove('hidden');
                        // Also set the session variable so they don't get kicked out of the admin page
                        sessionStorage.setItem('minervaAdminAuth', 'true');
                        sessionStorage.setItem('minervaAdminCenter', activeCenter);
                    }
                }
            } catch (e) {
                console.error("Authority check failed:", e);
            }
        }

        // Safe global collection fetcher based on center
        function getCollection(name) {
            return activeCenter === "GHUMARWIN" ? db.collection(name) : db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        function listenForExams() {
            // Get today's local ISO date safely
            const offset = (new Date()).getTimezoneOffset() * 60000;
            const todayIso = (new Date(Date.now() - offset)).toISOString().split('T')[0];

            getCollection("exam_schedules")
                .orderBy("date", "desc")
                .onSnapshot(snap => {
                    const upcomingContainer = document.getElementById('upcoming-exams-list');
                    const pastContainer = document.getElementById('past-exams-list');
                    
                    let upcomingHtml = "";
                    let pastHtml = "";

                    if (snap.empty) {
                        upcomingContainer.innerHTML = `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm">No Upcoming Exams</div>`;
                        pastContainer.innerHTML = `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm">No Past Exams</div>`;
                        return;
                    }

                    // 1. Group documents by Date
                    const groupedUpcoming = {};
                    const groupedPast = {};

                    snap.forEach(doc => {
                        const data = doc.data();
                        if (data.date >= todayIso) {
                            if (!groupedUpcoming[data.date]) groupedUpcoming[data.date] = [];
                            groupedUpcoming[data.date].push(data);
                        } else {
                            if (!groupedPast[data.date]) groupedPast[data.date] = [];
                            groupedPast[data.date].push(data);
                        }
                    });

                    // 2. Sort Upcoming (Ascending - closest first) and Past (Descending - most recent first)
                    const sortedUpcomingDates = Object.keys(groupedUpcoming).sort();
                    const sortedPastDates = Object.keys(groupedPast).sort().reverse();

                    // Render functions
                    upcomingHtml = sortedUpcomingDates.length > 0 
                        ? sortedUpcomingDates.map(date => renderExamAccordion(date, groupedUpcoming[date], true)).join('') 
                        : `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm border-2 border-dashed border-slate-200">No Upcoming Exams Scheduled</div>`;

                    pastHtml = sortedPastDates.length > 0 
                        ? sortedPastDates.map(date => renderExamAccordion(date, groupedPast[date], false)).join('') 
                        : `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm border-2 border-dashed border-slate-200">No Past Exams Found</div>`;

                    upcomingContainer.innerHTML = upcomingHtml;
                    pastContainer.innerHTML = pastHtml;

                }, error => {
                    console.error("Exams Listener Error:", error);
                    document.getElementById('upcoming-exams-list').innerHTML = '<p class="text-red-500 font-black text-center p-6">Error loading exams.</p>';
                    document.getElementById('past-exams-list').innerHTML = '<p class="text-red-500 font-black text-center p-6">Error loading exams.</p>';
                });
        }

        // Accordion Renderer
        function renderExamAccordion(dateStr, packets, isUpcoming) {
            const dateObj = new Date(dateStr);
            const prettyDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            
            // Sort packets by Class and Section for neatness inside the accordion
            packets.sort((a,b) => (a.className||"").localeCompare(b.className||"") || (a.section||"").localeCompare(b.section||""));

            const rowsHtml = packets.map(data => {
                let typeColor = "bg-slate-100 text-slate-700 border-slate-200";
                if (data.type === 'UT') typeColor = "bg-blue-100 text-blue-700 border-blue-200";
                if (data.type === 'OT') typeColor = "bg-amber-100 text-amber-700 border-amber-200";
                if (data.type === 'Terminal Exams' || data.type === 'Preboard' || data.type === 'Board Exam') typeColor = "bg-rose-100 text-rose-700 border-rose-200";

                let classStr = data.className || "Mixed";
                let secStr = data.section ? `Sec ${data.section}` : "Mixed";
                let subsStr = data.subjects ? data.subjects.join(', ') : "Mixed";

                // Backward compatibility for old grouped packet structure
                if (data.targets && data.targets.length > 0) {
                    classStr = data.targets.map(t => t.className).join(', ');
                    secStr = "Multiple";
                }

                return `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors gap-3">
                        <div class="flex items-center gap-4 w-full sm:w-auto">
                            <span class="px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest border shadow-sm ${typeColor} shrink-0">${data.type}</span>
                            <div>
                                <div class="font-black text-slate-800 text-sm sm:text-base uppercase leading-tight">${classStr}</div>
                                <div class="font-bold text-slate-500 text-xs uppercase tracking-widest mt-0.5">${secStr}</div>
                            </div>
                        </div>
                        <div class="bg-indigo-50 border border-indigo-100 text-indigo-700 font-bold text-xs uppercase px-3 py-2 rounded-lg text-left sm:text-right shadow-sm w-full sm:w-auto">
                            ${subsStr}
                        </div>
                    </div>
                `;
            }).join('');

            // If it's upcoming, we default the accordion to open. If it's past, we keep it closed to save space.
            const openAttr = isUpcoming ? "open" : "";
            const headerColor = isUpcoming ? "bg-slate-800 text-white hover:bg-slate-700" : "bg-slate-200 text-slate-700 hover:bg-slate-300";
            const badgeColor = isUpcoming ? "bg-slate-900 text-slate-300" : "bg-slate-300 text-slate-800";

            return `
                <details class="bg-white border-2 border-slate-200 rounded-2xl sm:rounded-[1.5rem] shadow-sm overflow-hidden group" ${openAttr}>
                    <summary class="${headerColor} p-4 sm:p-5 flex justify-between items-center cursor-pointer outline-none transition-colors">
                        <h3 class="font-black text-base sm:text-lg uppercase tracking-widest flex items-center gap-3">
                            <span class="bg-white/20 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg shadow-inner text-sm sm:text-base">📅</span> ${prettyDate}
                        </h3>
                        <div class="flex items-center gap-3 sm:gap-4">
                            <span class="text-[10px] sm:text-xs font-bold uppercase tracking-widest ${badgeColor} px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg shadow-inner whitespace-nowrap">${packets.length} Exams</span>
                            <span class="text-xl opacity-70 group-open:rotate-180 transition-transform">▼</span>
                        </div>
                    </summary>
                    <div class="bg-white flex flex-col">
                        ${rowsHtml}
                    </div>
                </details>
            `;
        }
    </script>
</body>
</html>
