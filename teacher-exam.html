<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 4px solid #f1f5f9; border-top: 4px solid #0d9488; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .input-field { width: 100%; padding: 0.875rem 1rem; border-radius: 0.75rem; border: 2px solid #e2e8f0; outline: none; font-weight: 800; color: #334155; transition: all 0.2s; font-size: 1rem; cursor: pointer; }
        .input-field:focus { border-color: #0d9488; box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1); }
        .break-words { word-wrap: break-word; overflow-wrap: break-word; white-space: normal; }

        /* STRICT BLACK & WHITE COMPACT PRINT STYLES */
        @media print {
            @page { size: A4 portrait; margin: 12mm; }
            html, body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; width: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; color: black !important; }
            body > *:not(#print-render-area) { display: none !important; }
            #print-render-area { display: block !important; position: relative !important; visibility: visible !important; width: 100%; }
            
            .print-header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid black; padding-bottom: 5px; }
            .print-title { font-size: 16pt; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; }
            .print-subtitle { font-size: 11pt; font-weight: bold; }
            
            .print-date-group { margin-bottom: 15px; page-break-inside: avoid; }
            .print-date-header { border-bottom: 1.5px solid black; padding: 4px 0; margin-bottom: 6px; font-size: 11pt; font-weight: bold; text-transform: uppercase; }
            
            .print-table { width: 100%; border-collapse: collapse; font-size: 10pt; }
            .print-table td { padding: 4px 6px; border-bottom: 1px solid #ccc; vertical-align: top; }
            .col-class { width: 20%; font-weight: bold; }
            .col-sub { width: 35%; }
            .col-sec { width: 45%; color: #333; }
        }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none no-print">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-teal-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-6 sm:py-5 flex items-center justify-between shadow-xl sticky top-0 z-[100] border-b-4 border-teal-500 no-print">

            </button>
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none">Exams Hub</h1>

    <main class="max-w-4xl mx-auto p-4 sm:p-8 mt-2 space-y-6 sm:space-y-8 relative z-10 no-print">
        
        <div id="admin-access-banner" class="hidden">
            <button onclick="window.location.href='admin-exam.html'" class="w-full bg-gradient-to-r from-indigo-600 to-purple-700 text-white p-5 rounded-2xl shadow-lg hover:shadow-xl hover:from-indigo-500 hover:to-purple-600 transition-all flex items-center justify-between group active:scale-95">
                <div class="flex items-center gap-4">
                    <span class="bg-white/20 p-3 rounded-xl text-2xl shadow-inner">⚙️</span>

                        <h3 class="font-black uppercase tracking-widest text-sm sm:text-lg leading-tight">Manage Master Exams</h3>

      <div class="flex justify-end">
            <button onclick="openExportModal()" class="bg-emerald-600 text-white hover:bg-emerald-500 px-6 py-3.5 rounded-2xl font-black text-xs sm:text-sm uppercase tracking-widest shadow-lg transition-all flex items-center gap-3 active:scale-95 border border-emerald-500">

        <div class="glass-card p-4 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                <span class="text-3xl sm:text-4xl bg-teal-50 p-3 sm:p-4 rounded-2xl border border-teal-200">🟢</span>
                <div class="flex-1">
                    <h2 class="text-xl sm:text-3xl font-black text-slate-900 uppercase tracking-tight">Live & Upcoming</h2>

            <div id="upcoming-exams-list" class="space-y-6">

        <div class="glass-card p-4 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                <span class="text-3xl sm:text-4xl bg-slate-100 p-3 sm:p-4 rounded-2xl border border-slate-200">🕰️</span>
                <div class="flex-1">
                    <h2 class="text-xl sm:text-3xl font-black text-slate-900 uppercase tracking-tight">Past Exams</h2>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">Historical records</p>
                </div>
            </div>

            <div id="past-exams-list" class="space-y-6">
                <div class="text-center py-10"><span class="loader border-t-slate-500"></span></div>
            </div>
        </div>

    </main>

   <div id="export-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 sm:p-8 bg-emerald-50 border-b border-emerald-100 flex justify-between items-center shrink-0">

                    <h3 class="font-black text-emerald-900 text-xl uppercase tracking-tighter">Export Schedule</h3>

            <div class="p-6 sm:p-8 grid grid-cols-1 gap-5 bg-white shrink-0">

                </div>
                <button onclick="exportToExcel()" id="export-exec-btn" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black uppercase tracking-widest text-sm shadow-lg hover:bg-emerald-700 transition-colors mt-4 flex justify-center items-center gap-2">
                    📊 Download .XLS File
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
        if (!activeStaff || !activeStaff.uid) { window.location.replace('staff-login.html'); }
        let activeCenter = activeStaff.center || "GHUMARWIN";

    window.onload = async () => {
            document.getElementById('teacher-center-label').innerText = `📍 ${activeCenter}`;
            
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().slice(0, 10);
            document.getElementById('export-start-date').value = localISOTime;
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);
            const nextWeekIso = (new Date(nextWeek - offset)).toISOString().slice(0, 10);
            document.getElementById('export-end-date').value = nextWeekIso;

            await checkAdminAuthority();
            
            // --- NEW: FETCH LIVE TIMETABLE FOR SYLLABUS MATCHING ---
            try {
                const prefix = activeCenter === "GHUMARWIN" ? "" : activeCenter.toLowerCase() + "_";
                const ttSnap = await db.collection(prefix + "timetable").get();
                window.liveTimetable = ttSnap.docs.map(d => d.data());
            } catch(e) { console.error("Timetable fetch failed", e); window.liveTimetable = []; }

            listenForExams();
        };

        async function checkAdminAuthority() {
            try {
                const docSnap = await db.collection("staff_applications").doc(activeStaff.uid).get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.canManageExams === true) {
                        document.getElementById('admin-access-banner').classList.remove('hidden');
                        sessionStorage.setItem('minervaAdminAuth', 'true');
                        sessionStorage.setItem('minervaAdminCenter', activeCenter);
                    }
                }
            } catch (e) { console.error("Authority check failed:", e); }
        }

        function getCollection(name) {
            return activeCenter === "GHUMARWIN" ? db.collection(name) : db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        // --- SMART AGGREGATION ENGINE ---
        function normalizeAndAggregate(packets) {
            let flatList = [];
            packets.forEach(p => {
                if (p.targets && p.targets.length > 0) {
                    p.targets.forEach(t => {
                        t.sections.forEach(s => {
                            let secName = typeof s === 'object' ? s.section : s;
                            let subs = typeof s === 'object' && s.subjects ? s.subjects : (t.subjects || []);
                            flatList.push({ id: p.id, type: p.type, className: t.className, section: secName, subjects: subs.join(', ') || "Mixed" });
                        });
                    });
                } else {
                    flatList.push({ id: p.id, type: p.type, className: p.className, section: p.section, subjects: (p.subjects || []).join(', ') || "Mixed" });
                }
            });

            let grouped = {};
            flatList.forEach(item => {
                let key = `${item.type}__${item.className}__${item.subjects}`;
                if (!grouped[key]) {
                    grouped[key] = { type: item.type, className: item.className, subjects: item.subjects, sections: [], ids: new Set() };
                }
                if (!grouped[key].sections.includes(item.section)) grouped[key].sections.push(item.section);
                grouped[key].ids.add(item.id);
            });

            let result = Object.values(grouped).map(g => ({
                ...g,
                ids: Array.from(g.ids).join(','),
                sectionsJoined: g.sections.sort().join(', ')
            }));
            result.sort((a,b) => a.className.localeCompare(b.className));
            return result;
        }

        function listenForExams() {
            const offset = (new Date()).getTimezoneOffset() * 60000;
            const todayIso = (new Date(Date.now() - offset)).toISOString().split('T')[0];

            getCollection("exam_schedules")
                .orderBy("date", "desc")
                .onSnapshot(snap => {
                    const upcomingContainer = document.getElementById('upcoming-exams-list');
                    const pastContainer = document.getElementById('past-exams-list');
                    
                    if (snap.empty) {
                        upcomingContainer.innerHTML = `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm">No Upcoming Exams</div>`;
                        pastContainer.innerHTML = `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm">No Past Exams</div>`;
                        return;
                    }

                    const groupedUpcoming = {};
                    const groupedPast = {};

                    snap.forEach(doc => {
                        const data = doc.data();
                        if (data.date >= todayIso) {
                            if (!groupedUpcoming[data.date]) groupedUpcoming[data.date] = [];
                            groupedUpcoming[data.date].push({ id: doc.id, ...data });
                        } else {
                            if (!groupedPast[data.date]) groupedPast[data.date] = [];
                            groupedPast[data.date].push({ id: doc.id, ...data });
                        }
                    });

                    const sortedUpcomingDates = Object.keys(groupedUpcoming).sort();
                    const sortedPastDates = Object.keys(groupedPast).sort().reverse();

                    upcomingContainer.innerHTML = sortedUpcomingDates.length > 0 ? sortedUpcomingDates.map(date => renderExamAccordion(date, groupedUpcoming[date], true)).join('') : `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm border-2 border-dashed border-slate-200">No Upcoming Exams Scheduled</div>`;
                    pastContainer.innerHTML = sortedPastDates.length > 0 ? sortedPastDates.map(date => renderExamAccordion(date, groupedPast[date], false)).join('') : `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm border-2 border-dashed border-slate-200">No Past Exams Found</div>`;

                }, error => {
                    console.error("Exams Listener Error:", error);
                    document.getElementById('upcoming-exams-list').innerHTML = '<p class="text-red-500 font-black text-center p-6">Error loading exams.</p>';
                    document.getElementById('past-exams-list').innerHTML = '<p class="text-red-500 font-black text-center p-6">Error loading exams.</p>';
                });
        }

      function renderExamAccordion(dateStr, rawPackets, isUpcoming) {
            const dateObj = new Date(dateStr);
            const prettyDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            
            // --- NEW: SYLLABUS TASK MATCHER ---
            let myTasksHtml = "";
            let myTasks = [];
            const safeName = activeStaff ? (activeStaff.name || activeStaff.email) : "Unknown";
            const norm = str => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

            rawPackets.forEach(packet => {
                (packet.subjects || []).forEach(sub => {
                    const isMySubject = (window.liveTimetable || []).some(t => 
                        norm(t.className) === norm(packet.className) && 
                        norm(t.section) === norm(packet.section) && 
                        norm(t.subject) === norm(sub) && 
                        (norm(t.teacher) === norm(safeName) || norm(t.teacherName) === norm(safeName))
                    );
                    
                    if (isMySubject) {
                        const existingSyllabus = (packet.syllabi && packet.syllabi[sub]) ? packet.syllabi[sub] : "";
                        myTasks.push({ id: packet.id, className: packet.className, section: packet.section, subject: sub, syllabus: existingSyllabus });
                    }
                });
            });

            if (myTasks.length > 0 && isUpcoming) {
                const taskCards = myTasks.map(task => `
                    <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 flex flex-col gap-3">
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="font-black text-indigo-900 uppercase text-sm">${task.className} | Sec ${task.section}</span>
                                <span class="text-[10px] font-black text-white bg-indigo-500 px-2 py-0.5 rounded ml-2 uppercase tracking-widest">${task.subject}</span>
                            </div>
                        </div>
                        <textarea id="syll_${task.id}_${task.subject.replace(/[^a-zA-Z0-9]/g, '')}" class="w-full bg-white border border-indigo-200 rounded-lg p-3 text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 resize-none h-16 shadow-inner" placeholder="Enter Syllabus here...">${task.syllabus}</textarea>
                        <div class="flex flex-wrap gap-2 items-center justify-between">
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button onclick="saveSyllabus('${task.id}', '${task.subject}', 'syll_${task.id}_${task.subject.replace(/[^a-zA-Z0-9]/g, '')}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm transition-colors flex-1 sm:flex-none active:scale-95">💾 Save</button>
                                <button onclick="applySyllabusToAll('${dateStr}', '${task.className}', '${task.subject}', 'syll_${task.id}_${task.subject.replace(/[^a-zA-Z0-9]/g, '')}')" class="bg-sky-100 hover:bg-sky-200 text-sky-700 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm transition-colors flex-1 sm:flex-none border border-sky-200 active:scale-95">⚡ Apply to All Secs</button>
                            </div>
                            <button onclick="shareSyllabusWhatsApp('${task.className}', '${task.section}', '${task.subject}', 'syll_${task.id}_${task.subject.replace(/[^a-zA-Z0-9]/g, '')}')" class="w-full sm:w-auto bg-[#25D366] hover:bg-[#128C7E] text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm transition-colors flex items-center justify-center gap-2 active:scale-95">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                                Send to WhatsApp
                            </button>
                        </div>
                    </div>
                `).join('');

                myTasksHtml = `
                    <div class="bg-indigo-50/50 p-4 border-b border-indigo-100">
                        <h4 class="font-black text-indigo-900 uppercase tracking-widest text-xs mb-3 flex items-center gap-2"><span class="text-base">🎯</span> My Syllabus Responsibilities</h4>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                            ${taskCards}
                        </div>
                    </div>
                `;
            }
            // ----------------------------------------

            const aggregatedRows = normalizeAndAggregate(rawPackets);

            const rowsHtml = aggregatedRows.map(data => {
                let typeColor = "bg-slate-100 text-slate-700 border-slate-200";
                if (data.type === 'UT') typeColor = "bg-blue-100 text-blue-700 border-blue-200";
                if (data.type === 'OT') typeColor = "bg-amber-100 text-amber-700 border-amber-200";
                if (data.type === 'Terminal Exams' || data.type === 'Preboard' || data.type === 'Board Exam') typeColor = "bg-rose-100 text-rose-700 border-rose-200";

                return `
                    <div class="flex flex-col md:flex-row gap-2 md:gap-4 p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors items-start md:items-center">
                        <div class="flex items-center gap-3 w-full md:w-auto shrink-0 md:w-32">
                            <span class="px-2.5 py-1 rounded-lg border shadow-sm text-[10px] font-black uppercase tracking-widest ${typeColor}">${data.type}</span>
                        </div>
                        <div class="flex items-start gap-2 w-full md:w-1/4 shrink-0">
                            <span class="font-black text-slate-800 text-sm uppercase break-words leading-tight mt-0.5">${data.className}</span>
                        </div>
                        <div class="flex flex-col md:flex-row md:items-center gap-1 md:gap-4 w-full flex-1">
                            <div class="flex flex-1 items-start gap-2">
                                <span class="md:hidden text-[10px] font-bold text-slate-400 uppercase w-14 mt-0.5">Subs:</span>
                                <span class="font-bold text-indigo-700 text-sm uppercase break-words leading-tight flex-1">${data.subjects}</span>
                            </div>
                            <div class="flex flex-1 items-start gap-2">
                                <span class="md:hidden text-[10px] font-bold text-slate-400 uppercase w-14 mt-0.5">Sec:</span>
                                <span class="font-bold text-slate-500 text-xs uppercase break-words leading-tight flex-1">Sec ${data.sectionsJoined}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const openAttr = isUpcoming ? "open" : "";
            const headerColor = isUpcoming ? "bg-slate-800 text-white hover:bg-slate-700" : "bg-slate-200 text-slate-700 hover:bg-slate-300";
            const badgeColor = isUpcoming ? "bg-slate-900 text-slate-300" : "bg-slate-300 text-slate-800";

            return `
                <details class="bg-white border-2 border-slate-200 rounded-2xl sm:rounded-[1.5rem] shadow-sm overflow-hidden group mb-6" ${openAttr}>
                    <summary class="${headerColor} p-4 sm:p-5 flex justify-between items-center cursor-pointer outline-none transition-colors">
                        <h3 class="font-black text-base sm:text-lg uppercase tracking-widest flex items-center gap-3">
                            <span class="bg-white/20 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg shadow-inner text-sm sm:text-base">📅</span> ${prettyDate}
                        </h3>
                        <div class="flex items-center gap-3 sm:gap-4">
                            <span class="text-[10px] sm:text-xs font-bold uppercase tracking-widest ${badgeColor} px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg shadow-inner whitespace-nowrap">${aggregatedRows.length} Row(s)</span>
                            <span class="text-xl opacity-70 group-open:rotate-180 transition-transform">▼</span>
                        </div>
                    </summary>
                    <div class="bg-white flex flex-col">
                        ${myTasksHtml}
                        ${rowsHtml}
                    </div>
                </details>
            `;
        }

    // --- EXCEL EXPORT ENGINE LOGIC ---
        function openExportModal() {
            document.getElementById('export-modal').classList.remove('hidden');
            document.getElementById('export-modal').classList.add('flex');
        }

        function closeExportModal() {
            document.getElementById('export-modal').classList.add('hidden');
            document.getElementById('export-modal').classList.remove('flex');
        }

        async function exportToExcel() {
            const startDate = document.getElementById('export-start-date').value;
            const endDate = document.getElementById('export-end-date').value;

            if (!startDate || !endDate) return alert("Please select both start and end dates.");
            if (startDate > endDate) return alert("Start Date cannot be after End Date.");

            const btn = document.getElementById('export-exec-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Compiling Data...";
            btn.disabled = true;

            try {
                const snap = await getCollection("exam_schedules")
                    .where("date", ">=", startDate)
                    .where("date", "<=", endDate)
                    .orderBy("date", "asc")
                    .get();

                if (snap.empty) {
                    alert("No exams found in this date range.");
                    return;
                }

                // Group by date first
                const dateGroups = {};
                snap.forEach(doc => {
                    const data = doc.data();
                    if(!dateGroups[data.date]) dateGroups[data.date] = [];
                    dateGroups[data.date].push({ id: doc.id, ...data });
                });

              // Build strict Excel HTML with Merged Date Headers
                let tableHtml = `
                    <table border="1" style="border-collapse: collapse; font-family: sans-serif;">
                        <tbody>
                `;

                Object.keys(dateGroups).sort().forEach(dateStr => {
                    const rowDatePretty = new Date(dateStr).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                    
                    // Add Date Header Row (Merged across 4 columns)
                    tableHtml += `
                        <tr>
                            <td colspan="4" style="background-color: #e2e8f0; color: #0f172a; padding: 12px; font-weight: bold; font-size: 14pt; text-align: center; text-transform: uppercase;">
                                📅 ${rowDatePretty}
                            </td>
                        </tr>
                        <tr>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Exam Type</th>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Class</th>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Sections</th>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Subjects Tested</th>
                        </tr>
                    `;

                    // Automatically group data using the smart aggregation engine
                    const aggregatedData = normalizeAndAggregate(dateGroups[dateStr]);

                    aggregatedData.forEach(row => {
                        tableHtml += `
                            <tr>
                                <td style="padding: 8px; text-align: center;">${row.type}</td>
                                <td style="padding: 8px; font-weight: bold;">${row.className}</td>
                                <td style="padding: 8px;">${row.sectionsJoined}</td>
                                <td style="padding: 8px;">${row.subjects}</td>
                            </tr>
                        `;
                    });
                    
                    // Add an empty row for spacing between dates
                    tableHtml += `<tr><td colspan="4" style="border: none; height: 20px;"></td></tr>`;
                });

                tableHtml += `</tbody></table>`;

                // Wrap in Microsoft Office XML namespace to prevent file corruption warnings
                const fullHTML = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>${tableHtml}</body></html>`;
                
                // Force Download Blob
                const blob = new Blob(['\ufeff', fullHTML], { type: 'application/vnd.ms-excel' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); 
                a.href = url; 
                a.download = `Minerva_Exam_Schedule_${startDate}_to_${endDate}.xls`;
                document.body.appendChild(a); 
                a.click(); 
                document.body.removeChild(a);
                
                closeExportModal();

            } catch (error) {
                console.error("Excel generation failed:", error);
                alert("Error generating Excel document.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
