        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 4px solid #f1f5f9; border-top: 4px solid #0d9488; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .input-field { width: 100%; padding: 0.875rem 1rem; border-radius: 0.75rem; border: 2px solid #e2e8f0; outline: none; font-weight: 800; color: #334155; transition: all 0.2s; font-size: 1rem; cursor: pointer; }
        .input-field:focus { border-color: #0d9488; box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.1); }
        .break-words { word-wrap: break-word; overflow-wrap: break-word; white-space: normal; }

        /* STRICT BLACK & WHITE COMPACT PRINT STYLES */
        @media print {
            @page { size: A4 portrait; margin: 12mm; }
            html, body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; width: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; color: black !important; }
            body > *:not(#print-render-area) { display: none !important; }
            #print-render-area { display: block !important; position: relative !important; visibility: visible !important; width: 100%; }
            
            .print-header { text-align: center; margin-bottom: 15px; border-bottom: 2px solid black; padding-bottom: 5px; }
            .print-title { font-size: 16pt; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; }
            .print-subtitle { font-size: 11pt; font-weight: bold; }
            
            .print-date-group { margin-bottom: 15px; page-break-inside: avoid; }
            .print-date-header { border-bottom: 1.5px solid black; padding: 4px 0; margin-bottom: 6px; font-size: 11pt; font-weight: bold; text-transform: uppercase; }
            
            .print-table { width: 100%; border-collapse: collapse; font-size: 10pt; }
            .print-table td { padding: 4px 6px; border-bottom: 1px solid #ccc; vertical-align: top; }
            .col-class { width: 20%; font-weight: bold; }
            .col-sub { width: 35%; }
            .col-sec { width: 45%; color: #333; }
        }
    </style>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
        if (!activeStaff || !activeStaff.uid) { window.location.replace('staff-login.html'); }
        let activeCenter = activeStaff.center || "GHUMARWIN";

        const MASTER_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vToTu7w-MwPQN5hYG9icN1gp2fFdtV_71xh0twNNN2dw1P-Qwz5b8A4bNumV7mWlX7VcVlgUWXPWnc_/pub?output=csv";
        let masterSheetData = [];

        window.onload = async () => {
            document.getElementById('teacher-center-label').innerText = `📍 ${activeCenter}`;
            
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().slice(0, 10);
            document.getElementById('export-start-date').value = localISOTime;
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 7);
            const nextWeekIso = (new Date(nextWeek - offset)).toISOString().slice(0, 10);
            document.getElementById('export-end-date').value = nextWeekIso;

            await checkAdminAuthority();
            
            try {
                const prefix = activeCenter === "GHUMARWIN" ? "" : activeCenter.toLowerCase() + "_";
                const ttSnap = await db.collection(prefix + "timetable").get();
                window.liveTimetable = ttSnap.docs.map(d => d.data());
            } catch(e) { console.error("Timetable fetch failed", e); window.liveTimetable = []; }

            // Preload Master Sheet CSV
            Papa.parse(MASTER_SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    masterSheetData = results.data || [];
                }
            });

            listenForExams();
        };

        async function checkAdminAuthority() {
            try {
                const docSnap = await db.collection("staff_applications").doc(activeStaff.uid).get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.canManageExams === true) {
                        document.getElementById('admin-access-banner').classList.remove('hidden');
                        sessionStorage.setItem('minervaAdminAuth', 'true');
                        sessionStorage.setItem('minervaAdminCenter', activeCenter);
                    }
                }
            } catch (e) { console.error("Authority check failed:", e); }
        }

        function getCollection(name) {
            return activeCenter === "GHUMARWIN" ? db.collection(name) : db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        function normalizeAndAggregate(packets) {
            let flatList = [];
            packets.forEach(p => {
                if (p.targets && p.targets.length > 0) {
                    p.targets.forEach(t => {
                        t.sections.forEach(s => {
                            let secName = typeof s === 'object' ? s.section : s;
                            let subs = typeof s === 'object' && s.subjects ? s.subjects : (t.subjects || []);
                            flatList.push({ id: p.id, type: p.type, className: t.className, section: secName, subjects: subs.join(', ') || "Mixed" });
                        });
                    });
                } else {
                    flatList.push({ id: p.id, type: p.type, className: p.className, section: p.section, subjects: (p.subjects || []).join(', ') || "Mixed" });
                }
            });

            let grouped = {};
            flatList.forEach(item => {
                let key = `${item.type}__${item.className}__${item.subjects}`;
                if (!grouped[key]) {
                    grouped[key] = { type: item.type, className: item.className, subjects: item.subjects, sections: [], ids: new Set() };
                }
                if (!grouped[key].sections.includes(item.section)) grouped[key].sections.push(item.section);
                grouped[key].ids.add(item.id);
            });

            let result = Object.values(grouped).map(g => ({
                ...g,
                ids: Array.from(g.ids).join(','),
                sectionsJoined: g.sections.sort().join(', ')
            }));
            result.sort((a,b) => a.className.localeCompare(b.className));
            return result;
        }

        function listenForExams() {
            const offset = (new Date()).getTimezoneOffset() * 60000;
            const todayIso = (new Date(Date.now() - offset)).toISOString().split('T')[0];

            getCollection("exam_schedules")
                .orderBy("date", "desc")
                .onSnapshot(snap => {
                    const upcomingContainer = document.getElementById('upcoming-exams-list');
                    const pastContainer = document.getElementById('past-exams-list');
                    
                    window.openDetailsIds = new Set();
                    document.querySelectorAll('details[open]').forEach(det => {
                        if (det.id) window.openDetailsIds.add(det.id);
                    });
                    
                    if (snap.empty) {
                        upcomingContainer.innerHTML = `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm">No Upcoming Exams</div>`;
                        pastContainer.innerHTML = `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm">No Past Exams</div>`;
                        return;
                    }

                    const groupedUpcoming = {};
                    const groupedPast = {};

                    snap.forEach(doc => {
                        const data = doc.data();
                        if (data.date >= todayIso) {
                            if (!groupedUpcoming[data.date]) groupedUpcoming[data.date] = [];
                            groupedUpcoming[data.date].push({ id: doc.id, ...data });
                        } else {
                            if (!groupedPast[data.date]) groupedPast[data.date] = [];
                            groupedPast[data.date].push({ id: doc.id, ...data });
                        }
                    });

                    const sortedUpcomingDates = Object.keys(groupedUpcoming).sort();
                    const sortedPastDates = Object.keys(groupedPast).sort().reverse();

                    upcomingContainer.innerHTML = sortedUpcomingDates.length > 0 ? sortedUpcomingDates.map(date => renderExamAccordion(date, groupedUpcoming[date], true)).join('') : `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm border-2 border-dashed border-slate-200">No Upcoming Exams Scheduled</div>`;
                    pastContainer.innerHTML = sortedPastDates.length > 0 ? sortedPastDates.map(date => renderExamAccordion(date, groupedPast[date], false)).join('') : `<div class="bg-slate-50 p-8 rounded-2xl text-center text-slate-400 font-bold uppercase tracking-widest text-sm border-2 border-dashed border-slate-200">No Past Exams Found</div>`;

                }, error => {
                    console.error("Exams Listener Error:", error);
                    document.getElementById('upcoming-exams-list').innerHTML = '<p class="text-red-500 font-black text-center p-6">Error loading exams.</p>';
                    document.getElementById('past-exams-list').innerHTML = '<p class="text-red-500 font-black text-center p-6">Error loading exams.</p>';
                });
        }

        function renderExamAccordion(dateStr, rawPackets, isUpcoming) {
            const dateObj = new Date(dateStr);
            const prettyDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            
            let myTasksHtml = "";
            let myTasks = [];
            const safeName = activeStaff ? (activeStaff.name || activeStaff.email) : "Unknown";
            const norm = str => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

            rawPackets.forEach(packet => {
                (packet.subjects || []).forEach(sub => {
                    const isMySubject = (window.liveTimetable || []).some(t => 
                        norm(t.className) === norm(packet.className) && 
                        norm(t.section) === norm(packet.section) && 
                        norm(t.subject) === norm(sub) && 
                        (norm(t.teacher) === norm(safeName) || norm(t.teacherName) === norm(safeName))
                    );
                    
                   if (isMySubject) {
                        const existingSyllabus = (packet.syllabi && packet.syllabi[sub]) ? packet.syllabi[sub] : "";
                        myTasks.push({ id: packet.id, className: packet.className, section: packet.section, subject: sub, syllabus: existingSyllabus });
                    }
                });
            });

            const todayOffset = (new Date()).getTimezoneOffset() * 60000;
            const currentIsoDate = (new Date(Date.now() - todayOffset)).toISOString().slice(0, 10);
            const isEditable = currentIsoDate < dateStr;

            if (myTasks.length > 0 && isUpcoming) {
                const taskCards = myTasks.map(task => {
                    const safeId = `syll_${task.id}_${task.subject.replace(/[^a-zA-Z0-9]/g, '')}`;
                    
                    let textAreaHtml = "";
                    let buttonsHtml = "";

                   if (isEditable) {
                        textAreaHtml = `<textarea id="${safeId}" class="w-full bg-white border border-indigo-200 rounded-lg p-4 text-xs sm:text-sm font-bold text-slate-700 outline-none focus:border-indigo-500 resize-y min-h-[120px] shadow-inner leading-relaxed" placeholder="Enter Syllabus here...">${task.syllabus}</textarea>`;
                        buttonsHtml = `
                            <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                                <button onclick="openSheetSyllabusModal('${task.subject}', '${task.className}', '${safeId}')" class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm transition-colors flex-1 sm:flex-none active:scale-95">📖 Pick from Sheet</button>
                                <button onclick="saveSyllabus('${task.id}', '${task.subject}', '${safeId}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm transition-colors flex-1 sm:flex-none active:scale-95">💾 Save</button>
                                <button onclick="openApplySyllabusModal('${dateStr}', '${task.className}', '${task.subject}', '${safeId}')" class="bg-sky-100 hover:bg-sky-200 text-sky-700 px-4 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm transition-colors flex-1 sm:flex-none border border-sky-200 active:scale-95">⚡ Apply to Secs</button>
                            </div>
                        `;
                    } else {

        // --- GOOGLE SHEET SYLLABUS PICKER ENGINE WITH MULTI-CLASS SELECTOR & ACCORDION ---
        let currentActiveTextAreaId = "";

     function openSheetSyllabusModal(subjectName, className, textAreaId) {

            if (!masterSheetData || masterSheetData.length === 0) {
                Papa.parse(MASTER_SHEET_CSV_URL, {
                    download: true,
                    header: true,
                    complete: function(results) {
                        masterSheetData = results.data || [];

                initSheetModal(subjectName, className);

        function closeSheetModal() {
            document.getElementById('sheet-syllabus-modal').classList.replace('flex', 'hidden');
        }

        function initSheetModal(targetSubject, targetClass) {
            const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            const normSub = norm(targetSubject);

            const getCol = (row, name) => {
                const key = Object.keys(row).find(k => k.trim().toLowerCase() === name.toLowerCase());
                return key ? String(row[key] || "").trim() : "";
            };

            // Filter rows by subject first
            const subjectRows = masterSheetData.filter(row => {
                const rSub = norm(getCol(row, "Subject"));
                return rSub && (rSub === normSub || rSub.includes(normSub) || normSub.includes(rSub));
            });

            // Extract unique classes from Column E ("Class")
            const classesSet = new Set();
            subjectRows.forEach(r => {
                const cls = getCol(r, "Class");
                if (cls) classesSet.add(cls);
            });

            const container = document.getElementById('sheet-class-checkboxes');
            const sortedClasses = Array.from(classesSet).sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
            
            if (sortedClasses.length === 0) {
                container.innerHTML = `<span class="text-xs font-bold text-slate-400">No Classes Found</span>`;
                document.getElementById('sheet-modal-body').innerHTML = `<div class="text-center py-10 text-slate-400 font-bold uppercase text-xs">No data rows found for ${targetSubject} in the Master Sheet.</div>`;
                return;
            }

            const normCls = norm(targetClass);

            // Generate multi-select checkboxes
            container.innerHTML = sortedClasses.map((c) => {
                const label = c.toLowerCase().startsWith('class') ? c : `Class ${c}`;
                const isChecked = norm(c) === normCls || norm(c).includes(normCls) || sortedClasses.length === 1;
                return `
                    <label class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 cursor-pointer hover:bg-teal-50 transition-colors shadow-sm">
                        <input type="checkbox" class="sheet-class-cb w-4 h-4 accent-teal-600 rounded" value="${c}" ${isChecked ? 'checked' : ''} onchange="buildSheetTreeForSelectedClasses()">
                        <span class="text-xs font-black uppercase text-slate-700">${label}</span>
                    </label>
                `;
            }).join('');

            buildSheetTreeForSelectedClasses();
        }

        function buildSheetTreeForSelectedClasses() {
            const selectedClasses = Array.from(document.querySelectorAll('.sheet-class-cb:checked')).map(cb => cb.value);
            buildSheetTree(cachedSubject, selectedClasses);
        }

   function buildSheetTree(targetSubject, targetClasses) {
            const body = document.getElementById('sheet-modal-body');
            const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            const normSub = norm(targetSubject);
            
            const targetClassesArray = Array.isArray(targetClasses) ? targetClasses : [targetClasses];
            const normClasses = targetClassesArray.map(c => norm(c));

            const getCol = (row, name) => {
                const key = Object.keys(row).find(k => k.trim().toLowerCase() === name.toLowerCase());
                return key ? String(row[key] || "").trim() : "";
            };

            const filteredRows = masterSheetData.filter(row => {
                const rSub = norm(getCol(row, "Subject"));
                const rCls = norm(getCol(row, "Class"));
                
                if (!rSub) return false;

                const matchesSub = rSub === normSub || rSub.includes(normSub) || normSub.includes(rSub);
                const matchesCls = normClasses.length === 0 || normClasses.some(nc => rCls === nc || rCls.includes(nc) || nc.includes(rCls));
                
                return matchesSub && matchesCls;
            });

            if (filteredRows.length === 0) {
                body.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold uppercase text-xs">No topics found for ${targetSubject} in the selected classes.</div>`;
                return;
            }

            let chapters = {};
            filteredRows.forEach(r => {
                const chap = getCol(r, "Chapter") || "General Chapters";
                const top = getCol(r, "Topic") || "General Topics";
                const sub = getCol(r, "Subtopic") || top;

                if (!chapters[chap]) chapters[chap] = {};
                if (!chapters[chap][top]) chapters[chap][top] = new Set();
                if (sub) chapters[chap][top].add(sub);
            });

            let html = "";
            let chapIdx = 0;

            Object.keys(chapters).sort().forEach(chap => {
                const chapId = `chap_${chapIdx++}`;
                html += `
                    <details class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden group">
                        <summary class="p-4 bg-slate-50 hover:bg-slate-100 cursor-pointer flex items-center justify-between font-black text-slate-800 text-sm uppercase select-none transition-colors">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" class="chap-cb w-5 h-5 accent-teal-600 rounded cursor-pointer" onchange="toggleGroupCheck(this, '.chap_${chapId}')" onclick="event.stopPropagation()">
                                <span>📚 ${chap}</span>
                            </div>
                            <span class="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                        </summary>
                        <div class="p-4 pl-8 space-y-3 border-t border-slate-100 bg-white">
                `;

                let topIdx = 0;
                Object.keys(chapters[chap]).sort().forEach(top => {
                    const topId = `${chapId}_top_${topIdx++}`;
                    const subtopics = Array.from(chapters[chap][top]).sort();

                    html += `
                        <div class="topic-container space-y-1.5">
                            <label class="flex items-center gap-2.5 font-bold text-slate-700 text-xs uppercase cursor-pointer">
                                <input type="checkbox" class="top-cb chap_${chapId} w-4 h-4 accent-teal-600 rounded" onchange="toggleGroupCheck(this, '.${topId}')">
                                <span class="text-teal-800">🔹 ${top}</span>
                            </label>
                    `;

                    if (subtopics.length > 1 || (subtopics.length === 1 && subtopics[0] !== top)) {
                        html += `<div class="pl-6 space-y-1">`;
                        subtopics.forEach(sub => {
                            if (sub !== top) {
                                html += `
                                    <label class="flex items-center gap-2 font-medium text-slate-600 text-xs uppercase cursor-pointer">
                                        <input type="checkbox" class="sub-cb ${topId} chap_${chapId} w-3.5 h-3.5 accent-teal-600 rounded" value="${sub}">
                                        <span>- ${sub}</span>
                                    </label>
                                `;
                            }
                        });
                        html += `</div>`;
                    }

                    html += `</div>`;
                });

                html += `</div></details>`;
            });

            body.innerHTML = html;
            
            // Auto pre-tick selections
            restoreSyllabusSelections();

            // Re-apply active search filter if text is already in search bar
            const searchVal = document.getElementById('sheet-search-input')?.value;
            if (searchVal) filterSyllabusTree();
        }

      function restoreSyllabusSelections() {
            if (!currentActiveTextAreaId) return;
            const ta = document.getElementById(currentActiveTextAreaId);
            if (!ta || !ta.value.trim()) return;

            // 1. Convert text to lowercase lines for parsing
            const lines = ta.value.toLowerCase().split('\n').map(l => l.trim());
            
            // 2. Parse the text back into a strict Hierarchy Object
            let parsedSyllabus = {};
            let currentChap = null;
            let currentTop = null;

            lines.forEach(line => {
                if (line.startsWith('📚 chapter:')) {
                    let chapName = line.replace('📚 chapter:', '').trim();
                    let isComplete = false;
                    if (chapName.endsWith('(complete chapter)')) {
                        isComplete = true;
                        chapName = chapName.replace('(complete chapter)', '').trim();
                    }
                    currentChap = chapName;
                    parsedSyllabus[currentChap] = { complete: isComplete, topics: {} };
                    currentTop = null;
                } 
                else if (line.startsWith('• ') && currentChap) {
                    let topName = line.replace('• ', '').trim();
                    let isAll = false;
                    if (topName.endsWith('(all subtopics)')) {
                        isAll = true;
                        topName = topName.replace('(all subtopics)', '').trim();
                    } else if (topName.endsWith(':')) {
                        topName = topName.slice(0, -1).trim(); // remove trailing colon
                    }
                    currentTop = topName;
                    parsedSyllabus[currentChap].topics[currentTop] = { all: isAll, subs: [] };
                }
                else if (line.startsWith('- ') && currentChap && currentTop) {
                    let subName = line.replace('- ', '').trim();
                    parsedSyllabus[currentChap].topics[currentTop].subs.push(subName);
                }
            });

            // 3. Apply checks strictly based on the hierarchy
            document.querySelectorAll('.chap-cb').forEach(chapCb => {
                const chapSpan = chapCb.nextElementSibling;
                if (!chapSpan) return;
                const chapLabel = chapSpan.innerText.trim().replace('📚 ', '').toLowerCase();
                const chapContainer = chapCb.closest('details');

                // Reset all checkboxes first just in case
                chapCb.checked = false;

                const chapData = parsedSyllabus[chapLabel];

                if (chapData) {
                    chapContainer.open = true;
                    if (chapData.complete) {
                        chapCb.checked = true;
                    }

                    const topCbs = chapContainer.querySelectorAll('.top-cb');
                    topCbs.forEach(topCb => {
                        const topLabelEl = topCb.closest('label');
                        const topSpanEl = topLabelEl.querySelector('span');
                        const topLabel = (topSpanEl ? topSpanEl.innerText : topLabelEl.innerText).trim().replace('🔹 ', '').toLowerCase();
                        const topContainer = topCb.closest('.topic-container') || topCb.closest('div');

                        topCb.checked = false; // Reset

                        const topData = chapData.topics[topLabel];

                        if (chapData.complete || topData) {
                            topCb.checked = true;
                        }

                        if (topContainer) {
                            const subCbs = topContainer.querySelectorAll('.sub-cb');
                            subCbs.forEach(subCb => {
                                subCb.checked = false; // Reset
                                const subText = subCb.value.toLowerCase();
                                
                                // Tick subtopic if chapter is complete, topic is fully selected, or specific subtopic matches
                                if (chapData.complete || (topData && topData.all) || (topData && topData.subs.includes(subText))) {
                                    subCb.checked = true;
                                }
                            });
                        }
                    });
                }
            });
        }

        function filterSyllabusTree() {
            const query = document.getElementById('sheet-search-input').value.trim().toLowerCase();
            const chapters = document.querySelectorAll('#sheet-modal-body > details');

            chapters.forEach(chap => {
                if (!query) {
                    // Reset to normal view when search box is empty
                    chap.style.display = '';
                    chap.querySelectorAll('.topic-container').forEach(tc => tc.style.display = '');
                    chap.querySelectorAll('.sub-cb').forEach(subCb => {
                        const lbl = subCb.closest('label');
                        if (lbl) lbl.style.display = '';
                    });
                    const hasChecked = chap.querySelector('input[type="checkbox"]:checked');
                    chap.open = !!hasChecked;
                    return;
                }

                const chapSummary = chap.querySelector('summary');
                const chapTitle = chapSummary ? chapSummary.innerText.toLowerCase() : '';
                const chapTitleMatches = chapTitle.includes(query);

                let chapHasMatches = chapTitleMatches;

                const topicContainers = chap.querySelectorAll('.topic-container');
                topicContainers.forEach(topWrap => {
                    const topLabel = topWrap.querySelector('label');
                    const topTitle = topLabel ? topLabel.innerText.toLowerCase() : '';
                    const topTitleMatches = topTitle.includes(query);

                    let topicHasMatches = topTitleMatches || chapTitleMatches;

                    const subCbs = topWrap.querySelectorAll('input.sub-cb');
                    subCbs.forEach(subCb => {
                        const subLabel = subCb.closest('label');
                        const subText = subCb.value.toLowerCase();
                        const subMatches = subText.includes(query);

                        if (subMatches || topTitleMatches || chapTitleMatches) {
                            if (subLabel) subLabel.style.display = '';
                            if (subMatches) topicHasMatches = true;
                        } else {
                            if (subLabel) subLabel.style.display = 'none';
                        }
                    });

                    if (topicHasMatches) {
                        topWrap.style.display = '';
                        chapHasMatches = true;
                    } else {
                        topWrap.style.display = 'none';
                    }
                });

                if (chapHasMatches) {
                    chap.style.display = '';
                    chap.open = true; // Auto-expand matching chapters
                } else {
                    chap.style.display = 'none';
                }
            });
        }

        function toggleGroupCheck(masterCb, targetSelector) {
            document.querySelectorAll(targetSelector).forEach(cb => {
                cb.checked = masterCb.checked;
            });
        }

function insertSelectedSyllabus() {
            if (!currentActiveTextAreaId) return;
            const ta = document.getElementById(currentActiveTextAreaId);
            if (!ta) return;

            let selectedTextParts = [];
            
            document.querySelectorAll('.chap-cb').forEach(chapCb => {
                const chapLabel = chapCb.nextElementSibling.innerText.trim().replace('📚 ', '');
                const chapContainer = chapCb.closest('details');
                
                const topCbs = chapContainer.querySelectorAll('.top-cb');
                let topParts = [];

                topCbs.forEach(topCb => {
                    const topLabel = topCb.closest('label').innerText.trim().replace('🔹 ', '');
                    const topContainer = topCb.closest('div');
                    const subCbs = topContainer.querySelectorAll('.sub-cb:checked');

                    if (topCb.checked) {
                        // If the whole topic is checked
                        topParts.push(`  • ${topLabel} (All Subtopics)`);
                    } else if (subCbs.length > 0) {
                        // If only specific subtopics are checked
                        let subs = Array.from(subCbs).map(sc => `    - ${sc.value}`).join('\n');
                        topParts.push(`  • ${topLabel}:\n${subs}`);
                    }
                });

                if (chapCb.checked) {
                    // If the master chapter box is checked
                    selectedTextParts.push(`📚 CHAPTER: ${chapLabel.toUpperCase()} (Complete Chapter)`);
                } else if (topParts.length > 0) {
                    // If only inner topics/subtopics are checked, still print the Chapter Header
                    selectedTextParts.push(`📚 CHAPTER: ${chapLabel.toUpperCase()}\n${topParts.join('\n')}`);
                }
            });

            if (selectedTextParts.length === 0) {
                return alert("Please select at least one chapter, topic, or subtopic.");
            }

            const formattedString = selectedTextParts.join('\n\n');
            
            // Append to existing text or insert fresh
            if (ta.value.trim() !== "") {
                ta.value += "\n\n" + formattedString;
            } else {
                ta.value = formattedString;
            }

            // Show the WhatsApp button immediately after inserting syllabus text
            const waBtn = document.getElementById(`wa_btn_${currentActiveTextAreaId}`);
            if (waBtn) {
                waBtn.classList.remove('hidden');
                waBtn.classList.add('flex');
            }

            closeSheetModal();
        }

        async function saveSyllabus(docId, subject, textAreaId) {
            const syllabusText = document.getElementById(textAreaId).value.trim();
            const btn = event.target;
            const orig = btn.innerText;
            btn.innerText = "⏳";
            
            try {
                const prefix = activeCenter === "GHUMARWIN" ? "" : activeCenter.toLowerCase() + "_";
                const ref = db.collection(prefix + "exam_schedules").doc(docId);
                
                await ref.update({
                    [`syllabi.${subject}`]: syllabusText
                });
                
                btn.innerText = "✅ Saved";
                setTimeout(() => btn.innerText = orig, 2000);
                
                const waBtn = document.getElementById(`wa_btn_${textAreaId}`);
                if (waBtn) {
                    if (syllabusText !== '') {
                        waBtn.classList.remove('hidden');
                        waBtn.classList.add('flex');
                    } else {
                        waBtn.classList.add('hidden');
                        waBtn.classList.remove('flex');
                    }
                }
            } catch(e) {
                console.error(e);
                alert("Failed to save syllabus.");
                btn.innerText = orig;
            }
        }

        async function openApplySyllabusModal(dateStr, className, subject, textAreaId) {
            const syllabusText = document.getElementById(textAreaId).value.trim();
            if(!syllabusText) return alert("Please type or select a syllabus first.");
            
            document.getElementById('syll-apply-date').value = dateStr;
            document.getElementById('syll-apply-subject').value = subject;
            document.getElementById('syll-apply-source-id').value = textAreaId;
            
            const listContainer = document.getElementById('syllabus-apply-list');
            listContainer.innerHTML = '<div class="text-center"><span class="loader border-t-sky-600"></span></div>';
            document.getElementById('syllabus-apply-modal').classList.replace('hidden', 'flex');

            try {
                const prefix = activeCenter === "GHUMARWIN" ? "" : activeCenter.toLowerCase() + "_";
                const snap = await db.collection(prefix + "exam_schedules")
                    .where("date", "==", dateStr)
                    .where("className", "==", className)
                    .where("subjects", "array-contains", subject)
                    .get();

                let html = "";
                snap.docs.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <label class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-xl mb-2 cursor-pointer hover:bg-sky-50 transition-colors">
                            <input type="checkbox" class="syll-sec-cb w-5 h-5 accent-sky-600" value="${doc.id}" checked>
                            <span class="font-black text-slate-700 text-sm uppercase">Section ${data.section}</span>
                        </label>
                    `;
                });
                
                if(!html) html = "<p class='text-xs font-bold text-slate-400'>No other sections found.</p>";
                listContainer.innerHTML = html;
            } catch(e) {
                console.error(e);
                listContainer.innerHTML = "<p class='text-xs text-rose-500 font-bold'>Error loading sections.</p>";
            }
        }

        async function executeApplySyllabus() {
            const subject = document.getElementById('syll-apply-subject').value;
            const sourceId = document.getElementById('syll-apply-source-id').value;
            const syllabusText = document.getElementById(sourceId).value.trim();
            
            const selectedDocIds = Array.from(document.querySelectorAll('.syll-sec-cb:checked')).map(cb => cb.value);
            if(selectedDocIds.length === 0) return alert("Please select at least one section.");
            
            const btn = document.getElementById('syll-apply-btn');
            const orig = btn.innerText;
            btn.innerText = "⏳ Applying...";
            btn.disabled = true;

            try {
                const prefix = activeCenter === "GHUMARWIN" ? "" : activeCenter.toLowerCase() + "_";
                const batch = db.batch();
                
                selectedDocIds.forEach(id => {
                    const ref = db.collection(prefix + "exam_schedules").doc(id);
                    batch.update(ref, { [`syllabi.${subject}`]: syllabusText });
                });
                
                await batch.commit();
                
                selectedDocIds.forEach(id => {
                    const safeId = `syll_${id}_${subject.replace(/[^a-zA-Z0-9]/g, '')}`;
                    const ta = document.getElementById(safeId);
                    if (ta && ta.id !== sourceId) {
                        ta.value = syllabusText;
                        const waBtn = document.getElementById(`wa_btn_${safeId}`);
                        if (waBtn) {
                            waBtn.classList.remove('hidden');
                            waBtn.classList.add('flex');
                        }
                    }
                });

                alert("✅ Syllabus applied to selected sections!");
                document.getElementById('syllabus-apply-modal').classList.replace('flex', 'hidden');
            } catch(e) {
                console.error(e);
                alert("Failed to apply to sections.");
            } finally {
                btn.innerText = orig;
                btn.disabled = false;
            }
        }

       function shareSyllabusWhatsApp(examDate, className, section, subject, textAreaId) {
            const syllabusText = document.getElementById(textAreaId).value.trim();
            if(!syllabusText) return alert("Please type a syllabus before sharing.");
            
            const msg = `*Exam Syllabus*\nDate: ${examDate}\nClass: ${className} | Sec: ${section}\nSubject: ${subject}\n\n*Syllabus:*\n${syllabusText}`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        function openExportModal() {
            document.getElementById('export-modal').classList.remove('hidden');
            document.getElementById('export-modal').classList.add('flex');
        }

        function closeExportModal() {
            document.getElementById('export-modal').classList.add('hidden');
            document.getElementById('export-modal').classList.remove('flex');
        }

        async function exportToExcel() {
            const startDate = document.getElementById('export-start-date').value;
            const endDate = document.getElementById('export-end-date').value;

            if (!startDate || !endDate) return alert("Please select both start and end dates.");
            if (startDate > endDate) return alert("Start Date cannot be after End Date.");

            const btn = document.getElementById('export-exec-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Compiling Data...";
            btn.disabled = true;

            try {
                const snap = await getCollection("exam_schedules")
                    .where("date", ">=", startDate)
                    .where("date", "<=", endDate)
                    .orderBy("date", "asc")
                    .get();

                if (snap.empty) {
                    alert("No exams found in this date range.");
                    return;
                }

                const dateGroups = {};
                snap.forEach(doc => {
                    const data = doc.data();
                    if(!dateGroups[data.date]) dateGroups[data.date] = [];
                    dateGroups[data.date].push({ id: doc.id, ...data });
                });

                let tableHtml = `<table border="1" style="border-collapse: collapse; font-family: sans-serif;"><tbody>`;

                Object.keys(dateGroups).sort().forEach(dateStr => {
                    const rowDatePretty = new Date(dateStr).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                    
                    tableHtml += `
                        <tr>
                            <td colspan="5" style="background-color: #e2e8f0; color: #0f172a; padding: 12px; font-weight: bold; font-size: 14pt; text-align: center; text-transform: uppercase;">
                                📅 ${rowDatePretty}
                            </td>
                        </tr>
                        <tr>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Exam Type</th>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Class</th>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Section</th>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Subject</th>
                            <th style="background-color: #0f172a; color: white; padding: 10px; font-weight: bold;">Syllabus</th>
                        </tr>
                    `;

                    let flatRows = [];
                    dateGroups[dateStr].forEach(p => {
                        const processSection = (cName, secName, subs) => {
                            const subArray = Array.isArray(subs) ? subs : [subs];
                            subArray.forEach(sub => {
                                flatRows.push({
                                    type: p.type,
                                    className: cName,
                                    section: secName,
                                    subject: sub,
                                    syllabus: p.syllabi && p.syllabi[sub] ? p.syllabi[sub] : ""
                                });
                            });
                        };

                        if (p.targets && p.targets.length > 0) {
                            p.targets.forEach(t => {
                                t.sections.forEach(s => {
                                    let secName = typeof s === 'object' ? s.section : s;
                                    let subs = typeof s === 'object' && s.subjects ? s.subjects : (t.subjects || []);
                                    processSection(t.className, secName, subs);
                                });
                            });
                        } else {
                            let subs = p.subjects || [];
                            processSection(p.className, p.section, subs);
                        }
                    });

                    flatRows.sort((a, b) => {
                        if (a.className !== b.className) return a.className.localeCompare(b.className, undefined, {numeric: true});
                        if (a.section !== b.section) return a.section.localeCompare(b.section, undefined, {numeric: true});
                        return a.subject.localeCompare(b.subject);
                    });

                    flatRows.forEach(row => {
                        const hasSyllabus = (row.syllabus && row.syllabus.trim() !== "");
                        const syllContent = hasSyllabus ? row.syllabus.replace(/\n/g, '<br>') : "<span style='color: #e11d48; font-weight: bold;'>PENDING</span>";
                        
                        tableHtml += `
                            <tr>
                                <td style="padding: 8px; text-align: center;">${row.type}</td>
                                <td style="padding: 8px; font-weight: bold;">${row.className}</td>
                                <td style="padding: 8px;">Sec ${row.section}</td>
                                <td style="padding: 8px; color: #4f46e5; font-weight: bold;">${row.subject}</td>
                                <td style="padding: 8px; text-align: left; vertical-align: top;">${syllContent}</td>
                            </tr>
                        `;
                    });
                    
                    tableHtml += `<tr><td colspan="5" style="border: none; height: 20px;"></td></tr>`;
                });

                tableHtml += `</tbody></table>`;

                const fullHTML = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>${tableHtml}</body></html>`;
                const blob = new Blob(['\ufeff', fullHTML], { type: 'application/vnd.ms-excel' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); 
                a.href = url; 
                a.download = `Minerva_Exam_Schedule_${startDate}_to_${endDate}.xls`;
                document.body.appendChild(a); 
                a.click(); 
                document.body.removeChild(a);
                closeExportModal();
            } catch (error) {
                console.error("Excel generation failed:", error);
                alert("Error generating Excel document.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
