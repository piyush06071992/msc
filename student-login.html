<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Study Circle | Student Login</title>
    <script src="tailwind-engine.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .setup-input { 
            background: #f1f5f9; 
            border: 1px solid #cbd5e1; 
            border-radius: 16px; 
            padding: 14px 18px; 
            font-size: 14px; 
            font-weight: 700; 
            color: #0f172a; 
            outline: none; 
            width: 100%; 
            transition: 0.2s;
        }
        .setup-input:focus { 
            border-color: #3b82f6; 
            background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative p-4 sm:p-6">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-[400px] h-72 sm:h-[400px] bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-[400px] h-72 sm:h-[400px] bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <div class="w-full max-w-md">
        <button onclick="window.location.href='index.html'" class="mb-6 flex items-center gap-2 text-xs font-black uppercase tracking-widest text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
            Back to Hub
        </button>

        <div class="glass-card rounded-[2.5rem] p-8 sm:p-10 shadow-2xl border border-white relative overflow-hidden">
            <div class="text-center mb-8">
                <div class="inline-block p-3 bg-white rounded-2xl shadow-sm border border-slate-100 mb-4">
                    <img src="logo.png?v=2" alt="Minerva Logo" class="w-12 h-12 object-contain" onerror="this.src='https://via.placeholder.com/50?text=M'">
                </div>
                <h2 class="text-2xl font-black text-slate-900 uppercase tracking-tight">Student Login</h2>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mt-1">Minerva Analytics Platform</p>
            </div>

            <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 mb-6">
                <span class="block text-[9px] font-black text-blue-500 uppercase tracking-widest mb-1.5">💡 Management Demo Credentials:</span>
                <div class="text-xs font-bold text-blue-900 space-y-1 leading-relaxed">
                    <div><b>Email:</b> <span class="font-mono bg-white px-1.5 py-0.5 rounded border border-blue-200 select-all">student@minerva.com</span></div>
                    <div class="my-1"><b>Mobile:</b> <span class="font-mono bg-white px-1.5 py-0.5 rounded border border-blue-200 select-all">9876543210</span></div>
                    <div><b>Password:</b> <span class="font-mono bg-white px-1.5 py-0.5 rounded border border-blue-200 select-all">minerva123</span></div>
                </div>
            </div>

            <form onsubmit="handleStudentLogin(event)" class="space-y-5">
                <div>
                    <label for="student-identifier" class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 pl-1">Email ID or Mobile Number</label>
                    <input type="text" id="student-identifier" required class="setup-input" placeholder="e.g., student@minerva.com or 9876543210">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2 px-1">
                        <label for="student-password" class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Password</label>
                        <button type="button" onclick="triggerDummyReset()" class="text-[10px] font-black text-blue-600 uppercase tracking-widest hover:underline outline-none">Forgot?</button>
                    </div>
                    <input type="password" id="student-password" required class="setup-input" placeholder="••••••••">
                </div>

                <div id="error-message" class="hidden text-rose-600 text-[11px] font-black uppercase tracking-wider bg-rose-50 border border-rose-100 p-3 rounded-xl text-center shadow-sm">
                    🚨 Invalid credentials! Use the demo keys shown above.
                </div>

                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-black py-4 rounded-2xl uppercase tracking-widest text-xs shadow-xl active:scale-95 transition-all mt-2">
                    Let's Begin ➔
                </button>
            </form>
        </div>

        <div class="mt-8 text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.4em]">
            Minerva Study Circle Engine
        </div>
    </div>

    <script>
        function handleStudentLogin(e) {
            e.preventDefault();
            
            const identifier = document.getElementById('student-identifier').value.trim();
            const password = document.getElementById('student-password').value;
            const errorBlock = document.getElementById('error-message');
            
            // Hardcoded Demo Credentials Matcher
            const validEmail = "student@minerva.com";
            const validMobile = "9876543210";
            const validPassword = "minerva123";
            
            if ((identifier === validEmail || identifier === validMobile) && password === validPassword) {
                errorBlock.classList.add('hidden');
                
                // Set temporary mock session for student structure tracking if needed later
                sessionStorage.setItem('minervaStudentAuth', 'true');
                
                // Smooth simulation redirect
                window.location.href = 'student-portal.html';
            } else {
                errorBlock.classList.remove('hidden');
                // Shake effect on error block
                errorBlock.classList.add('animate-bounce');
                setTimeout(() => errorBlock.classList.remove('animate-bounce'), 1000);
            }
        }

        function triggerDummyReset() {
            alert("🔑 SIMULATED RESET ACTION\n\nPassword reset system triggered! A dummy secure recovery magic link has been simulated to your registered contact channel.");
        }
    </script>
</body>
</html>
