<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Study Circle | Portal</title>
    
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#1e40af">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .hero-text {
            font-size: clamp(2.2rem, 9vw, 4.5rem);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 sm:p-8 flex flex-col items-center justify-center relative overflow-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-pulse"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <div class="w-full max-w-5xl flex flex-col items-center gap-10 sm:gap-16">
        
        <div class="text-center space-y-4">
            <div class="inline-block p-4 bg-white rounded-[2.5rem] shadow-sm border border-slate-100 mb-2 transform hover:rotate-2 transition-transform">
                <img src="logo.png?v=2" alt="Minerva Logo" class="w-20 h-20 sm:w-24 sm:h-24 object-contain">
            </div>
            <h1 class="hero-text font-black text-slate-900 tracking-tighter leading-[0.85] text-center">
                Minerva <br> <span class="text-blue-700">Study Circle</span>
            </h1>
            <div class="flex items-center justify-center gap-2 mt-4">
                <span class="h-px w-8 bg-slate-300"></span>
                <p class="text-slate-500 font-black uppercase tracking-[0.25em] text-[10px] sm:text-xs">
                    Education Management Portal
                </p>
                <span class="h-px w-8 bg-slate-300"></span>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 w-full px-2">
            
            <button onclick="window.location.href='admin-login.html'" class="group glass-card p-8 rounded-[2.5rem] shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-center border-2 border-transparent hover:border-blue-400">
                <div class="bg-blue-600 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-5 group-hover:rotate-6 transition-transform shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                </div>
                <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs">Admin Portal</h3>
            </button>

            <button onclick="window.location.href='staff-registration.html'" class="group glass-card p-8 rounded-[2.5rem] shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-center border-2 border-transparent hover:border-emerald-400">
                <div class="bg-emerald-600 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-5 group-hover:rotate-6 transition-transform shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                </div>
                <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs">Staff Portal</h3>
            </button>

            <button onclick="window.location.href='student-portal.html'" class="group glass-card p-8 rounded-[2.5rem] shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-center border-2 border-transparent hover:border-amber-400">
                <div class="bg-amber-500 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-5 group-hover:rotate-6 transition-transform shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zM12 14l9-5-9-5-9 5 9 5z"/></svg>
                </div>
                <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs">Student Portal</h3>
            </button>

            <button onclick="window.location.href='parent-portal.html'" class="group glass-card p-8 rounded-[2.5rem] shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-center border-2 border-transparent hover:border-rose-400">
                <div class="bg-rose-500 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-5 group-hover:rotate-6 transition-transform shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                </div>
                <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs">Parents Portal</h3>
            </button>

        </div>

        <div class="mt-4 text-slate-400 text-[10px] font-black uppercase tracking-[0.4em]">
            &copy; 2026 Ghumarwin, HP
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Failed', err));
            });
        }
    </script>

</body>
</html>
