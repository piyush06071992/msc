<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Study Circle | Portal</title>
    
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo.png?v=2">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Premium Frosted Glass Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* Ambient Background Animation */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans relative overflow-x-hidden flex items-center">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-indigo-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
    </div>

    <div class="w-full max-w-7xl mx-auto px-4 sm:px-8 py-12 flex flex-col lg:flex-row items-center justify-between gap-12 lg:gap-20 z-10">

        <div class="flex-1 text-center lg:text-left w-full mt-4 lg:mt-0">
            <img src="/logo.png?v=2" alt="Minerva Logo" class="w-24 h-24 sm:w-32 sm:h-32 mx-auto lg:mx-0 rounded-2xl shadow-xl mb-6 bg-white p-2 border border-slate-100 object-contain">
            
            <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">
                Minerva Study Circle
            </h1>
            <p class="text-xl sm:text-2xl text-blue-600 font-semibold mb-6 flex items-center justify-center lg:justify-start gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Premier Coaching in Ghumarwin
            </p>
            <p class="text-slate-600 max-w-lg mx-auto lg:mx-0 text-base sm:text-lg leading-relaxed">
                Welcome to your complete digital ERP portal. Connect, manage, and excel with our advanced syllabus tracking and performance management system.
            </p>
        </div>

        <div class="flex-1 w-full max-w-md lg:max-w-lg">
            <div class="glass-card p-6 sm:p-10 rounded-[2rem] shadow-2xl">
                
                <div id="install-area" class="mb-8">
                    <button id="install-btn" class="hidden w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-2xl transition-all flex items-center justify-center gap-3 shadow-lg transform hover:-translate-y-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Install Minerva App
                    </button>
                    <div id="ios-info" class="hidden w-full p-4 bg-blue-50/80 border border-blue-100 rounded-2xl text-blue-800 text-sm text-center font-medium">
                        Tap <span class="font-bold">Share</span> then <span class="font-bold border-b border-blue-800 pb-0.5">Add to Home Screen</span> to install.
                    </div>
                </div>

                <div class="mb-6 flex items-center">
                    <div class="h-px bg-slate-200 flex-1"></div>
                    <span class="px-4 text-sm text-slate-400 font-semibold uppercase tracking-wider">Select Portal</span>
                    <div class="h-px bg-slate-200 flex-1"></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    
                    <button onclick="window.location.href='admin.html'" class="group flex items-center p-4 bg-white/50 border-2 border-transparent hover:border-blue-500 hover:bg-blue-50 rounded-2xl transition-all shadow-sm hover:shadow-md">
                        <div class="bg-blue-100 p-3 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <div class="ml-4 text-left">
                            <p class="text-sm font-bold text-slate-800">Admin</p>
                            <p class="text-xs text-slate-500 font-medium">Management</p>
                        </div>
                    </button>

                    <button onclick="window.location.href='staff.html'" class="group flex items-center p-4 bg-white/50 border-2 border-transparent hover:border-indigo-500 hover:bg-indigo-50 rounded-2xl transition-all shadow-sm hover:shadow-md">
                        <div class="bg-indigo-100 p-3 rounded-xl group-hover:bg-indigo-600 group-hover:text-white transition-colors shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </div>
                        <div class="ml-4 text-left">
                            <p class="text-sm font-bold text-slate-800">Staff</p>
                            <p class="text-xs text-slate-500 font-medium">Teachers</p>
                        </div>
                    </button>

                    <button onclick="window.location.href='student.html'" class="group flex items-center p-4 bg-white/50 border-2 border-transparent hover:border-emerald-500 hover:bg-emerald-50 rounded-2xl transition-all shadow-sm hover:shadow-md">
                        <div class="bg-emerald-100 p-3 rounded-xl group-hover:bg-emerald-600 group-hover:text-white transition-colors shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                        </div>
                        <div class="ml-4 text-left">
                            <p class="text-sm font-bold text-slate-800">Student</p>
                            <p class="text-xs text-slate-500 font-medium">Academics</p>
                        </div>
                    </button>

                    <button onclick="window.location.href='parents.html'" class="group flex items-center p-4 bg-white/50 border-2 border-transparent hover:border-amber-500 hover:bg-amber-50 rounded-2xl transition-all shadow-sm hover:shadow-md">
                        <div class="bg-amber-100 p-3 rounded-xl group-hover:bg-amber-600 group-hover:text-white transition-colors shadow-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                        </div>
                        <div class="ml-4 text-left">
                            <p class="text-sm font-bold text-slate-800">Parents</p>
                            <p class="text-xs text-slate-500 font-medium">Performance</p>
                        </div>
                    </button>

                </div>

                <div class="text-center mt-8">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-[0.2em]">Digital Management System v2.0</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        const iosInfo = document.getElementById('ios-info');

        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

        if (isIos && !isStandalone) {
            iosInfo.classList.remove('hidden');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
