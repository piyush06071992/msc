<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Staff Form Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        .ghost { opacity: 0.4; background: #e0e7ff; border: 2px dashed #4f46e5; }
        #canvas { counter-reset: field-counter; }
        .form-field-item { counter-increment: field-counter; }
        .field-number::before { content: counter(field-counter) ". "; }
        .system-field { border-left: 6px solid #3b82f6 !important; background: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans overflow-hidden">

    <header class="h-20 bg-white border-b flex justify-between items-center px-6 shadow-sm shrink-0 z-50">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-lg"><svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></button>
            <h1 class="text-xl font-bold text-slate-800">Staff Registration Architect</h1>
        </div>
        <div class="flex gap-4">
            <input type="text" id="org-code" class="bg-slate-100 px-4 py-2 rounded-xl text-sm font-bold w-32 outline-none" value="MINERVA-2026">
            <button id="save-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2.5 rounded-xl font-bold shadow-lg transition-all">Save Config</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-72 bg-white border-r p-6 overflow-y-auto hidden md:block">
            <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Field Toolbox</h2>
            <div id="toolbox" class="space-y-3">
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-blue-300 flex items-center gap-3" data-type="text"><div class="bg-blue-100 p-2 rounded-lg text-blue-600 font-bold text-[10px]">ABC</div><span class="text-sm font-bold">Text</span></div>
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-emerald-300 flex items-center gap-3" data-type="number"><div class="bg-emerald-100 p-2 rounded-lg text-emerald-600 font-bold text-[10px]">123</div><span class="text-sm font-bold">Numeric</span></div>
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-red-300 flex items-center gap-3" data-type="date"><div class="bg-red-100 p-2 rounded-lg text-red-600 font-bold text-[10px]">CAL</div><span class="text-sm font-bold">Calendar</span></div>
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-purple-300 flex items-center gap-3" data-type="select"><div class="bg-purple-100 p-2 rounded-lg text-purple-600 font-bold text-[10px]">LIST</div><span class="text-sm font-bold">Dropdown</span></div>
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-amber-300 flex items-center gap-3" data-type="checkbox"><div class="bg-amber-100 p-2 rounded-lg text-amber-600 font-bold text-[10px]">TICK</div><span class="text-sm font-bold">Multi-Tick</span></div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 sm:p-10 bg-slate-50">
            <div class="max-w-2xl mx-auto pb-20">
                <div id="canvas" class="min-h-[700px] bg-white rounded-[3rem] shadow-2xl p-8 sm:p-12 border border-slate-100 space-y-4">
                    <div class="system-field p-6 rounded-2xl border border-slate-200 opacity-80 cursor-not-allowed">
                        <p class="text-[9px] font-black text-blue-500 uppercase tracking-widest mb-1">System Required</p>
                        <p class="font-bold text-slate-800">Email & Mobile Number (Compulsory)</p>
                    </div>
                    <div class="system-field p-6 rounded-2xl border border-slate-200 opacity-80 cursor-not-allowed">
                        <p class="text-[9px] font-black text-blue-500 uppercase tracking-widest mb-1">System Required</p>
                        <p class="font-bold text-slate-800">Password (with Eye Toggle)</p>
                    </div>
                    <div id="drag-zone" class="space-y-4 pt-4 min-h-[200px]"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">
            <h3 class="text-2xl font-bold mb-6">Field Settings</h3>
            <div class="space-y-5">
                <div><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Field Label</label><input type="text" id="edit-label" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none"></div>
                <div id="limit-container"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Max Length</label><input type="number" id="edit-limit" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold"></div>
                <div id="options-container" class="hidden"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Options (Comma separated)</label><textarea id="edit-options" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl h-20 resize-none font-bold"></textarea></div>
                <div class="flex flex-col gap-3">
                    <label class="flex items-center p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 cursor-pointer"><input type="checkbox" id="edit-required" class="w-5 h-5 accent-blue-600"><span class="ml-3 text-sm font-bold uppercase">Compulsory</span></label>
                    <label class="flex items-center p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 cursor-pointer"><input type="checkbox" id="edit-searchable" class="w-5 h-5 accent-indigo-600"><span class="ml-3 text-sm font-bold uppercase">Searchable</span></label>
                    <label id="filter-option" class="flex items-center p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 cursor-pointer hidden"><input type="checkbox" id="edit-filterable" class="w-5 h-5 accent-purple-600"><span class="ml-3 text-sm font-bold uppercase">Enable Filter</span></label>
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="window.closeSettings()" class="flex-1 py-4 font-bold text-slate-400 hover:bg-slate-50 rounded-2xl">Cancel</button>
                <button onclick="window.applySettings()" class="flex-1 py-4 font-bold bg-blue-600 text-white rounded-2xl shadow-lg">Apply</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const dragZone = document.getElementById('drag-zone');
        const toolbox = document.getElementById('toolbox');
        let activeField = null;

        async function loadExistingDesign() {
            const docSnap = await getDoc(doc(db, "configs", "staff_registration_form"));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('org-code').value = data.orgCode || "MINERVA-2026";
                dragZone.innerHTML = "";
                data.fields.forEach(f => {
                    const el = document.createElement('div');
                    setupField(el, f.type);
                    el.querySelector('.field-label').innerText = f.label;
                    el.setAttribute('data-label', f.label);
                    el.setAttribute('data-limit', f.limit || "");
                    el.setAttribute('data-options', f.options || "");
                    el.setAttribute('data-required', f.required);
                    el.setAttribute('data-searchable', f.searchable);
                    el.setAttribute('data-filterable', f.filterable);
                    updateUI(el);
                    dragZone.appendChild(el);
                });
            }
        }

        function setupField(el, type) {
            el.className = "form-field-item group relative p-6 border-2 border-slate-100 rounded-3xl bg-white hover:border-blue-400 transition-all cursor-move mb-4 shadow-sm";
            el.setAttribute('data-field-type', type);
            const labels = { text: 'TEXT', number: 'NUMERIC', date: 'CALENDAR', select: 'DROPDOWN', checkbox: 'MULTI-TICK' };
            const dateHint = type === 'date' ? '<p class="text-[10px] text-blue-500 font-bold mt-1">Format: 06 Jul 1992</p>' : '';
            el.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-2">
                        <span class="field-number font-black text-blue-600 text-lg"></span>
                        <span class="text-[8px] font-black px-2 py-0.5 bg-slate-100 text-slate-500 rounded uppercase tracking-widest">${labels[type]}</span>
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button class="settings-trigger p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg></button>
                        <button class="delete-trigger p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                    </div>
                </div>
                <p class="font-bold text-slate-800 text-lg field-label">New Field</p>${dateHint}
                <div class="mt-2 flex flex-wrap gap-2">
                    <span class="badge-req text-[8px] font-bold px-2 py-0.5 bg-slate-100 text-slate-400 rounded uppercase">Optional</span>
                    <span class="badge-search text-[8px] font-bold px-2 py-0.5 bg-indigo-50 text-indigo-400 rounded uppercase hidden">Searchable</span>
                    <span class="badge-filter text-[8px] font-bold px-2 py-0.5 bg-purple-50 text-purple-400 rounded uppercase hidden">Filter</span>
                </div>
            `;
            el.querySelector('.settings-trigger').onclick = () => {
                activeField = el;
                const type = el.getAttribute('data-field-type');
                document.getElementById('edit-label').value = el.querySelector('.field-label').innerText === "New Field" ? "" : el.querySelector('.field-label').innerText;
                document.getElementById('edit-limit').value = el.getAttribute('data-limit') || "";
                document.getElementById('edit-options').value = el.getAttribute('data-options') || "";
                document.getElementById('edit-required').checked = el.getAttribute('data-required') === "true";
                document.getElementById('edit-searchable').checked = el.getAttribute('data-searchable') === "true";
                document.getElementById('edit-filterable').checked = el.getAttribute('data-filterable') === "true";
                document.getElementById('limit-container').classList.toggle('hidden', ['select', 'checkbox', 'date'].includes(type));
                document.getElementById('options-container').classList.toggle('hidden', !['select', 'checkbox'].includes(type));
                document.getElementById('filter-option').classList.toggle('hidden', !['select', 'checkbox'].includes(type));
                document.getElementById('settings-modal').classList.replace('hidden', 'flex');
            };
            el.querySelector('.delete-trigger').onclick = () => el.remove();
        }

        window.applySettings = () => {
            activeField.querySelector('.field-label').innerText = document.getElementById('edit-label').value || "Unnamed Question";
            activeField.setAttribute('data-label', document.getElementById('edit-label').value);
            activeField.setAttribute('data-limit', document.getElementById('edit-limit').value);
            activeField.setAttribute('data-options', document.getElementById('edit-options').value);
            activeField.setAttribute('data-required', document.getElementById('edit-required').checked);
            activeField.setAttribute('data-searchable', document.getElementById('edit-searchable').checked);
            activeField.setAttribute('data-filterable', document.getElementById('edit-filterable').checked);
            updateUI(activeField);
            window.closeSettings();
        };

        function updateUI(el) {
            const req = el.getAttribute('data-required') === "true";
            el.querySelector('.badge-req').innerText = req ? "Compulsory" : "Optional";
            el.querySelector('.badge-req').classList.toggle('text-red-500', req);
            el.querySelector('.badge-search').classList.toggle('hidden', el.getAttribute('data-searchable') !== "true");
            el.querySelector('.badge-filter').classList.toggle('hidden', el.getAttribute('data-filterable') !== "true");
        }

        window.closeSettings = () => document.getElementById('settings-modal').classList.replace('flex', 'hidden');

        document.getElementById('save-btn').onclick = async () => {
            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving..."; btn.disabled = true;
            const fields = [];
            dragZone.querySelectorAll('.form-field-item').forEach(f => {
                fields.push({
                    type: f.getAttribute('data-field-type'),
                    label: f.getAttribute('data-label') || f.querySelector('.field-label').innerText,
                    limit: f.getAttribute('data-limit'),
                    options: f.getAttribute('data-options'),
                    required: f.getAttribute('data-required') === "true",
                    searchable: f.getAttribute('data-searchable') === "true",
                    filterable: f.getAttribute('data-filterable') === "true"
                });
            });
            try {
                await setDoc(doc(db, "configs", "staff_registration_form"), { orgCode: document.getElementById('org-code').value, fields, updated: new Date().toISOString() });
                alert('✅ Success! Design synced to Cloud.');
            } catch (e) { alert('Save failed: ' + e.message); }
            btn.innerText = "Save Config"; btn.disabled = false;
        };

        new Sortable(toolbox, { group: { name: 'sh', pull: 'clone', put: false }, sort: false });
        new Sortable(dragZone, { group: 'sh', animation: 250, onAdd: (e) => setupField(e.item, e.item.getAttribute('data-type')) });
        loadExistingDesign();
    </script>
</body>
</html>
