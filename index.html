<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Study Circle | Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        body {
            background: linear-gradient(135deg, #f0f7ff 0%, #e0e7ff 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="w-full max-w-lg lg:max-w-2xl glass-card p-6 sm:p-10 rounded-3xl shadow-2xl border border-white">
        
        <div id="install-area" class="mb-6">
            <button id="install-btn" class="hidden w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-2xl transition-all flex items-center justify-center gap-2 shadow-lg transform hover:scale-[1.02] active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Install Minerva App
            </button>
            <div id="ios-info" class="hidden w-full p-4 bg-blue-50 border border-blue-100 rounded-2xl text-blue-800 text-sm text-center">
                Tap <span class="font-bold">Share</span> then <span class="font-bold">"Add to Home Screen"</span> to install.
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-blue-900 tracking-tight leading-tight">
                Minerva Study Circle
            </h1>
            <p class="text-blue-600 font-medium text-lg mt-1 italic">
                A Premier Coaching Institute
            </p>
            <div class="h-1 w-20 bg-blue-600 mx-auto mt-4 rounded-full"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
            
            <button onclick="window.location.href='admin.html'" class="group flex items-center p-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-blue-600 hover:bg-blue-50 transition-all shadow-sm">
                <div class="bg-blue-100 p-3 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <div class="ml-4 text-left">
                    <p class="text-sm font-bold text-gray-900">Admin Login</p>
                    <p class="text-xs text-gray-500">Management & Settings</p>
                </div>
            </button>

            <button onclick="window.location.href='staff.html'" class="group flex items-center p-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-blue-600 hover:bg-blue-50 transition-all shadow-sm">
                <div class="bg-indigo-100 p-3 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <div class="ml-4 text-left">
                    <p class="text-sm font-bold text-gray-900">Staff Login</p>
                    <p class="text-xs text-gray-500">Teachers & Academics</p>
                </div>
            </button>

            <button onclick="window.location.href='student.html'" class="group flex items-center p-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-blue-600 hover:bg-blue-50 transition-all shadow-sm">
                <div class="bg-emerald-100 p-3 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <div class="ml-4 text-left">
                    <p class="text-sm font-bold text-gray-900">Student Login</p>
                    <p class="text-xs text-gray-500">Exams & Syllabus</p>
                </div>
            </button>

            <button onclick="window.location.href='parents.html'" class="group flex items-center p-4 bg-white border-2 border-gray-100 rounded-2xl hover:border-blue-600 hover:bg-blue-50 transition-all shadow-sm">
                <div class="bg-amber-100 p-3 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                </div>
                <div class="ml-4 text-left">
                    <p class="text-sm font-bold text-gray-900">Parents Login</p>
                    <p class="text-xs text-gray-500">Performance & Fee</p>
                </div>
            </button>

        </div>

        <div class="text-center">
            <p class="text-gray-400 text-xs font-medium uppercase tracking-widest">Digital Management System v2.0</p>
        </div>
    </div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }

        // PWA Installation Logic
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        const iosInfo = document.getElementById('ios-info');

        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

        if (isIos && !isStandalone) {
            iosInfo.classList.remove('hidden');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
