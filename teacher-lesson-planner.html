<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Teacher Lesson Planner</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card-prism { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.02); transition: all 0.3s ease; }
        .card-prism:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.1); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 2px solid #f1f5f9; border-top: 2px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 p-4 sm:px-8 sm:py-5 flex flex-wrap justify-between items-center shadow-lg gap-3">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors shadow-md border border-indigo-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </button>
            <div>
                <h1 class="text-sm sm:text-xl font-black uppercase text-white tracking-widest leading-none">Teacher Lesson Planner</h1>
                <div class="flex flex-wrap items-center gap-2 mt-1.5">
                    <p id="teacher-badge" class="text-[9px] sm:text-[10px] font-bold text-indigo-300 uppercase tracking-widest">Loading...</p>
                    <span id="locked-branch-badge" class="text-[9px] font-black text-sky-200 bg-indigo-900/90 border border-indigo-700 rounded px-2 py-0.5 uppercase tracking-widest">
                        📍 Branch: ...
                    </span>
                    <span id="locked-session-badge" class="text-[9px] font-black text-amber-200 bg-indigo-900/90 border border-indigo-700 rounded px-2 py-0.5 uppercase tracking-widest">
                        📅 Session: ...
                    </span>
                </div>
            </div>
            <div class="flex gap-2 ml-4">
                <button id="auth-btn" onclick="window.location.href='admin-lesson-auth.html'" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-colors shadow-md border border-indigo-500 flex items-center gap-2">
                    🔐 Delegation

                <button id="admin-hub-btn" onclick="window.location.href='admin-lesson-planner.html'" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-colors shadow-md border border-blue-500 flex items-center gap-2">
                    📊 Planner Hub

        <div class="flex items-center gap-3">
            <div id="demo-mode-indicator" class="hidden bg-amber-500/20 text-amber-300 px-3 py-2 rounded-xl text-[9px] font-black uppercase border border-amber-500/50 flex items-center gap-2">

    <main class="max-w-6xl mx-auto p-4 sm:p-10 space-y-6 sm:space-y-8">

    <div id="mode-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">

    <div id="syllabus-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[150] hidden items-center justify-center p-2 sm:p-4">
        <div class="bg-white rounded-[2rem] p-4 sm:p-6 max-w-4xl w-full h-[95vh] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div class="flex justify-between items-center mb-3 shrink-0 bg-white">
                <div>
                    <h3 id="syll-class-title" class="text-lg sm:text-xl font-black text-slate-900 uppercase tracking-tighter leading-none"></h3>

                        <span id="syll-session-badge" class="text-[9px] font-black text-blue-600 uppercase tracking-widest"></span>

                </div>
                <button onclick="closeModal('syllabus-modal')" class="p-2.5 bg-slate-100 rounded-xl text-slate-500 hover:bg-rose-100 hover:text-rose-600 transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>

            <div class="flex bg-slate-100 p-1 rounded-xl mb-3 shrink-0 shadow-inner" id="tracker-tabs">
                <button id="tab-syllabus" onclick="switchSyllabusTab('syllabus')" class="flex-1 py-2 text-[10px] sm:text-[11px] font-black uppercase tracking-widest rounded-lg bg-white shadow-sm text-blue-600 transition-all">📚 Mark Syllabus</button>
                <button id="tab-revision" onclick="switchSyllabusTab('revision')" class="flex-1 py-2 text-[10px] sm:text-[11px] font-black uppercase tracking-widest rounded-lg text-slate-500 hover:text-slate-800 transition-all hover:bg-slate-200/50">🎯 Log Activity</button>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll pr-2 pt-1 border-t border-slate-100">
                <div id="syllabus-tab-content" class="block space-y-3">
                    <div id="subject-pace-widget" class="hidden"></div>
                    <div id="chapter-accordion-container" class="space-y-3 mt-2"></div>
                </div>

                <div id="revision-tab-content" class="hidden h-full">
                    <div class="border-2 border-amber-100 bg-amber-50/40 rounded-2xl p-4 sm:p-6 shadow-sm flex flex-col h-full gap-4 mt-2">
                        <div class="font-black text-amber-900 text-sm uppercase tracking-widest flex items-center gap-2">
                            <span class="bg-amber-100 text-amber-600 p-2 rounded-xl shadow-sm">🎯</span> Log Independent Activity
                        </div>
                        
                        <div id="revision-batch-container" class="flex-1 overflow-y-auto custom-scroll space-y-3 pr-2 pb-2"></div>
                    </div>
                </div>
            </div>

            <div class="pt-3 mt-3 shrink-0 bg-white flex flex-col gap-2">
                <button id="confirm-day-btn" onclick="confirmDaySubmission()" class="w-full bg-emerald-600 text-white font-black py-3.5 rounded-xl uppercase tracking-widest text-[10px] sm:text-xs shadow-lg shadow-emerald-600/30 hover:bg-emerald-700 active:scale-95 transition-all">
                    Securely Confirm & Log Day's Progress
                </button>
                <button id="request-unlock-btn" onclick="requestUnlock()" class="w-full bg-rose-50 text-rose-600 font-black py-3 rounded-xl uppercase tracking-widest text-[9px] border border-rose-200 hover:bg-rose-100 transition-all hidden">
                    Made a Mistake? Request Admin Unlock
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lpccpiozrqgxgusculbs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwY2NwaW96cnFneGd1c2N1bGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzMzNzQsImV4cCI6MjEwOTU0OTM3NH0.b2cNwu7y-uoFTOOK-Qy2-XX7QbrSMYzJ5Ja2EBO98Hc";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let activeBranchId = null;
        let activeSessionId = null;
        let activeCenter = "GHUMARWIN";
        let activeSessionName = "";

        let activeStaff = null;
        let mySessions = [];
        let currentPlannerData = null;
        let activeSubjectId = null;
        let activeSessionMins = 0;

        // Loaded lazily only when a section's planner is opened
        let holidaysData = [];
        let leaveRowsCache = [];
        let liveMasterRowsCache = null;
        let isDemoMode = false;
        let globalAutoLock = true;
        let enableDailyBlock = false;
        window.activeSyllabusTab = 'syllabus';

        const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        function getLocalTodayIso() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function parseJsonField(raw) {
            if (!raw) return {};
            if (typeof raw === 'object' && !Array.isArray(raw)) return raw;
            try { return JSON.parse(raw); } catch (_) { return {}; }
        }

        function isTruthyPermission(val) {
            if (val === true) return true;
            if (typeof val === 'string') {
                const s = val.trim().toLowerCase();
                return s !== '' && s !== 'false' && s !== '0' && s !== 'null' && s !== 'undefined';
            }
            return false;
        }

        function normalizePlannerRow(row) {
            const raw = parseJsonField(row.raw_data);
            const syllabusData = Array.isArray(row.syllabus_data) ? row.syllabus_data : (Array.isArray(row.syllabusData) ? row.syllabusData : (Array.isArray(raw.syllabusData) ? raw.syllabusData : []));
            const activityLogs = Array.isArray(row.activity_logs) ? row.activity_logs : (Array.isArray(row.activityLogs) ? row.activityLogs : (Array.isArray(raw.activityLogs) ? raw.activityLogs : []));
            const lockHistory = Array.isArray(row.lock_history) ? row.lock_history : (Array.isArray(row.lockHistory) ? row.lockHistory : (Array.isArray(raw.lockHistory) ? raw.lockHistory : []));

            return {
                id: row.firestore_id || row.id,
                dbId: row.id,
                branchId: row.branch_id,
                sessionId: row.session_id,
                syllabusData,
                activityLogs,
                lockHistory,
                isUnlocked: Boolean(row.is_unlocked ?? row.isUnlocked ?? raw.isUnlocked),
                unlockedAt: row.unlocked_at_ms ?? row.unlockedAt ?? raw.unlockedAt ?? null,
                unlockRequested: Boolean(row.unlock_requested ?? row.unlockRequested ?? raw.unlockRequested),
                requestedBy: row.requested_by ?? row.requestedBy ?? raw.requestedBy ?? '',
                lockedDate: row.locked_date ?? row.lockedDate ?? raw.lockedDate ?? null,
                lockReason: row.lock_reason ?? row.lockReason ?? raw.lockReason ?? '',
                lastSaveLog: row.last_save_log ?? row.lastSaveLog ?? raw.lastSaveLog ?? null
            };
        }

        function normalizeSlot(r) {
            return {
                id: r.id || ('slot_' + Math.random().toString(36).slice(2, 9)),
                day: r.day || '',
                className: r.class_name ?? r.className ?? '',
                section: r.section ?? r.section_name ?? r.sectionName ?? '',
                subject: r.subject ?? '',
                teacher: r.teacher ?? r.teacher_name ?? r.teacherName ?? '',
                teacherName: r.teacher_name ?? r.teacherName ?? r.teacher ?? '',
                teacherEmail: r.teacher_email ?? r.teacherEmail ?? '',
                start24: r.start24 ?? r.start_24 ?? '',
                end24: r.end24 ?? r.end_24 ?? '',
                timeRange: r.time_range ?? r.timeRange ?? '',
                duration: r.duration ?? '',
                remark: r.remark ?? ''
            };
        }

        async function bumpPlannerVersion() {
            if (!navigator.onLine || !activeBranchId) return;
            try {
                const nowMs = Date.now();
                const metaId = `planners_version_${activeBranchId}_${activeSessionId || 'default'}`;
                await sb.from("system_metadata").upsert([{
                    firestore_id: metaId,
                    branch_id: activeBranchId,
                    session_id: activeSessionId,
                    meta_key: "planners_version",
                    last_updated_ms: nowMs,
                    meta_value: { lastUpdated: nowMs },
                    updated_at: new Date().toISOString()
                }], { onConflict: 'firestore_id' });
            } catch (e) {
                console.warn("Failed to bump version", e);
            }
        }

        // Step 1: Resolve teacher's fixed branch and active session for today (no switching allowed)
        async function resolveFixedBranchAndSession(staffRow) {
            const todayIso = getLocalTodayIso();
            const [bRes, sRes] = await Promise.all([
                sb.from("branches").select("*").order("created_at", { ascending: true }),
                sb.from("branch_sessions").select("*").order("start_date", { ascending: false })
            ]);
            if (bRes.error) throw bRes.error;
            if (sRes.error) throw sRes.error;

            const branches = (bRes.data || []).filter(b => b.is_active !== false);
            const sessions = sRes.data || [];

            let detectedBranchName = "";
            let preferredBranchId = null;

            if (staffRow) {
                const det = parseJsonField(staffRow.details);
                if (staffRow.branch_id) preferredBranchId = staffRow.branch_id;
                const centerKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                if (centerKey) {
                    const rawCenter = String(det[centerKey]).trim().toUpperCase();
                    if (rawCenter.includes('DHARAMSHALA')) detectedBranchName = 'DHARAMSHALA';
                    else if (rawCenter.includes('GHUMARWIN')) detectedBranchName = 'GHUMARWIN';
                    else detectedBranchName = rawCenter;
                }
            }

            if (!preferredBranchId && !detectedBranchName) {
                preferredBranchId = sessionStorage.getItem('minervaAdminBranchId') || null;
                detectedBranchName = String(sessionStorage.getItem('minervaAdminCenter') || '').trim().toUpperCase();
            }

            const matchedBranch =
                (preferredBranchId ? branches.find(b => b.id === preferredBranchId) : null) ||
                (detectedBranchName ? branches.find(b => String(b.name || '').trim().toUpperCase().includes(detectedBranchName)) : null) ||
                branches[0] ||
                null;

            if (!matchedBranch) {
                throw new Error("No active branch found in Supabase.");
            }

            activeBranchId = matchedBranch.id;
            activeCenter = String(matchedBranch.name || '').trim().toUpperCase();

            const branchSessions = sessions.filter(s => s.branch_id === activeBranchId);
            const dateMatchedSession = branchSessions.find(s => {
                const startD = s.start_date ? String(s.start_date).slice(0, 10) : '';
                const endD = s.end_date ? String(s.end_date).slice(0, 10) : '';
                return startD && endD && todayIso >= startD && todayIso <= endD;
            });

            const chosenSession =
                dateMatchedSession ||
                branchSessions.find(s => s.is_active === true) ||
                branchSessions[0] ||
                null;

            activeSessionId = chosenSession ? chosenSession.id : null;
            activeSessionName = chosenSession ? (chosenSession.session_name || "2026 - 2027") : "2026 - 2027";

            document.getElementById('locked-branch-badge').innerText = `📍 Branch: ${matchedBranch.name}`;
            document.getElementById('locked-session-badge').innerText = `📅 Session: ${activeSessionName}`;

            const wm = document.createElement('div');
            wm.innerHTML = activeCenter;
            wm.className = "fixed inset-0 pointer-events-none flex items-center justify-center text-[10vw] font-black opacity-[0.03] text-slate-900 z-[1] tracking-widest uppercase overflow-hidden whitespace-nowrap";
            if (activeCenter.includes("DHARAMSHALA")) {
                document.querySelector('header').classList.replace('bg-[#1e1b4b]', 'bg-purple-950');
                document.querySelector('header').classList.replace('border-indigo-900', 'border-purple-800');
                document.body.style.backgroundColor = '#faf5ff';
                wm.classList.replace('text-slate-900', 'text-purple-900');
            }
            document.body.appendChild(wm);
        }

        function format12Hour(time24) {
            if (!time24) return "";
            const parts = String(time24).split(':');
            const hNum = Number(parts[0]);
            const mStr = parts[1] || '00';
            if (Number.isNaN(hNum)) return "";
            const ampm = hNum >= 12 ? 'PM' : 'AM';
            const h12 = hNum % 12 || 12;
            return `${String(h12).padStart(2, '0')}:${mStr} ${ampm}`;
        }

        function parseSlotTimes(slot) {
            let startTime = "00:00 AM", endTime = "00:00 AM";
            if (slot.start24 && slot.end24) {
                startTime = format12Hour(slot.start24);
                endTime = format12Hour(slot.end24);
            } else if (slot.timeRange) {
                const times = String(slot.timeRange).split(' - ');
                startTime = (times[0] || "00:00 AM").trim();
                endTime = (times[1] || "00:00 AM").trim();
            }
            let dur = parseInt(slot.duration) || 0;
            if (!dur && slot.start24 && slot.end24) {
                const [sh, sm] = String(slot.start24).split(':').map(Number);
                const [eh, em] = String(slot.end24).split(':').map(Number);
                const diff = (eh * 60 + em) - (sh * 60 + sm);
                if (diff > 0) dur = diff;
            }
            return { startTime, endTime, duration: dur };
        }

        // Fast initial load: branch + session -> today's timetable -> fallback to live master schedule -> section & subject
        async function loadFastTeacherClasses() {
            const grid = document.getElementById('classes-grid');
            grid.innerHTML = `<div class="col-span-full text-center py-24 text-slate-400 font-bold uppercase text-xs tracking-[0.2em]"><span class="loader mb-4"></span><br>Fetching Today's Timetable...</div>`;

            const todayIso = getLocalTodayIso();
            const todayName = DAYS_OF_WEEK[new Date().getDay()];
            const safeName = (activeStaff.name && activeStaff.name !== 'undefined') ? activeStaff.name.trim() : activeStaff.email.trim();
            const myNameMatch = safeName.toLowerCase();
            const myEmailMatch = String(activeStaff.email || '').trim().toLowerCase();

            const matchesTeacher = (slot) => {
                const tEmail = String(slot.teacherEmail || slot.teacher_email || '').trim().toLowerCase();
                if (tEmail && myEmailMatch && tEmail === myEmailMatch) return true;
                const tName = String(slot.teacherName || slot.teacher_name || slot.teacher || '').trim().toLowerCase();
                return tName && tName === myNameMatch;
            };

            try {
                // 1. Fetch today's timetable & today's active override in parallel
                let todayTtQ = sb.from("timetable")
                    .select("id, day, class_name, section, subject, teacher_name, teacher_email, start24, end24, time_range, duration, remark")
                    .eq("branch_id", activeBranchId)
                    .eq("day", todayName);
                let histQ = sb.from("timetable_history")
                    .select("day, schedule, status, type")
                    .eq("branch_id", activeBranchId)
                    .eq("date", todayIso);
                if (activeSessionId) {
                    todayTtQ = todayTtQ.eq("session_id", activeSessionId);
                    histQ = histQ.eq("session_id", activeSessionId);
                }

                const [todayTtRes, histRes] = await Promise.all([todayTtQ, histQ]);
                if (todayTtRes.error) throw todayTtRes.error;

                let candidateSlots = (todayTtRes.data || []).map(normalizeSlot);

                // Apply today's override if present
                const matchedHist = (histRes.data || []).find(h => h.status !== "CANCELLED" && Array.isArray(h.schedule) && h.schedule.length > 0);
                if (matchedHist) {
                    candidateSlots = matchedHist.schedule
                        .filter(s => !s.day || s.day === todayName)
                        .map(normalizeSlot);
                }

                let teacherSlots = candidateSlots.filter(s => (!s.day || s.day === todayName) && matchesTeacher(s));

                // 2. Fallback to live master schedule if no class found for today
                if (teacherSlots.length === 0) {
                    let masterQ = sb.from("timetable")
                        .select("id, day, class_name, section, subject, teacher_name, teacher_email, start24, end24, time_range, duration, remark")
                        .eq("branch_id", activeBranchId);
                    if (activeSessionId) masterQ = masterQ.eq("session_id", activeSessionId);

                    const { data: masterRows, error: mErr } = await masterQ;
                    if (mErr) throw mErr;

                    const normalizedMaster = (masterRows || []).map(normalizeSlot);
                    liveMasterRowsCache = normalizedMaster;

                    // Prefer master slots for today's day; if none for today, use teacher's master slots
                    const todayMaster = normalizedMaster.filter(s => s.day === todayName && matchesTeacher(s));
                    teacherSlots = todayMaster.length > 0 ? todayMaster : normalizedMaster.filter(matchesTeacher);
                }

                // 3. Fetch only institute_structure (section & subject IDs) for this branch & session
                let structQ = sb.from("institute_structure")
                    .select("id, firestore_id, class_name, section_name, subjects")
                    .eq("branch_id", activeBranchId);
                if (activeSessionId) structQ = structQ.eq("session_id", activeSessionId);

                const { data: structRows, error: sErr } = await structQ;
                if (sErr) throw sErr;

                const structures = (structRows || []).map(s => ({
                    dbId: s.id,
                    id: s.firestore_id || s.id,
                    className: s.class_name ?? s.className ?? '',
                    sectionName: s.section_name ?? s.sectionName ?? '',
                    subjects: Array.isArray(s.subjects) ? s.subjects : []
                }));

               const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                const seenSlots = new Set();

                mySessions = [];
                teacherSlots.forEach((slot, idx) => {
                    const { startTime, endTime, duration } = parseSlotTimes(slot);
                    const structMatch = structures.find(s =>
                        norm(s.className) === norm(slot.className) &&
                        norm(s.sectionName) === norm(slot.section)
                    );
                    const structId = structMatch ? structMatch.id : `${norm(slot.className)}_${norm(slot.section)}`;

                    let exactSub = slot.subject;
                    if (structMatch && structMatch.subjects.length) {
                        const found = structMatch.subjects.find(sub => norm(sub) === norm(slot.subject));
                        if (found) exactSub = found;
                    }

                    const plannerDocId = `${structId}_${exactSub}`.replace(/\s+/g, '_');
                    const dedupKey = `${norm(slot.className)}|${norm(slot.section)}|${norm(exactSub)}|${startTime}|${endTime}`;
                    if (seenSlots.has(dedupKey)) return;
                    seenSlots.add(dedupKey);

                    mySessions.push({
                        id: slot.id || `slot_${idx}`,
                        plannerDocId,
                        className: slot.className,
                        section: slot.section,
                        subject: exactSub,
                        start: startTime,
                        end: endTime,
                        duration,
                        remark: slot.remark || ''
                    });
                });
                renderClassesGrid();
            } catch (err) {
                console.error("Fast schedule load error:", err);
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-rose-500 font-bold uppercase text-[11px] tracking-widest">Error loading timetable: ${err.message}</div>`;
            }
        }

                            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg text-[9px] font-black tracking-widest uppercase border border-indigo-100 shrink-0">${sess.duration} Mins</span>
                        </div>
                        <div class="flex items-center flex-wrap gap-2 mt-1">

                        </div>

                            <span class="text-[9px] sm:text-[10px] font-black text-slate-500 uppercase tracking-widest">🕒 ${sess.start} - ${sess.end}</span>
                            <span class="bg-slate-100 group-hover:bg-blue-50 group-hover:text-blue-600 text-slate-500 px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-widest transition-colors">Open ➔</span>

        // Lazy-fetches ONLY the clicked section + teacher's subject planner when opened
        async function openSyllabusChecklist() {
            closeModal('mode-modal');
            document.getElementById('syll-class-title').innerText = document.getElementById('mode-class-title').innerText;
            document.getElementById('syll-session-badge').innerText = `Allocating Session: ${activeSessionMins} Mins • ${activeSessionName}`;

            if (isDemoMode) {
                currentPlannerData = getMockSyllabus();

                renderSyllabusExactMath();
                return;
            }

            try {
                let pQuery = sb.from("lesson_planners")
                    .select("*")
                    .eq("branch_id", activeBranchId)
                    .eq("firestore_id", activeSubjectId);
                let aQuery = sb.from("lesson_planner_assignments")
                    .select("*")
                    .eq("branch_id", activeBranchId)
                    .eq("firestore_id", activeSubjectId);
                let holQuery = sb.from("school_holidays")
                    .select("*")
                    .eq("branch_id", activeBranchId);

                    .select("*")
                    .eq("branch_id", activeBranchId);

                    .select("*")
                    .eq("branch_id", activeBranchId);

                if (activeSessionId) {
                    pQuery = pQuery.eq("session_id", activeSessionId);
                    aQuery = aQuery.eq("session_id", activeSessionId);
                    holQuery = holQuery.eq("session_id", activeSessionId);
                    leaveQuery = leaveQuery.eq("session_id", activeSessionId);
                    metaQuery = metaQuery.eq("session_id", activeSessionId);

                const [pRes, aRes, holRes, leaveRes, metaRes] = await Promise.all([
                    pQuery.limit(1),
                    aQuery.limit(1),
                    holQuery,
                    leaveQuery,
                    metaQuery
                ]);

                if (pRes.error) throw pRes.error;

                let plannerRow = (pRes.data && pRes.data[0]) ? pRes.data[0] : null;
                if (!plannerRow) {
                    const { data: fallbackRows } = await sb.from("lesson_planners")
                        .select("*")
                        .eq("branch_id", activeBranchId)
                        .eq("firestore_id", activeSubjectId)
                        .limit(1);
                    plannerRow = (fallbackRows && fallbackRows[0]) ? fallbackRows[0] : null;
                }

                const assignRow = (aRes.data && aRes.data[0]) ? aRes.data[0] : null;
                window.currentAssignment = assignRow ? {
                    ...parseJsonField(assignRow.raw_data),
                    ...assignRow,
                    targetDate: assignRow.target_date ?? assignRow.targetDate ?? ''
                } : {};

                holidaysData = (holRes.data || []).map(h => ({
                    ...h,
                    startDate: h.start_date ?? h.startDate,
                    endDate: h.end_date ?? h.endDate ?? h.start_date ?? h.startDate,
                    isFullDay: h.is_full_day ?? h.isFullDay ?? true,
                    startTime: h.start_time ?? h.startTime,
                    endTime: h.end_time ?? h.endTime,
                    suspendClasses: h.suspend_classes ?? h.suspendClasses ?? true,
                    targetClasses: Array.isArray(h.target_classes) ? h.target_classes : (Array.isArray(h.targetClasses) ? h.targetClasses : ['ALL'])
                }));

                leaveRowsCache = leaveRes.data || [];

                globalAutoLock = true;
                enableDailyBlock = false;
                const settingsMeta = (metaRes.data || []).find(m =>
                    m.meta_key === 'lesson_planner_settings' ||
                    String(m.firestore_id || '').includes('lesson_planner_settings')
                );
                if (settingsMeta) {
                    const mv = parseJsonField(settingsMeta.meta_value);
                    if (mv.autoLockEnabled === false) globalAutoLock = false;
                    if (mv.dailyComplianceBlockEnabled === true) enableDailyBlock = true;
                }

                const normalizedPlanner = plannerRow ? normalizePlannerRow(plannerRow) : null;

                if (!normalizedPlanner || !normalizedPlanner.syllabusData || normalizedPlanner.syllabusData.length === 0) {
                    document.getElementById('subject-pace-widget').innerHTML = '';
                    const reqBtn = document.getElementById('request-unlock-btn');
                    const confBtn = document.getElementById('confirm-day-btn');
                    const tabs = document.getElementById('tracker-tabs');

                    if (confBtn) confBtn.style.display = 'none';

                    return container.innerHTML = `
                        <div class="text-center py-20 text-rose-500 font-black uppercase text-xs tracking-widest">
                            Syllabus Not Defined by Admin
                            <br><br>
                            <span class="text-[9px] text-slate-400 normal-case tracking-normal">Please ask the Admin to upload the syllabus for this subject.</span>
                        </div>`;
                }

                document.getElementById('tracker-tabs').style.display = 'flex';
                currentPlannerData = normalizedPlanner.syllabusData;
                window.currentActivityLogs = normalizedPlanner.activityLogs || [];
                window.currentLockHistory = normalizedPlanner.lockHistory || [];

                window.isSubjectUnlocked = normalizedPlanner.isUnlocked === true;
                if (window.isSubjectUnlocked && normalizedPlanner.unlockedAt) {
                    const hoursSinceUnlock = (Date.now() - normalizedPlanner.unlockedAt) / (1000 * 60 * 60);
                    if (hoursSinceUnlock >= 24) {
                        window.isSubjectUnlocked = false;
                        await sb.from("lesson_planners")
                            .update({ is_unlocked: false, unlocked_at_ms: null, updated_at: new Date().toISOString() })
                            .eq("branch_id", activeBranchId)
                            .eq("firestore_id", activeSubjectId);
                    }
                }
                window.unlockRequested = normalizedPlanner.unlockRequested === true;
                window.lockedDateStr = normalizedPlanner.lockedDate || null;

                const currSession = mySessions.find(s => s.plannerDocId === activeSubjectId) || {};
                const cName = currSession.className || "";
                const sName = currSession.section || "";
                const subName = currSession.subject || "";

                const todayObjForCheck = new Date();
                todayObjForCheck.setHours(0, 0, 0, 0);
                const todayExclusion = checkDateExclusion(todayObjForCheck, cName, sName, subName);
                if (todayExclusion.isExcluded && todayExclusion.reason !== "Class Not Scheduled") {
                    window.activeReadOnlyReason = todayExclusion.reason;
                }

                let lastLoggedDateStr = null;
                currentPlannerData.forEach(r => {
                    if (r.chapterStartDate && (!lastLoggedDateStr || r.chapterStartDate > lastLoggedDateStr)) lastLoggedDateStr = r.chapterStartDate;
                    if (r.isDone && r.completedDate && (!lastLoggedDateStr || r.completedDate > lastLoggedDateStr)) lastLoggedDateStr = r.completedDate;
                });
                if (window.currentActivityLogs) {
                    window.currentActivityLogs.forEach(log => {
                        const lDate = String(log.date || '').split('T')[0];
                        if (lDate && (!lastLoggedDateStr || lDate > lastLoggedDateStr)) lastLoggedDateStr = lDate;
                    });
                }

                const todayISO = getLocalTodayIso();
                let scanStartDate = new Date(todayISO + "T00:00:00");
                if (lastLoggedDateStr) {
                    scanStartDate = new Date(lastLoggedDateStr + "T00:00:00");
                    scanStartDate.setDate(scanStartDate.getDate() + 1);
                } else {
                    scanStartDate.setDate(scanStartDate.getDate() - 14);
                }

                const myEmailMatch = String(activeStaff.email || '').trim().toLowerCase();
                const normStr = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                const myAbsences = [];

                leaveRowsCache.forEach(rawLeave => {
                    const rawObj = parseJsonField(rawLeave.raw_data);
                    const leaveData = {
                        ...rawObj,
                        ...rawLeave,
                        adjustments: Array.isArray(rawLeave.adjustments) && rawLeave.adjustments.length > 0
                            ? rawLeave.adjustments
                            : (Array.isArray(rawObj.adjustments) ? rawObj.adjustments : [])
                    };
                    if (leaveData.status === "APPROVED" && String(leaveData.teacher_email ?? leaveData.teacherEmail ?? '').toLowerCase() === myEmailMatch) {
                        const sDate = leaveData.start_date ?? leaveData.startDate;
                        const eDate = leaveData.end_date ?? leaveData.endDate ?? sDate;
                        if (leaveData.type === 'FULL' && sDate) {
                            let cur = new Date(sDate + "T00:00:00");
                            const end = new Date(eDate + "T00:00:00");
                            while (cur <= end) {
                                myAbsences.push({ date: cur.toISOString().split('T')[0], isFullDay: true });
                                cur.setDate(cur.getDate() + 1);

                        } else if (leaveData.adjustments.length > 0) {
                            leaveData.adjustments.forEach(adj => {
                                const cNameAdj = adj.className || (adj.sub ? String(adj.sub).split('|')[0].trim() : "");
                                const sNameAdj = adj.section || (adj.sub && String(adj.sub).split('|')[1] ? String(adj.sub).split('|')[1].replace(/sec/gi, '').trim() : "");
                                myAbsences.push({
                                    date: adj.date || adj.leaveDate || '',
                                    isFullDay: false,
                                    className: cNameAdj,
                                    section: sNameAdj,
                                    subject: adj.title || adj.subject || ''
                                });
                            });
                        }
                    }
                });

                if (!liveMasterRowsCache) {
                    let ttFallbackQ = sb.from("timetable")
                        .select("id, day, class_name, section, subject, teacher_name, teacher_email, start24, end24, time_range, duration, remark")
                        .eq("branch_id", activeBranchId);
                    if (activeSessionId) ttFallbackQ = ttFallbackQ.eq("session_id", activeSessionId);
                    const { data: ttFallbackRows } = await ttFallbackQ;
                    liveMasterRowsCache = (ttFallbackRows || []).map(normalizeSlot);
                }

                window.catchUpDates = [];
                let iterDate = new Date(scanStartDate);
                const endD = new Date(todayISO + "T00:00:00");
                let revHtml = "";
                const dArr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

                while (iterDate <= endD) {
                    const curStr = iterDate.toISOString().split('T')[0];
                    const dayName = dArr[iterDate.getDay()];
                    const shortDate = iterDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
                    const exclusion = checkDateExclusion(iterDate, cName, sName, subName);
                    const wasOnLeave = myAbsences.some(a => {
                        if (a.date !== curStr) return false;
                        if (a.isFullDay) return true;
                        return normStr(a.className) === normStr(cName) &&
                            normStr(a.section) === normStr(sName) &&
                            normStr(a.subject) === normStr(subName);
                    });

                    let isWorkingDay = false;
                    let reason = "";
                    const mins = activeSessionMins;

                    if (wasOnLeave) {

                        revHtml += `
                            <div class="bg-white border ${alreadyLogged ? 'border-blue-200' : 'border-amber-200'} rounded-xl p-3 shadow-sm transition-all">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-black ${alreadyLogged ? 'text-blue-700 bg-blue-50 border-blue-100' : 'text-amber-700 bg-amber-50 border-amber-100'} uppercase tracking-widest px-2 py-1 rounded border">${shortDate} (${dayName})</span>
                                    <div class="flex items-center gap-2">
                                        ${alreadyLogged ? `<span class="text-[8px] font-bold text-blue-500 uppercase">Logged</span>` : `<span class="text-[8px] font-black text-rose-500 uppercase animate-pulse">🔴 Pending</span>`}
                                        <span class="text-[9px] font-bold text-emerald-600 uppercase bg-emerald-50 px-2 py-0.5 rounded shadow-sm border border-emerald-100">🟢 ${mins} Mins</span>
                                    </div>
                                </div>
                                <textarea class="batch-rev-input w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs font-bold text-slate-700 outline-none focus:border-amber-500 focus:bg-white resize-none h-14 placeholder-slate-300 transition-all" placeholder="Optional details (leave blank to skip)..." data-date="${curStr}" data-mins="${mins}"></textarea>
                            </div>`;
                    } else {
                        revHtml += `
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 opacity-60 pointer-events-none">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">${shortDate} (${dayName})</span>
                                    <span class="text-[9px] font-bold text-slate-500 uppercase">⏸️ ${reason} (Auto-Exempt)</span>
                                </div>
                            </div>`;
                    }
                    iterDate.setDate(iterDate.getDate() + 1);
                }

                const revContainer = document.getElementById('revision-batch-container');
                if (revContainer) revContainer.innerHTML = revHtml || `<div class="text-center text-[10px] font-bold text-slate-400 p-4">No pending dates to log.</div>`;

                const unloggedPastDays = window.catchUpDates.filter(d => d.date < todayISO && d.date !== lastLoggedDateStr);
                window.complianceLocked = enableDailyBlock ? (unloggedPastDays.length > 2) : false;
                window.lwdDateStr = unloggedPastDays.length > 0 ? unloggedPastDays[0].date : todayISO;

                const reqBtn = document.getElementById('request-unlock-btn');
                const confBtn = document.getElementById('confirm-day-btn');

                if (window.activeReadOnlyReason) {
                    window.complianceLocked = true;
                    reqBtn.innerText = "🔒 VIEW ONLY: " + window.activeReadOnlyReason;
                    reqBtn.className = "w-full bg-slate-100 text-slate-600 font-black py-3 rounded-xl uppercase tracking-widest text-[10px] border border-slate-200 cursor-default";
                    reqBtn.disabled = true;
                    reqBtn.style.display = 'block';
                    if (confBtn) confBtn.style.display = 'none';
                } else if (window.isSubjectUnlocked || !globalAutoLock) {
                    reqBtn.innerText = "🔓 Unlocked! You can make corrections.";
                    reqBtn.className = "w-full bg-emerald-50 text-emerald-600 font-black py-3 rounded-xl uppercase tracking-widest text-[10px] border border-emerald-200 cursor-default";
                    reqBtn.disabled = true;
                    reqBtn.style.display = 'block';
                    if (confBtn) confBtn.style.display = 'block';
                } else if (window.complianceLocked || window.unlockRequested) {
                    reqBtn.disabled = true;
                    reqBtn.style.display = 'block';
                    if (confBtn) confBtn.style.display = 'none';

                    if (window.unlockRequested) {
                        const displayDate = window.lockedDateStr || window.lwdDateStr || "Unknown Date";
                        reqBtn.innerText = "Unlock Requested for " + displayDate + " ⏳";
                        reqBtn.className = "w-full bg-amber-50 text-amber-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-amber-200 cursor-not-allowed";
                    } else {
                        reqBtn.innerText = "System Locked - Auto-Notifying Admin... ⏳";
                        reqBtn.className = "w-full bg-rose-600 text-white font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] shadow-lg animate-pulse cursor-not-allowed";

                    reqBtn.innerText = "Made a Mistake? Request Admin Unlock";

                    reqBtn.style.display = 'block';
