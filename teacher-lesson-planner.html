                console.error(e);
                container.innerHTML = `<div class="text-center py-20 text-rose-500 font-black uppercase text-xs tracking-widest">Error loading syllabus: ${e.message}</div>`;
            }
        }

        function checkDateExclusion(dateObj, className, sectionName, subjectName) {
            if (dateObj.getDay() === 0) return { isExcluded: true, reason: "Sunday (Weekly Off)" };
            const offset = dateObj.getTimezoneOffset() * 60000;
            const curStr = (new Date(dateObj.getTime() - offset)).toISOString().split('T')[0];
            const checkDate = new Date(curStr); checkDate.setHours(0, 0, 0, 0);
            const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            const dayName = DAYS_OF_WEEK[dateObj.getDay()];

            for (let h of holidaysData) {
                if (!h.startDate || h.suspendClasses === false) continue;
                const hStart = new Date(h.startDate); hStart.setHours(0, 0, 0, 0);
                const hEnd = new Date(h.endDate || h.startDate); hEnd.setHours(23, 59, 59, 999);
                if (checkDate >= hStart && checkDate <= hEnd) {
                    const targetCls = `${norm(className)}|${norm(sectionName)}`;
                    const matchesClass = (h.targetClasses || []).some(tc => {
                        if (tc === 'ALL') return true;
                        const parts = String(tc).split('|');
                        const tcNorm = norm(parts[0]) + (parts[1] ? '|' + norm(parts[1]) : '');
                        return parts.length > 1 ? tcNorm === targetCls : norm(parts[0]) === norm(className);
                    });
                    if (matchesClass) {
                        if (h.isFullDay) {
                            return { isExcluded: true, reason: h.reason || "Holiday" };
                        } else if (h.startTime && h.endTime) {
                            const sourceSlots = liveMasterRowsCache || mySessions;
                            const classSlots = sourceSlots.filter(t =>
                                (!t.day || t.day === dayName) &&
                                norm(t.className) === norm(className) &&
                                norm(t.section) === norm(sectionName) &&
                                norm(t.subject) === norm(subjectName)
                            );
                            if (classSlots.length > 0) {
                                const [hsh, hsm] = String(h.startTime).split(':').map(Number);
                                const [heh, hem] = String(h.endTime).split(':').map(Number);
                                const hStartMins = hsh * 60 + hsm;
                                const hEndMins = heh * 60 + hem;

                                const isOverlapping = classSlots.some(slot => {
                                    if (slot.start24 && slot.end24) {
                                        const [sh, sm] = String(slot.start24).split(':').map(Number);
                                        const [eh, em] = String(slot.end24).split(':').map(Number);
                                        return ((sh * 60 + sm) < hEndMins && (eh * 60 + em) > hStartMins);
                                    }
                                    return false;
                                });
                                if (isOverlapping) {
                                    return { isExcluded: true, reason: (h.reason || "Holiday") + " (Half Day)" };
                                }
                            }
                        }
                    }
                }
            }

            const sourceSlots = liveMasterRowsCache || mySessions;
            const doubtSlot = sourceSlots.find(t =>
                (!t.day || t.day === dayName) &&
                norm(t.className) === norm(className) &&
                norm(t.section) === norm(sectionName) &&
                norm(t.subject) === norm(subjectName) &&
                t.remark && String(t.remark).toLowerCase().includes("doubt session")
            );
            if (doubtSlot) {
                return { isExcluded: true, reason: "Doubt Session" };
            }

            return { isExcluded: false, reason: "" };
        }

        function isTimetableWorkingDay(dateObj, className, sectionName, subjectName) {
            if (dateObj.getDay() === 0) return false;
            const dayName = DAYS_OF_WEEK[dateObj.getDay()];
            const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            const sourceSlots = liveMasterRowsCache || mySessions;
            return sourceSlots.some(t =>
                (!t.day || t.day === dayName) &&
                norm(t.className) === norm(className) &&
                norm(t.section) === norm(sectionName) &&
                norm(t.subject) === norm(subjectName)
            );
        }

        function formatDateString(iso) {
            if (!iso) return '--';
            const [y, m, d] = String(iso).split('-');
            const dObj = new Date(y, (m || 1) - 1, d || 1);
            return dObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        }

        function renderSyllabusExactMath() {
            const currSession = mySessions.find(s => s.plannerDocId === activeSubjectId) || {};
            const cName = currSession.className || "";
            const sName = currSession.section || "";
            const subName = currSession.subject || "";

            const chNamesList = [...new Set(currentPlannerData.map(r => r["CHAPTER NAME"]))];
            const totalChapters = chNamesList.length;
            let completedChapters = 0;
            chNamesList.forEach(ch => {
                const rws = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                if (rws.length > 0 && rws.every(r => r.isDone)) completedChapters++;
            });
            const progressPct = totalChapters === 0 ? 0 : Math.round((completedChapters / totalChapters) * 100);

            let totalTargetMinsAll = 0;
            let totalSyllabusCoveredMins = 0;
            let firstStartDate = null;
            const standardClassDuration = parseInt(currentPlannerData[0]?.['Standard Class Duration']) || activeSessionMins;

            const chMap = new Map();
            currentPlannerData.forEach(r => {
                if (!chMap.has(r['CHAPTER NAME'])) {
                    chMap.set(r['CHAPTER NAME'], {
                        days: parseInt(r['Target days for chapter']) || 0,
                        mins: parseInt(r['Target Minutes For Chapter']) || 0
                    });
                }
            });
            chMap.forEach(v => { totalTargetMinsAll += v.mins; });

            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = '';
            let htmlContent = "";
            let subjectExclusionsHtml = "";

            let firstStartStr = null;
            currentPlannerData.forEach(r => {
                if (r.chapterStartDate && (!firstStartStr || r.chapterStartDate < firstStartStr)) {
                    firstStartStr = r.chapterStartDate;
                }
            });

            if (firstStartStr && !isDemoMode) {
                const stDate = new Date(firstStartStr + "T00:00:00");
                const endDate = new Date();
                endDate.setHours(23, 59, 59, 999);
                const exList = [];
                let count = 1;
                let calendarDays = 0;

                const iterDate = new Date(stDate);
                while (iterDate <= endDate) {
                    calendarDays++;
                    const exc = checkDateExclusion(iterDate, cName, sName, subName);
                    if (exc.isExcluded) {
                        exList.push({
                            sno: count++,
                            date: iterDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
                            reason: exc.reason
                        });
                    }
                    iterDate.setDate(iterDate.getDate() + 1);
                }

                const workingDays = calendarDays - exList.length;
                const listHtml = exList.length > 0
                    ? exList.map(x => `
                        <div class="flex justify-between items-center bg-white p-3 sm:p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                            <div class="flex items-center gap-3 sm:gap-4">
                                <span class="text-[10px] sm:text-[11px] font-black bg-rose-100 text-rose-700 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg w-8 text-center border border-rose-200 shadow-sm">${x.sno}</span>
                                <span class="text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-widest">${x.date}</span>
                            </div>
                            <span class="text-[9px] sm:text-[10px] font-black uppercase text-rose-500 tracking-widest text-right max-w-[50%] sm:max-w-[60%] truncate" title="${x.reason}">${x.reason}</span>
                        </div>
                    `).join('')
                    : `<div class="p-4 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest bg-white">No excluded days found.</div>`;

                subjectExclusionsHtml = `
                    <details class="bg-rose-50/30 rounded-[1.5rem] sm:rounded-[2rem] border border-rose-100 shadow-sm overflow-hidden mb-6 group/excl">
                        <summary class="p-4 sm:p-5 font-black text-rose-800 text-xs sm:text-sm uppercase tracking-widest cursor-pointer outline-none flex flex-wrap justify-between items-center gap-2 select-none hover:bg-rose-50 transition-colors">
                            <div class="flex items-center gap-2 sm:gap-3">
                                <span class="text-lg sm:text-xl">📅</span>
                                <span>Academic Days Audit</span>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 text-[9px] sm:text-[10px] font-black">
                                <span class="px-3 py-1 rounded-full bg-blue-100 text-blue-700 border border-blue-200">${calendarDays} Calendar</span>
                                <span class="px-3 py-1 rounded-full bg-rose-100 text-rose-700 border border-rose-200">${exList.length} Excluded</span>
                                <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200">${workingDays} Working</span>
                            </div>
                        </summary>
                        <div class="bg-rose-50/50 border-t border-rose-100 max-h-64 overflow-y-auto custom-scroll">
                            ${listHtml}
                        </div>
                    </details>`;
            }

            chNamesList.forEach(ch => {
                const rows = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                const doneR = rows.filter(r => r.isDone);
                const isStarted = Boolean(rows[0]?.chapterStartDate || doneR.length > 0);
                const isCompleted = doneR.length === rows.length && rows.length > 0;
                const targetDays = parseInt(rows[0]?.['Target days for chapter']) || 0;
                const targetMins = parseInt(rows[0]?.['Target Minutes For Chapter']) || 0;

                if (isCompleted) {
                    totalSyllabusCoveredMins += targetMins;
                } else {
                    doneR.forEach(r => { totalSyllabusCoveredMins += parseFloat(r.completedMinutes) || 0; });
                }

                const chStartStr = rows[0]?.chapterStartDate || null;
                const chStart = chStartStr ? new Date(chStartStr) : null;
                if (chStart && (!firstStartDate || chStart < firstStartDate)) firstStartDate = chStart;

                const compDates = doneR.map(r => new Date(r.completedDate)).filter(d => !Number.isNaN(d.getTime()));
                const chEnd = (isCompleted && compDates.length) ? new Date(Math.max(...compDates)) : null;

                const badge = isCompleted
                    ? `<span class="bg-emerald-500 text-white px-3 py-1 rounded-md text-[9px] font-black uppercase">✓ COMPLETED</span>`
                    : (isStarted
                        ? `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-md text-[9px] font-black uppercase">ONGOING</span>`
                        : `<span class="bg-slate-200 text-slate-600 px-3 py-1 rounded-md text-[9px] font-black uppercase">PENDING</span>`);

               const isLocked = window.activeReadOnlyReason ? true : ((!window.isSubjectUnlocked && globalAutoLock) && (isCompleted || window.complianceLocked || window.unlockRequested));
                const blockInteract = (!isStarted || isLocked) ? 'opacity-50 pointer-events-none' : '';
                const safeChName = String(ch).replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const domSafeCh = String(ch).replace(/[^a-zA-Z0-9]/g, '');

                let contentHTML = '';
                if (!isStarted) {
                    if (isLocked) {
                        contentHTML += `<div class="p-6 text-center bg-rose-50/50 border-t border-slate-200"><p class="text-[10px] font-black text-rose-600 uppercase tracking-widest">Chapter Locked</p></div>`;
                    } else {
                        const todayISO = getLocalTodayIso();
                        const startOptions = window.catchUpDates && window.catchUpDates.length > 0
                            ? window.catchUpDates.map(d => `<option value="${d.date}">${d.label}</option>`).join('')
                            : `<option value="${todayISO}">Today (${todayISO})</option>`;
                        contentHTML += `
                            <div class="p-6 text-center bg-blue-50/50 border-t border-slate-200">
                                <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-3">Chapter topics are locked until chapter is started</p>
                                <div class="flex flex-col sm:flex-row justify-center items-center gap-3">
                                    <select id="start-date-${domSafeCh}" class="text-[11px] p-2.5 border border-blue-300 rounded-xl outline-none font-bold text-slate-700 bg-white">${startOptions}</select>
                                    <button onclick="startChapter('${safeChName}', document.getElementById('start-date-${domSafeCh}').value)" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-black uppercase text-[11px] tracking-widest shadow-lg hover:bg-blue-700">▶ Start Chapter</button>
                                </div>
                            </div>`;
                    }
                }

                const timelineEvents = [];

                rows.forEach(r => {
                    const absIdx = currentPlannerData.indexOf(r);
                    const safeLec = r['LECTURE NUMBER'] != null ? String(r['LECTURE NUMBER']).padStart(4, '0') : '0000';
                    const displayLec = r['LECTURE NUMBER'] || '--';

                    if (r.isDone && r.completedDate) {
                        timelineEvents.push({
                            sortKey: String(r.completedDate) + "_1_" + safeLec,
                            html: `
                                <div class="flex items-center justify-between p-4 bg-white border-b border-slate-100">
                                    <div class="pr-4">
                                        <div class="text-sm font-bold text-slate-800 leading-tight">${r['SUBTOPICS']}</div>
                                        <div class="text-[10px] font-black text-emerald-600 uppercase mt-1 tracking-widest">Lecture ${displayLec} • ${formatDateString(r.completedDate)}</div>
                                    </div>
                                    <div id="tick-container-${absIdx}">
                                        ${window.isSubjectUnlocked
                                            ? `<input type="checkbox" class="topic-cb w-5 h-5 accent-blue-600 cursor-pointer" data-idx="${absIdx}" checked onchange="previewUntick(this, ${absIdx})">`
                                            : `<div class="text-right"><span class="text-emerald-500 font-black text-[10px] uppercase">✓ LOGGED</span><p class="text-[9px] font-bold text-slate-400 mt-1 uppercase">${Math.floor(parseFloat(r.completedMinutes) || 0)} Mins</p></div>`}
                                    </div>
                                </div>`
                        });
                    } else {
                        const lockState = (!isStarted || isLocked) ? 'disabled class="topic-cb w-5 h-5 accent-slate-300 cursor-not-allowed opacity-50"' : 'class="topic-cb w-5 h-5 accent-blue-600 cursor-pointer"';
                        timelineEvents.push({
                            sortKey: "9999-12-31_1_" + safeLec,
                            html: `
                                <div class="flex items-center justify-between p-4 bg-white border-b border-slate-100">
                                    <div class="pr-4">
                                        <div class="text-sm font-bold text-slate-400 uppercase tracking-tight leading-tight">${r['SUBTOPICS']}</div>
                                        <div class="text-[10px] font-black text-slate-400 uppercase mt-1 tracking-widest">Lecture ${displayLec}</div>
                                    </div>
                                    <div id="tick-container-${absIdx}">
                                        <input type="checkbox" data-idx="${absIdx}" onchange="previewTick(this, ${absIdx})" ${lockState}>
                                    </div>
                                </div>`
                        });
                    }
                });

                if (window.currentActivityLogs && chStart) {
                    const cEndD = chEnd ? new Date(chEnd) : new Date();
                    cEndD.setHours(23, 59, 59, 999);
                    window.currentActivityLogs.forEach(log => {
                        const logIso = String(log.date || '').split('T')[0];
                        if (!logIso) return;
                        const logD = new Date(logIso + "T12:00:00");
                        if (logD >= chStart && logD <= cEndD) {
                            timelineEvents.push({
                                sortKey: logIso + "_2_0000",
                                html: `
                                    <div class="flex justify-between items-center bg-amber-50/40 p-4 border-b border-amber-100/50">
                                        <div class="flex gap-4 items-center">
                                            <span class="text-[9px] font-black text-amber-600 bg-white border border-amber-200 px-2.5 py-1 rounded-md shadow-sm uppercase">${formatDateString(logIso)}</span>
                                            <div>
                                                <div class="text-xs font-bold text-amber-900 uppercase leading-snug">🎯 Activity: ${log.reason}</div>
                                                <div class="text-[8px] text-slate-400 font-bold uppercase mt-0.5">Logged By: ${log.loggedBy}</div>
                                            </div>
                                        </div>
                                        <div class="text-[10px] font-black text-amber-700 bg-white border border-amber-200 px-3 py-1 rounded-xl shadow-sm">${Math.floor(log.minutes)} Mins</div>
                                    </div>`
                            });
                        }
                    });
                }

                if (chStart) {
                    const scanDate = new Date(chStart.getFullYear(), chStart.getMonth(), chStart.getDate());
                    const finalLimitDate = chEnd ? new Date(chEnd.getFullYear(), chEnd.getMonth(), chEnd.getDate()) : new Date();
                    finalLimitDate.setHours(23, 59, 59, 999);

                    while (scanDate <= finalLimitDate) {
                        const scanIso = scanDate.getFullYear() + '-' + String(scanDate.getMonth() + 1).padStart(2, '0') + '-' + String(scanDate.getDate()).padStart(2, '0');
                        const exclusion = checkDateExclusion(scanDate, cName, sName, subName);
                        if (exclusion.isExcluded) {
                            timelineEvents.push({
                                sortKey: scanIso + "_0_0000",
                                html: `
                                    <div class="flex items-center gap-4 p-3 bg-rose-50/40 text-rose-700 border-b border-rose-100 text-xs font-bold uppercase tracking-widest pl-6">
                                        <span class="bg-white border border-rose-200 text-rose-600 text-[9px] font-black px-2.5 py-1 rounded-md shadow-sm">${formatDateString(scanIso)}</span>
                                        <span class="text-rose-500 font-black">🛑 EXCLUDED DAY:</span> ${exclusion.reason}
                                    </div>`
                            });
                        }
                        scanDate.setDate(scanDate.getDate() + 1);
                    }
                }

                timelineEvents.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
                contentHTML += `<div class="${blockInteract} bg-white border-t border-slate-100 divide-y divide-slate-100">${timelineEvents.map(e => e.html).join('')}</div>`;

                htmlContent += `
                    <details class="bg-[#f8f9fa] border border-slate-200 rounded-xl mb-4 overflow-hidden shadow-sm group" ${isStarted && !isCompleted ? 'open' : ''}>
                        <summary class="bg-slate-50 text-slate-800 p-4 flex justify-between items-center cursor-pointer select-none outline-none">
                            <div>
                                <span class="font-black text-base uppercase tracking-tight text-slate-900">${ch} <span class="text-sm ml-2 text-slate-500 font-bold">(${Math.round((doneR.length / (rows.length || 1)) * 100)}%)</span></span>
                                <div class="flex gap-4 mt-1 text-[9px] font-bold text-slate-400 uppercase items-center"><span>Target: ${targetDays} Days / ${targetMins}m</span></div>
                            </div>
                            ${badge}
                        </summary>
                        <div class="grid grid-cols-2 bg-white text-[11px] font-black text-slate-500 text-center border-y uppercase">
                            <div class="p-3 border-r border-slate-100"><span class="text-[8px] text-slate-400 block">Start Date</span><span class="text-slate-900 font-bold">${chStart ? chStart.toLocaleDateString('en-GB') : '--'}</span></div>
                            <div class="p-3"><span class="text-[8px] text-slate-400 block">End Date</span><span class="text-slate-900 font-bold">${(isCompleted && chEnd) ? chEnd.toLocaleDateString('en-GB') : '--'}</span></div>
                        </div>
                        ${contentHTML}
                    </details>`;
            });

            const minsLeft = Math.max(0, totalTargetMinsAll - totalSyllabusCoveredMins);
            const classesLeft = standardClassDuration > 0 ? Math.ceil(minsLeft / standardClassDuration) : 0;
            const targetDateFormatted = window.currentAssignment?.targetDate ? new Date(window.currentAssignment.targetDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Not Set';
            const firstStartFormatted = firstStartDate ? new Date(firstStartDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Not Started';

            const paceWidget = document.getElementById('subject-pace-widget');
            if (paceWidget) {
                paceWidget.className = "bg-[#fdfefe] border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm";
                paceWidget.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <b class='text-slate-800 text-sm uppercase tracking-widest'>${cName} • ${sName} • ${subName}</b>
                    </div>
                    <div class='text-[10px] sm:text-[11px] mt-2 font-black text-emerald-600 uppercase tracking-widest'>Total Chapters Completed (${completedChapters} out of ${totalChapters} Chapters) - ${progressPct}%</div>
                    <div class='w-full bg-slate-100 h-2 rounded-full mt-2 mb-4 overflow-hidden'><div style='width: ${progressPct}%;' class='bg-emerald-500 h-full'></div></div>
                    <div class="flex flex-wrap gap-3 text-[10px] font-bold text-slate-600 uppercase">
                        <span class="bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">Start: <b class="text-blue-600">${firstStartFormatted}</b></span>
                        <span class="bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">Target End: <b class="text-rose-600">${targetDateFormatted}</b></span>
                        <span class="bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">Covered: <b class="text-emerald-600">${totalSyllabusCoveredMins} Mins</b></span>
                        <span class="bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200">Remaining: <b class="text-rose-600">${minsLeft} Mins (~${classesLeft} Classes)</b></span>
                    </div>`;
            }

            container.innerHTML = subjectExclusionsHtml + htmlContent;
        }

        function previewTick(cb, idx) {
            if (!cb.checked) return;
            const todayISO = getLocalTodayIso();
            const safeName = (activeStaff.name && activeStaff.name !== 'undefined') ? activeStaff.name : activeStaff.email;
            const chStartDate = currentPlannerData[idx].chapterStartDate;
            const validDates = window.catchUpDates ? window.catchUpDates.filter(d => !chStartDate || d.date >= chStartDate) : [];
            const initialDate = validDates.length > 0 ? validDates[0].date : todayISO;

            if (chStartDate && initialDate < chStartDate) {
                alert(`⚠️ Cannot log topic on ${initialDate} before chapter start date (${chStartDate}).`);
                cb.checked = false;
                return;
            }

            currentPlannerData[idx].isDone = true;
            currentPlannerData[idx].completedDate = initialDate;
            currentPlannerData[idx].completedMinutes = validDates.length > 0 ? validDates[0].mins : activeSessionMins;
            currentPlannerData[idx].tickedBy = safeName;
            currentPlannerData[idx].savedToDb = false;

            const availableDates = window.catchUpDates && window.catchUpDates.length > 0 ? window.catchUpDates : validDates;
            const dateOptions = availableDates.map(d => `<option value="${d.date}" data-mins="${d.mins}" ${d.date === initialDate ? 'selected' : ''}>${d.label}</option>`).join('') || `<option value="${todayISO}" data-mins="${activeSessionMins}">Today</option>`;
            const activeMins = (availableDates.find(d => d.date === initialDate) || availableDates[0])?.mins || activeSessionMins;

            document.getElementById(`tick-container-${idx}`).innerHTML = `
                <div class="flex flex-col items-end gap-1.5">
                    <span class="text-amber-500 font-black text-[10px] uppercase tracking-widest">PENDING SYNC...</span>
                    <div class="flex items-center gap-2">
                        <select class="text-[10px] p-1.5 border border-blue-300 rounded-lg outline-none cursor-pointer font-bold text-slate-700 bg-white" onchange="updateTopicDate(${idx}, this.options[this.selectedIndex].value, this.options[this.selectedIndex].dataset.mins, this)">
                            ${dateOptions}
                        </select>
                        <span id="sync-mins-${idx}" class="text-[9px] font-black text-slate-500 bg-slate-100 border border-slate-200 px-2 py-1.5 rounded-lg">${activeMins}m</span>
                    </div>
                </div>`;
        }

        function updateTopicDate(idx, newDateVal, predefinedMins, selectEl) {
            if (!newDateVal) return;
            const chStartDate = currentPlannerData[idx].chapterStartDate;
            if (chStartDate && newDateVal < chStartDate) {
                alert(`⚠️ Cannot backdate topic to ${newDateVal} before chapter start date (${chStartDate}).`);
                if (selectEl) selectEl.value = currentPlannerData[idx].completedDate;
                return;
            }
            const dynamicMins = parseInt(predefinedMins) || activeSessionMins;
            currentPlannerData[idx].completedDate = newDateVal;
            currentPlannerData[idx].completedMinutes = dynamicMins;
            const minBadge = document.getElementById(`sync-mins-${idx}`);
            if (minBadge) minBadge.innerText = `${dynamicMins}m`;
        }

        function previewUntick(cb, idx) {
            if (!cb.checked) {
                document.getElementById(`tick-container-${idx}`).innerHTML = `<span class="text-rose-500 font-black text-[10px] uppercase tracking-widest">REMOVED</span>`;
                currentPlannerData[idx].isDone = false;
                currentPlannerData[idx].completedDate = "";
                currentPlannerData[idx].completedMinutes = 0;
                currentPlannerData[idx].tickedBy = "";
                currentPlannerData[idx].savedToDb = false;
            }
        }

        function startChapter(chName, customDate = null) {
            const startDate = customDate || getLocalTodayIso();
            currentPlannerData.forEach(r => { if (r['CHAPTER NAME'] === chName) r.chapterStartDate = startDate; });
            renderSyllabusExactMath();
        }

        async function confirmDaySubmission() {
            const safeName = (activeStaff.name && activeStaff.name !== 'undefined') ? activeStaff.name : activeStaff.email;
            const newActivityLogs = [];
            document.querySelectorAll('.batch-rev-input').forEach(input => {
                const val = input.value.trim();
                if (val) {
                    newActivityLogs.push({
                        date: input.dataset.date,
                        reason: val,
                        minutes: parseInt(input.dataset.mins) || activeSessionMins,
                        loggedBy: safeName,
                        timestamp: Date.now()
                    });
                }
            });

            const stagedTopics = currentPlannerData.filter(r => r.isDone);
            const hasNewChapterStart = currentPlannerData.some(r => r.chapterStartDate && !r.isDone && !r.savedToDb);

            if (stagedTopics.length === 0 && newActivityLogs.length === 0 && !hasNewChapterStart) {
                alert("Please tick at least one syllabus topic, start a chapter, OR type an activity before confirming.");
                return;
            }

            if (isDemoMode) {
                alert("Simulation: Progress staged.");
                closeModal('syllabus-modal');
                return;
            }

            const btn = document.getElementById('confirm-day-btn');
            const origText = btn.innerText;
            btn.innerText = "Securing Data...";
            btn.disabled = true;

            try {
                const todayISO = getLocalTodayIso();
                currentPlannerData.forEach(r => {
                    if (r.isDone && !r.savedToDb) {
                        r.savedToDb = true;
                        if (r.completedDate && r.completedDate < todayISO) {
                            r.isBackdated = true;
                            r.uploadedOn = todayISO;
                        }
                    } else if (!r.isDone) {
                        r.savedToDb = false;
                    }
                });

                const mergedActivityLogs = [...(window.currentActivityLogs || []), ...newActivityLogs];

                const { error } = await sb.from("lesson_planners").upsert([{
                    firestore_id: activeSubjectId,
                    branch_id: activeBranchId,
                    session_id: activeSessionId,
                    syllabus_data: currentPlannerData,
                    activity_logs: mergedActivityLogs,
                    unlock_requested: false,
                    is_unlocked: false,
                    unlocked_at_ms: null,
                    last_save_log: {
                        time: new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
                        user: safeName,
                        device: navigator.userAgent.includes('Mobile') ? 'Mobile' : 'Desktop'
                    },
                    updated_at: new Date().toISOString()
                }], { onConflict: 'branch_id,session_id,firestore_id' });

                if (error) throw error;
                await bumpPlannerVersion();
                alert("✅ Progress saved to Supabase!");
                closeModal('syllabus-modal');
            } catch (e) {
                alert("Error saving data: " + e.message);
            } finally {
                btn.innerText = origText;
                btn.disabled = false;
            }
        }

        async function autoRequestUnlock(dateStr) {
            if (isDemoMode || !activeBranchId) return;
            try {
                const safeName = (activeStaff.name && activeStaff.name !== 'undefined') ? activeStaff.name : activeStaff.email;
                const updatedHistory = [...(window.currentLockHistory || []), `Locked on ${new Date().toLocaleDateString('en-GB')} for missing ${dateStr}`];
                const { error } = await sb.from("lesson_planners").upsert([{
                    firestore_id: activeSubjectId,
                    branch_id: activeBranchId,
                    session_id: activeSessionId,
                    syllabus_data: currentPlannerData || [],
                    unlock_requested: true,
                    is_unlocked: false,
                    locked_date: dateStr,
                    requested_by: safeName,
                    lock_reason: "Missed Compliance Grace Period",
                    lock_history: updatedHistory,
                    updated_at: new Date().toISOString()
                }], { onConflict: 'branch_id,session_id,firestore_id' });
                if (!error) await bumpPlannerVersion();
            } catch (e) {
                console.error("Auto-unlock failed", e);
            }
        }

        async function requestUnlock() {
            if (isDemoMode) return alert("Simulation: Unlock requested.");
            if (!activeBranchId) return;
            const btn = document.getElementById('request-unlock-btn');
            btn.innerText = "Requesting...";
            btn.disabled = true;

            try {
                const safeName = (activeStaff.name && activeStaff.name !== 'undefined') ? activeStaff.name : activeStaff.email;
                const todayStr = new Date().toLocaleDateString('en-GB');
                const updatedHistory = [...(window.currentLockHistory || []), `Requested Manual Unlock on ${todayStr}`];

                const { error } = await sb.from("lesson_planners").upsert([{
                    firestore_id: activeSubjectId,
                    branch_id: activeBranchId,
                    session_id: activeSessionId,
                    syllabus_data: currentPlannerData || [],
                    unlock_requested: true,
                    locked_date: "Manual Correction",
                    requested_by: safeName,
                    lock_reason: "Manual Unlock Request",
                    lock_history: updatedHistory,
                    updated_at: new Date().toISOString()
                }], { onConflict: 'branch_id,session_id,firestore_id' });

                if (error) throw error;
                await bumpPlannerVersion();
                alert("Unlock Request Sent!");
                btn.innerText = "Unlock Requested ⏳";
                btn.className = "w-full bg-amber-50 text-amber-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-amber-200 cursor-not-allowed";
            } catch (e) {
                alert("Error requesting unlock: " + e.message);
                btn.innerText = "Made a Mistake? Request Admin Unlock";
                btn.disabled = false;
            }
        }

        function getMockSyllabus() {
            return [
                { "CHAPTER NAME": "Logarithms", "LECTURE NUMBER": "1", "SUBTOPICS": "Bracket Notations", "isDone": true, "chapterStartDate": "2026-04-01", "completedMinutes": "90", "completedDate": "2026-04-01", "Target days for chapter": "3", "Target Minutes For Chapter": "270" },
                { "CHAPTER NAME": "Quadratic Equations", "LECTURE NUMBER": "1", "SUBTOPICS": "Roots & Discriminants", "isDone": false, "chapterStartDate": "2026-04-05", "Target days for chapter": "4", "Target Minutes For Chapter": "360" }
            ];
        }

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff') || 'null');
            if (!activeStaff) return window.location.replace('staff-login.html');

            const safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
            document.getElementById('teacher-badge').innerText = `ID: ${safeName}`;

            const isAdmin = sessionStorage.getItem('minervaAdminAuth') === 'true';
            let staffRow = null;

            try {
                const { data: staffRows } = await sb
                    .from("staff_applications")
                    .select("*")
                    .eq("email", activeStaff.email)
                    .limit(1);

                if (staffRows && staffRows.length > 0) {
                    staffRow = staffRows[0];
                    const det = parseJsonField(staffRow.details);
                    if (!activeStaff.name || activeStaff.name === 'undefined') {
                        const nk = Object.keys(det).find(k => k.toLowerCase().includes('name'));
                        if (nk && det[nk]) {
                            activeStaff.name = String(det[nk]).trim();
                            document.getElementById('teacher-badge').innerText = `ID: ${activeStaff.name}`;
                        }
                    }

                    const canEditVal = staffRow.can_edit_lesson_planner ?? staffRow.canEditLessonPlanner ?? det.canEditLessonPlanner;
                    const canViewVal = staffRow.can_view_lesson_planner_summary ?? staffRow.canViewLessonPlannerSummary ?? det.canViewLessonPlannerSummary;
                    const canUnlockVal = staffRow.can_unlock_lesson_planner ?? staffRow.canUnlockLessonPlanner ?? det.canUnlockLessonPlanner;

                    if (isAdmin) {
                        document.getElementById('auth-btn')?.classList.remove('hidden');
                        document.getElementById('admin-hub-btn')?.classList.remove('hidden');
                    } else if (isTruthyPermission(canEditVal) || isTruthyPermission(canViewVal) || isTruthyPermission(canUnlockVal)) {
                        document.getElementById('admin-hub-btn')?.classList.remove('hidden');
                    }
                } else if (isAdmin) {
                    document.getElementById('auth-btn')?.classList.remove('hidden');
                    document.getElementById('admin-hub-btn')?.classList.remove('hidden');
                }

                await resolveFixedBranchAndSession(staffRow);
                await loadFastTeacherClasses();
            } catch (e) {
                console.error("Initialization error:", e);
                document.getElementById('classes-grid').innerHTML = `<div class="col-span-full text-center py-20 text-rose-500 font-bold uppercase text-[11px] tracking-widest">Error: ${e.message}</div>`;
            }
        };
    </script>
</body>
