<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Teacher Lesson Planner</title>
 <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card-prism { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.02); transition: all 0.3s ease; }
        .card-prism:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.1); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 2px solid #f1f5f9; border-top: 2px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Clean Details Dropdown Arrow */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 p-4 sm:px-8 sm:py-5 flex flex-wrap justify-between items-center shadow-lg gap-3">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors shadow-md border border-indigo-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </button>
            <div>
                <h1 class="text-sm sm:text-xl font-black uppercase text-white tracking-widest">Teacher Lesson Planner</h1>
                <p id="teacher-badge" class="text-[9px] sm:text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Loading...</p>
            </div>
            <div class="flex gap-2 ml-4">
                <button id="auth-btn" onclick="window.location.href='admin-lesson-auth.html'" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-colors shadow-md border border-indigo-500 flex items-center gap-2">
                    🔐 Delegation
                </button>
                <button id="admin-hub-btn" onclick="window.location.href='admin-lesson-planner.html'" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-colors shadow-md border border-blue-500 flex items-center gap-2">
                    📊 Planner Hub
                </button>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="demo-mode-indicator" class="hidden bg-amber-500/20 text-amber-300 px-3 py-2 rounded-xl text-[9px] font-black uppercase border border-amber-500/50 flex items-center gap-2">
                <span>Simulation</span>
                <button onclick="toggleDemoMode(false)" class="underline hover:text-white">Exit</button>
            </div>
            <button id="demo-toggle-btn" onclick="toggleDemoMode(true)" class="text-[9px] font-black text-indigo-200 uppercase tracking-widest border border-indigo-700 px-4 py-2 rounded-full hover:bg-indigo-800 transition-all">Simulation</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-10 space-y-6 sm:space-y-8">
       <div id="classes-view" class="space-y-6">
            <div id="classes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-24 text-slate-400 font-bold uppercase text-xs tracking-[0.2em]">
                    <span class="loader mb-4"></span><br>Fetching Live Timetable...
                </div>
            </div>
        </div>
    </main>

    <div id="mode-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="mode-class-title" class="text-xl font-black text-slate-900 uppercase tracking-tighter"></h3>
                <button onclick="closeModal('mode-modal')" class="text-slate-400 hover:text-rose-500 bg-slate-100 p-2 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            
            <p id="mode-session-info" class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-6 bg-blue-50 inline-block px-3 py-1.5 rounded-lg border border-blue-100"></p>
            
            <div class="space-y-4">
                <button onclick="openSyllabusChecklist()" class="w-full p-5 border-2 border-slate-100 rounded-[1.5rem] hover:border-blue-500 hover:bg-blue-50 transition-all text-left group shadow-sm">
                    <div class="font-black text-slate-800 text-base uppercase tracking-widest group-hover:text-blue-700 flex items-center gap-3">
                        <span class="bg-blue-100 text-blue-600 p-2.5 rounded-xl">📚</span> Open Daily Tracker
                    </div>
                    <p class="text-[10px] font-bold text-slate-400 mt-2 ml-[3.25rem] uppercase tracking-widest">Log syllabus topics or revision activity</p>
                </button>
            </div>
        </div>
    </div>

    <div id="syllabus-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[150] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-6 sm:p-10 max-w-4xl w-full h-[92vh] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div class="flex justify-between items-center mb-6 shrink-0 bg-white">
                <div>
                    <h3 id="syll-class-title" class="text-xl sm:text-2xl font-black text-slate-900 uppercase tracking-tighter"></h3>
                    <div class="flex flex-wrap gap-2 sm:gap-4 items-center mt-2">
                        <p class="text-[9px] font-black text-blue-600 uppercase tracking-[0.2em]">Execution Protocol</p>
                        <span id="syll-session-badge" class="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest"></span>
                    </div>
                </div>
                <button onclick="closeModal('syllabus-modal')" class="p-3 bg-slate-100 rounded-xl text-slate-500 hover:bg-rose-100 hover:text-rose-600 transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll pr-2">
                <div id="subject-pace-widget" class="bg-[#fdfefe] border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm"></div>
                <div id="chapter-accordion-container" class="space-y-4"></div>
            </div>

          <div class="pt-4 border-t mt-4 shrink-0 bg-white flex flex-col gap-3">
                
                <div id="unified-revision-block" class="border-2 border-slate-100 rounded-[1.5rem] p-4 focus-within:border-amber-500 focus-within:bg-amber-50 transition-all shadow-sm">
                    <div class="font-black text-slate-800 text-sm uppercase tracking-widest mb-2 flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2">
                            <span class="bg-amber-100 text-amber-600 p-2 rounded-xl">🎯</span> Log Activity / Revision
                        </div>
                        <input type="date" id="revision-date" class="text-[10px] font-black text-slate-500 bg-white border border-slate-200 rounded-lg px-2 py-1.5 outline-none focus:border-amber-500 cursor-pointer shadow-sm">
                    </div>
                    <textarea id="revision-reason" rows="2" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-[10px] font-bold text-slate-700 outline-none focus:border-amber-500" placeholder="Optional: Enter reason if you conducted a revision or non-syllabus activity today..."></textarea>
                </div>

                <button id="confirm-day-btn" onclick="confirmDaySubmission()" class="w-full bg-emerald-600 text-white font-black py-4 sm:py-5 rounded-2xl uppercase tracking-widest text-[11px] sm:text-xs shadow-xl shadow-emerald-600/30 hover:bg-emerald-700 active:scale-95 transition-all">
                    Securely Confirm & Log Day's Progress
                </button>
                <button id="request-unlock-btn" onclick="requestUnlock()" class="w-full bg-rose-50 text-rose-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-rose-200 hover:bg-rose-100 transition-all hidden">
                    Made a Mistake? Request Admin Unlock
                </button>
            </div>
        </div>
    </div>

    <script>
       const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

      // --- MULTI-CENTER DYNAMIC DB ROUTER (TEACHER EDITION) ---
        const storedStaff = JSON.parse(localStorage.getItem('minervaActiveStaff')) || {};
        let activeCenter = "GHUMARWIN"; // Will automatically update based on profile

      function getCollection(name) {
            const globalCollections = ['configs', 'staff_applications', 'system_metadata'];
            if (globalCollections.includes(name)) return db.collection(name);
            
            if (activeCenter === "GHUMARWIN") return db.collection(name);
            return db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }
        // --------------------------------------------------------

        let activeStaff = null, mySessions = [], myDuties = [], currentPlannerData = null;
        let activeSubjectId = null, activeSessionMins = 0;
        let holidaysData = []; window.teacherTimetable = null;
        let isDemoMode = false;
        let globalAutoLock = true;
        let enableDailyBlock = false; 

window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');

            const safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
            document.getElementById('teacher-badge').innerText = `ID: ${safeName}`;

            const isAdmin = sessionStorage.getItem('minervaAdminAuth') === 'true';
            
            try {
                const staffSnap = await db.collection("staff_applications").where("email", "==", activeStaff.email).get();
                if (!staffSnap.empty) {
                    const data = staffSnap.docs[0].data();
                    
                    // 1. Bulletproof Branch Detection
                    const centerKey = Object.keys(data.details || {}).find(k => k.toLowerCase().includes('cent'));
                    if (centerKey) {
                        const rawCenter = String(data.details[centerKey]).toUpperCase();
                        if (rawCenter.includes('DHARAMSHALA')) activeCenter = 'DHARAMSHALA';
                        else if (rawCenter.includes('GHUMARWIN')) activeCenter = 'GHUMARWIN';
                        else activeCenter = rawCenter.trim();
                    }

                    if (isAdmin) {
                        document.getElementById('auth-btn')?.classList.remove('hidden');
                        document.getElementById('admin-hub-btn')?.classList.remove('hidden');
                    } else {
                        // Verify string-based branch permissions OR legacy global true
                        const canEdit = data.canEditLessonPlanner === true || data.canEditLessonPlanner === activeCenter;
                        const canView = data.canViewLessonPlannerSummary === true || data.canViewLessonPlannerSummary === activeCenter;
                        if (canEdit || canView) {
                            document.getElementById('admin-hub-btn')?.classList.remove('hidden');
                        }
                    }
                }
            } catch (e) { console.error("Permission check failed:", e); }

            // --- SAFETY UI: Theme & Watermark (Loaded AFTER Center Detection) ---
            if (activeCenter === "DHARAMSHALA") {
                document.querySelector('header').classList.replace('bg-[#1e1b4b]', 'bg-purple-950');
                document.querySelector('header').classList.replace('border-indigo-900', 'border-purple-800');
                document.body.style.backgroundColor = '#faf5ff'; // Light Purple Background
            }
            const watermark = document.createElement('div');
            watermark.innerHTML = activeCenter;
            watermark.className = "fixed inset-0 pointer-events-none flex items-center justify-center text-[10vw] font-black opacity-[0.03] text-slate-900 z-[1] tracking-widest uppercase overflow-hidden whitespace-nowrap";
            if(activeCenter === "DHARAMSHALA") watermark.classList.replace('text-slate-900', 'text-purple-900');
            document.body.appendChild(watermark);

            await fetchTodayData();
        };

        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        function toggleDemoMode(active) {
            isDemoMode = active;
            document.getElementById('demo-mode-indicator').classList.toggle('hidden', !active);
            document.getElementById('demo-toggle-btn').classList.toggle('hidden', active);
            
            if(active) {
                mySessions = [
                    { id: 'sess1', assignmentId: 'sim_id_Mathematics', className: 'Warrior Batches', section: 'J1', subject: 'Mathematics', start: '09:30 AM', end: '11:00 AM', duration: 90 },
                    { id: 'sess2', assignmentId: 'sim_id_Mathematics', className: 'Warrior Batches', section: 'J1', subject: 'Mathematics', start: '01:00 PM', end: '02:00 PM', duration: 60 }
                ];
                myDuties = [{ id: 'duty1', title: 'Invigilation Duty - Term 1', time: '03:30 PM - 05:00 PM', location: 'Hall B' }];
                renderClassesGrid();
            } else { fetchTodayData(); }
        }

        async function fetchTodayData() {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayName = days[new Date().getDay()];
            const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;
            
        try {
                const holSnap = await getCollection("school_holidays").get();
                holidaysData = holSnap.docs.map(d => d.data());
                const histSnap = await getCollection("timetable_history").where("type", "in", ["EXAM_OVERRIDE", "SPECIFIC_DATES", "DAILY_OVERRIDE", "LIVE_MASTER_UPDATE"]).get();
                window.historyOverrides = histSnap.docs.map(d => d.data());
            } catch(e) { console.error("Error fetching exclusions:", e); }

          try {
                const snap = await getCollection("timetable").get();
                window.fullTimetable = snap.docs.map(d => d.data());
                
                // Isolate this specific teacher's normal schedule
                window.teacherTimetable = window.fullTimetable.filter(t => t.teacherName === safeName || t.teacher === safeName);

                // --- OVERRIDE ENGINE FOR TEACHER DASHBOARD ---
                const todayDateObj = new Date();
                const offset = todayDateObj.getTimezoneOffset() * 60000;
                const todayIsoStr = (new Date(todayDateObj - offset)).toISOString().split('T')[0];
                
               // Use our dedicated Snapshot engine to get the schedule for TODAY
                // This function now automatically handles History OR Master Master-Fallback
                const todayDocsRaw = getScheduleSnapshotForDate(todayIsoStr, todayName);
                
               let todayDocs = todayDocsRaw.filter(s => {
                    // 1. Always keep it if it's an override or exception
                    const isException = s.type === 'EXCLUSION' || s.isOverride === true;
                    
                    // 2. Check teacher match
                    const nameMatch = (s.teacherName === safeName || s.teacher === safeName);
                    
                    // 3. Check if it's today's class (or if it doesn't have a day property)
                    const dayMatch = !s.day || s.day === todayName; 
                    
                    return isException || (nameMatch && dayMatch);
                });
                
                // CRITICAL: If the teacher has classes on the Master but the snapshot returned nothing, 
                // we FORCE the master schedule to take precedence.
                const masterCheck = window.teacherTimetable.filter(t => t.day === todayName);
                if (todayDocs.length === 0 && masterCheck.length > 0) {
                    todayDocs = masterCheck;
                }

              // --- THE LIVE LEAVE PATCHER & ABSENCE ENGINE ---
                function minsTo12H(m) { 
                    let h=Math.floor(m/60)%24; let mn=m%60; let mod=h>=12?'PM':'AM'; h=h%12||12; 
                    return `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')} ${mod}`; 
                }
                
                const prefix = activeCenter === "GHUMARWIN" ? "" : activeCenter.toLowerCase() + "_";
                const leaveSnap = await db.collection(prefix + "leave_requests").get();
                leaveSnap.forEach(doc => {
                    const leaveData = doc.data();
                    if (leaveData.status === "PENDING" || leaveData.status === "APPROVED") {
                        
                        // 1. ABSENCE ENGINE: If THIS teacher is on leave, inject a virtual holiday to excuse them!
                        if (leaveData.teacherEmail === activeStaff.email || leaveData.teacherName === safeName) {
                            holidaysData.push({
                                startDate: leaveData.startDate,
                                endDate: leaveData.endDate,
                                isFullDay: leaveData.type === 'FULL',
                                startTime: leaveData.type !== 'FULL' ? leaveData.startTime : null,
                                endTime: leaveData.type !== 'FULL' ? leaveData.endTime : null,
                                reason: "Approved Leave",
                                targetClasses: ['ALL'] 
                            });
                        }

                        // 2. SUBSTITUTE ENGINE: If THIS teacher is substituting for someone else, add the class
                        if (leaveData.adjustments) {
                            leaveData.adjustments.forEach(adj => {
                                if (adj.date === todayIsoStr && adj.substituteResponse === "ACCEPTED" && adj.adjustedEmail === activeStaff.email) {
                                    const parts = (adj.sub || "").split('|');
                                    const cName = parts[0] ? parts[0].trim() : "Extra Duty";
                                    const sName = parts[1] ? parts[1].replace('Sec', '').trim() : "Task";
                                    
                                    todayDocs.push({
                                        id: 'sub_' + Math.random().toString(36).substr(2,9),
                                        className: cName,
                                        section: sName,
                                        subject: adj.title,
                                        timeRange: `${minsTo12H(adj.start)} - ${minsTo12H(adj.end)}`,
                                        duration: adj.end - adj.start,
                                        teacher: activeStaff.name,
                                        teacherName: activeStaff.name
                                    });
                                }
                            });
                        }
                    }
                });
                                     
                if(todayDocs.length > 0) {
                    const structSnap = await getCollection("institute_structure").get();
                    const structures = structSnap.docs.map(d => ({id: d.id, ...d.data()}));

                    mySessions = todayDocs.map((data, index) => {
                        const docId = data.id || `override_${index}`; 
                        const times = data.timeRange ? data.timeRange.split(' - ') : ['00:00 AM', '00:00 AM'];
                        const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

                        const structMatch = structures.find(s => 
                            norm(s.className) === norm(data.className) && 
                            norm(s.sectionName) === norm(data.section)
                        );
                        
                        const structId = structMatch ? structMatch.id : `MATCH_FAILED_${data.className}_${data.section}`; 
                        
                        let exactSubjectCasing = data.subject;
                        if (structMatch && structMatch.subjects) {
                            const matchedSub = structMatch.subjects.find(s => norm(s) === norm(data.subject));
                            if (matchedSub) exactSubjectCasing = matchedSub; 
                        }
                        
                        return { 
                            id: docId, 
                            assignmentId: `${structId}_${exactSubjectCasing}`.replace(/\s+/g, '_'),
                            className: data.className, section: data.section, 
                            subject: data.subject, start: times[0], end: times[1], duration: parseInt(data.duration) || 0,
                            remark: data.remark || ""
                        };
                    });
                } else {
                    const assignSnap = await getCollection("lesson_planner_assignments").where("assignedTo", "==", activeStaff.email).get();
                    mySessions = assignSnap.docs.map(d => ({ 
                        id: d.id, assignmentId: d.id, className: d.data().className, section: d.data().section, 
                        subject: d.data().subject, start: '09:00 AM', end: '10:30 AM', duration: 90 
                    }));
                }
                myDuties = [];
                
                renderClassesGrid();
            } catch(e) { 
                console.error(e); 
                document.getElementById('classes-grid').innerHTML = `<div class="col-span-full text-center py-20 text-rose-500 font-bold uppercase text-[11px] tracking-widest">Error fetching data. Check connection and refresh.</div>`;
            }
        }

        function renderClassesGrid() {
            const grid = document.getElementById('classes-grid');
            grid.innerHTML = '';
            if(mySessions.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold uppercase text-[11px] tracking-widest">No classes assigned today.</div>`;
                return;
            }

            const todayDate = new Date();
            todayDate.setHours(0,0,0,0);

            try {
                mySessions.forEach(sess => {
                    let isHoliday = false; let holReason = "";
                    for (let h of holidaysData) {
                        if (!h.startDate) continue; 
                        const hStart = new Date(h.startDate); hStart.setHours(0,0,0,0);
                        const hEnd = new Date(h.endDate || h.startDate); hEnd.setHours(23,59,59,999);
                        
                        if (todayDate >= hStart && todayDate <= hEnd) {
                            const targetCls = `${sess.className}|${sess.section}`;
                            const tClasses = h.targetClasses || []; 
                            
                            if (tClasses.includes('ALL') || tClasses.includes(targetCls)) {
                                if (h.isFullDay) { isHoliday = true; holReason = h.reason; break; }
                                else if (h.startTime && h.endTime && sess.start) { 
                                    const [sh, sm] = sess.start.split(' ')[0].split(':').map(Number);
                                    const sMins = (sess.start.includes('PM') && sh !== 12 ? sh+12 : (sh===12 && sess.start.includes('AM') ? 0 : sh))*60 + sm;
                                    const eMins = sMins + (parseInt(sess.duration) || 0);
                                    const [hsh, hsm] = h.startTime.split(':').map(Number); const [heh, hem] = h.endTime.split(':').map(Number);
                                    const hStartMins = hsh*60+hsm; const hEndMins = heh*60+hem;
                                    if (sMins < hEndMins && eMins > hStartMins) { isHoliday = true; holReason = h.reason; break; }
                                }
                            }
                        }
                    }

                   let isDoubtSession = sess.remark && sess.remark.toLowerCase().includes('doubt session');

                    if (isHoliday) {
                        grid.innerHTML += `
                        <div class="bg-slate-50 border-2 border-slate-200 p-6 sm:p-8 rounded-[2rem] text-left w-full relative overflow-hidden opacity-80 cursor-not-allowed">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl sm:text-2xl font-black text-slate-400 tracking-tighter line-through">${sess.className} <span class="text-slate-300 mx-1">|</span> ${sess.section}</h3>
                                <span class="bg-slate-200 text-slate-500 px-3 py-1 rounded-lg text-[9px] font-black tracking-widest uppercase border border-slate-300 shrink-0">${sess.duration} Mins</span>
                            </div>
                            <p class="text-[10px] sm:text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-1">${sess.subject}</p>
                            <div class="mt-6 bg-rose-50 border border-rose-100 p-4 rounded-xl flex items-center justify-center flex-col shadow-sm">
                                <span class="text-2xl mb-1">🌴</span>
                                <span class="font-black text-rose-600 uppercase tracking-widest text-[10px] text-center">${holReason}</span>
                                <span class="font-bold text-rose-400 text-[8px] uppercase mt-1">Class Suspended</span>
                            </div>
                        </div>`;
                    } else if (isDoubtSession) {
                        grid.innerHTML += `
                        <div class="bg-slate-50 border-2 border-slate-200 p-6 sm:p-8 rounded-[2rem] text-left w-full relative overflow-hidden opacity-80 cursor-not-allowed">

        // --- 🕰️ TIME MACHINE ENGINE ---
        function getScheduleSnapshotForDate(dateIso) {
            if (!window.historyOverrides || window.historyOverrides.length === 0) {
                return window.fullTimetable || [];
            }
            
            // 1. Check for a specific 1-Day Override on this exact date (like an OT or Event day)
            const exactOverride = window.historyOverrides.find(h => h.date === dateIso && (h.type === "DAILY_OVERRIDE" || h.type === "EXAM_OVERRIDE"));
            if (exactOverride && exactOverride.schedule) return exactOverride.schedule;
            
            // 2. CRITICAL FIX: For normal days, ALWAYS use the freshly fetched Live Master!
            // Returning old 'LIVE_MASTER_UPDATE' history snapshots causes the Teacher to see stale data.
            return window.fullTimetable || [];
        }

        // --- SMART EXCLUSION ENGINE (Holidays + OT Exams) ---
        function checkDateExclusion(dateObj, className, sectionName, subjectName) {
            // --- STRICT SUNDAY EXCLUSION ---
            if (dateObj.getDay() === 0) return { isExcluded: true, reason: "Sunday (Weekly Off)" };

            // Precise timezone fixing (Fixes the date shifting bug!)
            const offset = dateObj.getTimezoneOffset() * 60000;
            const curStr = (new Date(dateObj.getTime() - offset)).toISOString().split('T')[0];
            const checkDate = new Date(curStr); checkDate.setHours(0,0,0,0);
            const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            
            // 1. Check Standard Holidays
            for (let h of holidaysData) {
                if (!h.startDate) continue;
                const hStart = new Date(h.startDate); hStart.setHours(0,0,0,0);
                const hEnd = new Date(h.endDate || h.startDate); hEnd.setHours(23,59,59,999);
                
                if (checkDate >= hStart && checkDate <= hEnd) {
                    const targetCls = `${className}|${sectionName}`;
                    const tClasses = h.targetClasses || [];
                    
                    if (tClasses.includes('ALL') || tClasses.includes(targetCls)) {
                        if (h.isFullDay) {
                            return { isExcluded: true, reason: h.reason };
                        } else if (h.startTime && h.endTime) {
                            // Half-Day Logic: Look into the timetable to see if THIS subject overlaps with the holiday times
                            const scheduleToCheck = getScheduleSnapshotForDate(curStr);
                            const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                            const dayName = daysArr[dateObj.getDay()];
                            
                            const classSlots = scheduleToCheck.filter(t => 
                                t.day === dayName && 
                                norm(t.className) === norm(className) && 
                                norm(t.section) === norm(sectionName) && 
                                norm(t.subject) === norm(subjectName)
                            );
                            
                            if (classSlots.length > 0) {
                                const [hsh, hsm] = h.startTime.split(':').map(Number);
                                const [heh, hem] = h.endTime.split(':').map(Number);
                                const hStartMins = hsh * 60 + hsm; 
                                const hEndMins = heh * 60 + hem;
                                
                                const isOverlapping = classSlots.some(slot => {
                                    if (slot.start24 && slot.end24) {
                                        const [sh, sm] = slot.start24.split(':').map(Number);
                                        const [eh, em] = slot.end24.split(':').map(Number);
                                        const cStartMins = sh * 60 + sm;
                                        const cEndMins = eh * 60 + em;
                                        
                                        // Overlap Logic: Class starts before holiday ends AND Class ends after holiday starts
                                        return (cStartMins < hEndMins && cEndMins > hStartMins);
                                    }
                                    return false;
                                });
                                
                                if (isOverlapping) {
                                    return { isExcluded: true, reason: h.reason + " (Half Day)" };
                                }
                            }
                        }
                    }
                }
            }
            
            // 2. Check Timetable History (Exams / OT Doubt Sessions)
            if (window.historyOverrides) {
                const override = window.historyOverrides.find(o => o.date === curStr);
                if (override && override.schedule) {
                    const classSlots = override.schedule.filter(s => norm(s.className) === norm(className) && norm(s.section) === norm(sectionName));
                    if (classSlots.length > 0) {
                        const subSlot = classSlots.find(s => norm(s.subject) === norm(subjectName));
                        if (!subSlot || (subSlot.remark && subSlot.remark.toLowerCase().includes("doubt session"))) {
                            return { isExcluded: true, reason: subSlot ? "Doubt Session" : "Exam Day (No Class)" };
                        }
                    } else {
                        return { isExcluded: true, reason: "Class Not Scheduled" };
                    }
                }
            }

            // 3. Check Live Master (If no override exists, maybe the normal day has a Doubt Session!)
            const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const masterSlot = (window.fullTimetable || []).find(t => 
                t.day === daysArr[checkDate.getDay()] && norm(t.className) === norm(className) && norm(t.section) === norm(sectionName) && norm(t.subject) === norm(subjectName)
            );
            if (masterSlot && masterSlot.remark && masterSlot.remark.toLowerCase().includes("doubt session")) {
                return { isExcluded: true, reason: "Doubt Session" };
            }
            return { isExcluded: false, reason: "" };
        }

        function isTimetableWorkingDay(dateObj, className, sectionName, subjectName) {
            if (dateObj.getDay() === 0) return false; 
            
            // 1. Calculate the Iso string for the date being checked
            const offset = dateObj.getTimezoneOffset() * 60000;
            const curStr = (new Date(dateObj.getTime() - offset)).toISOString().split('T')[0];
            const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

            // Fetch the correct snapshot for this day
            const scheduleToCheck = getScheduleSnapshotForDate(curStr);
            const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = daysArr[dateObj.getDay()];

            const match = scheduleToCheck.some(t => 
                t.day === dayName && 
                norm(t.className) === norm(className) && 
                norm(t.section) === norm(sectionName) && 
                norm(t.subject) === norm(subjectName)
            );
            return match;
        }

        // Helper function to format date strings cleanly on the administrative stream timeline
        function formatDateString(iso) {
            if(!iso) return '--';
            const [y, m, d] = iso.split('-');
            const dObj = new Date(y, m - 1, d);
            return dObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        }

        function renderSyllabusExactMath() {
            const currSession = mySessions.find(s => s.assignmentId === activeSubjectId) || {};
            const cName = currSession.className || "";
            const sName = currSession.section || "";
            const subName = currSession.subject || "";

            const chNamesList = [...new Set(currentPlannerData.map(r => r["CHAPTER NAME"]))];
            let totalChapters = chNamesList.length;
            let completedChapters = 0;
            chNamesList.forEach(ch => {
                const rws = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                if (rws.length > 0 && rws.every(r => r.isDone)) completedChapters++;
            });
            let progressPct = totalChapters === 0 ? 0 : Math.round((completedChapters / totalChapters) * 100);
            
            const chMap = new Map();
            currentPlannerData.forEach(r => {
                if(!chMap.has(r['CHAPTER NAME'])) {
                    chMap.set(r['CHAPTER NAME'], { days: parseInt(r['Target days for chapter']) || 0, mins: parseInt(r['Target Minutes For Chapter']) || 0, isStarted: false });
                }
                if (r.chapterStartDate || r.isDone) chMap.get(r['CHAPTER NAME']).isStarted = true;
            });
            
            let totalTargetDaysAll = 0, totalTargetMinsAll = 0;
            let totalActualDaysAll = 0;
            let completedTargetDays = 0, completedTargetMins = 0;
            let completedActualDays = 0, completedActualMins = 0;
            let chapterRanges = [];

          let activityLogs = window.currentActivityLogs || [];
            let dailyLogSums = {};
            let activityHtml = "";
            
            // Re-initialize the variables (Removed 'let' because they are already declared at the top!)
            extraActivityDays = 0; 
            activityMinsTotal = 0;
            independentRevisionDates = new Set();
            independentLogsForUI = [];

            chMap.forEach(v => { totalTargetDaysAll += v.days; totalTargetMinsAll += v.mins; });

            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = '';
            
            const chNames = Array.from(chMap.keys());
            let htmlContent = "";

            chNames.forEach(ch => {
                const rows = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                const doneR = rows.filter(r => r.isDone);
                const isStarted = rows[0].chapterStartDate || doneR.length > 0;
                const isCompleted = doneR.length === rows.length && rows.length > 0;

                const targetDays = parseInt(rows[0]?.['Target days for chapter']) || 0;
                const targetMins = parseInt(rows[0]?.['Target Minutes For Chapter']) || 0;

                let sessionMap = {}; let extraMins = 0;
                doneR.forEach(r => {
                    let d = r.completedDate; 
                    let mRaw = parseFloat(r.completedMinutes) || 0;
                    let sessionKey = d + "_" + mRaw;
                    if(d) { if(!sessionMap[sessionKey]) sessionMap[sessionKey] = mRaw; } else extraMins += mRaw;
                });
                const actualMins = Object.values(sessionMap).reduce((a,b) => a + Math.floor(b), 0) + Math.floor(extraMins);
                
                let chStartStr = rows[0]?.chapterStartDate; let chStart = chStartStr ? new Date(chStartStr) : null;
                const compDates = doneR.map(r => new Date(r.completedDate)).filter(d => !isNaN(d));
                const chEnd = (isCompleted && compDates.length) ? new Date(Math.max(...compDates)) : null;

                let gapHtml = "", actualDaysTaken = 0;
                let excludedHolidays = [];

                if (chStart) {
                    let effectiveEnd = chEnd ? new Date(chEnd) : new Date();
                    effectiveEnd.setHours(23,59,59,999);
                    chapterRanges.push({ start: new Date(chStart), end: effectiveEnd });

                    let validTickDates = new Set(doneR.map(r => r.completedDate).filter(d => d));
                    let cur = new Date(chStart); let finish = new Date(effectiveEnd);
                    
                    while(cur <= finish) {
                        const offset = cur.getTimezoneOffset() * 60000;
                        const curStr = (new Date(cur.getTime() - offset)).toISOString().split('T')[0];
                        
                        const exclusion = checkDateExclusion(cur, cName, sName, subName);
                        
                        if (exclusion.isExcluded) {
                            const shortDate = cur.toLocaleDateString('en-GB', {day: '2-digit', month: 'short'});
                            excludedHolidays.push({ date: shortDate, reason: exclusion.reason });
                        } else {
                            // Only count days that are NOT holidays
                            if (validTickDates.has(curStr)) {
                                actualDaysTaken++; 
                            } else if(isTimetableWorkingDay(cur, cName, sName, subName)) {
                                actualDaysTaken++;
                            }
                        }
                        cur.setDate(cur.getDate() + 1);
                    }

                    totalActualDaysAll += actualDaysTaken;

                    if (isCompleted) {
                        let dayGap = targetDays - actualDaysTaken; 
                        let minGap = targetMins - actualMins;      
                        completedTargetDays += targetDays; 
                        completedTargetMins += targetMins;
                        completedActualDays += actualDaysTaken; 
                        completedActualMins += actualMins;

                        gapHtml = `
                            <div class="flex flex-wrap gap-2 mt-2">

                                </span>
                                <span class="text-[9px] font-black px-3 py-1 rounded-full border ${minGap >= 0 ? 'bg-teal-50 text-teal-600 border-teal-100' : 'bg-purple-50 text-purple-600 border-purple-200'}">
                                    ${minGap >= 0 ? '⏱️ EFFICIENT' : '💪 EXTRA EFFORT'}: ${minGap > 0 ? '+' : ''}${minGap}m
                                </span>
                            </div>`;
                    }
                }
                
                let badge = isCompleted ? `<span class="bg-emerald-500 text-white px-3 py-1 rounded-md text-[9px] font-black uppercase">✓ COMPLETED</span>` 
                          : (isStarted ? `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-md text-[9px] font-black uppercase">ONGOING</span>` 
                          : `<span class="bg-slate-200 text-slate-600 px-3 py-1 rounded-md text-[9px] font-black uppercase">PENDING</span>`);

                const isLocked = (!window.isSubjectUnlocked && globalAutoLock) && (isCompleted || window.complianceLocked);
                
                // If not started, apply lock wrapper. If locked for compliance, lock it. Otherwise, normal.
                const blockInteract = (!isStarted || isLocked) ? 'opacity-50 pointer-events-none' : (isCompleted ? 'bg-amber-50/30' : '');

                let contentHTML = '';
                
                // FIX 1: Safely encode quotes using HTML entities so the JS parser never breaks
                const safeChName = ch.replace(/'/g, "&apos;").replace(/"/g, "&quot;");

                // If chapter hasn't started, inject the button at the top (with pointer-events-auto so it stays clickable despite the lock!)
                if (!isStarted) {
                    contentHTML += `<div class="p-6 text-center bg-blue-50/50 border-t border-slate-200 relative z-10 shadow-sm"><p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-3">Chapter topics are locked until chapter is started</p><button onclick="startChapter('${safeChName}')" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-black uppercase text-[11px] tracking-widest shadow-lg hover:bg-blue-700 transition-all pointer-events-auto">▶ Start Chapter</button></div>`;
                }

                // --- DYNAMIC MIXED TIME-STREAM COMPILER ---
                let timelineEvents = [];
                
                // 1. Gather all syllabus topics belonging to this chapter (ALWAYS RUNS)
                rows.forEach(r => {
                    const absIdx = currentPlannerData.indexOf(r);
                    const safeLec = r['LECTURE NUMBER'] != null ? String(r['LECTURE NUMBER']).padStart(4, '0') : '0000';
                    const displayLec = r['LECTURE NUMBER'] || '--';
                    
                    if (r.isDone && r.completedDate) {
                        timelineEvents.push({
                            type: 'TOPIC',

                            html: `

            let totalOverallDayGap = completedTargetDays - (completedActualDays + extraActivityDays);

            if (completedTargetDays > 0 || independentRevisionDates.size > 0) {

                            ${totalOverallMinGap >= 0 ? 'Time Saved:' : 'Overtime Logged:'} ${Math.abs(totalOverallMinGap)} Mins

                document.getElementById('stat-gap').innerText = "PENDING COMPLETIONS";

        // Helper function to auto-fetch minutes from timetable when date changes
        function updateTopicDate(idx, newDateVal) {
            if (!newDateVal) return;
            const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const selectedDayName = daysArr[new Date(newDateVal).getDay()];
            
            const curr = mySessions.find(s => s.assignmentId === activeSubjectId);
            let dynamicMins = 0;
            
            if (curr && window.teacherTimetable) {
                const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                const matchedClass = window.teacherTimetable.find(t => 
                    t.day === selectedDayName && 
                    norm(t.className) === norm(curr.className) && 
                    norm(t.section) === norm(curr.section) && 
                    norm(t.subject) === norm(curr.subject)
                );
                if (matchedClass) dynamicMins = parseInt(matchedClass.duration) || 0;
            }
            
            currentPlannerData[idx].completedDate = newDateVal;
            currentPlannerData[idx].completedMinutes = dynamicMins;
            
            const minBadge = document.getElementById(`sync-mins-${idx}`);
            if (minBadge) minBadge.innerText = `${dynamicMins}m`;
        }

            if(isDemoMode) { renderSyllabusExactMath(); return; }

      async function confirmDaySubmission() {
            const reasonBox = document.getElementById('revision-reason');
            const reason = reasonBox ? reasonBox.value.trim() : '';
            const selectedRevDate = document.getElementById('revision-date') ? document.getElementById('revision-date').value : '';
            
            const stagedTopics = currentPlannerData.filter(r => r.isDone && !r.savedToDb);
            
            // If they haven't ticked anything AND haven't written a revision reason, don't let them submit
            if (stagedTopics.length === 0 && !reason) {
                alert("Please tick at least one syllabus topic or write an Activity/Revision log before confirming.");
                return;
            }

            if(isDemoMode) {
                alert(`Simulation Success: Data locked.\nTopics: ${stagedTopics.length}\nRevision: ${reason || 'None'}`);
                closeModal('syllabus-modal'); return;
            }

            const btn = document.getElementById('confirm-day-btn');
            const origText = btn.innerText;
            btn.innerText = "Securing Data..."; btn.disabled = true;

            try {
                const todayISO = new Date().toISOString().split('T')[0];
                const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;
                
                // Process Syllabus Topics
                currentPlannerData.forEach(r => { 
                    if(r.isDone && !r.savedToDb) {
                        r.savedToDb = true; 
                        
                        // THE AUDIT TRAIL: Flag if the teacher backdated the topic
                        if (r.completedDate && r.completedDate < todayISO) {
                            r.isBackdated = true;
                            r.uploadedOn = todayISO;
                        }
                    }
                });
                
                // Build Update Payload
                const updatePayload = {
                    syllabusData: currentPlannerData,
                    unlockRequested: false,
                    isUnlocked: false,  // Consumes the Golden Ticket!
                    lastSaveLog: {
                        time: new Date().toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }),
                        user: safeName,
                        device: navigator.userAgent.includes('Mobile') ? 'Mobile' : 'Desktop'
                    }
                };

                // Process Revision Log (if any)
                if (reason) {
                    const revDateStr = selectedRevDate ? selectedRevDate : todayISO;
                    const logEntry = {
                        date: revDateStr,
                        reason: reason,
                        minutes: activeSessionMins,
                        loggedBy: safeName,
                        timestamp: new Date().getTime()
                    };
                    updatePayload.activityLogs = firebase.firestore.FieldValue.arrayUnion(logEntry);
                }
                
                try {
                    await getCollection("lesson_planners").doc(activeSubjectId).update(updatePayload);
                    
                    // This alert ONLY triggers if Firebase sends back a "Success" signal
                    alert(`✅ SYNC SUCCESSFUL\n\nCloud handshake complete. Your data was safely secured.`);
                    closeModal('syllabus-modal');
                    fetchTodayData(); 

                } catch (error) {
                    console.error("Firebase Sync Error:", error);
                    // This triggers if internet is cut, timed out, or blocked
                    alert(`🚨 CRITICAL SYNC FAILURE!\n\nYour internet connection failed to reach the server. \n\n⚠️ DO NOT CLOSE THIS TAB.\n\nPlease check your Wi-Fi/Data and try clicking 'Confirm' again. Your work is still held in the browser's temporary memory.`);
                    
                    // We RESET the button so they can try again without refreshing
                    btn.innerText = origText; 
                    btn.disabled = false;
                    return; // Stop the function here so the modal stays open!
                }
                closeModal('syllabus-modal');
                fetchTodayData(); 
            } catch(e) { 
                alert("Error saving data: " + e.message); 
            } finally {
                btn.innerText = origText; 
                btn.disabled = false;
            }
        }
