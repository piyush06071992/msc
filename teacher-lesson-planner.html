            if (isDemoMode) {
                currentPlannerData = getMockSyllabus();
                window.currentActivityLogs = [];
                renderSyllabusExactMath();
                return;
            }

            try {
                let pQuery = sb.from("lesson_planners")
                    .select("*")
                    .eq("branch_id", activeBranchId)
                    .eq("firestore_id", activeSubjectId);
                let aQuery = sb.from("lesson_planner_assignments")
                    .select("*")
                    .eq("branch_id", activeBranchId)
                    .eq("firestore_id", activeSubjectId);

                if (activeSessionId) {
                    pQuery = pQuery.eq("session_id", activeSessionId);
                    aQuery = aQuery.eq("session_id", activeSessionId);
                }

                const [pRes, aRes] = await Promise.all([pQuery.limit(1), aQuery.limit(1)]);
                if (pRes.error) throw pRes.error;
                if (aRes.error) throw aRes.error;

                let plannerRow = (pRes.data && pRes.data[0]) ? pRes.data[0] : null;
                if (!plannerRow && activeSessionId) {
                    const { data: fallbackP } = await sb.from("lesson_planners")
                        .select("*")
                        .eq("branch_id", activeBranchId)
                        .eq("firestore_id", activeSubjectId)
                        .limit(1);
                    plannerRow = fallbackP && fallbackP[0] ? fallbackP[0] : null;
                }

                let assignRow = (aRes.data && aRes.data[0]) ? aRes.data[0] : null;
                if (!assignRow && activeSessionId) {
                    const { data: fallbackA } = await sb.from("lesson_planner_assignments")
                        .select("*")
                        .eq("branch_id", activeBranchId)
                        .eq("firestore_id", activeSubjectId)
                        .limit(1);
                    assignRow = fallbackA && fallbackA[0] ? fallbackA[0] : null;
                }

                window.currentAssignment = assignRow ? {
                    ...parseJsonField(assignRow.raw_data),
                    ...assignRow,
                    targetDate: assignRow.target_date ?? assignRow.targetDate ?? ''
                } : {};

                const normalizedPlanner = plannerRow ? normalizePlannerRow(plannerRow) : null;
                activePlannerDbRowId = normalizedPlanner ? normalizedPlanner.dbId : null;

                if (!normalizedPlanner || !normalizedPlanner.syllabusData || normalizedPlanner.syllabusData.length === 0) {
                    document.getElementById('subject-pace-widget').innerHTML = '';

                    const reqBtn = document.getElementById('request-unlock-btn');
                    const confBtn = document.getElementById('confirm-day-btn');
                    const tabs = document.getElementById('tracker-tabs');
                    if (reqBtn) reqBtn.style.display = 'none';
                    if (confBtn) confBtn.style.display = 'none';
                    if (tabs) tabs.style.display = 'none';

                    return container.innerHTML = `
                        <div class="text-center py-20 text-rose-500 font-black uppercase text-xs tracking-widest">
                            Syllabus Not Defined by Admin
                            <br><br>
                            <span class="text-[9px] text-slate-400 normal-case tracking-normal">Please ask the Admin to upload the syllabus for this subject.</span>
                        </div>`;
                } else {
                    const tabs = document.getElementById('tracker-tabs');
                    if (tabs) tabs.style.display = 'flex';
                }

                currentPlannerData = normalizedPlanner.syllabusData;
                window.currentActivityLogs = normalizedPlanner.activityLogs || [];

                // --- 24-HOUR GOLDEN TICKET CHECK ---
                window.isSubjectUnlocked = normalizedPlanner.isUnlocked === true;
                if (window.isSubjectUnlocked && normalizedPlanner.unlockedAt) {
                    const hoursSinceUnlock = (Date.now() - normalizedPlanner.unlockedAt) / (1000 * 60 * 60);
                    if (hoursSinceUnlock >= 24) {
                        window.isSubjectUnlocked = false;
                        await sb.from("lesson_planners")
                            .update({
                                is_unlocked: false,
                                unlocked_at_ms: null,
                                updated_at: new Date().toISOString()
                            })
                            .eq("branch_id", activeBranchId)
                            .eq("firestore_id", activeSubjectId);
                    }
                }
                window.unlockRequested = normalizedPlanner.unlockRequested === true;
                window.lockedDateStr = normalizedPlanner.lockedDate || null;

                const currSession = mySessions.find(s => (s.plannerId || s.assignmentId) === activeSubjectId);
                const cName = currSession ? currSession.className : "";
                const sName = currSession ? currSession.section : "";
                const subName = currSession ? currSession.subject : "";

                // --- CONTINUOUS FORWARD CHAIN ANCHOR ---
                let lastLoggedDateStr = null;

                currentPlannerData.forEach(r => {
                    if (r.chapterStartDate && (!lastLoggedDateStr || r.chapterStartDate > lastLoggedDateStr)) lastLoggedDateStr = r.chapterStartDate;
                    if (r.isDone && r.completedDate && (!lastLoggedDateStr || r.completedDate > lastLoggedDateStr)) lastLoggedDateStr = r.completedDate;
                });
                if (window.currentActivityLogs) {
                    window.currentActivityLogs.forEach(log => {
                        const lDate = String(log.date || '').split('T')[0];
                        if (lDate && (!lastLoggedDateStr || lDate > lastLoggedDateStr)) lastLoggedDateStr = lDate;
                    });
                }

                const todayISO = getLocalTodayIso();

                let scanStartDate = new Date(todayISO + "T00:00:00");
                if (lastLoggedDateStr) {
                    scanStartDate = new Date(lastLoggedDateStr + "T00:00:00");
                    scanStartDate.setDate(scanStartDate.getDate() + 1);
                } else {
                    scanStartDate.setDate(scanStartDate.getDate() - 14);
                }

                window.catchUpDates = [];
                let iterDate = new Date(scanStartDate);
                const endD = new Date(todayISO + "T00:00:00");
                let revHtml = "";
                const dArr = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const normStr = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

                while (iterDate <= endD) {
                    const offset = iterDate.getTimezoneOffset() * 60000;
                    const curStr = (new Date(iterDate.getTime() - offset)).toISOString().split('T')[0];
                    const dayName = dArr[iterDate.getDay()];
                    const shortDate = iterDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });

                    const exclusion = checkDateExclusion(iterDate, cName, sName, subName);

                    let wasOnLeaveScan = window.myAbsences && window.myAbsences.some(a => {
                        if (a.date !== curStr) return false;
                        if (a.isFullDay) return true;
                        return normStr(a.className) === normStr(cName) && normStr(a.section) === normStr(sName) && normStr(a.subject) === normStr(subName);
                    });

                    let isWorkingDay = false;
                    let reason = "";
                    let mins = 0;

                    if (wasOnLeaveScan) {
                        reason = "Approved Leave";
                    } else if (exclusion.isExcluded) {
                        reason = exclusion.reason;
                    } else if (!isTimetableWorkingDay(iterDate, cName, sName, subName)) {
                        reason = "No Class Scheduled";
                    } else {
                        isWorkingDay = true;
                        const fullDayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][iterDate.getDay()];
                        const tMatch = (window.teacherTimetable || []).find(t => t.day === fullDayName && normStr(t.className) === normStr(cName) && normStr(t.section) === normStr(sName) && normStr(t.subject) === normStr(subName));
                        mins = tMatch ? parseInt(tMatch.duration) || activeSessionMins : activeSessionMins;
                    }

                    if (isWorkingDay) {
                        window.catchUpDates.push({ date: curStr, label: `${shortDate} (${dayName})`, mins: mins });
                        let alreadyLogged = (curStr === lastLoggedDateStr);

                        revHtml += `
                            <div class="bg-white border ${alreadyLogged ? 'border-blue-200' : 'border-amber-200'} rounded-xl p-3 shadow-sm transition-all">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-black ${alreadyLogged ? 'text-blue-700 bg-blue-50 border-blue-100' : 'text-amber-700 bg-amber-50 border-amber-100'} uppercase tracking-widest px-2 py-1 rounded border">${shortDate} (${dayName})</span>
                                    <div class="flex items-center gap-2">
                                        ${alreadyLogged ? `<span class="text-[8px] font-bold text-blue-500 uppercase">Logged</span>` : `<span class="text-[8px] font-black text-rose-500 uppercase animate-pulse">🔴 Pending</span>`}
                                        <span class="text-[9px] font-bold text-emerald-600 uppercase bg-emerald-50 px-2 py-0.5 rounded shadow-sm border border-emerald-100">🟢 ${mins} Mins</span>
                                    </div>
                                </div>
                                <textarea class="batch-rev-input w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs font-bold text-slate-700 outline-none focus:border-amber-500 focus:bg-white resize-none h-14 placeholder-slate-300 transition-all" placeholder="${window.activeReadOnlyReason ? 'Read Only: Cannot log new activities today.' : 'Optional details (leave blank to skip)...'}" data-date="${curStr}" data-mins="${mins}" ${window.activeReadOnlyReason ? 'disabled' : ''}></textarea>
                            </div>`;
                    } else {
                        revHtml += `
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 opacity-60 pointer-events-none">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">${shortDate} (${dayName})</span>
                                    <span class="text-[9px] font-bold text-slate-500 uppercase">⏸️ ${reason} (Auto-Exempt)</span>
                                </div>
                            </div>`;
                    }
                    iterDate.setDate(iterDate.getDate() + 1);
                }

                const revContainer = document.getElementById('revision-batch-container');
                if (revContainer) revContainer.innerHTML = revHtml || `<div class="text-center text-[10px] font-bold text-slate-400 p-4">No pending dates to log.</div>`;

                // Calculate Compliance Lock (2-DAY BUFFER)
                let unloggedPastDays = window.catchUpDates.filter(d => d.date < todayISO && d.date !== lastLoggedDateStr);
                window.complianceLocked = enableDailyBlock ? (unloggedPastDays.length > 2) : false;
                window.lwdDateStr = unloggedPastDays.length > 0 ? unloggedPastDays[0].date : todayISO;

                const reqBtn = document.getElementById('request-unlock-btn');
                const confBtn = document.getElementById('confirm-day-btn');

                if (window.activeReadOnlyReason) {
                    window.complianceLocked = true;
                    reqBtn.innerText = "🔒 READ ONLY: " + window.activeReadOnlyReason;
                    reqBtn.className = "w-full bg-slate-100 text-slate-500 font-black py-3 rounded-xl uppercase tracking-widest text-[10px] border border-slate-200 cursor-default";
                    reqBtn.disabled = true;
                    reqBtn.style.display = 'block';
                    if (confBtn) confBtn.style.display = 'none';
                } else if (window.isSubjectUnlocked || !globalAutoLock) {
                    reqBtn.innerText = "🔓 Unlocked! You can make corrections.";
                    reqBtn.className = "w-full bg-emerald-50 text-emerald-600 font-black py-3 rounded-xl uppercase tracking-widest text-[10px] border border-emerald-200 cursor-default";
                    reqBtn.disabled = true;
                    reqBtn.style.display = 'block';
                    if (confBtn) confBtn.style.display = 'block';
                } else if (window.complianceLocked || window.unlockRequested) {
                    reqBtn.disabled = true;
                    reqBtn.style.display = 'block';
                    if (confBtn) confBtn.style.display = 'none';

                    if (window.unlockRequested) {
                        const displayDate = window.lockedDateStr || window.lwdDateStr || "Unknown Date";
                        reqBtn.innerText = "Unlock Requested for " + displayDate + " ⏳";
                        reqBtn.className = "w-full bg-amber-50 text-amber-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-amber-200 cursor-not-allowed";
                    } else {
                        reqBtn.innerText = "System Locked - Auto-Notifying Admin... ⏳";
                        reqBtn.className = "w-full bg-rose-600 text-white font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] shadow-lg animate-pulse cursor-not-allowed";
                        autoRequestUnlock(window.lwdDateStr);
                    }
                } else {
                    reqBtn.innerText = "Made a Mistake? Request Admin Unlock";
                    reqBtn.className = "w-full bg-rose-50 text-rose-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-rose-200 hover:bg-rose-100 transition-all";
                    reqBtn.disabled = false;
                    reqBtn.style.display = 'block';
                    if (confBtn) confBtn.style.display = 'block';
                }

                renderSyllabusExactMath();
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="text-center py-20 text-rose-500 font-black uppercase text-xs tracking-widest">Error loading syllabus: ${e.message}</div>`;
            }
        }

        function getScheduleSnapshotForDate(dateIso) {
            if (!window.historyOverrides || window.historyOverrides.length === 0) {
                return typeof timetableData !== 'undefined' ? timetableData : (window.fullTimetable || window.teacherTimetable || []);
            }

            const exactOverride = window.historyOverrides.find(h => h.date === dateIso && (h.type === "DAILY_OVERRIDE" || h.type === "EXAM_OVERRIDE"));
            if (exactOverride && exactOverride.schedule) return exactOverride.schedule;

            const masterSnapshots = window.historyOverrides.filter(h => h.type === "LIVE_MASTER_UPDATE" || h.type === "APPLIED_MASTER" || h.type === "FUTURE_MASTER");
            const sortedMasters = masterSnapshots.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));

            const validMaster = sortedMasters.find(h => String(h.date || '') <= dateIso);
            if (validMaster && validMaster.schedule) return validMaster.schedule;

            return typeof timetableData !== 'undefined' ? timetableData : (window.fullTimetable || window.teacherTimetable || []);
        }

        function checkDateExclusion(dateObj, className, sectionName, subjectName) {
            if (dateObj.getDay() === 0) return { isExcluded: true, reason: "Sunday (Weekly Off)" };

            const offset = dateObj.getTimezoneOffset() * 60000;
            const curStr = (new Date(dateObj.getTime() - offset)).toISOString().split('T')[0];
            const checkDate = new Date(curStr); checkDate.setHours(0, 0, 0, 0);
            const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

            for (let h of holidaysData) {
                if (!h.startDate || h.suspendClasses === false) continue;
                const hStart = new Date(h.startDate); hStart.setHours(0, 0, 0, 0);
                const hEnd = new Date(h.endDate || h.startDate); hEnd.setHours(23, 59, 59, 999);

                if (checkDate >= hStart && checkDate <= hEnd) {
                    const targetCls = `${norm(className)}|${norm(sectionName)}`;
                    const matchesClass = (h.targetClasses || []).some(tc => {
                        if (tc === 'ALL') return true;
                        const parts = String(tc).split('|');
                        const tcNorm = norm(parts[0]) + (parts[1] ? '|' + norm(parts[1]) : '');
                        if (parts.length > 1) return tcNorm === targetCls;
                        return norm(parts[0]) === norm(className);
                    });

                    if (matchesClass) {
                        if (h.isFullDay) {
                            return { isExcluded: true, reason: h.reason || "Holiday" };
                        } else if (h.startTime && h.endTime) {
                            const scheduleToCheck = getScheduleSnapshotForDate(curStr);
                            const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                            const dayName = daysArr[dateObj.getDay()];

                            let classSlots = scheduleToCheck.filter(t =>
                                t.day === dayName && norm(t.className) === norm(className) && norm(t.section) === norm(sectionName) && norm(t.subject) === norm(subjectName)
                            );

                            if (classSlots.length === 0) {
                                const masterArray = typeof timetableData !== 'undefined' ? timetableData : (window.fullTimetable || window.teacherTimetable || []);
                                classSlots = masterArray.filter(t =>
                                    t.day === dayName && norm(t.className) === norm(className) && norm(t.section) === norm(sectionName) && norm(t.subject) === norm(subjectName)
                                );
                            }

                            if (classSlots.length > 0) {
                                const [hsh, hsm] = String(h.startTime).split(':').map(Number);
                                const [heh, hem] = String(h.endTime).split(':').map(Number);
                                const hStartMins = hsh * 60 + hsm;
                                const hEndMins = heh * 60 + hem;

                                const isOverlapping = classSlots.some(slot => {
                                    if (slot.start24 && slot.end24) {
                                        const [sh, sm] = String(slot.start24).split(':').map(Number);
                                        const [eh, em] = String(slot.end24).split(':').map(Number);
                                        return ((sh * 60 + sm) < hEndMins && (eh * 60 + em) > hStartMins);
                                    }
                                    return false;
                                });

                                if (isOverlapping) return { isExcluded: true, reason: (h.reason || "Holiday") + " (Half Day)" };
                            }
                        }
                    }
                }
            }

            const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = daysArr[checkDate.getDay()];
            const scheduleToCheck = getScheduleSnapshotForDate(curStr);

            const masterSlot = scheduleToCheck.find(t =>
                t.day === dayName && norm(t.className) === norm(className) && norm(t.section) === norm(sectionName) && norm(t.subject) === norm(subjectName)
            );

            if (!masterSlot) return { isExcluded: true, reason: "Class Not Scheduled" };
            if (masterSlot.remark && String(masterSlot.remark).toLowerCase().includes("doubt session")) return { isExcluded: true, reason: "Doubt Session" };

            return { isExcluded: false, reason: "" };
        }

        function isTimetableWorkingDay(dateObj, className, sectionName, subjectName) {
            if (dateObj.getDay() === 0) return false;

            const offset = dateObj.getTimezoneOffset() * 60000;
            const curStr = (new Date(dateObj.getTime() - offset)).toISOString().split('T')[0];
            const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

            const scheduleToCheck = getScheduleSnapshotForDate(curStr);
            const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = daysArr[dateObj.getDay()];

            return scheduleToCheck.some(t =>
                t.day === dayName &&
                norm(t.className) === norm(className) &&
                norm(t.section) === norm(sectionName) &&
                norm(t.subject) === norm(subjectName)
            );
        }

        function formatDateString(iso) {
            if (!iso) return '--';
            const [y, m, d] = String(iso).split('-');
            const dObj = new Date(y, (m || 1) - 1, d || 1);
            return dObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        }

        function renderSyllabusExactMath() {
            const currSession = mySessions.find(s => (s.plannerId || s.assignmentId) === activeSubjectId) || {};
            const cName = currSession.className || "";
            const sName = currSession.section || "";
            const subName = currSession.subject || "";

            const chNamesList = [...new Set(currentPlannerData.map(r => r["CHAPTER NAME"]))];
            let totalChapters = chNamesList.length;
            let completedChapters = 0;
            chNamesList.forEach(ch => {
                const rws = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                if (rws.length > 0 && rws.every(r => r.isDone)) completedChapters++;
            });
            let progressPct = totalChapters === 0 ? 0 : Math.round((completedChapters / totalChapters) * 100);

            const chMap = new Map();
            currentPlannerData.forEach(r => {
                if (!chMap.has(r['CHAPTER NAME'])) {
                    chMap.set(r['CHAPTER NAME'], { days: parseInt(r['Target days for chapter']) || 0, mins: parseInt(r['Target Minutes For Chapter']) || 0, isStarted: false });
                }
                if (r.chapterStartDate || r.isDone) chMap.get(r['CHAPTER NAME']).isStarted = true;
            });

            let totalTargetDaysAll = 0, totalTargetMinsAll = 0;
            let completedTargetDays = 0, completedTargetMins = 0;
            let completedActualMins = 0;
            let chapterRanges = [];
            let subjectUniqueWorkingDays = new Set();

            let firstStartDate = null;
            let totalSyllabusCoveredMins = 0;
            let standardClassDuration = parseInt(currentPlannerData[0]?.['Standard Class Duration']) || activeSessionMins;

            let activityLogs = window.currentActivityLogs || [];
            let dailyLogSums = {};

            let extraActivityDays = 0;
            let activityMinsTotal = 0;
            let independentRevisionDates = new Set();
            let independentLogsForUI = [];
            let activityHtml = "";

            chMap.forEach(v => { totalTargetDaysAll += v.days; totalTargetMinsAll += v.mins; });

            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = '';

            const chNames = Array.from(chMap.keys());
            let htmlContent = "";
            let subjectExclusionsHtml = "";

            let firstStartStr = null;
            currentPlannerData.forEach(r => {
                if (r.chapterStartDate && (!firstStartStr || r.chapterStartDate < firstStartStr)) {
                    firstStartStr = r.chapterStartDate;
                }
            });

            if (firstStartStr && !isDemoMode) {
                let stDate = new Date(firstStartStr);
                stDate.setHours(0, 0, 0, 0);
                let endDate = new Date();
                endDate.setHours(23, 59, 59, 999);
                let exList = [];
                let count = 1;

                while (stDate <= endDate) {
                    let exc = checkDateExclusion(stDate, cName, sName, subName);
                    if (exc.isExcluded) {
                        exList.push({
                            sno: count++,
                            date: stDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
                            reason: exc.reason
                        });
                    }
                    stDate.setDate(stDate.getDate() + 1);
                }

                if (exList.length > 0) {
                    let listHtml = exList.map(x => `
                        <div class="flex justify-between items-center bg-white p-3 sm:p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                            <div class="flex items-center gap-3 sm:gap-4">
                                <span class="text-[10px] sm:text-[11px] font-black bg-rose-100 text-rose-700 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg w-8 text-center border border-rose-200 shadow-sm">${x.sno}</span>
                                <span class="text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-widest">${x.date}</span>
                            </div>
                            <span class="text-[9px] sm:text-[10px] font-black uppercase text-rose-500 tracking-widest text-right max-w-[50%] sm:max-w-[60%] truncate" title="${x.reason}">${x.reason}</span>
                        </div>
                    `).join('');

                    subjectExclusionsHtml = `
                    <details class="bg-rose-50/30 rounded-[1.5rem] sm:rounded-[2rem] border border-rose-100 shadow-sm overflow-hidden mb-6 sm:mb-8 group/excl">
                        <summary class="p-5 sm:p-6 font-black text-rose-800 text-sm sm:text-base uppercase tracking-widest cursor-pointer outline-none flex justify-between items-center select-none hover:bg-rose-50 transition-colors">
                            <div class="flex items-center gap-3 sm:gap-4">
                                <span class="text-xl sm:text-2xl drop-shadow-sm">🛑</span>
                                Excluded Days Till Current Date
                            </div>
                            <span class="text-[10px] sm:text-[11px] font-black px-4 sm:px-5 py-2 sm:py-2.5 rounded-full bg-rose-100 text-rose-700 shadow-sm border border-rose-200">Total: ${exList.length}</span>
                        </summary>
                        <div class="bg-rose-50/50 border-t border-rose-100 max-h-64 sm:max-h-80 overflow-y-auto custom-scroll">
                            ${listHtml}
                        </div>
                    </details>`;
                }
            }

            chNames.forEach(ch => {
                const rows = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                const doneR = rows.filter(r => r.isDone);
                const isStarted = rows[0].chapterStartDate || doneR.length > 0;
                const isCompleted = doneR.length === rows.length && rows.length > 0;
                const targetDays = parseInt(rows[0]?.['Target days for chapter']) || 0;
                const targetMins = parseInt(rows[0]?.['Target Minutes For Chapter']) || 0;

                if (isCompleted) {
                    totalSyllabusCoveredMins += targetMins;
                } else {
                    let partialMins = 0;
                    doneR.forEach(r => { partialMins += parseFloat(r.completedMinutes) || 0; });
                    totalSyllabusCoveredMins += partialMins;
                }

                let chStartStr = rows[0]?.chapterStartDate;
                let chStart = chStartStr ? new Date(chStartStr) : null;

                if (chStart && (!firstStartDate || chStart < firstStartDate)) {
                    firstStartDate = chStart;
                }

                const compDates = doneR.map(r => new Date(r.completedDate)).filter(d => !isNaN(d));
                const chEnd = (isCompleted && compDates.length) ? new Date(Math.max(...compDates)) : null;

                let gapHtml = "", actualDaysTaken = 0, actualMins = 0;
                let excludedHolidays = [];
                let chapterDates = [];

                if (chStart) {
                    let effectiveEnd = chEnd ? new Date(chEnd) : new Date();
                    effectiveEnd.setHours(23, 59, 59, 999);
                    chapterRanges.push({ start: new Date(chStart), end: effectiveEnd });

                    let validTickDates = new Set(doneR.map(r => r.completedDate).filter(d => d));
                    let cur = new Date(chStart);
                    let finish = new Date(effectiveEnd);

                    while (cur <= finish) {
                        const offset = cur.getTimezoneOffset() * 60000;
                        const curStr = (new Date(cur.getTime() - offset)).toISOString().split('T')[0];

                        const exclusion = checkDateExclusion(cur, cName, sName, subName);

                        if (exclusion.isExcluded) {
                            const shortDate = cur.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
                            excludedHolidays.push({ date: shortDate, reason: exclusion.reason });
                        } else {
                            if (validTickDates.has(curStr) || isTimetableWorkingDay(cur, cName, sName, subName)) {
                                actualDaysTaken++;
                                chapterDates.push(curStr);

                                const scheduleToCheck = getScheduleSnapshotForDate(curStr);
                                const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                                const dayName = daysArr[cur.getDay()];
                                const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                                const slot = scheduleToCheck.find(t => t.day === dayName && norm(t.className) === norm(cName) && norm(t.section) === norm(sName) && norm(t.subject) === norm(subName));

                                let dailyMins = 0;
                                if (isDemoMode) {
                                    dailyMins = 90;
                                } else if (slot && slot.duration) {
                                    dailyMins = parseInt(slot.duration);
                                } else {
                                    dailyMins = parseInt(rows[0]?.['Standard Class Duration']) || activeSessionMins;
                                }
                                actualMins += dailyMins;
                            }
                        }
                        cur.setDate(cur.getDate() + 1);
                    }

                    if (isCompleted) {
                        completedTargetDays += targetDays;
                        completedTargetMins += targetMins;
                        completedActualMins += actualMins;
                        chapterDates.forEach(d => subjectUniqueWorkingDays.add(d));

                        let dayGap = targetDays - actualDaysTaken;
                        let minGap = targetMins - actualMins;

                        gapHtml = `
                            <div class="flex flex-wrap gap-2 mt-2">
                                <span class="text-[9px] font-black px-3 py-1 rounded-full border ${dayGap >= 0 ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-600 border-rose-200'}">
                                    ${dayGap >= 0 ? '📅 ON TRACK' : '⚠️ LATE'}: ${dayGap > 0 ? '+' : ''}${dayGap} Days
                                </span>
                                <span class="text-[9px] font-black px-3 py-1 rounded-full border ${minGap >= 0 ? 'bg-teal-50 text-teal-600 border-teal-100' : 'bg-purple-50 text-purple-600 border-purple-200'}">
                                    ${minGap >= 0 ? '⏱️ EFFICIENT' : '💪 EXTRA EFFORT'}: ${minGap > 0 ? '+' : ''}${minGap}m
                                </span>
                            </div>`;
                    }
                }

                let badge = isCompleted ? `<span class="bg-emerald-500 text-white px-3 py-1 rounded-md text-[9px] font-black uppercase">✓ COMPLETED</span>`
                    : (isStarted ? `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-md text-[9px] font-black uppercase">ONGOING</span>`
                        : `<span class="bg-slate-200 text-slate-600 px-3 py-1 rounded-md text-[9px] font-black uppercase">PENDING</span>`);

                const isLocked = window.activeReadOnlyReason ? true : ((!window.isSubjectUnlocked && globalAutoLock) && (isCompleted || window.complianceLocked || window.unlockRequested));
                const blockInteract = (!isStarted || isLocked) ? 'opacity-50 pointer-events-none' : (isCompleted ? 'bg-amber-50/30' : '');

                let contentHTML = '';
                const safeChName = ch.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const domSafeCh = ch.replace(/[^a-zA-Z0-9]/g, '');

                if (!isStarted) {
                    if (isLocked) {
                        contentHTML += `
                        <div class="p-6 text-center bg-rose-50/50 border-t border-slate-200 relative z-10 shadow-sm">
                            <p class="text-[10px] font-black text-rose-600 uppercase tracking-widest mb-2">Chapter Locked</p>
                            <p class="text-[9px] font-bold text-slate-500 uppercase">${window.activeReadOnlyReason ? 'Cannot start chapters on read-only days.' : 'You must clear pending logs or request an unlock before starting a new chapter.'}</p>
                        </div>`;
                    } else {
                        const todayISO = getLocalTodayIso();
                        let minDate = window.lwdDateStr || todayISO;
                        if (window.lockedDateStr && window.lockedDateStr < minDate) minDate = window.lockedDateStr;

                        const startOptions = window.catchUpDates && window.catchUpDates.length > 0
                            ? window.catchUpDates.map(d => `<option value="${d.date}" ${d.date === minDate ? 'selected' : ''}>${d.label}</option>`).join('')
                            : `<option value="${todayISO}">Today (${todayISO})</option>`;

                        contentHTML += `
                        <div class="p-6 text-center bg-blue-50/50 border-t border-slate-200 relative z-10 shadow-sm">
                            <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-3">Chapter topics are locked until chapter is started</p>
                            <div class="flex flex-col sm:flex-row justify-center items-center gap-3">
                                <div class="flex flex-col text-left">
                                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1">Select Start Date</span>
                                    <select id="start-date-${domSafeCh}" class="text-[11px] p-2.5 border border-blue-300 rounded-xl outline-none font-bold text-slate-700 shadow-sm bg-white cursor-pointer min-w-[140px]">
                                        ${startOptions}
                                    </select>
                                </div>
                                <button onclick="startChapter('${safeChName}', document.getElementById('start-date-${domSafeCh}').value)" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-black uppercase text-[11px] tracking-widest shadow-lg hover:bg-blue-700 transition-all pointer-events-auto sm:mt-4">▶ Start Chapter</button>
                            </div>
                        </div>`;
                    }
                }

                let timelineEvents = [];

                rows.forEach(r => {
                    const absIdx = currentPlannerData.indexOf(r);
                    const safeLec = r['LECTURE NUMBER'] != null ? String(r['LECTURE NUMBER']).padStart(4, '0') : '0000';
                    const displayLec = r['LECTURE NUMBER'] || '--';

                    if (r.isDone && r.completedDate) {
                        timelineEvents.push({
                            type: 'TOPIC',
                            dateStr: r.completedDate,
                            sortKey: r.completedDate + "_1_" + safeLec,
                            html: `
                                <div class="flex items-center justify-between p-4 bg-white border-b border-slate-100">
                                    <div class="pr-4">
                                        <div class="text-sm font-bold text-slate-800 leading-tight">${r['SUBTOPICS']}</div>
                                        <div class="text-[10px] font-black text-emerald-600 uppercase mt-1 tracking-widest">Lecture ${displayLec} • ${formatDateString(r.completedDate)}</div>
                                    </div>
                                    <div id="tick-container-${absIdx}">
                                        ${window.isSubjectUnlocked ? `<div class="flex items-center gap-2 justify-end pointer-events-auto"><span class="text-[9px] font-bold text-rose-500 uppercase">Untick to Fix ➔</span><input type="checkbox" class="topic-cb w-5 h-5 accent-blue-600 cursor-pointer shadow-sm" data-idx="${absIdx}" checked onchange="previewUntick(this, ${absIdx})"></div>` : `<div class="text-right"><span class="text-emerald-500 font-black text-[10px] uppercase">✓ LOGGED</span><p class="text-[9px] font-bold text-slate-400 mt-1 uppercase">${Math.floor(parseFloat(r.completedMinutes) || 0)} Mins</p></div>`}
                                    </div>
                                </div>`
                        });
                    } else {
                        const lockState = (!isStarted || isLocked) ? 'disabled class="topic-cb w-5 h-5 accent-slate-300 cursor-not-allowed opacity-50"' : 'class="topic-cb w-5 h-5 accent-blue-600 cursor-pointer shadow-sm"';

                        timelineEvents.push({
                            type: 'PENDING_TOPIC',
                            sortKey: "9999-12-31_1_" + safeLec,
                            html: `
                                <div class="flex items-center justify-between p-4 bg-white border-b border-slate-100">
                                    <div class="pr-4">
                                        <div class="text-sm font-bold text-slate-400 uppercase tracking-tight leading-tight">${r['SUBTOPICS']}</div>
                                        <div class="text-[10px] font-black text-slate-400 uppercase mt-1 tracking-widest">Lecture ${displayLec}</div>
                                    </div>
                                    <div id="tick-container-${absIdx}">
                                        <input type="checkbox" data-idx="${absIdx}" onchange="previewTick(this, ${absIdx})" ${lockState}>
                                    </div>
                                </div>`
                        });
                    }
                });

                if (window.currentActivityLogs && chStart) {
                    let cEndD = chEnd ? new Date(chEnd) : new Date();
                    cEndD.setHours(23, 59, 59, 999);
                    window.currentActivityLogs.forEach(log => {
                        let logD = new Date(log.date); logD.setHours(12, 0, 0, 0);
                        if (logD >= chStart && logD <= cEndD) {
                            timelineEvents.push({
                                type: 'REVISION',
                                sortKey: log.date + "_2_0000",
                                html: `
                                    <div class="flex justify-between items-center bg-amber-50/40 p-4 border-b border-amber-100/50">
                                        <div class="flex gap-4 items-center">
                                            <span class="text-[9px] font-black text-amber-600 bg-white border border-amber-200 px-2.5 py-1 rounded-md shadow-sm uppercase">${formatDateString(log.date)}</span>
                                            <div>
                                                <div class="text-xs font-bold text-amber-900 uppercase leading-snug">🎯 Activity: ${log.reason}</div>
                                                <div class="text-[8px] text-slate-400 font-bold uppercase mt-0.5">Logged By: ${log.loggedBy}</div>
                                            </div>
                                        </div>
                                        <div class="text-[10px] font-black text-amber-700 bg-white border border-amber-200 px-3 py-1 rounded-xl shadow-sm">${Math.floor(log.minutes)} Mins</div>
                                    </div>`
                            });
                        }
                    });
                }

                if (chStart) {
                    let scanDate = new Date(chStart);
                    let finalLimitDate = chEnd ? new Date(chEnd) : new Date();
                    finalLimitDate.setHours(23, 59, 59, 999);
                    let validTickDates = new Set(doneR.map(r => r.completedDate).filter(d => d));

                    while (scanDate <= finalLimitDate) {
                        const offset = scanDate.getTimezoneOffset() * 60000;
                        let scanIso = (new Date(scanDate.getTime() - offset)).toISOString().split('T')[0];
                        const hasTickToday = validTickDates.has(scanIso);
                        const hasActivityToday = (window.currentActivityLogs || []).some(log => String(log.date || '').split('T')[0] === scanIso);
                        const exclusion = checkDateExclusion(scanDate, cName, sName, subName);

                        if (exclusion.isExcluded) {
                            timelineEvents.push({
                                type: 'EXCLUSION',
                                sortKey: scanIso + "_0_0000",
                                html: `
                                    <div class="flex items-center gap-4 p-3 bg-rose-50/40 text-rose-700 border-b border-rose-100 text-xs font-bold uppercase tracking-widest pl-6">
                                        <span class="bg-white border border-rose-200 text-rose-600 text-[9px] font-black px-2.5 py-1 rounded-md shadow-sm">${formatDateString(scanIso)}</span>
                                        <span class="text-rose-500 font-black">🛑 EXCLUDED DAY:</span> ${exclusion.reason}
                                    </div>`
                            });
                        } else if (!hasTickToday && !hasActivityToday) {
                            if (!isTimetableWorkingDay(scanDate, cName, sName, subName)) {
                                if (scanDate >= new Date('2026-06-02T00:00:00')) {
                                    timelineEvents.push({
                                        type: 'EXCLUSION',
                                        sortKey: scanIso + "_0_0000",
                                        html: `
                                            <div class="flex items-center gap-4 p-3 bg-slate-50 text-slate-400 border-b border-slate-100 text-xs font-bold uppercase tracking-widest pl-6">
                                                <span class="bg-white border border-slate-200 text-[9px] font-black px-2.5 py-1 rounded-md shadow-sm">${formatDateString(scanIso)}</span>
                                                <span class="opacity-60">🚫 No Alotted Class as per Timetable Routine</span>
                                            </div>`
                                    });
                                }
                            } else {
                                const normStr2 = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                                let wasOnLeaveScan = window.myAbsences && window.myAbsences.some(a => {
                                    if (a.date !== scanIso) return false;
                                    if (a.isFullDay) return true;
                                    return normStr2(a.className) === normStr2(cName) && normStr2(a.section) === normStr2(sName) && normStr2(a.subject) === normStr2(subName);
                                });

                                if (wasOnLeaveScan) {
                                    timelineEvents.push({
                                        type: 'LEAVE',
                                        sortKey: scanIso + "_0_0001",
                                        html: `
                                            <div class="flex items-center gap-4 p-3 bg-amber-50/40 text-amber-700 border-b border-amber-100 text-xs font-bold uppercase tracking-widest pl-6">
                                                <span class="bg-white border border-amber-200 text-amber-600 text-[9px] font-black px-2.5 py-1 rounded-md shadow-sm">${formatDateString(scanIso)}</span>
                                                <span class="text-amber-500 font-black">⏸️ ON LEAVE:</span> Substitute Did Not Log Activity
                                            </div>`
                                    });
                                } else {
                                    timelineEvents.push({
                                        type: 'MISSING',
                                        sortKey: scanIso + "_0_0002",
                                        html: `
                                            <div class="flex items-center gap-4 p-3 bg-orange-50/50 text-orange-800 border-b border-orange-100 text-xs font-bold uppercase tracking-widest pl-6">
                                                <span class="bg-white border border-orange-200 text-orange-700 text-[9px] font-black px-2.5 py-1 rounded-md shadow-sm">${formatDateString(scanIso)}</span>
                                                <span class="text-orange-600 font-black">❗ NOT FILLED:</span> Class Scheduled, No Entry Logged
                                            </div>`
                                    });
                                }
                            }
                        }
                        scanDate.setDate(scanDate.getDate() + 1);
                    }
                }

                timelineEvents.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

                contentHTML += `<div class="${blockInteract} bg-white border-t border-slate-100 divide-y divide-slate-100">` +
                    timelineEvents.map(e => e.html).join('') +
                    `</div>`;

                let excludedHtml = '<span class="font-bold mt-1">None</span>';
                if (chStart) {
                    let calcDate = new Date(chStart);
                    let finalLimit = chEnd ? new Date(chEnd) : new Date();
                    let counterHols = [];
                    while (calcDate <= finalLimit) {
                        const exc = checkDateExclusion(calcDate, cName, sName, subName);
                        if (exc.isExcluded) {
                            counterHols.push({ date: calcDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }), reason: exc.reason });
                        }
                        calcDate.setDate(calcDate.getDate() + 1);
                    }
                    if (counterHols.length > 0) {
                        excludedHtml = `<span class="font-black mt-1 text-lg leading-none text-rose-600">${counterHols.length}</span><div class="flex flex-col gap-1 mt-2 items-center w-full px-2 max-h-32 overflow-y-auto custom-scroll">` + counterHols.map(h => `<div class="text-[9px] bg-rose-50 text-rose-700 px-2 py-1.5 rounded-lg border border-rose-200 w-full leading-tight shadow-sm" title="${h.reason}"><b>${h.date}</b><br><span class="opacity-70">${h.reason}</span></div>`).join('') + `</div>`;
                    }
                }

                htmlContent += `
                    <details class="bg-[#f8f9fa] border border-slate-200 rounded-xl mb-4 overflow-hidden shadow-sm group">
                        <summary class="bg-${isCompleted ? 'slate-100' : 'slate-50'} text-slate-800 p-4 flex justify-between items-center cursor-pointer select-none outline-none">
                            <div><span class="font-black text-base uppercase tracking-tight text-slate-900">${ch} <span class="text-sm ml-2 text-slate-500 font-bold">(${Math.round((doneR.length / rows.length) * 100)}%)</span></span>
                                <div class="flex gap-4 mt-1 text-[9px] font-bold text-slate-400 uppercase items-center"><span>Target: ${targetDays} Days / ${targetMins}m</span>${gapHtml}</div>
                            </div>
                            ${badge}
                        </summary>
                        <div class="grid grid-cols-2 bg-white text-[11px] font-black text-slate-500 text-center border-y uppercase">
                            <div class="p-3 border-r border-b border-slate-100 flex flex-col items-center justify-start"><span class="text-[8px] text-slate-400">Start Date</span><span class="text-slate-900 font-bold mt-1">${chStart ? chStart.toLocaleDateString('en-GB') : '--'}</span></div>
                            <div class="p-3 border-b border-slate-100 flex flex-col items-center justify-start"><span class="text-[8px] text-slate-400">End Date</span><span class="text-slate-900 font-bold mt-1">${(isCompleted && chEnd) ? chEnd.toLocaleDateString('en-GB') : '--'}</span></div>
                            <div class="p-3 border-r border-slate-100 flex flex-col items-center justify-start text-rose-500"><span class="text-[8px] opacity-70">Excluded Days</span>${excludedHtml}</div>
                            <div class="p-3 flex flex-col items-center justify-start text-blue-600"><span class="text-[8px] opacity-70">Actual Time Taken</span><span class="font-bold text-lg leading-none mt-1">${actualDaysTaken}d | ${actualMins}m</span></div>
                        </div>
                        ${contentHTML}
                    </details>`;
            });

            if (activityLogs.length > 0) {
                activityLogs.forEach(log => {
                    let logD = new Date(log.date);
                    logD.setHours(12, 0, 0, 0);
                    let dStr = logD.toISOString().split('T')[0];

                    let isInsideChapter = chapterRanges.some(range => logD >= range.start && logD <= range.end);

                    if (!isInsideChapter) {
                        independentLogsForUI.push(log);
                        if (isTimetableWorkingDay(logD, cName, sName, subName)) {
                            let mins = parseFloat(log.minutes) || 0;
                            dailyLogSums[dStr] = (dailyLogSums[dStr] || 0) + mins;

                            if (!independentRevisionDates.has(dStr)) {
                                extraActivityDays++;
                                independentRevisionDates.add(dStr);
                            }
                        }
                    }
                });

                const daysArr = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                Object.keys(dailyLogSums).forEach(dStr => {
                    let logD = new Date(dStr);
                    let dayName = daysArr[logD.getDay()];
                    let ttMins = 0;
                    (window.fullTimetable || []).forEach(t => {
                        if (t.day === dayName && t.className === cName && t.section === sName && t.subject === subName) {
                            ttMins += (parseInt(t.duration) || 0);
                        }
                    });
                    if (isDemoMode) ttMins = 90;
                    activityMinsTotal += Math.min(dailyLogSums[dStr], ttMins > 0 ? ttMins : dailyLogSums[dStr]);
                });

                if (independentLogsForUI.length > 0) {
                    let logRows = independentLogsForUI.map(log => `
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center p-5 sm:p-6 bg-white border-b border-amber-50 last:border-0 hover:bg-amber-50/50 transition-colors gap-3 sm:gap-0">
                            <div class="flex gap-4 sm:gap-6 items-start sm:items-center">
                                <span class="text-[10px] sm:text-[11px] font-black text-amber-600 bg-amber-100 px-4 py-2 rounded-lg uppercase tracking-widest shrink-0 border border-amber-200 shadow-sm">${formatDateString(log.date)}</span>
                                <div>
                                    <div class="text-xs sm:text-sm font-bold text-slate-800 uppercase leading-snug">🎯 Activity: ${log.reason}</div>
                                    <div class="text-[9px] sm:text-[10px] text-slate-500 mt-1 uppercase font-bold">By: ${log.loggedBy}</div>
                                </div>
                            </div>
                            <div class="text-[11px] sm:text-xs font-black text-amber-700 bg-white border border-amber-200 px-5 py-2.5 rounded-xl self-start sm:self-auto shadow-sm">${Math.floor(log.minutes)} Mins</div>
                        </div>`).join('');

                    activityHtml = `
                        <details class="bg-[#fffbeb] border border-amber-200 rounded-2xl overflow-hidden mb-4 shadow-sm group">
                            <summary class="p-4 bg-amber-100/50 border-b border-amber-200 flex flex-col md:flex-row justify-between md:items-center cursor-pointer select-none outline-none gap-4 md:gap-0 hover:bg-amber-100 transition-colors">
                                <div class="flex items-start md:items-center gap-4 md:gap-5"><span class="text-xl md:mt-0">🎯</span>
                                    <div><h4 class="font-black text-amber-900 uppercase text-base tracking-tight">Between-Chapter Revisions</h4><div class="text-[9px] font-bold text-amber-600 uppercase mt-1 bg-white px-2 py-1 rounded w-fit border border-amber-200 shadow-sm">Independent Sessions</div></div>
                                </div>
                                <span class="text-[10px] font-black px-4 py-2 rounded-full bg-amber-500 text-white shadow-md self-start md:self-auto border border-amber-600">${independentLogsForUI.length} LOGS</span>
                            </summary>
                            <div class="divide-y divide-amber-100/50">${logRows}</div>
                        </details>`;
                }
            }

            let totalUniqueDaysSpent = subjectUniqueWorkingDays.size + extraActivityDays;
            let totalOverallDayGap = completedTargetDays - totalUniqueDaysSpent;
            let totalOverallMinGap = completedTargetMins - (completedActualMins + Math.floor(activityMinsTotal));

            let showVariance = completedTargetDays > 0 || (typeof independentRevisionDates !== 'undefined' && independentRevisionDates.size > 0);

            let minsLeft = totalTargetMinsAll - totalSyllabusCoveredMins;
            if (minsLeft < 0) minsLeft = 0;
            let classesLeft = standardClassDuration > 0 ? Math.ceil(minsLeft / standardClassDuration) : 0;

            let targetDateFormatted = window.currentAssignment?.targetDate ? new Date(window.currentAssignment.targetDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Not Set';
            let firstStartFormatted = firstStartDate ? new Date(firstStartDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Not Started';

            const paceWidget = document.getElementById('subject-pace-widget');
            if (paceWidget) {
                paceWidget.className = "bg-[#fdfefe] border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm";
                paceWidget.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <b class='text-slate-800 text-sm uppercase tracking-widest'>Subject Overall Pace</b>
                    </div>
                    <div class='text-[10px] sm:text-[11px] mt-3 font-black text-emerald-600 uppercase tracking-widest'>Total Chapters Completed (${completedChapters} out of ${totalChapters} Chapters) - ${progressPct}%</div>
                    <div class='w-full bg-slate-100 h-2 rounded-full mt-2 mb-4 overflow-hidden'><div style='width: ${progressPct}%;' class='bg-emerald-500 h-full'></div></div>
                    
                    <div class='flex items-center gap-3 p-3.5 rounded-xl border mb-4 ${showVariance ? (totalOverallDayGap >= 0 ? "bg-emerald-50 border-emerald-200 text-emerald-700" : "bg-rose-50 border-rose-200 text-rose-700") : "bg-slate-50 border-slate-200 text-slate-500"}'>
                        <div class='text-[10px] sm:text-[11px] font-black uppercase tracking-widest'>
                            ${showVariance ? `Net Variance: ${totalOverallDayGap > 0 ? "+" : ""}${totalOverallDayGap} Days | ${totalOverallMinGap > 0 ? "+" : ""}${totalOverallMinGap} Mins <span class="ml-2 opacity-70">(${totalOverallDayGap >= 0 ? "Ahead/On Time" : "Behind Schedule"})</span>` : `Awaiting Completions for Variance`}
                        </div>
                    </div>

                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 shadow-sm w-full">
                        <div class="flex flex-col md:flex-row justify-between md:items-center gap-4">
                            <div>
                                <h5 class="text-[11px] font-black text-slate-800 uppercase tracking-widest mb-1.5">Syllabus Coverage Audit</h5>
                                <div class="text-[10px] font-bold text-slate-600 uppercase flex flex-wrap gap-2 items-center">
                                    <span class="bg-white px-2 py-1 rounded shadow-sm border border-slate-200">Start: <b class="text-blue-600">${firstStartFormatted}</b></span> 
                                    <span class="bg-white px-2 py-1 rounded shadow-sm border border-slate-200">Target End: <b class="text-rose-600">${targetDateFormatted}</b></span>
                                    <span class="bg-white px-2 py-1 rounded shadow-sm border border-slate-200">Class Duration: <b>${standardClassDuration}m</b></span>
                                </div>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                <div class="bg-white px-4 py-2.5 rounded-lg border border-emerald-100 shadow-sm text-center flex-1 sm:flex-none">
                                    <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Total Covered</div>
                                    <div class="text-sm font-black text-emerald-600">${totalSyllabusCoveredMins} Mins</div>
                                </div>
                                <div class="bg-white px-4 py-2.5 rounded-lg border border-rose-100 shadow-sm text-center flex-1 sm:flex-none">
                                    <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Remaining</div>
                                    <div class="text-sm font-black text-rose-600">${minsLeft} Mins</div>
                                    <div class="text-[8px] font-bold text-slate-500 uppercase mt-0.5">~${classesLeft} Classes</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = subjectExclusionsHtml + htmlContent + activityHtml;
        }

        function previewTick(cb, idx) {
            if (cb.checked) {
                const todayISO = getLocalTodayIso();
                const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;

                let chStartDate = currentPlannerData[idx].chapterStartDate;
                let validDates = window.catchUpDates ? window.catchUpDates.filter(d => !chStartDate || d.date >= chStartDate) : [];
                let initialDate = validDates.length > 0 ? validDates[0].date : todayISO;

                if (window.isSubjectUnlocked && validDates.length === 0 && window.catchUpDates && window.catchUpDates.length > 0) {
                    alert(`⚠️ ACTION BLOCKED: All your pending catch-up dates are BEFORE this chapter's official start date (${chStartDate}).\n\nYou cannot log topics backwards in time before the chapter began.`);
                    cb.checked = false;
                    return;
                }

                if (!window.isSubjectUnlocked && chStartDate && initialDate < chStartDate) {
                    alert(`⚠️ ACTION BLOCKED: You are trying to log this topic on ${initialDate}, but the chapter officially started on ${chStartDate}.\n\nTopics cannot be logged on dates before the chapter was started.`);
                    cb.checked = false;
                    return;
                }

                currentPlannerData[idx].isDone = true;
                currentPlannerData[idx].completedDate = initialDate;
                currentPlannerData[idx].completedMinutes = validDates.length > 0 ? validDates[0].mins : activeSessionMins;
                currentPlannerData[idx].tickedBy = safeName;
                currentPlannerData[idx].savedToDb = false;

                const container = document.getElementById(`tick-container-${idx}`);
                let availableDates = window.catchUpDates && window.catchUpDates.length > 0 ? window.catchUpDates : validDates;
                let dateOptions = availableDates.map(d => `<option value="${d.date}" data-mins="${d.mins}" ${d.date === initialDate ? 'selected' : ''}>${d.label}</option>`).join('');
                if (!dateOptions) dateOptions = `<option value="${todayISO}" data-mins="${activeSessionMins}">Today (Fallback)</option>`;

                const matchedActiveDate = availableDates.find(d => d.date === initialDate) || availableDates[0];
                const activeMins = matchedActiveDate ? matchedActiveDate.mins : activeSessionMins;

                container.innerHTML = `
                    <div class="flex flex-col items-end gap-1.5">
                        <span class="text-amber-500 font-black text-[10px] uppercase tracking-widest">PENDING SYNC...</span>
                        <div class="flex items-center gap-2">
                            <select class="text-[10px] p-1.5 border border-blue-300 rounded-lg outline-none cursor-pointer font-bold text-slate-700 shadow-sm bg-white" 
                                onchange="updateTopicDate(${idx}, this.options[this.selectedIndex].value, this.options[this.selectedIndex].dataset.mins, this)">
                                ${dateOptions}
                            </select>
                            <span id="sync-mins-${idx}" class="text-[9px] font-black text-slate-500 bg-slate-100 border border-slate-200 px-2 py-1.5 rounded-lg shadow-sm">${activeMins}m</span>
                        </div>
                    </div>`;

                updateTopicDate(idx, initialDate, activeMins);
            }
        }

        function updateTopicDate(idx, newDateVal, predefinedMins, selectEl) {
            if (!newDateVal) return;

            let chStartDate = currentPlannerData[idx].chapterStartDate;
            if (chStartDate && newDateVal < chStartDate) {
                alert(`⚠️ ACTION BLOCKED: You cannot backdate this topic to ${newDateVal} because the chapter officially started on ${chStartDate}.`);
                if (selectEl) selectEl.value = currentPlannerData[idx].completedDate;
                return;
            }

            let dynamicMins = parseInt(predefinedMins) || activeSessionMins;
            currentPlannerData[idx].completedDate = newDateVal;
            currentPlannerData[idx].completedMinutes = dynamicMins;
            const minBadge = document.getElementById(`sync-mins-${idx}`);
            if (minBadge) minBadge.innerText = `${dynamicMins}m`;
        }

        function previewUntick(cb, idx) {
            if (!cb.checked) {
                const container = document.getElementById(`tick-container-${idx}`);
                container.innerHTML = `<div class="text-right"><span class="text-rose-500 font-black text-[10px] uppercase tracking-widest">REMOVED (PENDING SYNC)</span></div>`;

                currentPlannerData[idx].isDone = false;
                currentPlannerData[idx].completedDate = "";
                currentPlannerData[idx].completedMinutes = 0;
                currentPlannerData[idx].tickedBy = "";
                currentPlannerData[idx].savedToDb = false;
            }
        }

        function startChapter(chName, customDate = null) {
            const today = getLocalTodayIso();
            const startDate = customDate || today;
            currentPlannerData.forEach(r => { if (r['CHAPTER NAME'] === chName) r.chapterStartDate = startDate; });
            renderSyllabusExactMath();
        }

        async function confirmDaySubmission() {
            const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;

            const revInputs = document.querySelectorAll('.batch-rev-input');
            let newActivityLogs = [];
            revInputs.forEach(input => {
                const val = input.value.trim();
                if (val) {
                    newActivityLogs.push({
                        date: input.dataset.date,
                        reason: val,
                        minutes: parseInt(input.dataset.mins) || activeSessionMins,
                        loggedBy: safeName,
                        timestamp: new Date().getTime()
                    });
                }
            });

            const stagedTopics = currentPlannerData.filter(r => r.isDone);
            const hasNewChapterStart = currentPlannerData.some(r => r.chapterStartDate && !r.isDone && !r.savedToDb);

            if (stagedTopics.length === 0 && newActivityLogs.length === 0 && !hasNewChapterStart) {
                alert("Please tick at least one syllabus topic, start a chapter, OR type a revision activity before confirming.");
                return;
            }

            if (window.catchUpDates && window.catchUpDates.length > 0) {
                let accountedDates = new Set();

                if (window.currentActivityLogs) window.currentActivityLogs.forEach(log => accountedDates.add(String(log.date || '').split('T')[0]));
                newActivityLogs.forEach(log => accountedDates.add(log.date));

                currentPlannerData.forEach(r => {
                    if (r.chapterStartDate) accountedDates.add(r.chapterStartDate);
                    if (r.isDone && r.completedDate) accountedDates.add(r.completedDate);
                });

                const todayISO = getLocalTodayIso();

                for (let cd of window.catchUpDates) {
                    if (cd.date < todayISO) {
                        if (!accountedDates.has(cd.date)) {
                            const formattedGap = new Date(cd.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
                            alert(`🚨 INCOMPLETE BACKLOG:\n\nYou cannot submit partial updates. You must catch up on ALL missing dates before saving.\n\nYou left ${formattedGap} blank. Please log a syllabus topic, a chapter start, or an independent revision activity for this date.`);
                            return;
                        }
                    }
                }
            }

            if (isDemoMode) {
                alert(`Simulation Success: Batch Data Locked.\nTopics Ticked: ${stagedTopics.length}\nRevisions Logged: ${newActivityLogs.length}`);
                closeModal('syllabus-modal');
                return;
            }

            const btn = document.getElementById('confirm-day-btn');
            const origText = btn.innerText;
            btn.innerText = "Securing Data...";
            btn.disabled = true;

            try {
                const todayISO = getLocalTodayIso();

                currentPlannerData.forEach(r => {
                    if (r.isDone && !r.savedToDb) {
                        r.savedToDb = true;
                        if (r.completedDate && r.completedDate < todayISO) {
                            r.isBackdated = true;
                            r.uploadedOn = todayISO;
                        }
                    } else if (!r.isDone) {
                        r.savedToDb = false;
                    }
                });

                const mergedActivityLogs = [
                    ...(window.currentActivityLogs || []),
                    ...newActivityLogs
                ];

                const updatePayload = {
                    firestore_id: activeSubjectId,
                    branch_id: activeBranchId,
                    session_id: activeSessionId,
                    syllabus_data: currentPlannerData,
                    activity_logs: mergedActivityLogs,
                    unlock_requested: false,
                    is_unlocked: false,
                    unlocked_at_ms: null,
                    last_save_log: {
                        time: new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }),
                        user: safeName,
                        device: navigator.userAgent.includes('Mobile') ? 'Mobile' : 'Desktop'
                    },
                    updated_at: new Date().toISOString()
                };

                const { error } = await sb.from("lesson_planners")
                    .upsert([updatePayload], { onConflict: 'branch_id,session_id,firestore_id' });

                if (error) {
                    console.error("Supabase Sync Error:", error);
                    alert(`🚨 CRITICAL SYNC FAILURE!\n\n${error.message}\n\n⚠️ DO NOT CLOSE THIS TAB.\n\nPlease check your connection and try clicking 'Confirm' again.`);
                    btn.innerText = origText;
                    btn.disabled = false;
                    return;
                }

                await bumpPlannerVersion();
                alert(`✅ SYNC SUCCESSFUL\n\nSupabase handshake complete. Your data was safely secured.`);
                closeModal('syllabus-modal');
                await fetchTodayData();
            } catch (e) {
                alert("Error saving data: " + e.message);
            } finally {
                btn.innerText = origText;
                btn.disabled = false;
            }
        }

        async function autoRequestUnlock(dateStr) {
            if (isDemoMode || !activeBranchId) return;
            try {
                const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;
                const existing = (window.allPlanners || []).find(p => p.id === activeSubjectId) || {};
                const updatedHistory = [
                    ...(existing.lockHistory || []),
                    `Locked on ${new Date().toLocaleDateString('en-GB')} for missing ${dateStr}`
                ];

                const { error } = await sb.from("lesson_planners").upsert([{
                    firestore_id: activeSubjectId,
                    branch_id: activeBranchId,
                    session_id: activeSessionId,
                    syllabus_data: currentPlannerData || [],
                    unlock_requested: true,
                    is_unlocked: false,
                    locked_date: dateStr,
                    requested_by: safeName,
                    lock_reason: "Missed Compliance Grace Period",
                    lock_history: updatedHistory,
                    updated_at: new Date().toISOString()
                }], { onConflict: 'branch_id,session_id,firestore_id' });

                if (error) throw error;
                await bumpPlannerVersion();
                window.unlockRequested = true;
                const btn = document.getElementById('request-unlock-btn');
                if (btn) {
                    btn.innerText = "Admin Notified for " + dateStr + " ⏳";
                    btn.className = "w-full bg-amber-50 text-amber-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-amber-200 cursor-not-allowed";
                }
            } catch (e) {
                console.error("Auto-unlock failed", e);
            }
        }

        async function requestUnlock() {
            if (isDemoMode) return alert("Simulation: Unlock Request Sent to Admin.");
            if (!activeBranchId) return;
            const btn = document.getElementById('request-unlock-btn');
            btn.innerText = "Requesting...";
            btn.disabled = true;

            try {
                const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;
                const todayStr = new Date().toLocaleDateString('en-GB');
                const existing = (window.allPlanners || []).find(p => p.id === activeSubjectId) || {};
                const updatedHistory = [
                    ...(existing.lockHistory || []),
                    `Requested Manual Unlock on ${todayStr}`
                ];

                const { error } = await sb.from("lesson_planners").upsert([{
                    firestore_id: activeSubjectId,
                    branch_id: activeBranchId,
                    session_id: activeSessionId,
                    syllabus_data: currentPlannerData || [],
                    unlock_requested: true,
                    locked_date: "Manual Correction",
                    requested_by: safeName,
                    lock_reason: "Manual Unlock Request",
                    lock_history: updatedHistory,
                    updated_at: new Date().toISOString()
                }], { onConflict: 'branch_id,session_id,firestore_id' });

                if (error) throw error;
                await bumpPlannerVersion();
                alert("Unlock Request Sent! Please tell the Admin to approve it.");

                btn.innerText = "Unlock Requested ⏳";
                btn.className = "w-full bg-amber-50 text-amber-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-amber-200 transition-all cursor-not-allowed";
            } catch (e) {
                alert("Error requesting unlock: " + e.message);
                btn.innerText = "Made a Mistake? Request Admin Unlock";
                btn.disabled = false;
            }
        }
