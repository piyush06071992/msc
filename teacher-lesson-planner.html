<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Daily Work Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card-prism { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.02); transition: all 0.3s ease; }
        .card-prism:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.1); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 2px solid #f1f5f9; border-top: 2px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="h-20 bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 px-8 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-6">
            <button onclick="window.location.href='teacher-portal.html'" class="p-3 bg-white/10 rounded-2xl hover:bg-white/20 transition-all text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="text-xl font-black uppercase text-white tracking-widest">Daily Work Report</h1>
                <p id="teacher-badge" class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Loading...</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="demo-mode-indicator" class="hidden bg-amber-500/20 text-amber-300 px-4 py-2 rounded-xl text-[10px] font-black uppercase border border-amber-500/50 flex items-center gap-3">
                <span>Simulation Active</span>
                <button onclick="toggleDemoMode(false)" class="underline hover:text-white">Exit</button>
            </div>
            <button id="demo-toggle-btn" onclick="toggleDemoMode(true)" class="text-[10px] font-black text-indigo-200 uppercase tracking-widest border border-indigo-700 px-5 py-2.5 rounded-full hover:bg-indigo-800 transition-all">Simulation Engine</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 sm:p-10 space-y-8">
        
        <div class="flex bg-white p-2 rounded-2xl shadow-sm border border-slate-200 gap-2 max-w-2xl">
            <button id="tab-classes-view" onclick="switchTab('classes-view')" class="tab-btn flex-1 py-3.5 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest text-[10px] shadow-md transition-all">Today's Classes</button>
            <button id="tab-duties-view" onclick="switchTab('duties-view')" class="tab-btn flex-1 py-3.5 bg-transparent text-slate-500 hover:text-slate-800 rounded-xl font-black uppercase tracking-widest text-[10px] transition-all">Duties</button>
            <button id="tab-extra-view" onclick="switchTab('extra-view')" class="tab-btn flex-1 py-3.5 bg-transparent text-slate-500 hover:text-slate-800 rounded-xl font-black uppercase tracking-widest text-[10px] transition-all">Separate Work</button>
        </div>

        <div id="classes-view" class="space-y-6">
            <div id="classes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-24 text-slate-400 font-bold uppercase text-xs tracking-[0.2em]">
                    <span class="loader mb-4"></span><br>Fetching Timetable...
                </div>
            </div>
        </div>

        <div id="duties-view" class="hidden space-y-6">
            <div class="bg-white rounded-[3rem] p-10 border border-slate-200 shadow-xl">
                <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight mb-6">Assigned Duties (Today)</h2>
                <div id="duties-list" class="space-y-4">
                    </div>
            </div>
        </div>

        <div id="extra-view" class="hidden space-y-6">
            <div class="bg-white rounded-[3rem] p-10 border border-slate-200 shadow-xl">
                <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight mb-2">Log Separate Work</h2>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-8">Enter details regarding extra unassigned work</p>
                <textarea id="extra-work-text" rows="6" class="w-full bg-slate-50 border-2 border-slate-200 rounded-[2rem] p-6 text-sm font-bold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner" placeholder="E.g. Checked 50 terminal exam papers for Class 11..."></textarea>
                <div class="flex justify-end mt-6">
                    <button onclick="submitExtraWork()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-10 py-5 rounded-2xl font-black uppercase tracking-widest text-[11px] shadow-lg transition-all active:scale-95">Log Separate Work</button>
                </div>
            </div>
        </div>
    </main>

    <div id="mode-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] hidden items-center justify-center p-6">
        <div class="bg-white rounded-[3rem] p-10 max-w-lg w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="mode-class-title" class="text-xl font-black text-slate-900 uppercase tracking-tighter"></h3>
                <button onclick="closeModal('mode-modal')" class="text-slate-400 hover:text-rose-500 bg-slate-100 p-3 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            
            <p id="mode-session-info" class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-8 bg-blue-50 inline-block px-4 py-2 rounded-lg border border-blue-100"></p>
            
            <div class="space-y-6">
                <button onclick="openSyllabusChecklist()" class="w-full p-6 border-2 border-slate-100 rounded-[2rem] hover:border-blue-500 hover:bg-blue-50 transition-all text-left group shadow-sm">
                    <div class="font-black text-slate-800 text-lg uppercase tracking-widest group-hover:text-blue-700 flex items-center gap-4">
                        <span class="bg-blue-100 text-blue-600 p-3 rounded-xl">📚</span> Mark Syllabus Progress
                    </div>
                </button>

                <div class="border-2 border-slate-100 rounded-[2rem] p-6 focus-within:border-amber-500 focus-within:bg-amber-50 transition-all shadow-sm">
                    <div class="font-black text-slate-800 text-lg uppercase tracking-widest mb-4 flex items-center gap-4">
                        <span class="bg-amber-100 text-amber-600 p-3 rounded-xl">🎯</span> Revision / Activity
                    </div>
                    <textarea id="revision-reason" rows="3" class="w-full bg-white border border-slate-200 rounded-2xl p-4 text-xs font-bold text-slate-700 outline-none focus:border-amber-500" placeholder="Mandatory Reason (e.g., Chapter 4 Test)"></textarea>
                    <button onclick="submitRevision()" class="w-full mt-4 bg-amber-500 text-white font-black py-4 rounded-2xl uppercase tracking-widest text-[11px] shadow-lg hover:bg-amber-600 active:scale-95 transition-all">Submit Activity Log</button>
                </div>
            </div>
        </div>
    </div>

    <div id="syllabus-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[150] hidden items-center justify-center p-6">
        <div class="bg-white rounded-[3.5rem] p-10 max-w-5xl w-full h-[92vh] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div class="flex justify-between items-center mb-6 shrink-0 bg-white">
                <div>
                    <h3 id="syll-class-title" class="text-3xl font-black text-slate-900 uppercase tracking-tighter"></h3>
                    <div class="flex gap-4 items-center mt-3">
                        <p class="text-[10px] font-black text-blue-600 uppercase tracking-[0.2em]">Syllabus Execution Protocol</p>
                        <span id="syll-session-badge" class="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest"></span>
                    </div>
                </div>
                <button onclick="closeModal('syllabus-modal')" class="p-4 bg-slate-100 rounded-2xl text-slate-500 hover:bg-rose-100 hover:text-rose-600 transition-all"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>

            <div id="chapter-accordion-container" class="flex-1 overflow-y-auto custom-scroll space-y-6 pr-4"></div>

            <div class="pt-8 border-t mt-6 shrink-0 bg-white">
                <button onclick="confirmDaySubmission()" class="w-full bg-emerald-600 text-white font-black py-6 rounded-3xl uppercase tracking-widest text-xs shadow-2xl shadow-emerald-600/30 hover:bg-emerald-700 active:scale-95 transition-all">
                    Securely Confirm & Log Day's Progress
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null, mySessions = [], myDuties = [], currentPlannerData = null;
        let activeSubjectId = null, activeSessionMins = 0;
        let isDemoMode = false;

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');
            document.getElementById('teacher-badge').innerText = `ID: ${activeStaff.name || activeStaff.email}`;
            await fetchTodayData();
        };

        function switchTab(tabId) {
            ['classes-view', 'duties-view', 'extra-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.replace('bg-blue-600', 'bg-transparent');
                btn.classList.replace('text-white', 'text-slate-500');
            });
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.replace('bg-transparent', 'bg-blue-600');
            activeBtn.classList.replace('text-slate-500', 'text-white');
        }

        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        function toggleDemoMode(active) {
            isDemoMode = active;
            document.getElementById('demo-mode-indicator').classList.toggle('hidden', !active);
            document.getElementById('demo-toggle-btn').classList.toggle('hidden', active);
            
            if(active) {
                // SIMULATING: Teacher teaches the exact same section twice today
                mySessions = [
                    { id: 'sess1', assignmentId: 'Class_12_Warrior_N1_Physics', className: 'Class 12', section: 'Warrior N1', subject: 'Physics', start: '09:00 AM', end: '10:30 AM', duration: 90 },
                    { id: 'sess2', assignmentId: 'Class_12_Warrior_N1_Physics', className: 'Class 12', section: 'Warrior N1', subject: 'Physics', start: '02:00 PM', end: '03:00 PM', duration: 60 },
                    { id: 'sess3', assignmentId: 'Class_11_S10_Mathematics', className: 'Class 11', section: 'S10', subject: 'Mathematics', start: '11:00 AM', end: '12:30 PM', duration: 90 }
                ];
                myDuties = [{ id: 'duty1', title: 'Invigilation Duty - Term 1', time: '03:30 PM - 05:00 PM', location: 'Hall B' }];
                renderClassesGrid();
                renderDuties();
            } else { fetchTodayData(); }
        }

        async function fetchTodayData() {
            try {
                // Real logic will fetch from Timetable collection here.
                // For now, if no timetable is built, we fallback to assignments to prevent errors.
                const snap = await db.collection("lesson_planner_assignments").where("assignedTo", "==", activeStaff.email).get();
                mySessions = snap.docs.map(d => ({ 
                    id: d.id, assignmentId: d.id, className: d.data().className, section: d.data().section, 
                    subject: d.data().subject, start: 'Standard', end: 'Schedule', duration: 90 
                }));
                myDuties = []; // Fetched from timetable duties later
                renderClassesGrid();
                renderDuties();
            } catch(e) { console.error(e); }
        }

        function renderClassesGrid() {
            const grid = document.getElementById('classes-grid');
            grid.innerHTML = '';
            if(mySessions.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold uppercase text-[11px] tracking-widest">No classes in timetable today.</div>`;
                return;
            }
            mySessions.forEach(sess => {
                grid.innerHTML += `
                    <button onclick="openModeSelection('${sess.assignmentId}', '${sess.className} - ${sess.section} | ${sess.subject}', ${sess.duration}, '${sess.start} - ${sess.end}')" 
                        class="bg-white border border-slate-200 p-8 rounded-[2rem] card-prism text-left w-full relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-2 h-full bg-blue-500 group-hover:bg-blue-600 transition-colors"></div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-2xl font-black text-slate-900 tracking-tighter">${sess.className} <span class="text-slate-300 mx-1">|</span> ${sess.section}</h3>
                            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg text-[9px] font-black tracking-widest uppercase border border-indigo-100">${sess.duration}m</span>
                        </div>
                        <p class="text-[11px] font-bold text-blue-600 uppercase tracking-widest mt-1">${sess.subject}</p>
                        <div class="mt-8 flex justify-between items-center border-t border-slate-100 pt-5">
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">🕒 ${sess.start} - ${sess.end}</span>
                            <span class="bg-slate-100 group-hover:bg-blue-50 group-hover:text-blue-600 text-slate-500 px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest transition-colors">Open ➔</span>
                        </div>
                    </button>`;
            });
        }

        function renderDuties() {
            const list = document.getElementById('duties-list');
            if(myDuties.length === 0) list.innerHTML = `<p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">No extra duties assigned today.</p>`;
            else list.innerHTML = myDuties.map(d => `
                <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl flex justify-between items-center">
                    <div><h4 class="font-black text-slate-900 text-lg">${d.title}</h4><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">📍 ${d.location}</p></div>
                    <span class="bg-amber-100 text-amber-700 px-4 py-2 rounded-xl text-[10px] font-black tracking-widest uppercase">🕒 ${d.time}</span>
                </div>`).join('');
        }

        async function submitExtraWork() {
            const text = document.getElementById('extra-work-text').value.trim();
            if(!text) return alert("Please enter the work details.");
            if(isDemoMode) { alert("Simulation: Work logged locally."); document.getElementById('extra-work-text').value = ''; return; }
            try {
                await db.collection("staff_extra_work_log").add({
                    teacher: activeStaff.email, date: new Date().toISOString().split('T')[0],
                    report: text, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Work Logged Successfully!"); document.getElementById('extra-work-text').value = '';
            } catch(e) { alert("Error saving data."); }
        }

        function openModeSelection(assignmentId, title, duration, timeString) {
            activeSubjectId = assignmentId; activeSessionMins = duration;
            document.getElementById('mode-class-title').innerText = title;
            document.getElementById('mode-session-info').innerText = `Timetable: ${timeString} | Session Length: ${duration} Minutes`;
            document.getElementById('revision-reason').value = '';
            openModal('mode-modal');
        }

        async function submitRevision() {
            const reason = document.getElementById('revision-reason').value.trim();
            if(!reason) return alert("Reason required for Revision/Activity.");
            if(isDemoMode) { alert("Simulation: Revision saved."); closeModal('mode-modal'); return; }
            try {
                await db.collection("lesson_planner_revisions").add({
                    assignmentId: activeSubjectId, teacher: activeStaff.email,
                    date: new Date().toISOString().split('T')[0], reason: reason, sessionMins: activeSessionMins,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Activity Logged! Admin notified."); closeModal('mode-modal');
            } catch(e) { alert("Error saving."); }
        }

        // --- CORE SYLLABUS EXECUTION ---
        async function openSyllabusChecklist() {
            closeModal('mode-modal');
            document.getElementById('syll-class-title').innerText = document.getElementById('mode-class-title').innerText;
            document.getElementById('syll-session-badge').innerText = `Session Time Configured: ${activeSessionMins} Minutes`;
            openModal('syllabus-modal');
            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = `<div class="text-center py-20"><span class="loader"></span></div>`;

            if(isDemoMode) { currentPlannerData = getMockSyllabus(); renderSyllabusList(); return; }

            try {
                const doc = await db.collection("lesson_planners").doc(activeSubjectId).get();
                if(!doc.exists || !doc.data().syllabusData) return container.innerHTML = `<div class="text-center py-20 text-rose-500 font-black uppercase text-xs">Syllabus Not Defined</div>`;
                currentPlannerData = doc.data().syllabusData;
                renderSyllabusList();
            } catch(e) { console.error(e); }
        }

        function renderSyllabusList() {
            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = '';
            const chNames = [...new Set(currentPlannerData.map(r => r["CHAPTER NAME"]))];

            chNames.forEach(ch => {
                const rows = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                const doneCount = rows.filter(r => r.isDone).length;
                const isStarted = rows[0].chapterStartDate || doneCount > 0;
                const isCompleted = doneCount === rows.length;

                let cardStyle = isCompleted ? 'border-emerald-200 bg-emerald-50/20' : (isStarted ? 'border-blue-200 bg-white' : 'border-slate-200 bg-slate-50');
                let badge = isCompleted ? `<span class="bg-emerald-500 text-white px-4 py-1.5 rounded-full text-[9px] font-black uppercase">✓ COMPLETED</span>` 
                          : (isStarted ? `<span class="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-full text-[9px] font-black uppercase">ONGOING</span>` 
                          : `<span class="bg-slate-200 text-slate-600 px-4 py-1.5 rounded-full text-[9px] font-black uppercase">PENDING</span>`);

                let contentHTML = '';
                if (!isStarted) {
                    contentHTML = `
                        <div class="p-8 text-center bg-white border-t border-slate-100">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Acknowledge start date to open topics.</p>
                            <button onclick="startChapter('${ch}')" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg hover:bg-blue-600 transition-all active:scale-95">Initiate Chapter</button>
                        </div>`;
                } else {
                    contentHTML = `<div class="${isCompleted ? 'opacity-50 pointer-events-none' : ''}">` + rows.map(r => {
                        const absIdx = currentPlannerData.indexOf(r);
                        return `
                            <div class="flex items-center justify-between p-6 border-t border-slate-100 bg-white hover:bg-slate-50 transition-colors">
                                <div><div class="text-sm font-black text-slate-800">${r['SUBTOPICS']}</div><div class="text-[9px] font-bold text-slate-400 uppercase mt-1">Lec ${r['LECTURE NUMBER']}</div></div>
                                <div>${r.isDone ? `<span class="text-emerald-500 font-black text-[10px] uppercase">✓ LOGGED</span>` : `<input type="checkbox" class="topic-cb w-6 h-6 accent-blue-600 cursor-pointer shadow-sm" data-idx="${absIdx}">`}</div>
                            </div>`;
                    }).join('') + `</div>`;
                }

                container.innerHTML += `
                    <div class="border ${cardStyle} rounded-[2.5rem] overflow-hidden shadow-sm transition-all">
                        <div class="p-8 flex justify-between items-center"><h4 class="font-black text-lg uppercase tracking-tight text-slate-900">${ch}</h4>${badge}</div>
                        ${contentHTML}
                    </div>`;
            });
        }

        async function startChapter(chName) {
            const today = new Date().toISOString().split('T')[0];
            currentPlannerData.forEach(r => { if (r['CHAPTER NAME'] === chName) r.chapterStartDate = today; });
            if(isDemoMode) { renderSyllabusList(); return; }
            try { await db.collection("lesson_planners").doc(activeSubjectId).update({ syllabusData: currentPlannerData }); renderSyllabusList(); } catch(e) { alert("Error."); }
        }

        async function confirmDaySubmission() {
            const checkboxes = document.querySelectorAll('.topic-cb:checked');
            if(checkboxes.length === 0) return alert("Select at least one subtopic.");

            if(confirm(`Confirm? The ${activeSessionMins} minutes of this session will be mathematically distributed and locked to these topics.`)) {
                const today = new Date().toISOString().split('T')[0]; 
                
                // PHASE 3 & 4 LOGIC: Distribute actual session time evenly across selected topics
                const minsPerTopic = Math.round(activeSessionMins / checkboxes.length);

                checkboxes.forEach(cb => {
                    const idx = cb.dataset.idx;
                    currentPlannerData[idx].isDone = true;
                    currentPlannerData[idx].completedDate = today;
                    currentPlannerData[idx].completedMinutes = minsPerTopic; 
                    currentPlannerData[idx].tickedBy = activeStaff.name; 
                });

                if(isDemoMode) {
                    alert(`Simulation: Topics locked. Time logged: ${minsPerTopic}m per topic (Total: ${activeSessionMins}m).`);
                    closeModal('syllabus-modal'); return;
                }

                try {
                    await db.collection("lesson_planners").doc(activeSubjectId).update({ syllabusData: currentPlannerData });
                    alert("Progress Successfully Synchronized!");
                    closeModal('syllabus-modal');
                } catch(e) { alert("Error saving data."); }
            }
        }

        function getMockSyllabus() {
            return [
                { "CHAPTER NAME": "Logarithm & Inequalities", "LECTURE NUMBER": "1", "SUBTOPICS": "Bracket Notations", "isDone": true, "chapterStartDate": "2026-04-01", "completedMinutes": "90" },
                { "CHAPTER NAME": "Logarithm & Inequalities", "LECTURE NUMBER": "2", "SUBTOPICS": "Wavy Curve Method", "isDone": true, "completedMinutes": "90" },
                { "CHAPTER NAME": "Quadratic Equations", "LECTURE NUMBER": "1", "SUBTOPICS": "Roots & Discriminants", "isDone": false, "chapterStartDate": "2026-04-05" },
                { "CHAPTER NAME": "Quadratic Equations", "LECTURE NUMBER": "2", "SUBTOPICS": "Nature of Roots", "isDone": false },
                { "CHAPTER NAME": "Sequence & Series", "LECTURE NUMBER": "1", "SUBTOPICS": "Arithmetic Progression", "isDone": false }
            ];
        }
    </script>
</body>
</html>
