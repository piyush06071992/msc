<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Teacher Lesson Planner</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card-prism { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.02); transition: all 0.3s ease; }
        .card-prism:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.1); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 2px solid #f1f5f9; border-top: 2px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 p-4 sm:px-8 sm:py-5 flex flex-wrap justify-between items-center shadow-lg gap-3">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors shadow-md border border-indigo-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7-7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </button>
            <div>
                <h1 class="text-sm sm:text-xl font-black uppercase text-white tracking-widest leading-none">Teacher Lesson Planner</h1>
                <div class="flex flex-wrap items-center gap-2 mt-1.5">
                    <p id="teacher-badge" class="text-[9px] sm:text-[10px] font-bold text-indigo-300 uppercase tracking-widest">Loading...</p>
                    <select id="teacher-branch-switch" onchange="switchTeacherBranch(this.value)" class="text-[9px] font-black text-sky-200 bg-indigo-900/90 border border-indigo-700 outline-none rounded px-2 py-0.5 cursor-pointer uppercase tracking-widest">
                        <option value="">📍 Branch...</option>
                    </select>
                    <select id="teacher-session-switch" onchange="switchTeacherSession(this.value)" class="text-[9px] font-black text-amber-200 bg-indigo-900/90 border border-indigo-700 outline-none rounded px-2 py-0.5 cursor-pointer uppercase tracking-widest">
                        <option value="">📅 Session...</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 ml-4">
                <button id="auth-btn" onclick="window.location.href='admin-lesson-auth.html'" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-colors shadow-md border border-indigo-500 flex items-center gap-2">
                    🔐 Delegation
                </button>
                <button id="admin-hub-btn" onclick="window.location.href='admin-lesson-planner.html'" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-colors shadow-md border border-blue-500 flex items-center gap-2">
                    📊 Planner Hub
                </button>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="demo-mode-indicator" class="hidden bg-amber-500/20 text-amber-300 px-3 py-2 rounded-xl text-[9px] font-black uppercase border border-amber-500/50 flex items-center gap-2">
                <span>Simulation</span>
                <button onclick="toggleDemoMode(false)" class="underline hover:text-white">Exit</button>
            </div>
            <button id="demo-toggle-btn" onclick="toggleDemoMode(true)" class="text-[9px] font-black text-indigo-200 uppercase tracking-widest border border-indigo-700 px-4 py-2 rounded-full hover:bg-indigo-800 transition-all">Simulation</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-10 space-y-6 sm:space-y-8">
        <div id="classes-view" class="space-y-6">
            <div id="classes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-24 text-slate-400 font-bold uppercase text-xs tracking-[0.2em]">
                    <span class="loader mb-4"></span><br>Fetching Live Timetable...
                </div>
            </div>
        </div>
    </main>

    <div id="mode-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="mode-class-title" class="text-xl font-black text-slate-900 uppercase tracking-tighter"></h3>
                <button onclick="closeModal('mode-modal')" class="text-slate-400 hover:text-rose-500 bg-slate-100 p-2 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            
            <p id="mode-session-info" class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-6 bg-blue-50 inline-block px-3 py-1.5 rounded-lg border border-blue-100"></p>
            
            <div class="space-y-4">
                <button onclick="openSyllabusChecklist()" class="w-full p-5 border-2 border-slate-100 rounded-[1.5rem] hover:border-blue-500 hover:bg-blue-50 transition-all text-left group shadow-sm">
                    <div class="font-black text-slate-800 text-base uppercase tracking-widest group-hover:text-blue-700 flex items-center gap-3">
                        <span class="bg-blue-100 text-blue-600 p-2.5 rounded-xl">📚</span> Open Daily Tracker
                    </div>
                    <p class="text-[10px] font-bold text-slate-400 mt-2 ml-[3.25rem] uppercase tracking-widest">Log syllabus topics or revision activity</p>
                </button>
            </div>
        </div>
    </div>

    <div id="syllabus-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[150] hidden items-center justify-center p-2 sm:p-4">
        <div class="bg-white rounded-[2rem] p-4 sm:p-6 max-w-4xl w-full h-[95vh] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div class="flex justify-between items-center mb-3 shrink-0 bg-white">
                <div>
                    <h3 id="syll-class-title" class="text-lg sm:text-xl font-black text-slate-900 uppercase tracking-tighter leading-none"></h3>
                    <div class="mt-1">
                        <span id="syll-session-badge" class="text-[9px] font-black text-blue-600 uppercase tracking-widest"></span>
                    </div>
                </div>
                <button onclick="closeModal('syllabus-modal')" class="p-2.5 bg-slate-100 rounded-xl text-slate-500 hover:bg-rose-100 hover:text-rose-600 transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>

            <div class="flex bg-slate-100 p-1 rounded-xl mb-3 shrink-0 shadow-inner" id="tracker-tabs">
                <button id="tab-syllabus" onclick="switchSyllabusTab('syllabus')" class="flex-1 py-2 text-[10px] sm:text-[11px] font-black uppercase tracking-widest rounded-lg bg-white shadow-sm text-blue-600 transition-all">📚 Mark Syllabus</button>
                <button id="tab-revision" onclick="switchSyllabusTab('revision')" class="flex-1 py-2 text-[10px] sm:text-[11px] font-black uppercase tracking-widest rounded-lg text-slate-500 hover:text-slate-800 transition-all hover:bg-slate-200/50">🎯 Log Activity</button>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll pr-2 pt-1 border-t border-slate-100">
                <div id="syllabus-tab-content" class="block space-y-3">
                    <div id="subject-pace-widget" class="hidden"></div>
                    <div id="chapter-accordion-container" class="space-y-3 mt-2"></div>
                </div>

                <div id="revision-tab-content" class="hidden h-full">
                    <div class="border-2 border-amber-100 bg-amber-50/40 rounded-2xl p-4 sm:p-6 shadow-sm flex flex-col h-full gap-4 mt-2">
                        <div class="font-black text-amber-900 text-sm uppercase tracking-widest flex items-center gap-2">
                            <span class="bg-amber-100 text-amber-600 p-2 rounded-xl shadow-sm">🎯</span> Log Independent Activity
                        </div>
                        
                        <div id="revision-batch-container" class="flex-1 overflow-y-auto custom-scroll space-y-3 pr-2 pb-2"></div>
                    </div>
                </div>
            </div>

            <div class="pt-3 mt-3 shrink-0 bg-white flex flex-col gap-2">
                <button id="confirm-day-btn" onclick="confirmDaySubmission()" class="w-full bg-emerald-600 text-white font-black py-3.5 rounded-xl uppercase tracking-widest text-[10px] sm:text-xs shadow-lg shadow-emerald-600/30 hover:bg-emerald-700 active:scale-95 transition-all">
                    Securely Confirm & Log Day's Progress
                </button>
                <button id="request-unlock-btn" onclick="requestUnlock()" class="w-full bg-rose-50 text-rose-600 font-black py-3 rounded-xl uppercase tracking-widest text-[9px] border border-rose-200 hover:bg-rose-100 transition-all hidden">
                    Made a Mistake? Request Admin Unlock
                </button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lpccpiozrqgxgusculbs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwY2NwaW96cnFneGd1c2N1bGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzMzNzQsImV4cCI6MjEwOTU0OTM3NH0.b2cNwu7y-uoFTOOK-Qy2-XX7QbrSMYzJ5Ja2EBO98Hc";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allBranches = [];
        let allSessions = [];
        let activeBranchId = null;
        let activeSessionId = null;
        let activeCenter = "GHUMARWIN";

        let activeStaff = null, mySessions = [], myDuties = [], currentPlannerData = null;
        let activeSubjectId = null, activePlannerDbRowId = null, activeSessionMins = 0;
        let holidaysData = [];
        window.teacherTimetable = null;
        window.fullTimetable = [];
        window.allPlanners = [];
        window.allStructures = [];
        let isDemoMode = false;
        let globalAutoLock = true;
        let enableDailyBlock = false;
        window.activeSyllabusTab = 'syllabus';

        function getLocalTodayIso() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function parseJsonField(raw) {
            if (!raw) return {};
            if (typeof raw === 'object' && !Array.isArray(raw)) return raw;
            try { return JSON.parse(raw); } catch (_) { return {}; }
        }

        function isTruthyPermission(val) {
            if (val === true) return true;
            if (typeof val === 'string') {
                const s = val.trim().toLowerCase();
                return s !== '' && s !== 'false' && s !== '0' && s !== 'null' && s !== 'undefined';
            }
            return false;
        }

        function normalizePlannerRow(row) {
            const raw = parseJsonField(row.raw_data);
            const syllabusData = Array.isArray(row.syllabus_data) ? row.syllabus_data : (Array.isArray(row.syllabusData) ? row.syllabusData : (Array.isArray(raw.syllabusData) ? raw.syllabusData : []));
            const activityLogs = Array.isArray(row.activity_logs) ? row.activity_logs : (Array.isArray(row.activityLogs) ? row.activityLogs : (Array.isArray(raw.activityLogs) ? raw.activityLogs : []));
            const lockHistory = Array.isArray(row.lock_history) ? row.lock_history : (Array.isArray(row.lockHistory) ? row.lockHistory : (Array.isArray(raw.lockHistory) ? raw.lockHistory : []));

            return {
                id: row.firestore_id || row.id,
                dbId: row.id,
                branchId: row.branch_id,
                sessionId: row.session_id,
                syllabusData,
                activityLogs,
                lockHistory,
                isUnlocked: Boolean(row.is_unlocked ?? row.isUnlocked ?? raw.isUnlocked),
                unlockedAt: row.unlocked_at_ms ?? row.unlockedAt ?? raw.unlockedAt ?? null,
                unlockRequested: Boolean(row.unlock_requested ?? row.unlockRequested ?? raw.unlockRequested),
                requestedBy: row.requested_by ?? row.requestedBy ?? raw.requestedBy ?? '',
                lockedDate: row.locked_date ?? row.lockedDate ?? raw.lockedDate ?? null,
                lockReason: row.lock_reason ?? row.lockReason ?? raw.lockReason ?? '',
                lastSaveLog: row.last_save_log ?? row.lastSaveLog ?? raw.lastSaveLog ?? null
            };
        }

        function findPlannerForSubject(st, sub, expectedId) {
            const subSlug = String(sub || '').replace(/\s+/g, '_').toLowerCase();
            const clsNorm = String(st?.className || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            const secNorm = String(st?.sectionName || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();

            return (window.allPlanners || []).find(p => {
                if (p.id === expectedId) return true;
                const pid = String(p.id || '').toLowerCase();
                if (st?.id && pid === `${String(st.id).toLowerCase()}_${subSlug}`) return true;
                if (st?.dbId && pid === `${String(st.dbId).toLowerCase()}_${subSlug}`) return true;
                if (clsNorm && secNorm && pid.includes(clsNorm) && pid.includes(secNorm) && pid.endsWith(`_${subSlug}`)) return true;
                return false;
            }) || null;
        }

        async function bumpPlannerVersion() {
            if (!navigator.onLine || !activeBranchId) return;
            try {
                const nowMs = Date.now();
                const metaId = `planners_version_${activeBranchId}_${activeSessionId || 'default'}`;
                await sb.from("system_metadata").upsert([{
                    firestore_id: metaId,
                    branch_id: activeBranchId,
                    session_id: activeSessionId,
                    meta_key: "planners_version",
                    last_updated_ms: nowMs,
                    meta_value: { lastUpdated: nowMs },
                    updated_at: new Date().toISOString()
                }], { onConflict: 'firestore_id' });
            } catch (e) {
                console.warn("Failed to bump version", e);
            }
        }

        async function initBranchAndSession(staffRow) {
            const todayIso = getLocalTodayIso();
            const [bRes, sRes] = await Promise.all([
                sb.from("branches").select("*").order("created_at", { ascending: true }),
                sb.from("branch_sessions").select("*").order("start_date", { ascending: false })
            ]);
            if (bRes.error) throw bRes.error;
            if (sRes.error) throw sRes.error;

            allBranches = (bRes.data || []).filter(b => b.is_active !== false);
            allSessions = sRes.data || [];

            let detectedBranchName = "";
            if (staffRow) {
                const det = parseJsonField(staffRow.details);
                if (staffRow.branch_id) {
                    const bObj = allBranches.find(b => b.id === staffRow.branch_id);
                    if (bObj) detectedBranchName = String(bObj.name || '').trim().toUpperCase();
                }
                if (!detectedBranchName) {
                    const centerKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                    if (centerKey) {
                        const rawCenter = String(det[centerKey]).toUpperCase();
                        if (rawCenter.includes('DHARAMSHALA')) detectedBranchName = 'DHARAMSHALA';
                        else if (rawCenter.includes('GHUMARWIN')) detectedBranchName = 'GHUMARWIN';
                        else detectedBranchName = rawCenter.trim();
                    }
                }
            }

            const savedBranchId = sessionStorage.getItem('minervaTeacherBranchId') || sessionStorage.getItem('minervaAdminBranchId');
            const matchedBranch =
                allBranches.find(b => detectedBranchName && String(b.name || '').trim().toUpperCase().includes(detectedBranchName)) ||
                allBranches.find(b => b.id === savedBranchId) ||
                allBranches[0] ||
                null;

            if (matchedBranch) {
                activeBranchId = matchedBranch.id;
                activeCenter = String(matchedBranch.name || '').trim().toUpperCase();
                sessionStorage.setItem('minervaTeacherBranchId', activeBranchId);
            }

            const branchSel = document.getElementById('teacher-branch-switch');
            if (branchSel) {
                branchSel.innerHTML = allBranches.map(b =>
                    `<option value="${b.id}" ${b.id === activeBranchId ? 'selected' : ''}>📍 ${b.name}</option>`
                ).join('');
            }

            populateSessionsForActiveBranch(todayIso);
        }

        function populateSessionsForActiveBranch(todayIso = getLocalTodayIso()) {
            const sessionsForBranch = allSessions.filter(s => s.branch_id === activeBranchId);
            const dateMatchedSession = sessionsForBranch.find(s => {
                const startD = s.start_date ? String(s.start_date).slice(0, 10) : '';
                const endD = s.end_date ? String(s.end_date).slice(0, 10) : '';
                return startD && endD && todayIso >= startD && todayIso <= endD;
            });
            const savedSessionId = sessionStorage.getItem(`minerva_teacher_session_${activeBranchId}`);
            const chosenSession =
                sessionsForBranch.find(s => s.id === savedSessionId) ||
                dateMatchedSession ||
                sessionsForBranch.find(s => s.is_active === true) ||
                sessionsForBranch[0] ||
                null;

            activeSessionId = chosenSession ? chosenSession.id : null;
            if (activeSessionId && activeBranchId) {
                sessionStorage.setItem(`minerva_teacher_session_${activeBranchId}`, activeSessionId);
            }

            const sessionSel = document.getElementById('teacher-session-switch');
            if (sessionSel) {
                sessionSel.innerHTML = sessionsForBranch.length
                    ? sessionsForBranch.map(s => {
                        const isTodayMatch = dateMatchedSession && s.id === dateMatchedSession.id;
                        return `<option value="${s.id}" ${s.id === activeSessionId ? 'selected' : ''}>📅 ${s.session_name}${isTodayMatch ? ' (Today)' : ''}</option>`;
                    }).join('')
                    : `<option value="">📅 Default Session</option>`;
            }
        }

        async function switchTeacherBranch(branchId) {
            const chosen = allBranches.find(b => b.id === branchId);
            if (!chosen) return;
            activeBranchId = chosen.id;
            activeCenter = String(chosen.name || '').trim().toUpperCase();
            sessionStorage.setItem('minervaTeacherBranchId', activeBranchId);
            populateSessionsForActiveBranch();
            applyBranchTheme();
            await fetchTodayData();
        }

        async function switchTeacherSession(sessionId) {
            activeSessionId = sessionId || null;
            if (activeSessionId && activeBranchId) {
                sessionStorage.setItem(`minerva_teacher_session_${activeBranchId}`, activeSessionId);
            }
            await fetchTodayData();
        }

        function applyBranchTheme() {
            const headerEl = document.querySelector('header');
            let wm = document.getElementById('teacher-watermark');
            if (!wm) {
                wm = document.createElement('div');
                wm.id = 'teacher-watermark';
                wm.className = "fixed inset-0 pointer-events-none flex items-center justify-center text-[10vw] font-black opacity-[0.03] text-slate-900 z-[1] tracking-widest uppercase overflow-hidden whitespace-nowrap";
                document.body.appendChild(wm);
            }
            wm.innerHTML = activeCenter;

            if (activeCenter.includes("DHARAMSHALA")) {
                headerEl.classList.remove('bg-[#1e1b4b]');
                headerEl.classList.add('bg-purple-950');
                headerEl.classList.remove('border-indigo-900');
                headerEl.classList.add('border-purple-800');
                document.body.style.backgroundColor = '#faf5ff';
                wm.classList.remove('text-slate-900');
                wm.classList.add('text-purple-900');
            } else {
                headerEl.classList.remove('bg-purple-950');
                headerEl.classList.add('bg-[#1e1b4b]');
                headerEl.classList.remove('border-purple-800');
                headerEl.classList.add('border-indigo-900');
                document.body.style.backgroundColor = '#f8fafc';
                wm.classList.remove('text-purple-900');
                wm.classList.add('text-slate-900');
            }
        }

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff') || 'null');
            if (!activeStaff) return window.location.replace('staff-login.html');

            const safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
            document.getElementById('teacher-badge').innerText = `ID: ${safeName}`;

            const isAdmin = sessionStorage.getItem('minervaAdminAuth') === 'true';
            let staffRow = null;

            try {
                const { data: staffRows, error } = await sb
                    .from("staff_applications")
                    .select("*")
                    .eq("email", activeStaff.email)
                    .limit(1);

                if (!error && staffRows && staffRows.length > 0) {
                    staffRow = staffRows[0];
                    const det = parseJsonField(staffRow.details);
                    if (!activeStaff.name || activeStaff.name === 'undefined') {
                        const nk = Object.keys(det).find(k => k.toLowerCase().includes('name'));
                        if (nk && det[nk]) {
                            activeStaff.name = String(det[nk]).trim();
                            document.getElementById('teacher-badge').innerText = `ID: ${activeStaff.name}`;
                        }
                    }
                }
            } catch (e) {
                console.error("Staff profile load failed:", e);
            }

            await initBranchAndSession(staffRow);

            if (isAdmin) {
                document.getElementById('auth-btn')?.classList.remove('hidden');
                document.getElementById('admin-hub-btn')?.classList.remove('hidden');
            } else if (staffRow) {
                const det = parseJsonField(staffRow.details);
                const canEditVal = staffRow.can_edit_lesson_planner ?? staffRow.canEditLessonPlanner ?? det.canEditLessonPlanner;
                const canViewVal = staffRow.can_view_lesson_planner_summary ?? staffRow.canViewLessonPlannerSummary ?? det.canViewLessonPlannerSummary;
                const canUnlockVal = staffRow.can_unlock_lesson_planner ?? staffRow.canUnlockLessonPlanner ?? det.canUnlockLessonPlanner;

                const canEdit = canEditVal === true || String(canEditVal || '').toUpperCase() === activeCenter || isTruthyPermission(canEditVal);
                const canView = canViewVal === true || String(canViewVal || '').toUpperCase() === activeCenter || isTruthyPermission(canViewVal);
                const canUnlock = canUnlockVal === true || String(canUnlockVal || '').toUpperCase() === activeCenter || isTruthyPermission(canUnlockVal);
                if (canEdit || canView || canUnlock) {
                    document.getElementById('admin-hub-btn')?.classList.remove('hidden');
                }
            }

            applyBranchTheme();
            await fetchTodayData();
        };

        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        function toggleDemoMode(active) {
            isDemoMode = active;
            document.getElementById('demo-mode-indicator').classList.toggle('hidden', !active);
            document.getElementById('demo-toggle-btn').classList.toggle('hidden', active);
            
            if (active) {
                mySessions = [
                    { id: 'sess1', assignmentId: 'sim_id_Mathematics', plannerId: 'sim_id_Mathematics', className: 'Warrior Batches', section: 'J1', subject: 'Mathematics', start: '09:30 AM', end: '11:00 AM', duration: 90 },
                    { id: 'sess2', assignmentId: 'sim_id_Mathematics', plannerId: 'sim_id_Mathematics', className: 'Warrior Batches', section: 'J1', subject: 'Mathematics', start: '01:00 PM', end: '02:00 PM', duration: 60 }

        async function fetchTodayData() {
            if (!activeBranchId) return;
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayName = days[new Date().getDay()];
            const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;
            const mySafeNameMatch = safeName.trim().toLowerCase();
            const myEmailMatch = String(activeStaff.email || '').trim().toLowerCase();

            document.getElementById('classes-grid').innerHTML = `
                <div class="col-span-full text-center py-24 text-slate-400 font-bold uppercase text-xs tracking-[0.2em]">
                    <span class="loader mb-4"></span><br>Fetching Live Timetable from Supabase...
                </div>`;

            try {
                let holQ = sb.from("school_holidays").select("*").eq("branch_id", activeBranchId);
                let histQ = sb.from("timetable_history").select("*").eq("branch_id", activeBranchId);
                let ttQ = sb.from("timetable").select("*").eq("branch_id", activeBranchId);
                let plannerQ = sb.from("lesson_planners").select("*").eq("branch_id", activeBranchId);
                let leaveQ = sb.from("leave_requests").select("*").eq("branch_id", activeBranchId);
                let structQ = sb.from("institute_structure").select("*").eq("branch_id", activeBranchId);
                let metaQ = sb.from("system_metadata").select("*").eq("branch_id", activeBranchId);

                if (activeSessionId) {
                    holQ = holQ.eq("session_id", activeSessionId);
                    histQ = histQ.eq("session_id", activeSessionId);
                    ttQ = ttQ.eq("session_id", activeSessionId);
                    plannerQ = plannerQ.eq("session_id", activeSessionId);
                    leaveQ = leaveQ.eq("session_id", activeSessionId);
                    structQ = structQ.eq("session_id", activeSessionId);
                }

                const [holRes, histRes, ttRes, plannerRes, leaveRes, structRes, metaRes] = await Promise.all([
                    holQ, histQ, ttQ, plannerQ, leaveQ, structQ, metaQ
                ]);

                holidaysData = (holRes.data || []).map(h => ({
                    ...h,
                    startDate: h.start_date ?? h.startDate,
                    endDate: h.end_date ?? h.endDate ?? h.start_date ?? h.startDate,
                    isFullDay: h.is_full_day ?? h.isFullDay ?? true,
                    startTime: h.start_time ?? h.startTime,
                    endTime: h.end_time ?? h.endTime,
                    suspendClasses: h.suspend_classes ?? h.suspendClasses ?? true,
                    targetClasses: Array.isArray(h.target_classes) ? h.target_classes : (Array.isArray(h.targetClasses) ? h.targetClasses : ['ALL'])
                }));

                window.historyOverrides = (histRes.data || [])
                    .filter(h => h.status !== "CANCELLED")
                    .map(h => ({
                        ...h,
                        type: h.entry_type ?? h.type,
                        schedule: Array.isArray(h.schedule) ? h.schedule : []
                    }));

                window.fullTimetable = (ttRes.data || []).map(t => ({
                    ...t,
                    className: t.class_name ?? t.className ?? '',
                    section: t.section ?? t.section_name ?? '',
                    subject: t.subject ?? '',
                    teacherName: t.teacher_name ?? t.teacherName ?? t.teacher ?? '',
                    teacherEmail: t.teacher_email ?? t.teacherEmail ?? '',
                    start24: t.start24 ?? t.start_24 ?? '',
                    end24: t.end24 ?? t.end_24 ?? '',
                    timeRange: t.time_range ?? t.timeRange ?? ''
                }));

                let rawPlannerRows = plannerRes.data || [];
                if (activeSessionId && rawPlannerRows.length === 0) {
                    const { data: fallbackPlanners } = await sb.from("lesson_planners").select("*").eq("branch_id", activeBranchId);
                    rawPlannerRows = fallbackPlanners || [];
                }
                window.allPlanners = rawPlannerRows.map(normalizePlannerRow);

                window.allStructures = (structRes.data || []).map(s => ({
                    ...s,
                    dbId: s.id,
                    id: s.firestore_id || s.id,
                    className: s.class_name ?? s.className ?? '',
                    sectionName: s.section_name ?? s.sectionName ?? '',
                    subjects: Array.isArray(s.subjects) ? s.subjects : []
                }));

                globalAutoLock = true;
                enableDailyBlock = false;
                const settingsMeta = (metaRes.data || []).find(m =>
                    m.meta_key === 'lesson_planner_settings' ||
                    String(m.firestore_id || '').includes('lesson_planner_settings')
                );
                if (settingsMeta) {
                    const mv = parseJsonField(settingsMeta.meta_value);
                    if (mv.autoLockEnabled === false) globalAutoLock = false;
                    if (mv.dailyComplianceBlockEnabled === true) enableDailyBlock = true;
                }

                window.myAbsences = [];
                window.mySubstitutions = [];

                (leaveRes.data || []).forEach(rawLeave => {
                    const rawObj = parseJsonField(rawLeave.raw_data);
                    const leaveData = {
                        ...rawObj,
                        ...rawLeave,
                        teacherEmail: rawLeave.teacher_email ?? rawLeave.teacherEmail ?? rawObj.teacherEmail ?? '',
                        startDate: rawLeave.start_date ?? rawLeave.startDate ?? rawObj.startDate ?? '',
                        endDate: rawLeave.end_date ?? rawLeave.endDate ?? rawObj.endDate ?? '',
                        adjustments: Array.isArray(rawLeave.adjustments) ? rawLeave.adjustments : (Array.isArray(rawObj.adjustments) ? rawObj.adjustments : [])
                    };

                    if (leaveData.status === "APPROVED" && String(leaveData.teacherEmail).toLowerCase() === myEmailMatch) {
                        if (leaveData.type === 'FULL' && leaveData.startDate) {
                            let currDate = new Date(leaveData.startDate + "T00:00:00");
                            let endObj = new Date((leaveData.endDate || leaveData.startDate) + "T00:00:00");
                            while (currDate <= endObj) {
                                const localY = currDate.getFullYear();
                                const localM = String(currDate.getMonth() + 1).padStart(2, '0');
                                const localD = String(currDate.getDate()).padStart(2, '0');
                                window.myAbsences.push({ date: `${localY}-${localM}-${localD}`, isFullDay: true });
                                currDate.setDate(currDate.getDate() + 1);
                            }
                        } else if (leaveData.adjustments) {
                            leaveData.adjustments.forEach(adj => {
                                let cNameAdj = adj.className || (adj.sub ? adj.sub.split('|')[0].trim() : "");
                                let sNameAdj = adj.section || (adj.sub && adj.sub.split('|')[1] ? adj.sub.split('|')[1].replace('Sec', '').trim() : "");
                                window.myAbsences.push({ date: adj.date, isFullDay: false, className: cNameAdj, section: sNameAdj, subject: adj.title });
                            });
                        }
                    }

                    if (leaveData.status === "PENDING" || leaveData.status === "APPROVED") {
                        if (leaveData.adjustments) {
                            leaveData.adjustments.forEach(adj => {
                                if (adj.substituteResponse === "ACCEPTED" && String(adj.adjustedEmail || '').toLowerCase() === myEmailMatch) {
                                    window.mySubstitutions.push(adj);
                                }
                            });
                        }
                    }
                });

                const matchesLoggedInTeacher = (slot) => {
                    const tEmail = String(slot.teacherEmail || slot.teacher_email || '').trim().toLowerCase();
                    if (tEmail && myEmailMatch && tEmail === myEmailMatch) return true;
                    const tName = String(slot.teacherName || slot.teacher_name || slot.teacher || '').trim().toLowerCase();
                    return tName && tName === mySafeNameMatch;
                };

                window.teacherTimetable = window.fullTimetable.filter(matchesLoggedInTeacher);

                const todayIsoStr = getLocalTodayIso();
                const todayDocsRaw = getScheduleSnapshotForDate(todayIsoStr);

                let todayDocs = todayDocsRaw.filter(s => {
                    const dayMatch = !s.day || s.day === todayName;
                    return matchesLoggedInTeacher(s) && dayMatch;
                });

                if (todayDocs.length === 0 && window.teacherTimetable.some(t => t.day === todayName)) {
                    todayDocs = window.teacherTimetable.filter(t => t.day === todayName);
                }

                function minsTo12H(m) {
                    let h = Math.floor(m / 60) % 24;
                    let mn = m % 60;
                    let mod = h >= 12 ? 'PM' : 'AM';
                    h = h % 12 || 12;
                    return `${h.toString().padStart(2, '0')}:${mn.toString().padStart(2, '0')} ${mod}`;
                }

                function format12Hour(time24) {
                    if (!time24) return "";
                    let [h, m] = String(time24).split(':');
                    let ampm = Number(h) >= 12 ? 'PM' : 'AM';
                    h = Number(h) % 12 || 12;
                    return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
                }

                window.mySubstitutions.forEach(adj => {
                    if (adj.date === todayIsoStr) {
                        const parts = (adj.sub || "").split('|');
                        const cName = parts[0] ? parts[0].trim() : "Extra Duty";
                        const sName = parts[1] ? parts[1].replace('Sec', '').trim() : "Task";

                        todayDocs.push({
                            id: 'sub_' + Math.random().toString(36).substr(2, 9),
                            className: cName,
                            section: sName,
                            subject: adj.title,
                            timeRange: `${minsTo12H(adj.start)} - ${minsTo12H(adj.end)}`,
                            duration: adj.end - adj.start,
                            teacher: safeName,
                            teacherName: safeName,
                            teacherEmail: activeStaff.email
                        });
                    }
                });

                if (todayDocs.length > 0) {
                    mySessions = todayDocs.map((data, index) => {
                        const docId = data.id || `override_${index}`;

                        let startTime = "00:00 AM", endTime = "00:00 AM";
                        if (data.start24 && data.end24) {
                            startTime = format12Hour(data.start24);
                            endTime = format12Hour(data.end24);
                        } else if (data.timeRange) {
                            const times = String(data.timeRange).split(' - ');
                            startTime = times[0] || "00:00 AM";
                            endTime = times[1] || "00:00 AM";
                        }

                        const norm = (str) => (str || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

                        const structMatch = window.allStructures.find(s =>
                            norm(s.className) === norm(data.className) &&
                            norm(s.sectionName) === norm(data.section)
                        );

                        const structId = structMatch ? structMatch.id : `MATCH_FAILED_${data.className}_${data.section}`;

                        let exactSubjectCasing = data.subject;
                        if (structMatch && structMatch.subjects) {
                            const matchedSub = structMatch.subjects.find(s => norm(s) === norm(data.subject));
                            if (matchedSub) exactSubjectCasing = matchedSub;
                        }

                        const expectedId = `${structId}_${exactSubjectCasing}`.replace(/\s+/g, '_');
                        const matchedPlanner = structMatch ? findPlannerForSubject(structMatch, exactSubjectCasing, expectedId) : null;
                        const resolvedPlannerId = matchedPlanner ? matchedPlanner.id : expectedId;

                        return {
                            id: docId,
                            assignmentId: expectedId,
                            plannerId: resolvedPlannerId,
                            className: data.className,
                            section: data.section,
                            subject: data.subject,
                            start: startTime,
                            end: endTime,
                            duration: parseInt(data.duration) || 0,
                            remark: data.remark || ""
                        };
                    });
                } else {
                    mySessions = [];
                }
                myDuties = [];

                renderClassesGrid();
            } catch (e) {
                console.error(e);
                document.getElementById('classes-grid').innerHTML = `<div class="col-span-full text-center py-20 text-rose-500 font-bold uppercase text-[11px] tracking-widest">Error fetching data from Supabase. Check connection and refresh.</div>`;
            }
        }

            document.getElementById('syll-session-badge').innerText = `Allocating Timetable Session: ${activeSessionMins} Mins`;
