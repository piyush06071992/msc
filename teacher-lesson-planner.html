<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Daily Work Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15); border-color: #3b82f6; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] text-white px-6 py-4 flex justify-between items-center shadow-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="p-2 bg-white/10 hover:bg-white/20 rounded-xl transition-all">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-black tracking-widest uppercase">Daily Work Report</h1>
        </div>
        <div id="teacher-badge" class="bg-indigo-900/50 px-4 py-2 rounded-full border border-indigo-700 text-[10px] font-black uppercase tracking-widest text-indigo-200">
            Loading...
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 space-y-8">
        
        <div class="flex bg-white p-2 rounded-2xl shadow-sm border border-slate-200 gap-2">
            <button class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest text-[10px] shadow-md">Today's Classes</button>
            <button class="flex-1 py-3 bg-transparent text-slate-400 hover:text-slate-600 rounded-xl font-black uppercase tracking-widest text-[10px]">Duties</button>
            <button class="flex-1 py-3 bg-transparent text-slate-400 hover:text-slate-600 rounded-xl font-black uppercase tracking-widest text-[10px]">Separate Work</button>
        </div>

        <div>
            <h2 class="font-black text-slate-900 uppercase tracking-widest mb-4 flex items-center gap-2">
                <span class="w-2 h-6 bg-blue-600 rounded-full inline-block"></span> My Assigned Classes
            </h2>
            <div id="classes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-20 text-slate-400 font-bold uppercase text-[10px] tracking-widest">
                    <span class="loader mb-2"></span><br>Syncing Master Timetable...
                </div>
            </div>
        </div>

    </main>

    <div id="mode-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="mode-class-title" class="text-xl font-black text-slate-900 uppercase tracking-tight">Select Mode</h3>
                <button onclick="closeModal('mode-modal')" class="text-slate-400 hover:text-rose-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6">How was today's session utilized?</p>
            
            <div class="space-y-4">
                <button onclick="openSyllabusChecklist()" class="w-full p-5 border-2 border-slate-100 rounded-2xl hover:border-blue-500 hover:bg-blue-50 transition-all text-left group">
                    <div class="font-black text-slate-800 uppercase tracking-widest group-hover:text-blue-700">📚 Mark Syllabus Progress</div>
                    <div class="text-[10px] font-bold text-slate-400 mt-1">Tick completed subtopics to update analytics.</div>
                </button>

                <div class="border-2 border-slate-100 rounded-2xl p-5 focus-within:border-amber-500 focus-within:bg-amber-50 transition-all">
                    <div class="font-black text-slate-800 uppercase tracking-widest mb-3">🎯 Revision / Activity</div>
                    <textarea id="revision-reason" rows="3" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-[11px] font-bold outline-none focus:border-amber-500" placeholder="Mandatory: Describe the activity (e.g. Extra MCQ Practice, Doubt Session)"></textarea>
                    <button onclick="submitRevision()" class="w-full mt-3 bg-amber-500 text-white font-black py-3 rounded-xl uppercase tracking-widest text-[10px] shadow-lg hover:bg-amber-600">Log Activity</button>
                </div>
            </div>
        </div>
    </div>

    <div id="syllabus-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[110] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] p-8 max-w-4xl w-full h-[90vh] flex flex-col shadow-2xl">
            
            <div class="flex justify-between items-center mb-6 shrink-0">
                <div>
                    <h3 id="syll-class-title" class="text-2xl font-black text-slate-900 uppercase tracking-tighter"></h3>
                    <p class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mt-1">Syllabus Execution Portal</p>
                </div>
                <button onclick="closeModal('syllabus-modal')" class="p-3 bg-slate-100 rounded-xl text-slate-500 hover:bg-rose-100 hover:text-rose-600 transition-all"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>

            <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl mb-6 shrink-0">
                <p class="text-[10px] font-black text-amber-800 uppercase tracking-widest">⚠️ Warning: Topics ticked here are permanently locked. Only Admin can edit after submission.</p>
            </div>

            <div id="chapter-accordion-container" class="flex-1 overflow-y-auto custom-scroll space-y-4 pr-2">
                </div>

            <div class="pt-6 border-t mt-4 shrink-0">
                <button onclick="confirmDaySubmission()" class="w-full bg-emerald-600 text-white font-black py-5 rounded-2xl uppercase tracking-widest text-xs shadow-xl shadow-emerald-600/30 hover:bg-emerald-700 active:scale-95 transition-all">
                    Confirm Day Submission
                </button>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null;
        let myClasses = [];
        let currentPlannerData = null;
        let currentSubjectId = null;

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');

            document.getElementById('teacher-badge').innerText = activeStaff.name || activeStaff.email;
            await fetchMyClasses();
        };

        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        async function fetchMyClasses() {
            try {
                // Find assignments strictly for this teacher
                const snap = await db.collection("lesson_planner_assignments").where("assignedTo", "==", activeStaff.email).get();
                myClasses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                const grid = document.getElementById('classes-grid');
                grid.innerHTML = '';

                if(myClasses.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold uppercase text-[10px] tracking-widest">No classes assigned to you yet.</div>`;
                    return;
                }

                myClasses.forEach(cls => {
                    grid.innerHTML += `
                        <button onclick="openModeSelection('${cls.id}', '${cls.className} - ${cls.section} | ${cls.subject}')" class="bg-white border border-slate-200 p-6 rounded-3xl card-hover text-left w-full relative overflow-hidden group">
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500 group-hover:bg-blue-600 transition-colors"></div>
                            <h3 class="text-xl font-black text-slate-900 tracking-tighter">${cls.className} <span class="text-slate-300">|</span> ${cls.section}</h3>
                            <p class="text-xs font-bold text-blue-600 uppercase tracking-widest mt-1">${cls.subject}</p>
                            <div class="mt-6 flex justify-between items-center border-t border-slate-50 pt-4">
                                <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Target: ${cls.targetDate ? new Date(cls.targetDate).toLocaleDateString() : 'TBD'}</span>
                                <span class="bg-slate-100 text-slate-500 px-3 py-1 rounded-lg text-[9px] font-black uppercase">Open Session ➔</span>
                            </div>
                        </button>
                    `;
                });
            } catch(e) { console.error(e); }
        }

        function openModeSelection(id, title) {
            currentSubjectId = id;
            document.getElementById('mode-class-title').innerText = title;
            document.getElementById('revision-reason').value = '';
            openModal('mode-modal');
        }

        // --- REVISION LOGIC ---
        async function submitRevision() {
            const reason = document.getElementById('revision-reason').value.trim();
            if(!reason) return alert("Please provide a reason for the activity/revision.");

            try {
                // Save revision log for Gap Calculation later (Step 11)
                await db.collection("lesson_planner_revisions").add({
                    assignmentId: currentSubjectId,
                    teacher: activeStaff.email,
                    date: new Date().toISOString().split('T')[0], // YYYY-MM-DD
                    reason: reason,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Activity Logged Successfully!");
                closeModal('mode-modal');
            } catch(e) { alert("Error saving activity."); }
        }

        // --- SYLLABUS EXECUTION LOGIC ---
        async function openSyllabusChecklist() {
            closeModal('mode-modal');
            document.getElementById('syll-class-title').innerText = document.getElementById('mode-class-title').innerText;
            openModal('syllabus-modal');

            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = `<div class="text-center py-10"><span class="loader"></span></div>`;

            try {
                const doc = await db.collection("lesson_planners").doc(currentSubjectId).get();
                if(!doc.exists || !doc.data().syllabusData) {
                    container.innerHTML = `<div class="text-center py-10 text-rose-500 font-black uppercase text-xs">Syllabus not uploaded by Admin yet.</div>`;
                    return;
                }
                
                currentPlannerData = doc.data().syllabusData;
                renderSyllabusList();
            } catch(e) { console.error(e); }
        }

        function renderSyllabusList() {
            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = '';
            
            const chNames = [...new Set(currentPlannerData.map(r => r["CHAPTER NAME"]))];

            chNames.forEach(ch => {
                const rows = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                const allDone = rows.every(r => r.isDone);

                let topicsHTML = rows.map(r => {
                    const absIdx = currentPlannerData.indexOf(r);
                    return `
                        <div class="flex items-center justify-between p-4 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition-colors">
                            <div>
                                <div class="text-xs font-black text-slate-800">${r['SUBTOPICS']}</div>
                                <div class="text-[9px] font-bold text-slate-400 uppercase mt-1">Lec ${r['LECTURE NUMBER']} | Std Time: ${r['Standard Class Duration'] || 0}m</div>
                            </div>
                            <div>
                                ${r.isDone 
                                    ? `<span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M5 13l4 4L19 7"/></svg> Locked</span>`
                                    : `<input type="checkbox" class="topic-cb w-6 h-6 accent-blue-600 cursor-pointer shadow-sm" data-idx="${absIdx}" data-duration="${r['Standard Class Duration'] || 0}">`
                                }
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML += `
                    <div class="bg-white border ${allDone ? 'border-emerald-200' : 'border-slate-200'} rounded-2xl overflow-hidden shadow-sm mb-4">
                        <div class="p-5 ${allDone ? 'bg-emerald-50' : 'bg-slate-50'} border-b flex justify-between items-center">
                            <h4 class="font-black text-sm uppercase tracking-tight text-slate-900">${ch}</h4>
                            ${allDone ? '<span class="text-[10px] text-emerald-600 font-black uppercase tracking-widest">✓ Completed</span>' : ''}
                        </div>
                        <div class="${allDone ? 'opacity-60 pointer-events-none' : ''}">
                            ${topicsHTML}
                        </div>
                    </div>
                `;
            });
        }

        async function confirmDaySubmission() {
            const checkboxes = document.querySelectorAll('.topic-cb:checked');
            if(checkboxes.length === 0) return alert("You have not ticked any new topics.");

            if(confirm("Confirm Submission? Ticked topics will be permanently locked and time will be logged.")) {
                const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
                
                // Update local array (Step 08 & 09 logic)
                checkboxes.forEach(cb => {
                    const idx = cb.dataset.idx;
                    const duration = cb.dataset.duration;
                    currentPlannerData[idx].isDone = true;
                    currentPlannerData[idx].completedDate = today;
                    currentPlannerData[idx].completedMinutes = duration; // Fallback Standard Mins (Step 10 logic later)
                    currentPlannerData[idx].tickedBy = activeStaff.email; 
                });

                try {
                    // Save back to Firestore
                    await db.collection("lesson_planners").doc(currentSubjectId).update({
                        syllabusData: currentPlannerData
                    });
                    alert("Submission Locked Successfully!");
                    closeModal('syllabus-modal');
                } catch(e) {
                    alert("Error saving data. Please check your connection.");
                }
            }
        }
    </script>
</body>
</html>
