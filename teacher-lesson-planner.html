<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Daily Work Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .card-prism { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px -2px rgba(0,0,0,0.02); transition: all 0.3s ease; }
        .card-prism:hover { transform: translateY(-3px); border-color: #3b82f6; box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.1); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .loader { border: 2px solid #f1f5f9; border-top: 2px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Clean Details Dropdown Arrow */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 p-4 sm:px-8 sm:py-5 flex flex-wrap justify-between items-center shadow-lg gap-3">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors shadow-md border border-indigo-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"/></svg>
                Home
            </button>
            <div>
                <h1 class="text-sm sm:text-xl font-black uppercase text-white tracking-widest">Daily Work Report</h1>
                <p id="teacher-badge" class="text-[9px] sm:text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Loading...</p>
            </div>
            <div class="flex gap-2 ml-4">
    <button id="auth-btn" onclick="window.location.href='admin-lesson-auth.html'" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-colors shadow-md border border-indigo-500 flex items-center gap-2">
        🔐 Delegation
    </button>
    <button id="admin-hub-btn" onclick="window.location.href='admin-lesson-planner.html'" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-colors shadow-md border border-blue-500 flex items-center gap-2">
        📊 Planner Hub
    </button>
</div>
        </div>
        <div class="flex items-center gap-3">
            <div id="demo-mode-indicator" class="hidden bg-amber-500/20 text-amber-300 px-3 py-2 rounded-xl text-[9px] font-black uppercase border border-amber-500/50 flex items-center gap-2">
                <span>Simulation</span>
                <button onclick="toggleDemoMode(false)" class="underline hover:text-white">Exit</button>
            </div>
            <button id="demo-toggle-btn" onclick="toggleDemoMode(true)" class="text-[9px] font-black text-indigo-200 uppercase tracking-widest border border-indigo-700 px-4 py-2 rounded-full hover:bg-indigo-800 transition-all">Simulation</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-10 space-y-6 sm:space-y-8">
        
        <div class="flex bg-white p-2 rounded-2xl shadow-sm border border-slate-200 gap-2 max-w-2xl overflow-x-auto">
            <button id="tab-classes-view" onclick="switchTab('classes-view')" class="tab-btn shrink-0 px-6 py-3.5 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest text-[10px] shadow-md transition-all">Today's Classes</button>
            <button id="tab-duties-view" onclick="switchTab('duties-view')" class="tab-btn shrink-0 px-6 py-3.5 bg-transparent text-slate-500 hover:text-slate-800 rounded-xl font-black uppercase tracking-widest text-[10px] transition-all">Duties</button>
            <button id="tab-extra-view" onclick="switchTab('extra-view')" class="tab-btn shrink-0 px-6 py-3.5 bg-transparent text-slate-500 hover:text-slate-800 rounded-xl font-black uppercase tracking-widest text-[10px] transition-all">Separate Work</button>
        </div>

        <div id="classes-view" class="space-y-6">
            <div id="classes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-24 text-slate-400 font-bold uppercase text-xs tracking-[0.2em]">
                    <span class="loader mb-4"></span><br>Fetching Timetable...
                </div>
            </div>
        </div>

        <div id="duties-view" class="hidden space-y-6">
            <div class="bg-white rounded-[2rem] sm:rounded-[3rem] p-6 sm:p-10 border border-slate-200 shadow-xl">
                <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight mb-6">Assigned Duties (Today)</h2>
                <div id="duties-list" class="space-y-4"></div>
            </div>
        </div>

        <div id="extra-view" class="hidden space-y-6">
            <div class="bg-white rounded-[2rem] sm:rounded-[3rem] p-6 sm:p-10 border border-slate-200 shadow-xl">
                <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight mb-2">Log Separate Work</h2>
                <textarea id="extra-work-text" rows="6" class="w-full bg-slate-50 border-2 border-slate-200 rounded-[2rem] p-6 text-sm font-bold text-slate-700 outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner mt-4" placeholder="E.g. Checked 50 terminal exam papers for Class 11..."></textarea>
                <div class="flex justify-end mt-6">
                    <button onclick="submitExtraWork()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-2xl font-black uppercase tracking-widest text-[11px] shadow-lg transition-all active:scale-95">Log Separate Work</button>
                </div>
            </div>
        </div>
    </main>

    <div id="mode-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="mode-class-title" class="text-xl font-black text-slate-900 uppercase tracking-tighter"></h3>
                <button onclick="closeModal('mode-modal')" class="text-slate-400 hover:text-rose-500 bg-slate-100 p-2 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            
            <p id="mode-session-info" class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-6 bg-blue-50 inline-block px-3 py-1.5 rounded-lg border border-blue-100"></p>
            
            <div class="space-y-4">
                <button onclick="openSyllabusChecklist()" class="w-full p-5 border-2 border-slate-100 rounded-[1.5rem] hover:border-blue-500 hover:bg-blue-50 transition-all text-left group shadow-sm">
                    <div class="font-black text-slate-800 text-base uppercase tracking-widest group-hover:text-blue-700 flex items-center gap-3">
                        <span class="bg-blue-100 text-blue-600 p-2.5 rounded-xl">📚</span> Mark Syllabus Progress
                    </div>
                </button>

                <div class="border-2 border-slate-100 rounded-[1.5rem] p-5 focus-within:border-amber-500 focus-within:bg-amber-50 transition-all shadow-sm">
                    <div class="font-black text-slate-800 text-base uppercase tracking-widest mb-3 flex items-center gap-3">
                        <span class="bg-amber-100 text-amber-600 p-2.5 rounded-xl">🎯</span> Revision / Activity
                    </div>
                    <textarea id="revision-reason" rows="2" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-[11px] font-bold text-slate-700 outline-none focus:border-amber-500" placeholder="Mandatory Reason..."></textarea>
                    <button onclick="submitRevision()" class="w-full mt-3 bg-amber-500 text-white font-black py-3 rounded-xl uppercase tracking-widest text-[10px] shadow-lg hover:bg-amber-600 active:scale-95 transition-all">Submit Activity Log</button>
                </div>
            </div>
        </div>
    </div>

    <div id="syllabus-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-xl z-[150] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-6 sm:p-10 max-w-4xl w-full h-[92vh] flex flex-col shadow-2xl relative overflow-hidden">
            
            <div class="flex justify-between items-center mb-6 shrink-0 bg-white">
                <div>
                    <h3 id="syll-class-title" class="text-xl sm:text-2xl font-black text-slate-900 uppercase tracking-tighter"></h3>
                    <div class="flex flex-wrap gap-2 sm:gap-4 items-center mt-2">
                        <p class="text-[9px] font-black text-blue-600 uppercase tracking-[0.2em]">Execution Protocol</p>
                        <span id="syll-session-badge" class="bg-slate-100 text-slate-500 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest"></span>
                    </div>
                </div>
                <button onclick="closeModal('syllabus-modal')" class="p-3 bg-slate-100 rounded-xl text-slate-500 hover:bg-rose-100 hover:text-rose-600 transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>

            <div id="subject-pace-widget" class="bg-[#fdfefe] border border-slate-200 rounded-2xl p-5 mb-6 shrink-0 shadow-sm">
                </div>

            <div id="chapter-accordion-container" class="flex-1 overflow-y-auto custom-scroll space-y-4 pr-2"></div>

           <div class="pt-6 border-t mt-4 shrink-0 bg-white flex flex-col gap-3">
                <button onclick="confirmDaySubmission()" class="w-full bg-emerald-600 text-white font-black py-4 sm:py-5 rounded-2xl uppercase tracking-widest text-[11px] sm:text-xs shadow-xl shadow-emerald-600/30 hover:bg-emerald-700 active:scale-95 transition-all">
                    Securely Confirm & Log Day's Progress
                </button>
                <button id="request-unlock-btn" onclick="requestUnlock()" class="w-full bg-rose-50 text-rose-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-rose-200 hover:bg-rose-100 transition-all">
                    Made a Mistake? Request Admin Unlock
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null, mySessions = [], myDuties = [], currentPlannerData = null;
        let activeSubjectId = null, activeSessionMins = 0;
        let isDemoMode = false;

      window.onload = async () => {
    activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
    if (!activeStaff) return window.location.replace('staff-login.html');
    
    const safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
    document.getElementById('teacher-badge').innerText = `ID: ${safeName}`;

    // --- DELEGATION LOGIC ---
    const isAdmin = sessionStorage.getItem('minervaAdminAuth') === 'true';
    
    if (isAdmin) {
        // Real Admin sees everything
        document.getElementById('auth-btn')?.classList.remove('hidden');
        document.getElementById('admin-hub-btn')?.classList.remove('hidden');
    } else {
        // Teacher: Check Firestore if they have been granted specific rights
        try {
            const staffSnap = await db.collection("staff_applications")
                                      .where("email", "==", activeStaff.email)
                                      .get();
            
            if (!staffSnap.empty) {
                const data = staffSnap.docs[0].data();
                // If they have EITHER Edit or Summary rights, show the Planner Hub button
                if (data.canEditLessonPlanner || data.canViewLessonPlannerSummary) {
                    document.getElementById('admin-hub-btn')?.classList.remove('hidden');
                }
            }
        } catch (e) { console.error("Permission check failed:", e); }
    }

    await fetchTodayData();
};

        function switchTab(tabId) {
            ['classes-view', 'duties-view', 'extra-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.replace('bg-blue-600', 'bg-transparent');
                btn.classList.replace('text-white', 'text-slate-500');
            });
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.replace('bg-transparent', 'bg-blue-600');
            activeBtn.classList.replace('text-slate-500', 'text-white');
        }

        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        // --- SIMULATION ---
        function toggleDemoMode(active) {
            isDemoMode = active;
            document.getElementById('demo-mode-indicator').classList.toggle('hidden', !active);
            document.getElementById('demo-toggle-btn').classList.toggle('hidden', active);
            
            if(active) {
                // Exact Match to User Screenshot: Two Sessions for J1
                mySessions = [
                    { id: 'sess1', assignmentId: 'Warrior_Batches_J1_Mathematics', className: 'Warrior Batches', section: 'J1', subject: 'Mathematics', start: '09:30 AM', end: '11:00 AM', duration: 90 },
                    { id: 'sess2', assignmentId: 'Warrior_Batches_J1_Mathematics', className: 'Warrior Batches', section: 'J1', subject: 'Mathematics', start: '01:00 PM', end: '02:00 PM', duration: 60 }
                ];
                myDuties = [{ id: 'duty1', title: 'Invigilation Duty - Term 1', time: '03:30 PM - 05:00 PM', location: 'Hall B' }];
                renderClassesGrid(); renderDuties();
            } else { fetchTodayData(); }
        }

     async function fetchTodayData() {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const todayName = days[new Date().getDay()];
            const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;

            // 1. CHECK MEMORY FIRST (Saves your Firebase Reads!)
            const cacheKey = "minerva_tt_" + todayName + "_" + safeName;
            const cachedData = sessionStorage.getItem(cacheKey);
            
            if (cachedData) {
                const parsed = JSON.parse(cachedData);
                mySessions = parsed.mySessions;
                myDuties = parsed.myDuties;
                renderClassesGrid(); renderDuties();
                return; // STOP here. Do not ask Firebase for data.
            }

            try {
                const snap = await db.collection("timetable")
                                     .where("teacherName", "==", safeName)
                                     .where("day", "==", todayName)
                                     .get();
                
                if(!snap.empty) {
                    mySessions = snap.docs.map(d => {
                        const data = d.data();
                        const times = data.timeRange ? data.timeRange.split(' - ') : ['00:00 AM', '00:00 AM'];
                        return { 
                            id: d.id, 
                            assignmentId: `${data.className}_${data.section}_${data.subject}`.replace(/\s+/g, '_'),
                            className: data.className, section: data.section, 
                            subject: data.subject, start: times[0], end: times[1], duration: parseInt(data.duration) || 0 
                        };
                    });
                } else {
                    const assignSnap = await db.collection("lesson_planner_assignments").where("assignedTo", "==", activeStaff.email).get();
                    mySessions = assignSnap.docs.map(d => ({ 
                        id: d.id, assignmentId: d.id, className: d.data().className, section: d.data().section, 
                        subject: d.data().subject, start: '09:00 AM', end: '10:30 AM', duration: 90 
                    }));
                }
                myDuties = [];
                
                // 2. SAVE TO MEMORY FOR THE REST OF THE DAY
                sessionStorage.setItem(cacheKey, JSON.stringify({ mySessions: mySessions, myDuties: myDuties }));
                
                renderClassesGrid(); renderDuties();
            } catch(e) { console.error(e); }
        }
        function renderClassesGrid() {
            const grid = document.getElementById('classes-grid');
            grid.innerHTML = '';
            if(mySessions.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold uppercase text-[11px] tracking-widest">No classes assigned today.</div>`;
                return;
            }
            mySessions.forEach(sess => {
                grid.innerHTML += `
                    <button onclick="openModeSelection('${sess.assignmentId}', '${sess.className} - ${sess.section} | ${sess.subject}', ${sess.duration}, '${sess.start} - ${sess.end}')" 
                        class="bg-white border border-slate-200 p-6 sm:p-8 rounded-[2rem] card-prism text-left w-full relative overflow-hidden group">
                        <div class="absolute top-0 left-0 w-2 h-full bg-blue-500 group-hover:bg-blue-600 transition-colors"></div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tighter">${sess.className} <span class="text-slate-300 mx-1">|</span> ${sess.section}</h3>
                            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg text-[9px] font-black tracking-widest uppercase border border-indigo-100 shrink-0">${sess.duration} Mins</span>
                        </div>
                        <p class="text-[10px] sm:text-[11px] font-bold text-blue-600 uppercase tracking-widest mt-1">${sess.subject}</p>
                        <div class="mt-6 sm:mt-8 flex justify-between items-center border-t border-slate-100 pt-4 sm:pt-5">
                            <span class="text-[9px] sm:text-[10px] font-black text-slate-500 uppercase tracking-widest">🕒 ${sess.start} - ${sess.end}</span>
                            <span class="bg-slate-100 group-hover:bg-blue-50 group-hover:text-blue-600 text-slate-500 px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-widest transition-colors">Open ➔</span>
                        </div>
                    </button>`;
            });
        }

        function renderDuties() {
            const list = document.getElementById('duties-list');
            if(myDuties.length === 0) list.innerHTML = `<p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">No extra duties assigned today.</p>`;
            else list.innerHTML = myDuties.map(d => `
                <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                    <div><h4 class="font-black text-slate-900 text-base sm:text-lg">${d.title}</h4><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">📍 ${d.location}</p></div>
                    <span class="bg-amber-100 text-amber-700 px-4 py-2 rounded-xl text-[10px] font-black tracking-widest uppercase self-start">🕒 ${d.time}</span>
                </div>`).join('');
        }

        function openModeSelection(assignmentId, title, duration, timeString) {
            activeSubjectId = assignmentId; activeSessionMins = duration;
            document.getElementById('mode-class-title').innerText = title;
            document.getElementById('mode-session-info').innerText = `Timetable: ${timeString} | Session Length: ${duration} Minutes`;
            document.getElementById('revision-reason').value = '';
            openModal('mode-modal');
        }

        async function submitRevision() {
            const reasonBox = document.getElementById('revision-reason');
            const reason = reasonBox.value.trim();
            
            if (!reason) {
                alert("Please enter a mandatory reason for the revision or activity.");
                reasonBox.focus();
                return;
            }

            const btn = event.target;
            btn.innerText = "Logging..."; btn.disabled = true;

            const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;
            const todayStr = new Date().toISOString().split('T')[0];

            const logEntry = {
                date: todayStr,
                reason: reason,
                minutes: activeSessionMins, // Captures the exact timetable duration
                loggedBy: safeName,
                timestamp: new Date().getTime()
            };

            try {
                if(isDemoMode) {
                    alert(`Simulation: Activity logged for ${activeSessionMins} mins.\nReason: ${reason}`);
                } else {
                    // Saves directly to an 'activityLogs' array inside this specific subject
                    await db.collection("lesson_planners").doc(activeSubjectId).set({
                        activityLogs: firebase.firestore.FieldValue.arrayUnion(logEntry)
                    }, { merge: true });
                    alert("Activity Successfully Logged! Have a great day.");
                }
                closeModal('mode-modal');
                fetchTodayData(); // Reset the UI seamlessly
            } catch(e) {
                console.error(e);
                alert("Error logging activity: " + e.message);
            } finally {
                btn.innerText = "Submit Activity Log"; btn.disabled = false;
            }
        }

        // --- EXACT HTML RECONSTRUCTION OF PDF LOGIC ---
      async function openSyllabusChecklist() {
            closeModal('mode-modal');
            document.getElementById('syll-class-title').innerText = document.getElementById('mode-class-title').innerText;
            document.getElementById('syll-session-badge').innerText = `Allocating Timetable Session: ${activeSessionMins} Mins`;
            openModal('syllabus-modal');
            
            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = `<div class="text-center py-20"><span class="loader"></span></div>`;

            if(isDemoMode) { 
                currentPlannerData = getMockSyllabus(); 
                window.currentActivityLogs = []; 
                renderSyllabusExactMath(); 
                return; 
            }

           try {
                const doc = await db.collection("lesson_planners").doc(activeSubjectId).get();
                if(!doc.exists || !doc.data().syllabusData) {
                    document.getElementById('subject-pace-widget').innerHTML = '';
                    return container.innerHTML = `<div class="text-center py-20 text-rose-500 font-black uppercase text-xs tracking-widest">Syllabus Not Defined by Admin</div>`;
                }
                const docData = doc.data();
                currentPlannerData = docData.syllabusData;
                window.currentActivityLogs = docData.activityLogs || []; 
                window.isSubjectUnlocked = docData.isUnlocked === true;
                window.unlockRequested = docData.unlockRequested === true;
                
                // Smart Button Status
                const reqBtn = document.getElementById('request-unlock-btn');
                if(window.isSubjectUnlocked) {
                    reqBtn.innerText = "🔓 Unlocked! You can now make corrections.";
                    reqBtn.className = "w-full bg-emerald-50 text-emerald-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-emerald-200 cursor-default";
                    reqBtn.disabled = true;
                } else if(window.unlockRequested) {
                    reqBtn.innerText = "Unlock Requested ⏳";
                    reqBtn.className = "w-full bg-amber-50 text-amber-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-amber-200 cursor-not-allowed";
                    reqBtn.disabled = true;
                } else {
                    reqBtn.innerText = "Made a Mistake? Request Admin Unlock";
                    reqBtn.className = "w-full bg-rose-50 text-rose-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-rose-200 hover:bg-rose-100 transition-all";
                    reqBtn.disabled = false;
                }
                
                renderSyllabusExactMath();
            } catch(e) { console.error(e); }
        }

        function renderSyllabusExactMath() {
            const getWorkingDays = (startDateStr, endDateStr) => {
                if (!startDateStr || !endDateStr) return 0;
                let count = 0; let cur = new Date(startDateStr); const finish = new Date(endDateStr);
                if(isNaN(cur) || isNaN(finish)) return 0;
                while (cur <= finish) { if (cur.getDay() !== 0) count++; cur.setDate(cur.getDate() + 1); }
                return count;
            };

            let totalSubtopics = currentPlannerData.length;
            let completedSubtopics = currentPlannerData.filter(r => r.isDone).length;
            let progressPct = totalSubtopics === 0 ? 0 : Math.round((completedSubtopics / totalSubtopics) * 100);
            
            const chMap = new Map();
            currentPlannerData.forEach(r => {
                if(!chMap.has(r['CHAPTER NAME'])) {
                    chMap.set(r['CHAPTER NAME'], { days: parseInt(r['Target days for chapter']) || 0, mins: parseInt(r['Target Minutes For Chapter']) || 0, isStarted: false });
                }
                if (r.chapterStartDate || r.isDone) chMap.get(r['CHAPTER NAME']).isStarted = true;
            });
            
            let totalTargetDaysAll = 0, totalTargetMinsAll = 0;
            let completedTargetDays = 0, completedTargetMins = 0;
            let completedActualDays = 0, completedActualMins = 0;
            let coveredDates = new Set();

            chMap.forEach(v => { totalTargetDaysAll += v.days; totalTargetMinsAll += v.mins; });

            const container = document.getElementById('chapter-accordion-container');
            container.innerHTML = '';
            
            const chNames = Array.from(chMap.keys());
            let htmlContent = "";

            chNames.forEach(ch => {
                const rows = currentPlannerData.filter(r => r["CHAPTER NAME"] === ch);
                const doneR = rows.filter(r => r.isDone);
                const isStarted = rows[0].chapterStartDate || doneR.length > 0;
                const isCompleted = doneR.length === rows.length && rows.length > 0;

                const targetDays = parseInt(rows[0]?.['Target days for chapter']) || 0;
                const targetMins = parseInt(rows[0]?.['Target Minutes For Chapter']) || 0;

                let dailyMap = {}; let extraMins = 0;
                doneR.forEach(r => {
                    let d = r.completedDate; let m = parseInt(r.completedMinutes) || 0;
                    if(d) { if(!dailyMap[d] || m > dailyMap[d]) dailyMap[d] = m; } else extraMins += m;
                });
                const actualMins = Object.values(dailyMap).reduce((a,b) => a+b, 0) + extraMins;

                let chStartStr = rows[0]?.chapterStartDate; let chStart = chStartStr ? new Date(chStartStr) : null;
                const compDates = doneR.map(r => new Date(r.completedDate)).filter(d => !isNaN(d));
                const chEnd = compDates.length ? new Date(Math.max(...compDates)) : null;

                let gapHtml = "", actualDaysTaken = 0;

                if (chStart && chEnd) {
                    let cur = new Date(chStart); let finish = new Date(chEnd);
                    while(cur <= finish) {
                        if(cur.getDay() !== 0) {
                            actualDaysTaken++; coveredDates.add(cur.toISOString().split('T')[0]);
                        }
                        cur.setDate(cur.getDate() + 1);
                    }
                }

                if (isCompleted && chStart && chEnd) {
                    let dayGap = targetDays - actualDaysTaken; 
                    let minGap = targetMins - actualMins;      

                    completedTargetDays += targetDays; completedTargetMins += targetMins;
                    completedActualDays += actualDaysTaken; completedActualMins += actualMins;

                    gapHtml = `
                        <div class="flex flex-wrap gap-2 mt-2">
                            <span class="text-[9px] font-black px-3 py-1 rounded-full border ${dayGap >= 0 ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-600 border-rose-100'}">${dayGap > 0 ? '+' : ''}${dayGap} Days Variance</span>
                            <span class="text-[9px] font-black px-3 py-1 rounded-full border ${minGap >= 0 ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-amber-50 text-amber-600 border-amber-100'}">${minGap > 0 ? '+' : ''}${minGap}m Class Variance</span>
                        </div>`;
                }

                let badge = isCompleted ? `<span class="bg-emerald-500 text-white px-3 py-1 rounded-md text-[9px] font-black uppercase">✓ COMPLETED</span>` 
                          : (isStarted ? `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-md text-[9px] font-black uppercase">ONGOING</span>` 
                          : `<span class="bg-slate-200 text-slate-600 px-3 py-1 rounded-md text-[9px] font-black uppercase">PENDING</span>`);

                let contentHTML = '';
                if (!isStarted) {
                    contentHTML = `<div class="p-6 text-center bg-white border-t border-slate-100"><button onclick="startChapter('${ch}')" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-black uppercase text-[10px] tracking-widest shadow-md hover:bg-blue-700 transition-all">Start Chapter</button></div>`;
                } else {
                    contentHTML = `<div class="${isCompleted ? 'opacity-50 pointer-events-none' : ''} bg-white border-t border-slate-100 p-2">` + rows.map(r => {
                        const absIdx = currentPlannerData.indexOf(r);
                        // Fix for ReferenceError: staffList is not defined in Teacher Portal
                        const exe = r.tickedBy || '---'; 
                        return `
                            <div class="flex items-center justify-between p-3 border-b border-slate-50 last:border-0 hover:bg-slate-50 transition-colors">
                                <div><div class="text-xs sm:text-sm font-bold text-slate-800">${r['SUBTOPICS']}</div><div class="text-[9px] font-bold text-slate-400 uppercase mt-1">Lec ${r['LECTURE NUMBER']}</div></div>
                                <div id="tick-container-${absIdx}">
                                    ${r.isDone ? `<div class="text-right"><span class="text-emerald-500 font-black text-[10px] uppercase">✓ LOGGED</span><p class="text-[9px] font-bold text-slate-400 mt-1 uppercase">${r.completedDate} | ${r.completedMinutes}m</p></div>` : `<input type="checkbox" class="topic-cb w-5 h-5 accent-blue-600 cursor-pointer shadow-sm" data-idx="${absIdx}" onchange="previewTick(this, ${absIdx})">`}
                                </div>
                            </div>`;
                    }).join('') + `</div>`;
                }

                let startHtml = `<span class="text-slate-900 ml-1 font-bold">${chStart ? chStart.toLocaleDateString('en-GB') : '--'}</span>`;

                htmlContent += `
                    <details ${isCompleted ? '' : 'open'} class="bg-[#f8f9fa] border border-slate-200 rounded-xl mb-4 overflow-hidden shadow-sm group">
                        <summary class="bg-${isCompleted ? 'slate-100' : 'slate-50'} text-slate-800 p-4 flex justify-between items-center cursor-pointer select-none outline-none">
                            <div><span class="font-black text-sm uppercase tracking-tight">${ch} <span class="text-xs ml-2 text-slate-500">(${Math.round((doneR.length/rows.length)*100)}%)</span></span>
                                <div class="flex gap-4 mt-1 text-[9px] font-bold text-slate-400 uppercase items-center"><span>Target: ${targetDays} Days / ${targetMins}m</span>${gapHtml}</div>
                            </div>
                            ${badge}
                        </summary>
                        <div class="grid grid-cols-4 bg-white text-[9px] font-black text-slate-500 text-center border-y uppercase">
                            <div class="p-3 border-r border-slate-100 flex items-center justify-center">Start: ${startHtml}</div>
                            <div class="p-3 border-r border-slate-100 flex items-center justify-center">End: <span class="text-slate-900 ml-1 font-bold">${chEnd ? chEnd.toLocaleDateString('en-GB') : '--'}</span></div>
                            <div class="p-3 border-r border-slate-100 flex items-center justify-center text-rose-500">Excluded: <span class="font-bold ml-1">None</span></div>
                            <div class="p-3 flex items-center justify-center text-blue-600">Actual Days: <span class="font-bold ml-1 text-base">${actualDaysTaken}</span></div>
                        </div>
                        ${contentHTML}
                    </details>`;
            });

            // 🎯 PROCESS ACTIVITY LOGS FOR TEACHER
            let activityLogs = window.currentActivityLogs || [];
            let extraActivityDays = 0; let activityMinsTotal = 0;
            let activityHtml = "";

            if (activityLogs.length > 0) {
                activityLogs.forEach(log => {
                    activityMinsTotal += (parseInt(log.minutes) || 0);
                    let logD = new Date(log.date); let dStr = logD.toISOString().split('T')[0];
                    if (logD.getDay() !== 0 && !coveredDates.has(dStr)) {
                        extraActivityDays++; coveredDates.add(dStr);
                    }
                });

                let logRows = activityLogs.map(log => `
                    <div class="flex justify-between items-center p-5 bg-white border-b border-amber-50 last:border-0 hover:bg-amber-50/50 transition-colors">
                        <div class="flex gap-5 items-center">
                            <span class="text-[9px] font-black text-amber-500 bg-amber-100 px-3 py-1.5 rounded-lg uppercase tracking-widest">${new Date(log.date).toLocaleDateString('en-GB')}</span>
                            <div><div class="text-[11px] font-bold text-slate-800 uppercase">${log.reason}</div><div class="text-[9px] text-slate-400 mt-1 uppercase font-bold">By: ${log.loggedBy}</div></div>
                        </div>
                        <div class="text-[10px] font-black text-amber-600 bg-amber-50 border border-amber-100 px-3 py-1.5 rounded-xl">${log.minutes} Mins</div>
                    </div>`).join('');
                
                activityHtml = `
                    <details class="bg-[#fffbeb] border border-amber-200 rounded-[2.5rem] overflow-hidden mb-8 shadow-sm group">
                        <summary class="p-6 bg-[#fffbeb] border-b border-amber-100 flex justify-between items-center cursor-pointer select-none outline-none">
                            <div class="flex items-center gap-4"><span class="text-xl text-2xl mb-1">🎯</span>
                                <div><h4 class="font-black text-amber-900 uppercase text-lg tracking-tight">Revision & Activity Logs</h4></div>
                            </div>
                            <span class="text-[10px] font-black px-6 py-2 rounded-full bg-amber-200 text-amber-800 shadow-sm">${activityLogs.length} LOGS</span>
                        </summary>
                        <div class="divide-y divide-amber-100/50">${logRows}</div>
                    </details>`;
            }

            container.innerHTML = htmlContent + activityHtml;

            let totalActualDaysAll = coveredDates.size + extraActivityDays;
            let totalOverallDayGap = completedTargetDays - (completedActualDays + extraActivityDays);
            let totalOverallMinGap = completedTargetMins - (completedActualMins + activityMinsTotal);

            let subjDaysPct = totalTargetDaysAll > 0 ? Math.min(100, (totalActualDaysAll / totalTargetDaysAll) * 100) : 0;

           document.getElementById('subject-pace-widget').innerHTML = `
                <b class='text-slate-800 text-sm uppercase tracking-widest'>Subject Overall Pace</b>
                <div class='text-[10px] sm:text-[11px] mt-3 font-black text-emerald-600 uppercase tracking-widest'>Total Topics Completed (${completedSubtopics} out of ${totalSubtopics} Topics) - ${progressPct}%</div>
                <div class='w-full bg-slate-100 h-2 rounded-full mt-2 mb-4 overflow-hidden'><div style='width: ${progressPct}%;' class='bg-emerald-500 h-full'></div></div>
                
                <div class='flex items-center gap-3 p-3.5 rounded-xl border ${(completedTargetDays > 0 || activityLogs.length > 0) ? (totalOverallDayGap >= 0 ? "bg-emerald-50 border-emerald-200 text-emerald-700" : "bg-rose-50 border-rose-200 text-rose-700") : "bg-slate-50 border-slate-200 text-slate-500"}'>
                    <div class='text-[10px] sm:text-[11px] font-black uppercase tracking-widest'>
                        ${(completedTargetDays > 0 || activityLogs.length > 0) ? `Net Variance: ${totalOverallDayGap > 0 ? "+" : ""}${totalOverallDayGap} Days | ${totalOverallMinGap > 0 ? "+" : ""}${totalOverallMinGap} Mins <span class="ml-2 opacity-70">(${totalOverallDayGap >= 0 ? "Ahead/On Time" : "Behind Schedule"})</span>` : `Awaiting Completions for Variance`}
                    </div>
                </div>
            `;
        }
        // Live Inline Ticking (No popup alerts!)
        function previewTick(cb, idx) {
            if(cb.checked) {
                const todayStr = new Date().toLocaleDateString('en-GB');
                const container = document.getElementById(`tick-container-${idx}`);
                // Transform checkbox into Success Badge instantly
                container.innerHTML = `<div class="text-right"><span class="text-amber-500 font-black text-[10px] uppercase tracking-widest">PENDING SYNC...</span><p class="text-[9px] font-bold text-slate-400 mt-1 uppercase">${todayStr} | ${activeSessionMins}m</p></div>`;
                
                // Stage data
                currentPlannerData[idx].isDone = true;
                currentPlannerData[idx].completedDate = new Date().toISOString().split('T')[0];
                currentPlannerData[idx].completedMinutes = activeSessionMins;
                const safeName = activeStaff.name && activeStaff.name !== 'undefined' ? activeStaff.name : activeStaff.email;
                currentPlannerData[idx].tickedBy = safeName; 
            }
        }

        async function startChapter(chName) {
            const today = new Date().toISOString().split('T')[0];
            currentPlannerData.forEach(r => { if (r['CHAPTER NAME'] === chName) r.chapterStartDate = today; });
            if(isDemoMode) { renderSyllabusExactMath(); return; }
            try { await db.collection("lesson_planners").doc(activeSubjectId).update({ syllabusData: currentPlannerData }); renderSyllabusExactMath(); } catch(e) { alert("Error."); }
        }

        async function confirmDaySubmission() {
            const stagedTopics = currentPlannerData.filter(r => r.isDone && !r.savedToDb);
            if(isDemoMode) {
                alert(`Simulation Success: Topics locked with ${activeSessionMins} minutes allocated.`);
                closeModal('syllabus-modal'); return;
            }

            try {
                currentPlannerData.forEach(r => { if(r.isDone) r.savedToDb = true; });
                
                // Save data AND automatically lock the board again
                await db.collection("lesson_planners").doc(activeSubjectId).update({ 
                    syllabusData: currentPlannerData,
                    unlockRequested: false,
                    isUnlocked: false
                });
                
                alert("Database Update: Progress Successfully Synchronized & Locked.");
                closeModal('syllabus-modal');
                fetchTodayData(); // Refresh UI behind
            } catch(e) { alert("Error saving data."); }
        }

        async function requestUnlock() {
            if(isDemoMode) return alert("Simulation: Unlock Request Sent to Admin.");
            const btn = document.getElementById('request-unlock-btn');
            btn.innerText = "Requesting..."; btn.disabled = true;
            
            try {
                // Send the request flag to Firebase for this specific subject
                await db.collection("lesson_planners").doc(activeSubjectId).set({ unlockRequested: true }, { merge: true });
                alert("Unlock Request Sent! Please tell the Admin to approve it.");
                
                // Change button to yellow waiting status
                btn.innerText = "Unlock Requested ⏳";
                btn.className = "w-full bg-amber-50 text-amber-600 font-black py-3 rounded-2xl uppercase tracking-widest text-[10px] border border-amber-200 transition-all cursor-not-allowed";
            } catch(e) {
                alert("Error requesting unlock: " + e.message);
                btn.innerText = "Made a Mistake? Request Admin Unlock"; btn.disabled = false;
            }
        }

        function getMockSyllabus() {
            return [
                { "CHAPTER NAME": "Logarithms", "LECTURE NUMBER": "1", "SUBTOPICS": "Bracket Notations", "isDone": true, "chapterStartDate": "2026-04-01", "completedMinutes": "90", "completedDate": "2026-04-01", "Target days for chapter": "3", "Target Minutes For Chapter": "270" },
                { "CHAPTER NAME": "Logarithms", "LECTURE NUMBER": "2", "SUBTOPICS": "Wavy Curve Method", "isDone": true, "completedMinutes": "90", "completedDate": "2026-04-03", "Target days for chapter": "3", "Target Minutes For Chapter": "270" },
                { "CHAPTER NAME": "Logarithms", "LECTURE NUMBER": "3", "SUBTOPICS": "Properties of Logs", "isDone": true, "completedMinutes": "90", "completedDate": "2026-04-04", "Target days for chapter": "3", "Target Minutes For Chapter": "270" },
                { "CHAPTER NAME": "Quadratic Equations", "LECTURE NUMBER": "1", "SUBTOPICS": "Roots & Discriminants", "isDone": false, "chapterStartDate": "2026-04-05", "Target days for chapter": "4", "Target Minutes For Chapter": "360" },
                { "CHAPTER NAME": "Quadratic Equations", "LECTURE NUMBER": "2", "SUBTOPICS": "Nature of Roots", "isDone": false, "Target days for chapter": "4", "Target Minutes For Chapter": "360" },
                { "CHAPTER NAME": "Sequence & Series", "LECTURE NUMBER": "1", "SUBTOPICS": "Arithmetic Progression", "isDone": false, "Target days for chapter": "5", "Target Minutes For Chapter": "450" }
            ];
        }
    </script>
