        </div>
    </header>

    <main class="max-w-5xl mx-auto p-6 sm:p-10 mt-6">
        
        <div class="mb-10 text-center sm:text-left">
            <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight">

            <p class="text-slate-500 font-bold mt-2 text-sm">Choose a category below to allocate staff duties.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <button onclick="openLunchDuty()" class="group relative overflow-hidden glass-card rounded-[2.5rem] p-8 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-left border-2 border-transparent hover:border-amber-400">
                <div class="relative z-10">
                    <div class="bg-gradient-to-br from-amber-400 to-orange-500 w-20 h-20 rounded-[1.5rem] flex items-center justify-center shadow-lg mb-6 transform group-hover:scale-110 transition-transform">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <h3 class="text-2xl font-black text-slate-800 mb-2 uppercase tracking-tight">Lunch Duty</h3>
                    <p class="text-slate-500 text-sm font-bold leading-relaxed">Assign recess supervision rounds and floor monitoring tasks to available staff.</p>
                </div>
            </button>

            <button onclick="openExamDuty()" class="group relative overflow-hidden glass-card rounded-[2.5rem] p-8 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-left border-2 border-transparent hover:border-indigo-400">
                <div class="relative z-10">
                    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 w-20 h-20 rounded-[1.5rem] flex items-center justify-center shadow-lg mb-6 transform group-hover:scale-110 transition-transform">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    </div>
                    <h3 class="text-2xl font-black text-slate-800 mb-2 uppercase tracking-tight">Exam Duty</h3>
