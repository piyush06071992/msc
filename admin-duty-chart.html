<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Duty Chart Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20 relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-fuchsia-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
    </div>

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex items-center gap-4 shadow-lg sticky top-0 z-50">
        <button onclick="handleBack()" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
            <h1 class="text-lg sm:text-xl font-black tracking-widest uppercase">Duty Chart Manager</h1>
            <p id="sub-header-text" class="text-[10px] text-indigo-300 font-bold uppercase tracking-widest mt-1">Assign & Track Faculty Responsibilities</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 sm:p-10 mt-2">
        
        <div id="module-selection">
            <div class="mb-10 text-center sm:text-left">
                <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight">Select Duty Module</h2>
                <p class="text-slate-500 font-bold mt-2 text-sm">Choose a category below to allocate staff duties.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <button onclick="openLunchDuty()" class="group relative overflow-hidden glass-card rounded-[2.5rem] p-8 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-left border-2 border-transparent hover:border-amber-400">
                    <div class="bg-gradient-to-br from-amber-400 to-orange-500 w-20 h-20 rounded-[1.5rem] flex items-center justify-center shadow-lg mb-6 transform group-hover:scale-110 transition-transform text-4xl">🕒</div>
                    <h3 class="text-2xl font-black text-slate-800 mb-2 uppercase tracking-tight">Lunch Duty</h3>
                    <p class="text-slate-500 text-sm font-bold leading-relaxed">Algorithmic allocation based on timetable breaks and teacher workload balancing.</p>
                </button>
                <button onclick="alert('Exam Duty Module coming soon!')" class="group relative overflow-hidden glass-card rounded-[2.5rem] p-8 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 text-left border-2 border-transparent hover:border-indigo-400 opacity-60">
                    <div class="bg-gradient-to-br from-indigo-500 to-purple-600 w-20 h-20 rounded-[1.5rem] flex items-center justify-center shadow-lg mb-6 text-4xl">📝</div>
                    <h3 class="text-2xl font-black text-slate-800 mb-2 uppercase tracking-tight">Exam Duty</h3>
                    <p class="text-slate-500 text-sm font-bold leading-relaxed">Allocate invigilators to examination halls and manage shifts across departments.</p>
                </button>
            </div>
        </div>

        <div id="lunch-duty-view" class="hidden space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                        <h3 class="font-black text-slate-800 uppercase text-xs tracking-widest mb-4 flex items-center gap-2"><span class="w-2 h-2 bg-blue-500 rounded-full"></span> 1. Target Classes</h3>
                        <div id="class-list" class="space-y-2 max-h-60 overflow-y-auto custom-scroll pr-2"></div>
                    </div>
                    <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                        <h3 class="font-black text-slate-800 uppercase text-xs tracking-widest mb-4 flex items-center gap-2"><span class="w-2 h-2 bg-rose-500 rounded-full"></span> 2. Exemptions</h3>
                        <div id="staff-list" class="space-y-2 max-h-80 overflow-y-auto custom-scroll pr-2"></div>
                    </div>
                    <button onclick="runLunchAlgorithm()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl uppercase tracking-widest text-xs shadow-xl hover:bg-blue-600 transition-all active:scale-95">
                        ⚡ Generate Duty Roster
                    </button>
                </div>

                <div class="lg:col-span-2">
                    <div id="results-placeholder" class="h-full min-h-[400px] border-2 border-dashed border-slate-200 rounded-[3rem] flex flex-col items-center justify-center text-slate-400 p-10 text-center">
                        <div class="text-6xl mb-4">🤖</div>
                        <p class="font-bold uppercase tracking-widest text-xs leading-relaxed">Configure parameters and click generate.<br>The AI will find free staff matching break timings.</p>
                    </div>

                    <div id="results-area" class="hidden space-y-6">
                        <div class="flex justify-between items-end mb-2">
                            <h3 class="text-xl font-black text-slate-900 uppercase tracking-tighter">Generated Roster</h3>
                            <button onclick="saveCurrentRoster()" class="text-[10px] font-black bg-emerald-100 text-emerald-700 px-4 py-2 rounded-full border border-emerald-200 hover:bg-emerald-200">💾 Finalize & Save Week</button>
                        </div>
                        <div id="roster-container" class="space-y-4"></div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [], staffData = [], fullTimetable = [];
        let generatedRoster = [];

        window.onload = async () => {
            if (sessionStorage.getItem('minervaAdminAuth') !== 'true') window.location.replace('admin-login.html');
            await preloadData();
        };

        async function preloadData() {
            try {
                const [structSnap, staffSnap, ttSnap] = await Promise.all([
                    db.collection("institute_structure").get(),
                    db.collection("staff_applications").where("status", "==", "approved").get(),
                    db.collection("timetable").get()
                ]);
                structureData = structSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                staffData = staffSnap.docs.map(d => {
                    const data = d.data();
                    let n = data.email;
                    if(data.details) for(let k in data.details) if(k.toLowerCase().includes('name')) n = data.details[k];
                    const deptKey = data.details ? Object.keys(data.details).find(k => k.toLowerCase().includes('dept') || k.toLowerCase().includes('sub')) : null;
                    return { email: data.email, name: n, dept: deptKey ? data.details[deptKey] : 'General' };
                });
                fullTimetable = ttSnap.docs.map(d => d.data());
                renderSetupOptions();
            } catch(e) { console.error(e); }
        }

        function renderSetupOptions() {
            document.getElementById('class-list').innerHTML = structureData.map(s => `
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl cursor-pointer hover:bg-blue-50 transition-colors border border-transparent hover:border-blue-100">
                    <input type="checkbox" class="class-cb w-4 h-4 accent-blue-600" value="${s.className}|${s.sectionName}">
                    <span class="text-[11px] font-bold text-slate-700">${s.className} - ${s.sectionName}</span>
                </label>`).join('');

            const depts = [...new Set(staffData.map(s => s.dept))].sort();
            document.getElementById('staff-list').innerHTML = depts.map(d => `
                <div class="mb-4">
                    <label class="flex items-center gap-2 mb-2 p-2 bg-slate-100 rounded-lg cursor-pointer">
                        <input type="checkbox" onchange="toggleDept(this, '${d}')" class="w-4 h-4 accent-slate-600">
                        <span class="text-[10px] font-black uppercase text-slate-500">Dept: ${d}</span>
                    </label>
                    <div class="pl-4 space-y-1">
                        ${staffData.filter(s => s.dept === d).map(s => `
                            <label class="flex items-center gap-3 p-2 hover:bg-rose-50 rounded-lg cursor-pointer transition-colors group">
                                <input type="checkbox" class="staff-cb dept-grp-${d.replace(/\s+/g,'')}" value="${s.email}">
                                <span class="text-[11px] font-medium text-slate-600 group-hover:text-rose-700">${s.name}</span>
                            </label>`).join('')}
                    </div>
                </div>`).join('');
        }

        function toggleDept(cb, d) {
            document.querySelectorAll(`.dept-grp-${d.replace(/\s+/g,'')}`).forEach(i => i.checked = cb.checked);
        }

        function handleBack() {
            if(!document.getElementById('lunch-duty-view').classList.contains('hidden')) {
                document.getElementById('lunch-duty-view').classList.add('hidden');
                document.getElementById('module-selection').classList.remove('hidden');
                document.getElementById('sub-header-text').innerText = "Assign & Track Faculty Responsibilities";
            } else {
                window.location.href = 'admin.html';
            }
        }

        function openLunchDuty() {
            document.getElementById('module-selection').classList.add('hidden');
            document.getElementById('lunch-duty-view').classList.remove('hidden');
            document.getElementById('sub-header-text').innerText = "Lunch Duty Algorithmic Engine";
        }

        function timeToMins(tStr) {
            if(!tStr) return 0;
            const [time, modifier] = tStr.split(' ');
            let [hours, minutes] = time.split(':');
            if (hours === '12') hours = '00';
            if (modifier === 'PM') hours = parseInt(hours, 10) + 12;
            return parseInt(hours, 10) * 60 + parseInt(minutes, 10);
        }

        async function runLunchAlgorithm() {
            const targetClasses = Array.from(document.querySelectorAll('.class-cb:checked')).map(i => i.value);
            const exemptedEmails = Array.from(document.querySelectorAll('.staff-cb:checked')).map(i => i.value);
            
            if(targetClasses.length === 0) return alert("Please select target classes.");

            const dayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date().getDay()];
            const todayTt = fullTimetable.filter(t => t.day === dayName);
            const availableStaff = staffData.filter(s => !exemptedEmails.includes(s.email));

            generatedRoster = [];
            const container = document.getElementById('roster-container');
            container.innerHTML = '<div class="text-center py-10 animate-bounce">🧬 Processing Survival Logic...</div>';

            targetClasses.forEach(clsKey => {
                const [cName, sName] = clsKey.split('|');
                const classBreak = todayTt.find(t => t.className === cName && t.section === sName && t.subject.toUpperCase() === "BREAK");
                
                if(!classBreak) return;

                const breakStart = timeToMins(classBreak.timeRange.split(' - ')[0]);
                const breakEnd = timeToMins(classBreak.timeRange.split(' - ')[1]);

                // Find candidate staff
                let candidates = availableStaff.map(staff => {
                    const staffSchedule = todayTt.filter(t => t.teacherName === staff.name);
                    const totalMins = staffSchedule.reduce((sum, item) => sum + (parseInt(item.duration) || 0), 0);
                    
                    // Rule 1: Free during student break?
                    const isBusyDuringBreak = staffSchedule.some(s => {
                        const sStart = timeToMins(s.timeRange.split(' - ')[0]);
                        const sEnd = timeToMins(s.timeRange.split(' - ')[1]);
                        return (breakStart < sEnd && breakEnd > sStart);
                    });

                    // Rule 2: Does staff have their own 45 min break between 12-2 PM (excluding duty time)?
                    let hasSelfLunch = false;
                    if(!isBusyDuringBreak) {
                        const busyWindows = staffSchedule.map(s => ({
                            s: timeToMins(s.timeRange.split(' - ')[0]),
                            e: timeToMins(s.timeRange.split(' - ')[1])
                        }));
                        // Add the proposed duty to busy windows
                        busyWindows.push({ s: breakStart, e: breakEnd });
                        busyWindows.sort((a,b) => a.s - b.s);

                        // Scan 12:00 (720m) to 14:00 (840m)
                        let lastEnd = 720;
                        busyWindows.forEach(w => {
                            if(w.s > lastEnd && Math.min(w.s, 840) - Math.max(lastEnd, 720) >= 45) hasSelfLunch = true;
                            lastEnd = Math.max(lastEnd, w.e);
                        });
                        if(840 - Math.max(lastEnd, 720) >= 45) hasSelfLunch = true;
                    }

                    return { ...staff, totalMins, classes: staffSchedule.length, canDo: (!isBusyDuringBreak && hasSelfLunch) };
                }).filter(s => s.canDo).sort((a,b) => a.totalMins - b.totalMins);

                const assigned = candidates.length > 0 ? candidates[0] : null;
                generatedRoster.push({ className: cName, section: sName, breakTime: classBreak.timeRange, staff: assigned });
            });

            renderRoster();
        }

        function renderRoster() {
            document.getElementById('results-placeholder').classList.add('hidden');
            document.getElementById('results-area').classList.remove('hidden');
            
            const container = document.getElementById('roster-container');
            container.innerHTML = generatedRoster.map((r, idx) => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:border-amber-300 transition-colors">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="bg-amber-100 text-amber-700 text-[10px] font-black px-2 py-0.5 rounded uppercase">Break</span>
                            <h4 class="font-black text-slate-800 text-sm uppercase">${r.className} - ${r.section}</h4>
                        </div>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest">Timing: ${r.breakTime}</p>
                    </div>
                    
                    <div class="flex flex-col items-end gap-1">
                        ${r.staff ? `
                            <div class="text-right">
                                <p class="text-sm font-black text-indigo-600 uppercase">${r.staff.name}</p>
                                <p class="text-[9px] font-bold text-slate-400 uppercase mt-0.5">Day Load: ${r.staff.classes} Classes / ${r.staff.totalMins} Mins</p>
                            </div>
                        ` : `<span class="bg-rose-50 text-rose-600 text-[9px] font-black px-3 py-1 rounded-full border border-rose-100 uppercase">No Staff Found</span>`}
                    </div>
                </div>
            `).join('');
        }

        async function saveCurrentRoster() {
            if(generatedRoster.length === 0) return;
            const btn = event.target;
            btn.innerText = "Saving...";
            try {
                const weekId = "week_" + Math.ceil(new Date().getDate() / 7) + "_" + new Date().getMonth();
                await db.collection("duty_roster").doc(weekId).set({
                    roster: generatedRoster,
                    timestamp: Date.now(),
                    day: new Date().toLocaleDateString()
                });
                alert("Roster saved successfully for the week!");
                btn.innerText = "💾 Finalize & Save Week";
            } catch(e) { alert("Error saving."); }
        }
    </script>
</body>
</html>
