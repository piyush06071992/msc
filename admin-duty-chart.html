<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Algorithmic Duty Chart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        table { border-spacing: 0; border-collapse: separate; }
        .sticky-col { position: sticky; left: 0; background: white; z-index: 10; border-right: 2px solid #e2e8f0 !important; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex justify-between items-center shadow-lg sticky top-0 z-[100]">
        <div class="flex items-center gap-4">
            <button onclick="handleBack()" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-sm sm:text-xl font-black tracking-widest uppercase">Duty Manager</h1>
        </div>
        <div id="algo-status" class="hidden text-[10px] font-black bg-emerald-500 text-white px-4 py-2 rounded-full animate-pulse">ALGO ACTIVE</div>
    </header>

    <main class="max-w-[1600px] mx-auto p-4 sm:p-8">
        
        <div id="module-selection" class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto mt-10">
            <button onclick="initLunchDuty()" class="glass-card p-10 rounded-[3rem] text-left hover:border-amber-400 transition-all group">
                <div class="text-5xl mb-6 group-hover:scale-110 transition-transform">🕒</div>
                <h3 class="text-2xl font-black uppercase italic">Lunch Duty</h3>
                <p class="text-slate-400 text-xs font-bold mt-2 uppercase tracking-widest">Automatic Timetable Matching</p>
            </button>
            <button class="glass-card p-10 rounded-[3rem] text-left opacity-50 cursor-not-allowed">
                <div class="text-5xl mb-6">📝</div>
                <h3 class="text-2xl font-black uppercase italic">Exam Duty</h3>
                <p class="text-slate-400 text-xs font-bold mt-2 uppercase tracking-widest">Coming Soon</p>
            </button>
        </div>

        <div id="lunch-duty-view" class="hidden space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                
                <div class="lg:col-span-1 glass-card p-6 rounded-[2rem] h-fit">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-black uppercase text-[10px] tracking-widest text-slate-400">1. Target Classes</h3>
                        <button onclick="toggleAll('.class-cb')" class="text-[9px] font-black text-blue-600 uppercase bg-blue-50 px-2 py-1 rounded">Select All</button>
                    </div>
                    <div id="class-container" class="space-y-1 max-h-[500px] overflow-y-auto custom-scroll pr-2"></div>
                </div>

                <div class="lg:col-span-1 glass-card p-6 rounded-[2rem] h-fit">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-black uppercase text-[10px] tracking-widest text-slate-400">2. Staff Exemptions</h3>
                        <div class="text-[9px] font-black text-rose-600 uppercase">Departmental Grouping</div>
                    </div>
                    <div id="staff-container" class="space-y-3 max-h-[500px] overflow-y-auto custom-scroll pr-2">
                        <div class="text-center py-10 text-slate-300 font-bold uppercase text-[10px] animate-pulse">Fetching Staff Data...</div>
                    </div>
                </div>

                <div class="lg:col-span-2 space-y-6">
                    <button onclick="generateWeeklyRoster()" class="w-full bg-slate-900 text-white font-black py-6 rounded-[2rem] text-sm uppercase tracking-widest hover:bg-blue-600 shadow-xl transition-all active:scale-95 flex justify-center items-center gap-3">
                        ⚡ Generate Weekly Duty Chart
                    </button>
                    
                    <div id="roster-output-wrapper" class="hidden glass-card rounded-[2.5rem] overflow-hidden shadow-2xl border-2 border-indigo-100">
                        <div class="p-6 bg-white border-b flex justify-between items-center">
                            <h3 class="font-black uppercase tracking-tighter text-lg">Weekly Roster (Auto-Generated)</h3>
                            <button onclick="saveRoster()" class="bg-emerald-600 text-white px-6 py-2.5 rounded-full font-black text-[10px] uppercase shadow-lg hover:bg-emerald-700">💾 Save Week</button>
                        </div>
                        <div class="overflow-x-auto custom-scroll">
                            <table class="w-full text-left">
                                <thead id="roster-head" class="bg-slate-50 text-[9px] font-black uppercase tracking-widest text-slate-400"></thead>
                                <tbody id="roster-body" class="divide-y divide-slate-100 bg-white"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [], staffData = [], timetableData = [];

        function handleBack() {
            if(!document.getElementById('lunch-duty-view').classList.contains('hidden')) {
                document.getElementById('lunch-duty-view').classList.add('hidden');
                document.getElementById('module-selection').classList.remove('hidden');
            } else window.location.href = 'admin.html';
        }

        async function initLunchDuty() {
            document.getElementById('module-selection').classList.add('hidden');
            document.getElementById('lunch-duty-view').classList.remove('hidden');
            
            const [structSnap, staffSnap, ttSnap] = await Promise.all([
                db.collection("institute_structure").get(),
                db.collection("staff_applications").where("status", "==", "approved").get(),
                db.collection("timetable").get()
            ]);

            structureData = structSnap.docs.map(d => d.data()).sort((a,b)=>a.className.localeCompare(b.className));
            
            staffData = staffSnap.docs.map(doc => {
                const d = doc.data();
                const det = d.details || {};
                let n = d.email;
                for (let k in det) { if (k.toLowerCase().includes('name')) n = det[k]; }
                
                // Advanced Department Finding logic
                const deptKey = Object.keys(det).find(k => 
                    k.toLowerCase().includes('department') || 
                    k.toLowerCase().includes('subject') || 
                    k.toLowerCase().includes('dept') ||
                    k.toLowerCase().includes('branch')
                );
                
                let dpt = deptKey ? det[deptKey] : 'General';
                // If it's a comma separated list, just take the first one for grouping
                if(dpt.includes(',')) dpt = dpt.split(',')[0].trim();

                return { email: d.email, name: n, dept: dpt };
            });

            timetableData = ttSnap.docs.map(d => d.data());
            renderSelectors();
        }

        function renderSelectors() {
            // Render Target Classes
            document.getElementById('class-container').innerHTML = structureData.map(s => `
                <label class="flex items-center gap-3 p-2.5 hover:bg-slate-50 rounded-xl cursor-pointer border border-transparent transition-all">
                    <input type="checkbox" class="class-cb w-4 h-4 accent-indigo-600" value="${s.className}|${s.sectionName}">
                    <span class="text-[10px] font-bold text-slate-700 uppercase tracking-tight">${s.className} - ${s.sectionName}</span>
                </label>`).join('');

            // Render Staff Grouped by Department with Collapsible Dropdown
            const depts = [...new Set(staffData.map(s => s.dept))].sort();
            document.getElementById('staff-container').innerHTML = depts.map(d => {
                const members = staffData.filter(s => s.dept === d).sort((a,b) => a.name.localeCompare(b.name));
                const deptId = d.replace(/[^a-zA-Z0-9]/g, '');

                return `
                <details class="bg-white border border-slate-100 rounded-xl overflow-hidden shadow-sm group">
                    <summary class="p-3 bg-slate-50 flex justify-between items-center cursor-pointer hover:bg-slate-100 transition-colors">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" onchange="toggleDept(this, '${deptId}')" class="w-4 h-4 accent-rose-600 dept-master-cb" onclick="event.stopPropagation()">
                            <span class="text-[10px] font-black uppercase text-slate-600 tracking-widest">${d}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="bg-slate-200 text-slate-500 text-[8px] px-1.5 py-0.5 rounded font-black">${members.length}</span>
                            <svg class="w-4 h-4 text-slate-400 group-open:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                    </summary>
                    <div class="p-2 space-y-1 bg-white border-t border-slate-50">
                        ${members.map(s => `
                            <label class="flex items-center gap-3 p-2 hover:bg-rose-50 rounded-lg cursor-pointer transition-colors">
                                <input type="checkbox" class="staff-cb dept-${deptId}" value="${s.email}">
                                <span class="text-[10px] font-semibold text-slate-700">${s.name}</span>
                            </label>`).join('')}
                    </div>
                </details>`;
            }).join('');
        }

        function toggleAll(selector) {
            const cbs = document.querySelectorAll(selector);
            const anyUnchecked = Array.from(cbs).some(c => !c.checked);
            cbs.forEach(c => c.checked = anyUnchecked);
        }

        function toggleDept(cb, deptId) {
            document.querySelectorAll(`.dept-${deptId}`).forEach(i => i.checked = cb.checked);
        }

        function timeToMins(tStr) {
            if(!tStr) return 0;
            try {
                const [time, modifier] = tStr.split(' ');
                let [hours, minutes] = time.split(':');
                if (hours === '12') hours = '00';
                if (modifier === 'PM') hours = parseInt(hours, 10) + 12;
                return parseInt(hours, 10) * 60 + parseInt(minutes, 10);
            } catch(e) { return 0; }
        }

        function generateWeeklyRoster() {
            const targetClasses = Array.from(document.querySelectorAll('.class-cb:checked')).map(i => i.value);
            const exempted = Array.from(document.querySelectorAll('.staff-cb:checked')).map(i => i.value);
            
            if(targetClasses.length === 0) return alert("Please select at least one class.");

            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const roster = {};

            targetClasses.forEach(clsKey => {
                const [cName, sName] = clsKey.split('|');
                roster[clsKey] = { cName, sName, days: {} };

                days.forEach(day => {
                    const classBreak = timetableData.find(t => t.day === day && t.className === cName && t.section === sName && t.subject.toUpperCase() === "BREAK");
                    if(!classBreak) return roster[clsKey].days[day] = { noBreak: true };

                    const bStart = timeToMins(classBreak.timeRange.split(' - ')[0]);
                    const bEnd = timeToMins(classBreak.timeRange.split(' - ')[1]);
                    roster[clsKey].timing = classBreak.timeRange;

                    let candidates = staffData.filter(s => !exempted.includes(s.email)).map(staff => {
                        const sTt = timetableData.filter(t => t.day === day && t.teacherName === staff.name);
                        const dayLoadMins = sTt.reduce((acc, curr) => acc + (parseInt(curr.duration) || 0), 0);
                        
                        const conflict = sTt.some(s => {
                            const sS = timeToMins(s.timeRange.split(' - ')[0]);
                            const sE = timeToMins(s.timeRange.split(' - ')[1]);
                            return (bStart < sE && bEnd > sS);
                        });

                        let hasSelfLunch = false;
                        if (!conflict) {
                            const windows = sTt.map(s => ({ s: timeToMins(s.timeRange.split(' - ')[0]), e: timeToMins(s.timeRange.split(' - ')[1]) }));
                            windows.push({ s: bStart, e: bEnd });
                            windows.sort((a,b)=>a.s - b.s);
                            let lastE = 720;
                            windows.forEach(w => {
                                if(w.s > lastE && (Math.min(w.s, 840) - Math.max(lastE, 720)) >= 45) hasSelfLunch = true;
                                lastE = Math.max(lastE, w.e);
                            });
                            if(!hasSelfLunch && (840 - Math.max(lastE, 720)) >= 45) hasSelfLunch = true;
                        }

                        return { ...staff, dayLoadMins, classCount: sTt.length, valid: (!conflict && hasSelfLunch) };
                    }).filter(c => c.valid).sort((a,b) => a.dayLoadMins - b.dayLoadMins);

                    roster[clsKey].days[day] = candidates.length > 0 ? candidates[0] : null;
                });
            });

            renderWeeklyTable(roster);
        }

        function renderWeeklyTable(data) {
            const head = document.getElementById('roster-head');
            const body = document.getElementById('roster-body');
            document.getElementById('roster-output-wrapper').classList.remove('hidden');

            head.innerHTML = `<tr>
                <th class="p-5 sticky-col">Class / Timing</th>
                <th class="p-5">Mon</th><th class="p-5">Tue</th><th class="p-5">Wed</th>
                <th class="p-5">Thu</th><th class="p-5">Fri</th><th class="p-5">Sat</th>
            </tr>`;

            body.innerHTML = Object.keys(data).map(key => {
                const row = data[key];
                const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                
                let cells = days.map(d => {
                    const assigned = row.days[d];
                    if(assigned?.noBreak) return `<td class="p-3 bg-slate-50 text-[8px] font-black text-slate-300 text-center">NO BREAK</td>`;
                    
                    const color = assigned ? 'text-indigo-600' : 'text-rose-500';
                    const stats = assigned ? `<div class="text-[7px] text-slate-400 mt-1 font-bold uppercase">L:${assigned.classCount} | M:${assigned.dayLoadMins}</div>` : '';

                    return `
                    <td class="p-3 border-r border-slate-50 min-w-[150px]">
                        <select class="w-full bg-transparent font-black text-[10px] uppercase outline-none ${color} cursor-pointer">
                            ${assigned ? `<option value="${assigned.email}">${assigned.name}</option>` : `<option value="">-- NO STAFF FOUND --</option>`}
                            ${staffData.map(s => `<option value="${s.email}">${s.name}</option>`).join('')}
                        </select>
                        ${stats}
                    </td>`;
                }).join('');

                return `<tr>
                    <td class="p-5 sticky-col">
                        <div class="font-black text-[11px] text-slate-900 uppercase tracking-tighter">${row.cName} - ${row.sName}</div>
                        <div class="text-[9px] font-bold text-blue-500 mt-1">${row.timing || '---'}</div>
                    </td>
                    ${cells}
                </tr>`;
            }).join('');
        }

        async function saveRoster() {
            alert("Capturing Weekly Roster State... Finalizing week storage.");
        }
    </script>
</body>
</html>
