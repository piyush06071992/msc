<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Teacher Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .dash-btn { transition: all 0.2s ease-in-out; }
        .dash-btn:hover { transform: translateY(-4px); filter: brightness(1.05); }
        .dash-btn:active { transform: translateY(0px); }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-6 sm:py-4 flex flex-wrap justify-between items-center shadow-md gap-3 sticky top-0 z-50">
        <h1 class="text-lg sm:text-2xl font-black tracking-widest uppercase">Minerva: Teacher Portal</h1>
        <div class="flex items-center gap-4">
            <span id="current-date" class="font-bold text-xs sm:text-sm tracking-widest text-indigo-200 hidden sm:inline-block"></span>
            <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 sm:px-6 py-2 rounded-lg font-black uppercase tracking-widest text-[10px] sm:text-xs transition-colors shadow-lg shadow-rose-900/50">
                Logout
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8 space-y-6">
        <div class="bg-white border-2 border-indigo-900 rounded-2xl p-4 sm:p-6 text-center shadow-sm">
            <p class="text-base sm:text-xl font-bold text-slate-800 italic">
                Welcome: <span id="staff-name" class="font-black not-italic text-indigo-700">Loading...</span> 
                <span class="text-slate-300 mx-2">|</span> 
                Dept: <span id="staff-dept" class="font-black not-italic text-indigo-700">Loading...</span> 
            </p>
        </div>
</p>
        </div>

        <div id="urgent-class-alert" class="hidden bg-rose-600 border border-rose-700 rounded-xl p-4 shadow-lg shadow-rose-600/30 flex items-center justify-center animate-pulse mb-6 mt-6">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🚨</span>
                <div id="urgent-class-text" class="font-black text-white text-xs sm:text-sm tracking-widest uppercase">
                    </div>
                <span class="text-2xl">🚨</span>
            </div>
        </div>
        <div class="bg-[#fef08a] border border-[#fde047] rounded-xl p-4 shadow-sm flex items-center overflow-hidden">
        <div class="bg-[#fef08a] border border-[#fde047] rounded-xl p-4 shadow-sm flex items-center overflow-hidden">
            <div class="font-black text-amber-800 whitespace-nowrap animate-[marquee_20s_linear_infinite] text-xs sm:text-base">
                LIVE TICKER: General portal updates, upcoming exam schedules, and announcements will scroll here...
            </div>
        </div>
        <style> @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } } </style>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-2">
            <button onclick="window.location.href='teacher-lesson-planner.html'" class="dash-btn bg-[#e11d48] text-white p-6 sm:p-8 rounded-2xl shadow-lg shadow-rose-500/30 flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center lg:col-span-1 sm:col-span-2">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest leading-snug">Daily Work Report /<br>Lesson Planner</h2>
            </button>
            <button class="dash-btn bg-[#9333ea] text-white p-6 sm:p-8 rounded-2xl shadow-lg shadow-purple-500/30 flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest leading-snug">Attendance<br>Register</h2>
            </button>
          <button onclick="window.location.href='teacher-timetable.html'" class="dash-btn bg-[#2563eb] text-white p-6 sm:p-8 rounded-2xl shadow-lg shadow-blue-500/30 flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest leading-snug">Time Table<br>Management</h2>
            </button>
            <button class="dash-btn bg-[#0d9488] text-white p-6 sm:p-8 rounded-2xl shadow-lg shadow-teal-500/30 flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest leading-snug">Exams</h2>
            </button>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.onload = async () => {
            const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff || !activeStaff.uid) {
                window.location.replace('staff-login.html');
                return;
            }

            // Fallback safety logic
            const safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
            const safeDept = (activeStaff.dept && activeStaff.dept !== "undefined") ? activeStaff.dept : "General";

            document.getElementById('staff-name').innerText = `"${safeName}"`;
            document.getElementById('staff-dept').innerText = `"${safeDept}"`;

            // Mobile cache security fix
            setTimeout(() => {
                db.collection("staff_applications").doc(activeStaff.uid).onSnapshot({ includeMetadataChanges: true }, (doc) => {
                    if (doc.metadata.fromCache) return;
                    if (doc.exists && doc.data().currentSessionId && doc.data().currentSessionId !== activeStaff.sessionId) {
                        localStorage.removeItem('minervaActiveStaff');
                        alert("Session Expired: Logged in from another device.");
                        window.location.replace('staff-login.html');
                    }
                });
            }, 2000);

            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('current-date').innerText = `Date: ${new Date().toLocaleDateString('en-GB', options)}`;
            
            // Trigger the background alert timer using the teacher's name
            await loadTodaysScheduleForAlerts(safeName);
        };

        // --- NEW LIVE TICKER LOGIC --- //
        let todaysSchedule = [];
        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        function getTodayString() { return daysOfWeek[new Date().getDay()]; }

        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12) hours = 0;
            if (modifier === 'PM') hours += 12;
            return hours * 60 + minutes;
        }

        async function loadTodaysScheduleForAlerts(teacherName) {
            try {
                // Fetch ONLY today's classes for this specific teacher
                const snap = await db.collection("timetable")
                    .where("teacherName", "==", teacherName)
                    .where("day", "==", getTodayString())
                    .get();
                todaysSchedule = snap.docs.map(d => d.data());
                
                // Check immediately, then check again every 60 seconds
                checkUpcomingClasses(); 
                setInterval(checkUpcomingClasses, 60000); 
            } catch(e) { console.error("Error loading schedule for alerts:", e); }
        }

        function checkUpcomingClasses() {
            if (todaysSchedule.length === 0) return;

            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            let activeAlert = null;

            for (let cls of todaysSchedule) {
                if (!cls.timeRange) continue;
                
                // Extract just the start time (e.g., "11:00 AM" from "11:00 AM - 12:30 PM")
                const startTimeStr = cls.timeRange.split(' - ')[0];
                const startMins = parseTimeToMinutes(startTimeStr);
                
                // Show alert IF current time is between (Start - 10 mins) and (Start + 5 mins)
                if (currentMins >= startMins - 10 && currentMins <= startMins + 5) {
                    let diff = startMins - currentMins;
                    let timeMsg = "";
                    
                    if (diff > 0) timeMsg = `starting in ${diff} mins`;
                    else if (diff === 0) timeMsg = `starting NOW`;
                    else timeMsg = `started ${Math.abs(diff)} mins ago`;

                    const roomText = cls.room ? `in Room ${cls.room}` : '';
                    activeAlert = `Class Alert: ${cls.className} | ${cls.section} (${cls.subject || 'Duty'}) is ${timeMsg} ${roomText}`;
                    break; // We found the imminent class, stop checking others
                }
            }

            const alertBox = document.getElementById('urgent-class-alert');
            const alertText = document.getElementById('urgent-class-text');

            if (activeAlert) {
                alertText.innerText = activeAlert;
                alertBox.classList.remove('hidden');
            } else {
                alertBox.classList.add('hidden'); // Auto-hides when outside the window
            }
        }
        // --- END LIVE TICKER LOGIC --- //

        async function logout() {
            if(confirm("Are you sure you want to securely log out?")) {
                const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
                if(activeStaff && activeStaff.uid) {
                    await db.collection("staff_applications").doc(activeStaff.uid).update({ currentSessionId: null });
                }
                localStorage.removeItem('minervaActiveStaff');
                window.location.replace('index.html');
            }
        }
    </script>
</body>
</html>
