<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Teacher Portal</title>
     <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .dash-btn { transition: all 0.2s ease-in-out; }
        .dash-btn:hover { transform: translateY(-4px); filter: brightness(1.05); }
        .dash-btn:active { transform: translateY(0px); }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 15px -3px rgba(0,0,0,0.07); }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-6 sm:py-4 flex flex-wrap justify-between items-center shadow-md gap-3 sticky top-0 z-50">
        <h1 class="text-lg sm:text-2xl font-black tracking-widest uppercase">Minerva: Teacher Portal</h1>
        <div class="flex items-center gap-4">
            <span id="current-date" class="font-bold text-xs sm:text-sm tracking-widest text-indigo-200 hidden sm:inline-block"></span>
            <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 sm:px-6 py-2 rounded-lg font-black uppercase tracking-widest text-[10px] sm:text-xs transition-colors shadow-lg shadow-rose-900/50">
                Logout
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8 space-y-6">
        
       <div class="bg-white border-2 border-indigo-900 rounded-2xl p-4 sm:p-6 text-center shadow-sm">
            <p class="text-base sm:text-xl font-bold text-slate-800 italic">
                Welcome: <span id="staff-name" class="font-black not-italic text-indigo-700">Loading...</span> 
                <span class="text-slate-300 mx-2">|</span> 
                Dept: <span id="staff-dept" class="font-black not-italic text-indigo-700">Loading...</span> 
                <span class="text-slate-300 mx-2 hidden sm:inline">|</span><br class="sm:hidden">
                Centre: <span id="staff-center" class="font-black not-italic text-indigo-700">Loading...</span> 
            </p>
        </div>

        <div id="notif-card" class="hidden glass-card p-5 rounded-2xl border-2 border-indigo-100 flex flex-col sm:flex-row items-center justify-between gap-4 bg-indigo-50/30">
            <div class="flex items-center gap-4 text-center sm:text-left">
                <span class="text-3xl">🔔</span>
                <div>
                    <h4 class="font-black text-slate-800 text-sm uppercase tracking-tight">Stay Updated</h4>
                    <p class="text-[10px] font-bold text-slate-500 leading-tight">Enable push notifications for instant duty and report alerts.</p>
                </div>
            </div>
            <button id="subscribe-btn" onclick="requestNotifPermission()" class="w-full sm:w-auto bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest shadow-md hover:bg-indigo-500 transition-all active:scale-95">
                Enable Alerts
            </button>
        </div>

        <div id="urgent-class-alert" class="hidden bg-rose-600 border border-rose-700 rounded-xl p-4 shadow-lg shadow-rose-600/30 flex items-center justify-center animate-pulse mb-6 mt-6">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🚨</span>
                <div id="urgent-class-text" class="font-black text-white text-xs sm:text-sm tracking-widest uppercase"></div>
                <span class="text-2xl">🚨</span>
            </div>
        </div>

        <div class="bg-[#fef08a] border border-[#fde047] rounded-xl p-4 shadow-sm flex items-center overflow-hidden">
            <div class="font-black text-amber-800 whitespace-nowrap animate-[marquee_20s_linear_infinite] text-xs sm:text-base">
                LIVE TICKER: General portal updates, upcoming exam schedules, and announcements will scroll here...
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
            <button onclick="window.location.href='teacher-lesson-planner.html'" class="dash-btn bg-[#e11d48] text-white p-6 sm:p-8 rounded-2xl shadow-lg flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest">Lesson Planner</h2>
            </button>
            <button onclick="window.location.href='teacher-duties.html'" class="dash-btn bg-[#d97706] text-white p-6 sm:p-8 rounded-2xl shadow-lg flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest">Today's Duties</h2>
            </button>
            <button onclick="window.location.href='teacher-daily-report.html'" class="dash-btn bg-[#059669] text-white p-6 sm:p-8 rounded-2xl shadow-lg flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest">End-of-Day Report</h2>
            </button>
           <button onclick="window.location.href='student-attendance.html'" class="dash-btn bg-[#9333ea] text-white p-6 sm:p-8 rounded-2xl shadow-lg flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest">Attendance Register</h2>
            </button>
            <button onclick="window.location.href='teacher-timetable.html'" class="dash-btn bg-[#2563eb] text-white p-6 sm:p-8 rounded-2xl shadow-lg flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest">Timetable Management</h2>
            </button>
            <button class="dash-btn bg-[#0d9488] text-white p-6 sm:p-8 rounded-2xl shadow-lg flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center">
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest">Exams</h2>
            </button>
           <button onclick="window.location.href='teacher-leave.html'" class="dash-btn bg-[#0ea5e9] text-white p-6 sm:p-8 rounded-2xl shadow-lg flex items-center justify-center min-h-[120px] sm:min-h-[140px] text-center relative">                 <div id="leave-badge" class="hidden absolute -top-3 -right-3 bg-rose-600 text-white text-[10px] font-black w-8 h-8 flex items-center justify-center rounded-full shadow-lg border-2 border-white animate-bounce z-10">0</div>                 <h2 class="font-black text-base sm:text-lg uppercase tracking-widest">Leave<br>Management</h2>             </button>             <button onclick="window.location.href='teacher-classroom-lectures.html'" class="dash-btn bg-gradient-to-br from-indigo-600 to-violet-700 text-white p-6 sm:p-8 rounded-2xl shadow-lg flex flex-col items-center justify-center min-h-[120px] sm:min-h-[140px] text-center border-b-4 border-indigo-900">
                <span class="text-2xl mb-1">📓</span>
                <h2 class="font-black text-base sm:text-lg uppercase tracking-widest leading-tight">Classroom<br>Notes</h2>
            </button>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const messaging = firebase.messaging();
        const VAPID_KEY = "BNRj05AzoopGwYm3ruRhIu7x3xn0SrSPGKELJ7ruSZwyvx33WqQPAav0HUPi8GmbI4LbRemlxgzoWgX9EcadgW4";

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        window.onload = async () => {
            const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff || !activeStaff.uid) {
                window.location.replace('staff-login.html');
                return;
            }

            // 1. FORCE SERVICE WORKER REGISTRATION
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('/firebase-messaging-sw.js');
                    console.log("Messaging SW Registered.");
                } catch (e) { console.error("SW Reg Failed", e); }
            }
           // 2. UI UPDATES
            const safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
            const safeDept = (activeStaff.dept && activeStaff.dept !== "undefined") ? activeStaff.dept : "General";
            document.getElementById('staff-name').innerText = `"${safeName}"`;
            document.getElementById('staff-dept').innerText = `"${safeDept}"`;
            
            // Fetch Center from database to be perfectly accurate
            try {
                const docSnap = await db.collection("staff_applications").doc(activeStaff.uid).get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    const centerKey = Object.keys(data.details || {}).find(k => k.toLowerCase().includes('cent'));
                    const teacherCenter = centerKey ? String(data.details[centerKey]).toUpperCase() : "GHUMARWIN";
                    document.getElementById('staff-center').innerText = `"${teacherCenter}"`;
                    
                    // CRITICAL: Save their center to their local profile so other teacher pages know which DB to load!
                    activeStaff.center = teacherCenter;
                    localStorage.setItem('minervaActiveStaff', JSON.stringify(activeStaff));
                }
            } catch(e) {
                document.getElementById('staff-center').innerText = `"GHUMARWIN"`;
            }

            // 3. SILENT TOKEN PICKUP (From Index Page)
            const anonymousToken = localStorage.getItem('minerva_anonymous_token');
            if (anonymousToken) {
                await saveTokenToFirestore(anonymousToken);
                localStorage.removeItem('minerva_anonymous_token');
                console.log("Device linked from anonymous token.");
            }

            // 4. CHECK NOTIFICATION STATUS
            checkNotifStatus();

            // Session Checker & Date
            setTimeout(() => {
                db.collection("staff_applications").doc(activeStaff.uid).onSnapshot((doc) => {
                    if (doc.exists && doc.data().currentSessionId && doc.data().currentSessionId !== activeStaff.sessionId) {
                        localStorage.removeItem('minervaActiveStaff');
                        alert("Session Expired: Logged in from another device.");
                        window.location.replace('staff-login.html');
                    }
                });
            }, 2000);

           document.getElementById('current-date').innerText = `Date: ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}`;
            await loadTodaysScheduleForAlerts(safeName);
            
            // Start listening for substitute requests!
            listenForPendingAdjustments(activeStaff);
        };

        // --- NEW: PENDING ADJUSTMENT LISTENER ---
        function listenForPendingAdjustments(staffObj) {
            const center = staffObj.center || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            const myEmail = staffObj.email;

            db.collection(prefix + "leave_requests")
              .where("status", "==", "PENDING")
              .onSnapshot(snapshot => {
                  let pendingCount = 0;
                  
                  snapshot.forEach(doc => {
                      const data = doc.data();
                      if(data.adjustments) {
                          // Look for adjustments assigned to ME where I haven't responded yet
                          const myRequest = data.adjustments.find(adj => adj.adjustedEmail === myEmail && !adj.substituteResponse);
                          if (myRequest) pendingCount++;
                      }
                  });

                  // Update the Red Bounce Badge
                  const badge = document.getElementById('leave-badge');
                  if (badge) {
                      if (pendingCount > 0) {
                          badge.innerText = pendingCount;
                          badge.classList.remove('hidden');
                      } else {
                          badge.classList.add('hidden');
                      }
                  }
              }, error => console.error("Adjustment listener failed:", error));
        }
async function checkNotifStatus() {
            if (Notification.permission === 'default') {
                // First time: Show the button to ask!
                document.getElementById('notif-card').classList.remove('hidden');
            } else if (Notification.permission === 'granted') {
                // They already clicked "Allow" in the past! Grab token silently.
                console.log("Notifications already granted. Syncing token silently...");
                try {
                    const reg = await navigator.serviceWorker.ready;
                    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
                    if (token) await saveTokenToFirestore(token);
                } catch(e) { console.error("Silent sync failed:", e); }
            } else {
                console.log("Notifications are blocked in browser settings.");
            }
        }

        async function requestNotifPermission() {
            const btn = document.getElementById('subscribe-btn');
            const orig = btn.innerText;
            btn.innerText = "Syncing..."; btn.disabled = true;

            try {
                const reg = await navigator.serviceWorker.ready;
                const permission = await Notification.requestPermission();
                
                if (permission === 'granted') {
                    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
                    if (token) {
                        await saveTokenToFirestore(token);
                        alert("✅ Alerts Enabled! Your device is now linked.");
                        document.getElementById('notif-card').classList.add('hidden');
                    }
                } else {
                    alert("Permission denied. Reset site permissions in browser settings to enable.");
                }
            } catch (error) {
                console.error(error);
                if (isIOS) alert("iPhone Note: You MUST 'Add to Home Screen' and open the app from your home screen for alerts to work.");
                else alert("Connection Error: Ensure you have a stable internet connection and are using HTTPS.");
            } finally {
                btn.innerText = orig; btn.disabled = false;
            }
        }

        async function saveTokenToFirestore(token) {
            const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff || !activeStaff.uid) return;
            try {
                await db.collection("staff_applications").doc(activeStaff.uid).update({
                    fcmToken: token,
                    tokenUpdatedAt: Date.now()
                });
            } catch(e) { console.error("DB Save Error", e); }
        }

        // URGENT ALERT ENGINE (Preserved)
        let todaysSchedule = [];
        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12) hours = 0;
            if (modifier === 'PM') hours += 12;
            return hours * 60 + minutes;
        }
        async function loadTodaysScheduleForAlerts(teacherName) {
            try {
                const now = new Date();
                const todayDayName = daysOfWeek[now.getDay()];
                const todayDateIso = now.toISOString().split('T')[0]; // Current date: YYYY-MM-DD

                // 1. PRIORITY CHECK: Fetch any schedule set for this SPECIFIC DATE (Exam/Special)
                const dateSnap = await db.collection("timetable")
                    .where("teacherName", "==", teacherName)
                    .where("date", "==", todayDateIso)
                    .get();

                if (!dateSnap.empty) {
                    console.log("Date override detected for today. Using specific date schedule.");
                    todaysSchedule = dateSnap.docs.map(d => d.data());
                } else {
                    // 2. FALLBACK: Fetch the standard Weekly schedule for this Day (e.g. Wednesday)
                    // We also ensure we don't pick up entries intended for other specific dates
                    const daySnap = await db.collection("timetable")
                        .where("teacherName", "==", teacherName)
                        .where("day", "==", todayDayName)
                        .get();
                    
                    // Filter out any entries that belong to a specific date that isn't today
                    todaysSchedule = daySnap.docs.map(d => d.data()).filter(item => !item.date);
                }

                checkUpcomingClasses(); 
                setInterval(checkUpcomingClasses, 60000); 
            } catch(e) { console.error("Alert Engine Error:", e); }
        }
        function checkUpcomingClasses() {
            if (todaysSchedule.length === 0) return;
            const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
            let activeAlert = null;
            for (let cls of todaysSchedule) {
                if (!cls.timeRange) continue;
                const startMins = parseTimeToMinutes(cls.timeRange.split(' - ')[0]);
                if (currentMins >= startMins - 10 && currentMins <= startMins + 5) {
                    let diff = startMins - currentMins;
                    activeAlert = `Class Alert: ${cls.className} (${cls.subject}) ${diff > 0 ? 'in '+diff+' mins' : 'starting NOW'}`;
                    break; 
                }
            }
            const box = document.getElementById('urgent-class-alert');
            const txt = document.getElementById('urgent-class-text');
            if (activeAlert) { txt.innerText = activeAlert; box.classList.remove('hidden'); } else { box.classList.add('hidden'); }
        }

        async function logout() {
            if(confirm("Logout securely?")) {
                const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
                if(activeStaff && activeStaff.uid) await db.collection("staff_applications").doc(activeStaff.uid).update({ currentSessionId: null });
                localStorage.removeItem('minervaActiveStaff');
                window.location.replace('index.html');
            }
        }
    </script>
</body>
</html>
