        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Sidebar Animations */

        .sidebar-link:active { transform: scale(0.95); }

        /* Card Animations */
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let messaging = null;
        try { if (firebase.messaging && firebase.messaging.isSupported) messaging = firebase.messaging(); } catch(e) {}
        const VAPID_KEY = "BNRj05AzoopGwYm3ruRhIu7x3xn0SrSPGKELJ7ruSZwyvx33WqQPAav0HUPi8GmbI4LbRemlxgzoWgX9EcadgW4";

        let todaysSchedule = [];
        let staffData = []; // Cached globally to map emails to departments
        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        window.onload = async () => {
            const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff || !activeStaff.uid) return window.location.replace('staff-login.html');

            // Set Hero Data
            const hr = new Date().getHours();
            document.getElementById('greeting').innerText = hr < 12 ? "Good Morning," : hr < 18 ? "Good Afternoon," : "Good Evening,";
            
            const safeName = activeStaff.name || activeStaff.email.split('@')[0];
            const safeDept = activeStaff.dept || "General";
            document.getElementById('staff-name').innerText = safeName;
            document.getElementById('staff-dept').innerText = safeDept;
            document.getElementById('staff-center').innerText = activeStaff.center || "GHUMARWIN";

            const now = new Date();
            document.getElementById('current-date').innerText = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            document.getElementById('current-day').innerText = now.toLocaleDateString('en-US', { weekday: 'long' });

            if ('serviceWorker' in navigator && messaging) {
                try { await navigator.serviceWorker.register('/firebase-messaging-sw.js'); } catch (e) {}
            }

            // Verify Auth & Admin Privileges
            try {
                const docSnap = await db.collection("staff_applications").doc(activeStaff.uid).get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    const teacherCenter = Object.keys(data.details || {}).find(k => k.toLowerCase().includes('cent')) ? String(data.details[Object.keys(data.details || {}).find(k => k.toLowerCase().includes('cent'))]).toUpperCase() : "GHUMARWIN";
                    document.getElementById('staff-center').innerText = teacherCenter;
                    activeStaff.center = teacherCenter;
                    localStorage.setItem('minervaActiveStaff', JSON.stringify(activeStaff));

                    // Show Admin section in Sidebar if authorized
                    if (data.canEditTimetable === true || data.canEditTimetable === teacherCenter || data.canManageRooms === true || data.canManageRooms === teacherCenter) {
                        document.getElementById('admin-tools-container').classList.remove('hidden');
                        if (data.canEditTimetable === true || data.canEditTimetable === teacherCenter) document.getElementById('manage-classes-btn').classList.remove('hidden');
                        if (data.canManageRooms === true || data.canManageRooms === teacherCenter) document.getElementById('manage-rooms-btn').classList.remove('hidden');
                    }
                }
            } catch(e) {}

            checkNotifStatus();

            // Load Global Staff Dictionary (for department mapping)
            const staffSnap = await db.collection("staff_applications").where("status", "==", "approved").get();
            staffData = staffSnap.docs.map(d => {
                const docData = d.data();
                const det = docData.details || {};
                return { email: docData.email, name: det.Name || docData.email, dept: (det.Department || det.Subject || "General").toString() };
            });

            await loadTodaysScheduleForAlerts(safeName);
            listenForPendingAdjustments(activeStaff);
            loadLeaveNoticeBoard(activeStaff);
        };

        // --- TIME UTILS ---
        function parseTimeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const [time, modifier] = timeStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (hours === 12) hours = 0;
            if (modifier === 'PM') hours += 12;
            return hours * 60 + minutes;
        }
        function timeToMins(tStr) { 
            if(!tStr) return 0; 
            try {
                let t = tStr.trim();
                let isPM = t.toLowerCase().includes('pm');
                let isAM = t.toLowerCase().includes('am');
                t = t.replace(/[a-zA-Z\s]/g, ''); 
                let [h, m] = t.split(':').map(Number);
                if (isPM && h !== 12) h += 12;
                if (isAM && h === 12) h = 0;
                return (h * 60) + (m || 0);
            } catch(e) { return 0; } 
        }
        function minsTo12H(m) { 
            let h=Math.floor(m/60)%24; let mn=m%60; let mod=h>=12?'PM':'AM'; h=h%12||12; 
            return `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')} ${mod}`; 
        }

        // --- UPCOMING CLASS ALERT ---
        async function loadTodaysScheduleForAlerts(teacherName) {
            try {
                const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
                const prefix = activeStaff.center === "GHUMARWIN" ? "" : activeStaff.center.toLowerCase() + "_";
                const now = new Date();
                const todayDayName = daysOfWeek[now.getDay()];
                const todayDateIso = now.toISOString().split('T')[0];

                const dateSnap = await db.collection(prefix + "timetable").where("teacherName", "==", teacherName).where("date", "==", todayDateIso).get();

                if (!dateSnap.empty) {
                    todaysSchedule = dateSnap.docs.map(d => d.data());
                } else {
                    const daySnap = await db.collection(prefix + "timetable").where("teacherName", "==", teacherName).where("day", "==", todayDayName).get();
                    todaysSchedule = daySnap.docs.map(d => d.data()).filter(item => !item.date);
                }

                // Add accepted substitutions
                const leaveSnap = await db.collection(prefix + "leave_requests").where("status", "==", "PENDING").get();
                leaveSnap.forEach(doc => {
                    const leaveData = doc.data();
                    if (leaveData.adjustments) {
                        leaveData.adjustments.forEach(adj => {
                            if (adj.date === todayDateIso && adj.substituteResponse === "ACCEPTED" && adj.adjustedEmail === activeStaff.email) {
                                const parts = (adj.sub || "").split('|');
                                todaysSchedule.push({
                                    className: parts[0] ? parts[0].trim() : "Custom",
                                    section: parts[1] ? parts[1].replace('Sec', '').trim() : "Duty",
                                    subject: adj.title,
                                    timeRange: `${minsTo12H(adj.start)} - ${minsTo12H(adj.end)}`
                                });
                            }
                        });
                    }
                });

                checkUpcomingClasses(); 
                setInterval(checkUpcomingClasses, 60000); 
            } catch(e) {}
        }

        function checkUpcomingClasses() {
            if (todaysSchedule.length === 0) return;
            const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
            let activeAlert = null;
            let targetClass = null;

            for (let cls of todaysSchedule) {
                if (!cls.timeRange) continue;
                const startMins = parseTimeToMinutes(cls.timeRange.split(' - ')[0]);
                if (currentMins >= startMins - 15 && currentMins <= startMins + 5) {
                    let diff = startMins - currentMins;
                    activeAlert = diff > 0 ? `Starts in ${diff} mins` : `Starting NOW`;
                    targetClass = cls;
                    break; 
                }
            }

            const container = document.getElementById('feed-urgent-class');
            if (activeAlert && targetClass) {
                container.innerHTML = `
                    <div class="bg-indigo-600 text-white p-5 rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center justify-between animate-fade-in border border-indigo-500">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-xl shadow-inner backdrop-blur-sm">⚡</div>
                            <div>
                                <p class="text-[9px] font-black uppercase tracking-widest text-indigo-200 mb-0.5">${activeAlert}</p>
                                <h4 class="font-black text-base uppercase leading-tight">${targetClass.className} <span class="text-indigo-300 ml-1">${targetClass.section}</span></h4>
                                <p class="text-xs font-bold text-indigo-100 mt-0.5">${targetClass.subject} • ${targetClass.timeRange}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else { container.innerHTML = ""; }
            checkEmptyState();
        }

        // --- SUB REQUEST ALERT ---
        function listenForPendingAdjustments(staffObj) {
            const center = staffObj.center || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            const myEmail = (staffObj.email || "").trim().toLowerCase();

            db.collection(prefix + "leave_requests").where("status", "in", ["PENDING", "APPROVED"]).onSnapshot(snapshot => {
                let pendingCount = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if(data.adjustments) {
                        data.adjustments.forEach(adj => {
                            const adjEmail = (adj.adjustedEmail || "").trim().toLowerCase();
                            if (adjEmail === myEmail && (!adj.substituteResponse || adj.substituteResponse === "PENDING")) pendingCount++;
                        });
                    }
                });
                  
                const badge = document.getElementById('sidebar-leave-badge');
                if (badge) {
                    if (pendingCount > 0) { badge.innerText = pendingCount; badge.classList.remove('hidden'); } 
                    else { badge.classList.add('hidden'); }
                }

                const container = document.getElementById('feed-urgent-subs');
                if (pendingCount > 0) {
                    container.innerHTML = `
                        <div class="bg-rose-600 text-white p-5 rounded-2xl shadow-lg shadow-rose-600/30 flex flex-col sm:flex-row items-center justify-between gap-4 animate-fade-in border border-rose-500">
                            <div class="flex items-center gap-4 w-full">
                                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-xl shadow-inner backdrop-blur-sm animate-pulse shrink-0">🚨</div>
                                <div>
                                    <p class="text-[9px] font-black uppercase tracking-widest text-rose-200 mb-0.5">Action Required</p>
                                    <h4 class="font-black text-sm uppercase leading-tight">${pendingCount} Substitution Request(s)</h4>
                                </div>
                            </div>
                            <button onclick="window.location.href='teacher-leave.html'" class="w-full sm:w-auto bg-white text-rose-600 px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-rose-50 transition-colors whitespace-nowrap">
                                Review ➔
                            </button>
                        </div>
                    `;
                } else { container.innerHTML = ""; }
                checkEmptyState();
            });
        }

        // --- LEAVE NOTICE BOARD ---
        function loadLeaveNoticeBoard(activeStaff) {
            const center = activeStaff.center || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            
            const d = new Date();
            const todayIso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            
            const nextWeek = new Date();
            nextWeek.setDate(d.getDate() + 7);
            const nextWeekIso = `${nextWeek.getFullYear()}-${String(nextWeek.getMonth()+1).padStart(2,'0')}-${String(nextWeek.getDate()).padStart(2,'0')}`;

            db.collection(prefix + "leave_requests").onSnapshot(snap => {
                const container = document.getElementById('feed-leaves');
                if (!container) return;

                let records = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    if (data.startDate && data.endDate) {
                        if ((data.status === "APPROVED" || data.status === "PENDING") && data.endDate >= todayIso && data.startDate <= nextWeekIso) {
                            records.push(data);
                        }
                    }
                });

                if (records.length === 0) {
                    container.innerHTML = "";
                    checkEmptyState();
                    return;
                }

                records.sort((a,b) => a.startDate.localeCompare(b.startDate));

                let html = "";
                records.forEach(req => {
                    const sDate = new Date(req.startDate + "T00:00:00").toLocaleDateString('en-GB', {day:'numeric', month:'short'});
                    const eDate = new Date(req.endDate + "T00:00:00").toLocaleDateString('en-GB', {day:'numeric', month:'short'});
                    const dateStr = req.startDate === req.endDate ? sDate : `${sDate} - ${eDate}`;
                    
                    // Lookup Department
                    const matchedStaff = staffData.find(s => s.email.toLowerCase() === req.teacherEmail.toLowerCase());
                    const reqDept = matchedStaff ? matchedStaff.dept.split(',')[0] : "General";

                    // Calculate Exact Timings
                    let timeLabel = "FULL DAY";
                    if (req.type !== "FULL" && req.startTime && req.endTime) {
                        const sTime = minsTo12H(timeToMins(req.startTime));
                        const eTime = minsTo12H(timeToMins(req.endTime));
                        const dur = timeToMins(req.endTime) - timeToMins(req.startTime);
                        timeLabel = `${sTime.replace(/ (AM|PM)/i,"")} - ${eTime} (${dur}m)`;
                    } else if (req.type !== "FULL") {
                        timeLabel = "PARTIAL DAY"; // Fallback for legacy leaves missing time
                    }

                    let statusPill = req.status === 'APPROVED' ? `<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest border border-emerald-200">Approved</span>` : `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest border border-amber-200">Pending</span>`;

                    let adjHtml = "";
                    if (req.adjustments && req.adjustments.length > 0) {
                        req.adjustments.forEach(adj => {
                            if (adj.substituteResponse !== "ACCEPTED") return; // Only show accepted covers to keep UI clean
                            const subDur = adj.end - adj.start;
                            const subTimeStr = `${minsTo12H(adj.start).replace(/ (AM|PM)/i,"")} - ${minsTo12H(adj.end)}`;
                            
                            adjHtml += `
                                <div class="flex justify-between items-center bg-white p-2.5 rounded-lg border border-slate-100 mb-1.5 shadow-sm">
                                    <div class="flex flex-col leading-tight">
                                        <span class="text-[10px] font-black text-slate-800 uppercase tracking-tighter">${adj.sub}</span>
                                        <span class="text-[8px] font-bold text-slate-500 uppercase mt-0.5">${adj.title} (${subTimeStr} | ${subDur}m)</span>
                                    </div>
                                    <span class="text-[9px] font-black text-sky-700 bg-sky-50 px-2 py-1 rounded shadow-sm border border-sky-100">Cover: ${adj.adjustedTo}</span>
                                </div>
                            `;
                        });
                    }

                    html += `
                        <style>details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }</style>
                        <details class="bg-white rounded-2xl border border-slate-200 shadow-sm transition-all group overflow-hidden mb-3 animate-fade-in">
                            <summary class="p-4 flex flex-col sm:flex-row justify-between sm:items-center cursor-pointer outline-none hover:bg-slate-50 gap-2 sm:gap-0">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-teal-50 text-teal-600 rounded-full flex items-center justify-center text-lg border border-teal-100 shadow-inner shrink-0">🌴</div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <h4 class="font-black text-slate-800 text-sm uppercase tracking-tighter">${req.teacherName}</h4>
                                            ${statusPill}
                                        </div>
                                        <p class="text-[9px] font-bold text-slate-500 uppercase mt-0.5 tracking-widest">${reqDept} • ${dateStr} • <span class="text-teal-600 font-black">${timeLabel}</span></p>
                                    </div>
                                </div>
                                ${adjHtml ? `
                                <div class="flex items-center gap-2 shrink-0 self-start sm:self-auto">
                                    <span class="text-[9px] font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg uppercase group-open:hidden border border-indigo-100 shadow-sm">View Covers</span>
                                    <span class="text-[10px] text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                                </div>` : `<span class="text-[9px] font-bold text-slate-400 uppercase italic">No Covers</span>`}
                            </summary>
                            ${adjHtml ? `
                            <div class="p-3 bg-slate-50 border-t border-slate-100">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Class Covers / Adjustments</p>
                                ${adjHtml}
                            </div>` : ''}
                        </details>
                    `;
                });

                container.innerHTML = html;
                checkEmptyState();
            });
        }

     async function checkNotifStatus() {
            if (!messaging) return;
            if (Notification.permission === 'default') {
                const notifCard = document.getElementById('notif-card');
                if(notifCard) notifCard.classList.remove('hidden');
            } else if (Notification.permission === 'granted') {
                try {
                    const reg = await navigator.serviceWorker.ready;
                    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
                    if (token) await saveTokenToFirestore(token);
                } catch(e) { console.error("Silent sync failed:", e); }
            }
        }

        function checkEmptyState() {
            setTimeout(() => {
                const subBox = document.getElementById('feed-urgent-subs').innerHTML.trim();
                const clsBox = document.getElementById('feed-urgent-class').innerHTML.trim();
                const leaveBox = document.getElementById('feed-leaves').innerHTML.trim();
                
                if (!subBox && !clsBox && !leaveBox) {
                    document.getElementById('empty-state').classList.remove('hidden');
                } else {
                    document.getElementById('empty-state').classList.add('hidden');
                }
            }, 100);
        }

        async function requestNotifPermission() {
            if (!messaging) return alert("Push notifications not supported.");
            const btn = document.getElementById('subscribe-btn');
            btn.innerText = "Syncing..."; btn.disabled = true;
            try {
                const reg = await navigator.serviceWorker.ready;
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
                    if (token) {
                        await saveTokenToFirestore(token);
                        alert("✅ Alerts Enabled!");
                        document.getElementById('notif-card').classList.add('hidden');
                    }
                }
            } catch (e) {
                if (isIOS) alert("iPhone Note: You MUST 'Add to Home Screen' and open the app from your home screen for alerts to work.");
                else alert("Connection Error. Check internet.");
            } finally {
                btn.innerText = "Enable Alerts"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
