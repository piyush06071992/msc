<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Teacher Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        
        /* Vibrant Button Shadows and Hovers */
        .dash-btn { transition: all 0.2s ease-in-out; }
        .dash-btn:hover { transform: translateY(-4px); filter: brightness(1.05); }
        .dash-btn:active { transform: translateY(0px); }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-[#1e1b4b] text-white px-6 py-4 flex flex-col sm:flex-row justify-between items-center shadow-md gap-4 sm:gap-0 sticky top-0 z-50">
        <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase">Minerva Study Circle: Teacher Portal</h1>
        <div class="flex items-center gap-6">
            <span id="current-date" class="font-bold text-sm tracking-widest text-indigo-200"></span>
            <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-white px-6 py-2 rounded-lg font-black uppercase tracking-widest text-xs transition-colors shadow-lg shadow-rose-900/50">
                Logout
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8 space-y-6">

        <div class="bg-white border-2 border-indigo-900 rounded-2xl p-6 text-center shadow-sm">
            <p class="text-lg sm:text-xl font-bold text-slate-800 italic">
                Welcome: <span id="staff-name" class="font-black not-italic text-indigo-700">Loading...</span> 
                <span class="text-slate-300 mx-3">|</span> 
                Dept: <span id="staff-dept" class="font-black not-italic text-indigo-700">Loading...</span> 
                <span class="text-slate-300 mx-3">|</span> 
                Roles: <span class="font-black not-italic text-indigo-700">Faculty</span>
            </p>
        </div>

        <div class="bg-[#fef08a] border border-[#fde047] rounded-xl p-4 shadow-sm flex items-center overflow-hidden">
            <div class="font-black text-amber-800 whitespace-nowrap animate-[marquee_20s_linear_infinite]">
                LIVE TICKER: General portal updates, upcoming exam schedules, and announcements will scroll here...
            </div>
        </div>
        <style> @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } } </style>

        <div class="bg-rose-50 border border-rose-200 rounded-xl p-4 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 text-rose-700 font-bold uppercase tracking-widest text-sm">
                <span>⚠️</span>
                <span>Staff on leave today: <span class="text-rose-900 font-black">Sample Staff 1, Sample Staff 2</span></span>
            </div>
            <button class="bg-[#be123c] hover:bg-[#9f1239] text-white px-6 py-2 rounded-lg font-black uppercase tracking-widest text-xs transition-colors">
                View Details
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-4">
            
            <button onclick="window.location.href='teacher-lesson-planner.html'" class="dash-btn bg-[#e11d48] text-white p-8 rounded-2xl shadow-lg shadow-rose-500/30 flex items-center justify-center min-h-[140px] text-center lg:col-span-1 sm:col-span-2">
                <h2 class="font-black text-lg uppercase tracking-widest leading-snug">Daily Work Report /<br>Lesson Planner</h2>
            </button>

            <button class="dash-btn bg-[#9333ea] text-white p-8 rounded-2xl shadow-lg shadow-purple-500/30 flex items-center justify-center min-h-[140px] text-center">
                <h2 class="font-black text-lg uppercase tracking-widest leading-snug">Attendance<br>Register</h2>
            </button>

            <button class="dash-btn bg-[#2563eb] text-white p-8 rounded-2xl shadow-lg shadow-blue-500/30 flex items-center justify-center min-h-[140px] text-center">
                <h2 class="font-black text-lg uppercase tracking-widest leading-snug">Time Table<br>Management</h2>
            </button>

            <button class="dash-btn bg-[#0d9488] text-white p-8 rounded-2xl shadow-lg shadow-teal-500/30 flex items-center justify-center min-h-[140px] text-center">
                <h2 class="font-black text-lg uppercase tracking-widest leading-snug">Exams</h2>
            </button>

            <button class="dash-btn bg-[#16a34a] text-white p-8 rounded-2xl shadow-lg shadow-green-500/30 flex items-center justify-center min-h-[140px] text-center">
                <h2 class="font-black text-lg uppercase tracking-widest leading-snug">Mentorship</h2>
            </button>

            <button class="dash-btn bg-[#f59e0b] text-white p-8 rounded-2xl shadow-lg shadow-amber-500/30 flex items-center justify-center min-h-[140px] text-center">
                <h2 class="font-black text-lg uppercase tracking-widest leading-snug">Leave<br>Management</h2>
            </button>

            <button class="dash-btn bg-[#475569] text-white p-8 rounded-2xl shadow-lg shadow-slate-500/30 flex items-center justify-center min-h-[140px] text-center">
                <h2 class="font-black text-lg uppercase tracking-widest leading-snug">Office<br>Circulars</h2>
            </button>

        </div>
    </main>

    <script>
        // Check Authentication and Load Data
        window.onload = () => {
            const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            
            // Security Check: If no user is logged in, kick them back to login page
            if (!activeStaff) {
                window.location.href = 'staff-login.html';
                return;
            }

            // Populate Teacher Details
            document.getElementById('staff-name').innerText = `"${activeStaff.name}"`;
            document.getElementById('staff-dept').innerText = `"${activeStaff.dept}"`;

            // Set Current Date
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            const today = new Date().toLocaleDateString('en-GB', options);
            document.getElementById('current-date').innerText = `Date: ${today}`;
        };

        // Logout Function
        function logout() {
            if(confirm("Are you sure you want to securely log out?")) {
                localStorage.removeItem('minervaActiveStaff');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
