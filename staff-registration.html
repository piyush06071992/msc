<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Staff Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .locked { opacity: 0.2; pointer-events: none; user-select: none; filter: blur(2px); }
        input:focus, select:focus { transform: translateY(-1px); transition: all 0.2s; border-color: #3b82f6 !important; }
        .success-ring { ring: 2px solid #22c55e; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="w-full max-w-xl">
        <div class="flex justify-between items-start mb-8">
            <button onclick="window.location.href='index.html'" class="p-3 bg-white rounded-2xl shadow-sm border border-slate-200 text-slate-400 hover:text-red-500 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div class="text-right">
                <img src="logo.png?v=2" class="w-12 ml-auto mb-2">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Secure Registration</p>
            </div>
        </div>

        <div class="glass p-6 rounded-[2rem] shadow-xl border-2 border-blue-100 mb-6">
            <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-3 ml-1 text-center">Enter Organization Code (Case Sensitive)</label>
            <input type="text" id="org-check" oninput="verifyOrgCode(this.value)" placeholder="••••••••" class="w-full p-4 bg-white border-2 border-slate-200 rounded-2xl font-black text-center tracking-widest outline-none focus:border-blue-500 transition-all">
            <p id="org-msg" class="text-[9px] font-bold text-slate-400 mt-2 text-center uppercase tracking-tighter">Enter valid code to unlock form</p>
        </div>

        <div id="form-container" class="locked transition-all duration-700">
            <div class="mb-8">
                <h1 class="text-4xl font-black text-slate-900 tracking-tight">Join Our Team</h1>
                <p class="text-slate-500 font-bold mt-1 uppercase text-[10px] tracking-widest">Minerva Study Circle | Ghumarwin / Dharamshala</p>
            </div>

            <form id="main-form" class="glass p-8 sm:p-10 rounded-[3rem] shadow-2xl border border-white space-y-6">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Email Address *</label>
                        <input type="email" id="sys-email" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Mobile Number *</label>
                        <input type="tel" id="sys-mobile" pattern="[0-9]{10}" placeholder="10 Digits" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Set Password *</label>
                        <input type="password" id="sys-pass" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none">
                    </div>
                </div>

                <div class="h-px bg-slate-100 w-full my-6"></div>

                <div id="dynamic-fields-area" class="space-y-6"></div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-700 text-white font-black py-5 rounded-3xl shadow-xl hover:bg-blue-800 transition-all active:scale-95 mt-6 uppercase tracking-widest">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let correctOrgCode = "";

        // 1. Fetch design and Org Code from Cloud
        async function fetchConfig() {
            try {
                const docSnap = await db.collection("configs").doc("staff_registration_form").get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    correctOrgCode = data.orgCode; // Loaded from your Admin Builder
                    renderDynamicFields(data.fields);
                }
            } catch (e) { console.error(e); }
        }

        // 2. Organization Code Validation
        function verifyOrgCode(val) {
            const container = document.getElementById('form-container');
            const msg = document.getElementById('org-msg');
            const input = document.getElementById('org-check');

            if (val === correctOrgCode) {
                container.classList.remove('locked');
                msg.innerText = "Code Verified ✓ Form Unlocked";
                msg.classList.replace('text-slate-400', 'text-green-600');
                input.classList.add('border-green-500');
                input.disabled = true; // Lock the code input once correct
            } else if (val.length >= correctOrgCode.length) {
                msg.innerText = "Incorrect Organization Code";
                msg.classList.replace('text-slate-400', 'text-red-500');
            }
        }

        function renderDynamicFields(fields) {
            const area = document.getElementById('dynamic-fields-area');
            area.innerHTML = "";
            fields.forEach(f => {
                const container = document.createElement('div');
                const label = `<label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">${f.label} ${f.required ? '*' : ''}</label>`;
                let inputHtml = '';
                const style = "w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none";

                if (f.type === 'text') inputHtml = `<input type="text" name="${f.label}" ${f.required ? 'required' : ''} maxlength="${f.limit || ''}" class="${style}">`;
                else if (f.type === 'number') inputHtml = `<input type="number" name="${f.label}" ${f.required ? 'required' : ''} class="${style}">`;
                else if (f.type === 'date') inputHtml = `<input type="date" name="${f.label}" ${f.required ? 'required' : ''} class="${style}">`;
                else if (f.type === 'select') {
                    const opts = f.options.split(',').map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('');
                    inputHtml = `<select name="${f.label}" ${f.required ? 'required' : ''} class="${style}">${opts}</select>`;
                }
                else if (f.type === 'checkbox') {
                    const opts = f.options.split(',').map(o => `
                        <label class="flex items-center p-4 bg-white border-2 border-slate-100 rounded-2xl cursor-pointer mb-2">
                            <input type="checkbox" name="${f.label}" value="${o.trim()}" class="w-5 h-5 accent-blue-600">
                            <span class="ml-3 font-bold text-slate-700">${o.trim()}</span>
                        </label>
                    `).join('');
                    inputHtml = `<div>${opts}</div>`;
                }

                container.innerHTML = label + inputHtml;
                area.appendChild(container);
            });
        }

        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Syncing Registration..."; btn.disabled = true;

            const staffData = {
                email: document.getElementById('sys-email').value,
                mobile: document.getElementById('sys-mobile').value,
                password: document.getElementById('sys-pass').value,
                status: "pending",
                appliedOn: firebase.firestore.FieldValue.serverTimestamp(),
                details: {}
            };

            const elements = e.target.querySelectorAll('[name]');
            elements.forEach(el => {
                if(el.type === 'checkbox') {
                    if(!staffData.details[el.name]) staffData.details[el.name] = [];
                    if(el.checked) staffData.details[el.name].push(el.value);
                } else {
                    staffData.details[el.name] = el.value;
                }
            });

            try {
                await db.collection("staff_applications").add(staffData);
                alert("Success! Your application has been submitted for Admin Review.");
                window.location.href = 'index.html';
            } catch (err) { alert(err.message); btn.disabled = false; }
        };

        fetchConfig();
    </script>
</body>
</html>
