<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Staff Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .locked { opacity: 0.15; pointer-events: none; user-select: none; filter: blur(3px); }
        input:focus, select:focus, textarea:focus { transform: translateY(-1px); transition: all 0.2s; border-color: #3b82f6 !important; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8 flex flex-col items-center">
    <div class="w-full max-w-xl">
        <div class="flex justify-between items-start mb-8">
            <button onclick="window.location.href='index.html'" class="p-3 bg-white rounded-2xl shadow-sm border border-slate-200 text-slate-400 hover:text-red-500 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div class="text-right">
                <img src="logo.png?v=2" class="w-12 ml-auto mb-2">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none">Minerva System</p>
            </div>
        </div>

       <div id="form-container" class="transition-all duration-500">
            <div class="mb-10 px-2 text-center sm:text-left">
                <h1 class="text-4xl font-black text-slate-900 tracking-tighter">Staff Application</h1>
                <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest mt-1">Ghumarwin / Dharamshala, Himachal Pradesh</p>
            </div>

            <form id="main-form" class="glass p-8 sm:p-10 rounded-[3rem] shadow-2xl border border-white space-y-6">
                <div class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Email ID *</label>
                        <input type="email" id="sys-email" onblur="checkSystemDuplicity('email', this.value, this)" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Mobile No *</label>
                        <input type="number" id="sys-mobile" inputmode="numeric" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10); if(this.value.length === 10) checkSystemDuplicity('mobile', this.value, this)" placeholder="10 Digits Only" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none">
                    </div>
                    <div class="relative">
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Create Password *</label>
                        <div class="relative">
                            <input type="password" id="sys-pass" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none pr-12">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 z-10">
                                <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="h-px bg-slate-100 w-full my-6"></div>
                <div id="dynamic-fields-area" class="space-y-6"></div>

                <p id="submit-status-msg" class="text-xs font-bold text-center text-slate-500 hidden"></p>

                <button type="submit" id="submit-btn" class="w-full bg-blue-700 text-white font-black py-5 rounded-3xl shadow-xl hover:bg-blue-800 transition-all active:scale-95 mt-6 uppercase tracking-widest text-sm">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <script>
        const STATIC_FORM_CONFIG = {"fields":[{"type":"select","label":"Preferred Branch","limit":"","options":"Dharamshala, Ghumarwin","required":true,"searchable":true,"filterable":true,"dynamicSource":"branches"},{"type":"rows","label":"Work Experience","limit":"400","options":"","required":false,"searchable":false,"filterable":false,"rowPlaceholder":"Work Experience","maxRows":10,"rowMode":"single_text_rows"},{"type":"text","label":"ADDRESS","limit":"200","options":"","required":true,"searchable":false,"filterable":false},{"type":"select","label":"GENDER","limit":"","options":"MALE, FEMALE","required":true,"searchable":false,"filterable":true},{"type":"file","label":"Resume Upload","limit":"","options":"","required":false,"searchable":false,"filterable":false,"fileTypes":"jpg,pdf","jpgMaxPx":1280,"maxFileKb":5120,"storageBackend":"firebase_storage","storageFolder":"staff_documents"},{"type":"select","label":"MARITAL STATUS","limit":"","options":"SINGLE, MARRIED, DIVORCEE, WIDOW, OTHERS","required":false,"searchable":false,"filterable":true},{"type":"checkbox","label":"QUALIFICATIONS","limit":"","options":"B.TECH, M.TECH, Phd, M.Sc, B.Sc, B.Ed, MA, Others ","required":false,"searchable":false,"filterable":false},{"type":"date","label":"DATE OF BIRTH","limit":"","options":"","required":false,"searchable":false,"filterable":false},{"type":"text","label":"Full Name","limit":"","options":"","required":true,"searchable":true,"filterable":false},{"type":"select","label":"Centre","limit":"","options":"Dharamshala, Ghumarwin","required":true,"searchable":false,"filterable":true},{"type":"checkbox","label":"Comfortable For","limit":"","options":"JEE MAINS, JEE ADVANCE, NEET, FOUNDATION","required":false,"searchable":false,"filterable":true},{"type":"checkbox","label":"Department","limit":"","options":"Physics, Chemistry, Mathematics, Biology, English, IT, Physical Education, Reasoning, Hindi, Sanskrit, General Studies, Personality Developement, DTP, Reception, PR Team, Technical Team,Accounts Team, Peon","required":true,"searchable":false,"filterable":true},{"type":"number","label":"Aadhaar Number","limit":"12","options":"","required":false,"searchable":true,"filterable":false},{"type":"number","label":"Whatsapp Number","limit":"10","options":"","required":true,"searchable":true,"filterable":false}]};
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
       const db = firebase.firestore();

        async function isEmailDuplicate(emailVal) {
            const cleanEmail = String(emailVal || "").trim().toLowerCase();
            if (!cleanEmail) return false;
            const snap = await db.collection("staff_applications").where("email", "==", cleanEmail).get();
            return snap.docs.some(doc => doc.data().status !== "rejected");
        }

        async function checkSystemDuplicity(type, value, inputEl) {
            if (!value) return false;
            try {
                if (type === "email") {
                    const exists = await isEmailDuplicate(value);
                    if (exists) {
                        alert("❌ ERROR: This EMAIL is already associated with an existing account or pending application.");
                        inputEl.value = "";
                        inputEl.classList.add('shake', 'border-red-500');
                        setTimeout(() => inputEl.classList.remove('shake'), 500);
                        return true;
                    }
                    inputEl.classList.remove('border-red-500');
                    inputEl.classList.add('border-green-500');
                    return false;
                }

                let query;
                if (type === 'mobile') query = db.collection("staff_applications").where("mobile", "==", String(value).trim());
                else if (type === 'aadhaar') query = db.collection("staff_applications").where("details.Aadhaar Number", "==", String(value).trim());
                if (!query) return false;

                const snapshot = await query.get();
                const activeDocs = snapshot.docs.filter(doc => doc.data().status !== 'rejected');
                if (activeDocs.length > 0) {
                    alert("❌ ERROR: This " + type.toUpperCase() + " is already associated with an existing account or pending application.");
                    inputEl.value = "";
                    inputEl.classList.add('shake', 'border-red-500');
                    setTimeout(() => inputEl.classList.remove('shake'), 500);
                    return true;
                }
                inputEl.classList.remove('border-red-500');
                inputEl.classList.add('border-green-500');
                return false;
            } catch (err) {
                console.error("Database check failed", err);
                return false;
            }
        }

      const orgCodeVal = (document.getElementById('org-code')?.value || "MINERVA-2026").trim();

        function togglePasswordVisibility() {
            const passInput = document.getElementById('sys-pass');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        function addRowInput(listEl, placeholder, maxRows) {
            if (maxRows > 0 && listEl.children.length >= maxRows) return;
            const row = document.createElement('div');
            row.className = "flex gap-2 items-center row-entry";
            row.innerHTML = '<input type="text" placeholder="' + (placeholder || 'Enter row item...') + '" class="flex-1 p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:bg-white transition-all row-value">' +
                '<button type="button" onclick="this.parentElement.remove()" class="px-3.5 py-3 rounded-2xl bg-rose-50 text-rose-600 font-black text-xs hover:bg-rose-100">×</button>';
            listEl.appendChild(row);
        }

        async function autoCompressAndUploadFile(file, fieldConfig) {
            const maxPx = Number(fieldConfig.jpgMaxPx || 1280);
            const maxKb = Number(fieldConfig.maxFileKb || 5120);
            const allowedTypes = String(fieldConfig.fileTypes || 'jpg,pdf').toLowerCase();
            const mime = (file.type || "").toLowerCase();
            const isJpg = mime === "image/jpeg" || mime === "image/jpg" || /\.jpe?g$/i.test(file.name);
            const isPdf = mime === "application/pdf" || /\.pdf$/i.test(file.name);

            if (isJpg && !allowedTypes.includes("jpg")) throw new Error("JPG files are not enabled for this field.");
            if (isPdf && !allowedTypes.includes("pdf")) throw new Error("PDF files are not enabled for this field.");
            if (!isJpg && !isPdf) throw new Error("Only JPG and PDF files are supported.");

            let uploadBlob = file;
            let cleanName = file.name.replace(/[^a-zA-Z0-9.\-]/g, '_');
            let width = null;
            let height = null;

            if (isJpg) {
                const dataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error("Could not read JPG file."));
                    reader.readAsDataURL(file);
                });
                const img = await new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error("Invalid JPG image."));
                    image.src = dataUrl;
                });

                let curMaxPx = maxPx;
                let quality = 0.82;
                for (let attempt = 0; attempt < 8; attempt++) {
                    const scale = Math.min(1, curMaxPx / (img.width || curMaxPx));
                    width = Math.max(1, Math.round((img.width || curMaxPx) * scale));
                    height = Math.max(1, Math.round((img.height || curMaxPx) * scale));

                    const canvas = document.createElement("canvas");
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);

                    uploadBlob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
                    if (!uploadBlob || uploadBlob.size <= maxKb * 1024) break;
                    if (quality > 0.35) quality = Number((quality - 0.1).toFixed(2));
                    else curMaxPx = Math.max(480, Math.round(curMaxPx * 0.75));
                }
                cleanName = cleanName.replace(/\.[^.]+$/, "") + ".jpg";
            }

            const storagePath = "staff_documents/" + Date.now() + "_" + cleanName;
            const storageRef = firebase.storage().ref().child(storagePath);
            await storageRef.put(uploadBlob, { contentType: isJpg ? "image/jpeg" : "application/pdf" });
            const url = await storageRef.getDownloadURL();
            return {
                format: isPdf ? "pdf" : "jpg",
                fileName: cleanName,
                sizeKb: Math.ceil(uploadBlob.size / 1024),
                width,
                height,
                url,
                storagePath
            };
        }

        function renderDynamicFields(fields) {
            const area = document.getElementById('dynamic-fields-area');
            area.innerHTML = "";
            (fields || []).forEach(f => {
                const container = document.createElement('div');
                const label = '<label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">' + f.label + (f.required ? ' *' : '') + '</label>';
                let inputHtml = '';
                const style = "w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:bg-white transition-all";
                const extraOnInput = f.label === 'Aadhaar Number' ? "; if(this.value.length === 12) checkSystemDuplicity('aadhaar', this.value, this)" : '';
                const limitScript = f.limit ? 'maxlength="' + f.limit + '" oninput="if(this.value.length > ' + f.limit + ') this.value = this.value.slice(0, ' + f.limit + ')' + extraOnInput + '"' : "";

                if (f.type === 'text') {
                    inputHtml = '<input type="text" name="' + f.label + '" ' + (f.required ? 'required' : '') + ' ' + limitScript + ' placeholder="Max ' + (f.limit || '∞') + ' chars" class="' + style + '">';
                } else if (f.type === 'number') {
                    inputHtml = '<input type="number" inputmode="numeric" name="' + f.label + '" ' + (f.required ? 'required' : '') + ' ' + limitScript + ' class="' + style + '">';
                } else if (f.type === 'date') {
                    inputHtml = '<input type="date" name="' + f.label + '" ' + (f.required ? 'required' : '') + ' class="' + style + '">';
                } else if (f.type === 'select') {
                    const opts = (f.options || '').split(',').filter(Boolean).map(o => '<option value="' + o.trim() + '">' + o.trim() + '</option>').join('');
                    inputHtml = '<select name="' + f.label + '" ' + (f.required ? 'required' : '') + ' class="' + style + '">' + opts + '</select>';
                } else if (f.type === 'checkbox') {
                    const opts = (f.options || '').split(',').filter(Boolean).map(o =>
                        '<label class="flex items-center p-4 bg-white border-2 border-slate-100 rounded-2xl cursor-pointer mb-2 active:bg-blue-50">' +
                        '<input type="checkbox" name="' + f.label + '" value="' + o.trim() + '" class="w-6 h-6 accent-blue-600 rounded-lg">' +
                        '<span class="ml-4 font-bold text-slate-700">' + o.trim() + '</span></label>'
                    ).join('');
                    inputHtml = '<div class="grid grid-cols-1 gap-1">' + opts + '</div>';
                } else if (f.type === 'link') {
                    inputHtml = '<input type="url" name="' + f.label + '" ' + (f.required ? 'required' : '') + ' placeholder="https://..." class="' + style + '">';
                } else if (f.type === 'rows') {
                    const maxRows = Number(f.maxRows || 0);
                    const placeholder = f.rowPlaceholder || 'Enter row item...';
                    container.innerHTML = label + '<div class="space-y-2 rows-list"></div><button type="button" class="mt-2 px-4 py-2 rounded-xl bg-teal-50 text-teal-700 font-black text-xs hover:bg-teal-100 add-row-btn">+ Add Row</button>';
                    const listEl = container.querySelector('.rows-list');
                    addRowInput(listEl, placeholder, maxRows);
                    container.querySelector('.add-row-btn').onclick = () => addRowInput(listEl, placeholder, maxRows);
                    container.dataset.rowsFieldLabel = f.label;
                    container.dataset.rowsRequired = String(Boolean(f.required));
                    area.appendChild(container);
                    return;
                } else if (f.type === 'file') {
                    inputHtml = '<input type="file" data-file-field="true" name="' + f.label + '" ' + (f.required ? 'required' : '') + ' class="' + style + '">';
                }
                container.innerHTML = label + inputHtml;
                area.appendChild(container);
            });
        }

        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('submit-status-msg');
            const emailInput = document.getElementById('sys-email');
            const mobileInput = document.getElementById('sys-mobile');
            const cleanEmail = emailInput.value.trim().toLowerCase();
            const cleanMobile = String(mobileInput.value).trim();

            btn.disabled = true;
            btn.innerText = "Checking Email & Saving...";
            if (statusMsg) {
                statusMsg.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');
                statusMsg.classList.add('text-blue-600');
                statusMsg.textContent = "Verifying email uniqueness and saving to Firebase...";
            }

            try {
                const duplicateEmail = await isEmailDuplicate(cleanEmail);
                if (duplicateEmail) {
                    throw new Error("This Email ID is already registered with an active application.");
                }

                const cvId = 'CV-' + Math.floor(100000 + Math.random() * 900000);
                const staffData = {
                    cvId,
                    email: cleanEmail,
                    mobile: cleanMobile,
                    password: document.getElementById('sys-pass').value,
                    status: "pending",
                    appliedOn: firebase.firestore.FieldValue.serverTimestamp(),
                    details: {}
                };

                const elements = e.target.querySelectorAll('[name]');
                elements.forEach(el => {
                    if (el.type === 'file') return;
                    if (el.type === 'checkbox') {
                        if (!staffData.details[el.name]) staffData.details[el.name] = [];
                        if (el.checked) staffData.details[el.name].push(el.value);
                    } else {
                        staffData.details[el.name] = el.value;
                    }
                });

                const rowContainers = e.target.querySelectorAll('[data-rows-field-label]');
                rowContainers.forEach(rc => {
                    const fLabel = rc.dataset.rowsFieldLabel;
                    const vals = Array.from(rc.querySelectorAll('.row-value')).map(i => i.value.trim()).filter(Boolean);
                    if (rc.dataset.rowsRequired === "true" && vals.length === 0) {
                        throw new Error("Please enter at least one row for " + fLabel + ".");
                    }
                    staffData.details[fLabel] = vals;
                });

                const fileInputs = e.target.querySelectorAll('input[type="file"][data-file-field="true"]');
                for (const fileEl of fileInputs) {
                    const selectedFile = fileEl.files && fileEl.files[0];
                    if (selectedFile) {
                        const cfgMatch = (STATIC_FORM_CONFIG.fields || []).find(item => item.label === fileEl.name) || {};
                        staffData.details[fileEl.name] = await autoCompressAndUploadFile(selectedFile, cfgMatch);
                    }
                }

                await db.collection("staff_applications").doc(cvId).set(staffData);

                const MINERVA_BOT_URL = "https://script.google.com/macros/s/AKfycbyWUqGV1jd73NK_3zOU2Sy6wXCwcrjCG0ErqyRHM41f7qzcsNwxwjXfUlk2ZjFVeUmcdQ/exec";
                if (MINERVA_BOT_URL && MINERVA_BOT_URL.startsWith("http")) {
                    fetch(MINERVA_BOT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            type: "STAFF_APPLICATION_SUBMITTED",
                            cvId,
                            email: cleanEmail,
                            mobile: cleanMobile,
                            branch: staffData.details["Preferred Branch"] || "",
                            details: staffData.details
                        })
                    }).catch(err => console.error("Email trigger error:", err));
                }

                if (statusMsg) {
                    statusMsg.classList.remove('text-blue-600');
                    statusMsg.classList.add('text-emerald-600');
                    statusMsg.textContent = "Confirmed in Firebase! Application ID: " + cvId;
                }
                alert("✅ Confirmed! Application saved to Firebase. Your ID is " + cvId + " (Pending approval).");
                window.location.href = 'index.html';
            } catch (err) {
                if (statusMsg) {
                    statusMsg.classList.remove('text-blue-600');
                    statusMsg.classList.add('text-rose-600');
                    statusMsg.textContent = err.message || "Submission failed.";
                }
                alert(err.message);
                btn.disabled = false;
                btn.innerText = "Submit Application";
            }
        };

        renderDynamicFields(STATIC_FORM_CONFIG.fields || []);
    </script>
</body>
</html>
