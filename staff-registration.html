    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
            color: #0f172a;
        }
        .glass { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); }
        input:focus, select:focus, textarea:focus {
            transform: translateY(-1px);
            transition: all 0.2s;
            border-color: #2563eb !important;
        }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .tick-chip input:checked + .tick-pill {
            background: linear-gradient(135deg, #1d4ed8, #4f46e5);
            color: #ffffff;
            border-color: #1e40af;
            box-shadow: 0 6px 14px -4px rgba(37, 99, 235, 0.45);

    <script>
        const STATIC_FORM_CONFIG = {"fields":[{"type":"select","label":"Preferred Branch","limit":"","options":"Dharamshala, Ghumarwin, Shimla","required":true,"searchable":true,"filterable":true,"dynamicSource":"branches"},{"type":"text","label":"Full Name","limit":"","options":"","required":true,"searchable":true,"filterable":false},{"type":"select","label":"GENDER","limit":"","options":"MALE, FEMALE","required":true,"searchable":false,"filterable":true},{"type":"date","label":"DATE OF BIRTH","limit":"","options":"","required":false,"searchable":false,"filterable":false},{"type":"select","label":"Blood Group","limit":"","options":"A+, A-, B+, B-, AB+, AB-, O, O+","required":false,"searchable":false,"filterable":true},{"type":"select","label":"MARITAL STATUS","limit":"","options":"SINGLE, MARRIED, DIVORCEE, WIDOW, OTHERS","required":false,"searchable":false,"filterable":true},{"type":"number","label":"Whatsapp Number","limit":"10","options":"","required":true,"searchable":true,"filterable":false},{"type":"number","label":"Aadhaar Number","limit":"12","options":"","required":false,"searchable":true,"filterable":false},{"type":"checkbox","label":"Department","limit":"","options":"Physics, Chemistry, Mathematics, Biology, English, IT, Physical Education, Reasoning, Hindi, Sanskrit, General Studies, Personality Developement, DTP, Reception, PR Team, Technical Team,Accounts Team, Peon","required":true,"searchable":false,"filterable":true},{"type":"checkbox","label":"Comfortable For","limit":"","options":"JEE MAINS, JEE ADVANCE, NEET, FOUNDATION, Non Academic Job","required":false,"searchable":false,"filterable":true},{"type":"rows","label":"Work Experience","limit":"400","options":"","required":false,"searchable":false,"filterable":false,"rowPlaceholder":"Work Experience","maxRows":10,"rowMode":"single_text_rows"},{"type":"checkbox","label":"QUALIFICATIONS","limit":"","options":"B.TECH, M.TECH, Phd, M.Sc, B.Sc, B.Ed, MA, Others ","required":false,"searchable":false,"filterable":false},{"type":"text","label":"ADDRESS","limit":"200","options":"","required":true,"searchable":false,"filterable":false},{"type":"file","label":"Resume Upload","limit":"","options":"","required":false,"searchable":false,"filterable":false,"fileTypes":"jpg,pdf","jpgMaxPx":1280,"maxFileKb":5120,"storageBackend":"firebase_storage","storageFolder":"staff_documents"}]};

        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const CARD_THEMES = [
            { wrap: "bg-sky-50/70 border-sky-200", label: "text-sky-800", input: "bg-white border-sky-200", dot: "bg-sky-500" },
            { wrap: "bg-emerald-50/70 border-emerald-200", label: "text-emerald-800", input: "bg-white border-emerald-200", dot: "bg-emerald-500" },
            { wrap: "bg-amber-50/70 border-amber-200", label: "text-amber-900", input: "bg-white border-amber-200", dot: "bg-amber-500" },
            { wrap: "bg-purple-50/70 border-purple-200", label: "text-purple-800", input: "bg-white border-purple-200", dot: "bg-purple-500" },
            { wrap: "bg-rose-50/70 border-rose-200", label: "text-rose-800", input: "bg-white border-rose-200", dot: "bg-rose-500" },
            { wrap: "bg-teal-50/70 border-teal-200", label: "text-teal-800", input: "bg-white border-teal-200", dot: "bg-teal-500" }

        async function isEmailDuplicate(emailVal) {
            const cleanEmail = String(emailVal || "").trim().toLowerCase();
            if (!cleanEmail) return false;
            const snap = await db.collection("staff_applications").where("email", "==", cleanEmail).get();
            return snap.docs.some(doc => doc.data().status !== "rejected");
        }

        async function checkSystemDuplicity(type, value, inputEl) {
            if (!value) return false;
            try {
                if (type === "email") {
                    const exists = await isEmailDuplicate(value);
                    if (exists) {
                        alert("❌ ERROR: This EMAIL is already associated with an existing account or pending application.");
                        inputEl.value = "";
                        inputEl.classList.add('shake', 'border-red-500');
                        setTimeout(() => inputEl.classList.remove('shake'), 500);
                        return true;
                    }
                    inputEl.classList.remove('border-red-500');
                    inputEl.classList.add('border-green-500');
                    return false;
                }

                let query;
                if (type === 'mobile') query = db.collection("staff_applications").where("mobile", "==", String(value).trim());
                else if (type === 'aadhaar') query = db.collection("staff_applications").where("details.Aadhaar Number", "==", String(value).trim());
                if (!query) return false;

                const snapshot = await query.get();
                const activeDocs = snapshot.docs.filter(doc => doc.data().status !== 'rejected');
                if (activeDocs.length > 0) {
                    alert("❌ ERROR: This " + type.toUpperCase() + " is already associated with an existing account or pending application.");
                    inputEl.value = "";
                    inputEl.classList.add('shake', 'border-red-500');
                    setTimeout(() => inputEl.classList.remove('shake'), 500);
                    return true;
                }
                inputEl.classList.remove('border-red-500');
                inputEl.classList.add('border-green-500');
                return false;
            } catch (err) {
                console.error("Database check failed", err);
                return false;
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('sys-pass');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        function addRowInput(listEl, placeholder, maxRows) {
            if (maxRows > 0 && listEl.children.length >= maxRows) return;
            const row = document.createElement('div');
            row.className = "flex gap-2 items-center row-entry";
            row.innerHTML = '<input type="text" placeholder="' + (placeholder || 'Enter row item...') + '" class="flex-1 p-3 bg-white border-2 border-teal-100 rounded-xl font-bold text-sm outline-none transition-all row-value">' +
                '<button type="button" onclick="this.parentElement.remove()" class="px-3.5 py-2.5 rounded-xl bg-rose-100 text-rose-700 font-black text-xs hover:bg-rose-200 transition-colors">×</button>';
            listEl.appendChild(row);
        }

        async function autoCompressAndUploadFile(file, fieldConfig) {
            const maxPx = Number(fieldConfig.jpgMaxPx || 1280);
            const maxKb = Number(fieldConfig.maxFileKb || 5120);
            const allowedTypes = String(fieldConfig.fileTypes || 'jpg,pdf').toLowerCase();
            const mime = (file.type || "").toLowerCase();
            const isJpg = mime === "image/jpeg" || mime === "image/jpg" || /\.jpe?g$/i.test(file.name);
            const isPdf = mime === "application/pdf" || /\.pdf$/i.test(file.name);

            if (isJpg && !allowedTypes.includes("jpg")) throw new Error("JPG files are not enabled for this field.");
            if (isPdf && !allowedTypes.includes("pdf")) throw new Error("PDF files are not enabled for this field.");
            if (!isJpg && !isPdf) throw new Error("Only JPG and PDF files are supported.");

            let uploadBlob = file;
            let cleanName = file.name.replace(/[^a-zA-Z0-9.\-]/g, '_');
            let width = null;
            let height = null;

            if (isJpg) {
                const dataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error("Could not read JPG file."));
                    reader.readAsDataURL(file);
                });
                const img = await new Promise((resolve, reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error("Invalid JPG image."));
                    image.src = dataUrl;
                });

                let curMaxPx = maxPx;
                let quality = 0.82;
                for (let attempt = 0; attempt < 8; attempt++) {
                    const scale = Math.min(1, curMaxPx / (img.width || curMaxPx));
                    width = Math.max(1, Math.round((img.width || curMaxPx) * scale));
                    height = Math.max(1, Math.round((img.height || curMaxPx) * scale));

                    const canvas = document.createElement("canvas");
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);

                    uploadBlob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
                    if (!uploadBlob || uploadBlob.size <= maxKb * 1024) break;
                    if (quality > 0.35) quality = Number((quality - 0.1).toFixed(2));
                    else curMaxPx = Math.max(480, Math.round(curMaxPx * 0.75));
                }
                cleanName = cleanName.replace(/\.[^.]+$/, "") + ".jpg";
            }

            const storagePath = "staff_documents/" + Date.now() + "_" + cleanName;
            const storageRef = firebase.storage().ref().child(storagePath);
            await storageRef.put(uploadBlob, { contentType: isJpg ? "image/jpeg" : "application/pdf" });
            const url = await storageRef.getDownloadURL();
            return {
                format: isPdf ? "pdf" : "jpg",
                fileName: cleanName,
                sizeKb: Math.ceil(uploadBlob.size / 1024),
                width,
                height,
                url,
                storagePath
            };
        }

        function renderDynamicFields(fields) {
            const area = document.getElementById('dynamic-fields-area');
            area.innerHTML = "";

            const allFields = fields || [];
            const compactFields = allFields.filter(f => f.type !== 'checkbox' && f.type !== 'rows' && f.type !== 'file');
            const multiAndSpecialFields = allFields.filter(f => f.type === 'checkbox' || f.type === 'rows' || f.type === 'file');

            if (compactFields.length > 0) {
                const gridWrap = document.createElement('div');
                gridWrap.className = "grid grid-cols-1 md:grid-cols-2 gap-4";

                compactFields.forEach((f, idx) => {
                    const theme = CARD_THEMES[idx % CARD_THEMES.length];
                    const isWide = f.label.toUpperCase().includes('ADDRESS');
                    const card = document.createElement('div');
                    card.className = `p-4 sm:p-5 rounded-2xl border ${theme.wrap} ${isWide ? 'md:col-span-2' : ''}`;

                    const label = `<label class="flex items-center gap-2 text-[10px] font-black ${theme.label} uppercase tracking-widest mb-2"><span class="w-2 h-2 rounded-full ${theme.dot}"></span>${f.label}${f.required ? ' *' : ''}</label>`;
                    const style = `w-full p-3.5 ${theme.input} border-2 rounded-xl font-bold text-sm text-slate-800 outline-none transition-all`;
                    const extraOnInput = f.label === 'Aadhaar Number' ? "; if(this.value.length === 12) checkSystemDuplicity('aadhaar', this.value, this)" : '';
                    const limitScript = f.limit ? `maxlength="${f.limit}" oninput="if(this.value.length > ${f.limit}) this.value = this.value.slice(0, ${f.limit})${extraOnInput}"` : "";

                    let inputHtml = '';
                    if (f.type === 'text') {
                        inputHtml = `<input type="text" name="${f.label}" ${f.required ? 'required' : ''} ${limitScript} placeholder="Max ${f.limit || '∞'} chars" class="${style}">`;
                    } else if (f.type === 'number') {
                        inputHtml = `<input type="number" inputmode="numeric" name="${f.label}" ${f.required ? 'required' : ''} ${limitScript} class="${style}">`;
                    } else if (f.type === 'date') {
                        inputHtml = `<input type="date" name="${f.label}" ${f.required ? 'required' : ''} class="${style}">`;
                    } else if (f.type === 'select') {
                        const opts = (f.options || '').split(',').map(o => o.trim()).filter(Boolean)
                            .map(o => `<option value="${o}">${o}</option>`).join('');
                        inputHtml = `<select name="${f.label}" ${f.required ? 'required' : ''} class="${style}"><option value="" selected>Select</option>${opts}</select>`;
                    } else if (f.type === 'link') {
                        inputHtml = `<input type="url" name="${f.label}" ${f.required ? 'required' : ''} placeholder="https://..." class="${style}">`;
                    }

                    card.innerHTML = label + inputHtml;
                    gridWrap.appendChild(card);
                });

                area.appendChild(gridWrap);
            }

            multiAndSpecialFields.forEach((f, idx) => {
                const theme = CARD_THEMES[(idx + 2) % CARD_THEMES.length];
                const container = document.createElement('div');
                container.className = `p-4 sm:p-6 rounded-2xl border ${theme.wrap}`;

                const label = `<div class="flex items-center justify-between gap-2 mb-3"><label class="flex items-center gap-2 text-[11px] font-black ${theme.label} uppercase tracking-widest"><span class="w-2.5 h-2.5 rounded-full ${theme.dot}"></span>${f.label}${f.required ? ' *' : ''}</label>${f.type === 'checkbox' ? '<span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Multi-select</span>' : ''}</div>`;

                if (f.type === 'checkbox') {
                    const opts = (f.options || '').split(',').map(o => o.trim()).filter(Boolean);
                    const isMany = opts.length > 6;
                    const gridCols = isMany ? "grid-cols-2 sm:grid-cols-3 lg:grid-cols-4" : "grid-cols-1 sm:grid-cols-2 md:grid-cols-3";

                    const chipsHtml = opts.map(o => `
                        <label class="tick-chip cursor-pointer block select-none">
                            <input type="checkbox" name="${f.label}" value="${o}" class="sr-only">
                            <span class="tick-pill flex items-center gap-2 px-3 py-2.5 rounded-xl bg-white border-2 border-slate-200/90 text-xs font-extrabold text-slate-700 hover:border-blue-300 transition-all">
                                <span class="w-2 h-2 rounded-full ${theme.dot} shrink-0"></span>
                                <span class="leading-snug">${o}</span>
                            </span>
                        </label>
                    `).join('');

                    container.innerHTML = label + `<div class="grid ${gridCols} gap-2.5">${chipsHtml}</div>`;
                } else if (f.type === 'rows') {
                    const maxRows = Number(f.maxRows || 0);
                    const placeholder = f.rowPlaceholder || 'Enter row item...';
                    container.innerHTML = label +
                        '<div class="space-y-2.5 rows-list"></div>' +
                        '<button type="button" class="mt-3 px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-black text-xs uppercase tracking-wider transition-colors add-row-btn">+ Add Experience Row</button>';
                    const listEl = container.querySelector('.rows-list');
                    addRowInput(listEl, placeholder, maxRows);
                    container.querySelector('.add-row-btn').onclick = () => addRowInput(listEl, placeholder, maxRows);
                    container.dataset.rowsFieldLabel = f.label;
                    container.dataset.rowsRequired = String(Boolean(f.required));
                } else if (f.type === 'file') {
                    const style = `w-full p-3 bg-white border-2 border-dashed border-slate-300 rounded-xl font-bold text-xs text-slate-700 outline-none`;
                    container.innerHTML = label + `<input type="file" data-file-field="true" name="${f.label}" ${f.required ? 'required' : ''} class="${style}">`;
                }

                area.appendChild(container);
            });
        }

        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const statusMsg = document.getElementById('submit-status-msg');
            const emailInput = document.getElementById('sys-email');
            const mobileInput = document.getElementById('sys-mobile');
            const cleanEmail = emailInput.value.trim().toLowerCase();
            const cleanMobile = String(mobileInput.value).trim();

            btn.disabled = true;
            btn.innerText = "Checking Email & Saving...";
            if (statusMsg) {
                statusMsg.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');
                statusMsg.classList.add('text-blue-600');
                statusMsg.textContent = "Verifying email uniqueness and saving to Firebase...";
            }

            try {
                const duplicateEmail = await isEmailDuplicate(cleanEmail);
                if (duplicateEmail) {
                    throw new Error("This Email ID is already registered with an active application.");
                }

                const cvId = 'CV-' + Math.floor(100000 + Math.random() * 900000);
                const staffData = {
                    cvId,
                    email: cleanEmail,
                    mobile: cleanMobile,
                    password: document.getElementById('sys-pass').value,
                    status: "pending",
                    appliedOn: firebase.firestore.FieldValue.serverTimestamp(),
                    details: {}
                };

                const elements = e.target.querySelectorAll('[name]');
                elements.forEach(el => {
                    if (el.type === 'file') return;
                    if (el.type === 'checkbox') {
                        if (!staffData.details[el.name]) staffData.details[el.name] = [];
                        if (el.checked) staffData.details[el.name].push(el.value);
                    } else {
                        staffData.details[el.name] = el.value;
                    }
                });

                const rowContainers = e.target.querySelectorAll('[data-rows-field-label]');
                rowContainers.forEach(rc => {
                    const fLabel = rc.dataset.rowsFieldLabel;
                    const vals = Array.from(rc.querySelectorAll('.row-value')).map(i => i.value.trim()).filter(Boolean);
                    if (rc.dataset.rowsRequired === "true" && vals.length === 0) {
                        throw new Error("Please enter at least one row for " + fLabel + ".");
                    }
                    staffData.details[fLabel] = vals;
                });

                const fileInputs = e.target.querySelectorAll('input[type="file"][data-file-field="true"]');
                for (const fileEl of fileInputs) {
                    const selectedFile = fileEl.files && fileEl.files[0];
                    if (selectedFile) {
                        const cfgMatch = (STATIC_FORM_CONFIG.fields || []).find(item => item.label === fileEl.name) || {};
                        staffData.details[fileEl.name] = await autoCompressAndUploadFile(selectedFile, cfgMatch);
                    }
                }

                await db.collection("staff_applications").doc(cvId).set(staffData);

                const MINERVA_BOT_URL = "https://script.google.com/macros/s/AKfycbyWUqGV1jd73NK_3zOU2Sy6wXCwcrjCG0ErqyRHM41f7qzcsNwxwjXfUlk2ZjFVeUmcdQ/exec";
                if (MINERVA_BOT_URL && MINERVA_BOT_URL.startsWith("http")) {
                    fetch(MINERVA_BOT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            type: "STAFF_APPLICATION_SUBMITTED",
                            cvId,
                            email: cleanEmail,
                            mobile: cleanMobile,
                            branch: staffData.details["Preferred Branch"] || "",
                            details: staffData.details
                        })
                    }).catch(err => console.error("Email trigger error:", err));
                }

                if (statusMsg) {
                    statusMsg.classList.remove('text-blue-600');
                    statusMsg.classList.add('text-emerald-600');
                    statusMsg.textContent = "Confirmed in Firebase! Application ID: " + cvId;
                }
                alert("✅ Confirmed! Application saved to Firebase. Your ID is " + cvId + " (Pending approval).");
                window.location.href = 'index.html';
            } catch (err) {
                if (statusMsg) {
                    statusMsg.classList.remove('text-blue-600');
                    statusMsg.classList.add('text-rose-600');
                    statusMsg.textContent = err.message || "Submission failed.";
                }
                alert(err.message);
                btn.disabled = false;
                btn.innerText = "Submit Application";
            }
        };

        renderDynamicFields(STATIC_FORM_CONFIG.fields || []);
    </script>
</body>
</html>
