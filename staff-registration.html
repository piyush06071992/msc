<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Staff Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        input:focus { transform: translateY(-2px); transition: all 0.2s; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="w-full max-w-xl">
        <div class="text-center mb-10">
            <img src="logo.png" class="w-20 mx-auto mb-4">
            <h1 class="text-3xl font-black text-slate-900">Staff Registration</h1>
            <p class="text-slate-500 font-bold uppercase tracking-widest text-xs mt-2">Join Minerva Study Circle</p>
        </div>

        <form id="main-form" class="glass p-8 sm:p-10 rounded-[3rem] shadow-2xl border border-white space-y-6">
            
            <div>
                <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Email Address (Compulsory)</label>
                <input type="email" id="sys-email" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Mobile Number (10 Digits)</label>
                <input type="tel" id="sys-mobile" pattern="[0-9]{10}" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="relative">
                <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Set Account Password</label>
                <input type="password" id="sys-pass" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold focus:ring-2 focus:ring-blue-500 outline-none">
                <button type="button" onclick="togglePass()" class="absolute right-4 top-10 text-slate-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
            </div>

            <hr class="border-slate-100 my-8">

            <div id="dynamic-fields-area" class="space-y-6"></div>

            <button type="submit" id="submit-btn" class="w-full bg-blue-700 text-white font-black py-5 rounded-3xl shadow-xl hover:bg-blue-800 transition-all active:scale-95 mt-4">
                SUBMIT REGISTRATION
            </button>
        </form>

        <p class="text-center text-slate-400 text-[10px] font-bold mt-8 uppercase tracking-widest">
            &copy; Minerva Study Circle | Ghumarwin
        </p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. Fetch the design from Admin Portal
        async function buildForm() {
            const area = document.getElementById('dynamic-fields-area');
            try {
                const docSnap = await db.collection("configs").doc("staff_registration_form").get();
                if (docSnap.exists) {
                    const fields = docSnap.data().fields;
                    fields.forEach(f => {
                        const container = document.createElement('div');
                        const label = `<label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">${f.label} ${f.required ? '<span class="text-red-500">*</span>' : ''}</label>`;
                        
                        let inputHtml = '';
                        if (f.type === 'text') {
                            inputHtml = `<input type="text" name="${f.label}" ${f.required ? 'required' : ''} maxlength="${f.limit || ''}" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-500">`;
                        } else if (f.type === 'number') {
                            inputHtml = `<input type="number" name="${f.label}" ${f.required ? 'required' : ''} class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-500">`;
                        } else if (f.type === 'date') {
                            inputHtml = `<input type="date" name="${f.label}" ${f.required ? 'required' : ''} class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-500">`;
                        } else if (f.type === 'select') {
                            const options = f.options.split(',').map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('');
                            inputHtml = `<select name="${f.label}" ${f.required ? 'required' : ''} class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-500">${options}</select>`;
                        }

                        container.innerHTML = label + inputHtml;
                        area.appendChild(container);
                    });
                }
            } catch (e) { console.error("Error building form:", e); }
        }

        // 2. Handle Submission
        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Processing..."; btn.disabled = true;

            const formData = new FormData(e.target);
            const staffData = {
                email: document.getElementById('sys-email').value,
                mobile: document.getElementById('sys-mobile').value,
                password: document.getElementById('sys-pass').value,
                status: "pending", // All new staff must be approved by Rakesh or Prashant
                appliedOn: firebase.firestore.FieldValue.serverTimestamp(),
                customFields: {}
            };

            formData.forEach((value, key) => {
                staffData.customFields[key] = value;
            });

            try {
                // Save to a new collection called "staff_applications"
                await db.collection("staff_applications").add(staffData);
                alert("Registration Successful! Your account is pending approval from Admin.");
                window.location.href = 'index.html';
            } catch (err) {
                alert("Error: " + err.message);
                btn.innerText = "SUBMIT REGISTRATION"; btn.disabled = false;
            }
        };

        function togglePass() {
            const p = document.getElementById('sys-pass');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        buildForm();
    </script>
</body>
</html>
