<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Staff Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
   <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .locked { opacity: 0.15; pointer-events: none; user-select: none; filter: blur(3px); }
        input:focus, select:focus { transform: translateY(-1px); transition: all 0.2s; border-color: #3b82f6 !important; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="w-full max-w-xl">
        <div class="flex justify-between items-start mb-8">
            <button onclick="window.location.href='index.html'" class="p-3 bg-white rounded-2xl shadow-sm border border-slate-200 text-slate-400 hover:text-red-500 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <div class="text-right">
                <img src="logo.png?v=2" class="w-12 ml-auto mb-2">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none">Minerva System</p>
            </div>
        </div>

        <div class="glass p-6 rounded-[2.5rem] shadow-xl border-2 border-blue-100 mb-8">
            <label class="block text-[10px] font-black text-blue-600 uppercase tracking-[0.2em] mb-3 text-center">Organization Unlock Code</label>
            <input type="text" id="org-check" oninput="verifyOrgCode(this.value)" placeholder="ENTER CODE" class="w-full p-4 bg-white border-2 border-slate-100 rounded-2xl font-black text-center tracking-widest outline-none focus:border-blue-500 uppercase transition-all">
            <p id="org-msg" class="text-[9px] font-bold text-slate-400 mt-3 text-center uppercase tracking-widest">Verification Required to Access Form</p>
        </div>

        <div id="form-container" class="locked transition-all duration-500">
            <div class="mb-10 px-2 text-center sm:text-left">
                <h1 class="text-4xl font-black text-slate-900 tracking-tighter">Staff Application</h1>
                <p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest mt-1">Ghumarwin / Dharamshala, Himachal Pradesh</p>
            </div>

            <form id="main-form" class="glass p-8 sm:p-10 rounded-[3rem] shadow-2xl border border-white space-y-6">
                
                <div class="space-y-5">
                    <div>
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Email ID *</label>
                        <input type="email" id="sys-email" onblur="checkSystemDuplicity('email', this.value, this)" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Mobile No *</label>
                        <input type="number" id="sys-mobile" inputmode="numeric" oninput="if(this.value.length > 10) this.value = this.value.slice(0, 10); if(this.value.length === 10) checkSystemDuplicity('mobile', this.value, this)" placeholder="10 Digits Only" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none">
                    </div>
                    
                    <div class="relative">
                        <label class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 ml-1">Create Password *</label>
                        <div class="relative">
                            <input type="password" id="sys-pass" required class="w-full p-4 bg-slate-100 border-none rounded-2xl font-bold outline-none pr-12">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 z-10">
                                <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="h-px bg-slate-100 w-full my-6"></div>

                <div id="dynamic-fields-area" class="space-y-6"></div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-700 text-white font-black py-5 rounded-3xl shadow-xl hover:bg-blue-800 transition-all active:scale-95 mt-6 uppercase tracking-widest text-sm">
                    Submit Application
                </button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const SUPABASE_URL = "https://lpccpiozrqgxgusculbs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_1q3Xilxs8lSK_dyWwbfvzQ_7zJOQV6v";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let correctOrgCode = "";

        function normalizeAcceptAttr(acceptMode) {
            if (acceptMode === "pdf") return "application/pdf,.pdf";
            if (acceptMode === "image") return "image/*,.jpg,.jpeg,.png,.webp";
            return "application/pdf,image/*,.pdf,.jpg,.jpeg,.png,.webp";
        }

        async function fetchConfig() {
            try {
                const { data, error } = await supabaseClient
                    .from("form_configs")
                    .select("org_code, fields")
                    .eq("config_key", "staff_registration_form")
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    correctOrgCode = data.org_code || "";
                    const rawFields = Array.isArray(data.fields) ? data.fields : [];
                    const indexedFields = rawFields.map((field, idx) => ({
                        ...field,
                        fieldIndex: typeof field.fieldIndex === "number" ? field.fieldIndex : idx
                    }));
                    renderDynamicFields(indexedFields);
                }
            } catch (e) { console.error("Supabase form config error:", e); }
        }

        // --- INSTANT DUPLICITY CHECKER (SUPABASE) ---
        async function checkSystemDuplicity(type, value, inputEl) {
            if (!value) return;

            try {
                let query = supabaseClient
                    .from("staff_applications")
                    .select("id, status")
                    .neq("status", "rejected");

                if (type === 'email') query = query.eq("email", value.trim());
                else if (type === 'mobile') query = query.eq("mobile", String(value).trim());
                else if (type === 'id_number') query = query.filter("details->>Aadhaar Number", "eq", String(value).trim());
                else return;

                const { data: activeRows, error } = await query;
                if (error) throw error;

                if (activeRows && activeRows.length > 0) {
                    alert(`❌ ERROR: This ${type.toUpperCase()} is already associated with an existing account or pending application.`);
                    inputEl.value = "";
                    inputEl.classList.add('shake', 'border-red-500');
                    setTimeout(() => inputEl.classList.remove('shake'), 500);
                } else {
                    inputEl.classList.remove('border-red-500');
                    inputEl.classList.add('border-green-500');
                }
            } catch (err) { console.error("Database check failed", err); }
        }

        function verifyOrgCode(val) {
            const container = document.getElementById('form-container');
            const msg = document.getElementById('org-msg');
            const input = document.getElementById('org-check');
            
            // Force both values to absolute uppercase before comparing
            const userCode = val ? val.trim().toUpperCase() : "";
            const trueCode = correctOrgCode ? correctOrgCode.trim().toUpperCase() : "";

            if (userCode === trueCode && trueCode !== "") {
                container.classList.remove('locked');
                msg.innerText = "✓ CODE MATCHED - FORM UNLOCKED";
                msg.classList.replace('text-slate-400', 'text-green-600');
                input.classList.add('border-green-500', 'bg-green-50');
                input.disabled = true;
            } else if (userCode.length >= trueCode.length && trueCode !== "") {
                msg.innerText = "Incorrect Code - Check and Try Again";
                msg.classList.replace('text-slate-400', 'text-red-500');
            }
        }
        function togglePasswordVisibility() {
            const passInput = document.getElementById('sys-pass');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        function renderDynamicFields(fields) {
            const area = document.getElementById('dynamic-fields-area');
            area.innerHTML = "";
            fields.forEach((f, idx) => {
                const fieldIndex = typeof f.fieldIndex === "number" ? f.fieldIndex : idx;
                const container = document.createElement('div');
                container.setAttribute('data-field-index', fieldIndex);
                container.setAttribute('data-field-label', f.label);

                const label = `<label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">${f.label} ${f.required ? '*' : ''}</label>`;
                let inputHtml = '';
                const style = "w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:bg-white transition-all";
                const fileStyle = "w-full p-3.5 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-xs text-slate-600 outline-none focus:bg-white transition-all file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100";

                const isNationalIdField = f.label === 'Aadhaar Number';
                const extraOnInput = isNationalIdField ? `; if(this.value.length === 12) checkSystemDuplicity('id_number', this.value, this)` : '';
                const limitScript = f.limit ? `maxlength="${f.limit}" oninput="if(this.value.length > ${f.limit}) this.value = this.value.slice(0, ${f.limit})${extraOnInput}"` : "";

                if (f.type === 'text') {
                    inputHtml = `<input type="text" name="${f.label}" data-field-index="${fieldIndex}" ${f.required ? 'required' : ''} ${limitScript} placeholder="Max ${f.limit || '∞'} chars" class="${style}">`;
                } else if (f.type === 'number') {
                    inputHtml = `<input type="number" inputmode="numeric" name="${f.label}" data-field-index="${fieldIndex}" ${f.required ? 'required' : ''} ${limitScript} class="${style}">`;
                } else if (f.type === 'date') {
                    inputHtml = `<input type="date" name="${f.label}" data-field-index="${fieldIndex}" ${f.required ? 'required' : ''} class="${style}">`;
                } else if (f.type === 'select') {
                    const opts = (f.options || "").split(',').filter(o => o.trim()).map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('');
                    inputHtml = `<select name="${f.label}" data-field-index="${fieldIndex}" ${f.required ? 'required' : ''} class="${style}">${opts}</select>`;
                } else if (f.type === 'checkbox') {
                    const opts = (f.options || "").split(',').filter(o => o.trim()).map(o => `
                        <label class="flex items-center p-4 bg-white border-2 border-slate-100 rounded-2xl cursor-pointer mb-2 active:bg-blue-50">
                            <input type="checkbox" name="${f.label}" data-field-index="${fieldIndex}" value="${o.trim()}" class="w-6 h-6 accent-blue-600 rounded-lg">
                            <span class="ml-4 font-bold text-slate-700">${o.trim()}</span>
                        </label>
                    `).join('');
                    const attachHtml = f.allowFileUpload ? `
                        <div class="mt-3 pt-3 border-t border-slate-100">
                            <label class="block text-[9px] font-black text-cyan-700 uppercase tracking-widest mb-1.5 ml-1">Supporting File (PDF or Image — Optional)</label>
                            <input type="file" data-upload-for="${f.label}" data-field-index="${fieldIndex}" accept="${normalizeAcceptAttr(f.uploadAccept)}" class="${fileStyle}">
                        </div>
                    ` : '';
                    inputHtml = `<div class="grid grid-cols-1 gap-1">${opts}</div>${attachHtml}`;
                } else if (f.type === 'file') {
                    inputHtml = `<input type="file" name="${f.label}" data-field-index="${fieldIndex}" accept="${normalizeAcceptAttr(f.uploadAccept)}" ${f.required ? 'required' : ''} class="${fileStyle}">`;
                }

                container.innerHTML = label + inputHtml;
                area.appendChild(container);
            });
        }

        async function uploadStaffFile(file) {
            const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
            const filePath = `applications/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${safeName}`;
            const { error } = await supabaseClient.storage
                .from("staff-uploads")
                .upload(filePath, file, { cacheControl: "3600", upsert: false });
            if (error) throw error;

            const { data: pubData } = supabaseClient.storage
                .from("staff-uploads")
                .getPublicUrl(filePath);
            return pubData?.publicUrl || filePath;
        }

        document.getElementById('main-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Syncing..."; btn.disabled = true;

            const details = {};
            const elements = e.target.querySelectorAll('[name]');
            for (const el of elements) {
                if (el.type === 'checkbox') {
                    if (!details[el.name]) details[el.name] = [];
                    if (el.checked) details[el.name].push(el.value);
                } else if (el.type === 'file') {
                    if (el.files && el.files[0]) {
                        details[el.name] = await uploadStaffFile(el.files[0]);
                    } else {
                        details[el.name] = "";
                    }
                } else {
                    details[el.name] = el.value;
                }
            }

            const uploadExtras = e.target.querySelectorAll('input[type="file"][data-upload-for]');
            for (const upEl of uploadExtras) {
                if (upEl.files && upEl.files[0]) {
                    const targetKey = upEl.getAttribute('data-upload-for');
                    details[`${targetKey} Attachment`] = await uploadStaffFile(upEl.files[0]);
                }
            }

            const staffPayload = {
                email: document.getElementById('sys-email').value.trim(),
                mobile: String(document.getElementById('sys-mobile').value).trim(),
                password: document.getElementById('sys-pass').value,
                status: "pending",
                applied_on: new Date().toISOString(),
                details
            };

            try {
                const { error } = await supabaseClient
                    .from("staff_applications")
                    .insert([staffPayload]);

                if (error) throw error;
                alert("Success! Application PENDING approval.");
                window.location.href = 'index.html';
            } catch (err) {
                alert(err.message || "Failed to submit application.");
                btn.disabled = false;
                btn.innerText = "Submit Application";
            }
        };

        fetchConfig();
    </script>
</body>
</html>
