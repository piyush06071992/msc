name: Build Windows OMR Executable

on:
  push:
    paths:
      - 'desktop_app.py'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller flask pywebview pymupdf opencv-python numpy requests

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile desktop_app.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinervaOMRScanner-Windows
        path: dist/desktop_app.exe
