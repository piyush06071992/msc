<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | My Duties</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 p-4 sm:px-8 sm:py-5 flex flex-wrap justify-between items-center shadow-lg gap-3">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors shadow-md border border-indigo-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard
            </button>
            <div>
                <h1 class="text-sm sm:text-xl font-black uppercase text-white tracking-widest">My Duties</h1>
                <p id="header-date" class="text-[9px] sm:text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Loading...</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8 space-y-6">

        <div id="hod-panel" class="hidden bg-gradient-to-r from-amber-100 to-orange-50 border-2 border-amber-200 rounded-2xl p-6 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <h3 class="font-black text-amber-900 uppercase tracking-widest flex items-center gap-2">
                    <span class="text-xl">👑</span> Duty Manager Access
                </h3>
                <p class="text-[10px] font-bold text-amber-700 uppercase tracking-widest mt-1">You are authorized to edit the Master Duty Chart.</p>
            </div>
           <button onclick="window.location.href='admin-duty-chart.html'" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-white px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[10px] shadow-md transition-all active:scale-95">
                Open Master Chart ➔
            </button>
        </div>

        <div id="holiday-banner" class="hidden bg-emerald-50 border-2 border-emerald-200 rounded-3xl p-8 text-center shadow-sm">
            <div class="text-5xl mb-3">🌴</div>
            <h2 class="text-2xl font-black text-emerald-800 uppercase tracking-tighter">Holiday Declared</h2>
            <p id="holiday-reason" class="text-sm font-bold text-emerald-600 mt-2 uppercase tracking-widest"></p>
            <div class="mt-4 inline-block bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest">No Duties Today</div>
        </div>

        <div id="today-container" class="bg-white rounded-[2rem] border border-slate-200 shadow-xl overflow-hidden">
            <div class="bg-slate-900 p-6 flex justify-between items-center">
                <h2 class="text-lg font-black text-white uppercase tracking-widest">Today's Assignments</h2>
                <span class="bg-indigo-500 text-white text-[10px] px-3 py-1 rounded-full font-black uppercase tracking-widest shadow-inner">LIVE</span>
            </div>
            <div id="today-list" class="p-6 sm:p-8 space-y-4">
                <div class="text-center py-10">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Syncing with Master Chart...</p>
                </div>
            </div>
        </div>

        <div id="week-container" class="bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden">
            <div class="bg-slate-50 p-6 border-b border-slate-200">
                <h2 class="text-sm font-black text-slate-800 uppercase tracking-widest">Upcoming This Week</h2>
            </div>
            <div id="week-list" class="p-6 divide-y divide-slate-100">
                </div>
        </div>

    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null;
        let todayString = "";

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const todayDate = new Date();
            todayString = todayDate.toLocaleDateString('en-US', { weekday: 'long' });
            document.getElementById('header-date').innerText = todayDate.toLocaleDateString('en-GB', options);

            await checkHODAuthorization();
            await fetchDutyData();
        };

        async function checkHODAuthorization() {
            try {
                const snap = await db.collection("staff_applications").doc(activeStaff.uid).get();
                if (snap.exists && snap.data().canManageDutyChart === true) {
                    document.getElementById('hod-panel').classList.remove('hidden');
                }
            } catch (e) { console.error("Auth check failed:", e); }
        }

      async function fetchDutyData() {
            const today = new Date();
            const todayIso = today.toISOString().split('T')[0];
            
            // Calculate Monday for Lunch Duties
            const currentDayOfWeek = today.getDay(); 
            const diffToMonday = today.getDate() - currentDayOfWeek + (currentDayOfWeek === 0 ? -6 : 1);
            const mondayDate = new Date(new Date().setDate(diffToMonday));
            const weekId = "week_starting_" + mondayDate.toISOString().split('T')[0];

            try {
                // 1. Check for Holidays
                const holSnap = await db.collection("school_holidays").get();
                let isHoliday = false; let hReason = "";
                const cDate = new Date(); cDate.setHours(0,0,0,0);
                
                holSnap.forEach(doc => {
                    const h = doc.data();
                    const hStart = new Date(h.startDate); hStart.setHours(0,0,0,0);
                    const hEnd = new Date(h.endDate || h.startDate); hEnd.setHours(23,59,59,999);
                    if (cDate >= hStart && cDate <= hEnd && h.isFullDay) {
                        isHoliday = true; hReason = h.reason;
                    }
                });

                if (isHoliday) {
                    document.getElementById('holiday-reason').innerText = hReason;
                    document.getElementById('holiday-banner').classList.remove('hidden');
                    document.getElementById('today-container').classList.add('hidden');
                }

                // 2. Fetch ALL Duty Rosters
                const rosterSnap = await db.collection("duty_rosters").get();
                
                let myDutiesToday = [];
                let myDutiesUpcoming = [];

                rosterSnap.forEach(doc => {
                    const data = doc.data();
                    const rosterId = doc.id;
                    const rosterData = data.rosterData;

                    if (data.type === 'EXAM') {
                        // --- EXAM DUTY LOGIC ---
                        const examDate = rosterId.replace('exam_duty_', '');
                        
                        Object.keys(rosterData).forEach(roomName => {
                            const room = rosterData[roomName];
                            Object.keys(room.columns).forEach(shiftName => {
                                const shift = room.columns[shiftName];
                                
                                if (shift.status === 'ASSIGNED' && shift.staff && shift.staff.email === activeStaff.email) {
                                    const dutyObj = {
                                        type: "Exam Duty",
                                        date: examDate,
                                        day: new Date(examDate).toLocaleDateString('en-US', { weekday: 'long' }),
                                        room: roomName,
                                        shift: shiftName,
                                        timing: shift.timing,
                                        isExam: true
                                    };

                                    if (examDate === todayIso) myDutiesToday.push(dutyObj);
                                    else if (examDate > todayIso) myDutiesUpcoming.push(dutyObj);
                                }
                            });
                        });

                    } else if (data.type === 'LUNCH' && rosterId === weekId) {
                        // --- LUNCH DUTY LOGIC (Current Week Only) ---
                        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                        Object.keys(rosterData).forEach(clsKey => {
                            const clsData = rosterData[clsKey];
                            daysOfWeek.forEach(day => {
                                const dayDuty = clsData.days[day];
                                if (dayDuty && dayDuty.status === 'ASSIGNED' && dayDuty.staff?.email === activeStaff.email) {
                                    const dutyObj = {
                                        type: "Lunch Duty",
                                        date: "Weekly",
                                        day: day,
                                        room: `${clsData.cName} | ${clsData.sName}`,
                                        timing: dayDuty.timing,
                                        isExam: false
                                    };

                                    if (day === todayString) myDutiesToday.push(dutyObj);
                                    else myDutiesUpcoming.push(dutyObj);
                                }
                            });
                        });
                    }
                });

                renderTodayDuties(myDutiesToday, isHoliday);
                renderUpcomingDuties(myDutiesUpcoming);

            } catch (e) {
                console.error(e);
                document.getElementById('today-list').innerHTML = `<p class="text-center text-xs text-rose-500 font-bold uppercase">Sync Error</p>`;
            }
        }

        function renderTodayDuties(duties, isHoliday) {
            const list = document.getElementById('today-list');
            if (isHoliday) return;

            if (duties.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold uppercase text-[10px]">No Assignments Today</div>`;
                return;
            }

            list.innerHTML = duties.map(d => {
                const accentColor = d.isExam ? 'indigo' : 'amber';
                const icon = d.isExam ? '📝' : '🕒';
                
                return `
                <div class="bg-${accentColor}-50 border border-${accentColor}-200 p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="bg-${accentColor}-100 text-${accentColor}-600 w-12 h-12 rounded-xl flex items-center justify-center text-xl shadow-inner shrink-0">${icon}</div>
                        <div>
                            <h4 class="font-black text-slate-900 text-base uppercase tracking-tighter">${d.type} ${d.isExam ? '- '+d.shift : ''}</h4>
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-0.5">
                                Location: <span class="text-${accentColor}-600">${d.room}</span>
                            </p>
                        </div>
                    </div>
                    <div class="bg-white border border-${accentColor}-100 px-4 py-2 rounded-xl text-center shadow-sm">
                        <span class="block text-[8px] font-black text-slate-400 uppercase">Timing</span>
                        <span class="font-black text-slate-800 text-xs">${d.timing}</span>
                    </div>
                </div>`;
            }).join('');
        }

        function renderUpcomingDuties(duties) {
            const list = document.getElementById('week-list');
            if (duties.length === 0) {
                list.innerHTML = `<p class="text-center py-6 text-[10px] font-bold text-slate-400 uppercase">No upcoming duties</p>`;
                return;
            }

            duties.sort((a, b) => (a.date > b.date) ? 1 : -1);

            list.innerHTML = duties.map(d => `
                <div class="py-4 flex justify-between items-center group hover:bg-slate-50 transition-colors px-2 rounded-lg">
                    <div class="flex items-center gap-4">
                        <div class="w-20 text-left shrink-0">
                            <span class="block text-[8px] font-black text-indigo-500 uppercase">${d.date}</span>
                            <span class="block text-xs font-black text-slate-800 uppercase">${d.day.substring(0,3)}</span>
                        </div>
                        <div class="border-l-2 border-slate-200 pl-4">
                            <h4 class="font-black text-slate-700 text-[11px] uppercase tracking-widest">${d.type} ${d.isExam ? '| '+d.shift : ''}</h4>
                            <p class="text-[10px] font-bold text-slate-500 mt-0.5">${d.room}</p>
                        </div>
                    </div>
                    <div class="text-[9px] font-black text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100">
                        ${d.timing}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
