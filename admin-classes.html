<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Class & Section Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .custom-checkbox { accent-color: #2563eb; width: 1.25rem; height: 1.25rem; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <header class="h-20 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Class Structure</h1>
        </div>
        <button onclick="openModal()" class="bg-rose-600 text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-rose-200 active:scale-95 transition-all">
            + New Section
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8">
        <div id="structure-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-slate-300 font-bold uppercase text-xs animate-pulse tracking-widest">
                Loading Institute Structure...
            </div>
        </div>
    </main>

    <div id="section-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">
            <h3 class="text-xl font-black text-slate-900 mb-6 uppercase tracking-tight border-b border-slate-100 pb-4">Define Section Layout</h3>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Class / Batch Name</label>
                    <input type="text" id="class-name" placeholder="e.g., 10+1 Medical" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-rose-400 transition-all">
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Section / Room Name</label>
                    <input type="text" id="sec-name" placeholder="e.g., S7" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-rose-400 transition-all">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-3">Required Departments / Subjects</label>
                    <div id="dept-checkboxes" class="grid grid-cols-2 gap-3 max-h-48 overflow-y-auto p-2">
                        <span class="text-xs text-slate-400 font-bold">Scanning admin forms for departments...</span>
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal()" class="flex-1 py-4 text-slate-400 font-black uppercase text-[10px] tracking-widest bg-slate-50 rounded-2xl">Cancel</button>
                    <button onclick="saveStructure()" class="flex-1 py-4 bg-rose-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-rose-200">Save Section</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let availableDepartments = [];

        async function init() {
            await fetchDepartmentsFromForm();
            await loadStructure();
        }

        // Intelligently scan the registration form for Subject/Department options
        async function fetchDepartmentsFromForm() {
            const doc = await db.collection("configs").doc("staff_registration_form").get();
            if (doc.exists) {
                const fields = doc.data().fields;
                // Look for a field labeled 'Department' or 'Subject'
                const deptField = fields.find(f => f.label.toLowerCase().includes('department') || f.label.toLowerCase().includes('subject'));
                
                if (deptField && deptField.options) {
                    availableDepartments = deptField.options.split(',').map(d => d.trim());
                    renderCheckboxes();
                } else {
                    document.getElementById('dept-checkboxes').innerHTML = `<span class="text-xs text-red-500 font-bold col-span-2">Warning: No 'Department' or 'Subject' field found in your Staff Registration Form Architect.</span>`;
                }
            }
        }

        function renderCheckboxes() {
            const container = document.getElementById('dept-checkboxes');
            container.innerHTML = availableDepartments.map(dept => `
                <label class="flex items-center gap-3 p-3 bg-white border-2 border-slate-100 rounded-xl cursor-pointer hover:border-rose-200 transition-all">
                    <input type="checkbox" value="${dept}" class="custom-checkbox cb-subject">
                    <span class="text-xs font-bold text-slate-700">${dept}</span>
                </label>
            `).join('');
        }

        async function loadStructure() {
            const container = document.getElementById('structure-grid');
            const snap = await db.collection("institute_structure").orderBy("className").get();
            
            if (snap.empty) {
                container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-bold uppercase text-[10px] tracking-widest border-2 border-dashed border-slate-200 rounded-3xl">No Classes Configured Yet</div>`;
                return;
            }

            container.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                const subjectsHtml = data.subjects.map(s => `<span class="px-2 py-1 bg-slate-100 text-slate-600 rounded text-[9px] font-black uppercase">${s}</span>`).join('');
                
                container.innerHTML += `
                    <div class="glass p-6 rounded-[2rem] border border-white shadow-lg relative group">
                        <button onclick="deleteStructure('${doc.id}')" class="absolute top-4 right-4 p-2 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                        <h4 class="text-xs font-black text-rose-500 uppercase tracking-widest mb-1">${data.className}</h4>
                        <h3 class="text-2xl font-black text-slate-900 mb-4">Sec: ${data.sectionName}</h3>
                        <div class="flex flex-wrap gap-2 pt-4 border-t border-slate-100">
                            ${subjectsHtml}
                        </div>
                    </div>
                `;
            });
        }

        async function saveStructure() {
            const className = document.getElementById('class-name').value;
            const secName = document.getElementById('sec-name').value;
            
            // Gather ticked subjects
            const checkboxes = document.querySelectorAll('.cb-subject:checked');
            const subjects = Array.from(checkboxes).map(cb => cb.value);

            if (!className || !secName || subjects.length === 0) {
                return alert("Please enter Class, Section, and select at least one subject.");
            }

            try {
                await db.collection("institute_structure").add({
                    className: className,
                    sectionName: secName,
                    subjects: subjects,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                closeModal();
                loadStructure();
                // Reset form
                document.getElementById('class-name').value = '';
                document.getElementById('sec-name').value = '';
                document.querySelectorAll('.cb-subject').forEach(cb => cb.checked = false);
            } catch (error) {
                console.error("Error saving:", error);
            }
        }

        async function deleteStructure(id) {
            if(confirm("Remove this section layout? Timetable schedules linked to it will need to be updated manually.")) {
                await db.collection("institute_structure").doc(id).delete();
                loadStructure();
            }
        }

        function openModal() { document.getElementById('section-modal').classList.replace('hidden', 'flex'); }
        function closeModal() { document.getElementById('section-modal').classList.replace('flex', 'hidden'); }

        init();
    </script>
</body>
</html>
