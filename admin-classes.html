<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Class & Section Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); }
        .custom-checkbox { accent-color: #2563eb; width: 1.2rem; height: 1.2rem; cursor: pointer; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-24 relative">

    <header class="min-h-20 bg-white/95 backdrop-blur-md border-b border-slate-200 flex flex-wrap justify-between items-center px-4 sm:px-6 py-3 sticky top-0 z-50 shadow-sm gap-3">
        <div class="flex items-center gap-3 sm:gap-4">
            <button id="dynamic-back-btn" class="p-2.5 hover:bg-slate-100 rounded-xl transition-colors border border-slate-200">
                <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <div class="flex items-center gap-2 flex-wrap">
                    <h1 class="text-lg sm:text-xl font-black text-slate-900 tracking-tight leading-none uppercase">Class Structure</h1>
                    <span class="text-[9px] font-black uppercase tracking-widest px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">Supabase Live</span>
                </div>
                <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                    <select id="global-center-switch" onchange="switchBranchContext(this.value)" class="text-[10px] font-black text-sky-800 bg-sky-50 border border-sky-200 outline-none rounded-lg px-2.5 py-1 cursor-pointer uppercase tracking-widest shadow-sm">
                        <option value="">Loading Branches...</option>
                    </select>
                    <select id="global-session-switch" onchange="switchSessionContext(this.value)" class="text-[10px] font-black text-indigo-800 bg-indigo-50 border border-indigo-200 outline-none rounded-lg px-2.5 py-1 cursor-pointer uppercase tracking-widest shadow-sm">
                        <option value="">Loading Session...</option>
                    </select>
                </div>
            </div>
        </div>

        <button onclick="openModal()" class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white px-5 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-indigo-200 active:scale-95 transition-all">
            + New Section
        </button>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-8 relative z-10">
        <div id="classes-container" class="space-y-10">
            <div class="text-center py-20 bg-white rounded-3xl border border-slate-200 text-slate-400 font-bold uppercase text-xs animate-pulse tracking-widest">
                Loading Institute Structure from Supabase...
            </div>
        </div>
    </main>

    <!-- CLASS INCHARGE MODAL -->
    <div id="class-incharge-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-100">
            <h3 id="class-modal-title" class="text-xl font-black text-slate-900 mb-1 uppercase tracking-tight">Assign Class Incharge</h3>
            <p id="class-modal-subtitle" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-6 border-b border-slate-100 pb-4">Class Name</p>

            <div class="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100 mb-4">
                <label class="block text-[10px] font-black text-indigo-900 uppercase mb-3 tracking-wider">👔 Select Class Incharge</label>
                <div class="flex flex-col gap-3">
                    <select id="modal-class-dept" onchange="populateClassModalStaff()" class="w-full p-3 bg-white border border-indigo-200 rounded-xl text-xs font-bold outline-none cursor-pointer shadow-sm uppercase">
                        <option value="">-- Select Dept --</option>
                    </select>
                    <select id="modal-class-staff" class="w-full p-3 bg-white border border-indigo-200 rounded-xl text-xs font-bold outline-none cursor-pointer shadow-sm uppercase">
                        <option value="">-- Select Person --</option>
                    </select>
                </div>
            </div>

            <div class="bg-purple-50/70 p-4 rounded-2xl border border-purple-100 mb-6">
                <label class="block text-[10px] font-black text-purple-900 uppercase mb-3 tracking-wider">🏫 Register Header / School Name</label>
                <select id="modal-register-header" class="w-full p-3 bg-white border border-purple-200 rounded-xl text-xs font-bold outline-none cursor-pointer shadow-sm uppercase">
                    <option value="MINERVA SENIOR SECONDARY SCHOOL GHUMARWIN">Minerva Senior Secondary School Ghumarwin</option>
                    <option value="MINERVA STUDY CIRCLE">Minerva Study Circle</option>
                </select>
            </div>

            <div class="flex gap-3">
                <button onclick="closeClassModal()" class="flex-1 py-4 text-slate-500 font-black uppercase text-[10px] tracking-widest bg-slate-100 rounded-2xl hover:bg-slate-200 transition-colors">Cancel</button>
                <button onclick="saveClassIncharge()" id="save-class-btn" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-colors active:scale-95">Save</button>
            </div>
        </div>
    </div>

    <!-- SECTION MODAL -->
    <div id="section-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 sm:p-8 border-b border-slate-100 shrink-0 flex justify-between items-center bg-gradient-to-r from-blue-50/70 via-indigo-50/70 to-purple-50/70">
                <div>
                    <h3 id="modal-title" class="text-xl font-black text-slate-900 uppercase tracking-tight">Define Section Layout</h3>
                    <p id="modal-context-label" class="text-[10px] font-bold text-indigo-600 uppercase tracking-widest mt-0.5"></p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-black text-xl w-9 h-9 rounded-full bg-white flex items-center justify-center shadow-sm">✕</button>
            </div>

            <div class="p-6 sm:p-8 overflow-y-auto custom-scroll space-y-5 flex-1">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-wider">Class / Batch Name</label>
                    <select id="class-select" onchange="toggleNewClassInput()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-400 transition-all cursor-pointer mb-2">
                        <option value="">Select an existing class...</option>
                        <option value="NEW" class="text-blue-600 font-black">+ Add New Class</option>
                    </select>

                    <input type="text" id="new-class-input" placeholder="Type new class (e.g., 10+1 Medical)" class="hidden w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-400 transition-all">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 tracking-wider">Section Name</label>
                        <input type="text" id="sec-name" placeholder="e.g., S7" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-400 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Short Code (Opt)</label>
                        <input type="text" id="sec-code" placeholder="e.g., 11-M-S7" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-400 transition-all">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Register Name (Opt)</label>
                        <input type="text" id="sec-reg-name" placeholder="e.g., Target Batch" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-400 transition-all">
                    </div>
                </div>

                <div class="bg-emerald-50/60 p-4 rounded-2xl border border-emerald-100">
                    <label class="block text-[10px] font-black text-emerald-900 uppercase mb-3 tracking-wider">🧑‍🏫 Section Incharge (Optional)</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <select id="sec-incharge-dept" onchange="populateInchargeStaff()" class="w-full p-3 bg-white border border-emerald-200 rounded-xl text-xs font-bold outline-none cursor-pointer shadow-sm uppercase">
                            <option value="">-- Select Dept --</option>
                        </select>
                        <select id="sec-incharge-staff" class="w-full p-3 bg-white border border-emerald-200 rounded-xl text-xs font-bold outline-none cursor-pointer shadow-sm uppercase">
                            <option value="">-- Select Person --</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-3 tracking-wider">Required Departments / Subjects</label>
                    <div id="dept-checkboxes" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-52 overflow-y-auto p-2 border-2 border-slate-100 rounded-2xl bg-slate-50/60 custom-scroll">
                        <span class="text-xs text-slate-400 font-bold col-span-2 text-center py-4">Scanning form configuration...</span>
                    </div>
                </div>
            </div>

            <div class="p-6 sm:p-8 bg-white border-t border-slate-100 flex gap-3 shrink-0">
                <button onclick="closeModal()" class="flex-1 py-4 text-slate-500 font-black uppercase text-[10px] tracking-widest bg-slate-100 rounded-2xl hover:bg-slate-200 transition-colors">Cancel</button>
                <button onclick="saveStructure()" id="save-section-btn" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-blue-200 hover:bg-blue-700 transition-colors active:scale-95">Save Section</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lpccpiozrqgxgusculbs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_1q3Xilxs8lSK_dyWwbfvzQ_7zJOQV6v";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allBranches = [];
        let allSessions = [];
        let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
        let activeBranchId = null;
        let activeSessionId = null;
        let activeSessionLabel = "2026–2027";

        let availableDepartments = [];
        let uniqueClasses = new Set();
        let allSectionsData = [];
        let editingSectionId = null;
        let allTeachers = [];
        let activeClassForIncharge = null;

        const isAdmin = sessionStorage.getItem('minervaAdminAuth') === 'true';

        // Rich multi-colour palettes for class cards & badges
        const CLASS_PALETTES = [
            {
                cardBorder: 'border-blue-200',
                headerGrad: 'from-blue-600 via-indigo-600 to-sky-600',
                softBg: 'bg-blue-50/70',
                accentText: 'text-blue-700',
                pillBg: 'bg-blue-100 text-blue-800 border-blue-200',
                inchargeBox: 'bg-indigo-50 border-indigo-200 text-indigo-950'
            },
            {
                cardBorder: 'border-emerald-200',
                headerGrad: 'from-emerald-600 via-teal-600 to-cyan-600',
                softBg: 'bg-emerald-50/70',
                accentText: 'text-emerald-700',
                pillBg: 'bg-emerald-100 text-emerald-800 border-emerald-200',
                inchargeBox: 'bg-teal-50 border-teal-200 text-teal-950'
            },
            {
                cardBorder: 'border-purple-200',
                headerGrad: 'from-purple-600 via-fuchsia-600 to-pink-600',
                softBg: 'bg-purple-50/70',
                accentText: 'text-purple-700',
                pillBg: 'bg-purple-100 text-purple-800 border-purple-200',
                inchargeBox: 'bg-fuchsia-50 border-fuchsia-200 text-fuchsia-950'
            },
            {
                cardBorder: 'border-amber-200',
                headerGrad: 'from-amber-600 via-orange-600 to-rose-500',
                softBg: 'bg-amber-50/70',
                accentText: 'text-amber-800',
                pillBg: 'bg-amber-100 text-amber-900 border-amber-200',
                inchargeBox: 'bg-orange-50 border-orange-200 text-orange-950'
            },
            {
                cardBorder: 'border-rose-200',
                headerGrad: 'from-rose-600 via-red-600 to-orange-600',
                softBg: 'bg-rose-50/70',
                accentText: 'text-rose-700',
                pillBg: 'bg-rose-100 text-rose-800 border-rose-200',
                inchargeBox: 'bg-rose-50 border-rose-200 text-rose-950'
            },
            {
                cardBorder: 'border-cyan-200',
                headerGrad: 'from-cyan-600 via-sky-600 to-blue-700',
                softBg: 'bg-cyan-50/70',
                accentText: 'text-cyan-800',
                pillBg: 'bg-cyan-100 text-cyan-900 border-cyan-200',
                inchargeBox: 'bg-sky-50 border-sky-200 text-sky-950'
            }
        ];

        const SUBJECT_CHIP_COLORS = [
            'bg-sky-100 text-sky-900 border-sky-200',
            'bg-indigo-100 text-indigo-900 border-indigo-200',
            'bg-emerald-100 text-emerald-900 border-emerald-200',
            'bg-violet-100 text-violet-900 border-violet-200',
            'bg-fuchsia-100 text-fuchsia-900 border-fuchsia-200',
            'bg-teal-100 text-teal-900 border-teal-200',
            'bg-lime-100 text-lime-900 border-lime-200',
            'bg-cyan-100 text-cyan-900 border-cyan-200'
        ];

        function parseDetails(rawDetails) {
            if (!rawDetails) return {};
            if (typeof rawDetails === 'object' && !Array.isArray(rawDetails)) return rawDetails;
            if (typeof rawDetails === 'string') {
                try { return JSON.parse(rawDetails); } catch (_) { return {}; }
            }
            return {};
        }

        function normalizeSessionKey(lbl) {
            return String(lbl || '').replace(/\s+/g, '').replace(/[–—-]/g, '-');
        }

        async function loadBranchesAndSessions() {
            const { data: branchesData, error: bErr } = await supabaseClient
                .from('branches')
                .select('id, name, is_active')
                .order('created_at', { ascending: true });

            if (bErr) {
                console.error("Error loading branches:", bErr);
                return;
            }

            allBranches = (branchesData || []).filter(b => b.is_active !== false && b.name && b.name.trim() !== '');
            if (allBranches.length === 0) return;

            const matchedBranch = allBranches.find(b => b.name.trim().toUpperCase() === String(activeCenter).toUpperCase()) || allBranches[0];
            activeCenter = matchedBranch.name.trim().toUpperCase();
            activeBranchId = matchedBranch.id;
            sessionStorage.setItem('minervaAdminCenter', activeCenter);

            const branchSelect = document.getElementById('global-center-switch');
            if (branchSelect) {
                branchSelect.innerHTML = allBranches.map(b => {
                    const upper = b.name.trim().toUpperCase();
                    return `<option value="${b.id}" ${b.id === activeBranchId ? 'selected' : ''}>📍 ${b.name.trim()} (${upper})</option>`;
                }).join('');
            }

            const { data: sessionsData, error: sErr } = await supabaseClient
                .from('branch_sessions')
                .select('id, branch_id, session_name, is_active')
                .eq('branch_id', activeBranchId)
                .order('session_name', { ascending: false });

            if (sErr) {
                console.error("Error loading branch sessions:", sErr);
                return;
            }

            allSessions = sessionsData || [];
            const savedSessionId = sessionStorage.getItem(`minervaSessionId_${activeBranchId}`);
            let chosenSession = allSessions.find(s => s.id === savedSessionId);

            if (!chosenSession) {
                chosenSession = allSessions.find(s => normalizeSessionKey(s.session_name) === '2026-2027')
                    || allSessions.find(s => s.is_active === true)
                    || allSessions[0];
            }

            const sessionSelect = document.getElementById('global-session-switch');
            if (chosenSession) {
                activeSessionId = chosenSession.id;
                activeSessionLabel = chosenSession.session_name || '2026–2027';
                sessionStorage.setItem(`minervaSessionId_${activeBranchId}`, activeSessionId);
                if (sessionSelect) {
                    sessionSelect.innerHTML = allSessions.map(s =>
                        `<option value="${s.id}" ${s.id === activeSessionId ? 'selected' : ''}>🗓️ ${s.session_name}</option>`
                    ).join('');
                }
            } else {
                activeSessionId = null;
                activeSessionLabel = '2026–2027';
                if (sessionSelect) {
                    sessionSelect.innerHTML = `<option value="">2026–2027 (No Session Row)</option>`;
                }
            }
        }

        async function checkPermission() {
            if (isAdmin) return true;
            const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff') || 'null');
            if (!activeStaff || !activeStaff.email) {
                window.location.replace('staff-login.html');
                return false;
            }

            try {
                const { data: rows, error } = await supabaseClient
                    .from("staff_applications")
                    .select("*")
                    .eq("email", activeStaff.email)
                    .limit(1);

                if (error || !rows || rows.length === 0) throw new Error("No profile");

                const staffData = rows[0];
                const authLevel = staffData.can_edit_timetable ?? staffData.canEditTimetable;

                if (!authLevel) {
                    alert("Unauthorized Access. Redirecting...");
                    window.location.replace('teacher-portal.html');
                    return false;
                }

                if (authLevel !== true && String(authLevel).toUpperCase() !== activeCenter) {
                    const targetBranch = allBranches.find(b => b.name.trim().toUpperCase() === String(authLevel).toUpperCase());
                    if (targetBranch) {
                        activeCenter = targetBranch.name.trim().toUpperCase();
                        activeBranchId = targetBranch.id;
                        sessionStorage.setItem('minervaAdminCenter', activeCenter);
                        await loadBranchesAndSessions();
                    }
                }

                const dropdown = document.getElementById('global-center-switch');
                if (dropdown && authLevel !== true) {
                    dropdown.disabled = true;
                    dropdown.className = "text-[10px] font-black text-slate-400 bg-slate-100 border border-slate-200 outline-none rounded-lg px-2.5 py-1 uppercase tracking-widest cursor-not-allowed";
                    dropdown.title = "Restricted to your authorized branch";
                }
                return true;
            } catch (e) {
                alert("Auth Error. Redirecting...");
                window.location.replace('teacher-portal.html');
                return false;
            }
        }

        async function switchBranchContext(branchId) {
            const branchObj = allBranches.find(b => b.id === branchId);
            if (!branchObj) return;
            activeBranchId = branchObj.id;
            activeCenter = branchObj.name.trim().toUpperCase();
            sessionStorage.setItem('minervaAdminCenter', activeCenter);

            const { data: sessionsData } = await supabaseClient
                .from('branch_sessions')
                .select('id, branch_id, session_name, is_active')
                .eq('branch_id', activeBranchId)
                .order('session_name', { ascending: false });

            allSessions = sessionsData || [];
            const savedSessionId = sessionStorage.getItem(`minervaSessionId_${activeBranchId}`);
            const chosenSession = allSessions.find(s => s.id === savedSessionId)
                || allSessions.find(s => normalizeSessionKey(s.session_name) === '2026-2027')
                || allSessions.find(s => s.is_active === true)
                || allSessions[0];

            const sessionSelect = document.getElementById('global-session-switch');
            if (chosenSession) {
                activeSessionId = chosenSession.id;
                activeSessionLabel = chosenSession.session_name || '2026–2027';
                sessionStorage.setItem(`minervaSessionId_${activeBranchId}`, activeSessionId);
                if (sessionSelect) {
                    sessionSelect.innerHTML = allSessions.map(s =>
                        `<option value="${s.id}" ${s.id === activeSessionId ? 'selected' : ''}>🗓️ ${s.session_name}</option>`
                    ).join('');
                }
            } else {
                activeSessionId = null;
                activeSessionLabel = '2026–2027';
                if (sessionSelect) sessionSelect.innerHTML = `<option value="">2026–2027 (No Session Row)</option>`;
            }

            await fetchTeachers();
            await loadStructure();
        }

        async function switchSessionContext(sessionId) {
            const sessObj = allSessions.find(s => s.id === sessionId);
            if (!sessObj) return;
            activeSessionId = sessObj.id;
            activeSessionLabel = sessObj.session_name || '2026–2027';
            if (activeBranchId) {
                sessionStorage.setItem(`minervaSessionId_${activeBranchId}`, activeSessionId);
            }
            await loadStructure();
        }

        function closeModal() {
            document.getElementById('section-modal').classList.replace('flex', 'hidden');
        }

        function closeClassModal() {
            document.getElementById('class-incharge-modal').classList.replace('flex', 'hidden');
            activeClassForIncharge = null;
        }

        async function init() {
            const backBtn = document.getElementById('dynamic-back-btn');
            if (backBtn) {
                backBtn.onclick = () => {
                    if (sessionStorage.getItem('minervaAdminAuth') === 'true') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'teacher-portal.html';
                    }
                };
            }

            await loadBranchesAndSessions();
            const allowed = await checkPermission();
            if (!allowed) return;

            await fetchDepartmentsFromForm();
            await fetchTeachers();
            await loadStructure();
        }

        async function fetchDepartmentsFromForm() {
            const container = document.getElementById('dept-checkboxes');
            try {
                const { data, error } = await supabaseClient
                    .from('form_configs')
                    .select('fields')
                    .eq('config_key', 'staff_registration_form')
                    .maybeSingle();

                if (error) throw error;

                const fields = Array.isArray(data?.fields) ? data.fields : [];
                const deptField = fields.find(f =>
                    String(f.label || '').toLowerCase().includes('department') ||
                    String(f.label || '').toLowerCase().includes('subject')
                );

                if (deptField && deptField.options) {
                    const rawOpts = Array.isArray(deptField.options)
                        ? deptField.options
                        : String(deptField.options).split(',');
                    availableDepartments = rawOpts.map(d => String(d).trim()).filter(Boolean);
                    renderCheckboxes([], []);
                } else {
                    container.innerHTML = `<span class="text-[10px] text-rose-500 font-bold col-span-2 text-center py-4">No 'Department' or 'Subject' field found in Staff Form Config.</span>`;
                }
            } catch (e) {
                console.error("Error fetching departments from Supabase form_configs:", e);
                container.innerHTML = `<span class="text-[10px] text-rose-500 font-bold col-span-2 text-center py-4">Failed to load departments from Supabase.</span>`;
            }
        }

        async function fetchTeachers() {
            try {
                const { data: rows, error } = await supabaseClient
                    .from('staff_applications')
                    .select('*')
                    .eq('status', 'approved');

                if (error) throw error;

                allTeachers = (rows || []).map(d => {
                    const det = parseDetails(d.details);
                    const dk = Object.keys(det).find(k =>
                        k.toLowerCase().includes('department') || k.toLowerCase().includes('subject')
                    );
                    const ck = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                    const nk = Object.keys(det).find(k => k.toLowerCase().includes('name'));

                    const matchedBranch = allBranches.find(b => b.id === d.branch_id);
                    const rawDeptVal = dk ? det[dk] : (d.department || 'General');
                    const deptStr = Array.isArray(rawDeptVal) ? rawDeptVal.join(', ') : String(rawDeptVal || 'General');
                    const centerName = matchedBranch
                        ? matchedBranch.name.trim().toUpperCase()
                        : (ck ? String(det[ck]).trim().toUpperCase() : "GHUMARWIN");

                    return {
                        id: d.id,
                        branch_id: d.branch_id || (matchedBranch ? matchedBranch.id : null),
                        email: d.email || '',
                        name: nk ? String(det[nk]).trim() : (d.full_name || d.email),
                        dept: deptStr,
                        center: centerName
                    };
                });
            } catch (e) {
                console.error("Error fetching teachers from Supabase:", e);
                allTeachers = [];
            }
        }

        function isTeacherInActiveBranch(t) {
            if (activeBranchId && t.branch_id) {
                return t.branch_id === activeBranchId || t.center === activeCenter;
            }
            return t.center === activeCenter;
        }

        function renderCheckboxes(selectedSubjects = [], optionalList = []) {
            const container = document.getElementById('dept-checkboxes');
            if (!availableDepartments.length) {
                container.innerHTML = `<span class="text-[10px] text-rose-500 font-bold col-span-2 text-center py-4">No departments defined in form configuration.</span>`;
                return;
            }

            container.innerHTML = availableDepartments.map((dept, idx) => {
                const isChecked = selectedSubjects.includes(dept);
                const isOpt = optionalList.includes(dept);
                const chipTone = SUBJECT_CHIP_COLORS[idx % SUBJECT_CHIP_COLORS.length];

                return `
                <div class="bg-white border-2 ${isChecked ? 'border-blue-400 bg-blue-50/30 shadow-md' : 'border-slate-100'} rounded-2xl p-3.5 shadow-sm space-y-2 subject-row transition-all" data-subject="${dept}">
                    <label class="flex items-center justify-between gap-2 cursor-pointer">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <input type="checkbox" value="${dept}" class="custom-checkbox cb-subject shrink-0" ${isChecked ? 'checked' : ''} onchange="toggleSubjectType(this)">
                            <span class="text-xs font-black text-slate-800 truncate">${dept}</span>
                        </div>
                        <span class="text-[8px] font-black uppercase px-2 py-0.5 rounded-full border ${chipTone} shrink-0">Subject</span>
                    </label>
                    <div class="subject-type-wrap ${isChecked ? '' : 'hidden'} pl-6 pt-2 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-wider">Enrollment:</span>
                        <select class="sub-type-select p-1.5 bg-white border border-slate-200 rounded-lg text-[10px] font-black uppercase text-slate-700 outline-none cursor-pointer shadow-sm">
                            <option value="COMPULSORY" ${!isOpt ? 'selected' : ''}>Compulsory</option>
                            <option value="OPTIONAL" ${isOpt ? 'selected' : ''}>Optional</option>
                        </select>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleSubjectType(checkbox) {
            const row = checkbox.closest('.subject-row');
            const wrap = row.querySelector('.subject-type-wrap');
            if (checkbox.checked) {
                wrap.classList.remove('hidden');
                row.classList.remove('border-slate-100');
                row.classList.add('border-blue-400', 'bg-blue-50/30', 'shadow-md');
            } else {
                wrap.classList.add('hidden');
                row.classList.add('border-slate-100');
                row.classList.remove('border-blue-400', 'bg-blue-50/30', 'shadow-md');
            }
        }

        function populateInchargeDepts() {
            let depts = new Set(availableDepartments);
            if (depts.size === 0) {
                allTeachers.forEach(t => {
                    String(t.dept || '').split(',').forEach(d => {
                        const clean = d.trim();
                        if (clean) depts.add(clean);
                    });
                });
            }
            const opts = '<option value="">-- Select Dept --</option>' + Array.from(depts).sort().map(d => `<option value="${d}">${d}</option>`).join('');
            document.getElementById('sec-incharge-dept').innerHTML = opts;
            populateInchargeStaff();
        }

        function populateInchargeStaff() {
            const dept = document.getElementById('sec-incharge-dept').value;
            const sel = document.getElementById('sec-incharge-staff');
            const prevSelected = sel.value;

            const filtered = allTeachers.filter(t =>
                isTeacherInActiveBranch(t) && (!dept || String(t.dept).toLowerCase().includes(dept.toLowerCase()))
            );

            sel.innerHTML = '<option value="">-- Select Person --</option>' + filtered.map(t =>
                `<option value="${t.name}">${t.name}</option>`
            ).join('');

            if (prevSelected && Array.from(sel.options).some(opt => opt.value === prevSelected)) {
                sel.value = prevSelected;
            }
        }

        function populateClassDropdown() {
            const select = document.getElementById('class-select');
            const currentVal = select.value;
            select.innerHTML = '<option value="">Select an existing class...</option>';

            Array.from(uniqueClasses).sort().forEach(className => {
                select.innerHTML += `<option value="${className}">${className}</option>`;
            });

            select.innerHTML += '<option value="NEW" class="text-blue-600 font-black">+ Add New Class</option>';
            if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
                select.value = currentVal;
            }
        }

        function toggleNewClassInput() {
            const select = document.getElementById('class-select');
            const input = document.getElementById('new-class-input');
            if (select.value === 'NEW') {
                input.classList.remove('hidden');
                input.focus();
            } else {
                input.classList.add('hidden');
                input.value = '';
            }
        }

        function mapStructureRow(row) {
            return {
                id: row.id,
                branch_id: row.branch_id,
                session_id: row.session_id,
                className: row.class_name || '',
                sectionName: row.section_name || '',
                shortCode: row.short_code || '',
                registerName: row.register_name || '',
                registerHeader: row.register_header || '',
                classInchargeDept: row.class_incharge_dept || '',
                classInchargeName: row.class_incharge_name || '',
                secInchargeDept: row.sec_incharge_dept || '',
                secInchargeName: row.sec_incharge_name || '',
                subjects: Array.isArray(row.subjects) ? row.subjects : [],
                optionalSubjects: Array.isArray(row.optional_subjects) ? row.optional_subjects : []
            };
        }

        async function loadStructure() {
            const container = document.getElementById('classes-container');
            container.innerHTML = `<div class="text-center py-16 bg-white rounded-3xl border border-slate-200 text-slate-400 font-bold uppercase text-xs animate-pulse tracking-widest">Loading ${activeCenter} (${activeSessionLabel}) Structure...</div>`;

            if (!activeBranchId) {
                container.innerHTML = `<div class="py-16 text-center bg-white rounded-3xl border-2 border-dashed border-rose-200 text-rose-500 font-black uppercase text-xs tracking-widest">No Active Branch Found in Supabase</div>`;
                return;
            }

            let query = supabaseClient
                .from('institute_structure')
                .select('*')
                .eq('branch_id', activeBranchId)
                .order('class_name', { ascending: true })
                .order('section_name', { ascending: true });

            if (activeSessionId) {
                query = query.eq('session_id', activeSessionId);
            }

            const { data: rows, error } = await query;

            uniqueClasses.clear();
            allSectionsData = [];

            if (error) {
                console.error("Error loading institute_structure:", error);
                container.innerHTML = `<div class="py-16 text-center bg-white rounded-3xl border-2 border-dashed border-rose-200 text-rose-500 font-black uppercase text-xs tracking-widest">Error Loading Structure from Supabase</div>`;
                return;
            }

            if (!rows || rows.length === 0) {
                container.innerHTML = `
                    <div class="py-20 px-6 text-center bg-white rounded-[2.5rem] border-2 border-dashed border-indigo-200 shadow-sm space-y-3">
                        <div class="text-4xl">🏫</div>
                        <p class="text-slate-700 font-black uppercase text-sm tracking-widest">No Classes Configured for ${activeCenter} (${activeSessionLabel})</p>
                        <p class="text-xs font-semibold text-slate-400">Click "+ New Section" at the top right to start fresh for this session.</p>
                    </div>`;
                populateClassDropdown();
                return;
            }

            const groupedData = {};
            rows.forEach(rawRow => {
                const secData = mapStructureRow(rawRow);
                uniqueClasses.add(secData.className);
                if (!groupedData[secData.className]) groupedData[secData.className] = [];
                groupedData[secData.className].push(secData);
                allSectionsData.push(secData);
            });

            container.innerHTML = "";
            let paletteIndex = 0;

            Object.keys(groupedData).sort().forEach(className => {
                const pal = CLASS_PALETTES[paletteIndex % CLASS_PALETTES.length];
                const sections = groupedData[className];
                const firstSec = sections[0] || {};
                const classInchName = firstSec.classInchargeName || '';
                const classInchDept = firstSec.classInchargeDept || '';
                const regHeader = firstSec.registerHeader || 'MINERVA SENIOR SECONDARY SCHOOL GHUMARWIN';

                const safeClassArg = encodeURIComponent(className);
                const safeDeptArg = encodeURIComponent(classInchDept);
                const safeStaffArg = encodeURIComponent(classInchName);
                const safeHeaderArg = encodeURIComponent(regHeader);

                const totalSubjectsCount = sections.reduce((acc, s) => acc + (s.subjects ? s.subjects.length : 0), 0);

                let groupHtml = `
                    <section class="rounded-[2.25rem] border-2 ${pal.cardBorder} bg-white shadow-lg overflow-hidden">
                        <div class="bg-gradient-to-r ${pal.headerGrad} p-6 sm:p-7 text-white flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                            <div class="space-y-2">
                                <div class="flex items-center gap-2.5 flex-wrap">
                                    <span class="text-[10px] font-black uppercase tracking-widest bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full border border-white/30">
                                        ${activeCenter} • ${activeSessionLabel}
                                    </span>
                                    <span class="text-[10px] font-black uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">
                                        ${sections.length} ${sections.length === 1 ? 'Section' : 'Sections'}
                                    </span>
                                    <span class="text-[10px] font-black uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">
                                        ${totalSubjectsCount} Subject Mappings
                                    </span>
                                </div>
                                <h2 class="text-2xl sm:text-3xl font-black uppercase tracking-tight leading-none">${className}</h2>
                                <p class="text-[11px] font-bold text-white/85 uppercase tracking-wider">
                                    Register Header: <span class="underline decoration-white/40">${regHeader}</span>
                                </p>
                            </div>

                            <div class="flex items-center gap-3 bg-white/95 text-slate-900 p-3 rounded-2xl shadow-md border border-white/60 self-start lg:self-auto">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${pal.headerGrad} text-white flex items-center justify-center text-lg font-black shrink-0 shadow-sm">
                                    👔
                                </div>
                                <div class="min-w-[140px]">
                                    <div class="text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none">Class Incharge</div>
                                    <div class="text-xs font-black text-slate-900 uppercase mt-1 truncate max-w-[180px]">${classInchName || 'Not Assigned'}</div>
                                    ${classInchDept ? `<div class="text-[9px] font-bold ${pal.accentText} uppercase truncate">${classInchDept}</div>` : ''}
                                </div>
                                <button onclick="openClassModal(decodeURIComponent('${safeClassArg}'), decodeURIComponent('${safeDeptArg}'), decodeURIComponent('${safeStaffArg}'), decodeURIComponent('${safeHeaderArg}'))" class="bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-sm transition-all active:scale-95 shrink-0">
                                    ${classInchName ? 'Change' : 'Assign'}
                                </button>
                            </div>
                        </div>

                        <div class="p-5 sm:p-7 ${pal.softBg} grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                `;

                sections.forEach((sec, secIdx) => {
                    const optionals = Array.isArray(sec.optionalSubjects) ? sec.optionalSubjects : [];
                    const subjects = Array.isArray(sec.subjects) ? sec.subjects : [];
                    const secPalette = CLASS_PALETTES[(paletteIndex + secIdx + 1) % CLASS_PALETTES.length];

                    const subjectsHtml = subjects.length > 0
                        ? subjects.map((s, sIdx) => {
                            const isOpt = optionals.includes(s);
                            if (isOpt) {
                                return `<span class="px-2.5 py-1 bg-amber-100 text-amber-900 rounded-lg text-[10px] font-black uppercase tracking-wider border border-amber-300 shadow-2xs flex items-center gap-1" title="Optional Subject">
                                    ${s} <span class="text-[8px] bg-amber-200/80 text-amber-950 px-1.5 py-0.2 rounded font-extrabold">OPT</span>
                                </span>`;
                            }
                            const chipClass = SUBJECT_CHIP_COLORS[(sIdx + secIdx) % SUBJECT_CHIP_COLORS.length];
                            return `<span class="px-2.5 py-1 ${chipClass} rounded-lg text-[10px] font-extrabold uppercase tracking-wider border shadow-2xs">
                                ${s}
                            </span>`;
                        }).join('')
                        : `<span class="text-[10px] font-bold text-slate-400 uppercase italic">No subjects assigned</span>`;

                    groupHtml += `
                        <div class="bg-white rounded-3xl border-2 ${secPalette.cardBorder} p-5 shadow-sm hover:shadow-xl transition-all flex flex-col justify-between gap-4 relative">
                            <div>
                                <div class="flex items-start justify-between gap-2 pb-3 border-b border-slate-100">
                                    <div>
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <h3 class="text-xl font-black text-slate-900 tracking-tight uppercase">Sec ${sec.sectionName}</h3>
                                            ${sec.shortCode ? `<span class="text-[9px] font-black uppercase tracking-widest px-2 py-0.5 rounded-md border ${secPalette.pillBg}">${sec.shortCode}</span>` : ''}
                                        </div>
                                        ${sec.registerName ? `<p class="text-[10px] font-black ${secPalette.accentText} uppercase tracking-widest mt-1">📘 Register: ${sec.registerName}</p>` : `<p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mt-1">Standard Register</p>`}
                                    </div>

                                    <div class="flex items-center gap-1.5 shrink-0">
                                        <button onclick="openEditModal('${sec.id}')" title="Edit Section" class="p-2 bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white rounded-xl transition-colors border border-blue-100 text-xs font-bold">✏️</button>
                                        <button onclick="deleteStructure('${sec.id}')" title="Delete Section" class="p-2 bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white rounded-xl transition-colors border border-rose-100 text-xs font-bold">🗑️</button>
                                    </div>
                                </div>

                                <div class="mt-3 p-3 rounded-2xl border ${secPalette.inchargeBox} flex items-center justify-between gap-2">
                                    <div class="min-w-0">
                                        <div class="text-[8px] font-black uppercase tracking-widest opacity-70">Section Incharge</div>
                                        <div class="text-xs font-black uppercase truncate mt-0.5">${sec.secInchargeName || 'Unassigned'}</div>
                                    </div>
                                    ${sec.secInchargeDept ? `<span class="text-[9px] font-black uppercase bg-white/80 px-2 py-1 rounded-lg border border-black/10 shrink-0">${sec.secInchargeDept}</span>` : ''}
                                </div>

                                <div class="mt-4">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Subjects (${subjects.length})</span>
                                        ${optionals.length > 0 ? `<span class="text-[9px] font-black text-amber-700 uppercase">${optionals.length} Optional</span>` : ''}
                                    </div>
                                    <div class="flex flex-wrap gap-1.5">
                                        ${subjectsHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                groupHtml += `</div></section>`;
                container.innerHTML += groupHtml;
                paletteIndex++;
            });

            populateClassDropdown();
        }

        function openModal() {
            editingSectionId = null;
            document.getElementById('modal-title').innerText = "Define Section Layout";
            document.getElementById('modal-context-label').innerText = `Branch: ${activeCenter} • Session: ${activeSessionLabel}`;
            document.getElementById('class-select').value = '';
            document.getElementById('new-class-input').classList.add('hidden');
            document.getElementById('new-class-input').value = '';
            document.getElementById('sec-name').value = '';
            document.getElementById('sec-code').value = '';
            document.getElementById('sec-reg-name').value = '';

            populateInchargeDepts();
            document.getElementById('sec-incharge-dept').value = '';
            document.getElementById('sec-incharge-staff').value = '';

            renderCheckboxes([], []);
            document.getElementById('section-modal').classList.replace('hidden', 'flex');
        }

        function openEditModal(id) {
            const sec = allSectionsData.find(s => String(s.id) === String(id));
            if (!sec) return;

            editingSectionId = sec.id;
            document.getElementById('modal-title').innerText = "Edit Section Layout";
            document.getElementById('modal-context-label').innerText = `Branch: ${activeCenter} • Session: ${activeSessionLabel}`;

            populateClassDropdown();
            const classSelect = document.getElementById('class-select');
            classSelect.value = sec.className;
            document.getElementById('new-class-input').classList.add('hidden');
            document.getElementById('new-class-input').value = '';
            document.getElementById('sec-name').value = sec.sectionName;
            document.getElementById('sec-code').value = sec.shortCode || '';
            document.getElementById('sec-reg-name').value = sec.registerName || '';

            populateInchargeDepts();
            document.getElementById('sec-incharge-dept').value = sec.secInchargeDept || '';
            populateInchargeStaff();
            document.getElementById('sec-incharge-staff').value = sec.secInchargeName || '';

            renderCheckboxes(sec.subjects || [], sec.optionalSubjects || []);
            document.getElementById('section-modal').classList.replace('hidden', 'flex');
        }

        async function saveStructure() {
            const selectVal = document.getElementById('class-select').value;
            const newClassVal = document.getElementById('new-class-input').value.trim();
            const secName = document.getElementById('sec-name').value.trim();
            const shortCodeVal = document.getElementById('sec-code').value.trim();
            const registerNameVal = document.getElementById('sec-reg-name').value.trim();

            const sInchDept = document.getElementById('sec-incharge-dept').value || "";
            const sInchName = document.getElementById('sec-incharge-staff').value || "";

            const className = (selectVal === 'NEW') ? newClassVal : selectVal;

            let subjects = [];
            let optionalSubjects = [];

            document.querySelectorAll('.cb-subject:checked').forEach(cb => {
                const sub = cb.value;
                subjects.push(sub);
                const row = cb.closest('.subject-row');
                const typeSelect = row.querySelector('.sub-type-select');
                if (typeSelect && typeSelect.value === 'OPTIONAL') {
                    optionalSubjects.push(sub);
                }
            });

            if (!className || !secName) return alert("Please provide both a Class Name and a Section Name.");
            if (subjects.length === 0) return alert("Please select at least one Required Department/Subject.");
            if (!activeBranchId) return alert("Active branch is missing in Supabase.");

            const btn = document.getElementById('save-section-btn');
            const origText = btn.innerText;
            btn.innerText = "Saving...";
            btn.disabled = true;

            const existingClassRow = allSectionsData.find(s => s.className === className);
            const payload = {
                branch_id: activeBranchId,
                session_id: activeSessionId,
                class_name: className,
                section_name: secName,
                short_code: shortCodeVal,
                register_name: registerNameVal,
                register_header: existingClassRow?.registerHeader || 'MINERVA SENIOR SECONDARY SCHOOL GHUMARWIN',
                class_incharge_dept: existingClassRow?.classInchargeDept || '',
                class_incharge_name: existingClassRow?.classInchargeName || '',
                sec_incharge_dept: sInchDept,
                sec_incharge_name: sInchName,
                subjects: subjects,
                optional_subjects: optionalSubjects,
                updated_at: new Date().toISOString()
            };

            try {
                if (editingSectionId) {
                    const { error } = await supabaseClient
                        .from('institute_structure')
                        .update(payload)
                        .eq('id', editingSectionId);

                    if (error) throw error;
                    alert("Section updated successfully in Supabase!");
                } else {
                    const duplicate = allSectionsData.find(s =>
                        s.className.toLowerCase() === className.toLowerCase() &&
                        s.sectionName.toLowerCase() === secName.toLowerCase()
                    );
                    if (duplicate) {
                        btn.innerText = origText;
                        btn.disabled = false;
                        return alert(`Error: Section '${secName}' already exists in '${className}' for ${activeSessionLabel}.`);
                    }

                    payload.firestore_id = `ui_${activeCenter.toLowerCase()}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
                    const { error } = await supabaseClient
                        .from('institute_structure')
                        .insert([payload]);

                    if (error) throw error;
                    alert("New section saved to Supabase!");
                }

                closeModal();
                await loadStructure();
            } catch (error) {
                console.error("Error saving structure:", error);
                alert("Failed to save: " + error.message);
            } finally {
                btn.innerText = origText;
                btn.disabled = false;
            }
        }

        function openClassModal(className, currentDept, currentStaff, decodedHeader = "") {
            activeClassForIncharge = className;
            document.getElementById('class-modal-subtitle').innerText = `Class ${className} • ${activeCenter} (${activeSessionLabel})`;

            let depts = new Set(availableDepartments);
            if (depts.size === 0) {
                allTeachers.forEach(t => {
                    String(t.dept || '').split(',').forEach(d => {
                        const clean = d.trim();
                        if (clean) depts.add(clean);
                    });
                });
            }
            const opts = '<option value="">-- Select Dept --</option>' + Array.from(depts).sort().map(d =>
                `<option value="${d}">${d}</option>`
            ).join('');

            document.getElementById('modal-class-dept').innerHTML = opts;
            document.getElementById('modal-class-dept').value = currentDept || '';

            const headerSelect = document.getElementById('modal-register-header');
            if (headerSelect) {
                headerSelect.value = decodedHeader || "MINERVA SENIOR SECONDARY SCHOOL GHUMARWIN";
            }

            populateClassModalStaff(currentStaff);
            document.getElementById('class-incharge-modal').classList.replace('hidden', 'flex');
        }

        function populateClassModalStaff(preselectName = null) {
            const dept = document.getElementById('modal-class-dept').value;
            const sel = document.getElementById('modal-class-staff');
            const prevSelected = typeof preselectName === 'string' && preselectName ? preselectName : sel.value;

            const filtered = allTeachers.filter(t =>
                isTeacherInActiveBranch(t) && (!dept || String(t.dept).toLowerCase().includes(dept.toLowerCase()))
            );

            sel.innerHTML = '<option value="">-- Select Person --</option>' + filtered.map(t =>
                `<option value="${t.name}">${t.name}</option>`
            ).join('');

            if (prevSelected && Array.from(sel.options).some(opt => opt.value === prevSelected)) {
                sel.value = prevSelected;
            }
        }

        async function saveClassIncharge() {
            if (!activeClassForIncharge || !activeBranchId) return;
            const dept = document.getElementById('modal-class-dept').value || '';
            const staffName = document.getElementById('modal-class-staff').value || '';
            const regHeader = document.getElementById('modal-register-header').value || 'MINERVA SENIOR SECONDARY SCHOOL GHUMARWIN';

            const btn = document.getElementById('save-class-btn');
            const origText = btn.innerText;
            btn.innerText = "Saving...";
            btn.disabled = true;

            try {
                let updQuery = supabaseClient
                    .from('institute_structure')
                    .update({
                        class_incharge_dept: dept,
                        class_incharge_name: staffName,
                        register_header: regHeader,
                        updated_at: new Date().toISOString()
                    })
                    .eq('branch_id', activeBranchId)
                    .eq('class_name', activeClassForIncharge);

                if (activeSessionId) {
                    updQuery = updQuery.eq('session_id', activeSessionId);
                }

                const { error } = await updQuery;
                if (error) throw error;

                closeClassModal();
                await loadStructure();
            } catch (e) {
                console.error("Error saving class incharge:", e);
                alert("Failed to save: " + e.message);
            } finally {
                btn.innerText = origText;
                btn.disabled = false;
            }
        }

        async function deleteStructure(id) {
            if (!confirm("Delete this section from the current branch & session in Supabase?")) return;
            try {
                const { error } = await supabaseClient
                    .from('institute_structure')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                alert("Section removed from Supabase.");
                await loadStructure();
            } catch (e) {
                console.error("Error deleting structure:", e);
                alert("Error deleting: " + e.message);
            }
        }

        init();
    </script>
</body>
