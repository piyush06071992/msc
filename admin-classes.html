<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Class & Section Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .custom-checkbox { accent-color: #2563eb; width: 1.25rem; height: 1.25rem; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <header class="h-20 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Class Structure</h1>
        </div>
        <button onclick="openModal()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-blue-200 active:scale-95 transition-all">
            + New Section
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8">
        <div id="classes-container" class="space-y-12">
            <div class="text-center py-20 text-slate-300 font-bold uppercase text-xs animate-pulse tracking-widest">
                Loading Institute Structure...
            </div>
        </div>
    </main>

    <div id="section-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">
            <h3 id="modal-title" class="text-xl font-black text-slate-900 mb-6 uppercase tracking-tight border-b border-slate-100 pb-4">Define Section Layout</h3>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Class / Batch Name</label>
                    <select id="class-select" onchange="toggleNewClassInput()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-400 transition-all cursor-pointer mb-2">
                        <option value="">Select an existing class...</option>
                        <option value="NEW" class="text-blue-600 font-black">+ Add New Class</option>
                    </select>
                    
                    <input type="text" id="new-class-input" placeholder="Type new class (e.g., 10+1 Medical)" class="hidden w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-400 transition-all">
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Section Name</label>
                    <input type="text" id="sec-name" placeholder="e.g., S7" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-400 transition-all">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-3">Required Departments / Subjects</label>
                    <div id="dept-checkboxes" class="grid grid-cols-2 gap-3 max-h-48 overflow-y-auto p-2 border-2 border-slate-50 rounded-2xl bg-slate-50/50">
                        <span class="text-xs text-slate-400 font-bold col-span-2 text-center py-4">Scanning admin forms...</span>
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal()" class="flex-1 py-4 text-slate-400 font-black uppercase text-[10px] tracking-widest bg-slate-50 rounded-2xl hover:bg-slate-100 transition-colors">Cancel</button>
                    <button onclick="saveStructure()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-blue-200 hover:bg-blue-700 transition-colors active:scale-95">Save Section</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let availableDepartments = [];
        let uniqueClasses = new Set();
        let allSectionsData = []; 
        let editingSectionId = null; 

        const THEMES = [
            { text: 'text-blue-600', bg: 'bg-blue-50', hover: 'hover:border-blue-300' },
            { text: 'text-emerald-600', bg: 'bg-emerald-50', hover: 'hover:border-emerald-300' },
            { text: 'text-purple-600', bg: 'bg-purple-50', hover: 'hover:border-purple-300' },
            { text: 'text-amber-600', bg: 'bg-amber-50', hover: 'hover:border-amber-300' },
            { text: 'text-rose-600', bg: 'bg-rose-50', hover: 'hover:border-rose-300' },
            { text: 'text-teal-600', bg: 'bg-teal-50', hover: 'hover:border-teal-300' }
        ];

        async function init() {
            await fetchDepartmentsFromForm();
            await loadStructure();
        }

        async function fetchDepartmentsFromForm() {
            const doc = await db.collection("configs").doc("staff_registration_form").get();
            if (doc.exists) {
                const fields = doc.data().fields;
                const deptField = fields.find(f => f.label.toLowerCase().includes('department') || f.label.toLowerCase().includes('subject'));
                
                if (deptField && deptField.options) {
                    availableDepartments = deptField.options.split(',').map(d => d.trim());
                    renderCheckboxes();
                } else {
                    document.getElementById('dept-checkboxes').innerHTML = `<span class="text-[10px] text-red-500 font-bold col-span-2 text-center py-4">No 'Department' or 'Subject' field found in Staff Form.</span>`;
                }
            }
        }

        function renderCheckboxes() {
            const container = document.getElementById('dept-checkboxes');
            container.innerHTML = availableDepartments.map(dept => `
                <label class="flex items-center gap-3 p-3 bg-white border-2 border-slate-100 rounded-xl cursor-pointer hover:border-blue-200 transition-all shadow-sm">
                    <input type="checkbox" value="${dept}" class="custom-checkbox cb-subject shrink-0">
                    <span class="text-xs font-bold text-slate-700 truncate">${dept}</span>
                </label>
            `).join('');
        }

        function populateClassDropdown() {
            const select = document.getElementById('class-select');
            const currentVal = select.value; 
            select.innerHTML = '<option value="">Select an existing class...</option>';
            
            Array.from(uniqueClasses).sort().forEach(className => {
                select.innerHTML += `<option value="${className}">${className}</option>`;
            });
            
            select.innerHTML += '<option value="NEW" class="text-blue-600 font-black">+ Add New Class</option>';
            if(currentVal) select.value = currentVal;
        }

        function toggleNewClassInput() {
            const select = document.getElementById('class-select');
            const input = document.getElementById('new-class-input');
            
            if (select.value === 'NEW') {
                input.classList.remove('hidden');
                input.focus();
            } else {
                input.classList.add('hidden');
                input.value = '';
            }
        }

        async function loadStructure() {
            const container = document.getElementById('classes-container');
            const snap = await db.collection("institute_structure").orderBy("className").get();
            
            uniqueClasses.clear();
            allSectionsData = []; 
            
            if (snap.empty) {
                container.innerHTML = `<div class="py-20 text-center text-slate-400 font-bold uppercase text-[10px] tracking-widest border-2 border-dashed border-slate-200 rounded-3xl">No Classes Configured Yet</div>`;
                populateClassDropdown();
                return;
            }

            const groupedData = {};
            snap.forEach(doc => {
                const data = doc.data();
                uniqueClasses.add(data.className);
                if (!groupedData[data.className]) groupedData[data.className] = [];
                
                const secData = { id: doc.id, ...data };
                groupedData[data.className].push(secData);
                allSectionsData.push(secData); 
            });

            container.innerHTML = "";
            let themeIndex = 0;
            
            Object.keys(groupedData).sort().forEach(className => {
                const theme = THEMES[themeIndex % THEMES.length];
                const sections = groupedData[className];

                let groupHtml = `
                    <div class="mb-8">
                        <h2 class="text-2xl font-black text-slate-800 mb-6 uppercase tracking-tighter flex items-center gap-3">
                            <span class="w-3 h-8 rounded-full ${theme.bg}"></span>
                            ${className}
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                `;

                sections.forEach(sec => {
                    const subjectsHtml = sec.subjects.map(s => `<span class="px-2 py-1 ${theme.bg} ${theme.text} rounded-md text-[9px] font-black uppercase tracking-wider">${s}</span>`).join('');
                    
                    groupHtml += `
                        <div class="glass p-6 rounded-[2rem] border-2 border-transparent shadow-lg relative group transition-all ${theme.hover} hover:shadow-xl flex flex-col justify-between min-h-[160px]">
                            
                            <div class="absolute top-6 right-6 flex gap-2 opacity-0 group-hover:opacity-100 transition-all z-10">
                                <button onclick="openEditModal('${sec.id}')" title="Edit Section" class="p-2 bg-slate-50 rounded-xl text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                                    ✏️
                                </button>
                                <button onclick="deleteStructure('${sec.id}')" title="Delete Section" class="p-2 bg-slate-50 rounded-xl text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors">
                                    🗑️
                                </button>
                            </div>

                            <div>
                                <h3 class="text-2xl font-black text-slate-900 mb-3 tracking-tighter pr-16 leading-tight break-words">Sec: ${sec.sectionName}</h3>
                                <div class="flex flex-wrap gap-1.5 pt-4 border-t border-slate-100">
                                    ${subjectsHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });

                groupHtml += `</div></div>`;
                container.innerHTML += groupHtml;
                themeIndex++; 
            });
            
            populateClassDropdown();
        }

        function openModal() { 
            editingSectionId = null; 
            document.getElementById('modal-title').innerText = "Define Section Layout";
            document.getElementById('class-select').value = '';
            document.getElementById('new-class-input').classList.add('hidden');
            document.getElementById('sec-name').value = '';
            document.querySelectorAll('.cb-subject').forEach(cb => cb.checked = false);
            document.getElementById('section-modal').classList.replace('hidden', 'flex'); 
        }

        function openEditModal(id) {
            const sec = allSectionsData.find(s => s.id === id);
            if(!sec) return;
            
            editingSectionId = id; 
            document.getElementById('modal-title').innerText = "Edit Section Layout";
            
            const classSelect = document.getElementById('class-select');
            classSelect.value = sec.className;
            document.getElementById('new-class-input').classList.add('hidden');
            document.getElementById('sec-name').value = sec.sectionName;
            
            document.querySelectorAll('.cb-subject').forEach(cb => {
                cb.checked = sec.subjects.includes(cb.value);
            });
            
            document.getElementById('section-modal').classList.replace('hidden', 'flex');
        }

        function closeModal() { 
            document.getElementById('section-modal').classList.replace('flex', 'hidden'); 
        }

        async function saveStructure() {
            const selectVal = document.getElementById('class-select').value;
            const newClassVal = document.getElementById('new-class-input').value.trim();
            const secName = document.getElementById('sec-name').value.trim();
            
            const className = (selectVal === 'NEW') ? newClassVal : selectVal;
            const checkboxes = document.querySelectorAll('.cb-subject:checked');
            const subjects = Array.from(checkboxes).map(cb => cb.value);

            if (!className || !secName) return alert("Please provide both a Class Name and a Section Name.");
            if (subjects.length === 0) return alert("Please select at least one Required Department/Subject.");

            const btn = document.querySelector('button[onclick="saveStructure()"]');
            btn.innerText = "Saving..."; btn.disabled = true;

            try {
                if (editingSectionId) {
                    const oldSec = allSectionsData.find(s => s.id === editingSectionId);
                    
                    await db.collection("institute_structure").doc(editingSectionId).update({
                        className: className,
                        sectionName: secName,
                        subjects: subjects
                    });

                    if (oldSec.className !== className || oldSec.sectionName !== secName) {
                        const ttSnap = await db.collection("timetable")
                            .where("className", "==", oldSec.className)
                            .where("section", "==", oldSec.sectionName)
                            .get();
                        
                        if (!ttSnap.empty) {
                            const batch = db.batch();
                            ttSnap.docs.forEach(doc => {
                                batch.update(doc.ref, { className: className, section: secName });
                            });
                            await batch.commit();
                        }
                    }
                    alert("Section updated successfully!");

                } else {
                    const checkSnap = await db.collection("institute_structure")
                        .where("className", "==", className)
                        .where("sectionName", "==", secName)
                        .get();
                        
                    if (!checkSnap.empty) {
                        btn.innerText = "Save Section"; btn.disabled = false;
                        return alert(`Error: Section '${secName}' already exists in '${className}'.`);
                    }

                    await db.collection("institute_structure").add({
                        className: className,
                        sectionName: secName,
                        subjects: subjects,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                closeModal();
                loadStructure(); 
            } catch (error) {
                console.error("Error saving:", error);
                alert("Failed to save. Check console.");
            } finally {
                btn.innerText = "Save Section"; btn.disabled = false;
            }
        }

        // --- NEW CASCADE DELETE FUNCTION (Timetables + Lesson Planners) ---
        async function deleteStructure(id) {
            if(confirm("🚨 DANGER: Remove this section entirely?\n\nThis will ALSO permanently delete all Timetable schedules AND Lesson Planners associated with this section. Are you absolutely sure?")) {
                
                try {
                    // 1. Find section details so we know what timetables to delete
                    const secDoc = await db.collection("institute_structure").doc(id).get();
                    if(secDoc.exists) {
                        const className = secDoc.data().className;
                        const sectionName = secDoc.data().sectionName;
                        
                        // 2. Cascade Delete all Timetable slots for this class/section
                        const ttSnap = await db.collection("timetable")
                            .where("className", "==", className)
                            .where("section", "==", sectionName).get();
                        
                        if (!ttSnap.empty) {
                            const batch = db.batch();
                            ttSnap.docs.forEach(doc => { batch.delete(doc.ref); });
                            await batch.commit();
                        }

                        // 3. Cascade Delete all Lesson Planners for this class/section
                        const lpSnap = await db.collection("lesson_planners")
                            .where("className", "==", className)
                            .where("section", "==", sectionName).get();
                        
                        if (!lpSnap.empty) {
                            const batch = db.batch();
                            lpSnap.docs.forEach(doc => { batch.delete(doc.ref); });
                            await batch.commit();
                        }
                    }
                    
                    // 4. Delete the actual structure document
                    await db.collection("institute_structure").doc(id).delete();
                    
                    alert("Section, Timetables, and Lesson Planners were successfully deleted.");
                    loadStructure();
                } catch(e) {
                    console.error("Error deleting:", e);
                    alert("Error deleting: " + e.message);
                }
            }
        }

        init();
    </script>
</body>
</html>
