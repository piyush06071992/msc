name: Build Tailwind CSS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build CSS
       run: npx --yes tailwindcss@latest -i ./input.css -o ./style.css --minify

      - name: Commit Generated CSS
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated Tailwind CSS"
          file_pattern: style.css
