name: Build Tailwind CSS
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes tailwindcss@latest -i ./input.css -o ./style.css --minify
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated Tailwind CSS"
          file_pattern: style.css
