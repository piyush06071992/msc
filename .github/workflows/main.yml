name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Functions Dependencies
        run: |
          if [ -d "functions" ]; then
            cd functions && npm install && cd ..
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHOP_PORTAL_BBBBB }}'

      - name: Deploy Hosting and Functions
        run: firebase deploy --only hosting,functions --project shop-portal-bbbbb --force
