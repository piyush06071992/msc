name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Prepare Web Assets and Capacitor
      run: |
        mkdir -p www
        find . -maxdepth 1 -not -name '.' -not -name '..' -not -name '.git' -not -name 'android' -not -name '.github' -not -name 'functions' -not -name 'capacitor.config.json' -not -name 'www' -exec cp -r {} www/ \;

        if [ ! -f package.json ]; then
          npm init -y
        fi
        # Install Capacitor 6 AND the Push Notifications plugin
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize & Sync Capacitor Android
      run: |
        npx cap add android || true
        # Copy Firebase credentials into the Android project before syncing
        cp google-services.json android/app/google-services.json
        npx cap sync android

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: piyush-library-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
