name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Auto-Inject Core Script into All HTML Files
      run: |
        find . -name "*.html" -not -path "./android/*" -not -path "./.github/*" -exec sed -i 's/<\/body>/<script src="minerva-core.js"><\/script><\/body>/g' {} +

    - name: Prepare Web Assets and Capacitor
      run: |
        mkdir -p www
        find . -maxdepth 1 -not -name '.' -not -name '..' -not -name '.git' -not -name 'android' -not -name '.github' -not -name 'functions' -not -name 'capacitor.config.json' -not -name 'www' -exec cp -r {} www/ \;

        if [ ! -f package.json ]; then
          npm init -y
        fi
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'cmdline-tools;latest build-tools;34.0.0 platforms;android-34'

    - name: Initialize & Sync Capacitor Android
      run: |
        npx cap add android || true
        cp google-services.json android/app/google-services.json
        
        # Auto-generate native Android app icons
        mkdir -p assets
        cp logo.png assets/icon.png
        npx @capacitor/assets generate --android
        
        npx cap sync android

    - name: Inject Android Kiosk Mode (Java Hook)
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.REORDER_TASKS" />' android/app/src/main/AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />' android/app/src/main/AndroidManifest.xml

        MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
        PACKAGE_LINE=$(grep "^package " $MAIN_ACTIVITY)
        
        cat <<EOF > $MAIN_ACTIVITY
        $PACKAGE_LINE

        import android.os.Bundle;
        import android.os.Handler;
        import android.view.View;
        import android.view.WindowManager;
        import android.view.Gravity;
        import android.app.ActivityManager;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.graphics.Color;
        import android.graphics.drawable.GradientDrawable;
        import android.widget.FrameLayout;
        import android.widget.LinearLayout;
        import android.widget.TextView;
        import android.widget.EditText;
        import android.widget.Button;
        import android.widget.Toast;
        import android.webkit.JavascriptInterface;
        import com.getcapacitor.BridgeActivity;
        import java.text.SimpleDateFormat;
        import java.util.Date;
        import java.util.Locale;

        public class MainActivity extends BridgeActivity {
            private boolean isArmed = false;
            private boolean isTerminated = false;
            private boolean isConfiguringWifi = false;
            private Handler securityHandler = new Handler();
            private static final String PREFS_NAME = "MinervaSecurityPrefs";

            // Native Overlay Components
            private FrameLayout overlayLayout;
            private TextView overlayTitle;
            private TextView overlayTime;
            private TextView overlayMessage;
            private LinearLayout unlockForm;
            private EditText pinInput;
            private int secretTapCount = 0;

            private Runnable securityRunnable = new Runnable() {
                @Override
                public void run() {
                    if (isTerminated) return;
                    
                    ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                    if (am != null) {
                        int lockState = am.getLockTaskModeState();
                        if (lockState != ActivityManager.LOCK_TASK_MODE_NONE) {
                            isArmed = true;
                        } else if (isArmed && !isConfiguringWifi) {
                            triggerViolation("ERR_03", "Unauthorized system action detected.");
                            return;
                        }
                    }
                    securityHandler.postDelayed(this, 1000);
                }
            };

            @Override
            public void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                applyKioskFlags();

                if (this.bridge != null && this.bridge.getWebView() != null) {
                    this.bridge.getWebView().addJavascriptInterface(new KioskBridge(), "AndroidKiosk");
                }
                
                createViolationOverlay();
                addNativeWifiButton();
                checkPersistentViolation();
            }

            @Override
            public void onResume() {
                super.onResume();
                applyKioskFlags();
                isConfiguringWifi = false;

                if (checkPersistentViolation()) return;

                securityHandler.removeCallbacks(securityRunnable);
                securityHandler.postDelayed(securityRunnable, 1000);

                ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                if (am != null && am.getLockTaskModeState() == ActivityManager.LOCK_TASK_MODE_NONE) {
                    try {
                        startLockTask();
                    } catch (Exception ignored) {}
                }
            }

            @Override
            public void onPause() {
                super.onPause();
                securityHandler.removeCallbacks(securityRunnable);
                if (isArmed && !isTerminated && !isConfiguringWifi) {
                    triggerViolation("ERR_02", "App focus lost.");
                }
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
                super.onWindowFocusChanged(hasFocus);
                if (hasFocus) {
                    isConfiguringWifi = false;
                    applyKioskFlags();
                } else {
                    if (isArmed && !isTerminated && !isConfiguringWifi) {
                        triggerViolation("ERR_01", "Unauthorized system action detected.");
                    }
                }
            }

            private void applyKioskFlags() {
                runOnUiThread(() -> {
                    try {
                        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                        getWindow().getDecorView().setSystemUiVisibility(
                            View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                            | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                            | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                            | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                            | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                            | View.SYSTEM_UI_FLAG_FULLSCREEN
                        );
                    } catch (Exception ignored) {}
                });
            }

            private void createViolationOverlay() {
                runOnUiThread(() -> {
                    FrameLayout rootLayout = findViewById(android.R.id.content);
                    if (rootLayout == null || overlayLayout != null) return;

                    overlayLayout = new FrameLayout(this);
                    overlayLayout.setLayoutParams(new FrameLayout.LayoutParams(
                        FrameLayout.LayoutParams.MATCH_PARENT,
                        FrameLayout.LayoutParams.MATCH_PARENT
                    ));
                    overlayLayout.setBackgroundColor(Color.parseColor("#DC2626"));
                    overlayLayout.setClickable(true);
                    overlayLayout.setFocusable(true);
                    overlayLayout.setVisibility(View.GONE);

                    LinearLayout container = new LinearLayout(this);
                    container.setOrientation(LinearLayout.VERTICAL);
                    container.setGravity(Gravity.CENTER);
                    container.setPadding(40, 40, 40, 40);
                    FrameLayout.LayoutParams cParams = new FrameLayout.LayoutParams(
                        FrameLayout.LayoutParams.MATCH_PARENT,
                        FrameLayout.LayoutParams.WRAP_CONTENT,
                        Gravity.CENTER
                    );
                    container.setLayoutParams(cParams);

                    overlayTitle = new TextView(this);
                    overlayTitle.setText("EXAM TERMINATED");
                    overlayTitle.setTextSize(26f);
                    overlayTitle.setTextColor(Color.WHITE);
                    overlayTitle.setTypeface(null, android.graphics.Typeface.BOLD);
                    overlayTitle.setGravity(Gravity.CENTER);
                    overlayTitle.setPadding(0, 0, 0, 10);
                    overlayTitle.setOnClickListener(v -> {
                        secretTapCount++;
                        if (secretTapCount >= 5) {
                            if (unlockForm != null) unlockForm.setVisibility(View.VISIBLE);
                        }
                    });
                    container.addView(overlayTitle);

                    overlayTime = new TextView(this);
                    overlayTime.setTextSize(14f);
                    overlayTime.setTextColor(Color.parseColor("#FFCCCC"));
                    overlayTime.setGravity(Gravity.CENTER);
                    overlayTime.setPadding(0, 0, 0, 20);
                    container.addView(overlayTime);

                    TextView secBadge = new TextView(this);
                    secBadge.setText("Security Violation");
                    secBadge.setTextSize(16f);
                    secBadge.setTextColor(Color.WHITE);
                    secBadge.setTypeface(null, android.graphics.Typeface.BOLD);
                    secBadge.setGravity(Gravity.CENTER);
                    secBadge.setPadding(0, 0, 0, 10);
                    container.addView(secBadge);

                    overlayMessage = new TextView(this);
                    overlayMessage.setTextSize(14f);
                    overlayMessage.setTextColor(Color.WHITE);
                    overlayMessage.setGravity(Gravity.CENTER);
                    overlayMessage.setPadding(0, 0, 0, 30);
                    container.addView(overlayMessage);

                    TextView notice = new TextView(this);
                    notice.setText("PLEASE CONTACT THE INVIGILATOR");
                    notice.setTextSize(12f);
                    notice.setTextColor(Color.WHITE);
                    notice.setTypeface(null, android.graphics.Typeface.BOLD);
                    notice.setGravity(Gravity.CENTER);
                    notice.setPadding(30, 20, 30, 20);
                    GradientDrawable boxBg = new GradientDrawable();
                    boxBg.setColor(Color.parseColor("#40000000"));
                    boxBg.setCornerRadius(16);
                    notice.setBackground(boxBg);
                    container.addView(notice);

                    unlockForm = new LinearLayout(this);
                    unlockForm.setOrientation(LinearLayout.HORIZONTAL);
                    unlockForm.setGravity(Gravity.CENTER);
                    unlockForm.setPadding(0, 40, 0, 0);
                    unlockForm.setVisibility(View.GONE);

                    pinInput = new EditText(this);
                    pinInput.setHint("Admin PIN");
                    pinInput.setInputType(android.text.InputType.TYPE_CLASS_NUMBER | android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD);
                    pinInput.setBackgroundColor(Color.WHITE);
                    pinInput.setTextColor(Color.BLACK);
                    pinInput.setHintTextColor(Color.GRAY);
                    pinInput.setGravity(Gravity.CENTER);
                    pinInput.setPadding(30, 20, 30, 20);
                    LinearLayout.LayoutParams pinParams = new LinearLayout.LayoutParams(260, LinearLayout.LayoutParams.WRAP_CONTENT);
                    pinParams.setMargins(0, 0, 20, 0);
                    pinInput.setLayoutParams(pinParams);
                    unlockForm.addView(pinInput);

                    Button unlockBtn = new Button(this);
                    unlockBtn.setText("Unlock");
                    unlockBtn.setTextColor(Color.parseColor("#DC2626"));
                    unlockBtn.setBackgroundColor(Color.WHITE);
                    unlockBtn.setTypeface(null, android.graphics.Typeface.BOLD);
                    unlockBtn.setOnClickListener(v -> handleUnlock(pinInput.getText().toString().trim()));
                    unlockForm.addView(unlockBtn);

                    container.addView(unlockForm);
                    overlayLayout.addView(container);
                    rootLayout.addView(overlayLayout);
                });
            }

            private void addNativeWifiButton() {
                runOnUiThread(() -> {
                    FrameLayout rootLayout = findViewById(android.R.id.content);
                    if (rootLayout == null || rootLayout.findViewWithTag("wifi_btn") != null) return;
                    
                    TextView wifiBtn = new TextView(this);
                    wifiBtn.setTag("wifi_btn");
                    wifiBtn.setText("📶 Wi-Fi");
                    wifiBtn.setTextSize(14f);
                    wifiBtn.setTextColor(Color.WHITE);
                    wifiBtn.setPadding(40, 20, 40, 20);
                    
                    GradientDrawable shape = new GradientDrawable();
                    shape.setCornerRadius(50);
                    shape.setColor(Color.parseColor("#B3000000"));
                    wifiBtn.setBackground(shape);
                    
                    FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(
                        FrameLayout.LayoutParams.WRAP_CONTENT,
                        FrameLayout.LayoutParams.WRAP_CONTENT,
                        Gravity.BOTTOM | Gravity.START
                    );
                    params.setMargins(40, 0, 0, 40);
                    wifiBtn.setLayoutParams(params);
                    
                    wifiBtn.setOnClickListener(v -> {
                        isConfiguringWifi = true;
                        try {
                            Intent intent = new Intent(android.provider.Settings.Panel.ACTION_INTERNET_CONNECTIVITY);
                            startActivity(intent);
                        } catch (Exception e) {
                            try {
                                Intent intent = new Intent(android.provider.Settings.ACTION_WIFI_SETTINGS);
                                startActivity(intent);
                            } catch (Exception ex) {
                                isConfiguringWifi = false;
                            }
                        }
                    });
                    
                    rootLayout.addView(wifiBtn);
                });
            }

            private boolean checkPersistentViolation() {
                SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                if (prefs.getBoolean("isTerminated", false)) {
                    isTerminated = true;
                    String reason = prefs.getString("reason", "Unknown Activity");
                    String code = prefs.getString("code", "ERR_UNKNOWN");
                    String time = prefs.getString("timestamp", "Unknown Time");
                    showViolationScreen("EXAM TERMINATED", reason + " (" + code + ")", time);
                    return true;
                }
                return false;
            }

            private void triggerViolation(String code, String reason) {
                if (isTerminated) return;
                isTerminated = true;
                try { stopLockTask(); } catch (Exception ignored) {}
                
                String timestamp = new SimpleDateFormat("MMM dd, yyyy - hh:mm:ss a", Locale.getDefault()).format(new Date());
                
                SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                prefs.edit()
                     .putBoolean("isTerminated", true)
                     .putString("reason", reason)
                     .putString("code", code)
                     .putString("timestamp", timestamp)
                     .commit(); // Synchronous write to disk
                
                showViolationScreen("EXAM TERMINATED", reason + " (" + code + ")", timestamp);
            }

            private void showViolationScreen(String title, String message, String timestamp) {
                runOnUiThread(() -> {
                    FrameLayout rootLayout = findViewById(android.R.id.content);
                    View wifiBtn = rootLayout != null ? rootLayout.findViewWithTag("wifi_btn") : null;
                    if (wifiBtn != null) wifiBtn.setVisibility(View.GONE);

                    if (overlayLayout == null) createViolationOverlay();
                    if (overlayLayout != null) {
                        if (overlayTitle != null) overlayTitle.setText(title);
                        if (overlayTime != null) overlayTime.setText("Time of violation: " + timestamp);
                        if (overlayMessage != null) overlayMessage.setText(message);
                        if (unlockForm != null) unlockForm.setVisibility(View.GONE);
                        if (pinInput != null) pinInput.setText("");
                        secretTapCount = 0;
                        overlayLayout.setVisibility(View.VISIBLE);
                        overlayLayout.bringToFront();
                    }
                });
            }

            private void handleUnlock(String pin) {
                if ("9999".equals(pin)) {
                    // Resume Exam
                    SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                    prefs.edit().clear().commit(); // Synchronously clear disk record

                    isTerminated = false;
                    isArmed = false;
                    secretTapCount = 0;
                    if (pinInput != null) pinInput.setText("");
                    if (unlockForm != null) unlockForm.setVisibility(View.GONE);
                    if (overlayLayout != null) overlayLayout.setVisibility(View.GONE);

                    // Show Wi-Fi button
                    FrameLayout rootLayout = findViewById(android.R.id.content);
                    View wifiBtn = rootLayout != null ? rootLayout.findViewWithTag("wifi_btn") : null;
                    if (wifiBtn != null) wifiBtn.setVisibility(View.VISIBLE);

                    // Re-pin screen immediately
                    ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                    if (am != null && am.getLockTaskModeState() == ActivityManager.LOCK_TASK_MODE_NONE) {
                        try { startLockTask(); } catch (Exception ignored) {}
                    }

                    // Restart security watchdog
                    securityHandler.removeCallbacks(securityRunnable);
                    securityHandler.postDelayed(securityRunnable, 2000);

                    Toast.makeText(this, "Exam Resumed", Toast.LENGTH_SHORT).show();
                } else if ("0000".equals(pin)) {
                    // Completely exit app to home screen
                    SharedPreferences prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE);
                    prefs.edit().clear().commit();

                    try { stopLockTask(); } catch (Exception ignored) {}
                    finishAffinity();
                    System.exit(0);
                } else {
                    Toast.makeText(this, "Incorrect PIN", Toast.LENGTH_SHORT).show();
                    if (pinInput != null) pinInput.setText("");
                }
            }

            public class KioskBridge {
                @JavascriptInterface
                public void enableKiosk() {
                    runOnUiThread(() -> { try { startLockTask(); } catch (Exception ignored) {} });
                }

                @JavascriptInterface
                public void disableKiosk() {
                    runOnUiThread(() -> { try { stopLockTask(); } catch (Exception ignored) {} });
                }
            }
        }
        EOF

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: piyush-library-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
