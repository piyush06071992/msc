name: Preview pull request on Firebase Hosting

# Deploys each pull request to a temporary Firebase Hosting preview channel
# (a separate test URL). The live site is NOT touched. Links expire after 7 days.
on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHOP_PORTAL_BBBBB }}
          projectId: shop-portal-bbbbb
          expires: 7d
