<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Exam Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .input-field { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 2px solid #e2e8f0; outline: none; font-weight: 700; color: #334155; transition: all 0.2s; }
        .input-field:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1); }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-rose-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex flex-col sm:flex-row sm:items-center justify-between shadow-xl sticky top-0 z-[100] gap-4 border-b-4 border-orange-500">
        <div class="flex items-center gap-4 w-full sm:w-auto">
            <button onclick="window.location.href='admin.html'" class="p-3 sm:p-4 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors shadow-sm shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex-1">
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none">Exam Manager</h1>
                <p class="text-xs text-orange-300 font-bold uppercase tracking-widest mt-1">Dynamic Scheduling Engine</p>
            </div>
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
            <button onclick="alert('Delegation panel coming in Part 3!')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-[10px] sm:text-xs transition-colors shadow-md border border-indigo-500 flex items-center gap-2">
                🔐 Delegation
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 mt-4 space-y-6">
        
        <div class="glass-card p-6 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-100 pb-4">
                <span class="text-3xl bg-orange-50 p-3 rounded-2xl border border-orange-100">📝</span>
                <div>
                    <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight">Step 1: Exam Details</h2>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Define the timeline & nomenclature</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Exam Name / Title</label>
                    <input type="text" id="exam-name" class="input-field" placeholder="e.g., Weekly Test, Half-Yearly Exam...">
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Exam Date</label>
                    <input type="date" id="exam-date" class="input-field cursor-pointer">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Prep Time (Start)</label>
                        <input type="time" id="prep-start" class="input-field cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Exam Time (End)</label>
                        <input type="time" id="exam-end" class="input-field cursor-pointer">
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-card p-6 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-100 pb-4">
                <span class="text-3xl bg-blue-50 p-3 rounded-2xl border border-blue-100">🏫</span>
                <div class="flex-1 flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight">Step 2: Target Classes</h2>
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Select classes taking this exam</p>
                    </div>
                </div>
            </div>

            <div id="class-container" class="space-y-4">
                <div class="text-center py-10 text-slate-400 font-bold text-xs uppercase tracking-widest animate-pulse">Loading Classes...</div>
            </div>
        </div>

    </main>

    <script>
        // FIREBASE INIT
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];

        window.onload = async () => {
            // Set today's date as default
            document.getElementById('exam-date').value = new Date().toISOString().split('T')[0];
            await fetchClasses();
        };

        async function fetchClasses() {
            try {
                const snap = await db.collection("institute_structure").get();
                structureData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderClassSelectors();
            } catch (e) {
                document.getElementById('class-container').innerHTML = `<div class="text-rose-500 font-bold text-center py-10 uppercase text-xs">Error loading classes.</div>`;
            }
        }

        function renderClassSelectors() {
            const container = document.getElementById('class-container');
            container.innerHTML = '';

            // Group sections by Class Name
            const grouped = {};
            structureData.forEach(st => {
                if (!grouped[st.className]) grouped[st.className] = [];
                grouped[st.className].push(st);
            });

            // Sort Classes
            const sortedClasses = Object.keys(grouped).sort();

            sortedClasses.forEach(className => {
                // Sort sections within the class
                const sections = grouped[className].sort((a,b) => a.sectionName.localeCompare(b.sectionName));
                const safeClassId = className.replace(/[^a-zA-Z0-9]/g, '_');

                let secHtml = sections.map(sec => `
                    <label class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-orange-50 hover:border-orange-200 transition-colors shadow-sm">
                        <input type="checkbox" class="sec-cb sec-group-${safeClassId} w-5 h-5 accent-orange-500 cursor-pointer" value="${sec.id}" data-class="${className}" data-sec="${sec.sectionName}" onchange="checkMasterCb('${safeClassId}')">
                        <span class="text-sm font-black text-slate-700 uppercase tracking-tight">Sec ${sec.sectionName}</span>
                    </label>
                `).join('');

                container.innerHTML += `
                    <div class="bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <label class="flex justify-between items-center p-4 sm:p-5 bg-slate-100 cursor-pointer hover:bg-slate-200 transition-colors border-b border-slate-200">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" id="master-${safeClassId}" class="w-6 h-6 accent-blue-600 cursor-pointer" onchange="toggleEntireClass(this, '${safeClassId}')">
                                <span class="text-base sm:text-lg font-black text-slate-800 uppercase tracking-widest">Class ${className}</span>
                            </div>
                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">${sections.length} Sections</span>
                        </label>
                        <div class="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                            ${secHtml}
                        </div>
                    </div>
                `;
            });
        }

        // Smart Select Logic: Ticking the Class ticks all its sections
        function toggleEntireClass(masterCb, classId) {
            const sectionCbs = document.querySelectorAll(`.sec-group-${classId}`);
            sectionCbs.forEach(cb => cb.checked = masterCb.checked);
        }

        // Smart Select Logic: If all sections are ticked manually, tick the master class box
        function checkMasterCb(classId) {
            const sectionCbs = document.querySelectorAll(`.sec-group-${classId}`);
            const masterCb = document.getElementById(`master-${classId}`);
            
            const allChecked = Array.from(sectionCbs).every(cb => cb.checked);
            const someChecked = Array.from(sectionCbs).some(cb => cb.checked);
            
            masterCb.checked = allChecked;
            masterCb.indeterminate = !allChecked && someChecked; // Adds a cool dash if partially selected
        }
    </script>
</body>
</html>
