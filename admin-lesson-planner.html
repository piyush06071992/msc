<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Admin Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px); }
        .progress-phi { transition: width 0.8s ease-in-out; }
        .demo-badge { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .q-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .q-thumb:hover { transform: scale(1.1); z-index: 10; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #3b82f6; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans pb-20 text-slate-900">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-[50] shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="showMenuView()" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black uppercase tracking-tighter italic text-blue-700">Minerva Analytics</h1>
        </div>
        <div class="flex items-center gap-3">
            <div id="demo-mode-indicator" class="hidden flex items-center gap-2 bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-[10px] font-black uppercase demo-badge border border-amber-200">
                <span>Sample Data Active</span>
                <button onclick="toggleDemoMode(false)" class="underline ml-2 hover:text-amber-900">Clear</button>
            </div>
            <button onclick="toggleDemoMode(true)" class="text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-blue-600">Load Sample for Management</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-8">
        
        <div id="menu-view" class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-12">
            <button onclick="showSummaryView()" class="glass p-10 rounded-[3rem] border-2 border-transparent shadow-xl hover:shadow-2xl hover:border-emerald-400 transition-all group text-center">
                <div class="w-24 h-24 bg-emerald-50 rounded-full flex items-center justify-center mb-6 mx-auto group-hover:scale-110 transition-transform"><span class="text-5xl">📈</span></div>
                <h3 class="text-3xl font-black text-slate-900 mb-2 uppercase tracking-tight">Summary Dashboard</h3>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Progress, Overrides & Deep Analytics</p>
            </button>
            <button onclick="showEditView()" class="glass p-10 rounded-[3rem] border-2 border-transparent shadow-xl hover:shadow-2xl hover:border-blue-400 transition-all group text-center">
                <div class="w-24 h-24 bg-blue-50 rounded-full flex items-center justify-center mb-6 mx-auto group-hover:scale-110 transition-transform"><span class="text-5xl">⚙️</span></div>
                <h3 class="text-3xl font-black text-slate-900 mb-2 uppercase tracking-tight">Lesson Planner Setup</h3>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Targets & DTP Image Uploads</p>
            </button>
        </div>

        <div id="summary-view" class="hidden space-y-6">
            <div class="bg-white rounded-[2rem] shadow-2xl border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-900 text-white text-[9px] uppercase tracking-widest">
                            <tr>
                                <th class="p-6">Section / Subject</th>
                                <th class="p-6">Chapter Progress</th>
                                <th class="p-6">Syllabus vs Clock</th>
                                <th class="p-6 text-center">Day Gap</th>
                                <th class="p-6 text-center">Min Gap</th>
                                <th class="p-6 text-center">View</th>
                            </tr>
                        </thead>
                        <tbody id="summary-table-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="edit-view" class="hidden space-y-6">
            <div id="setup-engine-container"></div> </div>
    </main>

    <div id="drill-down-modal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-6xl h-[95vh] flex flex-col overflow-hidden shadow-2xl">
            <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                <div>
                    <h2 id="drill-title" class="text-2xl font-black text-slate-900 uppercase tracking-tight">Subject Analytics</h2>
                    <p id="drill-subtitle" class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">Calculated Performance</p>
                </div>
                <div class="flex items-center gap-4">
                    <button id="edit-toggle-btn" onclick="toggleDrillEditMode()" class="flex items-center gap-2 px-4 py-2 bg-slate-200 text-slate-600 rounded-full text-[10px] font-black uppercase tracking-widest border border-slate-300">
                        <span id="lock-icon">🔒</span> <span id="lock-text">View Only</span>
                    </button>
                    <button onclick="closeDrillDown()" class="bg-slate-200 p-2 rounded-full hover:bg-rose-100 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 custom-scroll bg-slate-50">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="p-4 bg-white rounded-2xl border shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Start Date</p>
                        <p id="sub-start-date" class="text-sm font-black text-slate-800">--</p>
                    </div>
                    <div class="p-4 bg-white rounded-2xl border shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Target Date</p>
                        <p id="sub-target-date" class="text-sm font-black text-blue-600">--</p>
                    </div>
                    <div class="p-4 bg-white rounded-2xl border shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Total Gap Days</p>
                        <p id="sub-day-gap" class="text-sm font-black text-rose-600">--</p>
                    </div>
                    <div class="p-4 bg-white rounded-2xl border shadow-sm">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Staff</p>
                        <p id="sub-staff" class="text-sm font-black text-emerald-600">--</p>
                    </div>
                </div>

                <div id="drill-chapter-container" class="space-y-8"></div>
            </div>

            <div id="drill-save-bar" class="hidden p-4 bg-white border-t shadow-lg flex gap-4">
                <button onclick="toggleDrillEditMode()" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-xl font-black uppercase text-[11px] tracking-widest">Discard Changes</button>
                <button onclick="saveAdminOverrides()" class="flex-[2] py-4 bg-amber-500 text-white rounded-xl font-black uppercase text-[11px] tracking-widest shadow-lg hover:bg-amber-600">Save Overrides & Recalculate</button>
            </div>
        </div>
    </div>

    <div id="editor-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[120] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-[95vw] md:max-w-7xl shadow-2xl flex flex-col h-[90vh]">
            <h3 class="text-xl font-black text-slate-900 uppercase mb-4 border-b pb-2 tracking-tight italic">Lesson Planner Setup (DTP Mode)</h3>
            <div class="flex-1 overflow-auto border border-slate-200 rounded-xl custom-scroll mb-4 bg-slate-50 relative">
                <table class="w-full text-left border-collapse text-[10px]">
                    <thead class="bg-slate-900 text-white sticky top-0 shadow-sm" id="live-edit-head"></thead>
                    <tbody class="divide-y divide-slate-200 bg-white" id="live-edit-body"></tbody>
                </table>
            </div>
            <div class="flex gap-4">
                <button onclick="closeEditorModal()" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black uppercase text-[11px] tracking-widest">Cancel</button>
                <button onclick="saveInlineEdits()" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-[11px] tracking-widest shadow-lg">Save Syllabus Data</button>
            </div>
        </div>
    </div>

    <div id="paste-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 max-w-3xl w-full shadow-2xl flex flex-col">
            <h3 class="text-xl font-black text-slate-900 uppercase mb-4 border-b pb-2 tracking-tight italic">Bulk Import Logic</h3>
            <textarea id="paste-area" class="w-full h-64 p-4 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl font-mono text-[10px] outline-none mb-4" placeholder="Paste tab-separated data here..."></textarea>
            <div class="flex gap-3">
                <button onclick="closePasteModal()" class="flex-1 py-4 bg-slate-100 font-black uppercase text-[11px]">Cancel</button>
                <button onclick="processPastedData()" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-[11px]">Analyze & Link</button>
            </div>
        </div>
    </div>

    <input type="file" id="image-uploader" class="hidden" accept="image/*" multiple onchange="handleImageUpload(event)">

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const REQUIRED_HEADERS = ["CHAPTER NAME", "LECTURE NUMBER", "SUBTOPICS", "Target days for chapter", "Standard Class Duration", "Target Minutes For Chapter"];
        let structureData = [], assignments = [], planners = [], staffList = [];
        let isDemoMode = false, isDrillEditMode = false, currentDrillDownId = null, activeUploadRowIndex = null;
        let lastParams = {}; 

        // NAVIGATION LOGIC (Fixing the "Back" Issue)
        function showMenuView() { 
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden')); 
            document.getElementById('menu-view').classList.remove('hidden'); 
        }
        async function showSummaryView() { 
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden')); 
            document.getElementById('summary-view').classList.remove('hidden'); 
            await loadDashboard(); 
            renderSummary(); 
        }
        async function showEditView() { 
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden')); 
            document.getElementById('edit-view').classList.remove('hidden'); 
            await loadDashboard(); 
            renderSetup(); 
        }

        async function loadDashboard() {
            try {
                const [structSnap, assignSnap, plannerSnap, staffSnap] = await Promise.all([
                    db.collection("institute_structure").orderBy("className").get(),
                    db.collection("lesson_planner_assignments").get(),
                    db.collection("lesson_planners").get(),
                    db.collection("staff_applications").where("status", "==", "approved").get()
                ]);
                structureData = structSnap.docs.map(d => d.data());
                assignments = assignSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                planners = plannerSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                staffList = staffSnap.docs.map(doc => {
                    const data = doc.data(); const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                    return { email: data.email, name: nameKey ? data.details[nameKey] : data.email };
                });
            } catch (e) { console.error("Data Load Error:", e); }
        }

        // SUMMARY ENGINE (With Logic Fixes)
        function renderSummary() {
            const tbody = document.getElementById('summary-table-body'); tbody.innerHTML = '';
            const dataToUse = isDemoMode ? [{className:"Class 11", sectionName:"A", subjects:["Physics", "Math", "Chemistry"]}] : structureData;

            dataToUse.forEach(st => {
                st.subjects.filter(s => !['BREAK','EVENT','EXAM','ASSEMBLY'].includes(s.toUpperCase())).forEach((sub, i) => {
                    const id = `${st.className}_${st.sectionName}_${sub}`.replace(/\s+/g, '_');
                    const assign = assignments.find(a => a.id === id) || {};
                    const planner = planners.find(p => p.id === id);

                    let syllabusPct = 0, timePct = 0, doneCh = 0, totalCh = 0, minDone = 0;
                    
                    if (isDemoMode) {
                        syllabusPct = 65; timePct = 72; totalCh = 12; doneCh = 7; minDone = 450;
                    } else if (planner && planner.syllabusData) {
                        const allRows = planner.syllabusData;
                        const doneRows = allRows.filter(r => r.isDone);
                        syllabusPct = Math.round((doneRows.length / allRows.length) * 100);
                        const uniqueChapters = [...new Set(allRows.map(r => r["CHAPTER NAME"]))];
                        totalCh = uniqueChapters.length;
                        uniqueChapters.forEach(ch => { if(allRows.filter(r => r["CHAPTER NAME"] === ch).every(r => r.isDone)) doneCh++; });
                        if(assign.targetDate && assign.createdAt) {
                            const start = assign.createdAt.toDate(); const end = new Date(assign.targetDate);
                            timePct = Math.min(100, Math.max(0, Math.round(((new Date() - start) / (end - start)) * 100)));
                        }
                        minDone = doneRows.reduce((sum, r) => sum + (parseInt(r.completedMinutes)||0), 0);
                    }

                    const gap = syllabusPct - timePct;

                    tbody.innerHTML += `
                        <tr class="hover:bg-blue-50/50 cursor-pointer" onclick="openDrillDown('${st.className}','${st.sectionName}','${sub}', '${id}')">
                            <td class="p-6">
                                <div class="font-black text-slate-900">${i===0 ? st.className + ' | ' + st.sectionName : ''}</div>
                                <div class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">${sub}</div>
                            </td>
                            <td class="p-6">
                                <p class="text-xs font-black text-slate-700">${doneCh} / ${totalCh} Chapters</p>
                                <p class="text-[9px] text-slate-400 font-bold">In-Class Duration: ${minDone}m</p>
                            </td>
                            <td class="p-6 w-64">
                                <div class="flex justify-between text-[9px] font-black uppercase text-blue-600 mb-1"><span>Syllabus</span><span>${syllabusPct}%</span></div>
                                <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden mb-2"><div class="h-full bg-blue-600 progress-phi" style="width:${syllabusPct}%"></div></div>
                                <div class="flex justify-between text-[9px] font-black uppercase text-amber-600 mb-1"><span>Time elapsed</span><span>${timePct}%</span></div>
                                <div class="h-1.5 bg-slate-200 rounded-full overflow-hidden"><div class="h-full bg-amber-500 progress-phi" style="width:${timePct}%"></div></div>
                            </td>
                            <td class="p-6 text-center"><span class="px-3 py-1 rounded-full text-[11px] font-black ${gap >= 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${gap} Days</span></td>
                            <td class="p-6 text-center font-black text-slate-800 text-xs">${gap * 360}m</td>
                            <td class="p-6 text-center">➔</td>
                        </tr>`;
                });
            });
        }

        // DRILL DOWN & CHAPTER LOGIC
        function toggleDrillEditMode() {
            isDrillEditMode = !isDrillEditMode;
            const btn = document.getElementById('edit-toggle-btn');
            const saveBar = document.getElementById('drill-save-bar');
            btn.innerHTML = isDrillEditMode ? `🔓 Admin Editing` : `🔒 View Only`;
            btn.classList.toggle('bg-amber-500', isDrillEditMode);
            btn.classList.toggle('text-white', isDrillEditMode);
            saveBar.classList.toggle('hidden', !isDrillEditMode);
            openDrillDown(lastParams.cls, lastParams.sec, lastParams.sub, currentDrillDownId);
        }

        function openDrillDown(cls, sec, sub, fullId) {
            lastParams = {cls, sec, sub}; currentDrillDownId = fullId;
            document.getElementById('drill-title').innerText = sub;
            document.getElementById('drill-subtitle').innerText = `${cls} | Section ${sec}`;
            
            const container = document.getElementById('drill-chapter-container'); container.innerHTML = '';
            const assign = assignments.find(a => a.id === fullId) || {};
            const planner = planners.find(p => p.id === fullId);

            // Populate Top Metrics
            document.getElementById('sub-start-date').innerText = assign.createdAt ? assign.createdAt.toDate().toLocaleDateString() : 'N/A';
            document.getElementById('sub-target-date').innerText = assign.targetDate || 'Not Set';
            document.getElementById('sub-staff').innerText = staffList.find(s => s.email === assign.assignedTo)?.name || 'Unassigned';

            if (!planner && !isDemoMode) {
                container.innerHTML = `<div class="p-20 text-center text-slate-400 font-bold uppercase text-xs">No data yet. Upload syllabus in "Lesson Planner Setup".</div>`;
            } else {
                const allRows = isDemoMode ? getMockRows() : planner.syllabusData;
                const chapters = [...new Set(allRows.map(r => r["CHAPTER NAME"]))];

                chapters.forEach(ch => {
                    const rows = allRows.filter(r => r["CHAPTER NAME"] === ch);
                    const doneRows = rows.filter(r => r.isDone);
                    const isFinished = doneRows.length === rows.length;
                    
                    // Logic for Chapter Dates
                    const dates = doneRows.map(r => new Date(r.completedDate)).filter(d => !isNaN(d));
                    const startCh = dates.length ? new Date(Math.min(...dates)).toLocaleDateString() : '--';
                    const endCh = dates.length ? new Date(Math.max(...dates)).toLocaleDateString() : '--';

                    let subtopics = rows.map(r => {
                        const absIdx = allRows.indexOf(r);
                        const qImgs = (r.questions || []).map(q => `<img src="${q.url}" class="q-thumb" onclick="window.open('${q.url}')">`).join('');
                        
                        return `
                        <div class="flex items-center justify-between p-4 bg-white border-b last:border-0">
                            <div class="flex gap-4 items-center">
                                <span class="text-[9px] font-black text-slate-300 w-8">Lec ${r['LECTURE NUMBER']}</span>
                                <div>
                                    <div class="text-[11px] font-bold text-slate-800">${r['SUBTOPICS']}</div>
                                    <div class="flex gap-1 mt-2">${qImgs}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                ${isDrillEditMode ? `
                                    <div class="bg-amber-50 p-2 border border-amber-200 rounded-xl flex gap-2 items-center">
                                        <input type="checkbox" class="dd-done w-4 h-4 accent-amber-600" data-idx="${absIdx}" ${r.isDone ? 'checked' : ''}>
                                        <input type="date" class="dd-date text-[10px] p-1 rounded border-amber-300" data-idx="${absIdx}" value="${r.completedDate || ''}">
                                        <input type="number" class="dd-min w-10 text-[10px] p-1 rounded border-amber-300" data-idx="${absIdx}" value="${r.completedMinutes || ''}">
                                    </div>
                                ` : `
                                    <div class="text-right">
                                        <div class="text-[10px] font-black ${r.isDone ? 'text-emerald-500' : 'text-slate-300'}">${r.isDone ? 'COMPLETED' : 'PENDING'}</div>
                                        <div class="text-[9px] text-slate-400 font-bold uppercase">${r.completedDate || '--'} | ${r.completedMinutes || 0}m</div>
                                    </div>
                                `}
                            </div>
                        </div>`;
                    }).join('');

                    container.innerHTML += `
                        <div class="bg-white rounded-[2rem] border shadow-sm overflow-hidden border-slate-200">
                            <div class="p-5 bg-slate-50 border-b flex justify-between items-center">
                                <h4 class="font-black text-slate-800 uppercase text-sm">${ch}</h4>
                                <span class="text-[9px] font-black uppercase ${isFinished ? 'text-emerald-600 bg-emerald-100' : 'text-slate-400 bg-slate-200'} px-3 py-1 rounded-full">${isFinished ? '100% DONE' : 'ONGOING'}</span>
                            </div>
                            <div class="grid grid-cols-3 bg-slate-100 text-[10px] font-bold text-slate-500 text-center divide-x border-b">
                                <div class="p-3">Start: <span class="text-slate-900 ml-1">${startCh}</span></div>
                                <div class="p-3">Ending: <span class="text-slate-900 ml-1">${endCh}</span></div>
                                <div class="p-3 text-rose-500">Excluded: <span>${isDemoMode ? '1 Day (Holiday)' : '0 Days'}</span></div>
                            </div>
                            <div class="divide-y">${subtopics}</div>
                        </div>`;
                });
            }
            document.getElementById('drill-down-modal').classList.replace('hidden', 'flex');
        }

        async function saveAdminOverrides() {
            if(isDemoMode) return alert("Sample data cannot be saved.");
            const planner = planners.find(p => p.id === currentDrillDownId);
            let updated = [...planner.syllabusData];
            document.querySelectorAll('.dd-done').forEach(el => updated[el.dataset.idx].isDone = el.checked);
            document.querySelectorAll('.dd-date').forEach(el => updated[el.dataset.idx].completedDate = el.value);
            document.querySelectorAll('.dd-min').forEach(el => updated[el.dataset.idx].completedMinutes = el.value);
            await db.collection("lesson_planners").doc(currentDrillDownId).update({ syllabusData: updated });
            alert("Overrides Applied!"); toggleDrillEditMode(); await loadDashboard(); renderSummary();
        }

        function closeDrillDown() { document.getElementById('drill-down-modal').classList.replace('flex', 'hidden'); }

        // MOCK DATA FOR MANAGEMENT PRESENTATION
        function getMockRows() {
            return [
                { "CHAPTER NAME": "Introduction to Physics", "LECTURE NUMBER": "1", "SUBTOPICS": "Concept of Motion", "isDone": true, "completedDate": "2026-04-01", "completedMinutes": "50", "questions":[{name:"Q1.png", url:"https://via.placeholder.com/300"}] },
                { "CHAPTER NAME": "Introduction to Physics", "LECTURE NUMBER": "2", "SUBTOPICS": "Vector Calculation", "isDone": true, "completedDate": "2026-04-03", "completedMinutes": "45" },
                { "CHAPTER NAME": "Kinematics", "LECTURE NUMBER": "1", "SUBTOPICS": "Relative Velocity", "isDone": false }
            ];
        }

        function toggleDemoMode(val) { isDemoMode = val; document.getElementById('demo-mode-indicator').classList.toggle('hidden', !val); renderSummary(); }

        // --- SETUP VIEW / DTP ENGINE (Restored) ---
        function renderSetup() {
            const container = document.getElementById('setup-engine-container');
            container.innerHTML = `
                <div class="bg-indigo-50 p-6 rounded-[2rem] border border-indigo-100 shadow-sm mb-8">
                    <h3 class="text-xs font-black text-indigo-700 uppercase tracking-widest mb-4">Bulk Staff Delegation</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <select id="bulk-staff" class="p-3 bg-white border rounded-xl text-xs font-bold outline-none"><option value="">-- Choose Staff --</option></select>
                        <button onclick="openPasteModal()" class="py-3 bg-slate-800 text-white rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-indigo-600 transition-all">Bulk Upload Syllabus (Paste)</button>
                        <p class="text-[9px] text-indigo-400 font-bold leading-tight self-center italic">Link subjects to teachers and paste syllabus data from Excel/Sheets here.</p>
                    </div>
                </div>
                <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border">
                    <table class="w-full text-left">
                        <thead class="bg-slate-900 text-white text-[10px] uppercase tracking-widest">
                            <tr><th class="p-4">Subject & Class</th><th class="p-4">Target Date</th><th class="p-4">Assigned To</th><th class="p-4 text-center">Status</th><th class="p-4 text-center">Actions</th></tr>
                        </thead>
                        <tbody id="planner-setup-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>`;
            
            const drop = document.getElementById('bulk-staff');
            staffList.forEach(s => drop.innerHTML += `<option value="${s.email}">${s.name}</option>`);

            const tbody = document.getElementById('planner-setup-body');
            structureData.forEach(st => {
                st.subjects.filter(s => !['BREAK','EVENT','EXAM','ASSEMBLY'].includes(s.toUpperCase())).forEach((sub, i) => {
                    const id = `${st.className}_${st.sectionName}_${sub}`.replace(/\s+/g, '_');
                    const data = assignments.find(a => a.id === id) || {};
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-4"><div class="font-black text-slate-800 text-sm">${i===0 ? st.className + ' | ' + st.sectionName : ''}</div><div class="text-[10px] text-rose-600 font-bold">${sub}</div></td>
                            <td class="p-4"><input type="date" value="${data.targetDate || ''}" onchange="updateAssignment('${id}','targetDate',this.value)" class="p-2 border rounded-lg text-xs font-bold"></td>
                            <td class="p-4"><span class="text-[11px] font-bold text-slate-500">${data.assignedTo || 'Unassigned'}</span></td>
                            <td class="p-4 text-center">${data.isUploaded ? '✅' : '⏳'}</td>
                            <td class="p-4 flex gap-2 justify-center">
                                ${data.isUploaded ? `<button onclick="openEditorModal('${id}')" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-[9px] font-black uppercase">Edit</button>` : `<button onclick="openPasteModal('${id}')" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest">Paste</button>`}
                            </td>
                        </tr>`;
                });
            });
        }

        async function updateAssignment(id, field, val) { await db.collection("lesson_planner_assignments").doc(id).update({ [field]: val }); }
        function openPasteModal(id) { currentUploadId = id; document.getElementById('paste-area').value = ''; document.getElementById('paste-modal').classList.replace('hidden', 'flex'); }
        function closePasteModal() { document.getElementById('paste-modal').classList.replace('flex', 'hidden'); }

        async function processPastedData() {
            const raw = document.getElementById('paste-area').value.split('\n').filter(l => l.trim().length > 0);
            const headers = raw[0].split('\t').map(h => h.trim());
            let syllabus = [];
            for(let i=1; i<raw.length; i++) {
                let row = { isDone: false, questions: [] }, cols = raw[i].split('\t');
                headers.forEach((h, idx) => row[h] = cols[idx] ? cols[idx].trim() : '');
                syllabus.push(row);
            }
            await db.collection("lesson_planners").doc(currentUploadId).set({ syllabusData: syllabus });
            await db.collection("lesson_planner_assignments").doc(currentUploadId).update({ isUploaded: true });
            alert("Syllabus Uploaded!"); closePasteModal(); await loadDashboard(); renderSetup();
        }

        // --- DTP INLINE EDITOR ENGINE ---
        async function openEditorModal(id) {
            currentUploadId = id; 
            const doc = await db.collection("lesson_planners").doc(id).get(); 
            const data = doc.data().syllabusData || [];
            const headers = Object.keys(data[0] || {}).filter(k => !['questions','isDone','completedDate','completedMinutes'].includes(k));
            
            document.getElementById('live-edit-head').innerHTML = `<tr>${headers.map(h=>`<th class='p-3 border-r tracking-widest uppercase'>${h}</th>`).join('')}<th class='p-3 bg-blue-900'>Questions Engine</th></tr>`;
            document.getElementById('live-edit-body').innerHTML = data.map((r, i) => {
                const qList = (r.questions || []).map(q => `<div class='q-item bg-slate-100 p-1 mb-1 border text-[8px] font-bold flex justify-between'><span>${q.name}</span><button onclick="this.closest('.q-item').remove()">✕</button></div>`).join('');
                return `<tr>${headers.map(h=>`<td contenteditable='true' class='p-2 border' data-col='${h}'>${r[h]}</td>`).join('')}<td class='p-2 bg-blue-50/20'><div id="q-${i}">${qList}</div><button onclick="triggerImageUpload(${i})" class="text-[8px] bg-white border p-1 rounded font-black">+ ADD IMG</button></td></tr>`;
            }).join('');
            document.getElementById('editor-modal').classList.replace('hidden','flex');
        }

        function triggerImageUpload(idx) { activeUploadRowIndex = idx; document.getElementById('image-uploader').click(); }
        async function handleImageUpload(e) {
            const file = e.target.files[0]; if(!file) return;
            const ref = storage.ref(`questions/${currentUploadId}/${Date.now()}_${file.name}`);
            await ref.put(file); const url = await ref.getDownloadURL();
            document.getElementById(`q-${activeUploadRowIndex}`).innerHTML += `<div class='q-item bg-emerald-100 p-1 mb-1 border text-[8px] font-bold flex justify-between' data-url='${url}' data-name='${file.name}'><span>${file.name}</span><button onclick="this.closest('.q-item').remove()">✕</button></div>`;
        }

        async function saveInlineEdits() {
            let updated = [];
            document.querySelectorAll('#live-edit-body tr').forEach(tr => {
                let row = { questions: [] }; tr.querySelectorAll('td[data-col]').forEach(td => row[td.dataset.col] = td.innerText);
                tr.querySelectorAll('.q-item').forEach(el => row.questions.push({name: el.dataset.name, url: el.dataset.url}));
                updated.push(row);
            });
            await db.collection("lesson_planners").doc(currentUploadId).update({ syllabusData: updated });
            alert("Saved!"); document.getElementById('editor-modal').classList.replace('flex','hidden');
        }
        function closeEditorModal() { document.getElementById('editor-modal').classList.replace('flex','hidden'); }

        window.onload = loadDashboard;
    </script>
</body>
</html>
