<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Master Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #1e293b; }
        
        /* Modal Fixes */
        .modal-active { display: flex !important; }
        .modal-hidden { display: none !important; }

        .card-prism { background: #ffffff; border: 1px solid #f1f5f9; box-shadow: 0 4px 20px -5px rgba(0,0,0,0.05); transition: all 0.3s ease; }
        .card-prism:hover { transform: translateY(-4px); border-color: #3b82f6; box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.1); }
        
        .setup-input { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; color: #1e293b; }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        .q-thumb-small { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; }
        .q-thumb-small:hover { transform: scale(1.1); z-index: 10; border-color: #3b82f6; }

        .progress-phi { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="min-h-screen">

    <header class="h-20 bg-white border-b sticky top-0 z-[100] px-8 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-6">
            <button onclick="handleGlobalBack()" class="p-3 border border-slate-200 rounded-2xl hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-black italic tracking-tighter uppercase text-slate-900">Minerva <span class="text-blue-600">Analytics</span></h1>
        </div>

        <div id="summary-controls" class="hidden flex items-center gap-4">
            <div id="demo-mode-indicator" class="hidden bg-amber-50 text-amber-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase border border-amber-100">
                Simulation Engine
                <button onclick="toggleDemoMode(false)" class="underline ml-2">Close</button>
            </div>
            <button onclick="toggleDemoMode(true)" class="text-[10px] font-black text-slate-400 uppercase tracking-widest border border-slate-200 px-5 py-2.5 rounded-full hover:border-blue-500 transition-all">Simulation Data</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 sm:p-10">
        
        <div id="menu-view" class="grid grid-cols-1 md:grid-cols-2 gap-10 mt-12">
            <button onclick="showSummaryView()" class="card-prism p-12 rounded-[3.5rem] group text-center bg-white">
                <div class="w-20 h-20 bg-blue-50 rounded-[2rem] flex items-center justify-center mb-8 mx-auto group-hover:scale-110 transition-transform shadow-inner text-4xl">📉</div>
                <h3 class="text-3xl font-black text-slate-900 uppercase tracking-tight">Summary</h3>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-2">Gaps & Dashboard</p>
            </button>
            <button onclick="showEditView()" class="card-prism p-12 rounded-[4rem] group text-center bg-white border-2">
                <div class="w-20 h-20 bg-indigo-50 rounded-[2.5rem] flex items-center justify-center mb-8 mx-auto group-hover:scale-110 transition-transform shadow-inner text-4xl">⚙️</div>
                <h3 class="text-3xl font-black text-slate-900 uppercase tracking-tight">Setup</h3>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-2">Staff & Syllabus</p>
            </button>
        </div>

        <div id="summary-view" class="hidden space-y-10">
            <div class="border-2 border-slate-50 rounded-[3rem] overflow-hidden bg-white shadow-xl">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 text-slate-400 text-[10px] uppercase tracking-widest border-b">
                        <tr>
                            <th class="p-8">Subject</th>
                            <th class="p-8">Status</th>
                            <th class="p-8">Timeline Variance</th>
                            <th class="p-8 text-center">Day Gap</th>
                            <th class="p-8 text-center">Open</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>

        <div id="edit-view" class="hidden space-y-10">
            <div class="bg-slate-900 rounded-[3rem] p-10 shadow-2xl text-white">
                <h3 class="text-sm font-black uppercase tracking-widest mb-10 border-b border-white/10 pb-6">Bulk Staff Linker</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase text-slate-500">A. Dept</label>
                        <select id="bulk-dept-select" onchange="filterStaffByDept()" class="w-full p-4 bg-slate-800 border-none rounded-2xl text-xs font-black focus:ring-2 focus:ring-blue-500 outline-none"></select>
                    </div>
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase text-slate-500">B. Teacher</label>
                        <select id="bulk-staff-select" class="w-full p-4 bg-slate-800 border-none rounded-2xl text-xs font-black focus:ring-2 focus:ring-blue-500 outline-none"></select>
                    </div>
                    <div class="md:col-span-2 space-y-3">
                        <label class="text-[10px] font-black uppercase text-slate-500">C. Select Subjects & Batches</label>
                        <div class="grid grid-cols-2 gap-4">
                            <div id="bulk-subject-list" class="bg-slate-800/50 p-4 rounded-2xl h-44 overflow-y-auto space-y-2 border border-slate-700 custom-scroll"></div>
                            <div id="bulk-section-list" class="bg-slate-800/50 p-4 rounded-2xl h-44 overflow-y-auto space-y-2 border border-slate-700 custom-scroll"></div>
                        </div>
                    </div>
                </div>
                <div class="mt-8 flex justify-end">
                    <button onclick="applyBulkDelegation()" class="px-10 py-5 bg-blue-600 text-white rounded-3xl font-black uppercase tracking-widest text-[10px] shadow-xl hover:bg-blue-500 transition-all">Link Now</button>
                </div>
            </div>

            <div class="border rounded-[3rem] overflow-hidden bg-white shadow-sm">
                <table class="w-full text-left">
                    <thead class="bg-white text-slate-400 text-[9px] uppercase border-b">
                        <tr>
                            <th class="p-8">Identifier</th>
                            <th class="p-8">Target Date</th>
                            <th class="p-8">Staff</th>
                            <th class="p-8 text-center">Data</th>
                            <th class="p-8 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="setup-table-body" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="drill-down-modal" class="fixed inset-0 bg-white z-[200] hidden flex-col overflow-hidden">
        <div class="h-20 border-b flex justify-between items-center px-8 bg-white">
            <div class="flex items-center gap-6">
                <button onclick="closeDrillDown()" class="p-2 border rounded-xl hover:bg-slate-100 transition-all"><svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M15 19l-7-7 7-7"/></svg></button>
                <h2 id="drill-title" class="text-xl font-black uppercase text-slate-900 tracking-tighter"></h2>
            </div>
            <button id="edit-toggle-btn" onclick="toggleDrillEditMode()" class="px-6 py-2.5 bg-slate-100 text-slate-900 rounded-full text-[10px] font-black uppercase tracking-widest border border-slate-200">🔒 View Mode</button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-10 custom-scroll bg-slate-50">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                <div class="p-6 bg-white rounded-3xl border border-slate-100"><p class="text-[9px] font-black text-slate-400 uppercase">Staff</p><p id="stat-staff" class="text-xs font-bold text-slate-800">--</p></div>
                <div class="p-6 bg-white rounded-3xl border border-slate-100"><p class="text-[9px] font-black text-slate-400 uppercase">Target Date</p><p id="stat-target" class="text-xs font-bold text-blue-600">--</p></div>
                <div class="p-6 bg-white rounded-3xl border border-slate-100"><p class="text-[9px] font-black text-slate-400 uppercase">Done</p><p id="stat-prog" class="text-xs font-bold text-emerald-600">--</p></div>
                <div class="p-6 bg-white rounded-3xl border border-slate-100"><p class="text-[9px] font-black text-slate-400 uppercase">Variance</p><p id="stat-gap" class="text-xs font-bold text-rose-600">--</p></div>
            </div>
            <div id="drill-chapter-container" class="space-y-10"></div>
        </div>

        <div id="drill-save-bar" class="hidden p-8 bg-white border-t flex gap-6">
            <button onclick="toggleDrillEditMode()" class="flex-1 py-5 border-2 rounded-2xl font-black uppercase text-[10px]">Cancel Changes</button>
            <button onclick="saveAdminOverrides()" class="flex-[2] py-5 bg-blue-600 text-white rounded-2xl font-black uppercase text-[10px] shadow-lg">Save Overrides</button>
        </div>
    </div>

    <div id="preview-modal" class="fixed inset-0 bg-slate-900/95 backdrop-blur-xl z-[300] hidden items-center justify-center p-6">
        <div class="bg-white rounded-[3.5rem] p-10 max-w-6xl w-full shadow-2xl flex flex-col max-h-[92vh]">
            <h3 class="text-xl font-black uppercase italic mb-6">Syllabus Logic Check</h3>
            
            <div id="preview-stats-bar" class="grid grid-cols-3 gap-6 mb-8 shrink-0"></div>
            
            <div class="flex-1 overflow-auto border-2 border-slate-100 rounded-[2rem] mb-8 custom-scroll bg-white">
                <table class="w-full text-left text-[10px] border-collapse">
                    <thead class="bg-slate-900 text-white sticky top-0 z-10">
                        <tr>
                            <th class="p-4 uppercase">Chapter</th>
                            <th class="p-4 uppercase w-10">Lec</th>
                            <th class="p-4 uppercase">Subtopic</th>
                            <th class="p-4 uppercase text-center">Days</th>
                            <th class="p-4 uppercase text-center">Mins</th>
                        </tr>
                    </thead>
                    <tbody id="preview-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
            
            <div class="flex gap-6 shrink-0">
                <button onclick="closePreviewModal()" class="flex-1 py-6 border-2 rounded-3xl font-black uppercase text-[10px]">Cancel & Edit</button>
                <button onclick="confirmUploadToDatabase()" class="flex-[2] py-6 bg-emerald-600 text-white rounded-3xl font-black uppercase text-[10px] shadow-2xl">Confirm & Save</button>
            </div>
        </div>
    </div>

    <div id="editor-modal" class="fixed inset-0 bg-white z-[250] hidden flex-col">
        <div class="h-20 border-b flex justify-between items-center px-10">
            <h3 class="text-xl font-black uppercase italic">DTP Media Engine</h3>
            <button onclick="closeEditorModal()" class="p-3 border rounded-xl hover:bg-slate-50 transition-all"><svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>
        <div class="flex-1 overflow-auto p-10 bg-slate-50 custom-scroll">
            <div class="bg-white border rounded-[2.5rem] overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-900 text-white text-[10px] uppercase tracking-widest" id="live-edit-head"></thead>
                    <tbody class="divide-y divide-slate-200" id="live-edit-body"></tbody>
                </table>
            </div>
        </div>
        <div class="p-8 border-t bg-white flex gap-4">
            <button onclick="closeEditorModal()" class="flex-1 py-5 border-2 rounded-2xl font-black uppercase text-[10px]">Discard</button>
            <button onclick="saveInlineEdits()" class="flex-[2] py-5 bg-blue-600 text-white rounded-2xl font-black uppercase text-[10px] shadow-lg">Save Media Sync</button>
        </div>
    </div>

    <div id="paste-modal" class="fixed inset-0 bg-slate-900/60 z-[220] hidden items-center justify-center p-6">
        <div class="bg-white rounded-[3rem] p-10 max-w-2xl w-full shadow-2xl">
            <h3 class="text-2xl font-black uppercase italic mb-6">Input Syllabus</h3>
            <textarea id="paste-area" class="w-full h-80 p-6 bg-slate-50 border-2 border-dashed border-slate-200 rounded-[2rem] font-mono text-[11px] outline-none focus:border-blue-500 mb-8" placeholder="Paste data here..."></textarea>
            <div class="flex gap-4">
                <button onclick="closePasteModal()" class="flex-1 py-5 border rounded-2xl font-black uppercase text-[10px]">Cancel</button>
                <button onclick="processPastedData()" class="flex-[2] py-5 bg-slate-900 text-white rounded-2xl font-black uppercase text-[10px] shadow-xl hover:bg-blue-600">Run Structural Check</button>
            </div>
        </div>
    </div>

    <input type="file" id="image-uploader" class="hidden" accept="image/*" multiple onchange="handleImageUpload(event)">

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const REQUIRED_HEADERS = ["CHAPTER NAME", "LECTURE NUMBER", "SUBTOPICS", "Target days for chapter", "Standard Class Duration", "Target Minutes For Chapter"];
        let structureData = [], assignments = [], planners = [], staffList = [];
        let isDemoMode = false, isDrillEditMode = false, currentUploadId = "", pendingSyllabusRows = [];
        let lastDrillParams = {}, activeUploadRowIndex = null;

        // --- GLOBAL NAVIGATION FIXES ---
        function handleGlobalBack() {
            if (!document.getElementById('menu-view').classList.contains('hidden')) window.location.href = 'admin.html';
            else showMenuView();
        }

        function showMenuView() {
            document.querySelectorAll('main > div, #summary-controls').forEach(d => d.classList.add('hidden'));
            document.getElementById('menu-view').classList.remove('hidden');
        }

        async function showSummaryView() {
            document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
            document.getElementById('summary-view').classList.remove('hidden');
            document.getElementById('summary-controls').classList.remove('hidden');
            await loadAllData(); renderSummary();
        }

        async function showEditView() {
            document.querySelectorAll('main > div, #summary-controls').forEach(d => d.classList.add('hidden'));
            document.getElementById('edit-view').classList.remove('hidden');
            await loadAllData(); renderSetup();
        }

        // --- DATABASE ENGINE ---
        async function loadAllData() {
            const [structSnap, assignSnap, plannerSnap, staffSnap] = await Promise.all([
                db.collection("institute_structure").get(),
                db.collection("lesson_planner_assignments").get(),
                db.collection("lesson_planners").get(),
                db.collection("staff_applications").where("status", "==", "approved").get()
            ]);
            structureData = structSnap.docs.map(d => d.data());
            assignments = assignSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            planners = plannerSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            // AGGRESSIVE NAME/DEPT EXTRACTION
            staffList = staffSnap.docs.map(doc => {
                const det = doc.data().details || {};
                const nK = Object.keys(det).find(k => k.toLowerCase().includes('name'));
                const dK = Object.keys(det).find(k => k.toLowerCase().includes('depart') || k.toLowerCase().includes('subject'));
                return { email: doc.data().email, name: det[nK] || doc.data().email, dept: det[dK] || "General" };
            });
        }

        // --- STAFF FILTERING FIX ---
        function filterStaffByDept() {
            const selDept = document.getElementById('bulk-dept-select').value;
            const drop = document.getElementById('bulk-staff-select');
            drop.innerHTML = '<option value="">-- Choose Staff --</option>';
            staffList.forEach(s => {
                if (selDept === "ALL" || s.dept === selDept) {
                    drop.innerHTML += `<option value="${s.email}">${s.name}</option>`;
                }
            });
        }

        function renderSetup() {
            const depts = [...new Set(staffList.map(s => s.dept))];
            const deptDrop = document.getElementById('bulk-dept-select');
            deptDrop.innerHTML = '<option value="ALL">All Departments</option>' + depts.map(d => `<option value="${d}">${d}</option>`).join('');
            filterStaffByDept();

            let subsSet = new Set(), secsHTML = "";
            structureData.forEach(st => {
                st.subjects.filter(s => !['BREAK','EVENT','EXAM','ASSEMBLY'].includes(s.toUpperCase())).forEach(s => subsSet.add(s));
                secsHTML += `<label class="flex items-center gap-4 p-4 bg-slate-700/50 rounded-2xl cursor-pointer hover:bg-slate-600 transition-all"><input type="checkbox" value="${st.className}|${st.sectionName}" class="bulk-sec-cb accent-blue-500"> <span class="text-[10px] font-black uppercase text-white">${st.className} - ${st.sectionName}</span></label>`;
            });
            document.getElementById('bulk-subject-list').innerHTML = Array.from(subsSet).map(s => `<label class="flex items-center gap-4 p-4 bg-slate-700/50 rounded-2xl cursor-pointer hover:bg-slate-600 transition-all"><input type="checkbox" value="${s}" class="bulk-sub-cb accent-blue-500"> <span class="text-[10px] font-black uppercase text-white">${s}</span></label>`).join('');
            document.getElementById('bulk-section-list').innerHTML = secsHTML;

            const tbody = document.getElementById('setup-table-body'); tbody.innerHTML = '';
            structureData.forEach(st => {
                st.subjects.filter(s => !['BREAK','EVENT','EXAM','ASSEMBLY'].includes(s.toUpperCase())).forEach((sub, i) => {
                    const id = `${st.className}_${st.sectionName}_${sub}`.replace(/\s+/g, '_');
                    const data = assignments.find(a => a.id === id) || {};
                    const tName = staffList.find(x => x.email === data.assignedTo)?.name || '---';
                    const activeDate = data.targetDate && data.targetDate !== "";

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-8"><div class="font-black text-slate-800 text-lg">${i===0 ? st.className + ' | ' + st.sectionName : ''}</div><div class="text-[9px] text-blue-600 font-bold uppercase tracking-widest">${sub}</div></td>
                            <td class="p-8"><input type="date" value="${data.targetDate || ''}" onchange="updateAssignmentSingle('${id}','targetDate',this.value)" class="setup-input shadow-sm"></td>
                            <td class="p-8 text-sm font-bold text-slate-500 uppercase">${tName}</td>
                            <td class="p-8 text-center">${data.isUploaded ? '<span class="text-emerald-500 font-black text-[10px]">SYNCED</span>' : '<span class="text-amber-500 font-black text-[10px]">MISSING</span>'}</td>
                            <td class="p-8 flex gap-3 justify-center">
                                ${data.isUploaded ? `
                                    <button onclick="openEditorModal('${id}')" class="px-6 py-3 bg-blue-600 text-white rounded-2xl text-[9px] font-black uppercase tracking-widest shadow-lg">Edit</button>
                                    <button onclick="wipeData('${id}')" class="px-6 py-3 bg-rose-50 text-rose-600 rounded-2xl text-[9px] font-black uppercase border border-rose-100">Wipe</button>
                                ` : `
                                    <button onclick="${activeDate ? `openPasteModal('${id}')` : `alert('Set Completion Date first')`}" 
                                            class="${activeDate ? 'bg-slate-900' : 'bg-slate-100 cursor-not-allowed text-slate-300'} text-white px-10 py-3 rounded-2xl text-[9px] font-black uppercase transition-all">Paste Data</button>
                                `}
                            </td>
                        </tr>`;
                });
            });
        }

        // --- MODAL UTILS (STRICT FIX) ---
        function closeDrillDown() { document.getElementById('drill-down-modal').classList.add('hidden'); }
        function closeEditorModal() { document.getElementById('editor-modal').classList.add('hidden'); }
        function closePasteModal() { document.getElementById('paste-modal').classList.add('hidden'); }
        function closePreviewModal() { document.getElementById('preview-modal').classList.add('hidden'); }
        function openPasteModal(id) { currentUploadId = id; document.getElementById('paste-area').value = ''; document.getElementById('paste-modal').classList.remove('hidden'); }

        // --- CALC ENGINE ---
        function getChapterWiseStats(rows) {
            const chMap = new Map();
            rows.forEach(r => {
                if(!chMap.has(r['CHAPTER NAME'])) {
                    chMap.set(r['CHAPTER NAME'], { days: parseInt(r['Target days for chapter']) || 0, mins: parseInt(r['Target Minutes For Chapter']) || 0 });
                }
            });
            let td = 0, tm = 0;
            chMap.forEach(v => { td += v.days; tm += v.mins; });
            return { totalChapters: chMap.size, totalDays: td, totalMins: tm };
        }

        function processPastedData() {
            const raw = document.getElementById('paste-area').value.trim(); if(!raw) return;
            const lines = raw.split('\n').filter(l => l.trim().length > 0);
            const headers = lines[0].split('\t').map(h => h.trim());
            const missing = REQUIRED_HEADERS.filter(h => !headers.includes(h));
            if(missing.length) return alert("Headers missing: " + missing.join(', '));

            pendingSyllabusRows = [];
            for(let i=1; i<lines.length; i++) {
                let row = { isDone: false, completedDate: "", completedMinutes: "", questions: [], tickedBy: "" }, cols = lines[i].split('\t');
                headers.forEach((h, idx) => row[h] = cols[idx] ? cols[idx].trim() : '');
                pendingSyllabusRows.push(row);
            }

            const stats = getChapterWiseStats(pendingSyllabusRows);
            document.getElementById('preview-stats-bar').innerHTML = `
                <div class="bg-blue-50 p-6 rounded-3xl border border-blue-100 text-center"><p class="text-[9px] font-black text-blue-400 uppercase">Total Chapters</p><p class="text-xl font-black text-blue-800">${stats.totalChapters}</p></div>
                <div class="bg-indigo-50 p-6 rounded-3xl border border-indigo-100 text-center"><p class="text-[9px] font-black text-indigo-400 uppercase">Target Days</p><p class="text-xl font-black text-indigo-800">${stats.totalDays} Days</p></div>
                <div class="bg-emerald-50 p-6 rounded-3xl border border-emerald-100 text-center"><p class="text-[9px] font-black text-emerald-400 uppercase">Target Mins</p><p class="text-xl font-black text-emerald-800">${stats.totalMins}m</p></div>
            `;
            
            document.getElementById('preview-head').innerHTML = `
                <th class="p-4 uppercase w-1/4">Chapter</th>
                <th class="p-4 uppercase w-12 text-center">Lec</th>
                <th class="p-4 uppercase">Subtopic</th>
                <th class="p-4 uppercase text-center">Days</th>
                <th class="p-4 uppercase text-center">Mins</th>
            `;
            document.getElementById('preview-body').innerHTML = pendingSyllabusRows.slice(0, 50).map(r => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-bold text-slate-800">${r['CHAPTER NAME']}</td>
                    <td class="p-4 text-center font-bold text-slate-400">${r['LECTURE NUMBER']}</td>
                    <td class="p-4 text-slate-600">${r['SUBTOPICS']}</td>
                    <td class="p-4 text-center text-slate-900 font-black">${r['Target days for chapter']}</td>
                    <td class="p-4 text-center text-slate-900 font-black">${r['Target Minutes For Chapter']}</td>
                </tr>`).join('');

            closePasteModal(); document.getElementById('preview-modal').classList.remove('hidden');
        }

        async function confirmUploadToDatabase() {
            await db.collection("lesson_planners").doc(currentUploadId).set({ syllabusData: pendingSyllabusRows });
            await db.collection("lesson_planner_assignments").doc(currentUploadId).update({ isUploaded: true });
            closePreviewModal(); alert("Database Link Complete!"); await showEditView();
        }

        function renderSummary() {
            const tbody = document.getElementById('summary-table-body'); tbody.innerHTML = '';
            const list = isDemoMode ? [{className:"Sample", sectionName:"Mock-1", subjects:["Mathematics", "Physics"]}] : structureData;

            list.forEach(st => {
                st.subjects.filter(s => !['BREAK','EVENT','EXAM','ASSEMBLY'].includes(s.toUpperCase())).forEach((sub, i) => {
                    const id = `${st.className}_${st.sectionName}_${sub}`.replace(/\s+/g, '_');
                    const assign = assignments.find(a => a.id === id) || {};
                    const planner = planners.find(p => p.id === id);

                    let sPct = 0, tPct = 0, chDone = 0, chTotal = 0, dayGap = 0;
                    if(isDemoMode) { sPct = 70; tPct = 65; chTotal = 12; chDone = 8; dayGap = -2; }
                    else if(planner && planner.syllabusData) {
                        const rows = planner.syllabusData;
                        sPct = Math.round((rows.filter(r => r.isDone).length / rows.length) * 100);
                        const names = [...new Set(rows.map(r => r['CHAPTER NAME']))]; chTotal = names.length;
                        names.forEach(n => { if(rows.filter(r => r['CHAPTER NAME'] === n).every(r => r.isDone)) chDone++; });
                        if(assign.targetDate && assign.createdAt) {
                            const start = assign.createdAt.toDate(); const end = new Date(assign.targetDate);
                            tPct = Math.min(100, Math.round(((new Date() - start) / (end - start)) * 100));
                            dayGap = Math.round((sPct - tPct) / 2);
                        }
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 cursor-pointer" onclick="openDrillDown('${st.className}','${st.sectionName}','${sub}', '${id}')">
                            <td class="p-8"><div class="font-black text-slate-900 text-lg">${i===0 ? st.className + ' | ' + st.sectionName : ''}</div><div class="text-[9px] font-bold text-blue-600 uppercase tracking-widest mt-1">${sub}</div></td>
                            <td class="p-8 font-black text-slate-900 text-sm">${chDone} / ${chTotal} <span class="text-[9px] text-slate-400 block uppercase">Chapters</span></td>
                            <td class="p-8 w-80">
                                <div class="flex justify-between text-[10px] font-black uppercase text-blue-600 mb-2"><span>SYLLABUS</span><span>${sPct}%</span></div>
                                <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden mb-4"><div class="h-full bg-blue-600 progress-phi" style="width:${sPct}%"></div></div>
                                <div class="flex justify-between text-[10px] font-black uppercase text-slate-300 mb-2"><span>CLOCK</span><span>${tPct}%</span></div>
                                <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-slate-300 progress-phi" style="width:${tPct}%"></div></div>
                            </td>
                            <td class="p-8 text-center"><span class="px-6 py-2.5 rounded-full text-[11px] font-black ${dayGap >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'} border">${dayGap > 0 ? '+' : ''}${dayGap} Days</span></td>
                            <td class="p-8 text-center text-slate-200 text-2xl">➔</td>
                        </tr>`;
                });
            });
        }

        function openDrillDown(cls, sec, sub, fullId) {
            lastDrillParams = {cls, sec, sub}; currentUploadId = fullId;
            document.getElementById('drill-title').innerText = sub;
            document.getElementById('drill-subtitle').innerText = `${cls} | ${sec}`;
            
            const container = document.getElementById('drill-chapter-container'); container.innerHTML = '';
            const assign = assignments.find(a => a.id === fullId) || {};
            const planner = planners.find(p => p.id === fullId);

            const staffObj = staffList.find(s => s.email === assign.assignedTo);
            document.getElementById('stat-staff').innerText = staffObj ? staffObj.name : 'Unassigned';
            document.getElementById('stat-target').innerText = assign.targetDate || 'Not Set';

            if (!planner && !isDemoMode) {
                container.innerHTML = `<div class="p-32 text-center text-slate-300 font-black uppercase text-xs tracking-[0.6em]">No Data Defined</div>`;
            } else {
                const allRows = isDemoMode ? getMockRows() : planner.syllabusData;
                const chNames = [...new Set(allRows.map(r => r["CHAPTER NAME"]))];
                
                chNames.forEach(ch => {
                    const rows = allRows.filter(r => r["CHAPTER NAME"] === ch);
                    const doneR = rows.filter(r => r.isDone);
                    const compDates = doneR.map(r => new Date(r.completedDate)).filter(d => !isNaN(d));
                    const chStart = compDates.length ? new Date(Math.min(...compDates)).toLocaleDateString() : '--';
                    const chEnd = compDates.length ? new Date(Math.max(...compDates)).toLocaleDateString() : '--';

                    let tops = rows.map((r) => {
                        const absI = allRows.indexOf(r);
                        const qImgs = (r.questions || []).map(q => `<img src="${q.url}" class="q-thumb-small" onclick="window.open('${q.url}')">`).join('');
                        const exe = staffList.find(s => s.email === r.tickedBy)?.name || '---';
                        return `
                        <div class="flex items-center justify-between p-8 bg-white border-b last:border-0 hover:bg-slate-50 transition-colors group">
                            <div class="flex gap-10 items-center">
                                <span class="text-[10px] font-black text-slate-200 w-12 group-hover:text-blue-200 transition-colors uppercase">Lec ${r['LECTURE NUMBER']}</span>
                                <div>
                                    <div class="text-sm font-black text-slate-800 uppercase flex items-center gap-4">${r['SUBTOPICS']} <span class="text-[8px] bg-slate-100 text-slate-500 px-3 py-1 rounded-full border border-slate-200">${exe}</span></div>
                                    <div class="flex gap-3 mt-5">${qImgs}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-6">
                                ${isDrillEditMode ? `
                                    <div class="bg-blue-50 p-5 border border-blue-100 rounded-[2rem] flex gap-5 items-center">
                                        <input type="checkbox" class="dd-done w-6 h-6 accent-blue-600" data-idx="${absI}" ${r.isDone ? 'checked' : ''}>
                                        <input type="date" class="setup-input text-[11px] p-2" data-idx="${absI}" value="${r.completedDate || ''}">
                                        <input type="number" class="setup-input w-20 text-[11px] p-2 text-center" data-idx="${absI}" value="${r.completedMinutes || ''}">
                                    </div>
                                ` : `
                                    <div class="text-right">
                                        <div class="text-[10px] font-black ${r.isDone ? 'text-emerald-500' : 'text-slate-200'} tracking-widest uppercase">${r.isDone ? 'LOGGED' : 'AWAITING'}</div>
                                        <div class="text-[10px] text-slate-400 font-bold mt-1 uppercase">${r.completedDate || '--'} | ${r.completedMinutes || 0}m</div>
                                    </div>
                                `}
                            </div>
                        </div>`;
                    }).join('');

                    container.innerHTML += `
                        <div class="bg-white rounded-[3.5rem] border border-slate-100 shadow-xl overflow-hidden">
                            <div class="p-10 bg-white border-b flex justify-between items-center">
                                <h4 class="font-black text-slate-900 uppercase text-base tracking-tight">${ch}</h4>
                                <span class="text-[10px] font-black px-8 py-3 rounded-full ${doneR.length === rows.length ? 'bg-emerald-500 text-white shadow-xl shadow-emerald-100' : 'bg-slate-100 text-slate-400'}">${doneR.length === rows.length ? '100% DONE' : 'ONGOING'}</span>
                            </div>
                            <div class="grid grid-cols-3 bg-slate-50 text-[10px] font-black text-slate-400 text-center border-b uppercase tracking-tighter">
                                <div class="p-5 border-r border-slate-100">Started: <span class="text-slate-900 ml-1">${chStart}</span></div>
                                <div class="p-5 border-r border-slate-100">Finish: <span class="text-slate-900 ml-1">${chEnd}</span></div>
                                <div class="p-5 text-rose-500">Excluded: <span class="font-bold">${isDemoMode ? '14/04 (Baisakhi)' : 'None'}</span></div>
                            </div>
                            <div class="divide-y divide-slate-50">${tops}</div>
                        </div>`;
                });
            }
            document.getElementById('drill-down-modal').classList.remove('hidden');
        }

        async function saveAdminOverrides() {
            const planner = planners.find(p => p.id === currentUploadId); if(!planner) return;
            let upd = [...planner.syllabusData];
            document.querySelectorAll('.dd-done').forEach(el => upd[el.dataset.idx].isDone = el.checked);
            document.querySelectorAll('.dd-date').forEach(el => upd[el.dataset.idx].completedDate = el.value);
            document.querySelectorAll('.dd-min').forEach(el => upd[el.dataset.idx].completedMinutes = el.value);
            await db.collection("lesson_planners").doc(currentUploadId).update({ syllabusData: upd });
            alert("Database Updated Successfully!"); toggleDrillEditMode(); await loadAllData(); renderSummary();
        }

        async function openEditorModal(id) {
            currentUploadId = id; const doc = await db.collection("lesson_planners").doc(id).get(); 
            const data = doc.data().syllabusData || [];
            const headers = Object.keys(data[0] || {}).filter(k => !['questions','isDone','completedDate','completedMinutes','tickedBy'].includes(k));
            
            document.getElementById('live-edit-head').innerHTML = `<tr>${headers.map(h=>`<th class='p-8 border-r border-white/10'>${h}</th>`).join('')}<th class='p-8'>Question Linker</th></tr>`;
            document.getElementById('live-edit-body').innerHTML = data.map((r, i) => {
                const qL = (r.questions || []).map(q => `<div class='bg-slate-50 p-3 mb-2 rounded-xl text-[10px] font-black flex justify-between items-center'><span class="truncate w-32 text-blue-600 underline cursor-pointer" onclick="window.open('${q.url}')">${q.name}</span><button onclick="this.parentNode.remove()" class="text-rose-500 font-black px-2">✕</button></div>`).join('');
                return `<tr class="hover:bg-slate-50/50"><td contenteditable='true' class='p-8 border-b outline-none text-slate-600' data-col='${headers[0]}'>${r[headers[0]]}</td><td contenteditable='true' class='p-8 border-b outline-none text-slate-600' data-col='${headers[1]}'>${r[headers[1]]}</td><td contenteditable='true' class='p-8 border-b outline-none text-slate-600' data-col='${headers[2]}'>${r[headers[2]]}</td><td contenteditable='true' class='p-8 border-b outline-none text-slate-600' data-col='${headers[3]}'>${r[headers[3]]}</td><td contenteditable='true' class='p-8 border-b outline-none text-slate-600' data-col='${headers[4]}'>${r[headers[4]]}</td><td contenteditable='true' class='p-8 border-b outline-none text-slate-600' data-col='${headers[5]}'>${r[headers[5]]}</td><td class='p-8 bg-slate-50/50 border-b'><div id="q-box-${i}">${qL}</div><button onclick="triggerImageUpload(${i})" class="w-full text-[9px] bg-white border border-slate-200 py-4 rounded-[1.5rem] font-black text-slate-400 hover:text-blue-600 transition-all">+ Add classroom image</button></td></tr>`;
            }).join('');
            document.getElementById('editor-modal').classList.remove('hidden');
        }

        function triggerImageUpload(idx) { activeUploadRowIndex = idx; document.getElementById('image-uploader').click(); }
        async function handleImageUpload(e) {
            const files = e.target.files; if(!files.length) return;
            const ref = storage.ref(`questions/${currentUploadId}/${Date.now()}_${files[0].name}`);
            await ref.put(files[0]); const url = await ref.getDownloadURL();
            document.getElementById(`q-box-${activeUploadRowIndex}`).innerHTML += `<div class='bg-blue-50 p-3 mb-2 rounded-xl text-[10px] font-black flex justify-between items-center' data-url='${url}' data-name='${files[0].name}'><span>${files[0].name}</span><button onclick="this.parentNode.remove()">✕</button></div>`;
        }

        async function saveInlineEdits() {
            let upd = [];
            document.querySelectorAll('#live-edit-body tr').forEach(tr => {
                let row = { questions: [] }; tr.querySelectorAll('td[data-col]').forEach(td => row[td.dataset.col] = td.innerText);
                tr.querySelectorAll('.bg-blue-50, .bg-slate-50').forEach(el => { if(el.dataset.url) row.questions.push({name: el.dataset.name, url: el.dataset.url}); });
                upd.push(row);
            });
            await db.collection("lesson_planners").doc(currentUploadId).update({ syllabusData: upd });
            alert("Structure Update Sync Complete!"); closeEditorModal(); await showEditView();
        }

        async function applyBulkDelegation() {
            const email = document.getElementById('bulk-staff-select').value;
            const subs = Array.from(document.querySelectorAll('.bulk-sub-cb:checked')).map(c => c.value);
            const secs = Array.from(document.querySelectorAll('.bulk-sec-cb:checked')).map(c => c.value);
            if(!email || !subs.length || !secs.length) return alert("Incomplete Linking Criteria!");
            const batch = db.batch();
            secs.forEach(sd => {
                const [c, s] = sd.split('|');
                subs.forEach(sub => {
                    const id = `${c}_${s}_${sub}`.replace(/\s+/g, '_');
                    batch.set(db.collection("lesson_planner_assignments").doc(id), { className: c, section: s, subject: sub, assignedTo: email, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                });
            });
            await batch.commit(); alert("Bulk Link Synchronized!"); await showEditView();
        }

        async function updateAssignmentSingle(id, f, v) { await db.collection("lesson_planner_assignments").doc(id).set({ [f]: v }, {merge:true}); await loadAllData(); renderSetup(); }
        async function wipeData(id) { if(confirm("Destroy syllabus data permanently?")) { await db.collection("lesson_planners").doc(id).delete(); await db.collection("lesson_planner_assignments").doc(id).update({isUploaded:false}); await showEditView(); }}
        function toggleDemoMode(val) { isDemoMode = val; document.getElementById('demo-mode-indicator').classList.toggle('hidden', !val); renderSummary(); }
        function toggleDrillEditMode() {
            isDrillEditMode = !isDrillEditMode;
            const btn = document.getElementById('edit-toggle-btn');
            btn.innerHTML = isDrillEditMode ? `🔓 Overrides Active` : `🔒 View Mode`;
            btn.className = isDrillEditMode ? `px-8 py-3 bg-blue-600 text-white rounded-full text-[10px] font-black uppercase shadow-xl` : `px-8 py-3 bg-slate-100 text-slate-900 rounded-full text-[10px] font-black uppercase border border-slate-200`;
            document.getElementById('drill-save-bar').classList.toggle('hidden', !isDrillEditMode);
            openDrillDown(lastDrillParams.cls, lastDrillParams.sec, lastDrillParams.sub, currentUploadId);
        }

        function getMockRows() {
            return [
                { "CHAPTER NAME": "Trigonometry", "LECTURE NUMBER": "1", "SUBTOPICS": "Basic Identities", "isDone": true, "completedDate": "2026-04-01", "completedMinutes": "90", "tickedBy": "rana.rpiyush.piyush826@gmail.com", "Target days for chapter": "14", "Target Minutes For Chapter": "1260" },
                { "CHAPTER NAME": "Trigonometry", "LECTURE NUMBER": "2", "SUBTOPICS": "Ratios", "isDone": true, "completedDate": "2026-04-03", "completedMinutes": "90", "tickedBy": "rana.rpiyush.piyush826@gmail.com", "Target days for chapter": "14", "Target Minutes For Chapter": "1260" }
            ];
        }

        window.onload = async () => { await loadAllData(); showMenuView(); };
    </script>
</body>
