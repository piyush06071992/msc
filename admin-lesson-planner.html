<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Lesson Planner Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20 text-slate-800">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black uppercase tracking-tighter italic text-blue-600">Lesson Planner Engine</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-8">
        
        <div id="menu-view" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10">
            <button onclick="alert('Progress Summary Dashboard coming next!')" class="glass p-8 rounded-[2rem] border-2 border-transparent shadow-lg hover:shadow-xl hover:border-emerald-300 transition-all text-left group flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <span class="text-4xl">📊</span>
                </div>
                <h3 class="text-2xl font-black text-slate-900 mb-2 uppercase tracking-tight">View Summary</h3>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Track Syllabus Progress</p>
            </button>

            <button onclick="showEditView()" class="glass p-8 rounded-[2rem] border-2 border-transparent shadow-lg hover:shadow-xl hover:border-blue-300 transition-all text-left group flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <span class="text-4xl">📝</span>
                </div>
                <h3 class="text-2xl font-black text-slate-900 mb-2 uppercase tracking-tight">Setup Planners</h3>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Targets, Staff Auth & Data Upload</p>
            </button>
        </div>

        <div id="edit-view" class="hidden space-y-6">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Syllabus Delegation</h2>
                <button onclick="showMenuView()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-black text-[10px] uppercase tracking-widest">Back</button>
            </div>

            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-5 shadow-sm">
                <h3 class="text-[10px] font-black text-indigo-800 uppercase tracking-widest mb-4 border-b border-indigo-200 pb-2">Multi-Tick Bulk Assignment</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
                    <div class="flex flex-col gap-3">
                        <div>
                            <label class="block text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">1. Filter Dept</label>
                            <select id="bulk-dept" onchange="filterBulkStaff()" class="w-full p-2 bg-white border border-indigo-200 rounded-lg text-[11px] font-bold text-slate-700 outline-none">
                                <option value="ALL">All Departments</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">2. Select Staff</label>
                            <select id="bulk-staff" class="w-full p-2 bg-white border border-indigo-200 rounded-lg text-[11px] font-bold text-indigo-700 outline-none">
                                <option value="">-- Choose Staff --</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">3. Select Subjects</label>
                        <div id="bulk-subjects-container" class="h-28 custom-scroll overflow-y-auto bg-white border border-indigo-200 rounded-lg p-2 flex flex-col gap-1 shadow-inner"></div>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">4. Select Sections</label>
                        <div id="bulk-sections-container" class="h-28 custom-scroll overflow-y-auto bg-white border border-indigo-200 rounded-lg p-2 flex flex-col gap-1 shadow-inner"></div>
                    </div>
                    <div class="flex h-full items-end">
                        <button onclick="applyBulkAssignment()" id="bulk-btn" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-black text-[11px] uppercase tracking-widest hover:bg-indigo-500 shadow-md transition-all active:scale-95">Apply Assignment</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-white text-[10px] uppercase tracking-widest">
                                <th class="p-4 font-black w-[20%]">Class & Sec</th>
                                <th class="p-4 font-black w-[15%]">Subject</th>
                                <th class="p-4 font-black w-[15%]">Target Date</th>
                                <th class="p-4 font-black w-[20%]">Staff</th>
                                <th class="p-4 font-black w-[10%] text-center">Status</th>
                                <th class="p-4 font-black w-[20%] text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="planner-table-body" class="text-sm font-medium divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="paste-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 max-w-3xl w-full shadow-2xl flex flex-col">
            <h3 class="text-xl font-black text-slate-900 uppercase mb-4 border-b pb-2 tracking-tight">Paste Data (Google Sheets)</h3>
            <textarea id="paste-area" class="w-full h-64 p-4 bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl font-mono text-[10px] outline-none focus:border-blue-400 mb-4" placeholder="Paste data here..."></textarea>
            <button onclick="processPastedData()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-[11px] tracking-widest shadow-lg">Analyze & Preview</button>
        </div>
    </div>

    <div id="preview-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-8 max-w-4xl w-full shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-black text-slate-900 mb-4 uppercase border-b pb-2 tracking-tight">Verify Syllabus Data</h3>
            <div id="preview-stats-container" class="grid grid-cols-5 gap-2 mb-4 text-center"></div>
            <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto custom-scroll mb-6 max-h-64" id="prev-tabular-container"></div>
            <div class="flex gap-3 mt-auto">
                <button onclick="closePreview()" class="flex-1 py-4 bg-slate-100 font-black uppercase text-[10px] rounded-2xl tracking-widest">Cancel</button>
                <button onclick="confirmUpload()" id="confirm-upload-btn" class="flex-1 py-4 bg-emerald-600 text-white font-black uppercase text-[10px] rounded-2xl tracking-widest">Looks Perfect! Save</button>
            </div>
        </div>
    </div>

    <div id="editor-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[120] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-6xl shadow-2xl flex flex-col h-[90vh]">
            <h3 class="text-xl font-black text-slate-900 uppercase mb-4 border-b pb-2 tracking-tight">Inline Syllabus Editor</h3>
            <div class="flex-1 overflow-auto border border-slate-200 rounded-xl custom-scroll mb-4" id="editor-table-container">
                <table class="w-full text-left border-collapse text-[11px]" id="live-edit-table">
                    <thead class="bg-slate-900 text-white sticky top-0" id="live-edit-head"></thead>
                    <tbody class="divide-y divide-slate-100" id="live-edit-body"></tbody>
                </table>
            </div>
            <button onclick="saveInlineEdits()" id="save-edits-btn" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-[11px] tracking-widest">Update Database</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // FIXED HEADERS: "SUBTOPICS" (plural) and trimmed matching
        const REQUIRED_HEADERS = ["CHAPTER NAME", "LECTURE NUMBER", "SUBTOPICS", "Target days for chapter", "Standard Class Duration", "Target Minutes For Chapter"];

        let structureData = [], staffList = [], assignments = [], currentUploadId = "", pendingCSVData = [];

        function showEditView() { document.getElementById('menu-view').classList.add('hidden'); document.getElementById('edit-view').classList.remove('hidden'); loadDashboard(); }
        function showMenuView() { document.getElementById('edit-view').classList.add('hidden'); document.getElementById('menu-view').classList.remove('hidden'); }

        async function loadDashboard() {
            try {
                const structSnap = await db.collection("institute_structure").orderBy("className").get();
                structureData = structSnap.docs.map(d => d.data());

                const staffSnap = await db.collection("staff_applications").where("status", "==", "approved").get();
                staffList = staffSnap.docs.map(doc => {
                    const data = doc.data();
                    const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                    const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                    return { email: data.email, name: nameKey ? data.details[nameKey] : data.email, dept: deptKey ? data.details[deptKey] : "General" };
                });

                const assignSnap = await db.collection("lesson_planner_assignments").get();
                assignments = assignSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                populateBulkMenus();
                renderTable();
            } catch (e) { alert("Initialization Error."); }
        }

        function populateBulkMenus() {
            const bulkDept = document.getElementById('bulk-dept');
            const subContainer = document.getElementById('bulk-subjects-container');
            const secContainer = document.getElementById('bulk-sections-container');

            let depts = new Set();
            staffList.forEach(s => { (Array.isArray(s.dept) ? s.dept : [s.dept]).forEach(p => depts.add(p.trim().toUpperCase())); });
            bulkDept.innerHTML = '<option value="ALL">All Departments</option>';
            depts.forEach(d => bulkDept.innerHTML += `<option value="${d}">${d}</option>`);

            let subs = new Set(), secs = "";
            structureData.forEach(st => {
                st.subjects.forEach(sb => { if(!['BREAK','EVENT','EXAM','ASSEMBLY'].includes(sb.toUpperCase())) subs.add(sb); });
                secs += `<label class="flex items-center gap-2 p-1 text-[11px] font-bold"><input type="checkbox" value="${st.className}|${st.sectionName}" class="cb-bulk-sec"> ${st.className} - ${st.sectionName}</label>`;
            });

            subContainer.innerHTML = Array.from(subs).map(s => `<label class="flex items-center gap-2 p-1 text-[11px] font-bold"><input type="checkbox" value="${s}" class="cb-bulk-sub"> ${s}</label>`).join('');
            secContainer.innerHTML = `<label class="flex items-center gap-2 p-1 text-indigo-700 font-black border-b mb-1"><input type="checkbox" onchange="document.querySelectorAll('.cb-bulk-sec').forEach(c=>c.checked=this.checked)"> Select All Sections</label>` + secs;
            filterBulkStaff();
        }

        function filterBulkStaff() {
            const dept = document.getElementById('bulk-dept').value;
            const drop = document.getElementById('bulk-staff');
            drop.innerHTML = '<option value="">-- Choose Staff --</option>';
            staffList.forEach(s => {
                if(dept === "ALL" || (Array.isArray(s.dept) ? s.dept.join(',').toUpperCase().includes(dept) : s.dept.toUpperCase().includes(dept))) {
                    drop.innerHTML += `<option value="${s.email}">${s.name}</option>`;
                }
            });
        }

        async function applyBulkAssignment() {
            const email = document.getElementById('bulk-staff').value;
            const subs = Array.from(document.querySelectorAll('.cb-bulk-sub:checked')).map(c=>c.value);
            const secs = Array.from(document.querySelectorAll('.cb-bulk-sec:checked')).map(c=>c.value);
            if(!email || !subs.length || !secs.length) return alert("Select all required fields.");
            
            const btn = document.getElementById('bulk-btn'); btn.innerText = "Applying..."; btn.disabled = true;
            try {
                const batch = db.batch();
                secs.forEach(sd => {
                    const [c, s] = sd.split('|');
                    subs.forEach(sub => {
                        const id = `${c}_${s}_${sub}`.replace(/\s+/g, '_');
                        batch.set(db.collection("lesson_planner_assignments").doc(id), { className: c, section: s, subject: sub, assignedTo: email, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                    });
                });
                await batch.commit(); alert("Done!"); loadDashboard();
            } catch (e) { alert("Bulk Error."); } finally { btn.innerText = "Apply Assignment"; btn.disabled = false; }
        }

        function renderTable() {
            const tbody = document.getElementById('planner-table-body'); tbody.innerHTML = '';
            structureData.forEach(st => {
                st.subjects.filter(s => !['BREAK','EVENT','EXAM','ASSEMBLY'].includes(s.toUpperCase())).forEach((sub, i) => {
                    const id = `${st.className}_${st.sectionName}_${sub}`.replace(/\s+/g, '_');
                    const data = assignments.find(a => a.id === id) || {};
                    const isUp = data.isUploaded;
                    const assignedEmail = data.assignedTo || ""; 

                    let staffOpts = `<option value="">-- Unassigned --</option>`;
                    staffList.forEach(s => {
                        staffOpts += `<option value="${s.email}" ${s.email === assignedEmail ? 'selected' : ''}>${s.name}</option>`;
                    });

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="p-4 font-black text-slate-800">${i===0 ? st.className + ' | ' + st.sectionName : ''}</td>
                            <td class="p-4 font-bold text-rose-600">${sub}</td>
                            <td class="p-4"><input type="date" id="date_${id}" value="${data.targetDate || ''}" onchange="updateAssignment('${id}','${st.className}','${st.sectionName}','${sub}','targetDate',this.value)" class="p-1 border rounded text-xs outline-none"></td>
                            <td class="p-4"><select onchange="updateAssignment('${id}','${st.className}','${st.sectionName}','${sub}','assignedTo',this.value)" class="p-1 border rounded text-[11px] font-bold w-full">${staffOpts}</select></td>
                            <td class="p-4 text-center">${isUp ? '✅' : '⏳'}</td>
                            <td class="p-4 flex gap-2 justify-center">
                                ${isUp ? `<button onclick="openEditorModal('${id}')" class="bg-blue-600 text-white px-3 py-1 rounded text-[9px] font-black uppercase">Edit</button><button onclick="wipeData('${id}')" class="bg-red-500 text-white px-3 py-1 rounded text-[9px] font-black uppercase">Wipe</button>` : `<button onclick="checkAndOpenPasteModal('${id}')" class="bg-slate-800 text-white px-3 py-1 rounded text-[9px] font-black uppercase tracking-widest hover:bg-blue-600">Paste Data</button>`}
                            </td>
                        </tr>`;
                });
            });
        }

        async function updateAssignment(id, c, s, sub, f, v) { await db.collection("lesson_planner_assignments").doc(id).set({ className:c, section:s, subject:sub, [f]:v, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); }
        
        async function wipeData(id) { if(confirm("Permanently wipe syllabus data for this subject?")) { await db.collection("lesson_planners").doc(id).delete(); await db.collection("lesson_planner_assignments").doc(id).update({isUploaded:false}); loadDashboard(); }}

        function checkAndOpenPasteModal(id) { const d = document.getElementById(`date_${id}`); if(!d || !d.value) return alert("Set Target Completion Date first."); currentUploadId = id; document.getElementById('paste-area').value = ''; document.getElementById('paste-modal').classList.remove('hidden'); document.getElementById('paste-modal').classList.add('flex'); }
        function closePasteModal() { document.getElementById('paste-modal').classList.add('hidden'); }

        function processPastedData() {
            const raw = document.getElementById('paste-area').value;
            const lines = raw.split('\n').filter(l => l.trim().length > 0);
            if (lines.length < 2) return alert("Data empty!");

            const headers = lines[0].split('\t').map(h => h.trim());
            const missing = REQUIRED_HEADERS.filter(h => !headers.includes(h));
            if(missing.length) return alert("Missing Columns: " + missing.join(', ') + "\nCheck for spelling & spaces in your sheet headers.");
            
            pendingCSVData = []; let chapters = new Set(), lects = new Set(), d=0, m=0, processed = new Set();
            for(let i=1; i<lines.length; i++) {
                let row = {}, cols = lines[i].split('\t');
                headers.forEach((h, idx) => row[h] = cols[idx] ? cols[idx].trim() : '');
                pendingCSVData.push(row);
                if(row['CHAPTER NAME']) {
                    chapters.add(row['CHAPTER NAME']);
                    if(!processed.has(row['CHAPTER NAME'])) {
                        processed.add(row['CHAPTER NAME']);
                        d += parseFloat(row['Target days for chapter']) || 0;
                        m += parseFloat(row['Target Minutes For Chapter']) || 0;
                    }
                }
                if(row['LECTURE NUMBER']) lects.add(row['CHAPTER NAME'] + row['LECTURE NUMBER']);
            }
            
            document.getElementById('preview-stats-container').innerHTML = `
                <div class='bg-blue-50 p-2 rounded-xl border'><div class='text-xl font-black text-blue-600'>${chapters.size}</div><div class='text-[8px] font-bold text-blue-400'>Chapters</div></div>
                <div class='bg-emerald-50 p-2 rounded-xl border'><div class='text-xl font-black text-emerald-600'>${lects.size}</div><div class='text-[8px] font-bold text-emerald-400'>Lectures</div></div>
                <div class='bg-purple-50 p-2 rounded-xl border'><div class='text-xl font-black text-purple-600'>${pendingCSVData.length}</div><div class='text-[8px] font-bold text-purple-400'>Subtopics</div></div>
                <div class='bg-orange-50 p-2 rounded-xl border'><div class='text-xl font-black text-orange-600'>${d}</div><div class='text-[8px] font-bold text-orange-400'>Days</div></div>
                <div class='bg-rose-50 p-2 rounded-xl border'><div class='text-xl font-black text-rose-600'>${m}</div><div class='text-[8px] font-bold text-rose-400'>Mins</div></div>`;
            
            let table = `<table class='w-full border-collapse text-[10px]'><thead class='bg-slate-100 sticky top-0'><tr>${headers.map(h=>`<th class='border p-2'>${h}</th>`).join('')}</tr></thead><tbody>`;
            pendingCSVData.slice(0,5).forEach(r => { table += `<tr>${headers.map(h=>`<td class='border p-2'>${r[h]}</td>`).join('')}</tr>`; });
            table += `</tbody></table>`;
            document.getElementById('prev-tabular-container').innerHTML = table;

            closePasteModal(); document.getElementById('preview-modal').classList.remove('hidden'); document.getElementById('preview-modal').classList.add('flex');
        }

        async function confirmUpload() { await db.collection("lesson_planners").doc(currentUploadId).set({ syllabusData: pendingCSVData }); await db.collection("lesson_planner_assignments").doc(currentUploadId).update({isUploaded:true}); alert("Linked Successfully!"); document.getElementById('preview-modal').classList.add('hidden'); loadDashboard(); }

        async function openEditorModal(id) {
            currentUploadId = id; const doc = await db.collection("lesson_planners").doc(id).get(); const data = doc.data().syllabusData;
            const headers = Object.keys(data[0]);
            document.getElementById('live-edit-head').innerHTML = `<tr>${headers.map(h=>`<th class='p-2 border'>${h}</th>`).join('')}</tr>`;
            document.getElementById('live-edit-body').innerHTML = data.map((r, i) => `<tr>${headers.map(h=>`<td contenteditable='true' class='p-2 border' data-col='${h}'>${r[h]}</td>`).join('')}</tr>`).join('');
            document.getElementById('editor-modal').classList.remove('hidden'); document.getElementById('editor-modal').classList.add('flex');
        }

        async function saveInlineEdits() {
            let updated = [];
            document.querySelectorAll('#live-edit-body tr').forEach(tr => {
                let row = {}; tr.querySelectorAll('td[data-col]').forEach(td => row[td.dataset.col] = td.innerText);
                updated.push(row);
            });
            await db.collection("lesson_planners").doc(currentUploadId).update({ syllabusData: updated });
            alert("Database Updated!"); document.getElementById('editor-modal').classList.add('hidden');
        }
        function closeEditorModal() { document.getElementById('editor-modal').classList.add('hidden'); }
        function closePreview() { document.getElementById('preview-modal').classList.add('hidden'); }
    </script>
</body>
</html>
