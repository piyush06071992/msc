<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Lesson Planner Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20 text-slate-800">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black uppercase tracking-tighter">Lesson Planner Management</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-8">
        
        <div id="menu-view" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10">
            <button onclick="alert('View Progress Summary will be built next!')" class="glass p-8 rounded-[2rem] border-2 border-transparent shadow-lg hover:shadow-xl hover:border-emerald-300 transition-all text-left group flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <span class="text-4xl">📊</span>
                </div>
                <h3 class="text-2xl font-black text-slate-900 mb-2 uppercase tracking-tight">View Progress Summary</h3>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Track Syllabus, Lags & Gaps</p>
            </button>

            <button onclick="showEditView()" class="glass p-8 rounded-[2rem] border-2 border-transparent shadow-lg hover:shadow-xl hover:border-blue-300 transition-all text-left group flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-blue-50 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <span class="text-4xl">📝</span>
                </div>
                <h3 class="text-2xl font-black text-slate-900 mb-2 uppercase tracking-tight">Edit / Add Planner</h3>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Targets, Staff Auth & CSV Uploads</p>
            </button>
        </div>

        <div id="edit-view" class="hidden space-y-6">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Syllabus Delegation</h2>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Set deadlines and authorize staff</p>
                </div>
                <button onclick="showMenuView()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-black text-[10px] uppercase tracking-widest hover:bg-slate-300 transition-all">Back to Menu</button>
            </div>

            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 flex flex-wrap gap-4 items-end shadow-sm">
                <div>
                    <label class="block text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1">1. Select Staff</label>
                    <select id="bulk-staff" class="p-2.5 bg-white border border-indigo-200 rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 w-48 cursor-pointer">
                        <option value="">-- Choose Staff --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1">2. Select Subject</label>
                    <select id="bulk-subject" class="p-2.5 bg-white border border-indigo-200 rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 w-40 cursor-pointer">
                        <option value="">-- Choose Subject --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-1">3. Select Class</label>
                    <select id="bulk-class" class="p-2.5 bg-white border border-indigo-200 rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-indigo-500 w-40 cursor-pointer">
                        <option value="">-- Choose Class --</option>
                    </select>
                </div>
                <button onclick="applyBulkAssignment()" id="bulk-btn" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-indigo-500 shadow-md transition-all active:scale-95">
                    Apply to All Sections
                </button>
            </div>

            <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-white text-[10px] uppercase tracking-widest">
                                <th class="p-4 font-black w-[20%]">Class & Sec</th>
                                <th class="p-4 font-black w-[15%]">Subject</th>
                                <th class="p-4 font-black w-[15%]">Target Date</th>
                                <th class="p-4 font-black w-[25%]">Authorized Staff</th>
                                <th class="p-4 font-black w-[10%] text-center">Status</th>
                                <th class="p-4 font-black w-[15%] text-center">Admin Upload</th>
                            </tr>
                        </thead>
                        <tbody id="planner-table-body" class="text-sm font-medium divide-y divide-slate-100">
                            <tr><td colspan="6" class="p-8 text-center text-slate-400 font-bold text-xs uppercase animate-pulse">Loading Structure...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <input type="file" id="csv-upload-input" accept=".csv" class="hidden" onchange="handleFileSelect(event)">

    <div id="preview-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-8 max-w-2xl w-full shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-black text-slate-900 mb-2 uppercase tracking-tight border-b border-slate-100 pb-4">Verify Syllabus Data</h3>
            <div class="grid grid-cols-3 gap-4 my-4">
                <div class="bg-blue-50 p-4 rounded-2xl text-center border border-blue-100">
                    <div class="text-3xl font-black text-blue-600" id="prev-chapters">0</div>
                    <div class="text-[9px] font-black text-blue-400 uppercase tracking-widest mt-1">Chapters</div>
                </div>
                <div class="bg-emerald-50 p-4 rounded-2xl text-center border border-emerald-100">
                    <div class="text-3xl font-black text-emerald-600" id="prev-lectures">0</div>
                    <div class="text-[9px] font-black text-emerald-400 uppercase tracking-widest mt-1">Total Lectures</div>
                </div>
                <div class="bg-purple-50 p-4 rounded-2xl text-center border border-purple-100">
                    <div class="text-3xl font-black text-purple-600" id="prev-subtopics">0</div>
                    <div class="text-[9px] font-black text-purple-400 uppercase tracking-widest mt-1">Subtopics</div>
                </div>
            </div>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Preview (First 3 Rows):</p>
            <div class="flex-1 overflow-auto bg-slate-50 rounded-xl border border-slate-200 p-2 text-[10px] font-mono whitespace-pre text-slate-600 mb-6" id="prev-snippet"></div>
            <div class="flex gap-3 mt-auto">
                <button onclick="closePreview()" class="flex-1 py-4 text-slate-500 font-black uppercase text-[10px] tracking-widest bg-slate-100 rounded-2xl hover:bg-slate-200 transition-colors">Cancel</button>
                <button onclick="confirmUpload()" id="confirm-upload-btn" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg shadow-blue-200 hover:bg-blue-700 transition-colors active:scale-95">Confirm & Save to Database</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];
        let staffList = [];
        let assignments = []; 
        let currentUploadId = ""; 
        let pendingCSVData = []; 

        function showEditView() {
            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('edit-view').classList.remove('hidden');
            loadDashboard();
        }

        function showMenuView() {
            document.getElementById('edit-view').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
        }

        // --- DYNAMIC COLORS ---
        function getSubjectColorClass(subject) {
            const s = subject.toLowerCase();
            if (s.includes('math')) return 'text-red-600 bg-red-50 border-red-100';
            if (s.includes('phys')) return 'text-blue-600 bg-blue-50 border-blue-100';
            if (s.includes('chem')) return 'text-purple-600 bg-purple-50 border-purple-100';
            if (s.includes('bio')) return 'text-emerald-600 bg-emerald-50 border-emerald-100';
            if (s.includes('eng')) return 'text-amber-600 bg-amber-50 border-amber-100';
            return 'text-slate-600 bg-slate-100 border-slate-200'; // Default
        }

        async function loadDashboard() {
            try {
                const structSnap = await db.collection("institute_structure").orderBy("className").get();
                structureData = structSnap.docs.map(d => d.data());

                const staffSnap = await db.collection("staff_applications").where("status", "==", "approved").get();
                staffList = staffSnap.docs.map(doc => {
                    const data = doc.data();
                    const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                    return { email: data.email, name: nameKey ? data.details[nameKey] : data.email };
                });

                const assignSnap = await db.collection("lesson_planner_assignments").get();
                assignments = assignSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                populateBulkDropdowns();
                renderTable();
            } catch (error) {
                console.error("Error loading dashboard:", error);
                alert("Failed to load data.");
            }
        }

        function populateBulkDropdowns() {
            const bulkStaff = document.getElementById('bulk-staff');
            const bulkSubject = document.getElementById('bulk-subject');
            const bulkClass = document.getElementById('bulk-class');

            // Reset
            bulkStaff.innerHTML = '<option value="">-- Choose Staff --</option>';
            bulkSubject.innerHTML = '<option value="">-- Choose Subject --</option>';
            bulkClass.innerHTML = '<option value="">-- Choose Class --</option>';

            // Populate Staff
            staffList.forEach(s => bulkStaff.innerHTML += `<option value="${s.email}">${s.name}</option>`);

            // Extract unique Classes and Subjects
            let uniqueClasses = new Set();
            let uniqueSubjects = new Set();

            structureData.forEach(struct => {
                uniqueClasses.add(struct.className);
                struct.subjects.forEach(sub => {
                    if (!['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'].includes(sub.toUpperCase())) {
                        uniqueSubjects.add(sub);
                    }
                });
            });

            uniqueSubjects.forEach(sub => bulkSubject.innerHTML += `<option value="${sub}">${sub}</option>`);
            uniqueClasses.forEach(cls => bulkClass.innerHTML += `<option value="${cls}">${cls}</option>`);
        }

        // --- BULK ASSIGNMENT LOGIC ---
        async function applyBulkAssignment() {
            const staffEmail = document.getElementById('bulk-staff').value;
            const subject = document.getElementById('bulk-subject').value;
            const className = document.getElementById('bulk-class').value;

            if (!staffEmail || !subject || !className) {
                return alert("Please select Staff, Subject, and Class to apply bulk assignment.");
            }

            const btn = document.getElementById('bulk-btn');
            btn.innerText = "Applying..."; btn.disabled = true;

            try {
                const batch = db.batch();
                let matchCount = 0;

                // Find all sections in the chosen class that have the chosen subject
                structureData.forEach(struct => {
                    if (struct.className === className && struct.subjects.includes(subject)) {
                        const assignmentId = `${struct.className}_${struct.sectionName}_${subject}`.replace(/\s+/g, '_');
                        const docRef = db.collection("lesson_planner_assignments").doc(assignmentId);
                        
                        batch.set(docRef, {
                            className: struct.className,
                            section: struct.sectionName,
                            subject: subject,
                            assignedTo: staffEmail,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                        
                        matchCount++;
                    }
                });

                if (matchCount === 0) {
                    alert(`No sections found in ${className} that teach ${subject}.`);
                } else {
                    await batch.commit();
                    alert(`Successfully assigned ${subject} to ${matchCount} sections!`);
                    await loadDashboard(); // Reload to see changes
                }
            } catch (err) {
                console.error(err);
                alert("Bulk assignment failed.");
            } finally {
                btn.innerText = "Apply to All Sections"; btn.disabled = false;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('planner-table-body');
            tbody.innerHTML = '';

            structureData.forEach(struct => {
                const cName = struct.className;
                const sName = struct.sectionName;
                const validSubjects = struct.subjects.filter(sub => !['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'].includes(sub.toUpperCase()));

                validSubjects.forEach((subject, index) => {
                    const assignmentId = `${cName}_${sName}_${subject}`.replace(/\s+/g, '_');
                    const existingData = assignments.find(a => a.id === assignmentId) || {};
                    
                    const assignedStaffEmail = existingData.assignedTo || '';
                    const targetDate = existingData.targetDate || '';
                    const isUploaded = existingData.isUploaded || false;

                    let staffOptions = `<option value="">-- Unassigned --</option>`;
                    staffList.forEach(staff => {
                        const selected = staff.email === assignedStaffEmail ? 'selected' : '';
                        staffOptions += `<option value="${staff.email}" ${selected}>${staff.name}</option>`;
                    });

                    const statusBadge = isUploaded 
                        ? `<span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-[9px] font-black uppercase tracking-widest">Uploaded</span>`
                        : `<span class="px-2 py-1 bg-amber-100 text-amber-700 rounded-lg text-[9px] font-black uppercase tracking-widest">Pending</span>`;

                    const showGroupLabel = index === 0;
                    const subjectColor = getSubjectColorClass(subject);

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors";
                    tr.innerHTML = `
                        <td class="p-4 font-black text-slate-800 ${!showGroupLabel ? 'border-none text-transparent' : 'border-t'}">
                            ${cName} <span class="text-slate-400 text-xs">| ${sName}</span>
                        </td>
                        <td class="p-4 font-black text-xs uppercase tracking-wider border-l border-slate-100">
                            <span class="px-2 py-1 rounded border ${subjectColor}">${subject}</span>
                        </td>
                        <td class="p-4">
                            <input type="date" value="${targetDate}" onchange="updateAssignment('${assignmentId}', '${cName}', '${sName}', '${subject}', 'targetDate', this.value)" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none focus:border-blue-400 cursor-pointer">
                        </td>
                        <td class="p-4">
                            <select onchange="updateAssignment('${assignmentId}', '${cName}', '${sName}', '${subject}', 'assignedTo', this.value)" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none focus:border-blue-400 cursor-pointer">
                                ${staffOptions}
                            </select>
                        </td>
                        <td class="p-4 text-center">${statusBadge}</td>
                        <td class="p-4 text-center">
                            <button onclick="triggerUpload('${assignmentId}')" class="px-3 py-1.5 ${isUploaded ? 'bg-slate-200 text-slate-500 hover:bg-slate-300' : 'bg-slate-800 text-white hover:bg-blue-600'} rounded shadow-sm text-[9px] font-black uppercase tracking-widest transition-colors">
                                ${isUploaded ? 'Replace' : 'Upload'}
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // --- ROW AUTO-SAVE LOGIC ---
        async function updateAssignment(docId, className, section, subject, fieldName, fieldValue) {
            try {
                const updateData = { className, section, subject, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
                updateData[fieldName] = fieldValue; 
                await db.collection("lesson_planner_assignments").doc(docId).set(updateData, { merge: true });
            } catch (error) {
                alert("Failed to save changes.");
            }
        }

        // --- UPLOAD LOGIC ---
        function triggerUpload(assignmentId) {
            currentUploadId = assignmentId;
            document.getElementById('csv-upload-input').click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { parseCSVAndPreview(e.target.result); event.target.value = ''; };
            reader.readAsText(file);
        }

        function parseCSVAndPreview(csvText) {
            const lines = csvText.split('\n').filter(line => line.trim().length > 0);
            if (lines.length < 2) return alert("CSV is empty or invalid.");
            const headers = lines[0].split(',').map(h => h.trim());
            pendingCSVData = [];
            const uniqueChapters = new Set();
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                let rowObj = {};
                headers.forEach((h, index) => { rowObj[h] = cols[index] ? cols[index].trim() : ''; });
                pendingCSVData.push(rowObj);
                if(rowObj['CHAPTER NAME']) uniqueChapters.add(rowObj['CHAPTER NAME']);
            }
            const uniqueLectures = new Set();
            pendingCSVData.forEach(r => { if(r['CHAPTER NAME'] && r['LECTURE NUMBER']) uniqueLectures.add(r['CHAPTER NAME'] + '_' + r['LECTURE NUMBER']); });

            document.getElementById('prev-chapters').innerText = uniqueChapters.size;
            document.getElementById('prev-lectures').innerText = uniqueLectures.size;
            document.getElementById('prev-subtopics').innerText = pendingCSVData.length;

            let snippet = headers.join(' | ') + '\n' + '-'.repeat(50) + '\n';
            for(let i=0; i<Math.min(3, pendingCSVData.length); i++) { snippet += Object.values(pendingCSVData[i]).join(' | ') + '\n'; }
            if(pendingCSVData.length > 3) snippet += '... and ' + (pendingCSVData.length - 3) + ' more rows.';
            
            document.getElementById('prev-snippet').innerText = snippet;
            document.getElementById('preview-modal').classList.replace('hidden', 'flex');
        }

        function closePreview() { document.getElementById('preview-modal').classList.replace('flex', 'hidden'); pendingCSVData = []; currentUploadId = ""; }

        async function confirmUpload() {
            if (!currentUploadId || pendingCSVData.length === 0) return alert("No valid data to save.");
            const btn = document.getElementById('confirm-upload-btn');
            btn.innerText = "Saving to Database..."; btn.disabled = true;

            try {
                await db.collection("lesson_planners").doc(currentUploadId).set({ syllabusData: pendingCSVData, uploadedAt: firebase.firestore.FieldValue.serverTimestamp() });
                await db.collection("lesson_planner_assignments").doc(currentUploadId).set({ isUploaded: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                alert("Syllabus saved successfully!"); closePreview(); loadDashboard();
            } catch (error) { alert("Failed to save."); } 
            finally { btn.innerText = "Confirm & Save to Database"; btn.disabled = false; }
        }
    </script>
</body>
</html>
