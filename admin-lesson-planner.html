<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Master Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* EXCEL GRID STYLING */
        .excel-table { width: 100%; border-collapse: collapse; min-width: 1200px; background: white; }
        .excel-table th { background: #1e293b; color: white; padding: 12px; text-transform: uppercase; font-size: 12px; font-weight: 900; border: 1px solid #334155; text-align: center; }
        .excel-table td { border: 1px solid #cbd5e1; padding: 6px; vertical-align: top; background: #f8fafc; }
        
        /* Cell Entry Block */
        .cell-entry { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px; margin-bottom: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); position: relative; }
        .cell-entry select, .cell-entry input { width: 100%; background: transparent; border: none; outline: none; margin-bottom: 2px; }
        .cell-entry select:focus, .cell-entry input:focus { background: #f1f5f9; border-radius: 4px; }
        
        .e-sub { color: #e11d48; font-weight: 900; font-size: 12px; text-transform: uppercase; cursor: pointer; }
        .e-tea { color: #059669; font-weight: 700; font-size: 10px; cursor: pointer; }
        .e-room { color: #64748b; font-weight: bold; font-size: 9px; }
        .e-rem { color: #d97706; font-weight: bold; font-size: 9px; font-style: italic; }
        
        /* Print Settings */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body > *:not(#print-render-area) { display: none !important; }
            body { background: white !important; }
            #print-render-area { display: block !important; position: relative !important; visibility: visible !important; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans pb-20">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm no-print">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black text-slate-800 uppercase tracking-tighter">Timetable Editor</h1>
        </div>
        
        <div class="flex gap-3 items-center">
            <select id="class-select" onchange="populateSections()" class="bg-slate-50 border border-slate-200 text-slate-700 px-4 py-2 rounded-lg font-black text-[11px] uppercase outline-none cursor-pointer focus:border-blue-500">
                <option value="">-- Select Class --</option>
            </select>
            <select id="section-select" onchange="loadExcelGrid()" class="bg-slate-50 border border-slate-200 text-slate-700 px-4 py-2 rounded-lg font-black text-[11px] uppercase outline-none cursor-pointer focus:border-blue-500" disabled>
                <option value="">-- Select Section --</option>
            </select>
            
            <button onclick="saveExcelTimetable()" id="save-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-black text-[11px] uppercase tracking-widest shadow-md hover:bg-blue-500 transition-all ml-4 flex items-center gap-2 hidden">
                💾 Save Changes
            </button>
        </div>
    </header>

    <main class="p-4 sm:p-6 overflow-x-auto no-print" id="main-content">
        <div id="welcome-msg" class="text-center py-20 text-slate-400 font-bold uppercase tracking-widest text-xs">
            Please select a Class and Section above to open the editor.
        </div>
        
        <div id="excel-container" class="hidden bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
            <table class="excel-table" id="timetable-matrix">
                <thead>
                    <tr>
                        <th style="width: 140px; background: #0f172a;">TIME SLOT</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody id="matrix-body">
                    </tbody>
            </table>
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-center">
                <button onclick="addExcelRow()" class="px-6 py-2 bg-white border-2 border-dashed border-slate-300 text-slate-500 font-black text-[11px] uppercase tracking-widest rounded-lg hover:border-blue-500 hover:text-blue-600 transition-colors shadow-sm">
                    + Add Time Row
                </button>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];
        let allTeachers = [];
        let globalTimetable = []; 
        let activeSubjects = []; // Subjects valid for the selected section
        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const SPECIAL_SUBJECTS = ['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'];

        async function init() {
            await Promise.all([fetchStructure(), fetchTeachers()]);
            // Pre-fetch timetable to enable instant clash checking
            const snap = await db.collection("timetable").get();
            globalTimetable = snap.docs.map(d => ({id: d.id, ...d.data()}));
        }

        async function fetchStructure() {
            const snap = await db.collection("institute_structure").orderBy("className").get();
            structureData = snap.docs.map(d => d.data());
            
            const classSel = document.getElementById('class-select');
            const uniqueClasses = [...new Set(structureData.map(s => s.className))].sort();
            uniqueClasses.forEach(c => { classSel.innerHTML += `<option value="${c}">${c}</option>`; });
        }

        async function fetchTeachers() {
            const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
            allTeachers = snap.docs.map(doc => {
                const data = doc.data();
                const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                return { name: nameKey ? data.details[nameKey] : data.email, dept: deptKey ? data.details[deptKey] : 'General' };
            });
        }

        function populateSections() {
            const cName = document.getElementById('class-select').value;
            const secSel = document.getElementById('section-select');
            secSel.innerHTML = '<option value="">-- Select Section --</option>';
            
            if(!cName) { secSel.disabled = true; return; }
            
            const sections = structureData.filter(s => s.className === cName).map(s => s.sectionName).sort();
            sections.forEach(sec => { secSel.innerHTML += `<option value="${sec}">${sec}</option>`; });
            secSel.disabled = false;
        }

        // ==========================================
        // === INLINE EXCEL GRID GENERATOR        ===
        // ==========================================
        function loadExcelGrid() {
            const cName = document.getElementById('class-select').value;
            const sName = document.getElementById('section-select').value;
            
            if(!cName || !sName) {
                document.getElementById('excel-container').classList.add('hidden');
                document.getElementById('welcome-msg').classList.remove('hidden');
                document.getElementById('save-btn').classList.add('hidden');
                return;
            }

            // Determine allowed subjects for this specific section
            const struct = structureData.find(s => s.className === cName && s.sectionName === sName);
            activeSubjects = struct ? struct.subjects : [];

            document.getElementById('welcome-msg').classList.add('hidden');
            document.getElementById('excel-container').classList.remove('hidden');
            document.getElementById('save-btn').classList.remove('hidden');

            const tbody = document.getElementById('matrix-body');
            tbody.innerHTML = "";

            // Filter timetable for this section
            const sectionSlots = globalTimetable.filter(t => t.className === cName && t.section === sName);

            if (sectionSlots.length === 0) {
                // If empty, provide 3 blank rows to start
                addExcelRow(); addExcelRow(); addExcelRow();
            } else {
                // Reverse engineer times into rows
                const timeGroups = {};
                sectionSlots.forEach(slot => {
                    const key = `${slot.start24}-${slot.end24}`;
                    if(!timeGroups[key]) timeGroups[key] = { sTime: slot.start24, eTime: slot.end24, days: {} };
                    if(!timeGroups[key].days[slot.day]) timeGroups[key].days[slot.day] = [];
                    timeGroups[key].days[slot.day].push(slot); // Push allows multiple slots per cell (Split classes!)
                });

                Object.keys(timeGroups).sort().forEach(key => {
                    const rowId = addExcelRow(timeGroups[key].sTime, timeGroups[key].eTime);
                    DAYS.forEach(day => {
                        const cellId = `${rowId}-${day}`;
                        const cellSlots = timeGroups[key].days[day] || [];
                        const container = document.getElementById(`entries-${cellId}`);
                        container.innerHTML = ""; // clear default empty block
                        
                        if(cellSlots.length === 0) {
                            addCellEntry(cellId, day); // Add a blank entry if day is empty
                        } else {
                            cellSlots.forEach(slot => {
                                addCellEntry(cellId, day, slot.subject, slot.teacher, slot.room, slot.remark);
                            });
                        }
                    });
                });
            }
        }

        function addExcelRow(sTime = "", eTime = "") {
            const tbody = document.getElementById('matrix-body');
            const rowId = 'r_' + Math.random().toString(36).substr(2, 6);
            const tr = document.createElement('tr');
            tr.id = rowId;
            tr.className = "matrix-row";

            // Time Column
            let html = `
                <td class="bg-white border-r-2 border-slate-300 shadow-sm relative">
                    <div class="flex flex-col gap-1 items-center justify-center h-full pt-2">
                        <input type="time" class="row-start w-[110px] p-2 bg-slate-50 border border-slate-200 rounded text-xs font-bold outline-none text-center focus:border-blue-500" value="${sTime}" onchange="triggerRowUpdate('${rowId}')">
                        <span class="text-[9px] font-black text-slate-400 uppercase">To</span>
                        <input type="time" class="row-end w-[110px] p-2 bg-slate-50 border border-slate-200 rounded text-xs font-bold outline-none text-center focus:border-blue-500" value="${eTime}" onchange="triggerRowUpdate('${rowId}')">
                        <button onclick="document.getElementById('${rowId}').remove()" class="mt-2 text-[8px] text-rose-500 font-bold uppercase hover:underline">Remove Row</button>
                    </div>
                </td>
            `;

            // Day Columns
            DAYS.forEach((day, index) => {
                const cellId = `${rowId}-${day}`;
                html += `
                    <td id="${cellId}" data-day="${day}">
                        <div id="entries-${cellId}" class="flex flex-col gap-1 w-full h-full relative">
                            </div>
                        <div class="w-full flex justify-center mt-1">
                            <button onclick="addCellEntry('${cellId}', '${day}')" class="text-[14px] text-slate-300 hover:text-blue-500 font-black rounded-full bg-white border shadow-sm w-5 h-5 flex items-center justify-center transition-colors" title="Add Split Class to this cell">+</button>
                        </div>
                    </td>
                `;
            });

            tr.innerHTML = html;
            tbody.appendChild(tr);

            // Populate initial empty entries for the new row
            if(!sTime) {
                DAYS.forEach(day => { addCellEntry(`${rowId}-${day}`, day); });
            }
            return rowId;
        }

        // Creates the actual editable block inside a grid cell
        function addCellEntry(cellId, day, subject = "", teacher = "", room = "", remark = "") {
            const container = document.getElementById(`entries-${cellId}`);
            const entryId = 'e_' + Math.random().toString(36).substr(2, 6);
            const rowId = cellId.split('-')[0];

            let subOptions = `<option value="">- Subject -</option><option value="BREAK">BREAK</option><option value="ASSEMBLY">ASSEMBLY</option><option value="EXAM">EXAM</option><option value="EVENT">EVENT</option>`;
            activeSubjects.forEach(s => { subOptions += `<option value="${s}" ${s === subject ? 'selected' : ''}>${s}</option>`; });
            if (subject && !activeSubjects.includes(subject) && !SPECIAL_SUBJECTS.includes(subject)) subOptions += `<option value="${subject}" selected>${subject}</option>`;

            const div = document.createElement('div');
            div.className = "cell-entry group";
            div.id = entryId;
            
            // Delete button for this specific block (visible on hover)
            const delBtn = `<button onclick="document.getElementById('${entryId}').remove()" class="absolute -right-2 -top-2 bg-white border border-rose-200 text-rose-500 rounded-full w-4 h-4 flex items-center justify-center shadow hover:bg-rose-50 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-black z-10">✕</button>`;
            
            // "Copy Right" button (Only on Monday)
            const copyBtn = day === 'Monday' ? `<button onclick="copyEntryToRight('${rowId}', '${entryId}')" class="absolute -right-3 top-1/2 -translate-y-1/2 bg-blue-600 text-white rounded-full w-5 h-5 flex items-center justify-center shadow-lg hover:bg-blue-500 opacity-0 group-hover:opacity-100 transition-opacity z-20" title="Copy this subject across the whole week">👉</button>` : '';

            div.innerHTML = `
                ${delBtn} ${copyBtn}
                <select class="e-sub" onchange="handleExcelSubject('${rowId}', '${entryId}')">${subOptions}</select>
                <div class="e-tea-wrapper">
                    <select class="e-tea" data-selected="${teacher}" onchange="checkExcelClash('${rowId}', '${entryId}', '${day}')"></select>
                </div>
                <div class="flex gap-1 mt-1">
                    <input type="text" class="e-room" placeholder="Room" value="${room}">
                    <input type="text" class="e-rem" placeholder="Remarks" value="${remark}">
                </div>
                <div class="e-warn hidden mt-1 bg-red-600 text-white font-black text-[8px] px-1 py-0.5 rounded text-center leading-tight shadow animate-pulse"></div>
            `;
            container.appendChild(div);
            handleExcelSubject(rowId, entryId); // populate teachers based on subject
        }

        function handleExcelSubject(rowId, entryId) {
            const entry = document.getElementById(entryId);
            const sub = entry.querySelector('.e-sub').value;
            const tWrapper = entry.querySelector('.e-tea-wrapper');
            const roomInput = entry.querySelector('.e-room');
            const tSelect = entry.querySelector('.e-tea');
            const prevSelected = tSelect.getAttribute('data-selected');

            if (SPECIAL_SUBJECTS.includes(sub)) {
                tWrapper.classList.add('hidden'); tSelect.value = "NONE";
                if (sub === 'BREAK') roomInput.placeholder = "Lunch";
                else if (sub === 'EXAM') roomInput.placeholder = "UT 1";
                else if (sub === 'EVENT') roomInput.placeholder = "Event";
                else if (sub === 'ASSEMBLY') roomInput.placeholder = "Loc";
            } else {
                tWrapper.classList.remove('hidden'); roomInput.placeholder = "Room";
                tSelect.innerHTML = '<option value="NONE">- Teacher -</option>';
                
                // Allow ALL teachers by default in Excel mode to avoid checking boxes
                allTeachers.forEach(t => {
                    const isSelected = (t.name === prevSelected) ? 'selected' : '';
                    tSelect.innerHTML += `<option value="${t.name}" ${isSelected}>${t.name}</option>`;
                });
                tSelect.setAttribute('data-selected', ''); 
            }
            
            const day = document.getElementById(entryId).closest('td').getAttribute('data-day');
            checkExcelClash(rowId, entryId, day);
        }

        function triggerRowUpdate(rowId) {
            // When time changes, re-check clashes for all entries in this row
            const row = document.getElementById(rowId);
            const entries = row.querySelectorAll('.cell-entry');
            entries.forEach(ent => {
                const day = ent.closest('td').getAttribute('data-day');
                checkExcelClash(rowId, ent.id, day);
            });
        }

        function checkExcelClash(rowId, entryId, day) {
            const row = document.getElementById(rowId);
            const entry = document.getElementById(entryId);
            
            const s24 = row.querySelector('.row-start').value;
            const e24 = row.querySelector('.row-end').value;
            const tName = entry.querySelector('.e-tea').value;
            const warnLabel = entry.querySelector('.e-warn');

            if (tName === "NONE" || !s24 || !e24) { 
                warnLabel.innerText = ""; warnLabel.classList.add('hidden'); return; 
            }
            
            const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
            const rStart = sh * 60 + sm; const rEnd = eh * 60 + em;

            const cName = document.getElementById('class-select').value;
            const sName = document.getElementById('section-select').value;

            const overlaps = globalTimetable.filter(slot => {
                if (slot.day !== day) return false; 
                if (slot.teacher !== tName) return false;
                if (slot.className === cName && slot.section === sName) return false; // Ignore self
                const [ssh, ssm] = slot.start24.split(':').map(Number); const [seh, sem] = slot.end24.split(':').map(Number);
                return (rStart < (seh * 60 + sem) && rEnd > (ssh * 60 + ssm));
            });
            
            if (overlaps.length > 0) {
                warnLabel.innerText = `CLASH: ${overlaps[0].section}`; // Keep warning tiny for grid
                warnLabel.classList.remove('hidden');
            } else {
                warnLabel.innerText = "";
                warnLabel.classList.add('hidden');
            }
        }

        // Extremely fast Excel-style "Copy across row"
        function copyEntryToRight(rowId, sourceEntryId) {
            const row = document.getElementById(rowId);
            const sourceEntry = document.getElementById(sourceEntryId);
            
            const sub = sourceEntry.querySelector('.e-sub').value;
            const tea = sourceEntry.querySelector('.e-tea').value;
            const room = sourceEntry.querySelector('.e-room').value;
            const rem = sourceEntry.querySelector('.e-rem').value;

            // Find all days except Monday in this row
            const targetDays = DAYS.slice(1); 
            targetDays.forEach(day => {
                const cellId = `${rowId}-${day}`;
                const container = document.getElementById(`entries-${cellId}`);
                
                // If it's just the default empty block, clear it.
                if(container.children.length === 1 && !container.querySelector('.e-sub').value) {
                    container.innerHTML = "";
                }
                
                addCellEntry(cellId, day, sub, tea, room, rem);
            });
        }

        function format12Hour(time24) {
            if(!time24) return ""; let [h, m] = time24.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
        }

        // ==========================================
        // === SAVE THE EXCEL GRID                ===
        // ==========================================
        async function saveExcelTimetable() {
            const cName = document.getElementById('class-select').value;
            const sName = document.getElementById('section-select').value;
            const rows = Array.from(document.querySelectorAll('.matrix-row'));
            
            let newSlots = []; 
            let conflictMsg = "";

            for (let r of rows) {
                const s24 = r.querySelector('.row-start').value; 
                const e24 = r.querySelector('.row-end').value;
                
                // If row has no time, check if it's completely empty. If yes, skip. If it has data, block save.
                const hasData = Array.from(r.querySelectorAll('.e-sub')).some(sel => sel.value !== "");
                if(!s24 || !e24) {
                    if(hasData) { conflictMsg = "A row with subjects is missing a start or end time."; break; }
                    continue; 
                }

                const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
                const sMins = sh * 60 + sm; const eMins = eh * 60 + em;
                if (sMins >= eMins) { conflictMsg = `Invalid Time: ${s24} - ${e24}.`; break; }
                
                const dur = `${eMins - sMins} MINS`;
                const timeRange = `${format12Hour(s24)} - ${format12Hour(e24)}`;

                // Extract data from every day cell in this row
                DAYS.forEach(day => {
                    const entries = Array.from(r.querySelectorAll(`#${r.id}-${day} .cell-entry`));
                    entries.forEach(ent => {
                        const sub = ent.querySelector('.e-sub').value;
                        if (!sub) return; // Skip blank dropdowns
                        
                        const teacher = ent.querySelector('.e-tea').value || "NONE"; 
                        const room = ent.querySelector('.e-room').value.trim();
                        const remark = ent.querySelector('.e-rem').value.trim();

                        let teacherEmail = "";
                        if (teacher !== "NONE") {
                            const tObj = allTeachers.find(t => t.name === teacher);
                            if (tObj) teacherEmail = tObj.email || ""; 
                        }

                        newSlots.push({ 
                            day: day, className: cName, section: sName, 
                            start24: s24, end24: e24, timeRange, duration: dur, 
                            subject: sub, teacher, teacherName: teacher, teacherEmail: teacherEmail, 
                            room, remark, sMins, eMins 
                        });
                    });
                });
            }

            if (conflictMsg) return alert(conflictMsg);
            
            const btn = document.getElementById('save-btn'); 
            const originalText = btn.innerHTML;
            btn.innerText = "Saving Grid..."; btn.disabled = true;

            try {
                const batch = db.batch();

                // 1. Wipe old section data for the whole week
                const snap = await db.collection("timetable")
                    .where("className", "==", cName)
                    .where("section", "==", sName)
                    .get();
                snap.docs.forEach(doc => { batch.delete(doc.ref); });
                
                // 2. Write new grid
                newSlots.forEach(slot => {
                    const { sMins, eMins, ...cleanSlot } = slot;
                    batch.set(db.collection("timetable").doc(), cleanSlot);
                });

                await batch.commit(); 
                
                // Update global tracking instantly
                const refreshSnap = await db.collection("timetable").get();
                globalTimetable = refreshSnap.docs.map(d => ({id: d.id, ...d.data()}));

                alert("Grid Saved Successfully!");
                loadExcelGrid(); // Refresh UI to clean up any blank rows
            } catch (err) { 
                alert("Error saving: " + err.message); 
            } finally { 
                btn.innerHTML = originalText; btn.disabled = false; 
            }
        }

        init();
    </script>
</body>
</html>
