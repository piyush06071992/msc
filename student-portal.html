<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Student Portal</title>
    <script src="tailwind-engine.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .portal-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .portal-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.08);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- Background Ambient Glow -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
        <div class="absolute bottom-[-5%] left-[-5%] w-96 h-96 bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
    </div>

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 px-4 sm:px-8 py-4 flex justify-between items-center shadow-sm min-h-[4.5rem]">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-slate-900 rounded-xl shadow-inner">
                <img src="logo.png?v=2" alt="Minerva Logo" class="w-7 h-7 object-contain" onerror="this.src='https://via.placeholder.com/30?text=M'">
            </div>
            <div>
                <h1 class="text-md sm:text-lg font-black tracking-tighter uppercase text-slate-900 leading-none">Minerva <span class="text-blue-600">Student</span></h1>
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-0.5">Workspace v3.0</p>
            </div>
        </div>
        <button onclick="logout()" class="text-[10px] font-black text-rose-600 uppercase tracking-widest bg-rose-50 border border-rose-100 px-4 py-2.5 rounded-xl hover:bg-rose-100 transition-colors shadow-sm active:scale-95">
            🚪 Logout
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8 space-y-8">
        
        <!-- STUDENT PROFILE CARD -->
        <section class="glass-card rounded-[2.5rem] p-6 sm:p-8 shadow-xl relative overflow-hidden border-2 border-white">
            <div class="absolute top-0 left-0 w-4 h-full bg-gradient-to-b from-blue-500 to-indigo-600"></div>
            
            <div class="flex flex-col md:flex-row items-center md:items-end gap-6 pl-4">
                <!-- Profile Photo / Avatar -->
                <div class="w-24 h-24 sm:w-28 sm:h-28 bg-gradient-to-tr from-blue-600 to-indigo-800 rounded-full shadow-lg flex items-center justify-center text-white text-3xl sm:text-4xl font-black uppercase border-4 border-white shrink-0 relative">
                    <span id="stu-photo-initials">--</span>
                    <div class="absolute bottom-0 right-0 w-6 h-6 bg-emerald-500 border-2 border-white rounded-full shadow-sm" title="Online"></div>
                </div>
                
                <!-- Core Details -->
                <div class="flex-1 text-center md:text-left">
                    <h2 id="stu-name" class="text-2xl sm:text-4xl font-black tracking-tighter text-slate-900 uppercase leading-none mb-2">Loading...</h2>
                    <p id="stu-parents" class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-widest mb-4">S/O Loading...</p>
                    
                    <div class="flex flex-wrap items-center justify-center md:justify-start gap-2">
                        <span class="text-[10px] font-black text-blue-800 bg-blue-100 border border-blue-200 rounded-lg px-3 py-1.5 uppercase tracking-widest shadow-sm flex items-center gap-1.5">
                            <span>🆔</span> <span id="stu-roll">--</span>
                        </span>
                        <span class="text-[10px] font-black text-indigo-800 bg-indigo-100 border border-indigo-200 rounded-lg px-3 py-1.5 uppercase tracking-widest shadow-sm flex items-center gap-1.5">
                            <span>🏫</span> <span id="stu-class">--</span> <span class="text-indigo-400">|</span> SEC <span id="stu-sec">--</span>
                        </span>
                        <span class="text-[10px] font-black text-emerald-800 bg-emerald-100 border border-emerald-200 rounded-lg px-3 py-1.5 uppercase tracking-widest shadow-sm flex items-center gap-1.5">
                            <span>📍</span> <span id="stu-branch">GHUMARWIN</span>
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ACADEMIC ENGINE -->
        <section class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-[0.25em] text-slate-400 mb-2 pl-1">Academic Engine</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                
                <button onclick="handleNavigation('performance')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-amber-500">
                    <div class="bg-amber-50 text-amber-600 p-4 rounded-2xl group-hover:bg-amber-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">📈</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-amber-600 transition-colors">My Academic Performance</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">View test scores, rank analytics, and subject-wise growth metrics.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('syllabus')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-blue-500">
                    <div class="bg-blue-50 text-blue-600 p-4 rounded-2xl group-hover:bg-blue-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">📘</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-blue-600 transition-colors">Syllabus Coverage</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Track completed chapters and upcoming curriculum milestones.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('assignments')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-sky-500">
                    <div class="bg-sky-50 text-sky-600 p-4 rounded-2xl group-hover:bg-sky-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">📝</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-sky-600 transition-colors">Assignment Reports</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Check DPP submissions, homework logs, and grading feedback.</p>
                    </div>
                </button>

            </div>
        </section>

        <!-- DAILY OPERATIONS -->
        <section class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-[0.25em] text-slate-400 mb-2 pl-1">Daily Operations</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                
                <button onclick="handleNavigation('timetable')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-indigo-500">
                    <div class="bg-indigo-50 text-indigo-600 p-4 rounded-2xl group-hover:bg-indigo-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">🕒</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-indigo-600 transition-colors">My Timetable</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Access your live daily lecture schedule and room allocations.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('attendance')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-emerald-500">
                    <div class="bg-emerald-50 text-emerald-600 p-4 rounded-2xl group-hover:bg-emerald-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">✅</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-emerald-600 transition-colors">My Attendance</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Review your presence record and subject-wise absence alerts.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('feedback')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-cyan-500">
                    <div class="bg-cyan-50 text-cyan-600 p-4 rounded-2xl group-hover:bg-cyan-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">⭐</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-cyan-600 transition-colors">Teacher Feedback</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Submit anonymous reviews and rate your classroom experience.</p>
                    </div>
                </button>

            </div>
        </section>

        <!-- SUPPORT & CONNECT -->
        <section class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-[0.25em] text-slate-400 mb-2 pl-1">Support & Connect</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                
                <button onclick="handleNavigation('doubts')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-rose-500">
                    <div class="bg-rose-50 text-rose-600 p-4 rounded-2xl group-hover:bg-rose-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">🙋‍♂️</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-rose-600 transition-colors">Request Doubts</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Book 1-on-1 doubt clearing sessions with expert faculty.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('mentorship')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-teal-500">
                    <div class="bg-teal-50 text-teal-600 p-4 rounded-2xl group-hover:bg-teal-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">🤝</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-teal-600 transition-colors">Mentorship</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Connect with your assigned mentor for guidance and planning.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('applications')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-start gap-4 border-t-4 border-t-purple-500">
                    <div class="bg-purple-50 text-purple-600 p-4 rounded-2xl group-hover:bg-purple-500 group-hover:text-white transition-all shadow-sm text-2xl shrink-0">📄</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-sm group-hover:text-purple-600 transition-colors">Special Applications</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Submit leave requests, batch transfer forms, or official queries.</p>
                    </div>
                </button>

            </div>
        </section>

    </main>

    <div class="w-full text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.4em] mt-6 absolute bottom-6">
        Minerva Study Circle Engine
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Authentication Security Check
            const isAuth = sessionStorage.getItem('minervaStudentAuth');
            if (!isAuth || isAuth !== 'true') {
                window.location.replace('student-login.html');
                return;
            }

            // 2. Parse Student Data from Login
            const rawData = sessionStorage.getItem('minervaStudentData');
            if (rawData) {
                try {
                    const stu = JSON.parse(rawData);
                    
                    // Populate Name
                    document.getElementById('stu-name').innerText = stu.name || "Student Name";
                    
                    // Smart S/O or D/O formatting
                    let parentText = "";
                    if (stu.gender && stu.gender.toUpperCase() === 'F') {
                        parentText = `D/O ${stu.fatherName || 'N/A'}`;
                    } else {
                        parentText = `S/O ${stu.fatherName || 'N/A'}`;
                    }
                    if (stu.motherName) parentText += ` & ${stu.motherName}`;
                    document.getElementById('stu-parents').innerText = parentText;

                    // Populate Badges
                    document.getElementById('stu-roll').innerText = stu.rollNo || "N/A";
                    document.getElementById('stu-class').innerText = stu.className || "N/A";
                    document.getElementById('stu-sec').innerText = stu.section || "N/A";
                    
                    // Determine Branch (Fallback to GHUMARWIN if undefined)
                    let branchStr = "GHUMARWIN";
                    // If your login system injects center info into the data object:
                    if (stu.center) branchStr = stu.center.toUpperCase();
                    // Or if we can infer it from the document ID format later
                    document.getElementById('stu-branch').innerText = branchStr;

                    // Generate Dynamic Profile Photo Initials
                    const nameParts = (stu.name || "S").trim().split(' ');
                    let initials = nameParts[0].charAt(0);
                    if (nameParts.length > 1) {
                        initials += nameParts[nameParts.length - 1].charAt(0);
                    }
                    document.getElementById('stu-photo-initials').innerText = initials.toUpperCase();

                } catch (e) {
                    console.error("Error parsing student data", e);
                }
            } else {
                // Failsafe if data is missing
                window.location.replace('student-login.html');
            }
        });

        function logout() {
            sessionStorage.removeItem('minervaStudentAuth');
            sessionStorage.removeItem('minervaStudentData');
            window.location.replace('student-login.html');
        }

        function handleNavigation(targetModule) {
            // Placeholder dynamic router
            alert(`🚀 MODULE REDIRECT\n\nConnecting to the [${targetModule.toUpperCase()}] engine...\n\n(Target: student-${targetModule}.html)`);
            // window.location.href = `student-${targetModule}.html`;
        }
    </script>
</body>
</html>
