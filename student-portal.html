    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function openCalendarModal() { document.getElementById('calendar-modal').classList.replace('hidden', 'flex'); }
        function closeCalendarModal() { document.getElementById('calendar-modal').classList.replace('flex', 'hidden'); }

        async function fetchStudentHolidays(studentCenter, studentClass, studentSection) {
            try {
                const prefix = studentCenter === "DHARAMSHALA" ? "dharamshala_" : "";
                const snap = await db.collection(prefix + "school_holidays").get();
                
                const today = new Date();
                const todayIso = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
                
                // Get the date 7 days from now for the live ticker
                const nextWeek = new Date();
                nextWeek.setDate(today.getDate() + 7);
                const nextWeekIso = new Date(nextWeek.getTime() - (nextWeek.getTimezoneOffset() * 60000)).toISOString().split('T')[0];

                let validEvents = [];
                let tickerMessages = [];

                snap.docs.forEach(doc => {
                    const data = doc.data();
                    if (data.endDate < todayIso && data.startDate < todayIso) return; // Skip past events
                    
                    const targetCls = `${studentClass}|${studentSection}`;
                    const matchesClass = data.targetClasses.some(tc => {
                        if(tc === 'ALL') return true;
                        const parts = tc.split('|');
                        const tcNorm = parts[0].replace(/[^a-zA-Z0-9]/g, "").toLowerCase() + (parts[1] ? '|' + parts[1].replace(/[^a-zA-Z0-9]/g, "").toLowerCase() : '');
                        const stuNorm = studentClass.replace(/[^a-zA-Z0-9]/g, "").toLowerCase() + '|' + studentSection.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                        return tcNorm === stuNorm || parts[0].replace(/[^a-zA-Z0-9]/g, "").toLowerCase() === studentClass.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                    });

                    if (matchesClass) {
                        validEvents.push(data);
                        // If it's happening within the next 7 days, add it to the live ticker
                        if (data.startDate <= nextWeekIso) {
                            let dateLabel = data.startDate === data.endDate ? new Date(data.startDate).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'}) : `${new Date(data.startDate).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})} to ${new Date(data.endDate).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})}`;
                            let typePrefix = data.type === 'EVENT' ? 'Event' : 'Holiday';
                            tickerMessages.push(`⭐ ${dateLabel}: ${data.reason} (${typePrefix})`);
                        }
                    }
                });

                // Update Ticker
                if (tickerMessages.length > 0) {
                    document.getElementById('holiday-ticker-track').innerText = tickerMessages.join("    |    ");
                    document.getElementById('holiday-ticker-container').classList.remove('hidden');
                }

                // Update Modal List
                const list = document.getElementById('calendar-events-list');
                if (validEvents.length === 0) {
                    list.innerHTML = '<p class="text-xs text-slate-400 font-bold italic text-center py-10">No upcoming events scheduled for your class.</p>';
                    return;
                }

                validEvents.sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
                
                list.innerHTML = validEvents.map(h => {
                    const dateStr = h.startDate === h.endDate ? new Date(h.startDate).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'long', year: 'numeric'}) : `${new Date(h.startDate).toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})} to ${new Date(h.endDate).toLocaleDateString('en-GB', {day: 'numeric', month: 'long', year: 'numeric'})}`;
                    const timeStr = h.isFullDay ? "Full Day" : `${h.startTime} - ${h.endTime}`;
                    
                    let typeBadge = h.type === 'EVENT' ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-rose-100 text-rose-700 border-rose-200';
                    let suspendBadge = h.suspendClasses ? '<span class="bg-rose-50 text-rose-600 px-2 py-0.5 rounded text-[9px] font-bold border border-rose-100">Classes Suspended</span>' : '<span class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded text-[9px] font-bold border border-emerald-100">Regular Classes</span>';

                    return `
                    <div class="flex flex-col sm:flex-row justify-between sm:items-center bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm gap-3 hover:border-blue-300 transition-colors">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[9px] font-black px-2 py-0.5 rounded uppercase tracking-widest border ${typeBadge}">${h.type}</span>
                                <span class="text-[10px] font-black text-slate-700 tracking-widest">${dateStr}</span>
                            </div>
                            <h4 class="font-black text-slate-900 text-sm uppercase mt-1">${h.reason}</h4>
                            <div class="flex flex-wrap gap-2 mt-2">
                                <span class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded text-[9px] font-bold border border-slate-300">${timeStr}</span>
                                ${suspendBadge}
                            </div>
                        </div>
                    </div>`;
                }).join('');

            } catch (e) {
                console.error("Failed to load events", e);
                document.getElementById('calendar-events-list').innerHTML = '<p class="text-xs text-rose-500 font-bold italic text-center py-10">Error loading calendar data.</p>';
            }
        }

       document.addEventListener("DOMContentLoaded", () => {
            // 1. Authentication Security Check
            const isAuth = sessionStorage.getItem('minervaStudentAuth');
            const localToken = sessionStorage.getItem('minervaSessionToken');
            if (!isAuth || isAuth !== 'true') {
                window.location.replace('student-login.html');
                return;
            }

            // 2. Parse Student Data from Login
            const rawData = sessionStorage.getItem('minervaStudentData');
            if (rawData) {
                try {
                    const stu = JSON.parse(rawData);
                    
                    // --- REAL-TIME SINGLE DEVICE ENFORCEMENT ---
                    const branchPrefix = (stu.center || "").toUpperCase().includes('DHARAMSHALA') ? 'dharamshala_' : '';
                    const stuId = stu.id || stu.uid || stu.docId;
                    if (stuId) {
                        db.collection(branchPrefix + "students").doc(stuId).onSnapshot(doc => {
                            if (doc.exists) {
                                const dbToken = doc.data().currentSessionToken;
                                // If the database token changed, it means they logged in elsewhere!
                                if (dbToken && localToken && dbToken !== localToken) {
                                    alert("⚠️ Security Alert: Your account was just logged in from another device.\n\nYou are being securely logged out from this device to protect your account.");
                                    logout();
                                }
                            }
                        });
                    }
                    // -------------------------------------------
                    
                    // Populate Name
                    document.getElementById('stu-name').innerText = stu.name || "Student Name";
                    
                    // Smart S/O or D/O formatting
                    let parentText = "";
                    if (stu.gender && stu.gender.toUpperCase() === 'F') {
                        parentText = `D/O ${stu.fatherName || 'N/A'}`;
                    } else {
                        parentText = `S/O ${stu.fatherName || 'N/A'}`;
                    }
                    if (stu.motherName) parentText += ` & ${stu.motherName}`;
                    document.getElementById('stu-parents').innerText = parentText;

                    // Populate Badges
                    document.getElementById('stu-roll').innerText = stu.rollNo || "N/A";
                    document.getElementById('stu-class').innerText = stu.className || "N/A";
                    document.getElementById('stu-sec').innerText = stu.section || "N/A";
                    
                    // Determine Branch (Fallback to GHUMARWIN if undefined)
                    let branchStr = "GHUMARWIN";
                    if (stu.center) branchStr = stu.center.toUpperCase();
                    document.getElementById('stu-branch').innerText = branchStr;

                   // Generate Dynamic Profile Photo Initials
                    const nameParts = (stu.name || "S").trim().split(' ');
                    let initials = nameParts[0].charAt(0);
                    if (nameParts.length > 1) {
                        initials += nameParts[nameParts.length - 1].charAt(0);
                    }
                    document.getElementById('stu-photo-initials').innerText = initials.toUpperCase();

                    // Fetch and display Calendar Events tailored to this specific student
                    fetchStudentHolidays(branchStr, stu.className || "", stu.section || "");

                } catch (e) {
                    console.error("Error parsing student data", e);
                }
            } else {
                // Failsafe if data is missing
                window.location.replace('student-login.html');
            }
        });

       function logout() {
            sessionStorage.removeItem('minervaStudentAuth');
            sessionStorage.removeItem('minervaStudentData');
            sessionStorage.removeItem('minervaSessionToken');
            window.location.replace('student-login.html');
        }

      function handleNavigation(targetModule) {
            // Directly navigate to the respective student module file
            window.location.href = `student-${targetModule}.html`;
        }
    </script>
</body>
