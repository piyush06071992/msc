<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Student Portal</title>
    <script src="tailwind-engine.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .portal-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .portal-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.08);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-blue-50 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-5%] left-[-5%] w-96 h-96 bg-indigo-50 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <header class="bg-white border-b sticky top-0 z-40 px-4 sm:px-8 py-4 flex justify-between items-center shadow-sm min-h-[4.5rem]">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-slate-900 rounded-xl shadow-inner">
                <img src="logo.png?v=2" alt="Minerva Logo" class="w-7 h-7 object-contain" onerror="this.src='https://via.placeholder.com/30?text=M'">
            </div>
            <div>
                <h1 class="text-md sm:text-lg font-black tracking-tighter uppercase text-slate-900 leading-none">Minerva <span class="text-blue-600">Student</span></h1>
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-0.5">Workspace v2.0</p>
            </div>
        </div>
        <button onclick="window.location.href='student-login.html'" class="text-[10px] font-black text-rose-600 uppercase tracking-widest bg-rose-50 border border-rose-100 px-4 py-2.5 rounded-xl hover:bg-rose-100 transition-colors shadow-sm">
            🚪 Logout
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8 space-y-8">
        
        <section class="glass-card rounded-[2rem] p-6 sm:p-8 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative overflow-hidden border border-white">
            <div class="absolute top-0 left-0 w-3 h-full bg-blue-600"></div>
            <div class="flex items-center gap-4 sm:gap-6 pl-2">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-blue-600 to-indigo-700 rounded-[1.25rem] shadow-md flex items-center justify-center text-white text-2xl sm:text-3xl font-black italic select-none">
                    PS
                </div>
                <div>
                    <div class="flex flex-wrap items-center gap-2">
                        <h2 class="text-xl sm:text-2xl font-black tracking-tight text-slate-900">Pranav Sharma</h2>
                        <span class="text-[9px] font-black text-blue-700 bg-blue-50 border border-blue-200 rounded px-2 py-0.5 uppercase tracking-wider shadow-sm">📍 Ghumarwin Center</span>
                    </div>
                    <div class="grid grid-cols-2 sm:flex sm:items-center gap-x-4 gap-y-1 mt-2 text-xs font-bold text-slate-500 uppercase tracking-wider">
                        <div><span class="text-slate-400">Roll No:</span> <span class="text-slate-800 font-extrabold font-mono">MSC-2026-882</span></div>
                        <div class="hidden sm:block text-slate-300">•</div>
                        <div><span class="text-slate-400">Batch:</span> <span class="text-slate-800 font-extrabold">Warrior J1</span></div>
                        <div class="hidden sm:block text-slate-300">•</div>
                        <div><span class="text-slate-400">Stream:</span> <span class="text-slate-800 font-extrabold text-blue-600">JEE Advanced</span></div>
                    </div>
                </div>
            </div>
            
            <div class="w-full md:w-auto bg-slate-50 border border-slate-100 p-4 rounded-2xl md:min-w-[200px] shadow-inner self-stretch md:self-auto flex flex-col justify-center">
                <div class="flex justify-between items-center text-[10px] font-black uppercase text-slate-400 mb-1 tracking-widest">
                    <span>Attendance Rate</span>
                    <span class="text-emerald-600 font-mono">92.4%</span>
                </div>
                <div class="h-2 bg-slate-200 rounded-full overflow-hidden shadow-inner">
                    <div class="h-full bg-emerald-500 rounded-full" style="width: 92.4%"></div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-[0.25em] text-slate-400 mb-2 pl-1">Daily Operations</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                
                <button onclick="handleNavigation('lesson-planner')" class="portal-btn p-5 sm:p-6 rounded-[2rem] text-left group flex items-start gap-4 border-l-4 border-l-blue-500">
                    <div class="bg-blue-50 text-blue-600 p-3.5 rounded-2xl group-hover:bg-blue-600 group-hover:text-white transition-all shadow-sm text-xl shrink-0">📅</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-xs sm:text-sm group-hover:text-blue-700 transition-colors">Lesson Planner</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">View daily lecture logs, chapter start frames, and absolute curriculum goals.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('attendance')" class="portal-btn p-5 sm:p-6 rounded-[2rem] text-left group flex items-start gap-4 border-l-4 border-l-emerald-500">
                    <div class="bg-emerald-50 text-emerald-600 p-3.5 rounded-2xl group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm text-xl shrink-0">📊</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-xs sm:text-sm group-hover:text-emerald-700 transition-colors">Attendance History</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Monitor your calendar compliance metrics, check-in intervals, and holiday buffers.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('apply-leave')" class="portal-btn p-5 sm:p-6 rounded-[2rem] text-left group flex items-start gap-4 border-l-4 border-l-purple-500">
                    <div class="bg-purple-50 text-purple-600 p-3.5 rounded-2xl group-hover:bg-purple-600 group-hover:text-white transition-all shadow-sm text-xl shrink-0">📝</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-xs sm:text-sm group-hover:text-purple-700 transition-colors">Apply Leave</h4>
                        <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-widest leading-relaxed">Securely submit standard medical or emergency absence files directly to administration.</p>
                    </div>
                </button>

            </div>
        </section>

        <section class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-[0.25em] text-slate-400 mb-2 pl-1">Academic Prep Engine</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <button onclick="handleNavigation('performance')" class="portal-btn p-5 rounded-[2rem] text-left group flex flex-col justify-between border-t-4 border-t-amber-500 h-full gap-4">
                    <div class="flex items-center justify-between w-full">
                        <div class="bg-amber-50 text-amber-600 p-3 rounded-xl shadow-sm text-lg">📉</div>
                        <span class="text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded font-black uppercase tracking-wider">Analytics</span>
                    </div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-xs group-hover:text-amber-600 transition-colors">Academic Performance</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-1.5 uppercase tracking-widest leading-relaxed">Track score variances, percentile markers, and syllabus gap analytics across modules.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('dpp')" class="portal-btn p-5 rounded-[2rem] text-left group flex flex-col justify-between border-t-4 border-t-teal-500 h-full gap-4">
                    <div class="flex items-center justify-between w-full">
                        <div class="bg-teal-50 text-teal-600 p-3 rounded-xl shadow-sm text-lg">📚</div>
                        <span class="text-[10px] bg-teal-50 text-teal-700 border border-teal-200 px-2 py-0.5 rounded font-black uppercase tracking-wider">DPP HUB</span>
                    </div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-xs group-hover:text-teal-600 transition-colors">Daily Practice Problems</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-1.5 uppercase tracking-widest leading-relaxed">Instantly access subject sheet arrays, assignment sets, and target coaching keys.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('cbt')" class="portal-btn p-5 rounded-[2rem] text-left group flex flex-col justify-between border-t-4 border-t-sky-500 h-full gap-4">
                    <div class="flex items-center justify-between w-full">
                        <div class="bg-sky-50 text-sky-600 p-3 rounded-xl shadow-sm text-lg">✍️</div>
                        <span class="text-[10px] bg-sky-50 text-sky-700 border border-sky-200 px-2 py-0.5 rounded font-black uppercase tracking-wider">CBT Live</span>
                    </div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-xs group-hover:text-sky-600 transition-colors">Online Mock Tests</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-1.5 uppercase tracking-widest leading-relaxed">Launch strict, computer-based national simulators tailored precisely to NTA standards.</p>
                    </div>
                </button>

                <button onclick="handleNavigation('videos')" class="portal-btn p-5 rounded-[2rem] text-left group flex flex-col justify-between border-t-4 border-t-rose-500 h-full gap-4">
                    <div class="flex items-center justify-between w-full">
                        <div class="bg-rose-50 text-rose-600 p-3 rounded-xl shadow-sm text-lg">🎥</div>
                        <span class="text-[10px] bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded font-black uppercase tracking-wider">Archive</span>
                    </div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-xs group-hover:text-rose-600 transition-colors">Lecture Video Solutions</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-1.5 uppercase tracking-widest leading-relaxed">Browse high-fidelity lecture playbacks and step-by-step doubt answer sequences.</p>
                    </div>
                </button>

            </div>
        </section>

        <section class="space-y-4">
            <h3 class="text-xs font-black uppercase tracking-[0.25em] text-slate-400 mb-2 pl-1">Support & Infrastructure</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                
                <button onclick="handleNavigation('doubt-counter')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-center gap-4">
                    <div class="bg-indigo-50 text-indigo-600 p-3 rounded-xl text-lg group-hover:bg-indigo-600 group-hover:text-white transition-all shadow-sm shrink-0">❓</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-[11px] group-hover:text-indigo-600 transition-colors">Book Doubt Counter</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-0.5 uppercase tracking-widest">Reserve 1-on-1 expert sessions</p>
                    </div>
                </button>

                <button onclick="handleNavigation('feedback')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-center gap-4">
                    <div class="bg-cyan-50 text-cyan-600 p-3 rounded-xl text-lg group-hover:bg-cyan-600 group-hover:text-white transition-all shadow-sm shrink-0">⚙️</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-[11px] group-hover:text-cyan-600 transition-colors">Teacher Feedback</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-0.5 uppercase tracking-widest">Submit regular routine matrix audits</p>
                    </div>
                </button>

                <button onclick="handleNavigation('digital-id')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-center gap-4">
                    <div class="bg-violet-50 text-violet-600 p-3 rounded-xl text-lg group-hover:bg-violet-600 group-hover:text-white transition-all shadow-sm shrink-0">🪪</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-[11px] group-hover:text-violet-600 transition-colors">Digital ID Badge</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-0.5 uppercase tracking-widest">Instant QR generation for center entry</p>
                    </div>
                </button>

                <button onclick="handleNavigation('fee-ledger')" class="portal-btn p-5 rounded-[2rem] text-left group flex items-center gap-4">
                    <div class="bg-emerald-50 text-emerald-600 p-3 rounded-xl text-lg group-hover:bg-emerald-600 group-hover:text-white transition-all shadow-sm shrink-0">💳</div>
                    <div>
                        <h4 class="font-black text-slate-800 uppercase tracking-wider text-[11px] group-hover:text-emerald-600 transition-colors">Fee Ledger</h4>
                        <p class="text-[9px] font-bold text-slate-400 mt-0.5 uppercase tracking-widest">Review installments and print receipts</p>
                    </div>
                </button>

            </div>
        </section>

    </main>

    <div class="w-full text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.4em] mt-6 absolute bottom-6">
        Minerva Study Circle Engine
    </div>

    <script>
        function handleNavigation(targetModule) {
            // Dynamic simulation logger for management demonstrations
            alert(`🚀 SIMULATED REDIRECT\n\nRouting engine connecting to module token: [${targetModule.toUpperCase()}]\n\nTarget file reference: student-${targetModule}.html`);
        }
    </script>
</body>
</html>
