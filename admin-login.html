<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Minerva</title>
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#1e40af">
    <script src="tailwind-engine.js"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-full -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
    </div>

    <div class="w-full max-w-md glass-card p-8 sm:p-10 rounded-[2rem] shadow-2xl">
        
        <div class="text-center mb-8">
            <img src="/logo.png?v=2" alt="Minerva Logo" class="w-20 h-20 mx-auto rounded-2xl shadow-md mb-4 bg-white p-1 object-contain">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Admin Gateway</h1>
            <p class="text-sm text-slate-500 mt-1">Authorized personnel only</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Admin Email</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all shadow-sm">
            </div>

            <div class="relative">
                <label class="block text-sm font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all shadow-sm pr-12">
                
                <button type="button" id="togglePassword" class="absolute right-3 top-[34px] text-slate-400 hover:text-blue-600 transition-colors p-1">
                    <svg id="eye-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>

            <p id="error-msg" class="text-red-500 text-sm font-semibold text-center hidden">Incorrect email or password.</p>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-md transform hover:-translate-y-0.5">
                Secure Login
            </button>
        </form>
        
        <button onclick="window.location.href='index.html'" class="w-full mt-4 py-2 text-sm font-semibold text-slate-500 hover:text-slate-800 transition-colors">
            ← Back to Main Portal
        </button>
    </div>

    <script>
        // Password Visibility Toggle Logic
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        togglePassword.addEventListener('click', function () {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            // Change icon from 'eye' to 'eye-slash'
            if (isPassword) {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            } else {
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        });

        // Admin Verification Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const pwd = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // The registered Admins
            const admins = [
                { email: 'info@minerva.academy', password: '7021143601', name: 'Prashant Patial' },
                { email: 'rakeshchandel1@gmail.com', password: '9805520300', name: 'Rakesh Chandel' }
            ];

            const foundAdmin = admins.find(admin => admin.email === email && admin.password === pwd);

            if (foundAdmin) {
                // Lock opened: Save session and redirect
                sessionStorage.setItem('minervaAdminAuth', 'true');
                sessionStorage.setItem('minervaAdminName', foundAdmin.name);
                window.location.href = 'admin.html';
            } else {
                // Lock stays closed
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
