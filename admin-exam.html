<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Exam Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .input-field { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 2px solid #e2e8f0; outline: none; font-weight: 700; color: #334155; transition: all 0.2s; }
        .input-field:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1); }
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #f97316; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-rose-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex flex-col sm:flex-row sm:items-center justify-between shadow-xl sticky top-0 z-[100] gap-4 border-b-4 border-orange-500">
        <div class="flex items-center gap-4 w-full sm:w-auto">
            <button onclick="window.location.href='admin.html'" class="p-3 sm:p-4 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors shadow-sm shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex-1">
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none">Exam Manager</h1>
                <div class="flex items-center gap-2 mt-1">
                    <p class="text-xs text-orange-300 font-bold uppercase tracking-widest">Master Scheduler</p>
                    <span class="text-slate-400">|</span>
                    <select id="global-center-switch" onchange="switchAdminCenter(this.value)" class="text-[10px] font-black text-indigo-900 bg-indigo-50 border border-indigo-200 outline-none rounded px-2 py-0.5 cursor-pointer uppercase tracking-widest shadow-sm">
                        <option value="GHUMARWIN">📍 Ghumarwin</option>
                        <option value="DHARAMSHALA">📍 Dharamshala</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 mt-4 space-y-6 sm:space-y-8">
        
        <div class="glass-card p-6 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-100 pb-4">
                <span class="text-3xl bg-orange-50 p-3 rounded-2xl border border-orange-100">📝</span>
                <div>
                    <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight">Schedule New Exam</h2>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Set date, type, and target classes</p>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Exam Date</label>
                    <input type="date" id="exam-date" class="input-field cursor-pointer">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Exam Type</label>
                    <select id="exam-type" class="input-field cursor-pointer">
                        <option value="UT">Unit Test (UT)</option>
                        <option value="OT">Objective Test (OT)</option>
                        <option value="TERMINAL">Terminal Exam</option>
                        <option value="PREBOARD">Pre-Board</option>
                    </select>
                </div>
            </div>

            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 ml-1 mt-6 border-t border-slate-100 pt-6">Select Target Classes & Sections</label>
            <div id="class-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="col-span-full text-center py-10"><span class="loader border-t-orange-500"></span></div>
            </div>

            <button onclick="saveExamSchedule()" id="save-btn" class="w-full mt-8 bg-orange-600 text-white font-black py-4 rounded-[1.5rem] uppercase tracking-widest text-sm shadow-xl hover:bg-orange-500 transition-all active:scale-95 flex justify-center items-center gap-2">
                💾 Save Exam Schedule
            </button>
        </div>

        <div class="glass-card p-6 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-100 pb-4">
                <span class="text-3xl bg-blue-50 p-3 rounded-2xl border border-blue-100">📅</span>
                <div class="flex-1">
                    <h2 class="text-xl font-black text-slate-900 uppercase tracking-tight">Active Exam Schedules</h2>
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Upcoming and past exams</p>
                </div>
            </div>

            <div id="exam-list" class="space-y-4 max-h-[500px] overflow-y-auto custom-scroll pr-2">
                <div class="text-center py-10"><span class="loader border-t-blue-500"></span></div>
            </div>
        </div>

    </main>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- AUTH & CENTER LOGIC ---
        const authStatus = sessionStorage.getItem('minervaAdminAuth');
        if (authStatus !== 'true') window.location.replace('admin-login.html');

        let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
        sessionStorage.setItem('minervaAdminCenter', activeCenter);
        document.getElementById('global-center-switch').value = activeCenter;

        function switchAdminCenter(centerName) {
            sessionStorage.setItem('minervaAdminCenter', centerName);
            window.location.reload();
        }

        function getCollectionName(baseName) {
            return activeCenter === "GHUMARWIN" ? baseName : `${activeCenter.toLowerCase()}_${baseName}`;
        }

        // --- CORE DATA ---
        let structureData = [];

        window.onload = async () => {
            // Set default date to today
            document.getElementById('exam-date').value = new Date().toISOString().split('T')[0];
            
            await fetchStructure();
            listenForExams();
        };

        async function fetchStructure() {
            try {
                const snap = await db.collection("institute_structure").get();
                const grouped = {};
                
                snap.docs.forEach(doc => {
                    const data = doc.data();
                    if (!grouped[data.className]) grouped[data.className] = [];
                    grouped[data.className].push(data.sectionName);
                });

                const container = document.getElementById('class-container');
                container.innerHTML = '';

                Object.keys(grouped).sort().forEach(className => {
                    const sections = grouped[className].sort();
                    const safeClassId = className.replace(/[^a-zA-Z0-9]/g, '_');

                    let secHtml = sections.map(sec => `
                        <label class="flex items-center gap-3 p-2 bg-white border border-slate-200 rounded-lg cursor-pointer hover:bg-orange-50 hover:border-orange-200 transition-colors shadow-sm">
                            <input type="checkbox" class="sec-cb sec-group-${safeClassId} w-4 h-4 accent-orange-600 cursor-pointer" value="${className}|${sec}" data-class="${className}" onchange="handleSectionTick('${safeClassId}')">
                            <span class="text-xs font-black text-slate-700 uppercase tracking-tight">Sec ${sec}</span>
                        </label>
                    `).join('');

                    container.innerHTML += `
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col h-full">
                            <label class="flex justify-between items-center p-4 bg-slate-100 cursor-pointer hover:bg-slate-200 transition-colors border-b border-slate-200 shrink-0">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" id="master-${safeClassId}" class="w-5 h-5 accent-orange-600 cursor-pointer" onchange="toggleEntireClass(this, '${safeClassId}')">
                                    <span class="text-sm font-black text-slate-800 uppercase tracking-widest">Class ${className}</span>
                                </div>
                            </label>
                            <div class="p-3 grid grid-cols-2 gap-2 flex-1 content-start bg-white">
                                ${secHtml}
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error fetching structure:", e);
                document.getElementById('class-container').innerHTML = '<p class="text-red-500 font-bold p-4">Error loading classes.</p>';
            }
        }

        // --- CHECKBOX LOGIC ---
        function toggleEntireClass(masterCb, classId) {
            document.querySelectorAll(`.sec-group-${classId}`).forEach(cb => cb.checked = masterCb.checked);
        }

        function handleSectionTick(classId) {
            const cbs = document.querySelectorAll(`.sec-group-${classId}`);
            const master = document.getElementById(`master-${classId}`);
            const allChecked = Array.from(cbs).every(cb => cb.checked);
            const someChecked = Array.from(cbs).some(cb => cb.checked);
            master.checked = allChecked;
            master.indeterminate = !allChecked && someChecked;
        }

        // --- SAVE EXAM LOGIC ---
        async function saveExamSchedule() {
            const date = document.getElementById('exam-date').value;
            const type = document.getElementById('exam-type').value;
            const selectedCbs = Array.from(document.querySelectorAll('.sec-cb:checked'));

            if (!date) return alert("Please select an Exam Date.");
            if (selectedCbs.length === 0) return alert("Please select at least one class/section.");

            const btn = document.getElementById('save-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Saving...";
            btn.disabled = true;

            try {
                // Group selections by class for cleaner storage
                const targetGroups = {};
                selectedCbs.forEach(cb => {
                    const [cName, sName] = cb.value.split('|');
                    if (!targetGroups[cName]) targetGroups[cName] = [];
                    targetGroups[cName].push(sName);
                });

                const targetArray = Object.keys(targetGroups).map(cName => ({
                    className: cName,
                    sections: targetGroups[cName]
                }));

                const payload = {
                    date: date,
                    type: type,
                    targets: targetArray,
                    timestamp: Date.now()
                };

                // Save to Firebase
                await getCollection("exam_schedules").add(payload);

                alert("✅ Exam Schedule Saved Successfully!");
                
                // Clear checkboxes
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                    cb.indeterminate = false;
                });

            } catch (error) {
                alert("Error saving exam: " + error.message);
                console.error(error);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // --- FETCH & RENDER EXAMS LIST ---
        function listenForExams() {
            getCollection("exam_schedules")
                .orderBy("date", "desc")
                .onSnapshot(snap => {
                    const listContainer = document.getElementById('exam-list');
                    
                    if (snap.empty) {
                        listContainer.innerHTML = `
                            <div class="bg-slate-50 border-2 border-dashed border-slate-300 p-8 rounded-2xl text-center">
                                <p class="text-2xl mb-2">📭</p>
                                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">No Exams Scheduled Yet</p>
                            </div>`;
                        return;
                    }

                    let html = "";
                    snap.forEach(doc => {
                        const data = doc.data();
                        const docId = doc.id;
                        
                        // Format the date nicely
                        const dateObj = new Date(data.date);
                        const prettyDate = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                        
                        // Determine color tag based on type
                        let typeColor = "bg-slate-100 text-slate-700 border-slate-200";
                        if (data.type === 'UT') typeColor = "bg-blue-100 text-blue-700 border-blue-200";
                        if (data.type === 'OT') typeColor = "bg-amber-100 text-amber-700 border-amber-200";
                        if (data.type === 'TERMINAL' || data.type === 'PREBOARD') typeColor = "bg-rose-100 text-rose-700 border-rose-200";

                        // Build the target string (e.g. Class 11 (A, B) | Class 12 (A))
                        let targetString = data.targets.map(t => `<span class="font-black text-slate-700">${t.className}</span> <span class="text-slate-400">(${t.sections.join(', ')})</span>`).join('<span class="mx-2 text-slate-300">|</span>');

                        html += `
                            <div class="bg-white border border-slate-200 p-4 sm:p-5 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-300 transition-all flex flex-col sm:flex-row justify-between sm:items-center gap-4 group">
                                <div>
                                    <div class="flex items-center gap-3 mb-2">
                                        <h3 class="font-black text-slate-900 text-lg uppercase tracking-tighter">${prettyDate}</h3>
                                        <span class="px-2.5 py-0.5 rounded text-[10px] font-black uppercase tracking-widest border shadow-sm ${typeColor}">${data.type}</span>
                                    </div>
                                    <div class="text-[11px] uppercase tracking-widest leading-relaxed">
                                        ${targetString}
                                    </div>
                                </div>
                                <button onclick="deleteExam('${docId}')" class="bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white px-4 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest transition-colors shadow-sm shrink-0 border border-rose-200 hover:border-transparent">
                                    🗑️ Delete
                                </button>
                            </div>
                        `;
                    });

                    listContainer.innerHTML = html;
                }, error => {
                    console.error("List Listener Error:", error);
                    document.getElementById('exam-list').innerHTML = '<p class="text-red-500 font-bold">Error loading schedule list.</p>';
                });
        }

        async function deleteExam(docId) {
            if (!confirm("Are you sure you want to delete this scheduled exam?")) return;
            try {
                await getCollection("exam_schedules").doc(docId).delete();
            } catch (e) {
                alert("Error deleting record: " + e.message);
            }
        }
    </script>
</body>
</html>
