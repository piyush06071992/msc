<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Exam Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .input-field { width: 100%; padding: 1rem; border-radius: 1rem; border: 2px solid #e2e8f0; outline: none; font-weight: 800; color: #334155; transition: all 0.2s; font-size: 1.1rem; cursor: pointer; }
        .input-field:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1); }
        .loader { border: 4px solid #f1f5f9; border-top: 4px solid #f97316; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Extra large checkboxes for mobile tapping */
        input[type="checkbox"] { width: 1.5rem; height: 1.5rem; cursor: pointer; accent-color: #f97316; flex-shrink: 0; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden">

    <!-- Background Gradients -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-rose-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <!-- Header -->
    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex flex-col sm:flex-row sm:items-center justify-between shadow-xl sticky top-0 z-[100] gap-4 border-b-4 border-orange-500">
        <div class="flex items-center gap-4 w-full sm:w-auto">
            <button onclick="window.location.href='admin.html'" class="p-3 sm:p-4 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors shadow-sm shrink-0">
                <svg class="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex-1">
                <h1 class="text-2xl sm:text-3xl font-black tracking-widest uppercase leading-none">Exam Manager</h1>
                <div class="flex items-center gap-2 mt-1.5">
                    <select id="global-center-switch" onchange="switchAdminCenter(this.value)" class="text-xs sm:text-sm font-black text-indigo-900 bg-indigo-50 border border-indigo-200 outline-none rounded px-3 py-1 cursor-pointer uppercase tracking-widest shadow-sm">
                        <option value="GHUMARWIN">📍 Ghumarwin</option>
                        <option value="DHARAMSHALA">📍 Dharamshala</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto justify-end">
            <button id="auth-btn" onclick="openAuthModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-xs sm:text-sm transition-colors shadow-md border border-indigo-500 flex items-center gap-2">
                🔐 Delegations
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8 mt-2 space-y-6 sm:space-y-8">
        
        <!-- ========================================== -->
        <!-- STEP 1: THE EXAM PACKET BUILDER            -->
        <!-- ========================================== -->
        <div class="glass-card p-5 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                <span class="text-3xl sm:text-4xl bg-orange-50 p-4 rounded-2xl border border-orange-200">➕</span>
                <div>
                    <h2 class="text-xl sm:text-3xl font-black text-slate-900 uppercase tracking-tight">Add Exam to Cart</h2>
                    <p class="text-sm sm:text-base font-bold text-slate-500 uppercase tracking-widest mt-1">Build an exam packet for a specific date</p>
                </div>
            </div>

            <!-- 1. DATE & TYPE -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8 bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-inner">
                <div>
                    <label class="block text-sm font-black text-slate-600 uppercase tracking-widest mb-2 ml-1">1. Select Date</label>
                    <input type="date" id="exam-date" class="input-field shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-black text-slate-600 uppercase tracking-widest mb-2 ml-1">2. Select Exam Type</label>
                    <select id="exam-type" class="input-field shadow-sm">
                        <option value="UT">Unit Test (UT)</option>
                        <option value="OT">Objective Test (OT)</option>
                        <option value="Terminal Exams">Terminal Exams</option>
                        <option value="Preboard">Preboard</option>
                        <option value="Board Exam">Board Exam</option>
                    </select>
                </div>
            </div>

            <!-- 2. SUBJECTS -->
            <div class="mb-8">
                <div class="flex justify-between items-center mb-3 ml-1">
                    <label class="block text-sm font-black text-slate-600 uppercase tracking-widest">3. Select Subjects Tested</label>
                    <button onclick="document.querySelectorAll('.sub-cb').forEach(cb => cb.checked = true)" class="text-sm font-black text-indigo-600 uppercase hover:text-indigo-800 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100 transition-colors">Select All</button>
                </div>
                <!-- Giant Checkbox Grid for easy mobile tapping -->
                <div id="subject-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-h-64 overflow-y-auto custom-scroll pr-2">
                    <div class="col-span-full text-center py-4 text-slate-400 font-bold text-sm">Loading Subjects...</div>
                </div>
            </div>

            <!-- 3. TARGET CLASSES -->
            <div>
                <div class="flex justify-between items-center mb-3 ml-1 border-t border-slate-200 pt-6">
                    <label class="block text-sm font-black text-slate-600 uppercase tracking-widest">4. Select Target Classes</label>
                </div>
                <div id="class-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                    <div class="col-span-full text-center py-10"><span class="loader border-t-orange-500"></span></div>
                </div>
            </div>

            <!-- 4. SAVE BUTTON -->
            <button onclick="saveExamPacket()" id="save-btn" class="w-full mt-10 bg-slate-900 text-white font-black py-5 sm:py-6 rounded-2xl uppercase tracking-widest text-lg sm:text-xl shadow-2xl hover:bg-orange-600 transition-all active:scale-95 flex justify-center items-center gap-3 border-2 border-slate-800 hover:border-orange-500">
                🛒 Add Exam to Cart
            </button>
        </div>

        <!-- ========================================== -->
        <!-- STEP 2: THE MULTICOLORED EXAM CART         -->
        <!-- ========================================== -->
        <div class="glass-card p-5 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                <span class="text-3xl sm:text-4xl bg-blue-50 p-4 rounded-2xl border border-blue-200">🛒</span>
                <div class="flex-1">
                    <h2 class="text-xl sm:text-3xl font-black text-slate-900 uppercase tracking-tight">Active Exam Cart</h2>
                    <p class="text-sm sm:text-base font-bold text-slate-500 uppercase tracking-widest mt-1">Upcoming scheduled exams</p>
                </div>
            </div>

            <div id="exam-cart-list" class="space-y-8">
                <div class="text-center py-10"><span class="loader border-t-blue-500"></span></div>
            </div>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- DELEGATION MODAL                           -->
    <!-- ========================================== -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 sm:p-8 bg-indigo-50 border-b border-indigo-100 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="font-black text-indigo-900 text-xl sm:text-2xl uppercase tracking-tighter">Exam Delegation</h3>
                    <p class="text-sm font-bold text-indigo-500 uppercase tracking-widest mt-1">Authorize staff to manage exams</p>
                </div>
                <button onclick="closeAuthModal()" class="bg-indigo-100 text-indigo-400 hover:bg-rose-100 hover:text-rose-600 w-12 h-12 rounded-full font-black text-2xl transition-colors flex items-center justify-center">✕</button>
            </div>
            
            <div class="p-6 sm:p-8 grid grid-cols-1 gap-5 bg-slate-50 border-b border-slate-200 shrink-0">
                <div>
                    <label class="block text-sm font-black text-slate-500 uppercase tracking-widest mb-2">1. Select Department</label>
                    <select id="auth-dept" onchange="populateAuthStaff()" class="input-field bg-white"></select>
                </div>
                <div>
                    <label class="block text-sm font-black text-slate-500 uppercase tracking-widest mb-2">2. Select Staff Member</label>
                    <select id="auth-staff" class="input-field bg-white disabled:opacity-50" disabled></select>
                </div>
                <button onclick="grantExamAuth()" class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black uppercase tracking-widest text-base shadow-lg hover:bg-indigo-700 transition-colors mt-2">Grant Exam Authority</button>
            </div>

            <div class="p-6 sm:p-8 flex-1 overflow-y-auto bg-white custom-scroll">
                <h4 class="font-black text-slate-800 uppercase tracking-widest text-sm mb-4 border-b pb-2">Authorized Exam Managers</h4>
                <div id="auth-list-container" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- AUTH & CENTER LOGIC ---
        const authStatus = sessionStorage.getItem('minervaAdminAuth');
        const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));

        // Allow Full Admins AND Delegated Staff
        if (authStatus !== 'true' && (!activeStaff || !activeStaff.canManageExams)) {
            window.location.replace('index.html');
        }

        let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
        sessionStorage.setItem('minervaAdminCenter', activeCenter);
        document.getElementById('global-center-switch').value = activeCenter;

        function switchAdminCenter(centerName) {
            sessionStorage.setItem('minervaAdminCenter', centerName);
            window.location.reload();
        }

        // CRITICAL FIX: Safe global collection fetcher
        function getCollection(name) {
            const globalCollections = ['staff_applications'];
            if (globalCollections.includes(name)) return db.collection(name);
            return activeCenter === "GHUMARWIN" ? db.collection(name) : db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        // --- CORE DATA ---
        let structureData = [];
        let allTeachers = [];
        const SPECIAL_SUBJECTS = ['BREAK', 'LUNCH BREAK', 'FRUIT BREAK', 'ASSEMBLY', 'EXAM', 'UT', 'OT', 'TERMINAL EXAMS', 'PREBOARD', 'BOARD EXAM', 'EVENT'];

        window.onload = async () => {
            // Pre-fill today's date
            const today = new Date();
            // Adjust to IST/Local to prevent timezone shifts
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().slice(0, 10);
            document.getElementById('exam-date').value = localISOTime;
            
            await Promise.all([fetchStructure(), fetchTeachers()]);
            populateSubjects();
            listenForExams();
        };

        // --- FETCHERS ---
        async function fetchTeachers() {
            try {
                const snap = await getCollection("staff_applications").where("status", "==", "approved").get();
                allTeachers = snap.docs.map(d => {
                    const data = d.data();
                    const det = data.details || {};
                    const deptKey = Object.keys(det).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                    return { 
                        id: d.id, 
                        email: data.email, 
                        details: det, 
                        dept: deptKey ? det[deptKey] : 'General',
                        canManageExams: data.canManageExams || false
                    };
                });
            } catch(e) { console.error("Error fetching teachers", e); }
        }

        async function fetchStructure() {
            try {
                const snap = await getCollection("institute_structure").orderBy("className").get();
                structureData = snap.docs.map(d => d.data());
                
                const grouped = {};
                structureData.forEach(st => {
                    if (!grouped[st.className]) grouped[st.className] = [];
                    grouped[st.className].push(st.sectionName);
                });

                const container = document.getElementById('class-container');
                container.innerHTML = '';

                Object.keys(grouped).sort().forEach(className => {
                    const sections = grouped[className].sort();
                    const safeClassId = className.replace(/[^a-zA-Z0-9]/g, '_');

                    let secHtml = sections.map(sec => `
                        <label class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-orange-50 hover:border-orange-400 transition-colors shadow-sm">
                            <input type="checkbox" class="sec-cb sec-group-${safeClassId}" value="${className}|${sec}" data-class="${className}" onchange="handleSectionTick('${safeClassId}')">
                            <span class="text-sm font-black text-slate-800 uppercase tracking-tight">Sec ${sec}</span>
                        </label>
                    `).join('');

                    container.innerHTML += `
                        <details class="bg-slate-50 border border-slate-200 rounded-2xl shadow-sm flex flex-col h-full group" open>
                            <summary class="flex justify-between items-center p-5 bg-slate-100 cursor-pointer hover:bg-slate-200 transition-colors border-b border-slate-200 shrink-0 outline-none rounded-t-2xl group-open:rounded-b-none rounded-b-2xl">
                                <div class="flex items-center gap-4">
                                    <input type="checkbox" id="master-${safeClassId}" class="w-6 h-6 accent-orange-600 cursor-pointer" onchange="toggleEntireClass(this, '${safeClassId}')" onclick="event.stopPropagation()">
                                    <span class="text-lg font-black text-slate-900 uppercase tracking-widest">Class ${className}</span>
                                </div>
                                <span class="text-slate-400 text-xl group-open:rotate-180 transition-transform">▼</span>
                            </summary>
                            <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-3 flex-1 content-start bg-white rounded-b-2xl">
                                ${secHtml}
                            </div>
                        </details>
                    `;
                });
            } catch (e) {
                console.error("Error fetching structure:", e);
                document.getElementById('class-container').innerHTML = '<p class="text-red-500 font-black p-4 text-center">Error loading classes.</p>';
            }
        }

        function populateSubjects() {
            let allSubjects = new Set();
            
            // Extract from Teachers
            allTeachers.forEach(t => {
                const depts = Array.isArray(t.dept) ? t.dept : [t.dept];
                depts.forEach(d => { if (d && d !== 'General') allSubjects.add(d.trim().toUpperCase()); });
            });
            
            // Extract from Classes
            structureData.forEach(st => {
                (st.subjects || []).forEach(s => allSubjects.add(s.trim().toUpperCase()));
            });

            const container = document.getElementById('subject-container');
            container.innerHTML = '';
            
            Array.from(allSubjects).sort().forEach(sub => {
                if(!SPECIAL_SUBJECTS.includes(sub)) {
                    container.innerHTML += `
                        <label class="flex items-center gap-3 p-4 bg-white border-2 border-slate-100 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-400 transition-all shadow-sm">
                            <input type="checkbox" class="sub-cb accent-indigo-600" value="${sub}">
                            <span class="text-sm font-black text-slate-800 uppercase tracking-tight truncate">${sub}</span>
                        </label>
                    `;
                }
            });
        }

        // --- CHECKBOX LOGIC ---
        function toggleEntireClass(masterCb, classId) {
            document.querySelectorAll(`.sec-group-${classId}`).forEach(cb => cb.checked = masterCb.checked);
        }

        function handleSectionTick(classId) {
            const cbs = document.querySelectorAll(`.sec-group-${classId}`);
            const master = document.getElementById(`master-${classId}`);
            const allChecked = Array.from(cbs).every(cb => cb.checked);
            const someChecked = Array.from(cbs).some(cb => cb.checked);
            master.checked = allChecked;
            master.indeterminate = !allChecked && someChecked;
        }

        // --- SAVE EXAM PACKET LOGIC ---
        async function saveExamPacket() {
            const date = document.getElementById('exam-date').value;
            const type = document.getElementById('exam-type').value;
            const selectedCbs = Array.from(document.querySelectorAll('.sec-cb:checked'));
            const selectedSubs = Array.from(document.querySelectorAll('.sub-cb:checked')).map(cb => cb.value);

            if (!date) return alert("Please select an Exam Date.");
            if (selectedCbs.length === 0) return alert("Please select at least one class/section.");
            if (selectedSubs.length === 0) return alert("Please select at least one subject.");

            const btn = document.getElementById('save-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Adding to Cart...";
            btn.disabled = true;

            try {
                // Group sections by class for clean payload
                const targetGroups = {};
                selectedCbs.forEach(cb => {
                    const [cName, sName] = cb.value.split('|');
                    if (!targetGroups[cName]) targetGroups[cName] = [];
                    targetGroups[cName].push(sName);
                });

                const targets = Object.keys(targetGroups).map(cName => ({
                    className: cName,
                    sections: targetGroups[cName]
                }));

                const packetPayload = {
                    date: date,          // Grouping key
                    type: type,          // UT, OT, etc.
                    subjects: selectedSubs, // Array of subject strings
                    targets: targets,    // Array of class/section objects
                    timestamp: Date.now(),
                    savedBy: activeStaff ? activeStaff.name : "Admin"
                };

                // Because a single day can have MULTIPLE packets (e.g. Physics for 11, Chem for 12),
                // we save each packet as its own document, and group them visually by Date in the UI.
                await getCollection("exam_schedules").add(packetPayload);

                alert(`✅ Exam added to ${date} cart successfully!`);
                
                // Reset Checkboxes for the next quick entry, but leave the Date alone!
                document.querySelectorAll('.sub-cb, .sec-cb').forEach(cb => cb.checked = false);
                document.querySelectorAll('input[id^="master-"]').forEach(cb => { cb.checked = false; cb.indeterminate = false; });

            } catch (error) {
                alert("Error saving exam: " + error.message);
                console.error(error);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // --- FETCH & RENDER THE "CART" (GROUPED BY DATE) ---
        function listenForExams() {
            // Get today's local ISO date safely
            const offset = (new Date()).getTimezoneOffset() * 60000;
            const todayIso = (new Date(Date.now() - offset)).toISOString().split('T')[0];

            getCollection("exam_schedules")
                .where("date", ">=", todayIso) // Only fetch upcoming exams!
                .onSnapshot(snap => {
                    const listContainer = document.getElementById('exam-cart-list');
                    
                    if (snap.empty) {
                        listContainer.innerHTML = `
                            <div class="bg-slate-50 border-2 border-dashed border-slate-300 p-10 rounded-3xl text-center">
                                <p class="text-4xl mb-4">🛒</p>
                                <h3 class="text-xl font-black text-slate-500 uppercase tracking-widest">Cart is Empty</h3>
                                <p class="text-sm font-bold text-slate-400 mt-2">Add exams above to schedule them.</p>
                            </div>`;
                        return;
                    }

                    // 1. Group documents by Date
                    const groupedByDate = {};
                    snap.forEach(doc => {
                        const data = doc.data();
                        if (!groupedByDate[data.date]) groupedByDate[data.date] = [];
                        groupedByDate[data.date].push({ id: doc.id, ...data });
                    });

                    // 2. Sort dates chronologically
                    const sortedDates = Object.keys(groupedByDate).sort();

                    let html = "";

                    // 3. Render a beautiful Card for each Date
                    sortedDates.forEach(dateStr => {
                        const dateObj = new Date(dateStr);
                        const prettyDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                        const packets = groupedByDate[dateStr];

                        // Build the rows (packets) for this date
                        const packetRowsHtml = packets.map(pkt => {
                            // Assign a color theme based on exam type
                            let theme = { bg: 'bg-slate-50', border: 'border-slate-200', text: 'text-slate-800', badge: 'bg-slate-200 text-slate-800' };
                            
                            if (pkt.type === 'UT') theme = { bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-900', badge: 'bg-blue-600 text-white' };
                            if (pkt.type === 'OT') theme = { bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-900', badge: 'bg-amber-500 text-white' };
                            if (pkt.type === 'Terminal Exams' || pkt.type === 'Preboard' || pkt.type === 'Board Exam') theme = { bg: 'bg-rose-50', border: 'border-rose-200', text: 'text-rose-900', badge: 'bg-rose-600 text-white' };

                            const subjectsStr = pkt.subjects ? pkt.subjects.join(' • ') : "Mixed";
                            
                            // Format targets: Class 11 (A, B) | Class 12 (A)
                            let targetString = pkt.targets.map(t => `<span class="font-black opacity-80">${t.className}</span> <span class="font-bold opacity-60">(${t.sections.join(',')})</span>`).join('<span class="mx-2 opacity-30">|</span>');

                            return `
                                <div class="flex flex-col sm:flex-row justify-between sm:items-center p-4 rounded-xl border ${theme.border} ${theme.bg} gap-4 shadow-sm hover:shadow-md transition-shadow">
                                    <div class="flex-1">
                                        <div class="flex flex-wrap items-center gap-3 mb-2">
                                            <span class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest shadow-sm ${theme.badge}">${pkt.type}</span>
                                            <h4 class="font-black text-sm sm:text-base uppercase tracking-tighter ${theme.text}">${subjectsStr}</h4>
                                        </div>
                                        <div class="text-xs uppercase tracking-widest leading-relaxed ${theme.text}">
                                            ${targetString}
                                        </div>
                                    </div>
                                    <button onclick="deleteExamPacket('${pkt.id}')" class="bg-white text-rose-500 hover:bg-rose-600 hover:text-white px-4 py-3 rounded-xl font-black text-xs uppercase tracking-widest transition-colors shadow-sm shrink-0 border border-rose-200 hover:border-transparent w-full sm:w-auto">
                                        ✕ Remove
                                    </button>
                                </div>
                            `;
                        }).join('');

                        // Wrap rows in Date Card
                        html += `
                            <div class="bg-white border-2 border-slate-200 rounded-[2rem] overflow-hidden shadow-sm">
                                <div class="bg-slate-800 text-white p-5 flex justify-between items-center">
                                    <h3 class="font-black text-lg sm:text-xl uppercase tracking-widest flex items-center gap-3">
                                        <span class="bg-white/20 px-3 py-1 rounded-lg shadow-inner">📅</span> ${prettyDate}
                                    </h3>
                                    <span class="text-xs font-bold text-slate-300 uppercase tracking-widest bg-slate-900 px-3 py-1.5 rounded-lg">${packets.length} Exams</span>
                                </div>
                                <div class="p-4 sm:p-6 space-y-4">
                                    ${packetRowsHtml}
                                </div>
                            </div>
                        `;
                    });

                    listContainer.innerHTML = html;
                }, error => {
                    console.error("Cart Listener Error:", error);
                    document.getElementById('exam-cart-list').innerHTML = '<p class="text-red-500 font-black text-center p-10">Error loading cart.</p>';
                });
        }

        async function deleteExamPacket(docId) {
            if (!confirm("Remove this exam from the cart?")) return;
            try {
                await getCollection("exam_schedules").doc(docId).delete();
            } catch (e) {
                alert("Error deleting record: " + e.message);
            }
        }

        // --- DELEGATION MODAL LOGIC (RESTORED) ---
        function openAuthModal() { 
            document.getElementById('auth-modal').classList.remove('hidden'); 
            document.getElementById('auth-modal').classList.add('flex'); 
            openAuthPanel();
        }
        
        function closeAuthModal() { 
            document.getElementById('auth-modal').classList.add('hidden'); 
            document.getElementById('auth-modal').classList.remove('flex'); 
        }

        function openAuthPanel() {
            let depts = new Set();
            allTeachers.forEach(s => {
                const subList = (s.dept || "General").split(',');
                subList.forEach(item => { const c = item.trim(); if(c) depts.add(c); });
            });
            document.getElementById('auth-dept').innerHTML = `<option value="">-- Choose Department --</option>` + Array.from(depts).sort().map(d => `<option value="${d}">${d}</option>`).join('');
            document.getElementById('auth-staff').innerHTML = `<option value="">-- Select Dept First --</option>`;
            document.getElementById('auth-staff').disabled = true;
            renderAuthList();
        }

        function populateAuthStaff() {
            const dept = document.getElementById('auth-dept').value;
            const select = document.getElementById('auth-staff');
            if (!dept) { select.disabled = true; return; }
            
            const inDept = allTeachers.filter(s => {
                const deptStr = Array.isArray(s.dept) ? s.dept.join(',') : s.dept;
                return deptStr.includes(dept);
            }).sort((a,b) => a.email.localeCompare(b.email));

            select.innerHTML = `<option value="">-- Select Faculty --</option>` + inDept.map(s => {
                const n = Object.keys(s.details).find(k=>k.toLowerCase().includes('name')) ? s.details[Object.keys(s.details).find(k=>k.toLowerCase().includes('name'))] : s.email;
                return `<option value="${s.id}">${n}</option>`;
            }).join('');
            select.disabled = false;
        }

        async function grantExamAuth() {
            const staffId = document.getElementById('auth-staff').value;
            if(!staffId) return alert("Select a Staff member.");
            try {
                await getCollection("staff_applications").doc(staffId).update({ canManageExams: true });
                const staff = allTeachers.find(s => s.id === staffId);
                if(staff) staff.canManageExams = true;
                renderAuthList();
                alert("Authority Granted!");
            } catch(e) { alert("Error granting rights."); }
        }

        async function revokeExamAuth(staffId) {
            if(!confirm("Revoke Exam Authority?")) return;
            try {
                await getCollection("staff_applications").doc(staffId).update({ canManageExams: false });
                const staff = allTeachers.find(s => s.id === staffId);
                if(staff) staff.canManageExams = false;
                renderAuthList();
            } catch(e) { alert("Error revoking rights."); }
        }

        function renderAuthList() {
            const listArea = document.getElementById('auth-list-container');
            const authd = allTeachers.filter(s => s.canManageExams);
            if (authd.length === 0) {
                listArea.innerHTML = `<div class="bg-slate-50 border-2 border-dashed border-slate-300 p-8 rounded-2xl text-center text-sm font-black text-slate-400 uppercase tracking-widest">No Managers Authorized.</div>`;
                return;
            }
            listArea.innerHTML = authd.map(s => {
                const n = Object.keys(s.details).find(k=>k.toLowerCase().includes('name')) ? s.details[Object.keys(s.details).find(k=>k.toLowerCase().includes('name'))] : s.email;
                const deptStr = Array.isArray(s.dept) ? s.dept[0] : s.dept.split(',')[0];
                return `
                <div class="bg-white border-2 border-indigo-50 p-5 rounded-2xl flex justify-between items-center shadow-sm">
                    <div>
                        <h3 class="font-black text-slate-800 text-base uppercase">${n}</h3>
                        <span class="text-xs font-bold text-indigo-500 uppercase tracking-widest mt-1 inline-block">${deptStr}</span>
                    </div>
                    <button onclick="revokeExamAuth('${s.id}')" class="bg-rose-50 text-rose-600 px-5 py-3 rounded-xl font-black text-xs uppercase tracking-widest border border-rose-200 shadow-sm hover:bg-rose-600 hover:text-white transition-colors">Revoke</button>
                </div>
            `}).join('');
        }
    </script>
</body>
</html>
