<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Exam Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .input-field { width: 100%; padding: 0.875rem 1rem; border-radius: 0.75rem; border: 2px solid #e2e8f0; outline: none; font-weight: 700; color: #334155; transition: all 0.2s; font-size: 1rem; }
        .input-field:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1); }
        .loader { border: 4px solid #f1f5f9; border-top: 4px solid #f97316; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Make checkboxes bigger for mobile */
        input[type="checkbox"] { width: 1.25rem; height: 1.25rem; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-rose-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex flex-col sm:flex-row sm:items-center justify-between shadow-xl sticky top-0 z-[100] gap-4 border-b-4 border-orange-500">
        <div class="flex items-center gap-4 w-full sm:w-auto">
            <button onclick="window.location.href='admin.html'" class="p-3 sm:p-4 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors shadow-sm shrink-0">
                <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex-1">
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none">Exam Manager</h1>
                <div class="flex items-center gap-2 mt-1.5">
                    <p class="text-xs sm:text-sm text-orange-300 font-bold uppercase tracking-widest">Master Scheduler</p>
                    <span class="text-slate-400">|</span>
                    <select id="global-center-switch" onchange="switchAdminCenter(this.value)" class="text-[10px] sm:text-xs font-black text-indigo-900 bg-indigo-50 border border-indigo-200 outline-none rounded px-2 py-1 cursor-pointer uppercase tracking-widest shadow-sm">
                        <option value="GHUMARWIN">📍 Ghumarwin</option>
                        <option value="DHARAMSHALA">📍 Dharamshala</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto justify-end">
            <button id="auth-btn" onclick="openAuthModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-xs sm:text-sm transition-colors shadow-md border border-indigo-500 flex items-center gap-2">
                🔐 Delegations
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 mt-4 space-y-6 sm:space-y-8">
        
        <div class="glass-card p-5 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                <span class="text-3xl sm:text-4xl bg-orange-50 p-3 rounded-2xl border border-orange-100">📝</span>
                <div>
                    <h2 class="text-lg sm:text-2xl font-black text-slate-900 uppercase tracking-tight">Schedule New Exam</h2>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">Set date, subjects, and target classes</p>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">
                <div>
                    <label class="block text-xs sm:text-sm font-black text-slate-600 uppercase tracking-widest mb-2 ml-1">Target Date</label>
                    <input type="date" id="exam-date" class="input-field cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs sm:text-sm font-black text-slate-600 uppercase tracking-widest mb-2 ml-1">Exam Type</label>
                    <select id="exam-type" class="input-field cursor-pointer">
                        <option value="UT">Unit Test (UT)</option>
                        <option value="OT">Objective Test (OT)</option>
                        <option value="TERMINAL">Terminal Exam</option>
                        <option value="PREBOARD">Pre-Board</option>
                    </select>
                </div>
            </div>

            <div class="mb-8">
                <div class="flex justify-between items-center mb-3 ml-1">
                    <label class="block text-xs sm:text-sm font-black text-slate-600 uppercase tracking-widest">Select Tested Subjects</label>
                    <button onclick="document.querySelectorAll('.sub-cb').forEach(cb => cb.checked = true)" class="text-xs font-black text-indigo-600 uppercase hover:underline">Select All</button>
                </div>
                <div id="subject-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 bg-slate-50 border border-slate-200 p-4 rounded-2xl max-h-60 overflow-y-auto custom-scroll shadow-inner">
                    <div class="col-span-full text-center py-4 text-slate-400 font-bold text-sm">Loading Subjects...</div>
                </div>
            </div>

            <div>
                <label class="block text-xs sm:text-sm font-black text-slate-600 uppercase tracking-widest mb-3 ml-1 border-t border-slate-200 pt-6">Select Target Classes & Sections</label>
                <div id="class-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div class="col-span-full text-center py-10"><span class="loader border-t-orange-500"></span></div>
                </div>
            </div>

            <button onclick="saveExamSchedule()" id="save-btn" class="w-full mt-10 bg-orange-600 text-white font-black py-4 sm:py-5 rounded-2xl uppercase tracking-widest text-base sm:text-lg shadow-xl hover:bg-orange-500 transition-all active:scale-95 flex justify-center items-center gap-3">
                💾 Save Exam Schedule
            </button>
        </div>

        <div class="glass-card p-5 sm:p-8 rounded-[2rem] sm:rounded-[2.5rem]">
            <div class="flex items-center gap-4 mb-6 border-b border-slate-200 pb-4">
                <span class="text-3xl sm:text-4xl bg-blue-50 p-3 rounded-2xl border border-blue-100">📅</span>
                <div class="flex-1">
                    <h2 class="text-lg sm:text-2xl font-black text-slate-900 uppercase tracking-tight">Active Schedules</h2>
                    <p class="text-xs sm:text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">Upcoming and past exam overlays</p>
                </div>
            </div>

            <div id="exam-list" class="space-y-4 max-h-[600px] overflow-y-auto custom-scroll pr-2">
                <div class="text-center py-10"><span class="loader border-t-blue-500"></span></div>
            </div>
        </div>

    </main>

    <div id="auth-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 bg-indigo-50 border-b border-indigo-100 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="font-black text-indigo-900 text-lg sm:text-xl uppercase tracking-tighter">Exam Delegation</h3>
                    <p class="text-xs font-bold text-indigo-500 uppercase tracking-widest mt-1">Authorize staff to manage exams</p>
                </div>
                <button onclick="closeAuthModal()" class="bg-indigo-100 text-indigo-400 hover:bg-rose-100 hover:text-rose-600 w-10 h-10 rounded-full font-black text-xl transition-colors flex items-center justify-center">✕</button>
            </div>
            
            <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 bg-slate-50 border-b border-slate-200 shrink-0">
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2">1. Select Department</label>
                    <select id="auth-dept" onchange="populateAuthStaff()" class="w-full p-4 bg-white border border-slate-300 rounded-xl font-bold text-sm text-slate-700 outline-none focus:border-indigo-500 cursor-pointer shadow-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-2">2. Select Staff Member</label>
                    <select id="auth-staff" class="w-full p-4 bg-white border border-slate-300 rounded-xl font-bold text-sm text-slate-700 outline-none focus:border-indigo-500 cursor-pointer shadow-sm disabled:opacity-50" disabled></select>
                </div>
                <div class="md:col-span-2">
                    <button onclick="grantExamAuth()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-black uppercase tracking-widest text-sm shadow-lg hover:bg-indigo-700 transition-colors">Grant Exam Authority</button>
                </div>
            </div>

            <div class="p-6 flex-1 overflow-y-auto bg-white custom-scroll">
                <h4 class="font-black text-slate-800 uppercase tracking-widest text-sm mb-4 border-b pb-2">Authorized Exam Managers</h4>
                <div id="auth-list-container" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- AUTH & CENTER LOGIC ---
        const authStatus = sessionStorage.getItem('minervaAdminAuth');
        const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));

        // Allow Full Admins AND Delegated Staff
        if (authStatus !== 'true' && (!activeStaff || !activeStaff.canManageExams)) {
            window.location.replace('index.html');
        }

        let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
        sessionStorage.setItem('minervaAdminCenter', activeCenter);
        document.getElementById('global-center-switch').value = activeCenter;

        function switchAdminCenter(centerName) {
            sessionStorage.setItem('minervaAdminCenter', centerName);
            window.location.reload();
        }

        // CRITICAL FIX: Safe global collection fetcher
        function getCollection(name) {
            const globalCollections = ['staff_applications'];
            if (globalCollections.includes(name)) return db.collection(name);
            return activeCenter === "GHUMARWIN" ? db.collection(name) : db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        // --- CORE DATA ---
        let structureData = [];
        let allTeachers = [];
        const SPECIAL_SUBJECTS = ['BREAK', 'LUNCH BREAK', 'FRUIT BREAK', 'ASSEMBLY', 'EXAM', 'UT', 'OT', 'TERMINAL EXAMS', 'PREBOARD', 'BOARD EXAM', 'EVENT'];

        window.onload = async () => {
            document.getElementById('exam-date').value = new Date().toISOString().split('T')[0];
            
            await Promise.all([fetchStructure(), fetchTeachers()]);
            populateSubjects();
            listenForExams();
        };

        async function fetchTeachers() {
            try {
                const snap = await getCollection("staff_applications").where("status", "==", "approved").get();
                allTeachers = snap.docs.map(d => {
                    const data = d.data();
                    const det = data.details || {};
                    const deptKey = Object.keys(det).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                    return { 
                        id: d.id, 
                        email: data.email, 
                        details: det, 
                        dept: deptKey ? det[deptKey] : 'General',
                        canManageExams: data.canManageExams || false
                    };
                });
            } catch(e) { console.error("Error fetching teachers", e); }
        }

        async function fetchStructure() {
            try {
                const snap = await getCollection("institute_structure").orderBy("className").get();
                structureData = snap.docs.map(d => d.data());
                
                const grouped = {};
                structureData.forEach(st => {
                    if (!grouped[st.className]) grouped[st.className] = [];
                    grouped[st.className].push(st.sectionName);
                });

                const container = document.getElementById('class-container');
                container.innerHTML = '';

                Object.keys(grouped).sort().forEach(className => {
                    const sections = grouped[className].sort();
                    const safeClassId = className.replace(/[^a-zA-Z0-9]/g, '_');

                    let secHtml = sections.map(sec => `
                        <label class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-orange-50 hover:border-orange-300 transition-colors shadow-sm">
                            <input type="checkbox" class="sec-cb sec-group-${safeClassId} accent-orange-600 cursor-pointer" value="${className}|${sec}" data-class="${className}" onchange="handleSectionTick('${safeClassId}')">
                            <span class="text-sm font-black text-slate-700 uppercase tracking-tight">Sec ${sec}</span>
                        </label>
                    `).join('');

                    container.innerHTML += `
                        <div class="bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden shadow-sm flex flex-col h-full">
                            <label class="flex justify-between items-center p-4 bg-slate-100 cursor-pointer hover:bg-slate-200 transition-colors border-b border-slate-200 shrink-0">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" id="master-${safeClassId}" class="w-5 h-5 accent-orange-600 cursor-pointer" onchange="toggleEntireClass(this, '${safeClassId}')">
                                    <span class="text-base font-black text-slate-800 uppercase tracking-widest">Class ${className}</span>
                                </div>
                            </label>
                            <div class="p-4 grid grid-cols-2 gap-3 flex-1 content-start bg-white">
                                ${secHtml}
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error fetching structure:", e);
                document.getElementById('class-container').innerHTML = '<p class="text-red-500 font-bold p-4">Error loading classes.</p>';
            }
        }

        function populateSubjects() {
            let allSubjects = new Set();
            
            // Extract from Teachers
            allTeachers.forEach(t => {
                const depts = Array.isArray(t.dept) ? t.dept : [t.dept];
                depts.forEach(d => { if (d && d !== 'General') allSubjects.add(d.trim().toUpperCase()); });
            });
            
            // Extract from Classes
            structureData.forEach(st => {
                (st.subjects || []).forEach(s => allSubjects.add(s.trim().toUpperCase()));
            });

            const container = document.getElementById('subject-container');
            container.innerHTML = '';
            
            Array.from(allSubjects).sort().forEach(sub => {
                if(!SPECIAL_SUBJECTS.includes(sub)) {
                    container.innerHTML += `
                        <label class="flex items-center gap-3 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-300 transition-colors shadow-sm">
                            <input type="checkbox" class="sub-cb accent-indigo-600" value="${sub}">
                            <span class="text-xs font-black text-slate-700 uppercase tracking-tight truncate">${sub}</span>
                        </label>
                    `;
                }
            });
        }

        // --- CHECKBOX LOGIC ---
        function toggleEntireClass(masterCb, classId) {
            document.querySelectorAll(`.sec-group-${classId}`).forEach(cb => cb.checked = masterCb.checked);
        }

        function handleSectionTick(classId) {
            const cbs = document.querySelectorAll(`.sec-group-${classId}`);
            const master = document.getElementById(`master-${classId}`);
            const allChecked = Array.from(cbs).every(cb => cb.checked);
            const someChecked = Array.from(cbs).some(cb => cb.checked);
            master.checked = allChecked;
            master.indeterminate = !allChecked && someChecked;
        }

        // --- SAVE EXAM LOGIC ---
        async function saveExamSchedule() {
            const date = document.getElementById('exam-date').value;
            const type = document.getElementById('exam-type').value;
            const selectedCbs = Array.from(document.querySelectorAll('.sec-cb:checked'));
            const selectedSubs = Array.from(document.querySelectorAll('.sub-cb:checked')).map(cb => cb.value);

            if (!date) return alert("Please select an Exam Date.");
            if (selectedCbs.length === 0) return alert("Please select at least one class/section.");
            if (selectedSubs.length === 0) return alert("Please select at least one subject.");

            const btn = document.getElementById('save-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Saving & Syncing...";
            btn.disabled = true;

            try {
                // Group selections by class
                const targetGroups = {};
                selectedCbs.forEach(cb => {
                    const [cName, sName] = cb.value.split('|');
                    if (!targetGroups[cName]) targetGroups[cName] = [];
                    targetGroups[cName].push(sName);
                });

                const targetArray = Object.keys(targetGroups).map(cName => ({
                    className: cName,
                    sections: targetGroups[cName]
                }));

                const payload = {
                    date: date,
                    type: type,
                    subjects: selectedSubs,
                    targets: targetArray,
                    timestamp: Date.now(),
                    savedBy: activeStaff ? activeStaff.name : "Admin"
                };

                // Save to active branch's exam_schedules
                await getCollection("exam_schedules").doc(date).set(payload);

                alert("✅ Exam Schedule Saved Successfully!");
                
                // Clear form
                document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = false;
                    cb.indeterminate = false;
                });
                document.getElementById('exam-date').value = "";

            } catch (error) {
                alert("Error saving exam: " + error.message);
                console.error(error);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // --- FETCH & RENDER EXAMS LIST ---
        function listenForExams() {
            getCollection("exam_schedules")
                .orderBy("date", "desc")
                .onSnapshot(snap => {
                    const listContainer = document.getElementById('exam-list');
                    
                    if (snap.empty) {
                        listContainer.innerHTML = `
                            <div class="bg-slate-50 border-2 border-dashed border-slate-300 p-8 rounded-2xl text-center">
                                <p class="text-3xl mb-3">📭</p>
                                <p class="text-sm font-black text-slate-400 uppercase tracking-widest">No Exams Scheduled Yet</p>
                            </div>`;
                        return;
                    }

                    let html = "";
                    snap.forEach(doc => {
                        const data = doc.data();
                        const docId = doc.id;
                        
                        const dateObj = new Date(data.date);
                        const prettyDate = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                        
                        let typeColor = "bg-slate-100 text-slate-700 border-slate-200";
                        if (data.type === 'UT') typeColor = "bg-blue-100 text-blue-700 border-blue-200";
                        if (data.type === 'OT') typeColor = "bg-amber-100 text-amber-700 border-amber-200";
                        if (data.type === 'TERMINAL' || data.type === 'PREBOARD') typeColor = "bg-rose-100 text-rose-700 border-rose-200";

                        const subjectsStr = data.subjects ? data.subjects.join(', ') : "Mixed";
                        let targetString = data.targets.map(t => `<span class="font-black text-slate-700">${t.className}</span> <span class="text-slate-400">(${t.sections.join(', ')})</span>`).join('<span class="mx-2 text-slate-300">|</span>');

                        html += `
                            <div class="bg-white border border-slate-200 p-5 sm:p-6 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-300 transition-all flex flex-col sm:flex-row justify-between sm:items-center gap-5 group">
                                <div>
                                    <div class="flex flex-wrap items-center gap-3 mb-2">
                                        <h3 class="font-black text-slate-900 text-lg uppercase tracking-tighter">${prettyDate}</h3>
                                        <span class="px-3 py-1 rounded text-[10px] font-black uppercase tracking-widest border shadow-sm ${typeColor}">${data.type}</span>
                                    </div>
                                    <div class="text-xs font-bold text-indigo-600 uppercase tracking-widest mb-2 border-l-2 border-indigo-500 pl-2">
                                        Subjects: ${subjectsStr}
                                    </div>
                                    <div class="text-xs uppercase tracking-widest leading-relaxed bg-slate-50 p-2 rounded-lg border border-slate-100">
                                        ${targetString}
                                    </div>
                                </div>
                                <button onclick="deleteExam('${docId}')" class="bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white px-5 py-4 rounded-xl font-black text-[11px] sm:text-xs uppercase tracking-widest transition-colors shadow-sm shrink-0 border border-rose-200 hover:border-transparent">
                                    🗑️ Delete
                                </button>
                            </div>
                        `;
                    });

                    listContainer.innerHTML = html;
                }, error => {
                    console.error("List Listener Error:", error);
                    document.getElementById('exam-list').innerHTML = '<p class="text-red-500 font-bold">Error loading schedule list.</p>';
                });
        }

        async function deleteExam(docId) {
            if (!confirm("Are you sure you want to delete this scheduled exam?")) return;
            try {
                await getCollection("exam_schedules").doc(docId).delete();
            } catch (e) {
                alert("Error deleting record: " + e.message);
            }
        }

        // --- DELEGATION MODAL LOGIC ---
        function openAuthModal() { 
            document.getElementById('auth-modal').classList.remove('hidden'); 
            document.getElementById('auth-modal').classList.add('flex'); 
            openAuthPanel();
        }
        
        function closeAuthModal() { 
            document.getElementById('auth-modal').classList.add('hidden'); 
            document.getElementById('auth-modal').classList.remove('flex'); 
        }

        function openAuthPanel() {
            let depts = new Set();
            allTeachers.forEach(s => {
                const subList = (s.dept || "General").split(',');
                subList.forEach(item => { const c = item.trim(); if(c) depts.add(c); });
            });
            document.getElementById('auth-dept').innerHTML = `<option value="">-- Choose Department --</option>` + Array.from(depts).sort().map(d => `<option value="${d}">${d}</option>`).join('');
            document.getElementById('auth-staff').innerHTML = `<option value="">-- Select Dept First --</option>`;
            document.getElementById('auth-staff').disabled = true;
            renderAuthList();
        }

        function populateAuthStaff() {
            const dept = document.getElementById('auth-dept').value;
            const select = document.getElementById('auth-staff');
            if (!dept) { select.disabled = true; return; }
            
            const inDept = allTeachers.filter(s => {
                const deptStr = Array.isArray(s.dept) ? s.dept.join(',') : s.dept;
                return deptStr.includes(dept);
            }).sort((a,b) => a.email.localeCompare(b.email));

            select.innerHTML = `<option value="">-- Select Faculty --</option>` + inDept.map(s => {
                const n = Object.keys(s.details).find(k=>k.toLowerCase().includes('name')) ? s.details[Object.keys(s.details).find(k=>k.toLowerCase().includes('name'))] : s.email;
                return `<option value="${s.id}">${n}</option>`;
            }).join('');
            select.disabled = false;
        }

        async function grantExamAuth() {
            const staffId = document.getElementById('auth-staff').value;
            if(!staffId) return alert("Select a Staff member.");
            try {
                await getCollection("staff_applications").doc(staffId).update({ canManageExams: true });
                const staff = allTeachers.find(s => s.id === staffId);
                if(staff) staff.canManageExams = true;
                renderAuthList();
                alert("Authority Granted!");
            } catch(e) { alert("Error granting rights."); }
        }

        async function revokeExamAuth(staffId) {
            if(!confirm("Revoke Exam Authority?")) return;
            try {
                await getCollection("staff_applications").doc(staffId).update({ canManageExams: false });
                const staff = allTeachers.find(s => s.id === staffId);
                if(staff) staff.canManageExams = false;
                renderAuthList();
            } catch(e) { alert("Error revoking rights."); }
        }

        function renderAuthList() {
            const listArea = document.getElementById('auth-list-container');
            const authd = allTeachers.filter(s => s.canManageExams);
            if (authd.length === 0) {
                listArea.innerHTML = `<div class="bg-slate-50 border-2 border-dashed border-slate-300 p-6 rounded-xl text-center text-xs font-black text-slate-400 uppercase">No Managers Authorized.</div>`;
                return;
            }
            listArea.innerHTML = authd.map(s => {
                const n = Object.keys(s.details).find(k=>k.toLowerCase().includes('name')) ? s.details[Object.keys(s.details).find(k=>k.toLowerCase().includes('name'))] : s.email;
                const deptStr = Array.isArray(s.dept) ? s.dept[0] : s.dept.split(',')[0];
                return `
                <div class="bg-white border border-indigo-100 p-4 rounded-xl flex justify-between items-center shadow-sm">
                    <div>
                        <h3 class="font-black text-slate-800 text-sm uppercase">${n}</h3>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${deptStr}</span>
                    </div>
                    <button onclick="revokeExamAuth('${s.id}')" class="bg-rose-50 text-rose-600 px-4 py-2 rounded-lg font-black text-[10px] uppercase border border-rose-200 shadow-sm hover:bg-rose-100 transition-colors">Revoke</button>
                </div>
            `}).join('');
        }
    </script>
</body>
</html>
