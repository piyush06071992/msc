<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Builder | Minerva Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .ghost { opacity: 0.4; background: #e0e7ff; border: 2px dashed #4f46e5; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <header class="p-4 bg-white border-b flex justify-between items-center shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-lg">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-bold text-slate-800">Staff Form Designer</h1>
        </div>
        <div class="flex gap-3">
            <input type="text" id="org-code" placeholder="Organization Code" class="px-4 py-2 border rounded-xl text-sm font-bold focus:ring-2 focus:ring-blue-500 outline-none" value="MINERVA-2026">
            <button onclick="saveFormDesign()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-bold shadow-md transition-all">Save Design</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-64 bg-white border-r p-6 overflow-y-auto hidden md:block">
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-6">Drag Fields</h2>
            <div id="toolbox" class="space-y-3">
                <div class="p-4 border-2 border-slate-100 rounded-2xl bg-slate-50 cursor-move hover:border-blue-300 transition-colors flex items-center gap-3" data-type="text">
                    <span class="bg-blue-100 p-2 rounded-lg text-blue-600 uppercase text-[10px] font-black">ABC</span>
                    <span class="text-sm font-bold text-slate-700">Text Input</span>
                </div>
                <div class="p-4 border-2 border-slate-100 rounded-2xl bg-slate-50 cursor-move hover:border-blue-300 transition-colors flex items-center gap-3" data-type="number">
                    <span class="bg-emerald-100 p-2 rounded-lg text-emerald-600 uppercase text-[10px] font-black">123</span>
                    <span class="text-sm font-bold text-slate-700">Numeric</span>
                </div>
                <div class="p-4 border-2 border-slate-100 rounded-2xl bg-slate-50 cursor-move hover:border-blue-300 transition-colors flex items-center gap-3" data-type="date">
                    <span class="bg-amber-100 p-2 rounded-lg text-amber-600 uppercase text-[10px] font-black">Day</span>
                    <span class="text-sm font-bold text-slate-700">Date Picker</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-6 sm:p-12 overflow-y-auto bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:20px_20px]">
            <div class="max-w-2xl mx-auto">
                <div id="canvas" class="min-h-[600px] bg-white rounded-[2.5rem] shadow-xl p-8 border-2 border-dashed border-slate-200 space-y-4">
                    <p class="text-center text-slate-400 mt-20 font-medium italic">Drag items from the sidebar here to start building your form...</p>
                </div>
            </div>
        </main>

    </div>

    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
            <h3 class="text-xl font-bold mb-6">Field Settings</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Label Name</label>
                    <input type="text" id="edit-label" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Character Limit</label>
                    <input type="number" id="edit-limit" class="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="edit-required" class="w-5 h-5 rounded accent-blue-600">
                    <label class="text-sm font-bold text-slate-700 uppercase tracking-wide">Compulsory</label>
                </div>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="closeSettings()" class="flex-1 py-3 font-bold text-slate-500 hover:bg-slate-50 rounded-xl transition-colors">Cancel</button>
                <button onclick="applySettings()" class="flex-1 py-3 font-bold bg-blue-600 text-white rounded-xl shadow-lg">Apply</button>
            </div>
        </div>
    </div>

    <script>
        // Check Admin Auth
        if (sessionStorage.getItem('minervaAdminAuth') !== 'true') window.location.replace('admin-login.html');

        const canvas = document.getElementById('canvas');
        const toolbox = document.getElementById('toolbox');
        let activeField = null;

        // Initialize Sortable
        new Sortable(toolbox, { group: { name: 'shared', pull: 'clone', put: false }, sort: false });
        new Sortable(canvas, {
            group: 'shared',
            ghostClass: 'ghost',
            animation: 150,
            onAdd: function (evt) {
                const item = evt.item;
                const type = item.getAttribute('data-type');
                // Clean the dragged placeholder into a real form item
                item.className = "group relative p-6 border border-slate-100 rounded-2xl bg-white hover:border-blue-400 transition-all cursor-pointer shadow-sm";
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-black text-blue-600 uppercase tracking-widest field-type-badge">${type}</span>
                        <div class="flex gap-2">
                            <button onclick="openSettings(this)" class="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg></button>
                            <button onclick="this.parentElement.parentElement.parentElement.remove()" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                        </div>
                    </div>
                    <p class="font-bold text-slate-800 field-label">New ${type} Field</p>
                    <p class="text-xs text-slate-400 mt-1 field-details">Limit: N/A | Optional</p>
                `;
                // Remove the "Drag here" placeholder if it exists
                const placeholder = canvas.querySelector('p.italic');
                if(placeholder) placeholder.remove();
            }
        });

        function openSettings(btn) {
            activeField = btn.closest('.group');
            document.getElementById('edit-label').value = activeField.querySelector('.field-label').innerText;
            document.getElementById('settings-modal').classList.replace('hidden', 'flex');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.replace('flex', 'hidden');
        }

        function applySettings() {
            const label = document.getElementById('edit-label').value;
            const limit = document.getElementById('edit-limit').value;
            const required = document.getElementById('edit-required').checked;

            activeField.querySelector('.field-label').innerText = label;
            activeField.querySelector('.field-details').innerText = `Limit: ${limit || 'None'} | ${required ? 'Compulsory' : 'Optional'}`;
            
            // Store data in attributes for saving
            activeField.setAttribute('data-label', label);
            activeField.setAttribute('data-limit', limit);
            activeField.setAttribute('data-required', required);
            
            closeSettings();
        }

        function saveFormDesign() {
            const orgCode = document.getElementById('org-code').value;
            const fields = [];
            canvas.querySelectorAll('.group').forEach(f => {
                fields.push({
                    type: f.querySelector('.field-type-badge').innerText.toLowerCase(),
                    label: f.getAttribute('data-label') || f.querySelector('.field-label').innerText,
                    limit: f.getAttribute('data-limit') || "",
                    required: f.getAttribute('data-required') === "true"
                });
            });

            const design = { orgCode, fields };
            // For now, save to LocalStorage so you can see it working. 
            // In next step, we will save this to your database!
            localStorage.setItem('minerva_staff_form', JSON.stringify(design));
            alert('Staff Registration Form Design Saved Successfully!');
        }
    </script>
</body>
</html>
