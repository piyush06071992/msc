<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Form Builder | Minerva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .ghost { opacity: 0.4; background: #e0e7ff; border: 2px dashed #4f46e5; }
        .sortable-fallback { opacity: 1 !important; }
        /* Automatic Serial Numbering via CSS */
        #canvas { counter-reset: field-counter; }
        .form-field-item { counter-increment: field-counter; }
        .field-number::before { content: counter(field-counter) ". "; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans overflow-hidden">

    <header class="p-4 bg-white border-b flex justify-between items-center shadow-sm z-50">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-lg transition-colors">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-bold text-slate-800">Staff Form Designer</h1>
        </div>
        <div class="flex gap-3">
            <div class="hidden sm:flex items-center bg-slate-100 px-3 py-1 rounded-xl border border-slate-200">
                <span class="text-[10px] font-black text-slate-400 uppercase mr-2 tracking-tighter">Org Code:</span>
                <input type="text" id="org-code" class="bg-transparent border-none text-sm font-bold focus:ring-0 w-32" value="MINERVA-2026">
            </div>
            <button onclick="saveFormDesign()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-bold shadow-md transform active:scale-95 transition-all">Save Design</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-72 bg-white border-r p-6 overflow-y-auto hidden md:block">
            <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Available Fields</h2>
            <div id="toolbox" class="space-y-3">
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-blue-300 shadow-sm flex items-center gap-3" data-type="text">
                    <div class="bg-blue-100 p-2 rounded-lg text-blue-600 font-bold text-xs">ABC</div>
                    <span class="text-sm font-bold text-slate-700">Text Input</span>
                </div>
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-emerald-300 shadow-sm flex items-center gap-3" data-type="number">
                    <div class="bg-emerald-100 p-2 rounded-lg text-emerald-600 font-bold text-xs">123</div>
                    <span class="text-sm font-bold text-slate-700">Numeric</span>
                </div>
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-purple-300 shadow-sm flex items-center gap-3" data-type="select">
                    <div class="bg-purple-100 p-2 rounded-lg text-purple-600 font-bold text-xs">LIST</div>
                    <span class="text-sm font-bold text-slate-700">Dropdown</span>
                </div>
                <div class="p-4 border-2 border-slate-50 rounded-2xl bg-white cursor-move hover:border-amber-300 shadow-sm flex items-center gap-3" data-type="checkbox">
                    <div class="bg-amber-100 p-2 rounded-lg text-amber-600 font-bold text-xs">TICK</div>
                    <span class="text-sm font-bold text-slate-700">Multi-Tick</span>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-4 sm:p-10 overflow-y-auto bg-slate-50">
            <div class="max-w-2xl mx-auto">
                <div id="canvas" class="min-h-[700px] bg-white rounded-[3rem] shadow-2xl p-8 sm:p-12 border border-slate-100 space-y-6">
                    <p id="empty-msg" class="text-center text-slate-300 mt-32 font-medium italic">Drag and drop fields here to start building...</p>
                </div>
            </div>
        </main>

    </div>

    <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-slate-900">Edit Field</h3>
                <span id="modal-type-badge" class="px-3 py-1 bg-slate-100 text-[10px] font-black rounded-full uppercase tracking-widest text-slate-500">TYPE</span>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Question / Label Name</label>
                    <input type="text" id="edit-label" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold">
                </div>

                <div id="limit-container">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Character/Digit Limit</label>
                    <input type="number" id="edit-limit" placeholder="e.g. 10" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold">
                </div>

                <div id="options-container" class="hidden">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Options (Comma Separated)</label>
                    <textarea id="edit-options" placeholder="Option 1, Option 2, Option 3" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 transition-all font-bold h-24"></textarea>
                </div>

                <div class="flex items-center p-4 bg-slate-50 rounded-2xl border-2 border-slate-100">
                    <input type="checkbox" id="edit-required" class="w-6 h-6 rounded-lg accent-blue-600 cursor-pointer">
                    <label class="ml-4 text-sm font-bold text-slate-700 uppercase tracking-wide cursor-pointer">Mark as Compulsory</label>
                </div>
            </div>

            <div class="flex gap-4 mt-10">
                <button onclick="closeSettings()" class="flex-1 py-4 font-bold text-slate-400 hover:bg-slate-100 rounded-2xl transition-all">Cancel</button>
                <button onclick="applySettings()" class="flex-1 py-4 font-bold bg-blue-600 text-white rounded-2xl shadow-lg hover:bg-blue-700 transition-all">Apply Changes</button>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('minervaAdminAuth') !== 'true') window.location.replace('admin-login.html');

        const canvas = document.getElementById('canvas');
        const toolbox = document.getElementById('toolbox');
        let activeField = null;

        new Sortable(toolbox, { group: { name: 'shared', pull: 'clone', put: false }, sort: false, animation: 150 });
        new Sortable(canvas, {
            group: 'shared',
            ghostClass: 'ghost',
            animation: 250,
            onAdd: function (evt) {
                const item = evt.item;
                const type = item.getAttribute('data-type');
                setupField(item, type);
                document.getElementById('empty-msg')?.remove();
            }
        });

        function setupField(el, type) {
            el.className = "form-field-item group relative p-6 border-2 border-slate-100 rounded-3xl bg-white hover:border-blue-400 transition-all cursor-move shadow-sm mb-4";
            el.setAttribute('data-field-type', type);
            el.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-3">
                        <span class="field-number font-black text-blue-600 text-lg"></span>
                        <span class="text-[10px] font-black px-2 py-0.5 bg-slate-100 text-slate-400 rounded-md uppercase tracking-tighter">${type}</span>
                    </div>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="openSettings(this)" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
                        <button onclick="this.closest('.form-field-item').remove()" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                    </div>
                </div>
                <p class="font-bold text-slate-800 text-lg field-label">New Question?</p>
                <div class="mt-3 flex gap-4 items-center text-xs font-bold text-slate-400">
                    <span class="field-limit-text">Limit: N/A</span>
                    <span class="field-required-text">Optional</span>
                </div>
            `;
        }

        function openSettings(btn) {
            activeField = btn.closest('.form-field-item');
            const type = activeField.getAttribute('data-field-type');
            
            document.getElementById('modal-type-badge').innerText = type;
            document.getElementById('edit-label').value = activeField.querySelector('.field-label').innerText;
            document.getElementById('edit-limit').value = activeField.getAttribute('data-limit') || "";
            document.getElementById('edit-options').value = activeField.getAttribute('data-options') || "";
            document.getElementById('edit-required').checked = activeField.getAttribute('data-required') === "true";

            // Show/Hide logic for options vs limits
            const isChoice = (type === 'select' || type === 'checkbox');
            document.getElementById('limit-container').classList.toggle('hidden', isChoice);
            document.getElementById('options-container').classList.toggle('hidden', !isChoice);

            document.getElementById('settings-modal').classList.replace('hidden', 'flex');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.replace('flex', 'hidden');
        }

        function applySettings() {
            const label = document.getElementById('edit-label').value;
            const limit = document.getElementById('edit-limit').value;
            const options = document.getElementById('edit-options').value;
            const required = document.getElementById('edit-required').checked;

            activeField.querySelector('.field-label').innerText = label;
            activeField.querySelector('.field-limit-text').innerText = limit ? `Limit: ${limit}` : 'Limit: N/A';
            activeField.querySelector('.field-required-text').innerText = required ? 'Compulsory' : 'Optional';
            activeField.querySelector('.field-required-text').classList.toggle('text-red-500', required);

            activeField.setAttribute('data-label', label);
            activeField.setAttribute('data-limit', limit);
            activeField.setAttribute('data-options', options);
            activeField.setAttribute('data-required', required);
            
            closeSettings();
        }

        function saveFormDesign() {
            const orgCode = document.getElementById('org-code').value;
            const fields = [];
            canvas.querySelectorAll('.form-field-item').forEach(f => {
                fields.push({
                    type: f.getAttribute('data-field-type'),
                    label: f.getAttribute('data-label') || f.querySelector('.field-label').innerText,
                    limit: f.getAttribute('data-limit') || "",
                    options: f.getAttribute('data-options') || "",
                    required: f.getAttribute('data-required') === "true"
                });
            });

            localStorage.setItem('minerva_staff_form', JSON.stringify({ orgCode, fields }));
            alert('Form Design with Serial Numbers Saved!');
        }
    </script>
</body>
</html>
