<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Automated Paper Cutter</title>
    
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .loader { border: 4px solid #f1f5f9; border-top: 4px solid #eab308; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-[#1e1b4b] text-white p-4 flex justify-between items-center shadow-md z-50 shrink-0 border-b-4 border-yellow-400">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="text-xl font-black uppercase tracking-widest leading-none">Paper Cutter Engine</h1>
                <p class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">AI-Powered Question Extractor</p>
            </div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-8 bg-slate-200 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CjxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSIvPgo8Y2lyY2xlIGN4PSIyMCIgY3k9IjIwIiByPSIxIiBmaWxsPSIjY2JkNWUxIi8+Cjwvc3ZnPg==')]">
        
        <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl max-w-xl w-full text-center border border-slate-200 relative overflow-hidden">
            <h2 class="font-black text-slate-800 text-2xl uppercase tracking-tighter mb-2">Upload Master PDF</h2>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-8">System will automatically slice questions and build a PPTX</p>
            
            <div id="upload-section">
                <input type="text" id="deck-name" placeholder="e.g. NEET 2024 Set Q4" class="w-full mb-6 px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 outline-none focus:border-yellow-400 text-center">
                
                <label class="w-full flex flex-col items-center justify-center h-48 border-2 border-dashed border-indigo-300 bg-indigo-50 hover:bg-indigo-100 rounded-3xl cursor-pointer transition-colors group">
                    <span class="text-5xl mb-3 group-hover:scale-110 transition-transform drop-shadow-sm">📄</span>
                    <span class="text-indigo-600 font-black uppercase text-sm tracking-widest">Select PDF File</span>
                    <input type="file" id="pdf-upload" accept="application/pdf" class="hidden" onchange="startAutomatedProcess(event)">
                </label>
            </div>

            <div id="loading-section" class="hidden py-10 flex flex-col items-center justify-center">
                <div class="loader mb-6"></div>
                <h3 id="status-text" class="font-black text-indigo-900 text-lg uppercase tracking-widest">Uploading PDF...</h3>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2">The AI is currently slicing the document.</p>
            </div>

            <div id="success-section" class="hidden py-10 flex flex-col items-center justify-center">
                <span class="text-6xl mb-4 drop-shadow-md">🎉</span>
                <h3 class="font-black text-emerald-600 text-2xl uppercase tracking-tighter mb-6">Processing Complete!</h3>
                <a href="#" id="download-link" target="_blank" class="w-full bg-yellow-400 hover:bg-yellow-500 text-yellow-950 py-5 rounded-2xl font-black uppercase text-sm tracking-widest shadow-xl transition-all block">
                    📥 Download PowerPoint
                </a>
            </div>

        </div>
    </main>

    <script>
        // --- Firebase Init ---
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const storage = firebase.storage();
        const functions = firebase.functions();

        async function startAutomatedProcess(event) {
            const file = event.target.files[0];
            const deckName = document.getElementById('deck-name').value.trim() || "Minerva_Questions";
            
            if (!file || file.type !== 'application/pdf') return alert('Please select a valid PDF.');

            // UI Changes
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');
            const statusText = document.getElementById('status-text');

            try {
                // 1. Upload PDF to Firebase Storage
                statusText.innerText = "Uploading PDF to Cloud...";
                const fileRef = storage.ref(`raw_pdfs/${Date.now()}_${file.name}`);
                await fileRef.put(file);
                const storagePath = fileRef.fullPath;

                // 2. Trigger the Python Cloud Function
                statusText.innerText = "AI is Slicing Questions...";
                
                const processPaper = functions.httpsCallable('processQuestionPaper');
                
                // Call the backend and wait for the response
                const result = await processPaper({ 
                    filePath: storagePath, 
                    title: deckName 
                });

                // 3. Receive the download link
                const pptxUrl = result.data.downloadUrl;

                // UI Changes
                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('success-section').classList.remove('hidden');
                document.getElementById('download-link').href = pptxUrl;

            } catch (error) {
                console.error("Pipeline Error:", error);
                alert("An error occurred: " + error.message);
                document.getElementById('upload-section').classList.remove('hidden');
                document.getElementById('loading-section').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
