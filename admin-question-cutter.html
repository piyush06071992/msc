<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Question Paper Cutter</title>
    
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; overflow: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Canvas Stacking for Drawing Overlays */
        .canvas-container { position: relative; display: inline-block; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border-radius: 0.5rem; overflow: hidden; }
        #pdf-canvas { display: block; }
        #draw-layer { position: absolute; top: 0; left: 0; cursor: crosshair; z-index: 10; }
        
        .glass-panel { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-left: 1px solid rgba(255,255,255,0.5); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-[#1e1b4b] text-white p-4 flex justify-between items-center shadow-md z-50 shrink-0 border-b-4 border-yellow-400">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="text-xl font-black uppercase tracking-widest leading-none">Paper Cutter Engine</h1>
                <p class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Slicer & Presentation Builder</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <input type="text" id="deck-name" placeholder="e.g. NEET 2024 Physics" class="px-4 py-2 bg-indigo-900/50 border border-indigo-500 rounded-lg text-xs font-bold text-white outline-none focus:border-yellow-400 placeholder-indigo-300 w-48">
            <button onclick="exportToPPTX()" class="bg-yellow-500 hover:bg-yellow-400 text-yellow-950 px-4 py-2 rounded-xl font-black uppercase text-[10px] tracking-widest shadow-md transition-all flex items-center gap-2">
                <span>📊</span> Generate PPTX
            </button>
            <button onclick="exportToZIP()" class="bg-blue-500 hover:bg-blue-400 text-white px-4 py-2 rounded-xl font-black uppercase text-[10px] tracking-widest shadow-md transition-all flex items-center gap-2">
                <span>🗂️</span> Download ZIP
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <div class="flex-1 bg-slate-200 flex flex-col relative">
            <div class="absolute top-4 left-4 right-4 bg-white/90 backdrop-blur rounded-2xl p-3 shadow-lg z-20 flex justify-between items-center border border-slate-200">
                <div class="flex items-center gap-3">
                    <label class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest cursor-pointer transition-colors shadow-sm">
                        Upload Master PDF
                        <input type="file" id="pdf-upload" accept="application/pdf" class="hidden" onchange="handlePDFUpload(event)">
                    </label>
                    <span id="file-name-display" class="text-xs font-bold text-slate-500 truncate max-w-[200px]">No file selected</span>
                </div>
                <div class="flex items-center gap-4 hidden" id="pagination-controls">
                    <button onclick="changePage(-1)" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 font-black transition-colors">◀ Prev</button>
                    <span class="text-xs font-black text-slate-700 uppercase tracking-widest">Page <span id="page-num">1</span> of <span id="page-count">--</span></span>
                    <button onclick="changePage(1)" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 font-black transition-colors">Next ▶</button>
                </div>
            </div>

            <div class="flex-1 overflow-auto custom-scroll p-8 pt-24 flex justify-center items-start" id="canvas-wrapper">
                <div class="text-center py-32 text-slate-400 font-black uppercase tracking-[0.2em] text-sm" id="empty-state">
                    <span class="text-4xl block mb-4">📄</span>
                    Upload a Question Paper PDF to begin
                </div>
                
                <div class="canvas-container hidden" id="workspace">
                    <canvas id="pdf-canvas"></canvas>
                    <canvas id="draw-layer"></canvas>
                </div>
            </div>
        </div>

        <div class="w-80 glass-panel flex flex-col shadow-xl z-30 shrink-0">
            <div class="p-4 border-b border-slate-200 bg-white/50 shrink-0">
                <h3 class="font-black text-slate-800 uppercase tracking-tighter text-lg flex items-center justify-between">
                    Captured Queue
                    <span id="capture-count" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-[10px] shadow-sm">0 Items</span>
                </h3>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">Drag on PDF to extract images</p>
            </div>
            
            <div id="gallery" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4 bg-slate-50/50">
                <div class="text-center py-10 text-slate-400 font-bold text-[10px] uppercase tracking-widest">Queue is empty</div>
            </div>
            
            <div class="p-4 border-t border-slate-200 bg-white/80 shrink-0 flex flex-col gap-2">
                <label class="flex items-center gap-2 cursor-pointer p-2 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100">
                    <input type="checkbox" id="sync-firebase-cb" class="w-4 h-4 accent-indigo-600">
                    <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">Sync to Cloud Database</span>
                </label>
                <button onclick="clearGallery()" class="w-full py-3 bg-rose-50 text-rose-600 hover:bg-rose-100 hover:border-rose-300 border border-rose-200 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors">
                    🗑️ Clear Entire Queue
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Firebase Init (Optional Save) ---
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        // --- PDF.js Setup ---
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null;
        let scale = 2.0; // High resolution render for crisp text
        let canvas = document.getElementById('pdf-canvas');
        let ctx = canvas.getContext('2d');
        let drawLayer = document.getElementById('draw-layer');
        let drawCtx = drawLayer.getContext('2d');

        // --- Cropper State ---
        let isDrawing = false;
        let startX = 0, startY = 0;
        let capturedImages = [];

        // --- 1. Load PDF Engine ---
        function handlePDFUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.type !== 'application/pdf') return alert('Please upload a valid PDF file.');

            document.getElementById('file-name-display').innerText = file.name;
            const fileReader = new FileReader();
            
            fileReader.onload = function(e) {
                const typedarray = new Uint8Array(e.target.result);
                document.getElementById('empty-state').classList.add('hidden');
                document.getElementById('workspace').classList.remove('hidden');
                document.getElementById('pagination-controls').classList.remove('hidden');
                
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    pdfDoc = pdf;
                    document.getElementById('page-count').textContent = pdf.numPages;
                    pageNum = 1;
                    renderPage(pageNum);
                });
            };
            fileReader.readAsArrayBuffer(file);
        }

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: scale });
                
                // Match both canvases to the high-res PDF size
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                drawLayer.height = viewport.height;
                drawLayer.width = viewport.width;

                const renderContext = { canvasContext: ctx, viewport: viewport };
                const renderTask = page.render(renderContext);

                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
            document.getElementById('page-num').textContent = num;
        }

        function queueRenderPage(num) {
            if (pageRendering) pageNumPending = num;
            else renderPage(num);
        }

        function changePage(offset) {
            if (!pdfDoc) return;
            if (pageNum + offset <= 0 || pageNum + offset > pdfDoc.numPages) return;
            pageNum += offset;
            queueRenderPage(pageNum);
        }

        // --- 2. Canvas Drawing & Slicing Engine ---
        drawLayer.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = drawLayer.getBoundingClientRect();
            // Scale mouse coordinates to match high-res canvas resolution
            const scaleX = drawLayer.width / rect.width;
            const scaleY = drawLayer.height / rect.height;
            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
        });

        drawLayer.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = drawLayer.getBoundingClientRect();
            const scaleX = drawLayer.width / rect.width;
            const scaleY = drawLayer.height / rect.height;
            const currentX = (e.clientX - rect.left) * scaleX;
            const currentY = (e.clientY - rect.top) * scaleY;

            drawCtx.clearRect(0, 0, drawLayer.width, drawLayer.height);
            
            // Draw targeting box
            drawCtx.fillStyle = 'rgba(59, 130, 246, 0.2)'; // Tailwind Blue-500 transparent
            drawCtx.strokeStyle = '#3b82f6';
            drawCtx.lineWidth = 4;
            
            const width = currentX - startX;
            const height = currentY - startY;
            drawCtx.fillRect(startX, startY, width, height);
            drawCtx.strokeRect(startX, startY, width, height);
        });

        drawLayer.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            
            const rect = drawLayer.getBoundingClientRect();
            const scaleX = drawLayer.width / rect.width;
            const scaleY = drawLayer.height / rect.height;
            const endX = (e.clientX - rect.left) * scaleX;
            const endY = (e.clientY - rect.top) * scaleY;

            drawCtx.clearRect(0, 0, drawLayer.width, drawLayer.height);

            // Calculate precise absolute dimensions (handles dragging backwards)
            const x = Math.min(startX, endX);
            const y = Math.min(startY, endY);
            const width = Math.abs(endX - startX);
            const height = Math.abs(endY - startY);

            // Ignore accidental tiny clicks
            if (width < 20 || height < 20) return;

            extractImageSlice(x, y, width, height);
        });

        function extractImageSlice(x, y, width, height) {
            // Create a temporary off-screen canvas to hold the sliced image
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tCtx = tempCanvas.getContext('2d');
            
            // Draw the selected region from the rendered PDF canvas onto the temp canvas
            tCtx.drawImage(canvas, x, y, width, height, 0, 0, width, height);
            
            // Convert to high-quality Base64 Image
            const dataURL = tempCanvas.toDataURL('image/png');
            
            const id = 'Q_' + Date.now();
            capturedImages.push({ id, data: dataURL, width, height });
            renderGallery();
        }

        // --- 3. Queue Gallery Management ---
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            document.getElementById('capture-count').innerText = `${capturedImages.length} Items`;
            
            if (capturedImages.length === 0) {
                gallery.innerHTML = '<div class="text-center py-10 text-slate-400 font-bold text-[10px] uppercase tracking-widest">Queue is empty</div>';
                return;
            }

            gallery.innerHTML = capturedImages.map((img, index) => `
                <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm relative group">
                    <button onclick="removeImage('${img.id}')" class="absolute -top-2 -right-2 bg-rose-500 text-white w-6 h-6 rounded-full font-black text-[10px] shadow-md opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center border-2 border-white">✕</button>
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest bg-slate-100 px-2 py-0.5 rounded">#${index + 1}</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-lg overflow-hidden border border-slate-200 flex items-center justify-center p-2">
                        <img src="${img.data}" class="max-w-full max-h-32 object-contain">
                    </div>
                </div>
            `).join('');
            
            // Auto-scroll to bottom
            gallery.scrollTop = gallery.scrollHeight;
        }

        function removeImage(id) {
            capturedImages = capturedImages.filter(img => img.id !== id);
            renderGallery();
        }

        function clearGallery() {
            if(!confirm("Are you sure you want to delete all sliced questions?")) return;
            capturedImages = [];
            renderGallery();
        }

        // --- 4. Export Engine (PPTX & ZIP) ---
        
        async function exportToPPTX() {
            if(capturedImages.length === 0) return alert("Slice some questions first!");
            const deckName = document.getElementById('deck-name').value.trim() || "Minerva_Question_Bank";
            
            const btn = event.currentTarget;
            const origHTML = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin">⏳</span> Building...`;
            btn.disabled = true;

            try {
                let pres = new pptxgen();
                pres.layout = 'LAYOUT_16x9'; // Standard Wide PPT
                
                // Title Slide
                let slide = pres.addSlide();
                slide.background = { color: "1E1B4B" }; // Minerva Indigo
                slide.addText("MINERVA STUDY CIRCLE", { x: 0, y: "30%", w: "100%", align: "center", fontSize: 18, color: "818CF8", bold: true });
                slide.addText(deckName, { x: 0, y: "45%", w: "100%", align: "center", fontSize: 48, color: "FFFFFF", bold: true });
                slide.addText("Automated Question Bank", { x: 0, y: "65%", w: "100%", align: "center", fontSize: 14, color: "94A3B8" });

                // Loop through images and maintain aspect ratio inside the slide bounds
                capturedImages.forEach((img, idx) => {
                    let qSlide = pres.addSlide();
                    qSlide.background = { color: "FFFFFF" };
                    
                    // Add subtle slide numbering
                    qSlide.addText(`Q. ${idx + 1}`, { x: "90%", y: "5%", w: "10%", fontSize: 14, color: "94A3B8", bold: true });

                    // Aspect Ratio calculation for PPTX bounds (10 inches wide x 5.625 inches high)
                    const slideWidth = 9.5; 
                    const slideHeight = 5.0;
                    
                    const imgRatio = img.width / img.height;
                    const slideRatio = slideWidth / slideHeight;
                    
                    let finalW, finalH;

                    if (imgRatio > slideRatio) {
                        // Image is wider than slide ratio -> Scale to max width
                        finalW = slideWidth;
                        finalH = slideWidth / imgRatio;
                    } else {
                        // Image is taller than slide ratio -> Scale to max height
                        finalH = slideHeight;
                        finalW = slideHeight * imgRatio;
                    }

                    // Center the image perfectly
                    const finalX = (10 - finalW) / 2;
                    const finalY = (5.625 - finalH) / 2;

                    qSlide.addImage({ data: img.data, x: finalX, y: finalY, w: finalW, h: finalH });
                });

                await pres.writeFile({ fileName: `${deckName.replace(/\s+/g, '_')}.pptx` });
                
                checkFirebaseSync(deckName, 'pptx');

            } catch(e) {
                console.error(e);
                alert("Error generating PPTX");
            } finally {
                btn.innerHTML = origHTML;
                btn.disabled = false;
            }
        }

        async function exportToZIP() {
            if(capturedImages.length === 0) return alert("Slice some questions first!");
            const deckName = document.getElementById('deck-name').value.trim() || "Minerva_Images";
            
            const btn = event.currentTarget;
            const origHTML = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin">⏳</span> Zipping...`;
            btn.disabled = true;

            try {
                const zip = new JSZip();
                const folder = zip.folder(deckName);

                capturedImages.forEach((img, idx) => {
                    // Extract the Base64 data cleanly from the Data URL
                    const base64Data = img.data.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");
                    // Add to ZIP with a serialized filename
                    folder.file(`${deckName.replace(/\s+/g, '_')}_Q${idx + 1}.png`, base64Data, { base64: true });
                });

                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, `${deckName.replace(/\s+/g, '_')}.zip`);
                
                checkFirebaseSync(deckName, 'zip');

            } catch(e) {
                console.error(e);
                alert("Error generating ZIP");
            } finally {
                btn.innerHTML = origHTML;
                btn.disabled = false;
            }
        }

        // --- 5. Firebase Cloud Backup (Optional) ---
        async function checkFirebaseSync(deckName, type) {
            const shouldSync = document.getElementById('sync-firebase-cb').checked;
            if (!shouldSync) return;

            try {
                // If the user checks the box, we upload the raw base64 arrays to Firestore
                // so other teachers can access the visual question bank later.
                const center = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
                const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
                
                // We map to save space, keeping only the raw data and an ID
                const payload = capturedImages.map((img, i) => ({
                    qNum: i + 1,
                    image_base64: img.data,
                    width: img.width,
                    height: img.height
                }));

                await db.collection(prefix + "question_bank").doc(deckName.replace(/\s+/g, '_')).set({
                    title: deckName,
                    formatExported: type,
                    questionCount: payload.length,
                    questions: payload,
                    timestamp: Date.now()
                });
                
                // Toast notification
                const toast = document.createElement('div');
                toast.className = "fixed bottom-5 right-5 bg-emerald-600 text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-2xl z-[100] animate-bounce";
                toast.innerText = "☁️ Synced to Cloud DB";
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);

            } catch(e) {
                console.error("Firebase Sync Error", e);
            }
        }
    </script>
</body>
</html>
