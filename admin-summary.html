<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Syllabus Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .progress-phi { transition: width 1s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin-lesson-planner.html'" class="p-2 hover:bg-slate-100 rounded-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" stroke-width="2"/></svg>
            </button>
            <h1 class="text-lg font-black uppercase tracking-tighter">Academic Progress Dashboard</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="global-stats" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            </div>

        <div class="bg-white rounded-[2rem] shadow-xl overflow-hidden border border-slate-200">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-black uppercase text-slate-500 text-xs tracking-widest">Section-wise Breakdown</h3>
                <span class="text-[10px] bg-blue-100 text-blue-600 px-3 py-1 rounded-full font-bold uppercase" id="last-sync">Syncing...</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-[10px] uppercase font-black tracking-widest text-slate-400">
                        <tr>
                            <th class="p-5">Section / Subject</th>
                            <th class="p-5">Chapters</th>
                            <th class="p-5">Syllabus Progress</th>
                            <th class="p-5">Days Remaining</th>
                            <th class="p-5">Status</th>
                        </tr>
                    </thead>
                    <tbody id="summary-table-body" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function initDashboard() {
            try {
                // 1. Fetch all structural data
                const [structSnap, assignSnap, plannerSnap] = await Promise.all([
                    db.collection("institute_structure").get(),
                    db.collection("lesson_planner_assignments").get(),
                    db.collection("lesson_planners").get()
                ]);

                const structures = structSnap.docs.map(d => d.data());
                const assignments = assignSnap.docs.map(d => ({id: d.id, ...d.data()}));
                const planners = plannerSnap.docs.map(d => ({id: d.id, ...d.data()}));

                renderDashboard(structures, assignments, planners);
                document.getElementById('last-sync').innerText = "Live: " + new Date().toLocaleTimeString();
            } catch (e) { console.error(e); }
        }

        function renderDashboard(structures, assignments, planners) {
            const tbody = document.getElementById('summary-table-body');
            tbody.innerHTML = '';
            
            let totalChapters = 0;
            let totalCovered = 0;

            structures.forEach(st => {
                st.subjects.filter(s => !['BREAK','EVENT','EXAM','ASSEMBLY'].includes(s.toUpperCase())).forEach((sub, i) => {
                    const id = `${st.className}_${st.sectionName}_${sub}`.replace(/\s+/g, '_');
                    const assign = assignments.find(a => a.id === id) || {};
                    const planner = planners.find(p => p.id === id);
                    
                    // Logic for Progress
                    let chaptersCount = 0;
                    let completionPct = 0;
                    let daysLeft = "Not Set";
                    let statusColor = "bg-slate-200 text-slate-500";

                    if (planner && planner.syllabusData) {
                        const chapters = new Set(planner.syllabusData.map(r => r["CHAPTER NAME"]));
                        chaptersCount = chapters.size;
                        
                        // Placeholder for now: we count "completed" lectures once Teacher Portal is live
                        // For now, let's assume 0% until we build the checkbox system
                        const completedLectures = planner.completedLectures || 0;
                        const totalLectures = planner.syllabusData.length;
                        completionPct = totalLectures > 0 ? Math.round((completedLectures / totalLectures) * 100) : 0;
                    }

                    if (assign.targetDate) {
                        const target = new Date(assign.targetDate);
                        const diff = target - new Date();
                        daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));
                    }

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-blue-50/30 transition-colors group";
                    tr.innerHTML = `
                        <td class="p-5">
                            <div class="font-black text-slate-800 text-sm">${i === 0 ? st.className + ' - ' + st.sectionName : ''}</div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${sub}</div>
                        </td>
                        <td class="p-5 font-bold text-slate-600 text-xs">${chaptersCount} Chapters</td>
                        <td class="p-5 w-64">
                            <div class="flex items-center gap-3">
                                <div class="flex-1 h-2 bg-slate-200 rounded-full overflow-hidden">
                                    <div class="h-full bg-blue-600 progress-phi" style="width: ${completionPct}%"></div>
                                </div>
                                <span class="text-[10px] font-black text-slate-800">${completionPct}%</span>
                            </div>
                        </td>
                        <td class="p-5">
                            <div class="text-[10px] font-black ${daysLeft < 7 ? 'text-red-500' : 'text-slate-600'}">
                                ${daysLeft > 0 ? daysLeft + ' DAYS LEFT' : (daysLeft === "Not Set" ? 'SET DATE' : 'OVERDUE')}
                            </div>
                        </td>
                        <td class="p-5">
                            <span class="px-3 py-1 rounded-lg text-[9px] font-black uppercase ${planner ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${planner ? 'Active' : 'Missing Syllabus'}
                            </span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        initDashboard();
    </script>
</body>
</html>
