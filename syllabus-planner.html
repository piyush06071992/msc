<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Syllabus Pre-Planning</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="minerva-context.js?v=1"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .inp { width: 100%; padding: .55rem .7rem; border: 1px solid #cbd5e1; border-radius: .6rem; font-weight: 700; font-size: .8rem; background: #fff; outline: none; }
        .inp:focus { border-color: #6366f1; }
        .btn { font-weight: 900; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; border-radius: .7rem; padding: .55rem .9rem; }
        .mini { font-weight: 900; font-size: 11px; width: 28px; height: 28px; border-radius: .5rem; border: 1px solid #e2e8f0; background: #fff; color: #475569; }
        .mini:disabled { opacity: .3; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-24">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 sm:px-8 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
            <button onclick="goBack()" class="p-2 hover:bg-slate-100 rounded-xl" title="Back">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="min-w-0">
                <h1 class="text-lg sm:text-xl font-black text-slate-800 tracking-tight leading-none">Syllabus Pre-Planning</h1>
                <div class="flex flex-wrap items-center gap-1 mt-1">
                    <select id="branch-switch" onchange="switchBranch(this.value)" class="text-[10px] font-black text-sky-700 bg-sky-50 border border-sky-200 outline-none rounded px-2 py-0.5 uppercase tracking-widest"></select>
                    <select id="session-switch" onchange="switchSession(this.value)" class="text-[10px] font-black text-indigo-700 bg-indigo-50 border border-indigo-200 outline-none rounded px-2 py-0.5 uppercase tracking-widest"></select>
                </div>
            </div>
        </div>
        <button id="hod-btn" onclick="openHodModal()" class="hidden btn bg-slate-900 text-white">👥 HODs</button>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8">
        <div id="page-msg" class="hidden mb-6"></div>
        <div id="class-list" class="space-y-6">
            <div class="py-20 text-center text-slate-400 font-black uppercase text-[10px] tracking-widest">Loading…</div>
        </div>
    </main>

    <!-- Settings (admin): dates, class duration, syllabus editors -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl flex flex-col max-h-[92vh]">
            <div class="p-5 border-b border-slate-100 flex justify-between items-start">
                <div>
                    <h3 class="font-black text-slate-800 uppercase tracking-tight">Plan Settings</h3>
                    <p id="settings-sub" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1"></p>
                </div>
                <button onclick="closeModal('settings-modal')" class="mini">✕</button>
            </div>
            <div class="p-5 overflow-y-auto space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Start date</label><input type="date" id="set-start" class="inp mt-1"></div>
                    <div><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Target end date</label><input type="date" id="set-end" class="inp mt-1"></div>
                </div>
                <div><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Standard class duration (minutes)</label><input type="number" min="10" max="300" id="set-duration" class="inp mt-1" placeholder="e.g. 90"></div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Syllabus editors (HOD or delegate)</label>
                    <input id="editor-search" oninput="renderEditorChecklist()" class="inp mt-1" placeholder="Search staff…">
                    <div id="editor-list" class="mt-2 max-h-56 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100"></div>
                    <p class="text-[10px] font-bold text-slate-400 mt-1">HODs of this subject can always edit too.</p>
                </div>
            </div>
            <div class="p-5 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeModal('settings-modal')" class="btn bg-slate-100 text-slate-600">Cancel</button>
                <button id="settings-save" onclick="saveSettings()" class="btn bg-indigo-600 text-white">Save</button>
            </div>
        </div>
    </div>

    <!-- HODs per subject (admin) -->
    <div id="hod-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[92vh]">
            <div class="p-5 border-b border-slate-100 flex justify-between items-start">
                <div>
                    <h3 class="font-black text-slate-800 uppercase tracking-tight">Heads of Department</h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Per subject · this branch &amp; session</p>
                </div>
                <button onclick="closeModal('hod-modal')" class="mini">✕</button>
            </div>
            <div id="hod-body" class="p-5 overflow-y-auto space-y-3"></div>
            <div class="p-5 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeModal('hod-modal')" class="btn bg-slate-100 text-slate-600">Cancel</button>
                <button id="hod-save" onclick="saveHods()" class="btn bg-indigo-600 text-white">Save HODs</button>
            </div>
        </div>
    </div>

    <!-- Syllabus editor (chapters -> topics) -->
    <div id="editor-modal" class="hidden fixed inset-0 bg-slate-100 z-50 flex flex-col">
        <div class="bg-white border-b border-slate-200 px-4 sm:px-8 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="min-w-0">
                <h3 id="ed-title" class="font-black text-slate-800 uppercase tracking-tight truncate"></h3>
                <p id="ed-totals" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-0.5"></p>
            </div>
            <div class="flex flex-wrap gap-2">
                <label id="ed-import-label" class="btn bg-emerald-50 text-emerald-700 border border-emerald-200 cursor-pointer">📥 Import Excel
                    <input type="file" id="ed-import" accept=".xlsx,.xls,.csv" class="hidden" onchange="importExcel(this)">
                </label>
                <button id="ed-add-ch" onclick="addChapter()" class="btn bg-indigo-50 text-indigo-700 border border-indigo-200">+ Chapter</button>
                <button id="ed-save" onclick="saveMaster()" class="btn bg-indigo-600 text-white">💾 Save</button>
                <button onclick="closeEditor()" class="btn bg-slate-100 text-slate-600">Close</button>
            </div>
        </div>
        <div id="ed-note" class="hidden mx-4 sm:mx-8 mt-3"></div>
        <div id="ed-body" class="flex-1 overflow-y-auto px-4 sm:px-8 py-4 space-y-3"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ============================================================================
        // SYLLABUS PRE-PLANNING (new academic sessions only, e.g. 2027-28)
        // Phase 1: admin sets dates / class duration / syllabus editors per class + subject,
        // chooses HODs per subject; editors type or import (Excel) chapters -> topics and reorder them.
        // Data lives only in the selected session's collections (e.g. ghumarwin_2027_28_...):
        //   syllabus_settings/{classKey}__{subjectKey}  dates, duration, editors + summary counts
        //   syllabus_masters/{classKey}__{subjectKey}   chapters[{id,name,targetDays,topics[{id,name,lec}]}]
        //   planner_roles/hods                          { subjects: { <subjectKey>: { subject, emails[] } } }
        // The current session (2026-27) is never read or written here.
        // ============================================================================
        const isAdmin = sessionStorage.getItem('minervaAdminAuth') === 'true';
        const activeStaff = (() => { try { return JSON.parse(localStorage.getItem('minervaActiveStaff') || 'null'); } catch (e) { return null; } })();
        if (!isAdmin && !activeStaff) window.location.replace('staff-login.html');
        const myEmail = String((activeStaff && activeStaff.email) || '').trim().toLowerCase();
        const myName = (activeStaff && activeStaff.name) || (isAdmin ? (sessionStorage.getItem('minervaAdminName') || 'Admin') : myEmail);

        let activeCenter = isAdmin
            ? (sessionStorage.getItem('minervaAdminCenter') || 'GHUMARWIN')
            : String((activeStaff && activeStaff.center) || 'GHUMARWIN').split(',')[0].trim().toUpperCase();

        const SKIP_SUBJECTS = ['BREAK', 'EVENT', 'EXAM', 'ASSEMBLY', 'LUNCH BREAK', 'FRUIT BREAK', 'NONE'];
        const norm = (s) => String(s || '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
        const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const newId = (p) => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;

        let branches = [], branchObj = null, session = null;
        let classes = [];            // [{ key, classId, className, sections:[name], subjects:[name] }]
        let settings = {};           // docId -> settings
        let hods = {};               // subjectKey -> { subject, emails[] }
        let staffList = null;        // loaded on demand (admin)

        function goBack() { window.location.href = isAdmin ? 'admin-lesson-planner.html' : 'teacher-portal.html'; }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function col(name) { return db.collection(MinervaContext.sessionDataPrefix(branchObj, session) + name); }
        function planKey(classKey, subject) { return `${classKey}__${norm(subject)}`; }

        // Only sessions that have their own data (not today's 2026-27 data)
        function isNewSessionObj(b, s) {
            return !!(b && s && !s.isStub && !MinervaContext.isLegacySession(b, s) &&
                      MinervaContext.sessionDataPrefix(b, s) !== MinervaContext.LEGACY_PREFIX[MinervaContext.branchCode(b)]);
        }
        function newSessionsOf(b) { return MinervaContext.sessionsForSwitcher(b).filter(s => isNewSessionObj(b, s)); }

        function pickSession(b) {
            const list = newSessionsOf(b);
            if (!list.length) return null;
            let stored = null; try { stored = sessionStorage.getItem('minervaAdminSessionId'); } catch (e) {}
            const picked = stored && list.find(s => s.id === stored);
            if (picked) return picked;
            const today = MinervaContext.todayIso();
            const running = list.find(s => s.startDate <= today && s.endDate >= today);
            if (running) return running;
            const upcoming = list.filter(s => s.startDate > today).sort((a, c) => a.startDate.localeCompare(c.startDate))[0];
            return upcoming || list[0];
        }

        function switchBranch(code) {
            if (!isAdmin) return;
            sessionStorage.setItem('minervaAdminCenter', code);
            MinervaContext.setAdminSelectedSession(null);
            window.location.reload();
        }
        function switchSession(id) {
            if (!id) return;
            MinervaContext.setAdminSelectedSession(id);
            window.location.reload();
        }

        // ---------------- permissions ----------------
        function hodEmails(subject) { const h = hods[norm(subject)]; return (h && h.emails) || []; }
        function canEdit(classKey, subject) {
            if (isAdmin) return true;
            const s = settings[planKey(classKey, subject)] || {};
            return (s.editors || []).some(e => String(e.email).toLowerCase() === myEmail) || hodEmails(subject).map(e => String(e).toLowerCase()).includes(myEmail);
        }

        // ---------------- loading ----------------
        async function init() {
            try { branches = await MinervaContext.loadBranches(db); } catch (e) { branches = []; }
            branchObj = MinervaContext.findBranch(branches, activeCenter);

            const bSel = document.getElementById('branch-switch');
            const codes = new Map([["GHUMARWIN", "Ghumarwin"], ["DHARAMSHALA", "Dharamshala"]]);
            branches.forEach(b => codes.set(MinervaContext.branchCode(b), b.name || MinervaContext.branchCode(b)));
            bSel.innerHTML = [...codes].map(([c, n]) => `<option value="${c}">📍 ${esc(n)}</option>`).join('');
            bSel.value = activeCenter;
            bSel.disabled = !isAdmin;

            session = branchObj ? pickSession(branchObj) : null;
            const sSel = document.getElementById('session-switch');
            const sessions = branchObj ? newSessionsOf(branchObj) : [];
            sSel.innerHTML = sessions.length
                ? sessions.map(s => `<option value="${s.id}">📅 ${esc(s.name)}${s.status === 'INACTIVE' ? ' • inactive' : ''}</option>`).join('')
                : '<option value="">📅 No new session</option>';
            if (session) sSel.value = session.id;

            if (!session) {
                showPageMsg('amber', `Syllabus pre-planning works for <b>new academic sessions</b> (e.g. 2027-28) only — not for today's 2026-27 data.<br>
                    ${isAdmin ? 'First add the next session on <b>Manage Branches</b> and its classes on <b>Class Structure</b>.' : 'Ask the admin to set up the next session.'}`);
                document.getElementById('class-list').innerHTML = '';
                return;
            }
            showPageMsg('indigo', `📅 Planning for session <b>${esc(session.name)}</b> (${esc(session.startDate)} to ${esc(session.endDate)}). The running 2026-27 planners are not affected.`);
            if (isAdmin) document.getElementById('hod-btn').classList.remove('hidden');

            try {
                const [structSnap, setSnap, hodDoc] = await Promise.all([
                    col('institute_structure').get(),
                    col('syllabus_settings').get(),
                    col('planner_roles').doc('hods').get()
                ]);
                const byClass = new Map();
                structSnap.docs.forEach(d => {
                    const x = d.data();
                    if (!x.className) return;
                    const key = x.classId || ('name_' + norm(x.className));
                    if (!byClass.has(key)) byClass.set(key, { key, classId: x.classId || '', className: x.className, sections: [], subjects: new Set() });
                    const c = byClass.get(key);
                    c.sections.push(x.sectionName);
                    (x.subjects || []).forEach(s => { if (!SKIP_SUBJECTS.includes(String(s).toUpperCase())) c.subjects.add(s); });
                });
                classes = [...byClass.values()].map(c => ({ ...c, subjects: [...c.subjects].sort(), sections: c.sections.sort() }))
                    .sort((a, b) => String(a.className).localeCompare(String(b.className), undefined, { numeric: true }));
                settings = {};
                setSnap.docs.forEach(d => { settings[d.id] = d.data(); });
                hods = (hodDoc.exists && hodDoc.data().subjects) || {};
            } catch (e) {
                console.error(e);
                showPageMsg('rose', 'Could not load the session data. Check the internet and reload.');
                return;
            }
            renderList();
        }

        function showPageMsg(tone, html) {
            const el = document.getElementById('page-msg');
            el.className = `mb-6 p-4 rounded-2xl border text-[11px] font-bold bg-${tone}-50 border-${tone}-200 text-${tone}-800`;
            el.innerHTML = html;
        }

        // ---------------- class / subject list ----------------
        function renderList() {
            const box = document.getElementById('class-list');
            if (!classes.length) {
                box.innerHTML = `<div class="py-16 text-center text-slate-400 font-bold text-xs border-2 border-dashed border-slate-200 rounded-3xl">No classes in session ${esc(session.name)} yet.<br>${isAdmin ? 'Add or copy them on <b>Class Structure</b> first.' : ''}</div>`;
                return;
            }
            let shown = 0;
            box.innerHTML = classes.map(c => {
                const rows = c.subjects.filter(sub => isAdmin || canEdit(c.key, sub)).map(sub => {
                    shown++;
                    const s = settings[planKey(c.key, sub)] || {};
                    const editors = (s.editors || []).map(e => e.name || e.email);
                    const hodN = hodEmails(sub).length;
                    const summary = s.chapterCount
                        ? `${s.chapterCount} chapters · ${s.topicCount} topics · ${s.totalDays || 0} days${s.duration ? ` · ${(s.totalDays || 0) * s.duration} min` : ''}`
                        : 'No syllabus yet';
                    const dates = s.startDate ? `${s.startDate} → ${s.endDate || '?'}` : 'Dates not set';
                    return `<div class="p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-100 last:border-0">
                        <div class="min-w-0">
                            <p class="text-sm font-black text-slate-800 uppercase tracking-wide">${esc(sub)}</p>
                            <div class="flex flex-wrap gap-1.5 mt-1.5">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">📅 ${esc(dates)}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">⏱ ${s.duration ? s.duration + ' min/class' : 'Duration not set'}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded ${s.chapterCount ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">📚 ${esc(summary)}</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-700">✍️ ${editors.length ? esc(editors.join(', ')) : 'No editor'}${hodN ? ` + ${hodN} HOD` : ''}</span>
                            </div>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            ${isAdmin ? `<button onclick="openSettings('${c.key}', ${c.subjects.indexOf(sub)})" class="btn bg-white border border-slate-200 text-slate-700">⚙️ Settings</button>` : ''}
                            <button onclick="openEditor('${c.key}', ${c.subjects.indexOf(sub)})" class="btn bg-indigo-600 text-white">📚 ${canEdit(c.key, sub) ? 'Edit syllabus' : 'View'}</button>
                        </div>
                    </div>`;
                }).join('');
                if (!rows) return '';
                return `<section class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="px-5 py-4 bg-slate-50 border-b border-slate-200 flex flex-wrap items-baseline gap-3">
                        <h2 class="text-lg font-black text-slate-800 uppercase">Class ${esc(c.className)}</h2>
                        <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Sections: ${esc(c.sections.join(', '))}</span>
                    </div>
                    ${rows}
                </section>`;
            }).join('');
            if (!shown) box.innerHTML = `<div class="py-16 text-center text-slate-400 font-bold text-xs border-2 border-dashed border-slate-200 rounded-3xl">You are not a syllabus editor or HOD for any subject in session ${esc(session.name)}.</div>`;
        }

        // ---------------- staff (admin pickers) ----------------
        async function loadStaff() {
            if (staffList) return staffList;
            const snap = await db.collection('staff_applications').where('status', '==', 'approved').get();
            staffList = snap.docs.map(d => {
                const x = d.data(), det = x.details || {};
                const nk = Object.keys(det).find(k => k.toLowerCase().includes('name'));
                const ck = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                const dk = Object.keys(det).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                return { email: String(x.email || '').toLowerCase(), name: nk ? det[nk] : x.email, center: ck ? String(det[ck]).toUpperCase() : 'GHUMARWIN', dept: dk ? String(det[dk]) : '' };
            }).filter(s => s.email && s.center.includes(activeCenter)).sort((a, b) => String(a.name).localeCompare(String(b.name)));
            return staffList;
        }

        // ---------------- settings (admin) ----------------
        let editingSettings = null;   // { classKey, subject, picked:Set(email) }
        async function openSettings(classKey, subjectIdx) {
            const c = classes.find(x => x.key === classKey);
            const subject = typeof subjectIdx === 'number' ? c.subjects[subjectIdx] : subjectIdx;
            const s = settings[planKey(classKey, subject)] || {};
            editingSettings = { classKey, subject, picked: new Set((s.editors || []).map(e => String(e.email).toLowerCase())) };
            document.getElementById('settings-sub').textContent = `Class ${c.className} · ${subject} · session ${session.name}`;
            document.getElementById('set-start').value = s.startDate || session.startDate || '';
            document.getElementById('set-end').value = s.endDate || '';
            document.getElementById('set-duration').value = s.duration || '';
            document.getElementById('editor-search').value = '';
            document.getElementById('editor-list').innerHTML = '<p class="p-3 text-[11px] font-bold text-slate-400">Loading staff…</p>';
            openModal('settings-modal');
            try { await loadStaff(); } catch (e) { document.getElementById('editor-list').innerHTML = '<p class="p-3 text-[11px] font-bold text-rose-500">Could not load staff.</p>'; return; }
            renderEditorChecklist();
        }
        function renderEditorChecklist() {
            if (!editingSettings || !staffList) return;
            const q = norm(document.getElementById('editor-search').value);
            const subj = norm(editingSettings.subject);
            const list = staffList.filter(s => !q || norm(s.name).includes(q) || norm(s.dept).includes(q))
                // same department first
                .sort((a, b) => (norm(b.dept).includes(subj) ? 1 : 0) - (norm(a.dept).includes(subj) ? 1 : 0));
            document.getElementById('editor-list').innerHTML = list.map(s => `
                <label class="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-slate-50">
                    <input type="checkbox" class="w-4 h-4 accent-indigo-600" ${editingSettings.picked.has(s.email) ? 'checked' : ''}
                        onchange="this.checked ? editingSettings.picked.add('${s.email}') : editingSettings.picked.delete('${s.email}')">
                    <span class="text-xs font-bold text-slate-800">${esc(s.name)}</span>
                    <span class="text-[10px] font-bold text-slate-400 uppercase ml-auto">${esc(s.dept.split(',')[0])}</span>
                </label>`).join('') || '<p class="p-3 text-[11px] font-bold text-slate-400">No staff found.</p>';
        }
        async function saveSettings() {
            if (!isAdmin || !editingSettings) return;
            const start = document.getElementById('set-start').value, end = document.getElementById('set-end').value;
            const duration = parseInt(document.getElementById('set-duration').value, 10) || 0;
            if (start && end && end < start) return alert('The target end date cannot be before the start date.');
            if (start && session.startDate && (start < session.startDate || start > session.endDate)) {
                if (!confirm(`The start date is outside session ${session.name} (${session.startDate} to ${session.endDate}). Save anyway?`)) return;
            }
            const c = classes.find(x => x.key === editingSettings.classKey);
            const editors = [...editingSettings.picked].map(email => { const s = (staffList || []).find(x => x.email === email); return { email, name: s ? s.name : email }; });
            const id = planKey(editingSettings.classKey, editingSettings.subject);
            const payload = { classKey: c.key, classId: c.classId, className: c.className, subject: editingSettings.subject,
                              startDate: start, endDate: end, duration, editors, settingsUpdatedAt: Date.now(), settingsUpdatedBy: myName };
            const btn = document.getElementById('settings-save'); btn.disabled = true; btn.textContent = 'Saving…';
            try {
                await col('syllabus_settings').doc(id).set(payload, { merge: true });
                settings[id] = { ...(settings[id] || {}), ...payload };
                closeModal('settings-modal');
                renderList();
            } catch (e) { alert('Save failed: ' + e.message); }
            finally { btn.disabled = false; btn.textContent = 'Save'; }
        }

        // ---------------- HODs per subject (admin) ----------------
        let hodDraft = {};
        async function openHodModal() {
            if (!isAdmin) return;
            const subjects = [...new Set(classes.flatMap(c => c.subjects))].sort();
            document.getElementById('hod-body').innerHTML = '<p class="text-[11px] font-bold text-slate-400">Loading staff…</p>';
            openModal('hod-modal');
            try { await loadStaff(); } catch (e) { document.getElementById('hod-body').innerHTML = '<p class="text-rose-500 text-xs font-bold">Could not load staff.</p>'; return; }
            hodDraft = {};
            subjects.forEach(sub => { hodDraft[norm(sub)] = { subject: sub, emails: new Set(hodEmails(sub).map(e => String(e).toLowerCase())) }; });
            document.getElementById('hod-body').innerHTML = subjects.length ? subjects.map(sub => {
                const k = norm(sub);
                const dept = staffList.filter(s => norm(s.dept).includes(k));
                const others = staffList.filter(s => !norm(s.dept).includes(k));
                const opt = (s) => `<label class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 accent-indigo-600" ${hodDraft[k].emails.has(s.email) ? 'checked' : ''}
                        onchange="this.checked ? hodDraft['${k}'].emails.add('${s.email}') : hodDraft['${k}'].emails.delete('${s.email}')">
                    <span class="text-[11px] font-bold text-slate-700">${esc(s.name)}</span></label>`;
                return `<details class="border border-slate-200 rounded-2xl bg-slate-50" ${hodDraft[k].emails.size ? '' : ''}>
                    <summary class="p-3 cursor-pointer flex justify-between items-center">
                        <span class="text-xs font-black text-slate-800 uppercase">${esc(sub)}</span>
                        <span class="text-[10px] font-bold text-indigo-600">${hodDraft[k].emails.size ? hodDraft[k].emails.size + ' HOD' : 'No HOD'}</span>
                    </summary>
                    <div class="p-3 pt-0 space-y-2">
                        <div class="flex flex-wrap gap-1.5">${dept.map(opt).join('') || '<span class="text-[10px] font-bold text-slate-400">No staff with this department</span>'}</div>
                        ${others.length ? `<details><summary class="text-[10px] font-black text-slate-500 uppercase cursor-pointer">Other staff (${others.length})</summary><div class="flex flex-wrap gap-1.5 mt-2">${others.map(opt).join('')}</div></details>` : ''}
                    </div>
                </details>`;
            }).join('') : '<p class="text-xs font-bold text-slate-400">No subjects in this session yet.</p>';
        }
        async function saveHods() {
            if (!isAdmin) return;
            const subjects = {};
            Object.entries(hodDraft).forEach(([k, v]) => { subjects[k] = { subject: v.subject, emails: [...v.emails] }; });
            const btn = document.getElementById('hod-save'); btn.disabled = true; btn.textContent = 'Saving…';
            try {
                await col('planner_roles').doc('hods').set({ subjects, updatedAt: Date.now(), updatedBy: myName });
                hods = subjects;
                closeModal('hod-modal');
                renderList();
            } catch (e) { alert('Save failed: ' + e.message); }
            finally { btn.disabled = false; btn.textContent = 'Save HODs'; }
        }

        // ---------------- syllabus editor ----------------
        let ed = null;   // { classKey, subject, chapters, loadedUpdatedAt, dirty, readOnly, open: Set(chapterId) }

        async function openEditor(classKey, subjectIdx) {
            const c = classes.find(x => x.key === classKey);
            const subject = typeof subjectIdx === 'number' ? c.subjects[subjectIdx] : subjectIdx;
            const readOnly = !canEdit(classKey, subject);
            ed = { classKey, subject, className: c.className, chapters: [], loadedUpdatedAt: 0, dirty: false, readOnly, open: new Set() };
            document.getElementById('ed-title').textContent = `Class ${c.className} · ${subject}`;
            ['ed-import-label', 'ed-add-ch', 'ed-save'].forEach(id => document.getElementById(id).classList.toggle('hidden', readOnly));
            document.getElementById('ed-body').innerHTML = '<p class="py-16 text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">Loading…</p>';
            setEdNote('');
            openModal('editor-modal');
            try {
                const doc = await col('syllabus_masters').doc(planKey(classKey, subject)).get();
                if (doc.exists) {
                    const d = doc.data();
                    ed.chapters = (d.chapters || []).map(ch => ({ ...ch, topics: (ch.topics || []).map(t => ({ ...t })) }));
                    ed.loadedUpdatedAt = d.updatedAt || 0;
                }
            } catch (e) {
                document.getElementById('ed-body').innerHTML = '<p class="py-16 text-center text-rose-500 font-bold text-xs">Could not load the syllabus.</p>';
                return;
            }
            renderEditor();
        }
        function setEdNote(html, tone = 'amber') {
            const el = document.getElementById('ed-note');
            if (!html) { el.className = 'hidden'; el.innerHTML = ''; return; }
            el.className = `mx-4 sm:mx-8 mt-3 p-3 rounded-xl border text-[11px] font-bold bg-${tone}-50 border-${tone}-200 text-${tone}-800`;
            el.innerHTML = html;
        }
        function markDirty() { ed.dirty = true; updateTotals(); }
        function totals() {
            const topics = ed.chapters.reduce((a, ch) => a + ch.topics.length, 0);
            const days = ed.chapters.reduce((a, ch) => a + (Number(ch.targetDays) || 0), 0);
            return { chapters: ed.chapters.length, topics, days };
        }
        function updateTotals() {
            const t = totals();
            const dur = (settings[planKey(ed.classKey, ed.subject)] || {}).duration || 0;
            document.getElementById('ed-totals').textContent =
                `${t.chapters} chapters · ${t.topics} topics · ${t.days} target days${dur ? ` · ${t.days * dur} min (${dur} min/class)` : ''}${ed.dirty ? ' · ● unsaved changes' : ''}${ed.readOnly ? ' · view only' : ''}`;
        }

        function renderEditor() {
            const body = document.getElementById('ed-body');
            const ro = ed.readOnly ? 'disabled' : '';
            if (!ed.chapters.length) {
                body.innerHTML = `<div class="py-16 text-center text-slate-400 font-bold text-xs border-2 border-dashed border-slate-300 rounded-3xl bg-white">
                    No chapters yet.${ed.readOnly ? '' : '<br>Press <b>+ Chapter</b> to type them, or <b>📥 Import Excel</b> (columns: Chapter Name, Lec #, Subtopic Name, Target Days).'}</div>`;
                updateTotals();
                return;
            }
            body.innerHTML = ed.chapters.map((ch, ci) => {
                const isOpen = ed.open.has(ch.id);
                const lecs = new Set(ch.topics.map(t => t.lec).filter(x => x !== '' && x != null)).size;
                return `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm">
                    <div class="p-3 flex flex-wrap items-center gap-2">
                        <span class="text-[11px] font-black text-slate-400 w-6 text-right">${ci + 1}.</span>
                        <button class="mini" ${ro} ${ci === 0 ? 'disabled' : ''} onclick="moveChapter(${ci}, -1)" title="Move up">↑</button>
                        <button class="mini" ${ro} ${ci === ed.chapters.length - 1 ? 'disabled' : ''} onclick="moveChapter(${ci}, 1)" title="Move down">↓</button>
                        <input class="inp flex-1 min-w-[12rem] uppercase" ${ro} value="${esc(ch.name)}" placeholder="Chapter name" onchange="ed.chapters[${ci}].name = this.value.trim(); markDirty()">
                        <label class="flex items-center gap-1 text-[10px] font-black text-slate-500 uppercase">Days
                            <input type="number" min="0" step="0.5" class="inp !w-20" ${ro} value="${ch.targetDays ?? ''}" onchange="ed.chapters[${ci}].targetDays = this.value === '' ? '' : Number(this.value); markDirty()">
                        </label>
                        <button class="btn bg-slate-100 text-slate-600" onclick="toggleChapter('${ch.id}')">${isOpen ? '▲' : '▼'} ${ch.topics.length} topics${lecs ? ` · ${lecs} lec` : ''}</button>
                        ${ed.readOnly ? '' : `<button class="mini !text-rose-600" onclick="deleteChapter(${ci})" title="Delete chapter">✕</button>`}
                    </div>
                    ${isOpen ? `<div class="px-3 pb-3 space-y-1.5 border-t border-slate-100 pt-3">
                        ${ch.topics.map((t, ti) => `<div class="flex items-center gap-2">
                            <span class="text-[10px] font-black text-slate-300 w-6 text-right">${ti + 1}</span>
                            <button class="mini" ${ro} ${ti === 0 ? 'disabled' : ''} onclick="moveTopic(${ci}, ${ti}, -1)">↑</button>
                            <button class="mini" ${ro} ${ti === ch.topics.length - 1 ? 'disabled' : ''} onclick="moveTopic(${ci}, ${ti}, 1)">↓</button>
                            <input type="number" min="1" class="inp !w-16" title="Lecture number" placeholder="Lec" ${ro} value="${t.lec ?? ''}" onchange="ed.chapters[${ci}].topics[${ti}].lec = this.value === '' ? '' : Number(this.value); markDirty()">
                            <input class="inp flex-1" ${ro} value="${esc(t.name)}" placeholder="Topic name" onchange="ed.chapters[${ci}].topics[${ti}].name = this.value.trim(); markDirty()">
                            ${ed.readOnly ? '' : `<button class="mini !text-rose-600" onclick="deleteTopic(${ci}, ${ti})">✕</button>`}
                        </div>`).join('')}
                        ${ed.readOnly ? '' : `<button class="btn bg-indigo-50 text-indigo-700 border border-indigo-200 mt-1" onclick="addTopic(${ci})">+ Topic</button>`}
                    </div>` : ''}
                </div>`;
            }).join('');
            updateTotals();
        }
        function toggleChapter(id) { ed.open.has(id) ? ed.open.delete(id) : ed.open.add(id); renderEditor(); }
        function addChapter() {
            const name = prompt('Chapter name:');
            if (!name || !name.trim()) return;
            const ch = { id: newId('ch'), name: name.trim(), targetDays: '', topics: [] };
            ed.chapters.push(ch); ed.open.add(ch.id); markDirty(); renderEditor();
        }
        function addTopic(ci) {
            const ch = ed.chapters[ci];
            const last = ch.topics[ch.topics.length - 1];
            ch.topics.push({ id: newId('tp'), name: '', lec: last && last.lec ? last.lec : '' });
            markDirty(); renderEditor();
        }
        function moveChapter(ci, d) { const a = ed.chapters; const j = ci + d; if (j < 0 || j >= a.length) return; [a[ci], a[j]] = [a[j], a[ci]]; markDirty(); renderEditor(); }
        function moveTopic(ci, ti, d) { const a = ed.chapters[ci].topics; const j = ti + d; if (j < 0 || j >= a.length) return; [a[ti], a[j]] = [a[j], a[ti]]; markDirty(); renderEditor(); }
        function deleteChapter(ci) {
            const ch = ed.chapters[ci];
            if (!confirm(`Delete chapter "${ch.name}" and its ${ch.topics.length} topics?`)) return;
            ed.chapters.splice(ci, 1); markDirty(); renderEditor();
        }
        function deleteTopic(ci, ti) { ed.chapters[ci].topics.splice(ti, 1); markDirty(); renderEditor(); }
        function closeEditor() {
            if (ed && ed.dirty && !confirm('You have unsaved changes. Close without saving?')) return;
            closeModal('editor-modal');
            ed = null;
        }

        // Excel import, same layout as today's planner sheets:
        //   Chapter Name | Lec # | Subtopic Name | Target Days | Std. Duration | Target Mins
        // (header row found automatically; Target Days is per chapter, repeated on each row)
        function parseSyllabusRows(rows) {
            const hi = rows.findIndex(r => r.some(c => /chapter/i.test(String(c))) && r.some(c => /topic/i.test(String(c))));
            if (hi < 0) throw new Error('Could not find the header row (needs "Chapter Name" and "Subtopic Name" columns).');
            const h = rows[hi].map(c => String(c).trim().toLowerCase());
            const find = (re) => h.findIndex(c => re.test(c));
            const cCh = find(/chapter/), cTp = find(/sub\s*topic|topic/), cLec = find(/lec/), cDays = find(/target\s*days|^days/), cDur = find(/duration/);
            const chapters = [], byName = new Map();
            let durations = new Set();
            rows.slice(hi + 1).forEach(r => {
                const chName = String(r[cCh] == null ? '' : r[cCh]).trim();
                const tName = String(r[cTp] == null ? '' : r[cTp]).trim();
                if (!chName || !tName) return;
                const key = chName.toUpperCase().replace(/\s+/g, ' ');
                if (!byName.has(key)) { const ch = { id: newId('ch'), name: chName, targetDays: '', topics: [] }; byName.set(key, ch); chapters.push(ch); }
                const ch = byName.get(key);
                const lec = cLec >= 0 && r[cLec] !== '' && r[cLec] != null ? Number(r[cLec]) : '';
                ch.topics.push({ id: newId('tp'), name: tName, lec: isNaN(lec) ? '' : lec });
                if (cDays >= 0 && r[cDays] !== '' && r[cDays] != null && !isNaN(Number(r[cDays]))) {
                    ch.targetDays = Math.max(Number(ch.targetDays) || 0, Number(r[cDays]));
                }
                if (cDur >= 0 && r[cDur] !== '' && !isNaN(Number(r[cDur]))) durations.add(Number(r[cDur]));
            });
            // no Target Days column: one day per lecture
            chapters.forEach(ch => { if (ch.targetDays === '') { const n = new Set(ch.topics.map(t => t.lec).filter(x => x !== '')).size; ch.targetDays = n || ''; } });
            return { chapters, durations: [...durations] };
        }
        function importExcel(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file || !ed || ed.readOnly) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                    const res = parseSyllabusRows(rows);
                    if (!res.chapters.length) return alert('No chapters / topics found in the sheet.');
                    const t = { ch: res.chapters.length, tp: res.chapters.reduce((a, c) => a + c.topics.length, 0), days: res.chapters.reduce((a, c) => a + (Number(c.targetDays) || 0), 0) };
                    let mode = 'replace';
                    if (ed.chapters.length) {
                        mode = confirm(`Found ${t.ch} chapters, ${t.tp} topics, ${t.days} target days in "${file.name}".\n\nOK = REPLACE the current list (${ed.chapters.length} chapters)\nCancel = ADD them after the current list`) ? 'replace' : 'append';
                    }
                    ed.chapters = mode === 'replace' ? res.chapters : ed.chapters.concat(res.chapters);
                    ed.open = new Set();
                    markDirty(); renderEditor();
                    const dur = (settings[planKey(ed.classKey, ed.subject)] || {}).duration;
                    setEdNote(`📥 Imported ${t.ch} chapters, ${t.tp} topics, ${t.days} target days from <b>${esc(file.name)}</b>. Review and reorder, then press <b>💾 Save</b>.` +
                        (res.durations.length && !dur ? `<br>The sheet uses a ${res.durations.join(' / ')} min class duration — the admin can set it in ⚙️ Settings.` : ''), 'emerald');
                } catch (err) { alert('Import failed: ' + err.message); }
            };
            reader.readAsArrayBuffer(file);
        }

        async function saveMaster() {
            if (!ed || ed.readOnly) return;
            const blank = ed.chapters.find(ch => !ch.name);
            if (blank) return alert('Every chapter needs a name.');
            const cleanChapters = ed.chapters.map(ch => ({
                id: ch.id, name: ch.name, targetDays: ch.targetDays === '' ? '' : Number(ch.targetDays),
                topics: ch.topics.filter(t => t.name).map(t => ({ id: t.id, name: t.name, lec: t.lec === '' ? '' : Number(t.lec) }))
            }));
            const id = planKey(ed.classKey, ed.subject);
            const t = { chapters: cleanChapters.length, topics: cleanChapters.reduce((a, c) => a + c.topics.length, 0),
                        days: cleanChapters.reduce((a, c) => a + (Number(c.targetDays) || 0), 0) };
            const btn = document.getElementById('ed-save'); btn.disabled = true; btn.textContent = 'Saving…';
            try {
                const now = Date.now();
                const masterRef = col('syllabus_masters').doc(id), settingsRef = col('syllabus_settings').doc(id);
                const c = classes.find(x => x.key === ed.classKey);
                await db.runTransaction(async (tx) => {
                    const cur = await tx.get(masterRef);
                    const curAt = cur.exists ? (cur.data().updatedAt || 0) : 0;
                    if (curAt && curAt !== ed.loadedUpdatedAt) {
                        const by = cur.data().updatedBy || 'someone else';
                        if (!confirm(`⚠️ ${by} saved this syllabus after you opened it.\n\nOK = overwrite with your version\nCancel = keep theirs (reopen to see it)`)) throw new Error('CANCELLED');
                    }
                    tx.set(masterRef, { classKey: c.key, classId: c.classId, className: c.className, subject: ed.subject,
                                        chapters: cleanChapters, updatedAt: now, updatedBy: myName });
                    tx.set(settingsRef, { classKey: c.key, classId: c.classId, className: c.className, subject: ed.subject,
                                          chapterCount: t.chapters, topicCount: t.topics, totalDays: t.days, syllabusUpdatedAt: now, syllabusUpdatedBy: myName }, { merge: true });
                });
                ed.loadedUpdatedAt = now; ed.dirty = false;
                ed.chapters = cleanChapters.map(ch => ({ ...ch, topics: ch.topics.map(x => ({ ...x })) }));
                settings[id] = { ...(settings[id] || {}), chapterCount: t.chapters, topicCount: t.topics, totalDays: t.days };
                renderEditor(); renderList();
                setEdNote(`✅ Saved: ${t.chapters} chapters, ${t.topics} topics, ${t.days} target days.`, 'emerald');
            } catch (e) {
                if (e.message !== 'CANCELLED') alert('Save failed: ' + e.message);
            } finally { btn.disabled = false; btn.textContent = '💾 Save'; }
        }

        window.addEventListener('beforeunload', (e) => { if (ed && ed.dirty) { e.preventDefault(); e.returnValue = ''; } });
        init();
    </script>
</body>
</html>
