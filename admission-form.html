<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Admission Form</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); }
        .input-field { width: 100%; padding: 0.875rem 1rem; border-radius: 0.75rem; border: 2px solid #e2e8f0; outline: none; font-weight: 700; color: #334155; font-size: 0.875rem; transition: all 0.2s; background: white; }
        .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .input-field:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; border-color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen relative overflow-x-hidden flex items-center justify-center py-10 px-4">

    <!-- Ambient Background -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-[500px] h-72 sm:h-[500px] bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-[500px] h-72 sm:h-[500px] bg-indigo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <div class="w-full max-w-3xl glass-card rounded-[2.5rem] p-6 sm:p-10 relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="inline-block p-3 bg-white rounded-2xl shadow-sm border border-slate-100 mb-4">
                <img src="logo.png?v=2" alt="Minerva Logo" class="w-12 h-12 object-contain" onerror="this.src='https://via.placeholder.com/50?text=M'">
            </div>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-900 uppercase tracking-tight leading-none">Student Admission Form</h2>
            <p class="text-[10px] sm:text-xs font-bold text-blue-500 uppercase tracking-[0.2em] mt-2">Minerva Study Circle</p>
        </div>

        <form id="admission-form" onsubmit="submitAdmissionForm(event)" class="space-y-6">
            
            <div class="bg-blue-50/50 border border-blue-100 p-5 rounded-2xl">
                <h3 class="text-xs font-black text-blue-800 uppercase tracking-widest mb-4 border-b border-blue-200 pb-2">Academic Placement</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Center *</label>
                        <select id="form-center" required onchange="loadClasses(this.value)" class="input-field uppercase">
                            <option value="">Select Branch</option>
                            <option value="GHUMARWIN">GHUMARWIN</option>
                            <option value="DHARAMSHALA">DHARAMSHALA</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Class *</label>
                        <select id="form-class" required onchange="loadSections(this.value)" class="input-field uppercase" disabled>
                            <option value="">Select Center First</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Section *</label>
                        <select id="form-section" required class="input-field uppercase" disabled>
                            <option value="">Select Class First</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Roll No (Leave blank to auto-generate)</label><input type="text" id="form-roll" class="input-field uppercase" placeholder="Optional"></div>
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Full Name *</label><input type="text" id="form-name" required class="input-field uppercase" placeholder="Student Name"></div>
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Gender *</label>
                    <select id="form-gender" required class="input-field uppercase"><option value="M">Male</option><option value="F">Female</option></select>
                </div>
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Admission Date</label><input type="date" id="form-add-date" class="input-field"></div>
                
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Father's Name</label><input type="text" id="form-father" class="input-field uppercase"></div>
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Mother's Name</label><input type="text" id="form-mother" class="input-field uppercase"></div>
                
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Father's Mobile *</label><input type="tel" id="form-fmobile" required maxlength="10" class="input-field" placeholder="10-digit number"></div>
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Mother's Mobile</label><input type="tel" id="form-mmobile" maxlength="10" class="input-field" placeholder="Optional"></div>
                
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">WhatsApp 1</label><input type="tel" id="form-wa1" maxlength="10" class="input-field" placeholder="Primary WhatsApp"></div>
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">WhatsApp 2</label><input type="tel" id="form-wa2" maxlength="10" class="input-field" placeholder="Secondary WhatsApp"></div>
                
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Category</label><input type="text" id="form-category" class="input-field uppercase" placeholder="e.g. Gen, SC, OBC"></div>
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Aadhaar No</label><input type="text" id="form-aadhar" class="input-field" placeholder="12-digit Aadhaar"></div>
                
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Previous School</label><input type="text" id="form-school" class="input-field uppercase" placeholder="School Name"></div>
                <div><label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 pl-1">Station/City</label><input type="text" id="form-station" class="input-field uppercase" placeholder="City/Village"></div>
            </div>

            <div class="pt-4 border-t border-slate-100">
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl uppercase tracking-widest text-sm shadow-xl active:scale-95 transition-all">
                    Submit Application
                </button>
            </div>
        </form>

        <div id="success-screen" class="hidden text-center py-10 flex flex-col items-center justify-center">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mb-4">✅</div>
            <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Application Submitted!</h2>
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-2">Welcome to Minerva Study Circle.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];

        window.onload = () => {
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(today - offset)).toISOString().slice(0, 10);
            document.getElementById('form-add-date').value = localISOTime;

            processURLParameters();
        };

        async function processURLParameters() {
            const params = new URLSearchParams(window.location.search);
            const pCenter = params.get('center');
            const pClass = params.get('class');
            const pSec = params.get('sec');

            const cSelect = document.getElementById('form-center');
            const clSelect = document.getElementById('form-class');
            const sSelect = document.getElementById('form-section');

            if (pCenter) {
                cSelect.value = pCenter.toUpperCase();
                cSelect.disabled = true;
                await loadClasses(cSelect.value);

                if (pClass) {
                    setTimeout(() => {
                        clSelect.value = pClass;
                        clSelect.disabled = true;
                        loadSections(clSelect.value);
                        
                        if (pSec) {
                            setTimeout(() => {
                                sSelect.value = pSec;
                                sSelect.disabled = true;
                            }, 500);
                        }
                    }, 500);
                }
            }
        }

        async function loadClasses(branch) {
            const classSelect = document.getElementById('form-class');
            const secSelect = document.getElementById('form-section');
            classSelect.innerHTML = '<option value="">Loading...</option>';
            secSelect.innerHTML = '<option value="">Select Class First</option>';
            
            if(!branch) {
                classSelect.disabled = true; secSelect.disabled = true; return;
            }

            try {
                const collectionName = branch === "GHUMARWIN" ? "institute_structure" : `${branch.toLowerCase()}_institute_structure`;
                const snap = await db.collection(collectionName).get();
                structureData = snap.docs.map(d => d.data());

                const uniqueClasses = [...new Set(structureData.map(s => s.className))].sort();
                classSelect.innerHTML = '<option value="">Select Class</option>' + uniqueClasses.map(c => `<option value="${c}">${c}</option>`).join('');
                classSelect.disabled = false;
            } catch (e) {
                classSelect.innerHTML = '<option value="">Error</option>';
            }
        }

        function loadSections(className) {
            const secSelect = document.getElementById('form-section');
            secSelect.innerHTML = '<option value="">Select Section</option>';
            
            if(!className) { secSelect.disabled = true; return; }

            const sections = structureData.filter(s => s.className === className).map(s => s.sectionName).sort();
            secSelect.innerHTML = '<option value="">Select Section</option>' + sections.map(s => `<option value="${s}">Sec ${s}</option>`).join('');
            secSelect.disabled = false;
        }

        async function submitAdmissionForm(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = "⏳ Submitting..."; btn.disabled = true;

            const clean = (id) => document.getElementById(id).value.trim();
            const center = document.getElementById('form-center').value;
            const cls = document.getElementById('form-class').value;
            const sec = document.getElementById('form-section').value;

            if(!center || !cls || !sec) {
                alert("Academic Placement (Center, Class, Section) is required.");
                btn.innerHTML = "Submit Application"; btn.disabled = false;
                return;
            }

            let roll = clean('form-roll');
            if(!roll) roll = "MSC_" + Math.random().toString(36).substr(2, 6).toUpperCase();

            const stu = {
                rollNo: roll.toUpperCase(),
                name: clean('form-name'),
                addDate: clean('form-add-date'),
                gender: clean('form-gender'),
                fatherName: clean('form-father'),
                motherName: clean('form-mother'),
                fMobile: clean('form-fmobile'),
                mMobile: clean('form-mmobile'),
                whatsapp1: clean('form-wa1'),
                whatsapp2: clean('form-wa2'),
                category: clean('form-category'),
                aadhar: clean('form-aadhar'),
                prevSchool: clean('form-school'),
                station: clean('form-station'),
                className: cls,
                section: sec,
                center: center,
                isActive: true,
                timestamp: Date.now()
            };

            const cleanRollForId = stu.rollNo.replace(/[^a-zA-Z0-9]/g, '_');
            const docId = `${center}_${cls.replace(/[^a-zA-Z0-9]/g, '')}_${sec.replace(/[^a-zA-Z0-9]/g, '')}_${cleanRollForId}`;
            const collectionName = center === "GHUMARWIN" ? "students" : `${center.toLowerCase()}_students`;

            try {
                await db.collection(collectionName).doc(docId).set(stu, { merge: true });
                document.getElementById('admission-form').classList.add('hidden');
                document.getElementById('success-screen').classList.remove('hidden');
                document.getElementById('success-screen').classList.add('flex');
            } catch (err) {
                console.error(err);
                alert("Failed to submit form. Please check your connection.");
                btn.innerHTML = "Submit Application"; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
