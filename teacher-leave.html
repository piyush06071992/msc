<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Leave Management</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #0ea5e9; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex items-center justify-between shadow-lg sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none">Leave Application</h1>
                <p class="text-[10px] text-sky-300 font-bold uppercase tracking-widest mt-1">Request & Absence Management</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 sm:p-8 space-y-6">
        
        <div class="glass-card p-6 rounded-[2rem] shadow-sm border border-slate-200">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="text-[9px] font-black text-slate-400 uppercase">Staff Name</span>
                    <p id="pref-name" class="font-bold text-slate-800 text-sm">Loading...</p>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="text-[9px] font-black text-slate-400 uppercase">Department</span>
                    <p id="pref-dept" class="font-bold text-slate-800 text-sm">Loading...</p>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="text-[9px] font-black text-slate-400 uppercase">Centre</span>
                    <p id="pref-center" class="font-bold text-slate-800 text-sm text-sky-600">Loading...</p>
                </div>
            </div>
        </div>

        <div class="glass-card p-6 sm:p-10 rounded-[2.5rem] shadow-md border border-slate-200">
            <h3 class="font-black text-slate-900 text-lg uppercase tracking-tight mb-6 flex items-center gap-3">
                <span class="bg-sky-100 text-sky-600 p-2 rounded-xl">📝</span> Leave Details
            </h3>

            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-3">Select Leave Category</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="setLeaveType('FULL')" id="btn-FULL" class="leave-type-btn p-4 rounded-2xl border-2 border-slate-100 font-black text-[10px] sm:text-xs uppercase tracking-widest hover:bg-slate-50 transition-all">Full Day</button>
                        <button onclick="setLeaveType('HALF')" id="btn-HALF" class="leave-type-btn p-4 rounded-2xl border-2 border-slate-100 font-black text-[10px] sm:text-xs uppercase tracking-widest hover:bg-slate-50 transition-all">Half Day</button>
                        <button onclick="setLeaveType('SHORT')" id="btn-SHORT" class="leave-type-btn p-4 rounded-2xl border-2 border-slate-100 font-black text-[10px] sm:text-xs uppercase tracking-widest hover:bg-slate-50 transition-all">Short Leave</button>
                    </div>
                </div>

                <div id="dynamic-inputs" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4 animate-in fade-in duration-300">
                    <div id="start-date-wrap">
                        <label id="date-label-1" class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Start Date</label>
                        <input type="date" id="leave-start-date" onchange="runClashAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 outline-none focus:border-sky-500">
                    </div>
                    <div id="end-date-wrap">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">End Date</label>
                        <input type="date" id="leave-end-date" onchange="runClashAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 outline-none focus:border-sky-500">
                    </div>
                    <div id="start-time-wrap" class="hidden">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Start Time</label>
                        <input type="time" id="leave-start-time" onchange="runClashAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 outline-none focus:border-sky-500">
                    </div>
                    <div id="duration-wrap" class="hidden">
                        <label id="duration-label" class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Duration (Hours)</label>
                        <input type="number" id="leave-duration" value="1" oninput="runClashAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 outline-none focus:border-sky-500 text-center">
                    </div>
                </div>
            </div>
        </div>

        <div id="analysis-section" class="hidden space-y-6 animate-in slide-in-from-bottom-4 duration-500">
            
            <div class="bg-rose-50 border-2 border-rose-200 rounded-[2rem] p-6">
                <h4 class="text-rose-800 font-black uppercase text-xs tracking-widest mb-4 flex items-center gap-2">
                    <span>🚨</span> Impacted Classes
                </h4>
                <div id="clash-list" class="space-y-3">
                    </div>
            </div>

            <div class="bg-white border-2 border-sky-200 rounded-[2.5rem] p-6 sm:p-8 shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h4 class="text-slate-900 font-black uppercase text-sm tracking-tight">Available Substitutes</h4>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Staff free during your absence</p>
                    </div>
                    <div id="free-count-badge" class="bg-sky-500 text-white px-4 py-1.5 rounded-full font-black text-xs">0 Found</div>
                </div>

                <div id="replacement-container" class="space-y-3 max-h-60 overflow-y-auto custom-scroll pr-2">
                    </div>
                
                <div class="mt-8 pt-6 border-t border-slate-100">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Reason for Leave</label>
                    <textarea id="leave-reason" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-sky-500" placeholder="State your reason..."></textarea>
                </div>

                <button id="submit-btn" onclick="submitLeaveRequest()" class="w-full mt-6 bg-slate-900 text-white font-black py-5 rounded-2xl uppercase tracking-widest text-sm shadow-xl hover:bg-sky-600 transition-all active:scale-95">
                    Submit Leave Application
                </button>
            </div>
        </div>
    </main>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null, currentLeaveType = null;
        let timetableData = [], staffData = [];

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');

            document.getElementById('pref-name').innerText = activeStaff.name || activeStaff.email;
            document.getElementById('pref-dept').innerText = activeStaff.dept || "General";
            document.getElementById('pref-center').innerText = activeStaff.center || "GHUMARWIN";

            await loadData();
        };

        async function loadData() {
            const center = activeStaff.center || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            
            const [ttSnap, staffSnap] = await Promise.all([
                db.collection(prefix + "timetable").get(),
                db.collection("staff_applications").where("status", "==", "approved").get()
            ]);

            timetableData = ttSnap.docs.map(d => d.data());
            staffData = staffSnap.docs.map(d => {
                const data = d.data();
                const det = data.details || {};
                const cKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                const sCenter = cKey ? String(det[cKey]).toUpperCase() : "GHUMARWIN";
                let name = data.email;
                for(let k in det) { if(k.toLowerCase().includes('name')) name = det[k]; }
                return { email: data.email, name, center: sCenter, rawDept: det.Department || det.Subject || "General" };
            }).filter(s => s.center === center);
        }

        function setLeaveType(type) {
            currentLeaveType = type;
            document.querySelectorAll('.leave-type-btn').forEach(b => b.classList.remove('border-sky-500', 'bg-sky-50', 'text-sky-600'));
            document.getElementById('btn-' + type).classList.add('border-sky-500', 'bg-sky-50', 'text-sky-600');
            
            const inputs = document.getElementById('dynamic-inputs');
            const endWrap = document.getElementById('end-date-wrap');
            const timeWrap = document.getElementById('start-time-wrap');
            const durWrap = document.getElementById('duration-wrap');
            const durInp = document.getElementById('leave-duration');

            inputs.classList.remove('hidden');
            
            if (type === 'FULL') {
                endWrap.classList.remove('hidden');
                timeWrap.classList.add('hidden');
                durWrap.classList.add('hidden');
                document.getElementById('date-label-1').innerText = "Start Date";
            } else {
                endWrap.classList.add('hidden');
                timeWrap.classList.remove('hidden');
                durWrap.classList.remove('hidden');
                document.getElementById('date-label-1').innerText = "Select Date";
                
                if (type === 'HALF') {
                    document.getElementById('duration-label').innerText = "Duration (1-5 Hours)";
                    durInp.min = 1; durInp.max = 5; durInp.step = 0.5; durInp.value = 4;
                } else {
                    document.getElementById('duration-label').innerText = "Duration (Minutes)";
                    durInp.min = 5; durInp.max = 60; durInp.step = 5; durInp.value = 30;
                }
            }
            runClashAnalysis();
        }

        function timeToMins(tStr) {
            const [h, m] = tStr.split(':').map(Number);
            return h * 60 + m;
        }

        async function runClashAnalysis() {
            const startDate = document.getElementById('leave-start-date').value;
            if (!startDate) return;

            document.getElementById('analysis-section').classList.remove('hidden');
            const clashList = document.getElementById('clash-list');
            const replacementArea = document.getElementById('replacement-container');
            
            clashList.innerHTML = '<div class="loader"></div>';
            
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[new Date(startDate).getDay()];
            
            let myClasses = timetableData.filter(t => t.day === dayName && (t.teacherName === activeStaff.name || t.teacher === activeStaff.name));
            let leaveStart = 0, leaveEnd = 1440; // Default Full Day

            if (currentLeaveType !== 'FULL') {
                const startTimeStr = document.getElementById('leave-start-time').value;
                const durVal = parseFloat(document.getElementById('leave-duration').value) || 0;
                if (!startTimeStr) return;
                
                leaveStart = timeToMins(startTimeStr);
                leaveEnd = (currentLeaveType === 'HALF') ? leaveStart + (durVal * 60) : leaveStart + durVal;
            }

            // 1. Identify Clashes
            let clashes = myClasses.filter(cls => {
                const [sStr, eStr] = cls.timeRange.split(' - ');
                const cS = timeToMins(formatTo24(sStr));
                const cE = timeToMins(formatTo24(eStr));
                return (leaveStart < cE && leaveEnd > cS);
            });

            if (clashes.length === 0) {
                clashList.innerHTML = `<div class="bg-emerald-50 text-emerald-700 p-4 rounded-xl font-bold text-xs uppercase tracking-widest border border-emerald-100">✅ No classes found during this period.</div>`;
            } else {
                clashList.innerHTML = clashes.map(c => `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-rose-100 flex justify-between items-center">
                        <div>
                            <p class="font-black text-slate-800 text-sm uppercase">${c.subject}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${c.className} (${c.section})</p>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-rose-600 text-xs">${c.timeRange}</p>
                        </div>
                    </div>
                `).join('');
            }

            // 2. Find Replacements
            const freeStaff = staffData.filter(s => {
                if (s.email === activeStaff.email) return false;
                const sTt = timetableData.filter(t => t.day === dayName && (t.teacherName === s.name || t.teacher === s.name));
                return !sTt.some(slot => {
                    const [sStr, eStr] = slot.timeRange.split(' - ');
                    const cS = timeToMins(formatTo24(sStr));
                    const cE = timeToMins(formatTo24(eStr));
                    return (leaveStart < cE && leaveEnd > cS);
                });
            });

            document.getElementById('free-count-badge').innerText = `${freeStaff.length} Found`;
            replacementArea.innerHTML = freeStaff.map(s => `
                <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center group hover:border-sky-400 transition-all">
                    <span class="text-xs font-bold text-slate-700 uppercase">${s.name} <span class="text-[9px] text-slate-400 ml-2">(${s.rawDept.split(',')[0]})</span></span>
                    <span class="text-[10px] font-black text-emerald-600 bg-emerald-50 px-2 py-1 rounded">FREE</span>
                </div>
            `).join('');
        }

        function formatTo24(t12) {
            let [time, modifier] = t12.split(' ');
            let [hours, minutes] = time.split(':');
            if (hours === '12') hours = '00';
            if (modifier === 'PM') hours = parseInt(hours, 10) + 12;
            return `${hours}:${minutes}`;
        }

        async function submitLeaveRequest() {
            const reason = document.getElementById('leave-reason').value.trim();
            if(!reason) return alert("Please provide a reason for leave.");
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "Submitting...";

            const request = {
                teacherEmail: activeStaff.email,
                teacherName: activeStaff.name,
                dept: activeStaff.dept,
                center: activeStaff.center,
                type: currentLeaveType,
                startDate: document.getElementById('leave-start-date').value,
                endDate: document.getElementById('leave-end-date').value || document.getElementById('leave-start-date').value,
                startTime: document.getElementById('leave-start-time').value || null,
                duration: document.getElementById('leave-duration').value,
                reason: reason,
                status: "PENDING",
                timestamp: Date.now()
            };

            try {
                const prefix = activeStaff.center === "GHUMARWIN" ? "" : activeStaff.center.toLowerCase() + "_";
                await db.collection(prefix + "leave_requests").add(request);
                alert("✅ Leave Request Submitted Successfully!");
                window.location.href = 'teacher-portal.html';
            } catch(e) {
                alert("Submission error.");
                btn.disabled = false; btn.innerText = "Submit Leave Application";
            }
        }
    </script>
</body>
</html>
