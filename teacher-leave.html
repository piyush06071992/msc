<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minerva | Apply for Leave</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .action-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .action-card:active { transform: scale(0.96); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        input, textarea { font-size: 16px !important; }
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="bg-[#1e1b4b] text-white p-4 sticky top-0 z-50 shadow-md flex items-center gap-4 border-b-4 border-sky-500">
        <button onclick="window.location.href='teacher-portal.html'" class="p-2 bg-indigo-800 rounded-xl active:bg-indigo-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
            <h1 class="text-lg font-black uppercase tracking-tight leading-none">Leave Application</h1>
            <p id="header-subtitle" class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Direct Staff Coordination</p>
        </div>
    </header>

    <main class="p-4 space-y-4 max-w-2xl mx-auto">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-black text-lg">👤</div>
                <div>
                    <p id="pref-name" class="font-black text-slate-800 text-sm leading-none uppercase">Loading...</p>
                    <p id="pref-dept" class="text-[9px] font-bold text-slate-400 uppercase mt-1">Loading...</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[8px] font-black text-slate-400 uppercase block">Centre</span>
                <p id="pref-center" class="font-black text-indigo-600 text-[10px] uppercase">Loading...</p>
            </div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
            <div class="grid grid-cols-1 gap-3">
                <button onclick="setLeaveType('FULL')" id="btn-FULL" class="action-card flex items-center justify-between p-4 bg-emerald-50 border-2 border-emerald-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">🗓️</span>
                        <div class="text-left">
                            <p class="font-black text-emerald-900 text-sm uppercase leading-none">Full Day</p>
                            <p class="text-[9px] font-bold text-emerald-600 uppercase mt-1">Multi-date supported</p>
                        </div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-emerald-200" id="check-FULL"></div>
                </button>

                <button onclick="setLeaveType('HALF')" id="btn-HALF" class="action-card flex items-center justify-between p-4 bg-amber-50 border-2 border-amber-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">🌓</span>
                        <div class="text-left">
                            <p class="font-black text-amber-900 text-sm uppercase leading-none">Half Day</p>
                            <p class="text-[9px] font-bold text-amber-600 uppercase mt-1">Automatic 5-hour cap</p>
                        </div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-amber-200" id="check-HALF"></div>
                </button>

                <button onclick="setLeaveType('SHORT')" id="btn-SHORT" class="action-card flex items-center justify-between p-4 bg-rose-50 border-2 border-rose-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">⏱️</span>
                        <div class="text-left">
                            <p class="font-black text-rose-900 text-sm uppercase leading-none">Short Leave</p>
                            <p class="text-[9px] font-bold text-rose-600 uppercase mt-1">Max 60 Minutes</p>
                        </div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-rose-200" id="check-SHORT"></div>
                </button>
            </div>
        </div>

        <div id="input-section" class="hidden bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2">
                    <label id="date-label-1" class="block text-[10px] font-black text-slate-400 uppercase mb-1.5 ml-1">Start Date</label>
                    <input type="date" id="l-date" onchange="runAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-indigo-500">
                </div>
                <div id="end-date-wrap" class="hidden col-span-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1.5 ml-1">End Date</label>
                    <input type="date" id="l-end-date" onchange="runAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-indigo-500">
                </div>
                <div id="time-wrap" class="hidden">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1.5 ml-1">Leave From</label>
                    <input type="time" id="l-time" onchange="runAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-indigo-500">
                </div>
                <div id="auto-end-wrap" class="hidden">
                    <label class="block text-[10px] font-black text-rose-400 uppercase mb-1.5 ml-1">Automatic End</label>
                    <div id="l-auto-end" class="w-full p-4 bg-rose-50 border border-rose-100 rounded-xl font-black text-rose-600 text-center">--:--</div>
                </div>
            </div>
        </div>

        <div id="analysis-section" class="hidden space-y-4">
            <div class="bg-slate-900 p-5 rounded-[2rem] shadow-xl">
                <h4 class="text-white font-black uppercase text-[10px] tracking-widest flex items-center gap-2 mb-6">
                    <span class="w-2 h-2 bg-rose-500 rounded-full animate-ping"></span> Slot-wise Replacement finder
                </h4>
                <div id="clash-feed" class="space-y-8"></div>
            </div>

            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">General Application Reason</label>
                <textarea id="l-reason" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-indigo-500 shadow-inner" placeholder="Provide details for the HOD..."></textarea>
                
                <button id="submit-btn" onclick="submitLeave()" class="w-full mt-6 py-5 bg-indigo-600 text-white font-black rounded-2xl uppercase tracking-[0.2em] text-xs shadow-xl active:scale-95 transition-all">
                    🚀 Send Application
                </button>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null, leaveType = null, calculatedEndMins = 0;
        let timetableData = [], dutyData = [], staffData = [], historyData = [];

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');

            document.getElementById('pref-name').innerText = activeStaff.name || activeStaff.email;
            document.getElementById('pref-dept').innerText = activeStaff.dept || "Faculty";
            document.getElementById('pref-center').innerText = activeStaff.center || "GHUMARWIN";

            await loadDatabases();
        };

        async function loadDatabases() {
            const center = activeStaff.center || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            const [tt, staff, hist, rosters] = await Promise.all([
                db.collection(prefix + "timetable").get(),
                db.collection("staff_applications").where("status", "==", "approved").get(),
                db.collection(prefix + "timetable_history").get(),
                db.collection(prefix + "duty_rosters").get()
            ]);

            timetableData = tt.docs.map(d => d.data());
            historyData = hist.docs.map(d => d.data());
            dutyData = rosters.docs.map(d => ({ id: d.id, ...d.data() }));
            staffData = staff.docs.map(d => {
                const docData = d.data();
                const det = docData.details || {};
                const cKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                const mobile = docData.mobile || "0000000000";
                let n = det.Name || docData.email;
                return { 
                    email: docData.email, 
                    name: n, 
                    mobile: mobile,
                    center: cKey ? String(det[cKey]).toUpperCase() : "GHUMARWIN",
                    rawDept: (det.Department || det.Subject || "General").toString() 
                };
            }).filter(s => s.center === center);
        }

        function setLeaveType(type) {
            leaveType = type;
            document.querySelectorAll('.action-card').forEach(b => b.classList.replace('border-indigo-500', 'border-emerald-100'));
            document.querySelectorAll('[id^="check-"]').forEach(c => c.innerHTML = "");
            
            document.getElementById('btn-' + type).classList.replace('border-emerald-100', 'border-indigo-500');
            document.getElementById('check-' + type).innerHTML = '<div class="w-full h-full bg-indigo-600 rounded-full border-2 border-white shadow-sm"></div>';
            
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('end-date-wrap').classList.toggle('hidden', type !== 'FULL');
            document.getElementById('time-wrap').classList.toggle('hidden', type === 'FULL');
            document.getElementById('auto-end-wrap').classList.toggle('hidden', type === 'FULL');
            runAnalysis();
        }

        function timeToMins(t) { 
            if(!t) return 0; 
            if(t.includes(' ')) { 
                let [tm, mod] = t.split(' '); let [h,m] = tm.split(':').map(Number); 
                if(h===12) h=0; if(mod==='PM') h+=12; return h*60+m; 
            } 
            let [h,m]=t.split(':').map(Number); return h*60+m; 
        }
        function minsTo12H(m) { let h=Math.floor(m/60)%24; let mn=m%60; let mod=h>=12?'PM':'AM'; h=h%12||12; return `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')} ${mod}`; }

        async function runAnalysis() {
            const dateVal = document.getElementById('l-date').value;
            if (!dateVal || !leaveType) return;

            document.getElementById('analysis-section').classList.remove('hidden');
            const feed = document.getElementById('clash-feed');
            feed.innerHTML = '<div class="flex justify-center p-10"><div class="loader"></div></div>';

            let analysisHtml = "";
            let allDates = [];
            if(leaveType === 'FULL') {
                let start = new Date(dateVal);
                let end = new Date(document.getElementById('l-end-date').value || dateVal);
                while(start <= end) {
                    allDates.push(start.toISOString().split('T')[0]);
                    start.setDate(start.getDate() + 1);
                }
            } else {
                allDates.push(dateVal);
            }

            for (let tDate of allDates) {
                const dayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date(tDate).getDay()];
                if(dayName === 'Sunday') continue;

                let leaveStart = 0, leaveEnd = 1440;
                if (leaveType !== 'FULL') {
                    const startTime = document.getElementById('l-time').value;
                    if(!startTime) { feed.innerHTML = ""; return; }
                    leaveStart = timeToMins(startTime);
                    let dur = (leaveType === 'HALF') ? 300 : 60;
                    leaveEnd = Math.min(leaveStart + dur, 1020);
                    document.getElementById('l-auto-end').innerText = minsTo12H(leaveEnd);
                }

                const override = historyData.find(o => o.date === tDate);
                const activeSchedule = (override && override.schedule) ? override.schedule : timetableData.filter(t => t.day === dayName);
                
                let userConflicts = [];
                const norm = (s) => (s || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                const myName = norm(activeStaff.name);

                // Classes/Exams
                activeSchedule.forEach(slot => {
                    if (norm(slot.teacherName) === myName || norm(slot.teacher) === myName) {
                        const s = timeToMins(slot.timeRange?.split(' - ')[0] || slot.start24);
                        const e = timeToMins(slot.timeRange?.split(' - ')[1] || slot.end24);
                        if (leaveStart < e && leaveEnd > s) {
                            userConflicts.push({ type: slot.subject === 'EXAM' ? 'EXAM DUTY' : 'CLASS', title: slot.subject, sub: `${slot.className} | Sec ${slot.section}`, start: s, end: e });
                        }
                    }
                });

                // Lunch Duties
                const diffToMonday = new Date(tDate).getDate() - new Date(tDate).getDay() + (new Date(tDate).getDay() === 0 ? -6 : 1);
                const monday = new Date(new Date(tDate).setDate(diffToMonday)).toISOString().split('T')[0];
                const roster = dutyData.find(r => r.id === "lunch_duty_" + monday);
                if (roster) {
                    Object.values(roster.rosterData).forEach(room => {
                        const d = room.columns[dayName];
                        if (d && d.status === 'ASSIGNED' && norm(d.staff.name) === myName) {
                            const s = timeToMins(d.timing.split(' - ')[0]);
                            const e = timeToMins(d.timing.split(' - ')[1]);
                            if (leaveStart < e && leaveEnd > s) {
                                userConflicts.push({ type: 'LUNCH DUTY', title: 'Lunch Supervision', sub: `Room: ${room.cName || 'Assigned'}`, start: s, end: e });
                            }
                        }
                    });
                }

                const uniqueConflicts = userConflicts.filter((v, i, a) => a.findIndex(t => (t.start === v.start && t.end === v.end && t.title === v.title)) === i);
                
                if (uniqueConflicts.length > 0) {
                    analysisHtml += `<div class="mb-4"><div class="flex items-center gap-3 mb-4"><span class="bg-white text-indigo-900 px-3 py-1 rounded-lg font-black text-[10px] uppercase shadow-md">${new Date(tDate).toLocaleDateString('en-GB', {day:'2-digit', month:'short'})}</span><div class="h-px flex-1 bg-slate-700"></div></div>`;
                    
                    uniqueConflicts.forEach((con, cIdx) => {
                        const subs = staffData.filter(staff => {
                            if (norm(staff.name) === myName) return false;
                            const staffTt = activeSchedule.filter(s => norm(s.teacherName) === norm(staff.name) || norm(s.teacher) === norm(staff.name));
                            return !staffTt.some(slot => {
                                const s = timeToMins(slot.timeRange?.split(' - ')[0] || slot.start24);
                                const e = timeToMins(slot.timeRange?.split(' - ')[1] || slot.end24);
                                return (con.start < e && con.end > s);
                            });
                        });

                        let deptMap = {};
                        subs.forEach(s => { 
                            let d = (s.rawDept || "General").split(',')[0].trim(); 
                            if(!deptMap[d]) deptMap[d] = []; 
                            deptMap[d].push(s); 
                        });

                        let deptHtml = Object.keys(deptMap).sort().map(dN => `
                            <details class="mb-2 last:mb-0 border border-slate-100 rounded-xl overflow-hidden bg-white">
                                <summary class="p-3 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-colors">
                                    <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">${dN} (${deptMap[dN].length} Free)</span>
                                    <span class="text-slate-300 text-[10px]">▼</span>
                                </summary>
                                <div class="p-3 bg-slate-50/50 space-y-2">
                                    ${deptMap[dN].map(s => `
                                        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-2">
                                            <div class="flex justify-between items-center">
                                                <span class="text-[11px] font-black text-slate-800 uppercase">${s.name}</span>
                                                <span class="text-[8px] font-bold text-slate-400 uppercase">${s.mobile}</span>
                                            </div>
                                            <div class="flex gap-2">
                                                <a href="tel:${s.mobile}" class="flex-1 py-2 bg-indigo-50 text-indigo-700 text-center rounded-lg text-[9px] font-black uppercase tracking-widest border border-indigo-100">Call</a>
                                                <a href="https://wa.me/91${s.mobile}" target="_blank" class="flex-1 py-2 bg-emerald-50 text-emerald-700 text-center rounded-lg text-[9px] font-black uppercase tracking-widest border border-emerald-100">WhatsApp</a>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </details>
                        `).join('');

                        analysisHtml += `
                            <div class="bg-white rounded-3xl overflow-hidden shadow-lg mb-6 border border-slate-200">
                                <div class="p-4 flex justify-between items-center bg-rose-50/80 border-b border-rose-100">
                                    <div>
                                        <p class="text-[8px] font-black text-rose-500 uppercase tracking-widest">${con.type}</p>
                                        <p class="font-black text-slate-800 text-sm uppercase">${con.title}</p>
                                        <p class="text-[9px] font-bold text-slate-400 uppercase">${con.sub}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="font-black text-slate-700 text-xs">${minsTo12H(con.start)}</p>
                                        <p class="text-[9px] font-bold text-slate-400 lowercase">to ${minsTo12H(con.end)}</p>
                                    </div>
                                </div>
                                <div class="p-4 space-y-4">
                                    <div>
                                        <label class="block text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1.5 ml-1">Additional Delegation / Manual Task</label>
                                        <input type="text" class="manual-task-input w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-[11px] font-bold outline-none focus:border-indigo-400" placeholder="e.g. Give register to ${subs[0]?.name || 'Staff'}">
                                    </div>
                                    <div>
                                        <p class="text-[8px] font-black text-indigo-400 uppercase tracking-widest mb-2 ml-1">Available Staff to Coordinate with:</p>
                                        ${deptHtml || '<p class="text-[9px] font-bold text-rose-400 italic">No free staff found for this specific slot.</p>'}
                                    </div>
                                </div>
                            </div>`;
                    });

                    if(allDates.indexOf(tDate) === 0 && allDates.length > 1) {
                        analysisHtml += `<button onclick="replicateFirstDay()" class="w-full py-4 bg-indigo-800 text-indigo-100 rounded-2xl font-black text-[10px] uppercase tracking-widest mb-10 shadow-lg border border-indigo-700">📋 Replicate Arrangements for all dates</button>`;
                    }
                    analysisHtml += `</div>`;
                }
            }
            feed.innerHTML = analysisHtml || `<div class="bg-emerald-500/10 text-emerald-400 p-8 rounded-3xl font-bold text-center text-xs uppercase border border-emerald-500/20">✅ No duties or classes found for this request.</div>`;
        }

        function replicateFirstDay() { alert("Algorithm Sync: The HOD will be notified to apply your first-day delegation arrangements to all selected dates."); }

        async function submitLeave() {
            const reason = document.getElementById('l-reason').value.trim();
            if(!reason) return alert("Please enter a reason.");
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "🛰️ DISPATCHING...";

            // Collect all manual task inputs to save as a summary
            const manualTasks = Array.from(document.querySelectorAll('.manual-task-input')).map(i => i.value).filter(v => v);

            try {
                const prefix = (activeStaff.center || "GHUMARWIN") === "GHUMARWIN" ? "" : activeStaff.center.toLowerCase() + "_";
                await db.collection(prefix + "leave_requests").add({
                    teacherEmail: activeStaff.email, teacherName: activeStaff.name || activeStaff.email,
                    type: leaveType, date: document.getElementById('l-date').value,
                    endDate: document.getElementById('l-end-date').value || document.getElementById('l-date').value,
                    reason, delegationNotes: manualTasks, status: "PENDING", timestamp: Date.now()
                });
                alert("✅ Application Submitted Successfully."); window.location.href = 'teacher-portal.html';
            } catch(e) { btn.disabled = false; btn.innerText = "Submit Application"; }
        }
    </script>
</body>
</html>
