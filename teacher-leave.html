<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Smart Leave Management</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f4f8; color: #0f172a; }
        .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] text-white p-5 sm:px-8 flex items-center justify-between shadow-2xl sticky top-0 z-50 border-b-4 border-sky-500">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-all shadow-md">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none text-white">Apply for Leave</h1>
                <p class="text-[10px] text-sky-300 font-bold uppercase tracking-widest mt-1">Smart Replacement Finder Active</p>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 space-y-8">
        
        <div class="glass-card p-6 rounded-[2rem] shadow-lg border-l-8 border-indigo-600 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center font-black text-xl">👤</div>
                <div>
                    <p id="pref-name" class="font-black text-slate-800 text-lg leading-none uppercase tracking-tighter">Loading...</p>
                    <p id="pref-dept" class="text-[10px] font-bold text-indigo-500 uppercase mt-1 tracking-widest">Loading...</p>
                </div>
            </div>
            <div class="bg-sky-50 px-5 py-2 rounded-2xl border border-sky-100 text-center">
                <span class="text-[9px] font-black text-sky-400 uppercase block">Active Centre</span>
                <p id="pref-center" class="font-black text-sky-700 text-sm">Loading...</p>
            </div>
        </div>

        <div class="glass-card p-6 sm:p-10 rounded-[3rem] shadow-xl border-t-8 border-sky-400">
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-6 text-center">Step 1: Choose Leave Duration</label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button onclick="setLeaveType('FULL')" id="btn-FULL" class="leave-type-btn p-6 rounded-[2rem] border-2 border-slate-100 flex flex-col items-center gap-2 group transition-all">
                    <span class="text-3xl grayscale group-hover:grayscale-0">📅</span>
                    <span class="font-black text-xs uppercase tracking-widest">Full Day</span>
                </button>
                <button onclick="setLeaveType('HALF')" id="btn-HALF" class="leave-type-btn p-6 rounded-[2rem] border-2 border-slate-100 flex flex-col items-center gap-2 group transition-all">
                    <span class="text-3xl grayscale group-hover:grayscale-0">🌗</span>
                    <span class="font-black text-xs uppercase tracking-widest">Half Day</span>
                </button>
                <button onclick="setLeaveType('SHORT')" id="btn-SHORT" class="leave-type-btn p-6 rounded-[2rem] border-2 border-slate-100 flex flex-col items-center gap-2 group transition-all">
                    <span class="text-3xl grayscale group-hover:grayscale-0">⏱️</span>
                    <span class="font-black text-xs uppercase tracking-widest">Short Leave</span>
                </button>
            </div>

            <div id="dynamic-inputs" class="hidden mt-10 grid grid-cols-1 sm:grid-cols-2 gap-6 animate-in slide-in-from-top-2">
                <div class="space-y-2">
                    <label id="date-label-1" class="block text-[10px] font-black text-slate-500 uppercase ml-2">Start Date</label>
                    <input type="date" id="leave-start-date" onchange="handleTimeLogic()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 outline-none focus:border-sky-500 shadow-inner">
                </div>
                <div id="end-date-wrap" class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase ml-2">End Date</label>
                    <input type="date" id="leave-end-date" onchange="runClashAnalysis()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 outline-none focus:border-sky-500 shadow-inner">
                </div>
                <div id="start-time-wrap" class="hidden space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase ml-2">Time From</label>
                    <input type="time" id="leave-start-time" onchange="handleTimeLogic()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 outline-none focus:border-sky-500 shadow-inner">
                </div>
                <div id="auto-end-wrap" class="hidden space-y-2">
                    <label class="block text-[10px] font-black text-slate-500 uppercase ml-2 text-rose-500">Auto-Calculated Until</label>
                    <div id="auto-end-display" class="w-full p-4 bg-rose-50 border-2 border-rose-100 rounded-2xl font-black text-rose-600 text-center shadow-sm">--:--</div>
                </div>
            </div>
        </div>

        <div id="analysis-section" class="hidden space-y-8">
            
            <div class="glass-card p-6 sm:p-10 rounded-[3rem] shadow-xl border-t-8 border-rose-500">
                <div class="flex items-center gap-4 mb-8">
                    <span class="text-3xl bg-rose-100 p-3 rounded-2xl">🚨</span>
                    <div>
                        <h3 class="font-black text-slate-900 text-xl uppercase tracking-tight">Replacement Required</h3>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Substitute staff needed for these slots</p>
                    </div>
                </div>
                <div id="clash-list" class="space-y-6">
                    </div>
            </div>

            <div class="glass-card p-6 sm:p-10 rounded-[3rem] shadow-xl border-t-8 border-emerald-500">
                <label class="block text-xs font-black text-slate-500 uppercase tracking-widest mb-3 ml-1">Application Reason</label>
                <textarea id="leave-reason" rows="3" class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-[1.5rem] font-bold text-slate-700 outline-none focus:border-emerald-500 shadow-inner mb-6" placeholder="Reason for leave..."></textarea>
                
                <button id="submit-btn" onclick="submitLeaveRequest()" class="w-full py-6 bg-slate-900 text-white font-black rounded-[2rem] uppercase tracking-widest text-sm shadow-2xl hover:bg-emerald-600 transition-all transform active:scale-95">
                    🚀 Finalize & Submit Leave
                </button>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null, currentLeaveType = null;
        let timetableData = [], staffData = [], historyOverrides = [];

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');

            document.getElementById('pref-name').innerText = activeStaff.name || activeStaff.email;
            document.getElementById('pref-dept').innerText = activeStaff.dept || "General";
            document.getElementById('pref-center').innerText = activeStaff.center || "GHUMARWIN";

            await loadData();
        };

        async function loadData() {
            const center = activeStaff.center || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            const [ttSnap, staffSnap, histSnap] = await Promise.all([
                db.collection(prefix + "timetable").get(),
                db.collection("staff_applications").where("status", "==", "approved").get(),
                db.collection(prefix + "timetable_history").get()
            ]);
            timetableData = ttSnap.docs.map(d => d.data());
            historyOverrides = histSnap.docs.map(d => d.data());
            staffData = staffSnap.docs.map(d => {
                const det = d.data().details || {};
                const cKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                return { 
                    email: d.data().email, 
                    name: det.Name || d.data().email, 
                    center: cKey ? String(det[cKey]).toUpperCase() : "GHUMARWIN",
                    rawDept: det.Department || det.Subject || "General"
                };
            }).filter(s => s.center === center);
        }

        function setLeaveType(type) {
            currentLeaveType = type;
            document.querySelectorAll('.leave-type-btn').forEach(b => b.classList.remove('bg-indigo-600', 'text-white', 'shadow-indigo-300'));
            document.getElementById('btn-' + type).classList.add('bg-indigo-600', 'text-white', 'shadow-2xl', 'shadow-indigo-300');
            
            document.getElementById('dynamic-inputs').classList.remove('hidden');
            document.getElementById('end-date-wrap').style.display = (type === 'FULL') ? 'block' : 'none';
            document.getElementById('start-time-wrap').style.display = (type === 'FULL') ? 'none' : 'block';
            document.getElementById('auto-end-wrap').style.display = (type === 'FULL') ? 'none' : 'block';
            
            handleTimeLogic();
        }

        function handleTimeLogic() {
            if (currentLeaveType === 'FULL') return runClashAnalysis();

            const startT = document.getElementById('leave-start-time').value;
            const display = document.getElementById('auto-end-display');
            
            if (!startT) return;
            
            let [h, m] = startT.split(':').map(Number);
            let totalMins = h * 60 + m;
            
            // Add 5 hours for Half Day, 1 hour for Short Leave
            totalMins += (currentLeaveType === 'HALF') ? 300 : 60;
            
            // Cap at 5:00 PM (1020 mins)
            if (totalMins > 1020) totalMins = 1020;
            
            display.innerText = format12Hour(minsTo24(totalMins));
            window.calculatedEndMins = totalMins;
            runClashAnalysis();
        }

        async function runClashAnalysis() {
            const startDate = document.getElementById('leave-start-date').value;
            if (!startDate) return;

            const analysisArea = document.getElementById('analysis-section');
            const clashList = document.getElementById('clash-list');
            analysisArea.classList.remove('hidden');
            clashList.innerHTML = '<div class="loader mx-auto"></div>';

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[new Date(startDate).getDay()];
            
            // Fetch actual schedule (checking overrides for Exams)
            const override = historyOverrides.find(o => o.date === startDate);
            let activeSchedule = (override && override.schedule) ? override.schedule : timetableData.filter(t => t.day === dayName);

            let leaveStart = 0, leaveEnd = 1440;
            if (currentLeaveType !== 'FULL') {
                leaveStart = timeToMins(document.getElementById('leave-start-time').value);
                leaveEnd = window.calculatedEndMins;
            }

            const myClashes = activeSchedule.filter(cls => {
                if(cls.teacherName !== activeStaff.name && cls.teacher !== activeStaff.name) return false;
                const cS = timeToMins(cls.timeRange?.split(' - ')[0] || cls.start24);
                const cE = timeToMins(cls.timeRange?.split(' - ')[1] || cls.end24);
                return (leaveStart < cE && leaveEnd > cS);
            });

            if (myClashes.length === 0) {
                clashList.innerHTML = `<div class="bg-emerald-50 text-emerald-700 p-6 rounded-3xl font-black text-xs uppercase tracking-[0.2em] border-2 border-emerald-100 text-center">✅ You have no classes during this period!</div>`;
                return;
            }

            // For each clash, find free staff for THAT SPECIFIC slot
            clashList.innerHTML = myClashes.map((c, idx) => {
                const cS = timeToMins(c.timeRange?.split(' - ')[0] || c.start24);
                const cE = timeToMins(c.timeRange?.split(' - ')[1] || c.end24);

                const substitutes = staffData.filter(s => {
                    if (s.email === activeStaff.email) return false;
                    const sTt = activeSchedule.filter(t => t.teacherName === s.name || t.teacher === s.name);
                    return !sTt.some(slot => {
                        const tsS = timeToMins(slot.timeRange?.split(' - ')[0] || slot.start24);
                        const tsE = timeToMins(slot.timeRange?.split(' - ')[1] || slot.end24);
                        return (cS < tsE && cE > tsS);
                    });
                });

                return `
                <div class="bg-white border-2 border-rose-100 rounded-[2rem] overflow-hidden shadow-sm">
                    <div class="p-5 flex justify-between items-center bg-rose-50/50">
                        <div>
                            <p class="font-black text-rose-600 text-sm uppercase">${c.subject}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${c.className} | Sec ${c.section}</p>
                        </div>
                        <div class="bg-white px-4 py-2 rounded-xl border border-rose-200 text-rose-700 font-black text-xs">
                            ${c.timeRange || (format12Hour(c.start24) + ' - ' + format12Hour(c.end24))}
                        </div>
                    </div>
                    <details class="group">
                        <summary class="p-4 bg-white border-t border-slate-100 cursor-pointer flex justify-between items-center hover:bg-slate-50 transition-all">
                            <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest">${substitutes.length} Available Substitutes</span>
                            <span class="text-slate-300 group-open:rotate-180 transition-transform">▼</span>
                        </summary>
                        <div class="p-4 bg-slate-50 grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${substitutes.map(s => `
                                <div class="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center">
                                    <span class="text-[11px] font-bold text-slate-700 uppercase">${s.name}</span>
                                    <span class="text-[9px] font-black text-slate-400 uppercase">${s.rawDept.split(',')[0]}</span>
                                </div>
                            `).join('')}
                        </div>
                    </details>
                </div>`;
            }).join('');
        }

        function timeToMins(t) { if(!t) return 0; if(t.includes(' ')) { let [tm, mod] = t.split(' '); let [h,m] = tm.split(':').map(Number); if(h===12) h=0; if(mod==='PM') h+=12; return h*60+m; } let [h,m]=t.split(':').map(Number); return h*60+m; }
        function minsTo24(m) { let h=Math.floor(m/60)%24; let mn=m%60; return `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')}`; }
        function format12Hour(t) { let [h,m]=t.split(':').map(Number); let mod=h>=12?'PM':'AM'; h=h%12||12; return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')} ${mod}`; }

        async function submitLeaveRequest() {
            const reason = document.getElementById('leave-reason').value.trim();
            if(!reason) return alert("Please provide a reason.");
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "🛰️ Dispatching Application...";

            const request = {
                teacherEmail: activeStaff.email,
                teacherName: activeStaff.name || activeStaff.email,
                type: currentLeaveType,
                startDate: document.getElementById('leave-start-date').value,
                endDate: document.getElementById('leave-end-date').value || document.getElementById('leave-start-date').value,
                startTime: document.getElementById('leave-start-time').value || "00:00",
                endTime: currentLeaveType === 'FULL' ? "23:59" : minsTo24(window.calculatedEndMins),
                reason: reason,
                status: "PENDING",
                center: activeStaff.center,
                timestamp: Date.now()
            };

            try {
                const center = activeStaff.center || "GHUMARWIN";
                const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
                await db.collection(prefix + "leave_requests").add(request);
                alert("✅ Leave Application Submitted for Review.");
                window.location.href = 'teacher-portal.html';
            } catch(e) { alert("Submission failed."); btn.disabled = false; }
        }
    </script>
</body>
</html>
