<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minerva | Apply for Leave</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .action-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .action-card:active { transform: scale(0.96); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input, textarea, select { font-size: 16px !important; }
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .selected-sub { border-color: #4f46e5 !important; background-color: #eef2ff !important; border-width: 2px !important; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="bg-[#1e1b4b] text-white p-4 sticky top-0 z-50 shadow-md flex items-center gap-4 border-b-4 border-sky-500">
        <button onclick="window.location.href='teacher-portal.html'" class="p-2 bg-indigo-800 rounded-xl active:bg-indigo-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
            <h1 class="text-lg font-black uppercase tracking-tight leading-none">Apply for Leave</h1>
            <p class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Smart Coordinator Engine</p>
        </div>
    </header>

    <main class="p-4 space-y-4 max-w-2xl mx-auto">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-black text-lg">👤</div>
                <div>
                    <p id="pref-name" class="font-black text-slate-800 text-sm leading-none uppercase text-indigo-700">Loading...</p>
                    <p id="pref-dept" class="text-[9px] font-bold text-slate-400 uppercase mt-1 tracking-widest">Faculty</p>
                </div>
            </div>
           <div class="text-right">
                <span class="text-[8px] font-black text-slate-400 uppercase block">Centre</span>
                <p id="pref-center" class="font-black text-indigo-600 text-[10px] uppercase">Loading...</p>
            </div>
        </div>

        <div id="pending-requests-box" class="hidden bg-rose-50 border-2 border-rose-200 rounded-3xl p-5 shadow-sm">
            <h3 class="font-black text-rose-800 text-xs uppercase tracking-widest flex items-center gap-2 mb-4">
                <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-rose-600"></span></span> 
                Action Required: Substitution Requests
            </h3>
            <div id="pending-requests-list" class="space-y-3"></div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
            <div class="grid grid-cols-1 gap-3">
                <button onclick="setLeaveType('FULL')" id="btn-FULL" class="action-card flex items-center justify-between p-4 bg-emerald-50 border-2 border-emerald-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">🗓️</span>
                        <div class="text-left"><p class="font-black text-emerald-900 text-sm uppercase leading-none">Full Day</p><p class="text-[9px] font-bold text-emerald-600 uppercase mt-1">Complete Absence</p></div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-emerald-200" id="check-FULL"></div>
                </button>
                <button onclick="setLeaveType('HALF')" id="btn-HALF" class="action-card flex items-center justify-between p-4 bg-amber-50 border-2 border-amber-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">🌓</span>
                        <div class="text-left"><p class="font-black text-amber-900 text-sm uppercase leading-none">Half Day</p><p class="text-[9px] font-bold text-amber-600 uppercase mt-1">Max 5 Hours</p></div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-amber-200" id="check-HALF"></div>
                </button>
                <button onclick="setLeaveType('SHORT')" id="btn-SHORT" class="action-card flex items-center justify-between p-4 bg-rose-50 border-2 border-rose-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">⏱️</span>
                        <div class="text-left"><p class="font-black text-rose-900 text-sm uppercase leading-none">Short Leave</p><p class="text-[9px] font-bold text-rose-600 uppercase mt-1">Max 60 Minutes</p></div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-rose-200" id="check-SHORT"></div>
                </button>
            </div>
        </div>

        <div id="input-section" class="hidden bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2"><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Date</label><input type="date" id="l-date" onchange="runAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold"></div>
                <div id="end-date-wrap" class="hidden col-span-2"><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">End Date</label><input type="date" id="l-end-date" onchange="runAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold"></div>
                <div id="time-wrap" class="hidden"><label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">From Time</label><input type="time" id="l-time" onchange="runAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold"></div>
                <div id="auto-end-wrap" class="hidden"><label class="block text-[10px] font-black text-indigo-400 uppercase mb-1 ml-1">Until Time</label><input type="time" id="l-end-time" onchange="runAnalysis()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold"></div>
            </div>
            <p id="time-error" class="hidden text-[10px] font-black text-rose-600 uppercase bg-rose-50 p-2 rounded-lg border border-rose-100 text-center animate-pulse"></p>
        </div>

        <div id="analysis-section" class="hidden space-y-4">
            <div class="bg-[#0f172a] p-5 rounded-[2.5rem] shadow-xl border-t-8 border-indigo-500">
                <h4 class="text-white font-black uppercase text-[10px] tracking-widest flex items-center gap-2 mb-6">
                    <span class="w-2 h-2 bg-rose-500 rounded-full animate-ping"></span> Coordination Dashboard
                </h4>
                <div id="clash-feed" class="space-y-8"></div>
            </div>

            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Final Remarks</label>
                <textarea id="l-reason" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-indigo-500" placeholder="Summary of arrangements..."></textarea>
                <button id="submit-btn" onclick="submitLeave()" class="w-full mt-6 py-5 bg-indigo-600 text-white font-black rounded-2xl uppercase tracking-[0.2em] text-xs shadow-xl active:scale-95 transition-all">Confirm & Submit</button>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null, leaveType = null;
        let timetableData = [], dutyData = [], staffData = [], historyData = [];
        let selectedAdjustments = {};

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');
            document.getElementById('pref-name').innerText = activeStaff.name || activeStaff.email;
            document.getElementById('pref-center').innerText = activeStaff.center || "GHUMARWIN";
            await loadDatabases();
        };

        async function loadDatabases() {
            const center = activeStaff.center || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            const [tt, staff, hist, rosters] = await Promise.all([
                db.collection(prefix + "timetable").get(),
                db.collection("staff_applications").where("status", "==", "approved").get(),
                db.collection(prefix + "timetable_history").get(),
                db.collection(prefix + "duty_rosters").get()
            ]);
            timetableData = tt.docs.map(d => d.data());
            historyData = hist.docs.map(d => d.data());
            dutyData = rosters.docs.map(d => ({ id: d.id, ...d.data() }));

            staffData = staff.docs.map(d => {
                const docData = d.data();
                const det = docData.details || {};
                const nameKey = Object.keys(det).find(k => k.toLowerCase().includes('name'));
                const centerKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
                const staffCenter = centerKey ? String(det[centerKey]).toUpperCase() : "GHUMARWIN";
                return { 
                    email: docData.email, 
                    name: nameKey ? det[nameKey] : docData.email, 
                    mobile: docData.mobile || "0", 
                    center: staffCenter, 
                    dept: (det.Department || det.Subject || "General").toString() 
                };
            }).filter(s => s.center === center);
        }

        function setLeaveType(type) {
            leaveType = type;
            document.querySelectorAll('.action-card').forEach(b => b.classList.replace('border-indigo-500', 'border-emerald-100'));
            document.getElementById('btn-' + type).classList.replace('border-emerald-100', 'border-indigo-500');
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('end-date-wrap').classList.toggle('hidden', type !== 'FULL');
            document.getElementById('time-wrap').classList.toggle('hidden', type === 'FULL');
            document.getElementById('auto-end-wrap').classList.toggle('hidden', type === 'FULL');
            runAnalysis();
        }

        function timeToMins(t) { if(!t) return 0; let [h,m] = t.split(':').map(Number); return h*60+m; }
        function minsTo12H(m) { let h=Math.floor(m/60)%24; let mn=m%60; let mod=h>=12?'PM':'AM'; h=h%12||12; return `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')} ${mod}`; }

        function selectReplacement(clashId, name, email, rowEl) {
            const container = document.getElementById('clash-' + clashId);
            container.querySelectorAll('.sub-row').forEach(r => r.classList.remove('selected-sub'));
            rowEl.classList.add('selected-sub');
            const inchargeCheck = document.getElementById('incharge-' + clashId);
            if(inchargeCheck) inchargeCheck.checked = false;
            selectedAdjustments[clashId] = { name, email, requestIncharge: false };
        }

        function toggleIncharge(clashId, checkbox) {
            const container = document.getElementById('clash-' + clashId);
            if(checkbox.checked) {
                container.querySelectorAll('.sub-row').forEach(r => r.classList.remove('selected-sub'));
                selectedAdjustments[clashId] = { name: "INCHARGE", email: "ADMIN", requestIncharge: true };
            } else { delete selectedAdjustments[clashId]; }
        }

        async function runAnalysis() {
            const dateVal = document.getElementById('l-date').value;
            const startTime = document.getElementById('l-time').value;
            const endTime = document.getElementById('l-end-time').value;
            if (!dateVal || !leaveType) return;

            const norm = (s) => (s || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            const myName = norm(activeStaff.name);
            const myEmail = activeStaff.email.toLowerCase();

            let leaveStart = 0, leaveEnd = 1440;
            if (leaveType !== 'FULL') {
                if(!startTime || !endTime) return;
                leaveStart = timeToMins(startTime); leaveEnd = timeToMins(endTime);
            }

            document.getElementById('analysis-section').classList.remove('hidden');
            const feed = document.getElementById('clash-feed');
            feed.innerHTML = '<div class="flex justify-center p-10"><div class="loader"></div></div>';

            let allDates = [];
            if(leaveType === 'FULL') {
                let start = new Date(dateVal);
                let end = new Date(document.getElementById('l-end-date').value || dateVal);
                while(start <= end) { allDates.push(start.toISOString().split('T')[0]); start.setDate(start.getDate() + 1); }
            } else { allDates.push(dateVal); }

            let analysisHtml = "";
            for (let tDate of allDates) {
                const dayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date(tDate).getDay()];
                if(dayName === 'Sunday') continue;

                const override = historyData.find(o => o.date === tDate);
                let activeSchedule = (override && override.schedule) ? override.schedule : timetableData.filter(t => t.day === dayName);

                let userConflicts = [];
                activeSchedule.forEach(slot => {
                    const slotT = norm(slot.teacherName || slot.teacher || "");
                    const slotE = (slot.teacherEmail || "").toLowerCase();
                    if (slotT === myName || slotE === myEmail) {
                        const s = timeToMins(slot.start24 || (slot.timeRange ? slot.timeRange.split(' - ')[0] : "00:00"));
                        const e = timeToMins(slot.end24 || (slot.timeRange ? slot.timeRange.split(' - ')[1] : "00:00"));
                        if (leaveStart < e && leaveEnd > s) userConflicts.push({ id: `clash_${tDate}_${s}_${slot.section}`, type: 'CLASS', title: slot.subject, sub: `${slot.className} | Sec ${slot.section}`, start: s, end: e, date: tDate });
                    }
                });

                analysisHtml += `<div class="mb-10"><div class="flex items-center gap-3 mb-6"><span class="bg-indigo-600 text-white px-4 py-1.5 rounded-xl font-black text-xs uppercase shadow-md">${new Date(tDate).toLocaleDateString('en-GB', {day:'2-digit', month:'short'})}</span><div class="h-1 flex-1 bg-slate-700/50 rounded-full"></div></div>`;

                if (userConflicts.length > 0) {
                    userConflicts.forEach(con => {
                        const subs = staffData.filter(staff => {
                            if (norm(staff.name) === myName) return false;
                            const staffTt = activeSchedule.filter(s => norm(s.teacherName || s.teacher) === norm(staff.name));
                            return !staffTt.some(slot => {
                                const s = timeToMins(slot.start24 || (slot.timeRange ? slot.timeRange.split(' - ')[0] : "00:00"));
                                const e = timeToMins(slot.end24 || (slot.timeRange ? slot.timeRange.split(' - ')[1] : "00:00"));
                                return (con.start < e && con.end > s);
                            });
                        });

                        let deptMap = {};
                        subs.forEach(s => { let d = s.dept.split(',')[0].trim(); if(!deptMap[d]) deptMap[d] = []; deptMap[d].push(s); });
                        
                        let deptHtml = Object.keys(deptMap).sort().map(dN => `
                            <details class="mb-2 border border-slate-100 rounded-xl overflow-hidden bg-white">
                                <summary class="p-3 flex justify-between items-center cursor-pointer hover:bg-slate-50 font-black text-[10px] uppercase text-slate-700">
                                    ${dN} (${deptMap[dN].length} Free) <span class="text-slate-300">▼</span>
                                </summary>
                                <div class="p-2 space-y-1 bg-slate-50">
                                    ${deptMap[dN].map(s => `
                                        <div onclick="selectReplacement('${con.id}', '${s.name}', '${s.email}', this)" class="sub-row flex justify-between items-center p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-indigo-400 transition-all">
                                            <span class="text-[11px] font-bold text-slate-800 uppercase">${s.name}</span>
                                            <span class="text-[8px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md font-black uppercase">Assign</span>
                                        </div>`).join('')}
                                </div>
                            </details>`).join('');

                        analysisHtml += `
                            <div id="clash-${con.id}" class="clash-item bg-white rounded-3xl overflow-hidden shadow-lg border border-slate-200 mb-4" data-clash='${JSON.stringify(con)}'>
                                <div class="p-4 flex justify-between items-center bg-rose-50/50 border-b border-rose-100">
                                    <div><p class="text-[8px] font-black text-rose-500 uppercase tracking-widest">${con.type}</p><p class="font-black text-slate-900 text-sm uppercase">${con.title}</p><p class="text-[9px] font-bold text-slate-400 uppercase">${con.sub}</p></div>
                                    <div class="text-right"><p class="font-black text-slate-700 text-xs">${minsTo12H(con.start)}</p><p class="text-[9px] font-bold text-slate-400 lowercase">to ${minsTo12H(con.end)}</p></div>
                                </div>
                                <div class="p-4">
                                    <div class="max-h-56 overflow-y-auto custom-scroll">${deptHtml || '<p class="text-center text-[10px] py-4 text-slate-400 font-bold">No free staff available</p>'}</div>
                                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" id="incharge-${con.id}" onchange="toggleIncharge('${con.id}', this)" class="w-4 h-4 accent-indigo-600">
                                            <span class="text-[10px] font-black text-indigo-600 uppercase">Emergency: Request Incharge</span>
                                        </label>
                                    </div>
                                </div>
                            </div>`;
                    });
                } else { analysisHtml += `<div class="bg-emerald-500/10 text-emerald-400 p-5 rounded-2xl font-bold text-center text-xs uppercase border border-emerald-500/20 mb-6">✅ No classes detected</div>`; }
                analysisHtml += `</div>`;
            }
            feed.innerHTML = analysisHtml;
        }

     async function submitLeave() {
            const reason = document.getElementById('l-reason').value.trim();
            if(!reason) return alert("Please enter reason.");
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "SAVING DATA...";

            const finalAdjustments = [];
            const emailList = [];

            // SAFE CHECK: compile the adjusted teachers
            const items = document.querySelectorAll('.clash-item');
            items.forEach(el => {
                try {
                    const clashData = JSON.parse(el.getAttribute('data-clash'));
                    const selection = selectedAdjustments[clashData.id];
                    if(selection) {
                        finalAdjustments.push({ ...clashData, adjustedTo: selection.name, adjustedEmail: selection.email, isEmergency: selection.requestIncharge });
                        if(!selection.requestIncharge) {
                            emailList.push({ name: selection.name, email: selection.email, date: clashData.date, time: `${minsTo12H(clashData.start)} - ${minsTo12H(clashData.end)}`, section: clashData.sub, subject: clashData.title });
                        }
                    }
                } catch(e) { console.error("Parse error", e); }
            });

            try {
                const prefix = activeStaff.center === "GHUMARWIN" ? "" : activeStaff.center.toLowerCase() + "_";
                
                // 1. SAVE TO DATABASE
                await db.collection(prefix + "leave_requests").add({
                    teacherEmail: activeStaff.email, teacherName: activeStaff.name,
                    type: leaveType, startDate: document.getElementById('l-date').value,
                    endDate: document.getElementById('l-end-date').value || document.getElementById('l-date').value,
                    reason, adjustments: finalAdjustments, status: "PENDING", timestamp: Date.now()
                });

                // 2. DISPATCH EMAILS (WITH AWAIT)
                if(emailList.length > 0) {
                    btn.innerText = "DISPATCHING EMAILS...";
                    const scriptURL = "https://script.google.com/macros/s/AKfycbyWUqGV1jd73NK_3zOU2Sy6wXCwcrjCG0ErqyRHM41f7qzcsNwxwjXfUlk2ZjFVeUmcdQ/exec";
                    
                    // We wait for the fetch to send before redirecting
                    try {
                        await fetch(scriptURL, {
                            method: "POST", mode: "no-cors",
                            body: JSON.stringify({ type: "TEACHER_ADJUSTMENT_NOTIFY", requester: activeStaff.name, list: emailList })
                        });
                    } catch(e) { console.log("Email fetch error:", e); }
                }

                alert("✅ Leave & Adjustments Submitted Successfully!");
                window.location.href = 'teacher-portal.html';
            } catch(e) { 
                btn.disabled = false; btn.innerText = "Confirm & Submit"; 
                alert("Database Error: " + e.message); 
            }
        }
        // ============================================================================
        // === SUBSTITUTE ACCEPTANCE & AUTO-INJECTOR ENGINE ===
        // ============================================================================
        
        function listenForMyAdjustmentRequests() {
            const prefix = activeStaff.center === "GHUMARWIN" ? "" : activeStaff.center.toLowerCase() + "_";
            const myEmail = activeStaff.email.toLowerCase();

            db.collection(prefix + "leave_requests")
              .where("status", "==", "PENDING")
              .onSnapshot(snap => {
                  const box = document.getElementById('pending-requests-box');
                  const list = document.getElementById('pending-requests-list');
                  
                  // Safety check: ensure the UI box actually exists
                  if (!box || !list) return; 
                  
                  let html = "";
                  let hasPending = false;

                  snap.forEach(doc => {
                      const req = doc.data();
                      if(req.adjustments) {
                          req.adjustments.forEach(adj => {
                              // Check if I am the target and haven't responded yet
                              if(adj.adjustedEmail && adj.adjustedEmail.toLowerCase() === myEmail && !adj.substituteResponse) {
                                  hasPending = true;
                                  html += `
                                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-rose-100 flex flex-col gap-3">
                                        <div class="flex justify-between items-start border-b border-rose-50 pb-2">
                                            <div>
                                                <span class="text-[9px] font-black bg-rose-100 text-rose-700 px-2 py-0.5 rounded uppercase tracking-widest">${adj.date}</span>
                                                <h4 class="font-black text-slate-800 text-sm uppercase mt-1">${adj.title}</h4>
                                                <p class="text-[10px] font-bold text-slate-500 uppercase">${adj.sub} | ${minsTo12H(adj.start)} - ${minsTo12H(adj.end)}</p>
                                            </div>
                                            <div class="text-right">
                                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest block">Requested By</span>
                                                <span class="text-[10px] font-black text-rose-600 uppercase">${req.teacherName}</span>
                                            </div>
                                        </div>
                                        <div class="flex gap-2">
                                            <button onclick="handleAdjustmentResponse('${doc.id}', '${adj.id}', 'DECLINED')" class="flex-1 py-2 bg-slate-50 text-slate-500 hover:bg-rose-50 hover:text-rose-600 font-black rounded-xl text-[10px] uppercase tracking-widest transition-colors border border-slate-200">Decline</button>
                                            <button onclick="handleAdjustmentResponse('${doc.id}', '${adj.id}', 'ACCEPTED', '${encodeURIComponent(JSON.stringify(adj))}', '${req.teacherName}')" class="flex-1 py-2 bg-rose-600 text-white hover:bg-rose-500 font-black rounded-xl text-[10px] uppercase tracking-widest shadow-md transition-colors">Accept & Inject</button>
                                        </div>
                                    </div>
                                  `;
                              }
                          });
                      }
                  });

                  list.innerHTML = html;
                  if (hasPending) box.classList.remove('hidden');
                  else box.classList.add('hidden');
              });
        }

        async function handleAdjustmentResponse(docId, clashId, response, adjDataEncoded, originalTeacherName) {
            if (response === 'DECLINED') {
                const reason = prompt("Mandatory: Please provide a reason for declining this substitution.");
                if (!reason || reason.trim() === "") {
                    alert("You must provide a reason to decline.");
                    return;
                }
                await processResponse(docId, clashId, 'DECLINED', reason);
            } else {
                if(!confirm("Accepting this will automatically alter the Master Timetable and assign this class to you. Proceed?")) return;
                
                const btn = event.target;
                const orig = btn.innerText;
                btn.innerText = "Injecting..."; btn.disabled = true;
                
                try {
                    const adjData = JSON.parse(decodeURIComponent(adjDataEncoded));
                    await applyTimetableOverride(adjData, originalTeacherName);
                    await processResponse(docId, clashId, 'ACCEPTED', 'Accepted via Auto-Injector');
                } catch(e) {
                    alert("Error injecting timetable: " + e.message);
                    btn.innerText = orig; btn.disabled = false;
                }
            }
        }

        async function processResponse(docId, clashId, responseStatus, reasonMsg) {
            const prefix = activeStaff.center === "GHUMARWIN" ? "" : activeStaff.center.toLowerCase() + "_";
            const docRef = db.collection(prefix + "leave_requests").doc(docId);
            
            try {
                await db.runTransaction(async (transaction) => {
                    const docSnap = await transaction.get(docRef);
                    if (!docSnap.exists) throw new Error("Request no longer exists.");
                    
                    let data = docSnap.data();
                    let adjIndex = data.adjustments.findIndex(a => a.id === clashId);
                    
                    if(adjIndex > -1) {
                        data.adjustments[adjIndex].substituteResponse = responseStatus;
                        data.adjustments[adjIndex].substituteMessage = reasonMsg;
                        transaction.update(docRef, { adjustments: data.adjustments });
                    }
                });
                alert(`Response logged as ${responseStatus}.`);
            } catch(e) {
                alert("Error saving response: " + e.message);
            }
        }

        async function applyTimetableOverride(adj, originalTeacherName) {
            const prefix = activeStaff.center === "GHUMARWIN" ? "" : activeStaff.center.toLowerCase() + "_";
            const histRef = db.collection(prefix + "timetable_history").doc(adj.date);
            const dayName = new Date(adj.date).toLocaleDateString('en-US', { weekday: 'long' });
            
            // Format class/section to match timetable data structure
            const parts = adj.sub.split('|');
            const cName = parts[0].trim();
            const sName = parts[1].replace('Sec', '').trim();

            const docSnap = await histRef.get();
            let targetSchedule = [];

            if (docSnap.exists && docSnap.data().schedule) {
                targetSchedule = docSnap.data().schedule;
            } else {
                // If no override exists for this date, clone the normal weekly master schedule
                const masterSnap = await db.collection(prefix + "timetable").where("day", "==", dayName).get();
                targetSchedule = masterSnap.docs.map(d => d.data());
            }

            // Find the specific slot and overwrite the teacher
            let slotUpdated = false;
            targetSchedule = targetSchedule.map(slot => {
                const slotStart = timeToMins(slot.start24 || (slot.timeRange ? slot.timeRange.split(' - ')[0] : "00:00"));
                const slotEnd = timeToMins(slot.end24 || (slot.timeRange ? slot.timeRange.split(' - ')[1] : "00:00"));
                
                const norm = (s) => (s || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                
                // Match by Class, Section, and EXACT Time Window
                if (norm(slot.className) === norm(cName) && norm(slot.section) === norm(sName) && slotStart === adj.start && slotEnd === adj.end) {
                    slot.teacher = activeStaff.name;
                    slot.teacherName = activeStaff.name;
                    slot.teacherEmail = activeStaff.email;
                    slot.remark = `Sub for ${originalTeacherName}`;
                    slotUpdated = true;
                }
                return slot;
            });

            if (!slotUpdated) throw new Error("Could not locate the exact timetable slot to override. The master schedule may have changed.");

            // Save the updated schedule back to history
            await histRef.set({
                date: adj.date,
                lastUpdated: Date.now(),
                schedule: targetSchedule,
                type: "DAILY_OVERRIDE",
                tag: "Substitutions Applied"
            }, { merge: true });

            // Trigger global sync so portals refresh
            await db.collection("system_metadata").doc("timetable").set({ lastUpdated: Date.now() }, { merge: true });
        }
    </script>
