<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minerva | Apply for Leave</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .action-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .action-card:active { transform: scale(0.96); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        input, textarea, select { font-size: 16px !important; } /* Prevents iOS zoom on focus */
        .loader { border: 3px solid #f1f5f9; border-top: 3px solid #6366f1; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <header class="bg-[#1e1b4b] text-white p-4 sticky top-0 z-50 shadow-md flex items-center gap-4">
        <button onclick="window.location.href='teacher-portal.html'" class="p-2 bg-indigo-800 rounded-xl active:bg-indigo-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
            <h1 class="text-lg font-black uppercase tracking-tight">Apply for Leave</h1>
            <p id="header-subtitle" class="text-[10px] font-bold text-indigo-300 uppercase tracking-widest">Automatic Duty & Class Check</p>
        </div>
    </header>

    <main class="p-4 space-y-4 max-w-2xl mx-auto">
        
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-black text-lg">👤</div>
                <div>
                    <p id="pref-name" class="font-black text-slate-800 text-sm leading-none uppercase">Loading...</p>
                    <p id="pref-dept" class="text-[9px] font-bold text-slate-400 uppercase mt-1">Loading Dept...</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[8px] font-black text-slate-400 uppercase block">Centre</span>
                <p id="pref-center" class="font-black text-indigo-600 text-[10px] uppercase">Loading...</p>
            </div>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 text-center">Step 1: Choose Leave Type</p>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="setLeaveType('FULL')" id="btn-FULL" class="action-card flex items-center justify-between p-4 bg-emerald-50 border-2 border-emerald-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">🗓️</span>
                        <div class="text-left">
                            <p class="font-black text-emerald-900 text-sm uppercase">Full Day</p>
                            <p class="text-[10px] font-bold text-emerald-600 uppercase">Complete Absence</p>
                        </div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-emerald-200" id="check-FULL"></div>
                </button>

                <button onclick="setLeaveType('HALF')" id="btn-HALF" class="action-card flex items-center justify-between p-4 bg-amber-50 border-2 border-amber-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">🌓</span>
                        <div class="text-left">
                            <p class="font-black text-amber-900 text-sm uppercase">Half Day</p>
                            <p class="text-[10px] font-bold text-amber-600 uppercase">Max 5 Hours</p>
                        </div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-amber-200" id="check-HALF"></div>
                </button>

                <button onclick="setLeaveType('SHORT')" id="btn-SHORT" class="action-card flex items-center justify-between p-4 bg-rose-50 border-2 border-rose-100 rounded-2xl">
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">⏱️</span>
                        <div class="text-left">
                            <p class="font-black text-rose-900 text-sm uppercase">Short Leave</p>
                            <p class="text-[10px] font-bold text-rose-600 uppercase">Max 60 Minutes</p>
                        </div>
                    </div>
                    <div class="w-6 h-6 rounded-full border-2 border-rose-200" id="check-SHORT"></div>
                </button>
            </div>
        </div>

        <div id="input-section" class="hidden bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-4 animate-in slide-in-from-top-2">
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2" id="start-date-wrap">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">Select Date</label>
                    <input type="date" id="l-date" onchange="runAnalysis()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold">
                </div>
                <div id="end-date-wrap" class="hidden col-span-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">End Date (Optional)</label>
                    <input type="date" id="l-end-date" onchange="runAnalysis()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold">
                </div>
                <div id="time-wrap" class="hidden">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 ml-1">From Time</label>
                    <input type="time" id="l-time" onchange="runAnalysis()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold">
                </div>
                <div id="auto-end-wrap" class="hidden">
                    <label class="block text-[10px] font-black text-rose-400 uppercase mb-1 ml-1">Until Time</label>
                    <div id="l-auto-end" class="w-full p-3 bg-rose-50 border border-rose-100 rounded-xl font-black text-rose-600 text-center">--:--</div>
                </div>
            </div>
        </div>

        <div id="analysis-section" class="hidden space-y-4">
            <div class="bg-indigo-900 p-4 rounded-2xl shadow-lg">
                <h4 class="text-white font-black uppercase text-[10px] tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-rose-500 rounded-full animate-ping"></span> Conflict Analysis
                </h4>
                <div id="clash-feed" class="mt-4 space-y-3"></div>
            </div>

            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-2 ml-1">Detailed Reason</label>
                <textarea id="l-reason" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-indigo-500" placeholder="Why are you applying for leave?"></textarea>
                
                <button id="submit-btn" onclick="submitLeave()" class="w-full mt-6 py-5 bg-indigo-600 text-white font-black rounded-2xl uppercase tracking-[0.2em] text-xs shadow-xl active:scale-95 transition-all">
                    Submit Application
                </button>
            </div>
        </div>

    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeStaff = null, leaveType = null, calculatedEndMins = 0;
        let timetableData = [], dutyData = [], staffData = [], historyData = [];

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');

            document.getElementById('pref-name').innerText = activeStaff.name || activeStaff.email;
            document.getElementById('pref-dept').innerText = activeStaff.dept || "Faculty";
            document.getElementById('pref-center').innerText = activeStaff.center || "GHUMARWIN";

            await loadDatabases();
        };

        async function loadDatabases() {
            const center = activeStaff.center || "GHUMARWIN";
            const prefix = center === "GHUMARWIN" ? "" : center.toLowerCase() + "_";
            
            const [tt, staff, hist, rosters] = await Promise.all([
                db.collection(prefix + "timetable").get(),
                db.collection("staff_applications").where("status", "==", "approved").get(),
                db.collection(prefix + "timetable_history").get(),
                db.collection(prefix + "duty_rosters").get()
            ]);

            timetableData = tt.docs.map(d => d.data());
            historyData = hist.docs.map(d => d.data());
            dutyData = rosters.docs.map(d => ({ id: d.id, ...d.data() }));
            staffData = staff.docs.map(d => {
                const det = d.data().details || {};
                let n = d.data().email;
                for(let k in det) if(k.toLowerCase().includes('name')) n = det[k];
                return { email: d.data().email, name: n, rawDept: (det.Department || det.Subject || "General").toString() };
            });
        }

        function setLeaveType(type) {
            leaveType = type;
            document.querySelectorAll('.action-card').forEach(b => b.classList.replace('border-indigo-500', 'border-slate-100'));
            document.querySelectorAll('[id^="check-"]').forEach(c => c.innerHTML = "");
            
            document.getElementById('btn-' + type).classList.replace('border-slate-100', 'border-indigo-500');
            document.getElementById('check-' + type).innerHTML = '<div class="w-full h-full bg-indigo-600 rounded-full border-2 border-white"></div>';
            
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('end-date-wrap').classList.toggle('hidden', type !== 'FULL');
            document.getElementById('time-wrap').classList.toggle('hidden', type === 'FULL');
            document.getElementById('auto-end-wrap').classList.toggle('hidden', type === 'FULL');
            
            runAnalysis();
        }

        function timeToMins(t) { 
            if(!t) return 0; 
            if(t.includes(' ')) { 
                let [tm, mod] = t.split(' '); let [h,m] = tm.split(':').map(Number); 
                if(h===12) h=0; if(mod==='PM') h+=12; return h*60+m; 
            } 
            let [h,m]=t.split(':').map(Number); return h*60+m; 
        }
        function minsTo12H(m) { let h=Math.floor(m/60)%24; let mn=m%60; let mod=h>=12?'PM':'AM'; h=h%12||12; return `${h.toString().padStart(2,'0')}:${mn.toString().padStart(2,'0')} ${mod}`; }

        function runAnalysis() {
            const dateVal = document.getElementById('l-date').value;
            if (!dateVal || !leaveType) return;

            document.getElementById('analysis-section').classList.remove('hidden');
            const feed = document.getElementById('clash-feed');
            feed.innerHTML = '<div class="flex justify-center p-10"><div class="loader"></div></div>';

            let leaveStart = 0, leaveEnd = 1440;
            if (leaveType !== 'FULL') {
                const startTime = document.getElementById('l-time').value;
                if(!startTime) return;
                leaveStart = timeToMins(startTime);
                let dur = (leaveType === 'HALF') ? 300 : 60;
                leaveEnd = Math.min(leaveStart + dur, 1020); // Cap at 5:00 PM
                document.getElementById('l-auto-end').innerText = minsTo12H(leaveEnd);
            }

            const dayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date(dateVal).getDay()];
            
            // 1. Compile User's Active Schedule (Classes + Exam Duties + Lunch Duties)
            const override = historyData.find(o => o.date === dateVal);
            const activeSchedule = (override && override.schedule) ? override.schedule : timetableData.filter(t => t.day === dayName);
            
            let userConflicts = [];
            const norm = (s) => (s || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            const myName = norm(activeStaff.name);

            // Add Classes/Exam Duties
            activeSchedule.forEach(slot => {
                if (norm(slot.teacherName) === myName || norm(slot.teacher) === myName) {
                    const s = timeToMins(slot.timeRange?.split(' - ')[0] || slot.start24);
                    const e = timeToMins(slot.timeRange?.split(' - ')[1] || slot.end24);
                    if (leaveStart < e && leaveEnd > s) {
                        userConflicts.push({ type: slot.subject === 'EXAM' ? 'EXAM DUTY' : 'CLASS', title: slot.subject, sub: `${slot.className} | Sec ${slot.section}`, start: s, end: e });
                    }
                }
            });

            // Add Lunch Duties
            const diffToMonday = new Date(dateVal).getDate() - new Date(dateVal).getDay() + (new Date(dateVal).getDay() === 0 ? -6 : 1);
            const monday = new Date(new Date(dateVal).setDate(diffToMonday)).toISOString().split('T')[0];
            const roster = dutyData.find(r => r.id === "lunch_duty_" + monday);
            if (roster) {
                Object.values(roster.rosterData).forEach(room => {
                    const d = room.columns[dayName];
                    if (d && d.status === 'ASSIGNED' && norm(d.staff.name) === myName) {
                        const s = timeToMins(d.timing.split(' - ')[0]);
                        const e = timeToMins(d.timing.split(' - ')[1]);
                        if (leaveStart < e && leaveEnd > s) {
                            userConflicts.push({ type: 'LUNCH DUTY', title: 'Lunch Supervision', sub: `Room: ${room.cName || 'Assigned'}`, start: s, end: e });
                        }
                    }
                });
            }

            if (userConflicts.length === 0) {
                feed.innerHTML = `<div class="bg-emerald-500/10 text-emerald-400 p-4 rounded-xl font-bold text-center text-[10px] uppercase border border-emerald-500/20">✅ No duties or classes found in this window.</div>`;
                return;
            }

            // 2. Map Substitutes for each Conflict
            feed.innerHTML = userConflicts.map((con, idx) => {
                const subs = staffData.filter(staff => {
                    if (norm(staff.name) === myName) return false;
                    const staffTt = activeSchedule.filter(s => norm(s.teacherName) === norm(staff.name) || norm(s.teacher) === norm(staff.name));
                    return !staffTt.some(slot => {
                        const s = timeToMins(slot.timeRange?.split(' - ')[0] || slot.start24);
                        const e = timeToMins(slot.timeRange?.split(' - ')[1] || slot.end24);
                        return (con.start < e && con.end > s);
                    });
                });

                return `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200">
                        <div class="p-4 flex justify-between items-center border-b border-slate-50">
                            <div>
                                <p class="text-[8px] font-black text-rose-500 uppercase tracking-widest">${con.type}</p>
                                <p class="font-black text-slate-800 text-sm uppercase">${con.title}</p>
                                <p class="text-[9px] font-bold text-slate-400 uppercase">${con.sub}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-black text-slate-700 text-xs">${minsTo12H(con.start)}</p>
                                <p class="text-[9px] font-bold text-slate-400 lowercase">to ${minsTo12H(con.end)}</p>
                            </div>
                        </div>
                        <details class="group">
                            <summary class="p-3 bg-slate-50 cursor-pointer flex justify-between items-center">
                                <span class="text-[9px] font-black text-indigo-600 uppercase tracking-widest">${subs.length} Potential Substitutes</span>
                                <span class="text-slate-300 group-open:rotate-180 transition-transform text-xs">▼</span>
                            </summary>
                            <div class="p-3 grid grid-cols-1 gap-2 bg-white">
                                ${subs.slice(0,10).map(s => `<div class="flex justify-between items-center p-2 rounded-lg border border-slate-100"><span class="text-[10px] font-bold text-slate-700 uppercase">${s.name}</span><span class="text-[8px] font-black text-slate-400 uppercase">${(s.rawDept || "General").split(',')[0]}</span></div>`).join('')}
                                ${subs.length > 10 ? `<p class="text-center text-[8px] font-bold text-slate-300 uppercase">+ ${subs.length-10} others</p>` : ''}
                            </div>
                        </details>
                    </div>
                `;
            }).join('');
        }

        async function submitLeave() {
            const reason = document.getElementById('l-reason').value.trim();
            if(!reason) return alert("Please enter a reason.");
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "Submitting...";

            const app = {
                teacherEmail: activeStaff.email, teacherName: activeStaff.name,
                type: leaveType, date: document.getElementById('l-date').value,
                startTime: document.getElementById('l-time').value || "00:00",
                endTime: leaveType === 'FULL' ? "23:59" : minsTo12H(calculatedEndMins),
                reason, status: "PENDING", timestamp: Date.now()
            };

            try {
                const prefix = activeStaff.center === "GHUMARWIN" ? "" : activeStaff.center.toLowerCase() + "_";
                await db.collection(prefix + "leave_requests").add(app);
                alert("✅ Leave Application Submitted.");
                window.location.href = 'teacher-portal.html';
            } catch(e) { alert("Error."); btn.disabled = false; }
        }
    </script>
</body>
</html>
