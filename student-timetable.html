<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Student Timetable</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tt-grid { display: flex; flex-wrap: nowrap !important; overflow-x: auto; overflow-y: visible; gap: 0; background: #fff; padding: 0; align-items: stretch; min-height: 44px; width: 100%; box-sizing: border-box; }
        .time-block { flex-shrink: 0; width: 150px; background: white; border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; display: flex; flex-direction: column; position: relative; }
    </style>
</head>
<body class="min-h-screen pb-20 flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white border-b flex flex-col sm:flex-row justify-between items-start sm:items-center px-4 sm:px-6 py-4 sticky top-0 z-50 shadow-sm gap-4">
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='student-portal.html'" class="p-2.5 hover:bg-slate-100 rounded-xl transition-colors text-slate-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="text-lg sm:text-xl font-black text-slate-900 uppercase tracking-tight leading-none">My Timetable</h1>
                <p id="view-subtitle" class="text-[10px] font-black text-blue-600 uppercase tracking-widest mt-1">Loading profile...</p>
            </div>
        </div>

        <!-- Controls: View Mode Switcher & Date Picker -->
        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-end">
            <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button id="tab-my-section" onclick="switchViewMode('SECTION')" class="px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg bg-blue-600 text-white shadow-sm transition-all">My Section</button>
                <button id="tab-whole-school" onclick="switchViewMode('WHOLE')" class="px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg text-slate-500 hover:text-slate-800 transition-all">Whole School</button>
            </div>

            <div class="flex items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl shadow-inner">
                <span class="text-xs">📅</span>
                <input type="date" id="target-date-picker" onchange="loadTimetableForDate()" class="bg-transparent text-xs font-black text-slate-700 outline-none cursor-pointer">
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 w-full flex-1 space-y-6">
        
        <!-- Status Banner -->
        <div id="schedule-status-banner" class="hidden bg-amber-50 border-2 border-amber-300 p-4 rounded-2xl flex items-center justify-between text-amber-900 shadow-sm">
            <div class="flex items-center gap-3">
                <span class="text-xl">🎯</span>
                <span id="banner-text" class="text-xs font-black uppercase tracking-widest"></span>
            </div>
            <button onclick="resetToToday()" class="text-[10px] font-black uppercase bg-white border border-amber-300 px-3 py-1.5 rounded-lg shadow-sm hover:bg-amber-100 transition-colors">Reset to Today</button>
        </div>

        <!-- Timetable Render Container -->
        <div id="timetable-container" class="space-y-4">
            <div class="text-center py-20 font-black text-slate-400 uppercase tracking-widest text-xs animate-pulse">Loading Schedule Matrix...</div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center text-slate-400 text-[10px] font-black uppercase tracking-[0.4em] py-8 mt-auto shrink-0 border-t border-slate-200">
        Minerva Study Circle Engine
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let studentData = null;
        let activeCenter = "GHUMARWIN";
        let structureData = [];
        let rawTimetableSlots = [];
        let holidaysData = [];
        let currentMode = 'SECTION'; // 'SECTION' or 'WHOLE'

        const SPECIAL_SUBJECTS = ['BREAK', 'LUNCH BREAK', 'FRUIT BREAK', 'ASSEMBLY', 'EXAM', 'UT', 'OT', 'TERMINAL EXAMS', 'PREBOARD', 'BOARD EXAM', 'EVENT'];

        function getDynamicColor(text) {
            if (!text || text === 'NONE') return '#64748b';
            const upperText = text.toUpperCase();
            if (['BREAK', 'LUNCH BREAK', 'FRUIT BREAK', 'ASSEMBLY'].includes(upperText)) return '#94a3b8';
            if (['EXAM', 'UT', 'OT', 'TERMINAL EXAMS', 'PREBOARD', 'BOARD EXAM', 'EVENT'].includes(upperText)) return '#8b5cf6';
            
            let hash = 0;
            for (let i = 0; i < text.length; i++) { hash = text.charCodeAt(i) + ((hash << 5) - hash); }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 75%, 45%)`;
        }

        function format12Hour(time24) {
            if (!time24) return ""; 
            let [h, m] = time24.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM'; 
            h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
        }

        function getCollection(name) {
            const globalCollections = ['configs', 'staff_applications'];
            if (globalCollections.includes(name)) return db.collection(name);
            return activeCenter === "GHUMARWIN" ? db.collection(name) : db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        async function init() {
            // 1. Session Auth Check
            const isAuth = sessionStorage.getItem('minervaStudentAuth');
            const rawData = sessionStorage.getItem('minervaStudentData');
            if (!isAuth || isAuth !== 'true' || !rawData) {
                return window.location.replace('student-login.html');
            }

            studentData = JSON.parse(rawData);
            if (studentData.center) activeCenter = studentData.center.toUpperCase();

            document.getElementById('view-subtitle').innerText = `${studentData.className} • SEC ${studentData.section} (${activeCenter})`;

            // Set Date Picker to Today
            const todayIso = new Date().toISOString().split('T')[0];
            document.getElementById('target-date-picker').value = todayIso;

            await Promise.all([fetchStructure(), fetchHolidays()]);
            await loadTimetableForDate();
        }

        async function fetchStructure() {
            try {
                const snap = await getCollection("institute_structure").orderBy("className").get();
                structureData = snap.docs.map(d => d.data());
            } catch (e) {
                console.error("Structure fetch error:", e);
                structureData = [];
            }
        }

        async function fetchHolidays() {
            try {
                const snap = await getCollection("school_holidays").get();
                holidaysData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            } catch (e) {
                console.error("Holiday fetch error:", e);
                holidaysData = [];
            }
        }

        function switchViewMode(mode) {
            currentMode = mode;
            document.getElementById('tab-my-section').className = mode === 'SECTION' 
                ? "px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg bg-blue-600 text-white shadow-sm transition-all"
                : "px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg text-slate-500 hover:text-slate-800 transition-all";
            
            document.getElementById('tab-whole-school').className = mode === 'WHOLE' 
                ? "px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg bg-blue-600 text-white shadow-sm transition-all"
                : "px-4 py-2 text-[10px] font-black uppercase tracking-widest rounded-lg text-slate-500 hover:text-slate-800 transition-all";

            renderTimetable();
        }

        function resetToToday() {
            const todayIso = new Date().toISOString().split('T')[0];
            document.getElementById('target-date-picker').value = todayIso;
            loadTimetableForDate();
        }

        async function loadTimetableForDate() {
            const dateVal = document.getElementById('target-date-picker').value;
            if (!dateVal) return;

            const container = document.getElementById('timetable-container');
            container.innerHTML = `<div class="text-center py-20 font-black text-slate-400 uppercase tracking-widest text-xs animate-pulse">Syncing Timetable Slots...</div>`;

            const [year, month, day] = dateVal.split('-');
            const dateObj = new Date(year, month - 1, day);
            const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
            const prettyDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            const todayIso = new Date().toISOString().split('T')[0];
            const banner = document.getElementById('schedule-status-banner');
            const bannerText = document.getElementById('banner-text');

            if (dateVal !== todayIso) {
                bannerText.innerText = `Viewing Schedule for ${dayName}, ${prettyDate}`;
                banner.classList.remove('hidden');
                banner.classList.add('flex');
            } else {
                banner.classList.add('hidden');
                banner.classList.remove('flex');
            }

            try {
                // 1. Check for 1-day specific override (Exam / Daily Override)
                const historySnap = await getCollection("timetable_history").doc(dateVal).get();
                
                if (historySnap.exists && (historySnap.data().type === "DAILY_OVERRIDE" || historySnap.data().type === "EXAM_OVERRIDE")) {
                    const hData = historySnap.data();
                    rawTimetableSlots = (hData.schedule || []).filter(slot => slot.day === dayName);
                } else {
                    // 2. Scan for active Future Masters before or on this date
                    const futureSnap = await getCollection("timetable_history").where("type", "==", "FUTURE_MASTER").get();
                    let activeMasters = [];
                    futureSnap.docs.forEach(doc => { if (doc.id <= dateVal) activeMasters.push(doc.data()); });

                    if (activeMasters.length > 0) {
                        activeMasters.sort((a, b) => b.date.localeCompare(a.date));
                        rawTimetableSlots = (activeMasters[0].schedule || []).filter(slot => slot.day === dayName);
                    } else {
                        // 3. Fallback to normal Live Master Schedule
                        const masterSnap = await getCollection("timetable").where("day", "==", dayName).get();
                        rawTimetableSlots = masterSnap.docs.map(d => d.data());
                    }
                }

                renderTimetable();
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="text-center py-20 text-rose-500 font-bold uppercase tracking-widest text-xs">Error loading schedule data.</div>`;
            }
        }

        function renderTimetable() {
            const container = document.getElementById('timetable-container');
            
            // Filter structure based on view mode
            let targetStructures = structureData;
            if (currentMode === 'SECTION') {
                targetStructures = structureData.filter(s => s.className.toUpperCase() === studentData.className.toUpperCase() && s.sectionName.toUpperCase() === studentData.section.toUpperCase());
            }

            if (targetStructures.length === 0) {
                container.innerHTML = `<div class="text-center py-20 font-black text-slate-400 uppercase tracking-widest text-xs bg-white rounded-3xl border border-slate-200">No structure configured for this section.</div>`;
                return;
            }

            targetStructures.sort((a, b) => a.className.localeCompare(b.className) || a.sectionName.localeCompare(b.sectionName));

            let html = "";
            targetStructures.forEach((struct, secIdx) => {
                const secSlots = rawTimetableSlots.filter(t => t.className.toUpperCase() === struct.className.toUpperCase() && t.section.toUpperCase() === struct.sectionName.toUpperCase());

                // Group slots by exact time range
                const timeContainers = {};
                secSlots.forEach(slot => {
                    const tKey = `${slot.start24}-${slot.end24}`;
                    if (!timeContainers[tKey]) timeContainers[tKey] = { start24: slot.start24, end24: slot.end24, entries: [] };

                    let existing = timeContainers[tKey].entries.find(e => e.subject === slot.subject && e.teacher === slot.teacher && e.room === slot.room);
                    if (!existing) {
                        timeContainers[tKey].entries.push({ subject: slot.subject, teacher: slot.teacher, room: slot.room, remark: slot.remark });
                    }
                });

                const sortedContainers = Object.values(timeContainers).sort((a, b) => (a.start24 || "").localeCompare(b.start24 || ""));

                // Dynamic Theme Palette
                const themes = [
                    { main: '#0284c7', light: '#e0f2fe' },
                    { main: '#059669', light: '#d1fae5' },
                    { main: '#7c3aed', light: '#f3e8ff' },
                    { main: '#e11d48', light: '#ffe4e6' },
                    { main: '#d97706', light: '#fef3c7' }
                ];
                const th = themes[secIdx % themes.length];

                html += `
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col md:flex-row items-stretch w-full mb-4">
                        <!-- Left Section Info Sidebar -->
                        <div class="p-4 md:w-48 shrink-0 flex flex-col justify-center items-center text-white" style="background-color: ${th.main};">
                            <div class="text-sm md:text-base font-black uppercase tracking-tight text-center">${struct.className}</div>
                            <div class="text-[10px] font-bold uppercase tracking-widest mt-0.5 opacity-90 text-center">SEC ${struct.sectionName}</div>
                        </div>

                        <!-- Horizontal Scrollable Matrix Grid -->
                        <div class="tt-grid flex-1 relative bg-slate-50 overflow-x-auto custom-scroll">
                `;

                if (sortedContainers.length === 0) {
                    html += `<div class="p-4 text-xs font-bold text-slate-400 italic">No classes scheduled for this section today.</div>`;
                } else {
                    sortedContainers.forEach(tc => {
                        let durMins = "";
                        if (tc.start24 && tc.end24) {
                            const [sh, sm] = tc.start24.split(':').map(Number);
                            const [eh, em] = tc.end24.split(':').map(Number);
                            const m = (eh * 60 + em) - (sh * 60 + sm);
                            if (m > 0) durMins = `${m}m`;
                        }

                        html += `
                            <div class="time-block flex flex-col border-r border-slate-200 bg-white relative shrink-0" style="width: 170px; min-width: 170px;">
                                <div class="bg-slate-100 text-slate-700 text-[10px] font-black text-center py-1 border-b border-slate-200 tracking-tight">
                                    ${format12Hour(tc.start24)} - ${format12Hour(tc.end24)}
                                </div>
                                <div class="flex flex-col flex-1 p-2 justify-center items-center gap-2">
                        `;

                        tc.entries.forEach((ent, idx) => {
                            if (idx > 0) html += `<hr class="w-full border-dashed border-slate-200 my-1">`;

                            const upperSub = (ent.subject || '').toUpperCase();
                            const subColor = getDynamicColor(upperSub);

                            if (SPECIAL_SUBJECTS.includes(upperSub)) {
                                html += `
                                    <div class="flex flex-col text-center w-full leading-tight">
                                        <span style="color: ${subColor}" class="font-black text-xs uppercase tracking-widest opacity-80">${ent.subject}</span>
                                        ${ent.remark ? `<span class="text-[9px] font-bold text-slate-400 mt-0.5">${ent.remark}</span>` : ''}
                                    </div>
                                `;
                            } else {
                                let teaName = ent.teacher !== 'NONE' ? ent.teacher : 'TBA';
                                html += `
                                    <div class="flex flex-col text-center w-full leading-tight">
                                        <span style="color: ${subColor}" class="font-black text-xs uppercase truncate" title="${ent.subject}">${ent.subject}</span>
                                        <span class="text-[10px] font-bold text-slate-600 truncate mt-1">[${teaName}]</span>
                                        ${ent.room ? `<span class="text-[9px] font-bold text-slate-400 mt-0.5">RM: ${ent.room}</span>` : ''}
                                        ${ent.remark ? `<span class="text-[9px] font-bold text-amber-600 italic mt-0.5">${ent.remark}</span>` : ''}
                                    </div>
                                `;
                            }
                        });

                        html += `</div></div>`;
                    });
                }

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
