<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Teacher Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        
        .tt-grid { display: flex; flex-wrap: wrap; gap: 16px; background: #f8fafc; padding: 16px; border-radius: 0 16px 16px 0; align-items: flex-start; min-height: 100px; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Responsive Sidebar: Top bar on mobile, Side bar on PC */
        .tt-sidebar { width: 100%; flex-shrink: 0; background: #0f172a; color: white; display: flex; flex-direction: row; align-items: center; justify-content: space-between; font-weight: 900; font-size: 14px; text-align: center; border-bottom: 4px solid #1e293b; padding: 12px 20px; }
        @media (min-width: 640px) { .tt-sidebar { width: 140px; flex-direction: column; justify-content: center; border-bottom: none; border-right: 4px solid #1e293b; padding: 10px; border-radius: 16px 0 0 16px; } }
        
        /* Responsive Blocks: Fit screen on mobile, Fixed size on PC */
        .time-block { flex-shrink: 0; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.2s; display: flex; flex-direction: column; overflow: hidden; }
        @media (min-width: 640px) { .time-block { width: 260px; } }
        
        .tb-header { background: #1e3a8a; color: white; padding: 8px; text-align: center; font-weight: 900; font-size: 12px; letter-spacing: 1px; }
        .tb-duration { background: #eff6ff; color: #1d4ed8; font-size: 9px; font-weight: 900; text-align: center; padding: 2px; text-transform: uppercase; }
        
        .day-pill { display: inline-block; background: #e0e7ff; color: #1e40af; font-size: 8px; font-weight: 900; padding: 2px 4px; border-radius: 4px; margin: 2px; }
        
        /* The Dimming Class for days not matching today */
        .dim-block { opacity: 0.45; filter: grayscale(40%); transition: all 0.3s ease; }
        .dim-block:hover { opacity: 1; filter: grayscale(0%); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 p-4 sm:px-8 sm:py-5 flex flex-wrap justify-between items-center shadow-lg gap-3">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors shadow-md border border-indigo-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard
            </button>
            <div>
                <h1 class="text-sm sm:text-xl font-black uppercase text-white tracking-widest">Timetable Hub</h1>
                <p id="teacher-badge" class="text-[9px] sm:text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Loading...</p>
            </div>
        </div>
        
        <div class="flex gap-2">
            <button onclick="forceSync()" class="bg-indigo-900 hover:bg-indigo-800 text-indigo-200 px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-all shadow-inner border border-indigo-700" title="Fetch latest database changes">
                ↻ Sync
            </button>
            <button id="edit-master-btn" onclick="window.location.href='admin-timetable.html'" class="hidden bg-emerald-500 hover:bg-emerald-400 text-[#1e1b4b] px-5 py-2.5 rounded-xl font-black uppercase tracking-widest text-[10px] transition-all shadow-[0_0_15px_rgba(16,185,129,0.4)] active:scale-95">
                ✏️ Edit Master
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-8">
        
      <div class="flex flex-col sm:flex-row justify-center items-center gap-3 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 max-w-fit mx-auto">
            <div class="flex gap-2 w-full sm:w-auto">
                <button id="btn-me" onclick="switchView('ME')" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-indigo-600 text-white shadow-md">
                    👤 My Timetable
                </button>
                <button id="btn-all" onclick="switchView('ALL')" class="flex-1 sm:flex-none px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-transparent text-slate-500 hover:bg-slate-100">
                    🏫 Full School
                </button>
            </div>
            <div class="w-full sm:w-[2px] h-[2px] sm:h-8 bg-slate-200"></div>
            <div class="flex gap-2 w-full sm:w-auto items-center">
                <input type="date" id="date-filter" onchange="loadDateView()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl font-black text-slate-600 bg-slate-100 border border-slate-200 outline-none cursor-pointer text-[11px] uppercase tracking-widest hover:bg-slate-200 transition-colors focus:border-indigo-400">
                <button id="clear-date-btn" onclick="clearDateView()" class="hidden px-4 py-2.5 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-rose-100 text-rose-600 hover:bg-rose-200 shadow-sm whitespace-nowrap">✕ Clear</button>
            </div>
        </div>

    <div class="flex justify-between items-end mb-6 px-2">
            <div>
                <h2 id="view-title" class="text-2xl font-black text-slate-800 uppercase tracking-tighter">My Schedule</h2>
                <p id="view-subtitle" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Showing all sections where you are assigned.</p>
            </div>
            <div class="text-right">
                <span class="bg-amber-100 text-amber-800 font-black px-3 py-1.5 rounded-xl text-[10px] uppercase tracking-widest shadow-sm" id="today-badge">Today: Monday</span>
            </div>
        </div>

        <div id="filter-container" class="hidden flex-col sm:flex-row gap-4 mb-8 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 max-w-3xl mx-auto sm:mx-0">
            <div class="flex-1">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Filter by Subject</label>
                <select id="filter-subject" onchange="updateTeacherDropdown()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer transition-colors">
                    <option value="ALL">All Subjects</option>
                </select>
            </div>
            <div class="flex-1">
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Filter by Teacher</label>
                <select id="filter-teacher" onchange="renderDashboard()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer transition-colors">
                    <option value="ALL">All Teachers</option>
                </select>
            </div>
        </div>
        <div id="timetable-container" class="space-y-8 min-h-[50vh]">
            <div class="text-center py-20 font-black text-slate-400 animate-pulse uppercase tracking-widest text-xs">Loading Smart Containers...</div>
        </div>

    </main>

    <div id="teacher-info-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-2xl shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-4 shrink-0">
                <div>
                    <h3 id="ti-name" class="font-black text-indigo-900 text-xl uppercase tracking-tighter">Teacher Name</h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Weekly Schedule Overview</p>
                </div>
                <button onclick="document.getElementById('teacher-info-modal').classList.replace('flex', 'hidden')" class="bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 w-8 h-8 rounded-full font-black flex items-center justify-center transition-colors">✕</button>
            </div>
            <div id="ti-content" class="overflow-y-auto space-y-4 pr-2"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- MULTI-CENTER DYNAMIC DB ROUTER (TEACHER EDITION) ---
        const storedStaff = JSON.parse(localStorage.getItem('minervaActiveStaff')) || {};
        const activeCenter = storedStaff.center || "GHUMARWIN";

       function getCollection(name) {
            const globalCollections = ['configs', 'staff_applications', 'system_metadata'];
            if (globalCollections.includes(name)) return db.collection(name);
            
            if (activeCenter === "GHUMARWIN") return db.collection(name);
            return db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }
        // --------------------------------------------------------
        
        let activeStaff = null;
        let safeName = "";
        let structureData = [];
        let allTeachers = []; // List of all staff
        
        let myTimetableData = [];
        let allTimetableData = [];
        let currentMode = 'ME'; // 'ME' or 'ALL'

        const SPECIAL_SUBJECTS = ['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'];
        const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const DAY_SHORTS = { 'Monday':'MON', 'Tuesday':'TUE', 'Wednesday':'WED', 'Thursday':'THU', 'Friday':'FRI', 'Saturday':'SAT', 'Sunday':'SUN' };
        
       const TODAY_FULL = DAYS_OF_WEEK[new Date().getDay()];
        let pinnedSections = new Set(); 
        let isDateViewActive = false;
        let viewDateIso = null;
        let viewDayFull = null;

        async function loadDateView() {
            const dateVal = document.getElementById('date-filter').value;
            if(!dateVal) return clearDateView();

            const btn = document.getElementById('clear-date-btn');
            btn.classList.remove('hidden');
            btn.innerText = "⏳...";

            try {
                const dObj = new Date(dateVal);
                viewDayFull = DAYS_OF_WEEK[dObj.getDay()];
                viewDateIso = dateVal;
                isDateViewActive = true;

                // 1. Fetch Normal Master for this specific weekday
                const masterSnap = await getCollection("timetable").where("day", "==", viewDayFull).get();
                let dayData = masterSnap.docs.map(d => ({id: d.id, ...d.data()}));

                // 2. Fetch Override for this exact date
                const historySnap = await getCollection("timetable_history").doc(viewDateIso).get();
                let isExamDay = false;
                if (historySnap.exists && historySnap.data().schedule) {
                    dayData = historySnap.data().schedule;
                    isExamDay = true;
                }

                dayData = dayData.map(item => ({
                    ...item,
                    id: item.id || 'id_' + Math.random().toString(36).substr(2, 9)
                }));

                const badge = document.getElementById('today-badge');
                if (isExamDay) {
                    badge.className = "bg-rose-100 text-rose-800 font-black px-3 py-1.5 rounded-xl text-[10px] uppercase tracking-widest shadow-sm border border-rose-200 animate-pulse";
                    badge.innerText = `🚨 EXAM/OVERRIDE: ${viewDateIso}`;
                } else {
                    badge.className = "bg-blue-100 text-blue-800 font-black px-3 py-1.5 rounded-xl text-[10px] uppercase tracking-widest shadow-sm border border-blue-200";
                    badge.innerText = `📅 VIEWING: ${viewDateIso} (${viewDayFull})`;
                }

                allTimetableData = dayData;
                myTimetableData = allTimetableData.filter(t => t.teacher === safeName || t.teacherName === safeName);
                
                renderDashboard();
            } catch(e) {
                console.error(e);
                alert("Error loading date.");
            } finally {
                btn.innerText = "✕ Clear";
            }
        }

        async function clearDateView() {
            document.getElementById('date-filter').value = "";
            document.getElementById('clear-date-btn').classList.add('hidden');
            isDateViewActive = false;
            viewDateIso = null;
            viewDayFull = null;

            document.getElementById('today-badge').className = "bg-amber-100 text-amber-800 font-black px-3 py-1.5 rounded-xl text-[10px] uppercase tracking-widest shadow-sm";
            document.getElementById('today-badge').innerText = `TODAY: ${TODAY_FULL.toUpperCase()}`;

            const btn = document.getElementById('clear-date-btn');
            btn.classList.remove('hidden');
            btn.innerText = "⏳...";

            await loadAllData();
            myTimetableData = allTimetableData.filter(t => t.teacher === safeName || t.teacherName === safeName);
            renderDashboard();
            
            btn.classList.add('hidden');
            btn.innerText = "✕ Clear";
        }

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');
            
            safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
            const safeDept = (activeStaff.dept && activeStaff.dept !== "undefined") ? activeStaff.dept : "General";
            
            document.getElementById('teacher-badge').innerText = `ID: ${safeName} | DEPT: ${safeDept}`;
            document.getElementById('today-badge').innerText = `TODAY: ${TODAY_FULL.toUpperCase()}`;

            try {
                const staffDoc = await getCollection("staff_applications").doc(activeStaff.uid).get();
                if (staffDoc.exists && staffDoc.data().canEditTimetable === true) {
                    const editBtn = document.getElementById('edit-master-btn');
                    editBtn.classList.remove('hidden');
                }
            } catch (err) { console.error("Auth check failed:", err); }

            await fetchStructure(); 
            await fetchTeachers(); // Fetch staff list
            
            // First load everything into memory to detect cross-teacher clashes
            await loadAllData(); 
            // Extract my data from the all data
            myTimetableData = allTimetableData.filter(t => t.teacher === safeName || t.teacherName === safeName);
            
            populateFilterDropdowns(); // Populate the dropdowns
            renderDashboard();
        };

        // --- FILTER ENGINE ---
        async function fetchTeachers() {
            const cached = localStorage.getItem('minerva_teachers');
            if (cached) {
                allTeachers = JSON.parse(cached);
                return;
            }
            const snap = await getCollection("staff_applications").where("status", "==", "approved").get();
            allTeachers = snap.docs.map(doc => {
                const data = doc.data();
                const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                return { name: nameKey ? data.details[nameKey] : data.email, email: data.email, dept: deptKey ? data.details[deptKey] : 'General' };
            });
            localStorage.setItem('minerva_teachers', JSON.stringify(allTeachers));
        }

        function populateFilterDropdowns() {
            const subSelect = document.getElementById('filter-subject');
            let allSubjects = new Set();
            allTeachers.forEach(t => {
                const depts = Array.isArray(t.dept) ? t.dept : [t.dept];
                depts.forEach(d => { if (d && d !== 'General') allSubjects.add(d.trim().toUpperCase()); });
            });
            structureData.forEach(st => {
                st.subjects.forEach(s => allSubjects.add(s.trim().toUpperCase()));
            });
            Array.from(allSubjects).sort().forEach(sub => {
                if(!SPECIAL_SUBJECTS.includes(sub)) {
                    subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                }
            });
            updateTeacherDropdown();
        }

        function updateTeacherDropdown() {
            const sub = document.getElementById('filter-subject').value;
            const teaSelect = document.getElementById('filter-teacher');
            teaSelect.innerHTML = '<option value="ALL">All Teachers</option>';
            let filteredTeachers = allTeachers;
            if (sub !== 'ALL') {
                filteredTeachers = allTeachers.filter(t => {
                    const deptStr = Array.isArray(t.dept) ? t.dept.join(',').toUpperCase() : t.dept.toUpperCase();
                    return deptStr.includes(sub);
                });
            }
            filteredTeachers.sort((a,b) => a.name.localeCompare(b.name)).forEach(t => {
                teaSelect.innerHTML += `<option value="${t.name}">${t.name}</option>`;
            });
            renderDashboard(); 
        }

        async function fetchStructure() {
            const cached = localStorage.getItem('minerva_struct');
            if (cached) {
                structureData = JSON.parse(cached);
            } else {
                const snap = await getCollection("institute_structure").orderBy("className").get();
                structureData = snap.docs.map(doc => doc.data());
                localStorage.setItem('minerva_struct', JSON.stringify(structureData));
            }
        }

       let holidaysData = [];

        async function loadAllData() {
            // Use today's date in the cache key so it automatically resets tomorrow
            const todayIso = new Date().toISOString().split('T')[0];
            const cacheKey = `minerva_timetable_cache_${todayIso}`; 
            const timeKey = `minerva_tt_last_update`;
            
            try {
                // Fetch holidays every time to ensure live overlay accuracy
                const holSnap = await getCollection("school_holidays").get();
                holidaysData = holSnap.docs.map(d => d.data());

                // Costs exactly 1 Firebase Read to check if Admin pushed an update!
                const metaSnap = await getCollection("system_metadata").doc("timetable").get();
                const serverTime = metaSnap.exists ? metaSnap.data().lastUpdated : 0;
                const localTime = localStorage.getItem(timeKey) || 0;

                const cached = localStorage.getItem(cacheKey);
                
                // If we have cache AND the Admin hasn't saved a newer version... use memory!
                if (cached && parseInt(localTime) >= serverTime) {
                    allTimetableData = JSON.parse(cached);
                    return;
                }

                // 1. Fetch Normal Master Timetable
                const snap = await getCollection("timetable").get();
                let masterData = snap.docs.map(d => ({id: d.id, ...d.data()}));
                
                // 2. FETCH TODAY'S EXAM/OVERRIDE
                const historySnap = await getCollection("timetable_history").doc(todayIso).get();
                if (historySnap.exists) {
                    const overrideData = historySnap.data().schedule;
                    
                    // Remove the normal classes for today
                    masterData = masterData.filter(t => t.day !== TODAY_FULL);
                    
                    // Inject the Exam/Override classes
                    masterData = masterData.concat(overrideData);
                    
                    // Update the UI Badge to alert the teacher
                    const badge = document.getElementById('today-badge');
                    if(badge) {
                        badge.className = "bg-rose-100 text-rose-800 font-black px-3 py-1.5 rounded-xl text-[10px] uppercase tracking-widest shadow-sm border border-rose-200 animate-pulse";
                        badge.innerText = `🚨 EXAM DAY: ${TODAY_FULL.toUpperCase()}`;
                    }
                }

                // 🚨 CRITICAL BUG FIX: Give any injected override data a unique ID.
                // If they don't have an ID, the Clash Detector counts them all as 'undefined' and marks everything as clashing!
                masterData = masterData.map(item => ({
                    ...item,
                    id: item.id || 'id_' + Math.random().toString(36).substr(2, 9)
                }));

                allTimetableData = masterData;
                
                // Save the merged data AND the new timestamp to memory
                localStorage.setItem(cacheKey, JSON.stringify(allTimetableData));
                localStorage.setItem(timeKey, serverTime.toString());
            } catch(e) {
                console.error("Error loading timetable:", e);
                // Safe offline fallback
                const cached = localStorage.getItem(cacheKey);
                if(cached) allTimetableData = JSON.parse(cached);
            }
        }

       async function switchView(mode) {
            currentMode = mode;
            const btnMe = document.getElementById('btn-me');
            const btnAll = document.getElementById('btn-all');
            const title = document.getElementById('view-title');
            const sub = document.getElementById('view-subtitle');
            const filterContainer = document.getElementById('filter-container');

            if(mode === 'ME') {
                btnMe.className = "px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-indigo-600 text-white shadow-md";
                btnAll.className = "px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-transparent text-slate-500 hover:bg-slate-100";
                title.innerText = "My Schedule";
                sub.innerText = "Showing all sections where you are assigned.";
                filterContainer.classList.add('hidden');
                filterContainer.classList.remove('flex');
                renderDashboard();
            } else {
                btnMe.className = "px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-transparent text-slate-500 hover:bg-slate-100";
                btnAll.className = "px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-indigo-600 text-white shadow-md";
                title.innerText = "Full School Schedule";
                sub.innerText = "Showing the entire master timetable.";
                filterContainer.classList.remove('hidden');
                filterContainer.classList.add('flex');
                renderDashboard();
            }
        }

        function togglePin(secId) {
            if(pinnedSections.has(secId)) pinnedSections.delete(secId);
            else pinnedSections.add(secId);
            renderDashboard(); 
        }

        // --- SILENT CLASH DETECTOR ---
        function timeToMins(t) {
            if(!t) return 0; let [h,m] = t.split(':').map(Number); return h*60+m;
        }

        function findClashes(dataArray) {
            let clashingIds = new Set();
            for(let i=0; i<dataArray.length; i++) {
                for(let j=i+1; j<dataArray.length; j++) {
                    let a = dataArray[i], b = dataArray[j];
                    if (a.teacher !== "NONE" && a.teacher && a.teacher === b.teacher && a.day === b.day) {
                        let aS = timeToMins(a.start24), aE = timeToMins(a.end24);
                        let bS = timeToMins(b.start24), bE = timeToMins(b.end24);
                        if (aS < bE && aE > bS) {
                            if (a.room && b.room && a.room.toLowerCase() === b.room.toLowerCase()) continue; // Merged class exception
                            clashingIds.add(a.id); clashingIds.add(b.id);
                        }
                    }
                }
            }
            return clashingIds;
        }

        function renderDashboard() {
            const container = document.getElementById('timetable-container');
            container.innerHTML = "";

            const datasetToUse = currentMode === 'ME' ? myTimetableData : allTimetableData;

            if(datasetToUse.length === 0) {
                container.innerHTML = `<div class="bg-white border-2 border-dashed border-slate-300 rounded-[2rem] p-16 text-center shadow-sm">
                    <div class="text-4xl mb-4">📭</div>
                    <h3 class="text-xl font-black text-slate-700 uppercase tracking-widest">No Classes Found</h3>
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-2">You currently have no classes scheduled in the system.</p>
                </div>`;
                return;
            }

            // Flag clashes against the FULL DATA to ensure accuracy
            const globalClashIds = findClashes(allTimetableData);
            datasetToUse.forEach(item => { item.hasClash = globalClashIds.has(item.id); });

           const renderGroups = {};
            structureData.forEach(struct => {
                if(!renderGroups[struct.className]) renderGroups[struct.className] = {};
                renderGroups[struct.className][struct.sectionName] = []; 
            });

            const selectedSub = (currentMode === 'ALL' && document.getElementById('filter-subject')) ? document.getElementById('filter-subject').value : 'ALL';
            const selectedTea = (currentMode === 'ALL' && document.getElementById('filter-teacher')) ? document.getElementById('filter-teacher').value : 'ALL';
            const isFiltering = currentMode === 'ALL' && (selectedSub !== 'ALL' || selectedTea !== 'ALL');

            datasetToUse.forEach(item => {
                let matchSub = selectedSub === 'ALL' || (item.subject && item.subject.toUpperCase() === selectedSub.toUpperCase());
                let matchTea = selectedTea === 'ALL' || item.teacher === selectedTea;

                if (matchSub && matchTea) {
                    if(renderGroups[item.className] && renderGroups[item.className][item.section]) {
                        renderGroups[item.className][item.section].push(item);
                    }
                }
            });

            // Pinned Board Setup
            let pinnedHtml = `
                <div class="bg-indigo-50 border-2 border-indigo-200 p-4 sm:p-6 rounded-[2.5rem] mb-10 shadow-md">
                    <div class="flex flex-wrap justify-between items-center mb-6 gap-4 border-b border-indigo-100 pb-4">
                        <h2 class="font-black text-indigo-900 uppercase tracking-widest flex items-center gap-3">
                            <span class="text-2xl bg-indigo-100 p-2 rounded-xl shadow-sm">📌</span> Pinned Board
                        </h2>
                    </div>
                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start w-full">`;
            let hasPinned = false;
            let normalHtml = "";

           Object.keys(renderGroups).sort().forEach(className => {
                let classHasData = false;
                Object.keys(renderGroups[className]).forEach(sec => {
                    if(renderGroups[className][sec].length > 0) classHasData = true;
                });
                
                if ((currentMode === 'ME' || isFiltering) && !classHasData) return;

                const shouldOpenClass = (isFiltering || currentMode === 'ME') ? 'open' : '';

                let groupHtml = `
                    <details class="bg-white shadow-lg rounded-[2rem] overflow-hidden border border-slate-200 class-group mb-8 group" ${shouldOpenClass}>
                        <summary class="bg-slate-800 text-white p-4 font-black text-[15px] uppercase tracking-[0.2em] shadow-inner cursor-pointer select-none flex justify-between items-center transition-colors hover:bg-slate-700 outline-none">
                            <span class="w-8"></span>
                            <span>${className}</span>
                            <span class="w-8 text-right opacity-50 group-open:rotate-180 transition-transform duration-300">▼</span>
                        </summary>
                        <div class="flex flex-col p-4 bg-slate-50 gap-4">`;
                
                let hasUnpinned = false;

                Object.keys(renderGroups[className]).sort().forEach(sectionName => {
                    const slots = renderGroups[className][sectionName];
                    if ((currentMode === 'ME' || isFiltering) && slots.length === 0) return; 

                    const secId = `sec_${className.replace(/\s+/g, '')}_${sectionName.replace(/\s+/g, '')}`;
                    const isPinned = pinnedSections.has(secId);
                    const shouldOpenSec = (isPinned || isFiltering || currentMode === 'ME') ? 'open' : '';
                    
                    const pinBtn = `<button onclick="togglePin('${secId}')" class="mt-4 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest transition-all ${isPinned ? 'text-indigo-800 bg-indigo-200 hover:bg-indigo-300 shadow-md' : 'text-slate-500 bg-slate-200 hover:bg-slate-300'}">${isPinned ? '📍 Unpin' : '📌 Pin'}</button>`;
                    const gridStyle = isPinned ? 'flex-wrap: nowrap !important; overflow-x: auto; padding-bottom: 12px;' : '';

                    const secHtml = `
                        <details class="bg-white rounded-2xl shadow-sm border ${isPinned ? 'border-indigo-400 border-2 shadow-indigo-100 w-full' : 'border-slate-200'} overflow-hidden group" ${shouldOpenSec}>
                            <summary class="bg-slate-100 text-slate-700 p-3 font-black text-[12px] uppercase tracking-widest cursor-pointer select-none flex justify-between items-center hover:bg-slate-200 transition-colors outline-none ${isPinned ? 'bg-indigo-100 text-indigo-900' : ''}">
                                <span>Section ${sectionName}</span>
                                <div class="flex items-center gap-3">
                                    <span class="text-[9px] px-3 py-1 rounded-full ${isPinned ? 'bg-indigo-200 text-indigo-800' : 'bg-slate-200 text-slate-500'}">${isPinned ? '📌 PINNED' : 'Click to Expand'}</span>
                                    <span class="opacity-50 group-open:rotate-180 transition-transform duration-300">▼</span>
                                </div>
                            </summary>
                            <div class="flex flex-col sm:flex-row relative bg-white border-t ${isPinned ? 'border-indigo-200' : 'border-slate-200'}">
                                <div class="tt-sidebar ${isPinned ? '!bg-indigo-700 !border-indigo-800' : ''} shrink-0">
                                    <div class="flex items-center gap-2 sm:block">
                                        <span class="opacity-50 text-[10px] tracking-widest block sm:mb-1">SEC</span>
                                        <span class="text-2xl tracking-tighter">${sectionName}</span>
                                    </div>
                                    ${pinBtn}
                                </div>
                               <div class="tt-grid flex-1" id="grid-${secId}" style="${gridStyle}">
                                    ${generateTimeBlocksHTML(slots, className, sectionName)}
                                </div>
                            </div>
                        </details>`;

                    if(isPinned) {
                        pinnedHtml += secHtml;
                        hasPinned = true;
                    } else {
                        groupHtml += secHtml;
                        hasUnpinned = true;
                    }
                });

                groupHtml += `</div></details>`;
                if(hasUnpinned) normalHtml += groupHtml;
            });

            pinnedHtml += `</div></div>`;
            container.innerHTML = (hasPinned ? pinnedHtml : '') + normalHtml;
        }

      function generateTimeBlocksHTML(slots, className, sectionName) {
            const timeContainers = {}; 
            slots.forEach(slot => {
                const tKey = `${slot.start24}-${slot.end24}`;
                if(!timeContainers[tKey]) timeContainers[tKey] = { start24: slot.start24, end24: slot.end24, entries: [] };
                
                let existingEntry = timeContainers[tKey].entries.find(e => e.subject === slot.subject && e.teacher === slot.teacher && e.room === slot.room);
                if(existingEntry) {
                    if(!existingEntry.days.includes(slot.day)) existingEntry.days.push(slot.day);
                    if(slot.hasClash) existingEntry.hasClash = true; // Transfer clash flag
                } else {
                    timeContainers[tKey].entries.push({ subject: slot.subject, teacher: slot.teacher, room: slot.room, remark: slot.remark, days: [slot.day], hasClash: slot.hasClash });
                }
            });

        // Dynamically target the selected date OR today's date
            const targetDay = isDateViewActive ? viewDayFull : TODAY_FULL;
            const targetDateObj = isDateViewActive ? new Date(viewDateIso) : new Date();
            targetDateObj.setHours(0,0,0,0);

            let finalHtml = "";
            Object.values(timeContainers).sort((a,b) => a.start24.localeCompare(b.start24)).forEach(tc => {
                
                let happensToday = false;
                tc.entries.forEach(ent => { if(ent.days.includes(targetDay)) happensToday = true; });

                let durStr = "SET TIME";
                let sMins = 0, eMins = 0;
                if(tc.start24 && tc.end24) {
                    const [sh, sm] = tc.start24.split(':').map(Number); 
                    const [eh, em] = tc.end24.split(':').map(Number);
                    sMins = sh * 60 + sm; eMins = eh * 60 + em;
                    const mins = eMins - sMins;
                    if (!isNaN(mins) && mins > 0) durStr = `${mins} MINS`;
                }

                // --- HOLIDAY CHECK FOR TODAY ---
                let isHolidayToday = false; let holidayReason = "";
                if (happensToday && holidaysData && holidaysData.length > 0) {
                    for (let h of holidaysData) {
                        const hStart = new Date(h.startDate); hStart.setHours(0,0,0,0);
                        const hEnd = new Date(h.endDate || h.startDate); hEnd.setHours(23,59,59,999);
                        
                        if (targetDateObj >= hStart && targetDateObj <= hEnd) {
                            const targetCls = `${className}|${sectionName}`;
                            if (h.targetClasses.includes('ALL') || h.targetClasses.includes(targetCls)) {
                                if (h.isFullDay) {
                                    isHolidayToday = true; holidayReason = h.reason; break;
                                } else if (h.startTime && h.endTime) {
                                    const [hsh, hsm] = h.startTime.split(':').map(Number);
                                    const [heh, hem] = h.endTime.split(':').map(Number);
                                    const hStartMins = hsh * 60 + hsm; const hEndMins = heh * 60 + hem;
                                    
                                    if (sMins < hEndMins && eMins > hStartMins) {
                                        isHolidayToday = true; holidayReason = h.reason; break;
                                    }
                                }
                            }
                        }
                    }
                }

                // If it's a holiday today, we dim it out so the teacher focuses on other days
                const dimClass = (happensToday && !isHolidayToday) ? '' : 'dim-block';

                let blockHtml = `
                    <div class="time-block ${dimClass} ${isHolidayToday ? 'border-rose-300' : ''}">
                        <div class="tb-header ${isHolidayToday ? '!bg-rose-500' : ''}">${format12Hour(tc.start24) || 'TBA'} - ${format12Hour(tc.end24) || 'TBA'}</div>
                        <div class="tb-duration ${isHolidayToday ? '!bg-rose-50 !text-rose-600' : ''}">${durStr}</div>
                        <div class="flex flex-col flex-1 p-2 gap-2 relative">
                `;

                if (isHolidayToday) {
                    blockHtml += `
                        <div class="absolute inset-0 bg-white/90 backdrop-blur-[1px] z-20 flex flex-col items-center justify-center rounded-b-2xl border-t border-rose-100">
                            <span class="text-3xl mb-1 shadow-sm">🌴</span>
                            <span class="text-[10px] font-black text-rose-600 uppercase tracking-widest text-center px-2 leading-tight">${holidayReason}<br><span class="text-[8px] text-slate-500 mt-1 block">Class Suspended Today</span></span>
                        </div>
                    `;
                }
                tc.entries.forEach((ent, index) => {
                    if(index > 0) blockHtml += `<hr class="border-dashed border-slate-200">`;
                    
                    let subColor = '#e11d48'; 
                    if (SPECIAL_SUBJECTS.includes(ent.subject)) subColor = '#94a3b8';
                    if (ent.subject === 'EXAM' || ent.subject === 'EVENT') subColor = '#8b5cf6';
                    if (ent.subject.toUpperCase().includes('MATH')) subColor = '#047857';
                    if (ent.subject.toUpperCase().includes('PHYSICS')) subColor = '#1d4ed8';

                  const sortedDays = ent.days.sort((a,b) => DAYS_OF_WEEK.indexOf(a) - DAYS_OF_WEEK.indexOf(b));
                    let pillsHtml = sortedDays.map(d => {
                        if (d === targetDay) {
                            return `<span class="inline-block bg-blue-600 text-white font-black text-[9px] px-2 py-0.5 rounded shadow-md transform scale-110 z-10 mx-[3px] border border-blue-800">${DAY_SHORTS[d]}</span>`;
                        }
                        return `<span class="day-pill opacity-60">${DAY_SHORTS[d]}</span>`;
                    }).join('');
                    
                    // IF CLASH DETECTED, SHOW RED BADGE
                    if(ent.hasClash) {
                        pillsHtml += `<span class="inline-block bg-rose-600 text-white font-black text-[8px] px-1.5 py-0.5 rounded shadow-sm animate-pulse ml-1 border border-rose-800" title="Teacher is booked in two places at once!">🚨 CLASH</span>`;
                    }

                    blockHtml += `
                        <div class="flex flex-col text-center pb-1">
                            <span style="color: ${subColor}" class="font-black text-[13px] uppercase leading-tight">${ent.subject || '-'}</span>
                            ${ent.teacher !== 'NONE' ? `
                                <div class="flex items-center justify-center gap-1 mt-0.5">
                                    <span class="text-[10px] font-bold text-emerald-600">${ent.teacher}</span>
                                    <button onclick="peekTeacher('${ent.teacher}')" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-full w-4 h-4 flex items-center justify-center text-[8px] font-black shadow-sm transition-colors" title="View Teacher Schedule">ℹ️</button>
                                </div>
                            ` : ''}
                          ${(ent.room && ent.room !== 'undefined') ? `<span class="text-[9px] font-bold text-slate-500 mt-0.5">RM: ${ent.room}</span>` : ''}
                            ${(ent.remark && ent.remark !== 'undefined') ? `<span class="text-[9px] font-bold italic text-amber-600 mt-0.5">(${ent.remark})</span>` : ''}
                            <div class="mt-2 flex justify-center flex-wrap items-center min-h-[18px]">
                                ${pillsHtml}
                            </div>
                        </div>
                    `;
                });

                blockHtml += `</div></div>`;
                finalHtml += blockHtml;
            });
            return finalHtml;
        }

        async function peekTeacher(teacherName) {
            const schedule = allTimetableData.filter(t => t.teacher === teacherName);
            const modal = document.getElementById('teacher-info-modal');
            const title = document.getElementById('ti-name');
            const content = document.getElementById('ti-content');
            
            title.innerText = teacherName;
            content.innerHTML = "";

            if(schedule.length === 0) {
                content.innerHTML = `<div class="text-center py-10"><div class="text-4xl mb-2">✨</div><div class="text-emerald-600 font-black uppercase tracking-widest text-sm">Fully Available</div><div class="text-slate-400 text-[10px] font-bold mt-1">No saved classes found in the system.</div></div>`;
                modal.classList.replace('hidden', 'flex');
                return;
            }

            DAYS_OF_WEEK.forEach(day => {
                const dayClasses = schedule.filter(s => s.day === day).sort((a,b) => a.start24.localeCompare(b.start24));
                if(dayClasses.length > 0) {
                    let dayHtml = `
                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4">
                        <div class="font-black text-slate-800 text-xs uppercase tracking-widest mb-3 flex items-center gap-2">
                            <span class="${day === TODAY_FULL ? 'bg-blue-600 text-white' : 'bg-indigo-100 text-indigo-700'} px-2 py-1 rounded shadow-sm">📍 ${day}</span>
                        </div>
                        <div class="space-y-2">`;
                    
                    dayClasses.forEach(c => {
                        dayHtml += `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white border border-slate-100 p-3 rounded-xl shadow-sm">
                                <div class="flex gap-3 items-center">
                                    <div class="bg-slate-800 text-white px-2 py-1 rounded text-[10px] font-black tracking-widest shrink-0 w-[140px] text-center">${format12Hour(c.start24)} - ${format12Hour(c.end24)}</div>
                                    <div class="font-bold text-slate-700 text-[11px] uppercase">${c.className} <span class="text-slate-300 mx-1">|</span> <span class="text-indigo-600">SEC ${c.section}</span></div>
                                </div>
                                <div class="font-black text-rose-600 text-[10px] uppercase tracking-widest mt-2 sm:mt-0 bg-rose-50 px-2 py-1 rounded shrink-0">${c.subject}</div>
                            </div>`;
                    });
                    dayHtml += `</div></div>`;
                    content.innerHTML += dayHtml;
                }
            });

            modal.classList.replace('hidden', 'flex');
        }

       function forceSync() {
            // Dynamically sweep and delete all cached timetable data
            Object.keys(localStorage).forEach(key => {
                if (key.includes('minerva_timetable') || key.includes('minerva_struct') || key.includes('minerva_teachers')) {
                    localStorage.removeItem(key);
                }
            });
            window.location.reload();
        }
        function format12Hour(time24) {
            if(!time24) return ""; let [h, m] = time24.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
        }
    </script>
