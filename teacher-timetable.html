<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Teacher Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        
        .tt-grid { display: flex; flex-wrap: wrap; gap: 16px; background: #f8fafc; padding: 16px; border-radius: 0 16px 16px 0; align-items: flex-start; min-height: 100px; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Responsive Sidebar: Top bar on mobile, Side bar on PC */
        .tt-sidebar { width: 100%; flex-shrink: 0; background: #0f172a; color: white; display: flex; flex-direction: row; align-items: center; justify-content: space-between; font-weight: 900; font-size: 14px; text-align: center; border-bottom: 4px solid #1e293b; padding: 12px 20px; }
        @media (min-width: 640px) { .tt-sidebar { width: 140px; flex-direction: column; justify-content: center; border-bottom: none; border-right: 4px solid #1e293b; padding: 10px; border-radius: 16px 0 0 16px; } }
        
        /* Responsive Blocks: Fit screen on mobile, Fixed size on PC */
        .time-block { flex-shrink: 0; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.2s; display: flex; flex-direction: column; overflow: hidden; }
        @media (min-width: 640px) { .time-block { width: 260px; } }
        
        .tb-header { background: #1e3a8a; color: white; padding: 8px; text-align: center; font-weight: 900; font-size: 12px; letter-spacing: 1px; }
        .tb-duration { background: #eff6ff; color: #1d4ed8; font-size: 9px; font-weight: 900; text-align: center; padding: 2px; text-transform: uppercase; }
        
        .day-pill { display: inline-block; background: #e0e7ff; color: #1e40af; font-size: 8px; font-weight: 900; padding: 2px 4px; border-radius: 4px; margin: 2px; }
        
        /* The Dimming Class for days not matching today */
        .dim-block { opacity: 0.45; filter: grayscale(40%); transition: all 0.3s ease; }
        .dim-block:hover { opacity: 1; filter: grayscale(0%); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.15); }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 p-4 sm:px-8 sm:py-5 flex flex-wrap justify-between items-center shadow-lg gap-3">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors shadow-md border border-indigo-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard
            </button>
            <div>
                <h1 class="text-sm sm:text-xl font-black uppercase text-white tracking-widest">Timetable Hub</h1>
                <p id="teacher-badge" class="text-[9px] sm:text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Loading...</p>
            </div>
        </div>
        
        <div class="flex gap-2">
            <button onclick="forceSync()" class="bg-indigo-900 hover:bg-indigo-800 text-indigo-200 px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[9px] transition-all shadow-inner border border-indigo-700">
                ↻ Sync
            </button>
            <button id="edit-master-btn" onclick="window.location.href='admin-timetable.html'" class="hidden bg-emerald-500 hover:bg-emerald-400 text-[#1e1b4b] px-5 py-2.5 rounded-xl font-black uppercase tracking-widest text-[10px] transition-all shadow-[0_0_15px_rgba(16,185,129,0.4)] active:scale-95">
                ✏️ Edit Master
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-8">
        
        <div class="flex justify-center gap-3 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-slate-200 max-w-fit mx-auto">
            <button id="btn-me" onclick="switchView('ME')" class="px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-indigo-600 text-white shadow-md">
                👤 My Timetable
            </button>
            <button id="btn-all" onclick="switchView('ALL')" class="px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-transparent text-slate-500 hover:bg-slate-100">
                🏫 Full School
            </button>
        </div>

        <div class="flex justify-between items-end mb-6 px-2">
            <div>
                <h2 id="view-title" class="text-2xl font-black text-slate-800 uppercase tracking-tighter">My Schedule</h2>
                <p id="view-subtitle" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Showing all sections where you are assigned.</p>
            </div>
            <div class="text-right">
                <span class="bg-amber-100 text-amber-800 font-black px-3 py-1.5 rounded-xl text-[10px] uppercase tracking-widest shadow-sm" id="today-badge">Today: Monday</span>
            </div>
        </div>

        <div id="timetable-container" class="space-y-8 min-h-[50vh]">
            <div class="text-center py-20 font-black text-slate-400 animate-pulse uppercase tracking-widest text-xs">Loading Smart Containers...</div>
        </div>

    </main>

    <div id="teacher-info-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-2xl shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-4 shrink-0">
                <div>
                    <h3 id="ti-name" class="font-black text-indigo-900 text-xl uppercase tracking-tighter">Teacher Name</h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Weekly Schedule Overview</p>
                </div>
                <button onclick="document.getElementById('teacher-info-modal').classList.replace('flex', 'hidden')" class="bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 w-8 h-8 rounded-full font-black flex items-center justify-center transition-colors">✕</button>
            </div>
            <div id="ti-content" class="overflow-y-auto space-y-4 pr-2"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let activeStaff = null;
        let safeName = "";
        let structureData = [];
        
        let myTimetableData = [];
        let allTimetableData = [];
        let currentMode = 'ME'; // 'ME' or 'ALL'

        const SPECIAL_SUBJECTS = ['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'];
        const DAYS_OF_WEEK = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const DAY_SHORTS = { 'Monday':'MON', 'Tuesday':'TUE', 'Wednesday':'WED', 'Thursday':'THU', 'Friday':'FRI', 'Saturday':'SAT', 'Sunday':'SUN' };
        
        const TODAY_FULL = DAYS_OF_WEEK[new Date().getDay()];
        let pinnedSections = new Set(); 

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');
            
            safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
            const safeDept = (activeStaff.dept && activeStaff.dept !== "undefined") ? activeStaff.dept : "General";
            
            document.getElementById('teacher-badge').innerText = `ID: ${safeName} | DEPT: ${safeDept}`;
            document.getElementById('today-badge').innerText = `TODAY: ${TODAY_FULL.toUpperCase()}`;

            // Reveal Edit Button if Admin or allowed
            try {
                const staffDoc = await db.collection("staff_applications").doc(activeStaff.uid).get();
                if (staffDoc.exists && staffDoc.data().canEditTimetable === true) {
                    const editBtn = document.getElementById('edit-master-btn');
                    editBtn.classList.remove('hidden');
                }
            } catch (err) { console.error("Auth check failed:", err); }

            await fetchStructure(); 
            await loadMyData(); // Load just their stuff first (fast & cheap)
            renderDashboard();
        };

        async function fetchStructure() {
            const cached = sessionStorage.getItem('minerva_struct');
            if (cached) {
                structureData = JSON.parse(cached);
            } else {
                const snap = await db.collection("institute_structure").orderBy("className").get();
                structureData = snap.docs.map(doc => doc.data());
                sessionStorage.setItem('minerva_struct', JSON.stringify(structureData));
            }
        }

        async function loadMyData() {
            const cacheKey = `tt_my_all_${safeName}`;
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                myTimetableData = JSON.parse(cached);
                return;
            }
            const snap = await db.collection("timetable").where("teacherName", "==", safeName).get();
            myTimetableData = snap.docs.map(d => d.data());
            sessionStorage.setItem(cacheKey, JSON.stringify(myTimetableData));
        }

        async function loadAllData() {
            const cacheKey = `minerva_timetable`; // Uses the exact same cache as Admin portal!
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                allTimetableData = JSON.parse(cached);
                return;
            }
            const snap = await db.collection("timetable").get();
            allTimetableData = snap.docs.map(d => d.data());
            sessionStorage.setItem(cacheKey, JSON.stringify(allTimetableData));
        }

        async function switchView(mode) {
            currentMode = mode;
            const btnMe = document.getElementById('btn-me');
            const btnAll = document.getElementById('btn-all');
            const title = document.getElementById('view-title');
            const sub = document.getElementById('view-subtitle');

            if(mode === 'ME') {
                btnMe.className = "px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-indigo-600 text-white shadow-md";
                btnAll.className = "px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-transparent text-slate-500 hover:bg-slate-100";
                title.innerText = "My Schedule";
                sub.innerText = "Showing all sections where you are assigned.";
                renderDashboard();
            } else {
                btnMe.className = "px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-transparent text-slate-500 hover:bg-slate-100";
                btnAll.className = "px-6 py-3 rounded-xl font-black uppercase tracking-widest text-[11px] transition-all bg-indigo-600 text-white shadow-md";
                title.innerText = "Full School Schedule";
                sub.innerText = "Showing the entire master timetable.";
                
                document.getElementById('timetable-container').innerHTML = `<div class="text-center py-20 font-black text-slate-400 animate-pulse uppercase tracking-widest text-xs">Downloading Master Data...</div>`;
                await loadAllData();
                renderDashboard();
            }
        }

        function togglePin(secId) {
            if(pinnedSections.has(secId)) pinnedSections.delete(secId);
            else pinnedSections.add(secId);
            renderDashboard(); 
        }

        function renderDashboard() {
            const container = document.getElementById('timetable-container');
            container.innerHTML = "";

            const datasetToUse = currentMode === 'ME' ? myTimetableData : allTimetableData;

            if(datasetToUse.length === 0) {
                container.innerHTML = `<div class="bg-white border-2 border-dashed border-slate-300 rounded-[2rem] p-16 text-center shadow-sm">
                    <div class="text-4xl mb-4">📭</div>
                    <h3 class="text-xl font-black text-slate-700 uppercase tracking-widest">No Classes Found</h3>
                    <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-2">You currently have no classes scheduled in the system.</p>
                </div>`;
                return;
            }

            const renderGroups = {};
            structureData.forEach(struct => {
                if(!renderGroups[struct.className]) renderGroups[struct.className] = {};
                renderGroups[struct.className][struct.sectionName] = []; 
            });

            // Put items in buckets
            datasetToUse.forEach(item => {
                if(renderGroups[item.className] && renderGroups[item.className][item.section]) {
                    renderGroups[item.className][item.section].push(item);
                }
            });

            // Pinned Board Setup
            let pinnedHtml = `
                <div class="bg-indigo-50 border-2 border-indigo-200 p-4 sm:p-6 rounded-[2.5rem] mb-10 shadow-md">
                    <div class="flex flex-wrap justify-between items-center mb-6 gap-4 border-b border-indigo-100 pb-4">
                        <h2 class="font-black text-indigo-900 uppercase tracking-widest flex items-center gap-3">
                            <span class="text-2xl bg-indigo-100 p-2 rounded-xl shadow-sm">📌</span> Pinned Board
                        </h2>
                    </div>
                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start w-full">`;
            let hasPinned = false;
            let normalHtml = "";

            Object.keys(renderGroups).sort().forEach(className => {
                // If it's "ME" mode, check if the ENTIRE class has any sections with data
                let classHasData = false;
                Object.keys(renderGroups[className]).forEach(sec => {
                    if(renderGroups[className][sec].length > 0) classHasData = true;
                });
                
                if (currentMode === 'ME' && !classHasData) return; // Skip rendering this class entirely if empty

                let groupHtml = `
                    <details class="bg-white shadow-lg rounded-[2rem] overflow-hidden border border-slate-200 class-group mb-8 group" open>
                        <summary class="bg-slate-800 text-white p-4 font-black text-[15px] uppercase tracking-[0.2em] shadow-inner cursor-pointer select-none flex justify-between items-center transition-colors hover:bg-slate-700 outline-none">
                            <span class="w-8"></span>
                            <span>${className}</span>
                            <span class="w-8 text-right opacity-50 group-open:rotate-180 transition-transform duration-300">▼</span>
                        </summary>
                        <div class="flex flex-col p-4 bg-slate-50 gap-4">`;
                
                let hasUnpinned = false;

                Object.keys(renderGroups[className]).sort().forEach(sectionName => {
                    const slots = renderGroups[className][sectionName];
                    if (currentMode === 'ME' && slots.length === 0) return; // Skip empty sections

                    const secId = `sec_${className.replace(/\s+/g, '')}_${sectionName.replace(/\s+/g, '')}`;
                    const isPinned = pinnedSections.has(secId);
                    
                    const pinBtn = `<button onclick="togglePin('${secId}')" class="mt-4 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest transition-all ${isPinned ? 'text-indigo-800 bg-indigo-200 hover:bg-indigo-300 shadow-md' : 'text-slate-500 bg-slate-200 hover:bg-slate-300'}">${isPinned ? '📍 Unpin' : '📌 Pin'}</button>`;
                    const gridStyle = isPinned ? 'flex-wrap: nowrap !important; overflow-x: auto; padding-bottom: 12px;' : '';

                    // MOBILE RESPONSIVENESS INCLUDED HERE (flex-col sm:flex-row)
                    const secHtml = `
                        <div class="flex flex-col sm:flex-row relative bg-white rounded-2xl shadow-sm border ${isPinned ? 'border-indigo-400 border-2 shadow-indigo-100 w-full' : 'border-slate-200'} overflow-hidden">
                            <div class="tt-sidebar ${isPinned ? '!bg-indigo-700 !border-indigo-800' : ''} shrink-0">
                                <div class="flex items-center gap-2 sm:block">
                                    <span class="opacity-50 text-[10px] tracking-widest block sm:mb-1">SEC</span>
                                    <span class="text-2xl tracking-tighter">${sectionName}</span>
                                </div>
                                ${pinBtn}
                            </div>
                            <div class="tt-grid flex-1" id="grid-${secId}" style="${gridStyle}">
                                ${generateTimeBlocksHTML(slots)}
                            </div>
                        </div>`;

                    if(isPinned) {
                        pinnedHtml += secHtml;
                        hasPinned = true;
                    } else {
                        groupHtml += secHtml;
                        hasUnpinned = true;
                    }
                });

                groupHtml += `</div></details>`;
                if(hasUnpinned) normalHtml += groupHtml;
            });

            pinnedHtml += `</div></div>`;
            container.innerHTML = (hasPinned ? pinnedHtml : '') + normalHtml;
        }

        // Transforms the raw slots into visually stunning HTML blocks
        function generateTimeBlocksHTML(slots) {
            const timeContainers = {}; 
            slots.forEach(slot => {
                const tKey = `${slot.start24}-${slot.end24}`;
                if(!timeContainers[tKey]) timeContainers[tKey] = { start24: slot.start24, end24: slot.end24, entries: [] };
                
                let existingEntry = timeContainers[tKey].entries.find(e => e.subject === slot.subject && e.teacher === slot.teacher && e.room === slot.room);
                if(existingEntry) {
                    if(!existingEntry.days.includes(slot.day)) existingEntry.days.push(slot.day);
                } else {
                    timeContainers[tKey].entries.push({ subject: slot.subject, teacher: slot.teacher, room: slot.room, remark: slot.remark, days: [slot.day] });
                }
            });

            let finalHtml = "";
            Object.values(timeContainers).sort((a,b) => a.start24.localeCompare(b.start24)).forEach(tc => {
                
                // DIMMING LOGIC: Does this block happen TODAY?
                let happensToday = false;
                tc.entries.forEach(ent => { if(ent.days.includes(TODAY_FULL)) happensToday = true; });
                const dimClass = happensToday ? '' : 'dim-block';

                // Duration Math
                let durStr = "SET TIME";
                if(tc.start24 && tc.end24) {
                    const [sh, sm] = tc.start24.split(':').map(Number); 
                    const [eh, em] = tc.end24.split(':').map(Number);
                    const mins = (eh * 60 + em) - (sh * 60 + sm);
                    if (!isNaN(mins) && mins > 0) durStr = `${mins} MINS`;
                }

                let blockHtml = `
                    <div class="time-block ${dimClass}">
                        <div class="tb-header">${format12Hour(tc.start24) || 'TBA'} - ${format12Hour(tc.end24) || 'TBA'}</div>
                        <div class="tb-duration">${durStr}</div>
                        <div class="flex flex-col flex-1 p-2 gap-2">
                `;

                tc.entries.forEach((ent, index) => {
                    if(index > 0) blockHtml += `<hr class="border-dashed border-slate-200">`;
                    
                    let subColor = '#e11d48'; 
                    if (SPECIAL_SUBJECTS.includes(ent.subject)) subColor = '#94a3b8';
                    if (ent.subject === 'EXAM' || ent.subject === 'EVENT') subColor = '#8b5cf6';
                    if (ent.subject.toUpperCase().includes('MATH')) subColor = '#047857';
                    if (ent.subject.toUpperCase().includes('PHYSICS')) subColor = '#1d4ed8';

                    // PILL HIGHLIGHTING LOGIC
                    const sortedDays = ent.days.sort((a,b) => DAYS_OF_WEEK.indexOf(a) - DAYS_OF_WEEK.indexOf(b));
                    const pillsHtml = sortedDays.map(d => {
                        if (d === TODAY_FULL) {
                            return `<span class="inline-block bg-blue-600 text-white font-black text-[9px] px-2 py-0.5 rounded shadow-md transform scale-110 z-10 mx-[3px] border border-blue-800">${DAY_SHORTS[d]}</span>`;
                        }
                        return `<span class="day-pill opacity-60">${DAY_SHORTS[d]}</span>`;
                    }).join('');

                    blockHtml += `
                        <div class="flex flex-col text-center pb-1">
                            <span style="color: ${subColor}" class="font-black text-[13px] uppercase leading-tight">${ent.subject || '-'}</span>
                            ${ent.teacher !== 'NONE' ? `
                                <div class="flex items-center justify-center gap-1 mt-0.5">
                                    <span class="text-[10px] font-bold text-emerald-600">${ent.teacher}</span>
                                    <button onclick="peekTeacher('${ent.teacher}')" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-full w-4 h-4 flex items-center justify-center text-[8px] font-black shadow-sm transition-colors" title="View Teacher Schedule">ℹ️</button>
                                </div>
                            ` : ''}
                            ${ent.room ? `<span class="text-[9px] font-bold text-slate-500 mt-0.5">RM: ${ent.room}</span>` : ''}
                            ${ent.remark ? `<span class="text-[9px] font-bold italic text-amber-600 mt-0.5">(${ent.remark})</span>` : ''}
                            <div class="mt-2 flex justify-center flex-wrap items-center min-h-[18px]">
                                ${pillsHtml}
                            </div>
                        </div>
                    `;
                });

                blockHtml += `</div></div>`;
                finalHtml += blockHtml;
            });
            return finalHtml;
        }

        // View-Only Teacher Info Popup
        async function peekTeacher(teacherName) {
            // Must fetch ALL data if we don't have it, to see other teacher's schedule safely
            if (allTimetableData.length === 0) {
                await loadAllData(); 
            }

            const schedule = allTimetableData.filter(t => t.teacher === teacherName);
            
            const modal = document.getElementById('teacher-info-modal');
            const title = document.getElementById('ti-name');
            const content = document.getElementById('ti-content');
            
            title.innerText = teacherName;
            content.innerHTML = "";

            if(schedule.length === 0) {
                content.innerHTML = `<div class="text-center py-10"><div class="text-4xl mb-2">✨</div><div class="text-emerald-600 font-black uppercase tracking-widest text-sm">Fully Available</div><div class="text-slate-400 text-[10px] font-bold mt-1">No saved classes found in the system.</div></div>`;
                modal.classList.replace('hidden', 'flex');
                return;
            }

            DAYS_OF_WEEK.forEach(day => {
                const dayClasses = schedule.filter(s => s.day === day).sort((a,b) => a.start24.localeCompare(b.start24));
                if(dayClasses.length > 0) {
                    let dayHtml = `
                    <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4">
                        <div class="font-black text-slate-800 text-xs uppercase tracking-widest mb-3 flex items-center gap-2">
                            <span class="${day === TODAY_FULL ? 'bg-blue-600 text-white' : 'bg-indigo-100 text-indigo-700'} px-2 py-1 rounded shadow-sm">📍 ${day}</span>
                        </div>
                        <div class="space-y-2">`;
                    
                    dayClasses.forEach(c => {
                        dayHtml += `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-white border border-slate-100 p-3 rounded-xl shadow-sm">
                                <div class="flex gap-3 items-center">
                                    <div class="bg-slate-800 text-white px-2 py-1 rounded text-[10px] font-black tracking-widest shrink-0 w-[140px] text-center">${format12Hour(c.start24)} - ${format12Hour(c.end24)}</div>
                                    <div class="font-bold text-slate-700 text-[11px] uppercase">${c.className} <span class="text-slate-300 mx-1">|</span> <span class="text-indigo-600">SEC ${c.section}</span></div>
                                </div>
                                <div class="font-black text-rose-600 text-[10px] uppercase tracking-widest mt-2 sm:mt-0 bg-rose-50 px-2 py-1 rounded shrink-0">${c.subject}</div>
                            </div>`;
                    });
                    dayHtml += `</div></div>`;
                    content.innerHTML += dayHtml;
                }
            });

            modal.classList.replace('hidden', 'flex');
        }

        function forceSync() {
            sessionStorage.removeItem('minerva_struct');
            sessionStorage.removeItem('minerva_timetable');
            sessionStorage.removeItem(`tt_my_all_${safeName}`);
            window.location.reload();
        }

        function format12Hour(time24) {
            if(!time24) return ""; let [h, m] = time24.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
        }
    </script>
</body>
</html>
