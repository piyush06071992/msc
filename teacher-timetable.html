<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Timetable Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] border-b border-indigo-900 sticky top-0 z-50 p-4 sm:px-8 sm:py-5 flex flex-wrap justify-between items-center shadow-lg gap-3">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='teacher-portal.html'" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-black uppercase tracking-widest text-[10px] transition-colors shadow-md border border-indigo-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard
            </button>
            <div>
                <h1 class="text-sm sm:text-xl font-black uppercase text-white tracking-widest">Timetable Management</h1>
                <p id="teacher-badge" class="text-[9px] sm:text-[10px] font-bold text-indigo-300 uppercase tracking-widest mt-1">Loading...</p>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-10 space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <div class="bg-emerald-50 border-2 border-emerald-200 rounded-[2rem] p-6 sm:p-8 flex flex-col justify-between shadow-sm">
                <div>
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-2xl mb-4">📅</div>
                    <h3 class="text-xl font-black text-emerald-900 uppercase tracking-tighter">My Schedule Today</h3>
                    <p class="text-[10px] font-bold text-emerald-600/80 uppercase tracking-widest mt-2 mb-6">Your personal classes for today</p>
                </div>
                <button onclick="fetchMyTimetable('today')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-black uppercase tracking-widest text-[11px] shadow-lg shadow-emerald-600/30 transition-all active:scale-95">View Today</button>
            </div>

            <div class="bg-blue-50 border-2 border-blue-200 rounded-[2rem] p-6 sm:p-8 flex flex-col justify-between shadow-sm">
                <div>
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-2xl mb-4">🗓️</div>
                    <h3 class="text-xl font-black text-blue-900 uppercase tracking-tighter">My Whole Week</h3>
                    <p class="text-[10px] font-bold text-blue-600/80 uppercase tracking-widest mt-2 mb-6">Your complete master schedule</p>
                </div>
                <button onclick="fetchMyTimetable('week')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-black uppercase tracking-widest text-[11px] shadow-lg shadow-blue-600/30 transition-all active:scale-95">View Entire Week</button>
            </div>

            <div class="bg-amber-50 border-2 border-amber-200 rounded-[2rem] p-6 sm:p-8 flex flex-col justify-between shadow-sm lg:col-span-1 md:col-span-2">
                <div>
                    <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-2xl mb-4">⭐</div>
                    <h3 class="text-xl font-black text-amber-900 uppercase tracking-tighter">Special Duties</h3>
                    <p class="text-[10px] font-bold text-amber-600/80 uppercase tracking-widest mt-2 mb-6">Invigilation, events, extra assignments</p>
                </div>
                <button onclick="fetchSpecialDuties()" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-4 rounded-xl font-black uppercase tracking-widest text-[11px] shadow-lg shadow-amber-500/30 transition-all active:scale-95">View Special Duties</button>
            </div>

            <div class="bg-white border-2 border-indigo-100 rounded-[2rem] p-6 sm:p-8 col-span-1 md:col-span-2 lg:col-span-3 shadow-md flex flex-col sm:flex-row gap-6 items-center">
                <div class="sm:w-1/3 w-full text-center sm:text-left">
                    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-2xl mb-4 mx-auto sm:mx-0">🔍</div>
                    <h3 class="text-xl font-black text-indigo-900 uppercase tracking-tighter">Class Lookup</h3>
                    <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mt-1">Search any section's timetable</p>
                </div>
                
                <div class="sm:w-2/3 w-full grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2 ml-1">Select Class</label>
                        <select id="tt-class-select" onchange="populateSections()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 transition-colors">
                            <option value="">-- Choose Class --</option>
                            </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2 ml-1">Select Section</label>
                        <select id="tt-section-select" disabled class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 transition-colors disabled:opacity-50">
                            <option value="">-- Choose Section --</option>
                            </select>
                    </div>
                    <div class="sm:col-span-2 flex gap-3 mt-2">
                        <button onclick="fetchClassTimetable('today')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-black uppercase tracking-widest text-[10px] shadow-md transition-all active:scale-95">View Today</button>
                        <button onclick="fetchClassTimetable('week')" class="flex-1 bg-indigo-900 hover:bg-indigo-800 text-white py-4 rounded-xl font-black uppercase tracking-widest text-[10px] shadow-md transition-all active:scale-95">View Whole Week</button>
                    </div>
                </div>
            </div>

        </div>

        <div id="timetable-results-area" class="hidden mt-8 bg-slate-100/50 p-6 sm:p-10 rounded-[3rem] border border-slate-200 shadow-inner">
            <div class="flex justify-between items-center mb-8">
                <h2 id="results-title" class="text-2xl sm:text-3xl font-black text-slate-900 uppercase tracking-tighter">Results</h2>
                <button onclick="document.getElementById('timetable-results-area').classList.add('hidden')" class="text-[10px] font-black text-rose-500 uppercase tracking-widest bg-rose-100 px-5 py-2.5 rounded-xl hover:bg-rose-200 transition-colors shadow-sm">Clear Results</button>
            </div>
            
            <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>

    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let activeStaff = null;
        let structureData = []; 
        let safeName = "";

        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        window.onload = async () => {
            activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');
            
            safeName = (activeStaff.name && activeStaff.name !== "undefined") ? activeStaff.name : activeStaff.email;
            const safeDept = (activeStaff.dept && activeStaff.dept !== "undefined") ? activeStaff.dept : "General";
            
            document.getElementById('teacher-badge').innerText = `ID: ${safeName} | DEPT: ${safeDept}`;

            await fetchStructure(); 
        };

        // 1. Load Dropdowns
        async function fetchStructure() {
            try {
                const snap = await db.collection("institute_structure").get();
                structureData = snap.docs.map(doc => doc.data());
                
                const classes = [...new Set(structureData.map(s => s.className))].sort();
                const classSelect = document.getElementById('tt-class-select');
                classes.forEach(c => classSelect.innerHTML += `<option value="${c}">${c}</option>`);
            } catch(e) { console.error("Error loading classes:", e); }
        }

        function populateSections() {
            const classVal = document.getElementById('tt-class-select').value;
            const secSelect = document.getElementById('tt-section-select');
            secSelect.innerHTML = '<option value="">-- Choose Section --</option>';
            
            if(!classVal) { secSelect.disabled = true; return; }
            
            secSelect.disabled = false;
            const sections = structureData.filter(s => s.className === classVal).map(s => s.sectionName).sort();
            sections.forEach(s => secSelect.innerHTML += `<option value="${s}">${s}</option>`);
        }

        // Helper to get current day dynamically
        function getTodayString() { return daysOfWeek[new Date().getDay()]; }

        // 2. Render Cards Engine
        function renderCards(dataList, title) {
            const area = document.getElementById('timetable-results-area');
            const grid = document.getElementById('results-grid');
            document.getElementById('results-title').innerText = title;
            area.classList.remove('hidden');
            grid.innerHTML = '';

            if(dataList.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 font-bold uppercase tracking-widest text-[11px] border-2 border-dashed border-slate-300 rounded-[2rem] bg-white">No schedules found for this selection.</div>`;
                return;
            }

            // Sort logically by Time (AM/PM string conversion)
            dataList.sort((a, b) => {
                const timeA = a.timeRange ? a.timeRange.split(' - ')[0] : '12:00 AM';
                const timeB = b.timeRange ? b.timeRange.split(' - ')[0] : '12:00 AM';
                return new Date('1970/01/01 ' + timeA) - new Date('1970/01/01 ' + timeB);
            });

            dataList.forEach(item => {
                // Handle different card colors based on duty vs class
                let bgColors = item.isDuty ? 'bg-[#fffbeb] border-amber-200 hover:border-amber-400' : 'bg-white border-indigo-100 hover:border-indigo-400';
                let titleColor = item.isDuty ? 'text-amber-900' : 'text-slate-900';
                let tagBg = item.isDuty ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-indigo-50 text-indigo-700 border-indigo-200';
                
                grid.innerHTML += `
                    <div class="${bgColors} border-2 rounded-[2rem] p-6 sm:p-8 shadow-sm hover:shadow-xl transition-all group flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-6">
                                <div>
                                    <h3 class="text-xl font-black ${titleColor} uppercase tracking-tighter truncate w-40 sm:w-48" title="${item.subject || item.title}">${item.subject || item.title || 'Duty'}</h3>
                                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">${item.className || 'Special'} ${item.section ? '| ' + item.section : ''}</p>
                                </div>
                                <span class="${tagBg} border px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-widest shadow-sm shrink-0">${item.day || 'Any'}</span>
                            </div>
                            
                            <div class="flex justify-between items-center pt-5 border-t border-slate-200/60">
                                <span class="text-[10px] font-black text-slate-700 uppercase tracking-widest bg-white/50 px-3 py-1.5 rounded-lg border border-slate-200">🕒 ${item.timeRange || '--'}</span>
                                <span class="text-[10px] font-black ${item.duration ? 'text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100' : 'text-slate-400'} uppercase tracking-widest">${item.duration ? item.duration + ' Mins' : '--'}</span>
                            </div>
                        </div>
                        
                        <div class="mt-6 pt-5 border-t border-slate-200/60 text-[9px] font-bold text-slate-500 uppercase tracking-widest flex justify-between items-center">
                            <span>By: <span class="text-slate-900 font-black">${item.teacherName || '--'}</span></span>
                            <span>Room: <span class="text-slate-900 font-black">${item.room || '--'}</span></span>
                        </div>
                    </div>
                `;
            });
            
            // Removed the forced auto-scroll so the screen stays exactly where you clicked!
        }

        // 3. Fetching Logic
        async function fetchMyTimetable(span) {
            try {
                let query = db.collection("timetable").where("teacherName", "==", safeName);
                if (span === 'today') query = query.where("day", "==", getTodayString());
                
                const snap = await query.get();
                const data = snap.docs.map(d => d.data());
                renderCards(data, span === 'today' ? "My Schedule Today" : "My Whole Week Schedule");
            } catch(e) { alert("Error fetching data"); console.error(e); }
        }

        async function fetchClassTimetable(span) {
            const cls = document.getElementById('tt-class-select').value;
            const sec = document.getElementById('tt-section-select').value;
            
            if(!cls || !sec) return alert("Please select both Class and Section first.");

            try {
                let query = db.collection("timetable").where("className", "==", cls).where("section", "==", sec);
                if (span === 'today') query = query.where("day", "==", getTodayString());

                const snap = await query.get();
                const data = snap.docs.map(d => d.data());
                renderCards(data, `${cls} | ${sec} - ${span === 'today' ? "Today" : "Whole Week"}`);
            } catch(e) { alert("Error fetching class data"); console.error(e); }
        }

        async function fetchSpecialDuties() {
            try {
                 const snap = await db.collection("timetable").where("teacherName", "==", safeName).where("isDuty", "==", true).get();
                 const data = snap.docs.map(d => d.data());
                 renderCards(data, "My Special Assigned Duties");
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
