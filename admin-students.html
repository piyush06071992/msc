<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Student Database</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20 relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-72 sm:w-96 h-72 sm:h-96 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-72 sm:w-96 h-72 sm:h-96 bg-emerald-100 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    </div>

    <header class="h-20 bg-white/90 backdrop-blur-md border-b border-slate-200 flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div>
                <h1 class="text-xl font-black text-slate-800 tracking-tight leading-none uppercase">Student Database</h1>
                <select id="global-center-switch" onchange="switchAdminCenter(this.value)" class="text-[10px] font-black text-sky-700 bg-sky-50 border border-sky-200 outline-none rounded px-2 py-0.5 mt-1 cursor-pointer uppercase tracking-widest shadow-sm">
                    <option value="GHUMARWIN">📍 Ghumarwin</option>
                    <option value="DHARAMSHALA">📍 Dharamshala</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 sm:p-8 relative z-10">
        <div id="classes-container" class="space-y-12">
            <div class="text-center py-20 text-slate-300 font-bold uppercase text-xs animate-pulse tracking-widest">
                Loading Institute Structure...
            </div>
        </div>
    </main>

   <div id="add-student-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 bg-blue-50 border-b border-blue-100 flex justify-between items-start shrink-0">
                <div>
                    <h3 class="font-black text-blue-900 text-xl uppercase tracking-tighter leading-none">Add Students</h3>
                    <p id="add-student-modal-target" class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mt-1.5 bg-white px-2 py-0.5 rounded shadow-sm inline-block"></p>
                </div>
                <button onclick="closeAddStudentModal()" class="text-blue-400 hover:text-rose-500 bg-white hover:bg-rose-50 w-10 h-10 rounded-full font-black transition-colors flex items-center justify-center shadow-sm shrink-0">✕</button>
            </div>
            
            <div class="p-10 text-center bg-white">
                <span class="text-5xl mb-4 block animate-pulse">🚧</span>
                <h4 class="font-black text-slate-700 uppercase tracking-widest text-sm">Ready for Data Entry</h4>
                <p class="text-xs text-slate-500 font-bold mt-2">Let me know how you want to input students (e.g., Manual forms, Excel CSV upload, etc.)</p>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- MULTI-CENTER DYNAMIC DB ROUTER ---
        let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
        sessionStorage.setItem('minervaAdminCenter', activeCenter);

        // --- SECURITY GUARD & AUTO-ROUTER ---
        const isAdmin = sessionStorage.getItem('minervaAdminAuth') === 'true';
        async function checkPermission() {
            if (isAdmin) {
                document.getElementById('global-center-switch').value = activeCenter;
                return; 
            }
            
            const activeStaff = JSON.parse(localStorage.getItem('minervaActiveStaff'));
            if (!activeStaff) return window.location.replace('staff-login.html');
            
            try {
                // Determine authorization based on staff application rules (adjust field name if needed)
                const snap = await db.collection("staff_applications").where("email", "==", activeStaff.email).get();
                if (snap.empty) throw new Error("No profile");
                
                const staffData = snap.docs[0].data();
                const authLevel = staffData.canManageStudents || staffData.canEditTimetable; // Fallback to timetable auth for now
                
                if (!authLevel) {
                    alert("Unauthorized Access. Redirecting...");
                    return window.location.replace('teacher-portal.html');
                }

                if (authLevel !== true && authLevel !== activeCenter) {
                    sessionStorage.setItem('minervaAdminCenter', authLevel);
                    window.location.reload(); 
                    return; 
                }

                const dropdown = document.getElementById('global-center-switch');
                if (dropdown && authLevel !== true) {
                    dropdown.disabled = true;
                    dropdown.className = "text-[10px] font-black text-slate-400 bg-slate-100 border border-slate-200 outline-none rounded px-2 py-0.5 mt-1 uppercase tracking-widest cursor-not-allowed";
                    dropdown.title = "Restricted to your authorized branch";
                }
                
                document.getElementById('global-center-switch').value = activeCenter;

            } catch (e) {
                alert("Auth Error. Redirecting...");
                window.location.replace('teacher-portal.html');
            }
        }

        function getCollection(name) {
            const globalCollections = ['configs', 'staff_applications'];
            if (globalCollections.includes(name)) return db.collection(name);
            
            if (activeCenter === "GHUMARWIN") return db.collection(name);
            return db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        function switchAdminCenter(centerName) {
            sessionStorage.setItem('minervaAdminCenter', centerName);
            window.location.reload();
        }

        const THEMES = [
            { text: 'text-blue-600', bg: 'bg-blue-50', border: 'border-blue-100', hover: 'hover:border-blue-300 hover:shadow-blue-500/10' },
            { text: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-100', hover: 'hover:border-emerald-300 hover:shadow-emerald-500/10' },
            { text: 'text-purple-600', bg: 'bg-purple-50', border: 'border-purple-100', hover: 'hover:border-purple-300 hover:shadow-purple-500/10' },
            { text: 'text-amber-600', bg: 'bg-amber-50', border: 'border-amber-100', hover: 'hover:border-amber-300 hover:shadow-amber-500/10' },
            { text: 'text-rose-600', bg: 'bg-rose-50', border: 'border-rose-100', hover: 'hover:border-rose-300 hover:shadow-rose-500/10' },
            { text: 'text-teal-600', bg: 'bg-teal-50', border: 'border-teal-100', hover: 'hover:border-teal-300 hover:shadow-teal-500/10' }
        ];

        async function init() {
            await checkPermission();
            await loadStructureAndStudents();
        }

        async function loadStructureAndStudents() {
            const container = document.getElementById('classes-container');
            
            try {
                // Fetch the structure to map out the cards
                const structSnap = await getCollection("institute_structure").orderBy("className").get();
                
                if (structSnap.empty) {
                    container.innerHTML = `<div class="py-20 text-center text-slate-400 font-bold uppercase text-[10px] tracking-widest border-2 border-dashed border-slate-200 rounded-3xl">No Classes Configured Yet</div>`;
                    return;
                }

                // Group structure by Class Name
                const groupedData = {};
                structSnap.forEach(doc => {
                    const data = doc.data();
                    if (!groupedData[data.className]) groupedData[data.className] = [];
                    groupedData[data.className].push({ id: doc.id, ...data });
                });

                container.innerHTML = "";
                let themeIndex = 0;
                
                Object.keys(groupedData).sort().forEach(className => {
                    const theme = THEMES[themeIndex % THEMES.length];
                    const sections = groupedData[className].sort((a,b) => a.sectionName.localeCompare(b.sectionName));

                    let groupHtml = `
                        <div class="mb-10">
                            <h2 class="text-2xl font-black text-slate-800 mb-6 uppercase tracking-tighter flex items-center gap-3">
                                <span class="w-3 h-8 rounded-full ${theme.bg} border ${theme.border}"></span>
                                ${className}
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                    `;

                    sections.forEach(sec => {
                        // Placeholder metric: 0 Students until we wire up the real database
                        const studentCount = 0; 
                        
                        groupHtml += `
                            <div class="glass p-6 rounded-[2rem] border-2 border-slate-100 shadow-sm relative group transition-all ${theme.hover} hover:shadow-lg flex flex-col justify-between min-h-[160px] bg-white">
                                
                                <div>
                                    <div class="flex justify-between items-start mb-2">
                                        <h3 class="text-2xl font-black text-slate-900 tracking-tighter leading-none">Sec ${sec.sectionName}</h3>
                                        <span class="${theme.bg} ${theme.text} px-3 py-1 rounded-lg text-[10px] font-black tracking-widest uppercase border ${theme.border} shadow-sm shrink-0">
                                            ${studentCount} Students
                                        </span>
                                    </div>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2 truncate">
                                        ${sec.subjects ? sec.subjects.length : 0} Subjects Configured
                                    </p>
                                </div>
                                
                               <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                                        <button onclick="viewStudents('${sec.className}', '${sec.sectionName}')" class="text-[11px] font-black text-slate-500 uppercase tracking-widest hover:${theme.text} transition-colors flex items-center gap-2 group-hover:translate-x-1 duration-300">
                                            View Register <span>➔</span>
                                        </button>
                                        <button onclick="openAddStudentModal('${sec.className}', '${sec.sectionName}')" class="bg-slate-900 hover:bg-blue-600 text-white px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest shadow-md transition-all active:scale-95 flex items-center gap-1.5">
                                            <span class="text-xs">🎓</span> + Add
                                        </button>
                                    </div>
                                
                            </div>
                        `;
                    });

                    groupHtml += `</div></div>`;
                    container.innerHTML += groupHtml;
                    themeIndex++; 
                });

            } catch (error) {
                console.error("Error loading structure:", error);
                container.innerHTML = `<div class="py-20 text-center text-rose-500 font-bold uppercase text-[10px] tracking-widest">Error fetching class structure.</div>`;
            }
        }

       // Placeholder Functions for next steps
        function openAddStudentModal(className, sectionName) {
            document.getElementById('add-student-modal-target').innerText = `${className} | Sec ${sectionName}`;
            document.getElementById('add-student-modal').classList.replace('hidden', 'flex');
        }

        function closeAddStudentModal() {
            document.getElementById('add-student-modal').classList.replace('flex', 'hidden');
        }

        function viewStudents(className, sectionName) {
            alert(`Ready to open Student Register for: \nClass: ${className}\nSection: ${sectionName}\n\n(Waiting for logic instructions!)`);
        }

        init();
    </script>
</body>
</html>
