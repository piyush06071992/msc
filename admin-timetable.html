<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Master Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .tt-grid { display: flex; overflow-x: auto; gap: 16px; background: #f8fafc; padding: 16px; border-radius: 0 16px 16px 0; align-items: flex-start; min-height: 150px; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tt-sidebar { width: 140px; flex-shrink: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; text-align: center; border-right: 4px solid #1e293b; padding: 10px; border-radius: 16px 0 0 16px; }
        
        .time-block { flex-shrink: 0; width: 260px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.2s; display: flex; flex-col; overflow: hidden; }
        .time-block:hover { border-color: #94a3b8; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        .tb-header { background: #1e3a8a; color: white; padding: 8px; text-align: center; font-weight: 900; font-size: 12px; letter-spacing: 1px; }
        .tb-duration { background: #eff6ff; color: #1d4ed8; font-size: 9px; font-weight: 900; text-align: center; padding: 2px; text-transform: uppercase; }
        
        .day-pill { display: inline-block; background: #e0e7ff; color: #1e40af; font-size: 8px; font-weight: 900; padding: 2px 4px; border-radius: 4px; margin: 1px; }
        .day-tick { accent-color: #2563eb; width: 14px; height: 14px; cursor: pointer; }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body > *:not(#print-render-area) { display: none !important; }
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #print-render-area { display: block !important; position: relative !important; visibility: visible !important; width: 100%; font-family: 'Arial', sans-serif; }
            .page-break { page-break-inside: auto; margin-bottom: 20px; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-200 min-h-screen font-sans pb-20">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm no-print">
        <div class="flex items-center gap-4">
          <button id="dynamic-back-btn" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black text-slate-800 uppercase tracking-tighter">Timetable Editor</h1>
        </div>
        
        <div class="flex gap-2 items-center">
            <button onclick="saveAllChanges()" id="save-btn" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-black text-[11px] uppercase tracking-widest shadow-md hover:bg-blue-500 transition-all mr-4 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Save All Changes
            </button>
            
            <button onclick="openPrintModal()" class="bg-emerald-600 text-white px-5 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-emerald-500 transition-all">
                🖨️ Export
            </button>
           <button id="auth-btn" onclick="window.location.href='admin-timetable-auth.html'" class="hidden bg-indigo-600 text-white px-5 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-indigo-500 transition-all ml-2" title="Manage Staff Permissions">
    🔐 Delegations
</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 overflow-hidden transition-all duration-300 no-print" id="main-content">
        <div id="timetable-container" class="space-y-8">
            <div class="text-center py-20 font-black text-slate-400 animate-pulse uppercase tracking-widest text-xs">Loading Smart Containers...</div>
        </div>
    </main>

    <div id="print-render-area" class="hidden print:block"></div>

    <div id="export-preview-modal" class="fixed inset-0 bg-slate-900/70 z-[200] hidden flex-col items-center justify-center p-4 no-print">
        <div class="bg-white rounded-3xl p-6 w-full max-w-7xl shadow-2xl flex flex-col h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <h3 class="font-black text-slate-900 text-2xl uppercase tracking-tighter">Timetable Preview</h3>
                <div class="flex gap-3">
                    <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                        <span>📊</span> Download Excel
                    </button>
                    <button onclick="executeBrowserPrint()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                        <span>🖨️</span> Save PDF / Print
                    </button>
                    <button onclick="closeExportPreview()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-3 rounded-xl font-black uppercase tracking-widest text-xs transition-all">
                        ✕ Close
                    </button>
                </div>
            </div>
            <div id="export-table-wrapper" class="flex-1"></div>
        </div>
    </div>

    <div id="print-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl">
            <h3 class="font-black text-slate-900 text-xl uppercase mb-6 border-b pb-4">Export Options</h3>
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Scope</label>
                    <select id="p-scope" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer">
                        <option value="ALL">Entire Institute</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Matrix Layout</label>
                    <select id="p-timeframe" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer text-blue-700">
                        <option value="WEEK">Horizontal Matrix (Full Week Stacked)</option>
                        <option value="DAY">Horizontal Matrix (Single Day)</option>
                    </select>
                </div>
                <div id="print-day-wrapper" class="hidden">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Select Day</label>
                    <select id="p-day" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer text-blue-700">
                        <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('print-modal').classList.replace('flex', 'hidden')" class="flex-1 py-3 bg-slate-100 text-slate-600 font-black rounded-xl text-[10px] uppercase">Cancel</button>
                <button onclick="generateExportData()" id="print-exec-btn" class="flex-1 py-3 bg-blue-600 text-white font-black rounded-xl text-[10px] uppercase shadow-md">Generate Layout</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];
        let allTeachers = [];
        let globalTimetable = []; 
        let oldTimetableState = []; 
        
        const SPECIAL_SUBJECTS = ['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'];
        const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const DAY_SHORTS = { 'Monday':'M', 'Tuesday':'T', 'Wednesday':'W', 'Thursday':'Th', 'Friday':'F', 'Saturday':'S' };

        document.getElementById('p-timeframe').addEventListener('change', function() {
            document.getElementById('print-day-wrapper').style.display = this.value === 'DAY' ? 'block' : 'none';
        });

   async function init() {
    // 1. Bulletproof Back Button (Uses natural browser history!)
    const backBtn = document.getElementById('dynamic-back-btn');
    if(backBtn) {
        backBtn.onclick = () => {
            window.history.back();
        };
    }

    // 2. Show Delegations button ONLY if it is the Admin
    const isAdmin = sessionStorage.getItem('minervaAdminAuth') === 'true';
    const authBtn = document.getElementById('auth-btn');
    if (isAdmin && authBtn) {
        authBtn.classList.remove('hidden');
    }

    // 3. Load the rest of the timetable
    await Promise.all([fetchStructure(), fetchTeachers()]);
    await fetchTimetable();
    renderDirectDashboard();
}

        async function fetchStructure() {
            const snap = await db.collection("institute_structure").orderBy("className").get();
            structureData = snap.docs.map(d => d.data());
            
            const pScope = document.getElementById('p-scope');
            if(pScope) {
                pScope.innerHTML = '<option value="ALL">Entire Institute</option>';
                const grouped = {};
                structureData.forEach(s => {
                    if(!grouped[s.className]) grouped[s.className] = [];
                    grouped[s.className].push(s.sectionName);
                });
                Object.keys(grouped).forEach(c => {
                    let optGroup = `<optgroup label="${c}">`;
                    optGroup += `<option value="CLASS|${c}">Entire ${c}</option>`;
                    grouped[c].sort().forEach(sec => { optGroup += `<option value="SEC|${c}|${sec}">Section ${sec} Only</option>`; });
                    optGroup += `</optgroup>`;
                    pScope.innerHTML += optGroup;
                });
            }
        }

        async function fetchTeachers() {
            const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
            allTeachers = snap.docs.map(doc => {
                const data = doc.data();
                const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                return { name: nameKey ? data.details[nameKey] : data.email, email: data.email, dept: deptKey ? data.details[deptKey] : 'General' };
            });
        }

        async function fetchTimetable() {
            const snap = await db.collection("timetable").get();
            globalTimetable = snap.docs.map(d => ({id: d.id, ...d.data()}));
            oldTimetableState = JSON.parse(JSON.stringify(globalTimetable)); 
        }

        // ============================================================================
        // === SMART CONTAINER UI RENDERER                                          ===
        // ============================================================================
        function renderDirectDashboard() {
            const container = document.getElementById('timetable-container');
            container.innerHTML = "";

            const renderGroups = {};
            structureData.forEach(struct => {
                if(!renderGroups[struct.className]) renderGroups[struct.className] = {};
                renderGroups[struct.className][struct.sectionName] = []; 
            });

            globalTimetable.forEach(item => {
                if(renderGroups[item.className] && renderGroups[item.className][item.section]) {
                    renderGroups[item.className][item.section].push(item);
                }
            });

            Object.keys(renderGroups).sort().forEach(className => {
                let groupHtml = `
                    <div class="bg-white shadow-xl rounded-[2rem] overflow-hidden border border-slate-200 class-group mb-10">
                        <div class="bg-blue-900 text-white p-4 text-center font-black text-[16px] uppercase tracking-[0.3em] shadow-inner">${className}</div>
                        <div class="flex flex-col p-4 bg-slate-50 gap-4">`;
                
                Object.keys(renderGroups[className]).sort().forEach(sectionName => {
                    const secId = `sec_${className.replace(/\s+/g, '')}_${sectionName.replace(/\s+/g, '')}`;
                    
                    groupHtml += `
                        <div class="flex relative bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="tt-sidebar">
                                <span class="opacity-50 text-[10px] tracking-widest block mb-1">SEC</span>
                                <span class="text-2xl tracking-tighter">${sectionName}</span>
                            </div>
                            <div class="tt-grid flex-1" id="grid-${secId}">
                                <button id="add-btn-${secId}" onclick="addSmartBlock('${className}', '${sectionName}', '${secId}')" class="shrink-0 flex items-center justify-center w-[200px] border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 hover:bg-white hover:border-blue-400 hover:text-blue-600 text-slate-400 cursor-pointer transition-all shadow-inner my-2">
                                    <span class="font-black text-[13px] uppercase tracking-widest">+ Add Slot</span>
                                </button>
                            </div>
                        </div>`;
                });
                groupHtml += `</div></div>`;
                container.innerHTML += groupHtml;

                Object.keys(renderGroups[className]).forEach(sectionName => {
                    const secId = `sec_${className.replace(/\s+/g, '')}_${sectionName.replace(/\s+/g, '')}`;
                    const slots = renderGroups[className][sectionName];
                    
                    const timeContainers = {}; 
                    slots.forEach(slot => {
                        const tKey = `${slot.start24}-${slot.end24}`;
                        if(!timeContainers[tKey]) timeContainers[tKey] = { start24: slot.start24, end24: slot.end24, entries: [] };
                        
                        let existingEntry = timeContainers[tKey].entries.find(e => e.subject === slot.subject && e.teacher === slot.teacher && e.room === slot.room);
                        if(existingEntry) {
                            if(!existingEntry.days.includes(slot.day)) existingEntry.days.push(slot.day);
                        } else {
                            timeContainers[tKey].entries.push({ id: Math.random().toString(36).substr(2,9), subject: slot.subject, teacher: slot.teacher, room: slot.room, remark: slot.remark, days: [slot.day] });
                        }
                    });

                    Object.values(timeContainers).sort((a,b) => a.start24.localeCompare(b.start24)).forEach(tc => {
                        injectSmartBlock(className, sectionName, secId, tc);
                    });
                });
            });
            
            checkGlobalClash();
        }

        function addSmartBlock(className, sectionName, secId) {
            injectSmartBlock(className, sectionName, secId, {
                start24: "", end24: "",
                entries: [{ id: Math.random().toString(36).substr(2,9), subject: "BREAK", teacher: "NONE", room: "", remark: "", days: DAYS_OF_WEEK }]
            }, true); 
            sortSectionBlocks(secId);
        }

        function injectSmartBlock(className, sectionName, secId, blockData, autoEdit = false) {
            const grid = document.getElementById('grid-' + secId);
            const blockId = 'tb_' + Date.now() + Math.random().toString(36).substr(2, 9);
            
            const div = document.createElement('div');
            div.className = "time-block flex flex-col";
            div.id = blockId;
            div.setAttribute('data-class', className);
            div.setAttribute('data-section', sectionName);
            div.setAttribute('data-s24', blockData.start24);

            div.innerHTML = `
                <div class="read-view flex flex-col h-full cursor-pointer hover:bg-slate-50 transition-colors ${autoEdit ? 'hidden' : ''}" onclick="toggleEditMode('${blockId}', true)" title="Click to Edit">
                    ${generateReadHTML(blockData)}
                </div>
                
                <div class="edit-view flex flex-col h-full bg-blue-50/30 ${autoEdit ? '' : 'hidden'}">
                    <div class="bg-slate-800 p-2 flex justify-between items-center gap-2">
                        <input type="time" class="tb-s24 text-[11px] font-black text-slate-800 bg-white rounded px-1 w-full text-center outline-none" value="${blockData.start24}" onchange="updateBlockData('${blockId}')">
                        <span class="text-[9px] font-black text-slate-400 uppercase">To</span>
                        <input type="time" class="tb-e24 text-[11px] font-black text-slate-800 bg-white rounded px-1 w-full text-center outline-none" value="${blockData.end24}" onchange="updateBlockData('${blockId}')">
                    </div>
                    
                    <div class="entries-wrapper flex flex-col gap-2 p-2"></div>
                    
                    <div class="p-2 border-t border-slate-200 flex flex-col gap-2 bg-slate-50 mt-auto">
                        <button onclick="addEntryToBlock('${blockId}', '${className}', '${sectionName}')" class="text-[10px] font-black text-indigo-600 bg-indigo-50 border border-indigo-200 py-1.5 rounded-lg uppercase tracking-widest hover:bg-indigo-100 transition-colors">+ Add Split Subject</button>
                        <div class="flex gap-2">
                            <button onclick="deleteBlock('${blockId}')" class="text-[10px] font-black text-rose-500 bg-white border border-rose-200 py-1.5 px-3 rounded-lg uppercase hover:bg-rose-50 transition-colors">🗑️ Delete</button>
                            <button onclick="cancelEditMode('${blockId}')" class="text-[10px] font-black text-slate-500 bg-white border border-slate-200 py-1.5 px-3 rounded-lg uppercase hover:bg-slate-50 transition-colors">Cancel</button>
                            <button onclick="toggleEditMode('${blockId}', false)" class="flex-1 text-[10px] font-black text-white bg-blue-600 py-1.5 rounded-lg uppercase tracking-widest hover:bg-blue-500 shadow-sm transition-colors">✓ Done</button>
                        </div>
                    </div>
                </div>
            `;
            
            const addBtn = document.getElementById('add-btn-' + secId);
            grid.insertBefore(div, addBtn);
            
            blockData.entries.forEach(ent => {
                addEntryToBlock(blockId, className, sectionName, ent);
            });
        }

        function generateReadHTML(blockData) {
            let durStr = "-- MINS";
            if(blockData.start24 && blockData.end24) {
                const [sh, sm] = blockData.start24.split(':').map(Number); const [eh, em] = blockData.end24.split(':').map(Number);
                durStr = `${(eh * 60 + em) - (sh * 60 + sm)} MINS`;
            }
            
            let html = `
                <div class="tb-header">${format12Hour(blockData.start24) || 'TBA'} - ${format12Hour(blockData.end24) || 'TBA'}</div>
                <div class="tb-duration">${durStr}</div>
                <div class="flex flex-col flex-1 p-2 gap-2">
            `;
            
            blockData.entries.forEach((ent, index) => {
                if(index > 0) html += `<hr class="border-dashed border-slate-200">`;
                
                let subColor = '#e11d48'; 
                if (SPECIAL_SUBJECTS.includes(ent.subject)) subColor = '#94a3b8';
                if (ent.subject === 'EXAM' || ent.subject === 'EVENT') subColor = '#8b5cf6';
                if (ent.subject.toUpperCase().includes('MATH')) subColor = '#047857';
                if (ent.subject.toUpperCase().includes('PHYSICS')) subColor = '#1d4ed8';

                html += `
                    <div class="flex flex-col text-center">
                        <span style="color: ${subColor}" class="font-black text-[13px] uppercase leading-tight">${ent.subject || '-'}</span>
                        ${ent.teacher !== 'NONE' ? `<span class="text-[10px] font-bold text-emerald-600 mt-0.5">${ent.teacher}</span>` : ''}
                        ${ent.room ? `<span class="text-[9px] font-bold text-slate-500">RM: ${ent.room}</span>` : ''}
                        ${ent.remark ? `<span class="text-[9px] font-bold italic text-amber-600">(${ent.remark})</span>` : ''}
                        <div class="mt-1 flex justify-center flex-wrap gap-[2px]">
                            ${ent.days.map(d => `<span class="day-pill">${DAY_SHORTS[d]}</span>`).join('')}
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            html += `<div class="read-warn hidden bg-red-600 text-white text-[9px] font-black py-1 px-2 text-center animate-pulse tracking-widest uppercase"></div>`;
            
            return html;
        }

        function addEntryToBlock(blockId, className, sectionName, entryData = null) {
            const wrapper = document.querySelector(`#${blockId} .entries-wrapper`);
            const entId = 'ent_' + Math.random().toString(36).substr(2, 9);
            
            if(!entryData) {
                entryData = { subject: "", teacher: "NONE", room: "", remark: "", days: DAYS_OF_WEEK };
            }

            const struct = structureData.find(s => s.className === className && s.sectionName === sectionName);
            const validSubjects = struct ? struct.subjects : [];
            let subOptions = `<option value="BREAK">BREAK</option><option value="ASSEMBLY">ASSEMBLY</option><option value="EXAM">EXAM</option><option value="EVENT">EVENT</option>`;
            validSubjects.forEach(s => { subOptions += `<option value="${s}" ${s === entryData.subject ? 'selected' : ''}>${s}</option>`; });
            if (entryData.subject && !validSubjects.includes(entryData.subject) && !SPECIAL_SUBJECTS.includes(entryData.subject)) {
                subOptions += `<option value="${entryData.subject}" selected>${entryData.subject}</option>`;
            }

            const div = document.createElement('div');
            div.className = "ent-row flex flex-col bg-white border border-slate-200 rounded-xl p-2 shadow-sm relative";
            div.id = entId;
            
            div.innerHTML = `
                <button onclick="document.getElementById('${entId}').remove()" class="absolute -right-2 -top-2 bg-white border border-rose-200 text-rose-500 rounded-full w-5 h-5 flex items-center justify-center shadow hover:bg-rose-50 z-10 font-black text-[10px]">✕</button>
                
                <select class="ent-sub w-full p-1.5 bg-slate-50 border border-slate-200 rounded text-[11px] font-black text-rose-600 outline-none mb-1" onchange="handleEntrySubject('${blockId}', '${entId}')">${subOptions}</select>
                
                <div class="ent-tea-wrap flex gap-1 items-center mb-1">
                    <select class="ent-tea flex-1 p-1.5 bg-slate-50 border border-slate-200 rounded text-[10px] font-bold text-emerald-600 outline-none" data-selected="${entryData.teacher}" onchange="checkGlobalClash()">
                        <option value="NONE">NONE</option>
                    </select>
                    <label class="text-[8px] font-black text-slate-400 uppercase" title="Show All"><input type="checkbox" class="ent-showall w-3 h-3 accent-blue-600 align-middle" onchange="handleEntrySubject('${blockId}', '${entId}')"> All</label>
                </div>
                
                <div class="flex gap-1 mb-1">
                    <input type="text" class="ent-room w-1/3 p-1.5 bg-slate-50 border border-slate-200 rounded text-[9px] font-bold text-center outline-none" placeholder="Room" value="${entryData.room}">
                    <input type="text" class="ent-rem flex-1 p-1.5 bg-amber-50 border border-amber-200 rounded text-[9px] font-bold text-amber-700 outline-none" placeholder="Remark" value="${entryData.remark}">
                </div>
                
                <div class="flex justify-between bg-slate-100 rounded px-2 py-1 border border-slate-200">
                    ${DAYS_OF_WEEK.map(d => `
                        <label class="flex flex-col items-center cursor-pointer">
                            <span class="text-[8px] font-black text-slate-500">${DAY_SHORTS[d]}</span>
                            <input type="checkbox" value="${d}" class="ent-day day-tick" ${entryData.days.includes(d)?'checked':''} onchange="checkGlobalClash()">
                        </label>
                    `).join('')}
                </div>
                <div class="ent-warn hidden text-[8px] font-black text-white bg-red-600 p-1 rounded text-center mt-1 animate-pulse"></div>
            `;
            wrapper.appendChild(div);
            handleEntrySubject(blockId, entId);
        }

        function handleEntrySubject(blockId, entId) {
            const row = document.getElementById(entId);
            const sub = row.querySelector('.ent-sub').value;
            const tWrap = row.querySelector('.ent-tea-wrap');
            const roomInp = row.querySelector('.ent-room');
            const tSel = row.querySelector('.ent-tea');
            const showAll = row.querySelector('.ent-showall').checked;
            const prevSel = tSel.getAttribute('data-selected');

            if (SPECIAL_SUBJECTS.includes(sub)) {
                tWrap.classList.add('hidden'); 
                tSel.innerHTML = '<option value="NONE">NONE</option>';
                tSel.value = "NONE";
                if (sub === 'BREAK') roomInp.placeholder = "Lunch"; else roomInp.placeholder = "Loc/Name";
            } else {
                tWrap.classList.remove('hidden'); roomInp.placeholder = "Room";
                tSel.innerHTML = '<option value="NONE">- Teacher -</option>';
                allTeachers.forEach(t => {
                    const deptStr = Array.isArray(t.dept) ? t.dept.join(',').toLowerCase() : t.dept.toLowerCase();
                    if (showAll || deptStr.includes(sub.toLowerCase())) {
                        const isSelected = (t.name === prevSel) ? 'selected' : '';
                        tSel.innerHTML += `<option value="${t.name}" ${isSelected}>${t.name}</option>`;
                    }
                });
                tSel.setAttribute('data-selected', ''); 
            }
            checkGlobalClash();
        }

        function sortSectionBlocks(secId) {
            const container = document.getElementById('grid-' + secId);
            const blocks = Array.from(container.querySelectorAll('.time-block'));
            const addBtn = document.getElementById('add-btn-' + secId);
            
            blocks.sort((a, b) => {

        // ============================================================================
        // === GLOBAL VIRTUAL CLASH DETECTOR                                        ===
        // ============================================================================
        function checkGlobalClash() {
            const allBlocks = Array.from(document.querySelectorAll('.time-block'));
            const virtualDb = [];
            
            allBlocks.forEach(b => {
                const s24 = b.querySelector('.tb-s24').value; const e24 = b.querySelector('.tb-e24').value;
                if(!s24 || !e24) return;
                const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
                const sMins = sh * 60 + sm; const eMins = eh * 60 + em;
                
                const bCls = b.getAttribute('data-class');
                const bSec = b.getAttribute('data-section');
                
                const entries = Array.from(b.querySelectorAll('.ent-row'));
                entries.forEach(ent => {
                    const tea = ent.querySelector('.ent-tea').value;
                    const room = ent.querySelector('.ent-room').value.trim();
                    const days = Array.from(ent.querySelectorAll('.ent-day:checked')).map(cb => cb.value);
                    
                    if(tea !== "NONE" && tea !== "") {
                        days.forEach(d => {
                            virtualDb.push({ blockId: b.id, entId: ent.id, day: d, teacher: tea, room: room, className: bCls, section: bSec, sMins, eMins });
                        });
                    }
                });
            });

            allBlocks.forEach(b => {
                const readWarn = b.querySelector('.read-warn');
                if(readWarn) { readWarn.classList.add('hidden'); readWarn.innerText = ""; }
                
                let blockClashes = [];
                
                const entries = Array.from(b.querySelectorAll('.ent-row'));
                entries.forEach(ent => {
                    const warnLbl = ent.querySelector('.ent-warn');
                    warnLbl.classList.add('hidden'); warnLbl.innerText = "";
                    
                    const tea = ent.querySelector('.ent-tea').value;
                    if(tea === "NONE" || tea === "") return; 
                    
                    const myVirtuals = virtualDb.filter(v => v.entId === ent.id);
                    if(myVirtuals.length === 0) return;
                    
                    let clashes = [];
                    myVirtuals.forEach(myV => {
                        const overlaps = virtualDb.filter(otherV => {
                            if(otherV.entId === myV.entId) return false;
                            if(otherV.day !== myV.day) return false; 
                            if(otherV.teacher !== myV.teacher) return false; 
                            if(otherV.section === myV.section) return false; 
                            
                            // MERGED CLASS EXCEPTION
                            if (otherV.room !== "" && myV.room !== "" && otherV.room.toLowerCase() === myV.room.toLowerCase()) return false;

                            return (myV.sMins < otherV.eMins && myV.eMins > otherV.sMins);
                        });
                        clashes.push(...overlaps);
                    });
                    
                    if(clashes.length > 0) {
                        const clashSecs = [...new Set(clashes.map(c => c.section))].join(', ');
                        warnLbl.innerText = `🚨 CLASH: ${clashSecs}`;
                        warnLbl.classList.remove('hidden');
                        blockClashes.push(...clashes); 
                    }
                });
                
                if(blockClashes.length > 0 && readWarn) {
                    const clashSecs = [...new Set(blockClashes.map(c => c.section))].join(', ');
                    readWarn.innerText = `🚨 CLASH: ${clashSecs}`;
                    readWarn.classList.remove('hidden');
                }
            });
        }

        function format12Hour(time24) {
            if(!time24) return ""; let [h, m] = time24.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
        }

        // ============================================================================
        // === SAVE ENGINE & EMAIL NOTIFICATION                                     ===
        // ============================================================================
        async function saveAllChanges() {
            const allBlocks = Array.from(document.querySelectorAll('.time-block'));
            let newSlots = []; 
            let conflictMsg = "";

            for (let b of allBlocks) {
                const className = b.getAttribute('data-class');
                const sectionName = b.getAttribute('data-section');
                const s24 = b.querySelector('.tb-s24').value; 
                const e24 = b.querySelector('.tb-e24').value;
                const entries = Array.from(b.querySelectorAll('.ent-row'));
                
                if (!s24 || !e24) { conflictMsg = `A block in ${sectionName} is missing a time.`; break; }
                
                const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
                const sMins = sh * 60 + sm; const eMins = eh * 60 + em;
                if (sMins >= eMins) { conflictMsg = `Invalid Time in ${sectionName}: ${s24} - ${e24}.`; break; }
                
                const dur = `${eMins - sMins} MINS`;
                const timeRange = `${format12Hour(s24)} - ${format12Hour(e24)}`;

                for(let ent of entries) {
                    const sub = ent.querySelector('.ent-sub').value;
                    const teacher = ent.querySelector('.ent-tea').value || "NONE"; 
                    const room = ent.querySelector('.ent-room').value.trim();
                    const remark = ent.querySelector('.ent-rem').value.trim();
                    const activeDays = Array.from(ent.querySelectorAll('.ent-day:checked')).map(cb => cb.value);

                    if (activeDays.length === 0) { conflictMsg = `A subject in ${sectionName} has no days selected.`; break; }

                    activeDays.forEach(day => {
                        let teacherEmail = "";
                        if (teacher !== "NONE") {
                            const tObj = allTeachers.find(t => t.name === teacher);
                            if (tObj) teacherEmail = tObj.email || ""; 
                        }
                        newSlots.push({ 
                            day: day, className: className, section: sectionName, 
                            start24: s24, end24: e24, timeRange, duration: dur, 
                            subject: sub, teacher, teacherName: teacher, teacherEmail: teacherEmail, 
                            room, remark, sMins, eMins 
                        });
                    });
                }
                if(conflictMsg) break;
            }

            if (conflictMsg) return alert(conflictMsg);
            if(!confirm("You are about to save the entire school's timetable. Proceed?")) return;

            const btn = document.getElementById('save-btn'); 
            const originalText = btn.innerHTML;
            btn.innerHTML = "Saving..."; btn.disabled = true;

            try {
                const teachersToNotify = detectTeacherChanges(oldTimetableState, newSlots);
                const batch = db.batch();

                const snap = await db.collection("timetable").get();
                snap.docs.forEach(doc => { batch.delete(doc.ref); });
                
                newSlots.forEach(slot => {
                    const { sMins, eMins, ...cleanSlot } = slot;
                    batch.set(db.collection("timetable").doc(), cleanSlot);
                });

                await batch.commit(); 
                await fetchTimetable();

                if (teachersToNotify.length > 0) {
                    sendEmailNotification(teachersToNotify);
                } else {
                    alert("Timetable Saved Successfully! No teacher schedules were changed.");
                }

                renderDirectDashboard(); 
            } catch (err) { 
                alert("Error saving: " + err.message); 
            } finally { 
                btn.innerHTML = originalText; btn.disabled = false; 
            }
        }

        function detectTeacherChanges(oldData, newData) {
            let affectedTeachers = new Set();
            oldData.forEach(oldSlot => {
                if (oldSlot.teacher === "NONE") return;
                const exists = newData.some(n => n.teacher === oldSlot.teacher && n.day === oldSlot.day && n.timeRange === oldSlot.timeRange);
                if (!exists) affectedTeachers.add(JSON.stringify({ name: oldSlot.teacher, email: oldSlot.teacherEmail }));
            });
            newData.forEach(newSlot => {
                if (newSlot.teacher === "NONE") return;
                const exists = oldData.some(o => o.teacher === newSlot.teacher && o.day === newSlot.day && o.timeRange === newSlot.timeRange);
                if (!exists) affectedTeachers.add(JSON.stringify({ name: newSlot.teacher, email: newSlot.teacherEmail }));
            });
            return Array.from(affectedTeachers).map(s => JSON.parse(s));
        }

        function sendEmailNotification(teachers) {
            const payload = { type: "GLOBAL_TIMETABLE_UPDATE", teachersAffected: teachers };
            console.log("SENDING EMAIL PAYLOAD TO APPS SCRIPT:", payload);
            alert(`System updated! In production, an email would now be sent to: ${teachers.map(t=>t.name).join(', ')} via Apps Script webhook.`);
        }

        // ============================================================================
        // === EXACT SCREEN MATCH EXPORT ENGINE                                     ===
        // ============================================================================
        function openPrintModal() { document.getElementById('print-modal').classList.replace('hidden', 'flex'); }

        async function generateExportData() {
            alert("Ensure you have clicked 'Save All Changes' first, as the export pulls directly from the live database.");
            const scope = document.getElementById('p-scope').value;
            const timeframe = document.getElementById('p-timeframe').value;
            const selectedDay = document.getElementById('p-day').value;
            const wrapper = document.getElementById('export-table-wrapper');
            const hiddenArea = document.getElementById('print-render-area');
            const btn = document.getElementById('print-exec-btn');
            
            btn.innerText = "Building..."; btn.disabled = true;

            try {
                const allData = globalTimetable;
                let exportHtml = "";

                let targetStructures = structureData;
                if(scope.startsWith("CLASS|")) targetStructures = structureData.filter(s => s.className === scope.split('|')[1]);
                if(scope.startsWith("SEC|")) targetStructures = structureData.filter(s => s.className === scope.split('|')[1] && s.sectionName === scope.split('|')[2]);

                targetStructures.sort((a,b) => a.className.localeCompare(b.className) || a.sectionName.localeCompare(b.sectionName));

                targetStructures.forEach(struct => {
                    let secSlots = allData.filter(t => t.className === struct.className && t.section === struct.sectionName);
                    
                    // Filter down to a single day if requested
                    if(timeframe === "DAY") {
                        secSlots = secSlots.filter(t => t.day === selectedDay);
                    }
                    
                    if(secSlots.length === 0) return;

                    // Group by Time Container (Start - End)
                    const timeContainers = {};
                    secSlots.forEach(slot => {
                        const tKey = `${slot.start24}-${slot.end24}`;
                        if(!timeContainers[tKey]) timeContainers[tKey] = { start24: slot.start24, end24: slot.end24, entries: [] };

                        let existingEntry = timeContainers[tKey].entries.find(e => e.subject === slot.subject && e.teacher === slot.teacher && e.room === slot.room);
                        if(existingEntry) {
                            if(!existingEntry.days.includes(slot.day)) existingEntry.days.push(slot.day);
                        } else {
                            timeContainers[tKey].entries.push({ subject: slot.subject, teacher: slot.teacher, room: slot.room, remark: slot.remark, days: [slot.day] });
                        }
                    });

                    const sortedContainers = Object.values(timeContainers).sort((a,b) => a.start24.localeCompare(b.start24));
                    if(sortedContainers.length === 0) return;

                    const headerTitle = timeframe === "WEEK" ? `${struct.className} - SEC: ${struct.sectionName} (Full Week)` : `${struct.className} - SEC: ${struct.sectionName} (${selectedDay})`;

                    exportHtml += `
                        <div class="page-break" style="margin-bottom: 30px;">
                            <table border="1" cellpadding="8" style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; table-layout: auto;">
                                <thead>
                                    <tr>
                                        <th style="background-color: #0f172a; color: #ffffff; width: 140px; font-size: 16px; text-align: center; vertical-align: middle;">
                                            ${headerTitle}
                                        </th>
                    `;

                    // Render Time Headers
                    sortedContainers.forEach(tc => {
                        const [sh, sm] = tc.start24.split(':').map(Number); const [eh, em] = tc.end24.split(':').map(Number);
                        const dur = `${(eh * 60 + em) - (sh * 60 + sm)} MINS`;
                        exportHtml += `
                            <th style="background-color: #1e3a8a; color: #ffffff; text-align: center; vertical-align: top; min-width: 180px;">
                                <div style="font-size: 14px;">${format12Hour(tc.start24)} - ${format12Hour(tc.end24)}</div>
                                <div style="font-size: 10px; color: #bae6fd; margin-top: 4px;">${dur}</div>
                            </th>
                        `;
                    });

                    exportHtml += `</tr></thead><tbody><tr>`;

                    // Section Sidebar cell
                    exportHtml += `
                        <td style="background-color: #f8fafc; color: #0f172a; font-weight: 900; text-align: center; vertical-align: middle; font-size: 12px; letter-spacing: 2px;">
                            SCHEDULE
                        </td>
                    `;

                    // Render Entries Inside Time Headers
                    sortedContainers.forEach(tc => {
                        exportHtml += `<td style="background-color: #ffffff; vertical-align: top; text-align: center;">`;

                        tc.entries.forEach((ent, idx) => {
                            if(idx > 0) exportHtml += `<hr style="border-top: 1px dashed #cbd5e1; margin: 12px 0;">`;

                            let subColor = '#e11d48';
                            if (SPECIAL_SUBJECTS.includes(ent.subject)) subColor = '#94a3b8';
                            if (ent.subject === 'EXAM' || ent.subject === 'EVENT') subColor = '#8b5cf6';
                            if (ent.subject.toUpperCase().includes('MATH')) subColor = '#047857';
                            if (ent.subject.toUpperCase().includes('PHYSICS')) subColor = '#1d4ed8';

                            exportHtml += `
                                <div style="margin-bottom: 8px;">
                                    <div style="color: ${subColor}; font-weight: 900; font-size: 14px; text-transform: uppercase;">${ent.subject || '-'}</div>
                                    ${ent.teacher !== 'NONE' ? `<div style="color: #059669; font-size: 12px; font-weight: bold; margin-top: 2px;">${ent.teacher}</div>` : ''}
                                    ${ent.room ? `<div style="color: #64748b; font-size: 10px; font-weight: bold; margin-top: 2px;">RM: ${ent.room}</div>` : ''}
                                    ${ent.remark ? `<div style="color: #d97706; font-size: 10px; font-weight: bold; font-style: italic; margin-top: 2px;">(${ent.remark})</div>` : ''}
                            `;

                            // Only show day pills if it is the Weekly Matrix
                            if (timeframe === "WEEK") {
                                const daysStr = ent.days.map(d => DAY_SHORTS[d]).join(', ');
                                exportHtml += `
                                    <div style="margin-top: 6px; font-size: 9px; font-weight: bold; color: #1e40af; background-color: #e0e7ff; display: inline-block; padding: 4px 8px; border-radius: 6px;">
                                        ${daysStr}
                                    </div>
                                `;
                            }
                            exportHtml += `</div>`;
                        });

                        exportHtml += `</td>`;
                    });

                    exportHtml += `</tr></tbody></table></div>`;
                });

                if (!exportHtml) exportHtml = "<h2 style='text-align:center; font-family:sans-serif; color: #64748b;'>No schedule data found for the selected options.</h2>";

                wrapper.innerHTML = exportHtml; hiddenArea.innerHTML = exportHtml;
                document.getElementById('print-modal').classList.replace('flex', 'hidden');
                document.getElementById('export-preview-modal').classList.replace('hidden', 'flex');

            } catch(e) { 
                console.error(e); alert("Error formatting grid: " + e.message); 
            } finally { 
                btn.innerText = "Generate Layout"; btn.disabled = false; 
            }
        }

            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
