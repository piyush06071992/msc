<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Master Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        /* Custom scrollbar for horizontal sections */
        .tt-grid { display: flex; overflow-x: auto; gap: 12px; background: #f8fafc; padding: 12px; border-radius: 0 16px 16px 0; align-items: stretch; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .tt-sidebar { width: 140px; flex-shrink: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; text-align: center; border-right: 4px solid #1e293b; padding: 10px; border-radius: 16px 0 0 16px; }
        
        #export-preview-modal { backdrop-filter: blur(5px); }
        #export-table-wrapper { max-height: 70vh; overflow: auto; background: white; padding: 1rem; border-radius: 10px; border: 1px solid #e2e8f0; }
        
        /* BULLETPROOF PRINT SETTINGS */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body > *:not(#print-render-area) { display: none !important; }
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #print-render-area { display: block !important; position: relative !important; visibility: visible !important; width: 100%; font-family: 'Arial', sans-serif; }
            .page-break { page-break-inside: auto; margin-bottom: 20px; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-200 min-h-screen font-sans pb-20">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm no-print">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black text-slate-800 uppercase tracking-tighter">Timetable Editor</h1>
        </div>
        
        <div class="flex gap-2 items-center">
            <button onclick="saveAllChanges()" id="save-btn" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-black text-[11px] uppercase tracking-widest shadow-md hover:bg-blue-500 transition-all mr-4 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Save All Changes
            </button>
            
            <button onclick="openPrintModal()" class="bg-emerald-600 text-white px-5 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-emerald-500 transition-all">
                🖨️ Export
            </button>
            <button onclick="window.location.href='admin-timetable-auth.html'" class="bg-indigo-600 text-white px-5 py-2 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-indigo-500 transition-all ml-2" title="Manage Staff Permissions">
                🔐 Delegations
            </button>
        </div>
    </header>

    <main class="p-4 sm:p-6 overflow-hidden transition-all duration-300 no-print" id="main-content">
        <div id="timetable-container" class="space-y-6">
            <div class="text-center py-20 font-black text-slate-400 animate-pulse uppercase tracking-widest text-xs">Loading Direct Editor...</div>
        </div>
    </main>

    <div id="print-render-area" class="hidden print:block"></div>

    <div id="export-preview-modal" class="fixed inset-0 bg-slate-900/70 z-[200] hidden flex-col items-center justify-center p-4 no-print">
        <div class="bg-white rounded-3xl p-6 w-full max-w-7xl shadow-2xl flex flex-col h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <h3 class="font-black text-slate-900 text-2xl uppercase tracking-tighter">Timetable Preview</h3>
                <div class="flex gap-3">
                    <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                        <span>📊</span> Download Excel
                    </button>
                    <button onclick="executeBrowserPrint()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                        <span>🖨️</span> Save PDF / Print
                    </button>
                    <button onclick="closeExportPreview()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-3 rounded-xl font-black uppercase tracking-widest text-xs transition-all">
                        ✕ Close
                    </button>
                </div>
            </div>
            <div id="export-table-wrapper" class="flex-1"></div>
        </div>
    </div>

    <div id="print-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl">
            <h3 class="font-black text-slate-900 text-xl uppercase mb-6 border-b pb-4">Export Options</h3>
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Matrix Layout</label>
                    <select id="p-timeframe" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer text-blue-700">
                        <option value="WEEK">Weekly Matrix (Columns = Days)</option>
                        <option value="DAY">Daily Matrix (Columns = Sections)</option>
                    </select>
                </div>
                <div id="print-day-wrapper" class="hidden">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Select Day</label>
                    <select id="p-day" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer text-blue-700">
                        <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('print-modal').classList.replace('flex', 'hidden')" class="flex-1 py-3 bg-slate-100 text-slate-600 font-black rounded-xl text-[10px] uppercase">Cancel</button>
                <button onclick="generateExportData()" id="print-exec-btn" class="flex-1 py-3 bg-blue-600 text-white font-black rounded-xl text-[10px] uppercase shadow-md">Generate Layout</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];
        let allTeachers = [];
        let globalTimetable = []; 
        let oldTimetableState = []; 
        
        const SPECIAL_SUBJECTS = ['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'];
        const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const COL_COLORS = ['#f8fafc', '#f0fdf4', '#fefce8', '#eff6ff', '#faf5ff', '#fff1f2', '#f0fdfa'];

        document.getElementById('p-timeframe').addEventListener('change', function() {
            document.getElementById('print-day-wrapper').style.display = this.value === 'DAY' ? 'block' : 'none';
        });

        async function init() {
            await Promise.all([fetchStructure(), fetchTeachers()]);
            await fetchTimetable();
            renderDirectDashboard();
        }

        async function fetchStructure() {
            const snap = await db.collection("institute_structure").orderBy("className").get();
            structureData = snap.docs.map(d => d.data());
        }

        async function fetchTeachers() {
            const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
            allTeachers = snap.docs.map(doc => {
                const data = doc.data();
                const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                return { name: nameKey ? data.details[nameKey] : data.email, email: data.email, dept: deptKey ? data.details[deptKey] : 'General' };
            });
        }

        async function fetchTimetable() {
            const snap = await db.collection("timetable").get();
            globalTimetable = snap.docs.map(d => ({id: d.id, ...d.data()}));
            // Save state for email difference checker
            oldTimetableState = JSON.parse(JSON.stringify(globalTimetable)); 
        }

        // ============================================================================
        // === THE DIRECT HORIZONTAL EDITOR BUILDER                                 ===
        // ============================================================================
        function renderDirectDashboard() {
            const container = document.getElementById('timetable-container');
            container.innerHTML = "";

            const renderGroups = {};
            structureData.forEach(struct => {
                if(!renderGroups[struct.className]) renderGroups[struct.className] = {};
                renderGroups[struct.className][struct.sectionName] = []; 
            });

            // Group timetable slots by class and section
            globalTimetable.forEach(item => {
                if(renderGroups[item.className] && renderGroups[item.className][item.section]) {
                    renderGroups[item.className][item.section].push(item);
                }
            });

            Object.keys(renderGroups).sort().forEach(className => {
                let groupHtml = `
                    <div class="bg-white shadow-lg rounded-2xl overflow-hidden border border-slate-200 class-group mb-8">
                        <div class="bg-blue-900 text-white p-3 text-center font-black text-[14px] uppercase tracking-[0.2em] shadow-inner">${className}</div>
                        <div class="flex flex-col gap-1 p-2 bg-slate-100">`;
                
                Object.keys(renderGroups[className]).sort().forEach(sectionName => {
                    const secId = `sec_${className.replace(/\s+/g, '')}_${sectionName.replace(/\s+/g, '')}`;
                    const slots = renderGroups[className][sectionName];
                    
                    groupHtml += `
                        <div class="flex relative bg-white rounded-2xl shadow-sm border border-slate-200">
                            <div class="tt-sidebar">
                                <span class="opacity-50 text-[9px] tracking-widest block mb-1">SECTION</span>
                                <span class="text-xl tracking-tighter">${sectionName}</span>
                            </div>
                            <div class="tt-grid flex-1" id="grid-${secId}">
                                <button id="add-btn-${secId}" onclick="addDirectBlock('${className}', '${sectionName}', '${secId}')" class="shrink-0 flex items-center justify-center w-[180px] border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 hover:bg-slate-100 hover:border-blue-400 hover:text-blue-600 text-slate-400 cursor-pointer transition-all shadow-inner my-1">
                                    <span class="font-black text-[12px] uppercase tracking-widest">+ Add Block</span>
                                </button>
                            </div>
                        </div>`;
                });
                groupHtml += `</div></div>`;
                container.innerHTML += groupHtml;

                // After injecting the HTML structure, inject the data blocks
                Object.keys(renderGroups[className]).forEach(sectionName => {
                    const secId = `sec_${className.replace(/\s+/g, '')}_${sectionName.replace(/\s+/g, '')}`;
                    const slots = renderGroups[className][sectionName];
                    
                    // Reverse-engineer the flat DB into blocks with days arrays
                    const blocks = [];
                    slots.forEach(slot => {
                        const existing = blocks.find(b => b.start24 === slot.start24 && b.end24 === slot.end24 && b.subject === slot.subject && b.teacher === slot.teacher);
                        if(existing) {
                            if(!existing.days.includes(slot.day)) existing.days.push(slot.day);
                        } else {
                            blocks.push({...slot, days: [slot.day]});
                        }
                    });

                    // Sort and render blocks
                    blocks.sort((a,b) => a.start24.localeCompare(b.start24)).forEach(b => {
                        injectDirectBlock(className, sectionName, secId, b);
                    });
                });
            });
        }

        function addDirectBlock(className, sectionName, secId) {
            // Adds an empty block with all days ticked by default
            injectDirectBlock(className, sectionName, secId, {
                start24: "", end24: "", duration: "", subject: "BREAK", teacher: "NONE", room: "", remark: "",
                days: DAYS_OF_WEEK 
            });
            sortSectionBlocks(secId);
        }

        function injectDirectBlock(className, sectionName, secId, blockData) {
            const grid = document.getElementById('grid-' + secId);
            const blockId = 'blk_' + Date.now() + Math.random().toString(36).substr(2, 9);
            
            const struct = structureData.find(s => s.className === className && s.sectionName === sectionName);
            const validSubjects = struct ? struct.subjects : [];
            
            let subOptions = `<option value="BREAK">BREAK</option><option value="ASSEMBLY">ASSEMBLY</option><option value="EXAM">EXAM</option><option value="EVENT">EVENT</option>`;
            validSubjects.forEach(s => { subOptions += `<option value="${s}" ${s === blockData.subject ? 'selected' : ''}>${s}</option>`; });
            if (blockData.subject && !validSubjects.includes(blockData.subject) && !SPECIAL_SUBJECTS.includes(blockData.subject)) {
                subOptions += `<option value="${blockData.subject}" selected>${blockData.subject}</option>`;
            }

            const div = document.createElement('div');
            div.className = "editable-block shrink-0 w-[260px] bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex flex-col gap-2 relative transition-all my-1 hover:border-slate-400";
            div.id = blockId;
            div.setAttribute('data-class', className);
            div.setAttribute('data-section', sectionName);

            div.innerHTML = `
                <div class="flex justify-between items-center gap-2">
                    <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-lg p-1 focus-within:border-blue-400 flex-1">
                        <input type="time" class="r-start text-[11px] font-black text-slate-700 bg-transparent outline-none w-full text-center" value="${blockData.start24}" onchange="handleTimeChange(this, '${secId}')">
                        <span class="text-slate-400 font-bold">-</span>
                        <input type="time" class="r-end text-[11px] font-black text-slate-700 bg-transparent outline-none w-full text-center" value="${blockData.end24}" onchange="handleTimeChange(this, '${secId}')">
                    </div>
                    <button onclick="document.getElementById('${blockId}').remove()" class="text-rose-400 hover:text-rose-600 bg-rose-50 p-1.5 rounded-lg border border-rose-100 hover:bg-rose-100 transition-colors" title="Delete Block">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
                
                <div class="r-duration text-[9px] font-black text-blue-600 uppercase text-center mt-[-4px] mb-1 tracking-widest">${blockData.duration || '-- MINS'}</div>
                
                <select class="r-sub w-full p-2 bg-slate-50 border border-slate-200 rounded-lg font-black text-rose-600 text-[12px] outline-none cursor-pointer" onchange="handleDirectSubjectChange('${blockId}')">${subOptions}</select>
                
                <div class="flex gap-2 items-center r-teacher-wrapper">
                    <select class="r-tea flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-emerald-600 text-[11px] outline-none cursor-pointer" data-selected="${blockData.teacher}" onchange="checkDirectClash('${blockId}')"></select>
                    <label class="text-[9px] font-black text-slate-400 flex items-center cursor-pointer uppercase tracking-widest shrink-0" title="Show all staff"><input type="checkbox" class="r-showall w-3 h-3 accent-blue-600 mr-1" onchange="handleDirectSubjectChange('${blockId}')"> All</label>
                </div>

                <div class="flex gap-2">
                    <input type="text" class="r-room w-1/3 p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-[10px] outline-none placeholder-slate-400 text-center" placeholder="Room" value="${blockData.room}">
                    <input type="text" class="r-rem flex-1 p-2 bg-amber-50 border border-amber-200 rounded-lg font-bold text-[10px] text-amber-700 outline-none placeholder-amber-400" placeholder="Remarks (Opt)" value="${blockData.remark}">
                </div>

                <div class="flex justify-between items-center bg-slate-50 border border-slate-200 rounded-lg p-1.5 px-3 mt-1 shadow-inner">
                    ${DAYS_OF_WEEK.map(d => `
                        <label class="flex flex-col items-center cursor-pointer" title="${d}">
                            <span class="text-[9px] font-black text-slate-500 mb-1">${d.substring(0,1)}</span>
                            <input type="checkbox" value="${d}" class="r-day day-tick" ${blockData.days.includes(d)?'checked':''} onchange="checkDirectClash('${blockId}')">
                        </label>
                    `).join('')}
                </div>
                
                <div class="r-warn hidden text-[9px] font-black text-white bg-red-600 p-1.5 rounded-lg text-center mt-1 animate-pulse shadow"></div>
            `;
            
            // Insert before the "+ Add Block" button
            const addBtn = document.getElementById('add-btn-' + secId);
            grid.insertBefore(div, addBtn);
            
            handleDirectSubjectChange(blockId);
        }

        function handleTimeChange(inputElem, secId) {
            const block = inputElem.closest('.editable-block');
            const s24 = block.querySelector('.r-start').value;
            const e24 = block.querySelector('.r-end').value;
            const durLabel = block.querySelector('.r-duration');
            
            if(!s24 || !e24) { durLabel.innerText = '-- MINS'; }
            else {
                const [sh, sm] = s24.split(':').map(Number);
                const [eh, em] = e24.split(':').map(Number);
                const totalMins = (eh * 60 + em) - (sh * 60 + sm);
                if (totalMins <= 0) { durLabel.innerText = 'INVALID'; durLabel.classList.replace('text-blue-600', 'text-red-600'); }
                else { durLabel.classList.replace('text-red-600', 'text-blue-600'); durLabel.innerText = `${totalMins} MINS`; }
            }
            
            checkDirectClash(block.id);
            sortSectionBlocks(secId); // Auto-push block to correct chronological position!
        }

        function sortSectionBlocks(secId) {
            const container = document.getElementById('grid-' + secId);
            const blocks = Array.from(container.querySelectorAll('.editable-block'));
            const addBtn = document.getElementById('add-btn-' + secId);
            
            blocks.sort((a, b) => { 
                const aTime = a.querySelector('.r-start').value || "99:99";
                const bTime = b.querySelector('.r-start').value || "99:99";
                return aTime.localeCompare(bTime); 
            });
            
            blocks.forEach(b => container.insertBefore(b, addBtn));
        }

        function handleDirectSubjectChange(blockId) {
            const block = document.getElementById(blockId);
            const sub = block.querySelector('.r-sub').value;
            const tWrapper = block.querySelector('.r-teacher-wrapper');
            const roomInput = block.querySelector('.r-room');
            const tSelect = block.querySelector('.r-tea');
            const showAll = block.querySelector('.r-showall').checked;
            const prevSelected = tSelect.getAttribute('data-selected');

            if (SPECIAL_SUBJECTS.includes(sub)) {
                tWrapper.classList.add('hidden'); tSelect.value = "NONE";
                if (sub === 'BREAK') roomInput.placeholder = "Lunch";
                else if (sub === 'EXAM') roomInput.placeholder = "UT 1";
                else if (sub === 'EVENT') roomInput.placeholder = "Event";
                else if (sub === 'ASSEMBLY') roomInput.placeholder = "Loc";
            } else {
                tWrapper.classList.remove('hidden'); roomInput.placeholder = "Room";
                tSelect.innerHTML = '<option value="NONE">No Teacher</option>';
                allTeachers.forEach(t => {
                    const deptStr = Array.isArray(t.dept) ? t.dept.join(',').toLowerCase() : t.dept.toLowerCase();
                    if (showAll || deptStr.includes(sub.toLowerCase())) {
                        const isSelected = (t.name === prevSelected) ? 'selected' : '';
                        tSelect.innerHTML += `<option value="${t.name}" ${isSelected}>${t.name}</option>`;
                    }
                });
                tSelect.setAttribute('data-selected', ''); 
            }
            checkDirectClash(blockId);
        }

        function checkDirectClash(blockId) {
            const block = document.getElementById(blockId);
            const s24 = block.querySelector('.r-start').value;
            const e24 = block.querySelector('.r-end').value;
            const tName = block.querySelector('.r-tea').value;
            const warnLabel = block.querySelector('.r-warn');
            const activeDays = Array.from(block.querySelectorAll('.r-day:checked')).map(cb => cb.value);

            if (tName === "NONE" || !s24 || !e24 || activeDays.length === 0) { 
                warnLabel.innerText = ""; warnLabel.classList.add('hidden'); return; 
            }
            
            const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
            const rStart = sh * 60 + sm; const rEnd = eh * 60 + em;
            const bClass = block.getAttribute('data-class');
            const bSection = block.getAttribute('data-section');

            // Scrape DOM to build virtual state of ALL unsaved blocks for clash checking
            const allBlocks = Array.from(document.querySelectorAll('.editable-block'));
            const virtualDb = [];
            allBlocks.forEach(b => {
                if(b.id === blockId) return; // Skip self
                const bs24 = b.querySelector('.r-start').value; const be24 = b.querySelector('.r-end').value;
                if(!bs24 || !be24) return;
                const [bsh, bsm] = bs24.split(':').map(Number); const [beh, bem] = be24.split(':').map(Number);
                const bStart = bsh * 60 + bsm; const bEnd = beh * 60 + bem;
                
                const bTea = b.querySelector('.r-tea').value;
                const bDays = Array.from(b.querySelectorAll('.r-day:checked')).map(cb => cb.value);
                const bCls = b.getAttribute('data-class');
                const bSec = b.getAttribute('data-section');
                
                bDays.forEach(d => {
                    virtualDb.push({ day: d, teacher: bTea, className: bCls, section: bSec, sMins: bStart, eMins: bEnd });
                });
            });

            // Check if teacher is busy elsewhere in virtual DOM
            const overlaps = virtualDb.filter(slot => {
                if (!activeDays.includes(slot.day)) return false; 
                if (slot.teacher !== tName) return false;
                if (slot.className === bClass && slot.section === bSection) return false; // Allowed in same section (Split classes!)
                return (rStart < slot.eMins && rEnd > slot.sMins);
            });
            
            if (overlaps.length > 0) {
                const clashStr = [...new Set(overlaps.map(o => o.section))].join(', ');
                warnLabel.innerText = `🚨 CLASH: ${clashStr}`;
                warnLabel.classList.remove('hidden');
            } else {
                warnLabel.innerText = "";
                warnLabel.classList.add('hidden');
            }
        }

        function format12Hour(time24) {
            if(!time24) return ""; let [h, m] = time24.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
        }

        // ============================================================================
        // === SAVE ENGINE & EMAIL NOTIFICATION                                     ===
        // ============================================================================
        async function saveAllChanges() {
            const allBlocks = Array.from(document.querySelectorAll('.editable-block'));
            let newSlots = []; 
            let conflictMsg = "";

            for (let b of allBlocks) {
                const className = b.getAttribute('data-class');
                const sectionName = b.getAttribute('data-section');
                const s24 = b.querySelector('.r-start').value; 
                const e24 = b.querySelector('.r-end').value;
                const sub = b.querySelector('.r-sub').value;
                const activeDays = Array.from(b.querySelectorAll('.r-day:checked')).map(cb => cb.value);
                
                if (!s24 || !e24) { conflictMsg = `A block in ${sectionName} is missing a start or end time.`; break; }
                if (activeDays.length === 0) { conflictMsg = `A block in ${sectionName} has no days ticked.`; break; }
                
                const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
                const sMins = sh * 60 + sm; const eMins = eh * 60 + em;
                if (sMins >= eMins) { conflictMsg = `Invalid Time in ${sectionName}: ${s24} - ${e24}.`; break; }
                
                const dur = b.querySelector('.r-duration').innerText;
                const timeRange = `${format12Hour(s24)} - ${format12Hour(e24)}`;
                const teacher = b.querySelector('.r-tea').value || "NONE"; 
                const room = b.querySelector('.r-room').value.trim();
                const remark = b.querySelector('.r-rem').value.trim();

                activeDays.forEach(day => {
                    let teacherEmail = "";
                    if (teacher !== "NONE") {
                        const tObj = allTeachers.find(t => t.name === teacher);
                        if (tObj) teacherEmail = tObj.email || ""; 
                    }
                    newSlots.push({ 
                        day: day, className: className, section: sectionName, 
                        start24: s24, end24: e24, timeRange, duration: dur, 
                        subject: sub, teacher, teacherName: teacher, teacherEmail: teacherEmail, 
                        room, remark, sMins, eMins 
                    });
                });
            }

            if (conflictMsg) return alert(conflictMsg);
            
            if(!confirm("You are about to save the entire school's timetable. Proceed?")) return;

            const btn = document.getElementById('save-btn'); 
            const originalText = btn.innerHTML;
            btn.innerHTML = "Saving..."; btn.disabled = true;

            try {
                // Determine email notifications globally
                const teachersToNotify = detectTeacherChanges(oldTimetableState, newSlots);
                
                const batch = db.batch();

                // 1. Wipe entire timetable DB to reflect new exact state
                const snap = await db.collection("timetable").get();
                snap.docs.forEach(doc => { batch.delete(doc.ref); });
                
                // 2. Write new blocks
                newSlots.forEach(slot => {
                    const { sMins, eMins, ...cleanSlot } = slot;
                    batch.set(db.collection("timetable").doc(), cleanSlot);
                });

                await batch.commit(); 
                
                // Refresh global state
                await fetchTimetable();

                if (teachersToNotify.length > 0) {
                    sendEmailNotification(teachersToNotify);
                } else {
                    alert("Timetable Saved Successfully! No teacher schedules were changed.");
                }

                renderDirectDashboard(); 
            } catch (err) { 
                alert("Error saving: " + err.message); 
            } finally { 
                btn.innerHTML = originalText; btn.disabled = false; 
            }
        }

        function detectTeacherChanges(oldData, newData) {
            let affectedTeachers = new Set();
            oldData.forEach(oldSlot => {
                if (oldSlot.teacher === "NONE") return;
                const exists = newData.some(n => n.teacher === oldSlot.teacher && n.day === oldSlot.day && n.timeRange === oldSlot.timeRange);
                if (!exists) affectedTeachers.add(JSON.stringify({ name: oldSlot.teacher, email: oldSlot.teacherEmail }));
            });
            newData.forEach(newSlot => {
                if (newSlot.teacher === "NONE") return;
                const exists = oldData.some(o => o.teacher === newSlot.teacher && o.day === newSlot.day && o.timeRange === newSlot.timeRange);
                if (!exists) affectedTeachers.add(JSON.stringify({ name: newSlot.teacher, email: newSlot.teacherEmail }));
            });
            return Array.from(affectedTeachers).map(s => JSON.parse(s));
        }

        function sendEmailNotification(teachers) {
            const payload = {
                type: "GLOBAL_TIMETABLE_UPDATE",
                teachersAffected: teachers 
            };
            console.log("SENDING EMAIL PAYLOAD TO APPS SCRIPT:", payload);
            alert(`System updated! In production, an email would now be sent to: ${teachers.map(t=>t.name).join(', ')} via Apps Script webhook.`);
            
            /* // UNCOMMENT AND ADD YOUR APPS SCRIPT URL HERE:
            const WEBHOOK_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";
            fetch(WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(e => console.error("Webhook failed", e));
            */
        }

        // ==========================================
        // === EXPORT ENGINE (REMAINS UNCHANGED)  ===
        // ==========================================
        function openPrintModal() { document.getElementById('print-modal').classList.replace('hidden', 'flex'); }

        async function generateExportData() {
            // Note: Alerts user to ensure they saved before exporting to grab from DB
            alert("Ensure you have clicked 'Save All Changes' first, as the export pulls directly from the live database.");
            const scope = document.getElementById('p-scope').value;
            const timeframe = document.getElementById('p-timeframe').value;
            const wrapper = document.getElementById('export-table-wrapper');
            const hiddenArea = document.getElementById('print-render-area');
            const btn = document.getElementById('print-exec-btn');
            
            btn.innerText = "Building..."; btn.disabled = true;

            try {
                const allData = globalTimetable;
                const sortTimeRanges = (ranges) => {
                    const cleanRanges = ranges.filter(r => r && typeof r === 'string' && r.includes(' - '));
                    return [...new Set(cleanRanges)].sort((a,b) => {
                        const timeA = a.split(' - ')[0]; 
                        const timeB = b.split(' - ')[0];
                        return new Date('1970/01/01 ' + timeA) - new Date('1970/01/01 ' + timeB);
                    });
                };

                let exportHtml = "";

                if (timeframe === "DAY") {
                    const selectedDay = document.getElementById('p-day').value;
                    const targetClasses = scope === "ALL" ? [...new Set(structureData.map(s => s.className))] : [scope.split('|')[1]];
                    
                    targetClasses.sort().forEach(cName => {
                        let targetSections = structureData.filter(s => s.className === cName).map(s => s.sectionName);
                        if (scope.startsWith("SEC|")) targetSections = [scope.split('|')[2]];
                        
                        const classSlots = allData.filter(t => t.className === cName && targetSections.includes(t.section) && t.day === selectedDay);
                        if(classSlots.length === 0) return; 
                        
                        const uniqueRanges = sortTimeRanges(classSlots.map(s => s.timeRange));
                        if(uniqueRanges.length === 0) return;
                        
                        exportHtml += `
                            <div class="page-break" style="margin-bottom: 30px;">
                                <table border="1" cellpadding="8" style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; table-layout: auto;">
                                    <thead>
                                        <tr>
                                            <th colspan="${targetSections.length + 1}" style="font-size: 24px; background-color: #1e3a8a; color: #ffffff; padding: 12px; text-align: center; text-transform: uppercase;">
                                                ${cName} - ${selectedDay}
                                            </th>
                                        </tr>
                                        <tr>
                                            <th style="background-color: #f8fafc; color: #0f172a; width: 140px; font-size:14px; border: 2px solid #0f172a;">TIME / SEC</th>
                                            ${targetSections.map((sec, idx) => `<th style="background-color: ${COL_COLORS[(idx + 1) % COL_COLORS.length]}; color: #0f172a; font-size:16px; border: 2px solid #0f172a;">${sec}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>`;
                        
                        uniqueRanges.forEach(range => {
                            exportHtml += `<tr>
                                <td style="background-color: #f8fafc; color: #000000; font-weight: bold; text-align: center; font-size:14px; border: 2px solid #0f172a; white-space: nowrap;">${range}</td>`;
                            
                            targetSections.forEach((sec, idx) => {
                                const slotsHere = classSlots.filter(s => s.section === sec && s.timeRange === range);
                                const bgCol = COL_COLORS[(idx + 1) % COL_COLORS.length];
                                exportHtml += `<td style="background-color: ${bgCol}; text-align: center; vertical-align: top; border: 2px solid #0f172a; min-width: 140px;">`;
                                
                                if(slotsHere.length > 0) {
                                    slotsHere.forEach((slot, sIdx) => {
                                        if (sIdx > 0) exportHtml += `<hr style="border: 1px dashed #94a3b8; margin: 8px 0;">`;
                                        if(SPECIAL_SUBJECTS.includes(slot.subject)) {
                                            exportHtml += `<div style="font-weight:bold; font-size:16px; color:#000000; text-transform:uppercase;">${slot.subject}</div>`;
                                        } else {
                                            let subColor = '#000000';
                                            if (slot.subject.toUpperCase().includes('CHEMISTRY')) subColor = '#b91c1c';
                                            if (slot.subject.toUpperCase().includes('PHYSICS')) subColor = '#1d4ed8';
                                            if (slot.subject.toUpperCase().includes('MATH')) subColor = '#047857';
                                            exportHtml += `
                                                <div style="color: ${subColor}; font-size: 16px; font-weight: bold; text-transform: uppercase;">${slot.subject}</div>
                                                ${slot.remark ? `<div style="font-size: 12px; font-style: italic; color: #475569; margin-top:4px;">(${slot.remark})</div>` : ''}
                                                ${slot.teacher !== 'NONE' ? `<div style="font-size: 14px; color: #0f172a; font-weight: bold; margin-top:6px;">${slot.teacher}</div>` : ''}
                                                ${slot.room ? `<div style="font-size: 12px; color: #64748b; font-weight: bold; margin-top:2px;">RM: ${slot.room}</div>` : ''}
                                            `;
                                        }
                                    });
                                }
                                exportHtml += `</td>`;
                            });
                            exportHtml += `</tr>`;
                        });
                        exportHtml += `</tbody></table></div>`;
                    });

                } else {
                    let targetStructures = structureData;
                    if(scope.startsWith("CLASS|")) targetStructures = structureData.filter(s => s.className === scope.split('|')[1]);
                    if(scope.startsWith("SEC|")) targetStructures = structureData.filter(s => s.className === scope.split('|')[1] && s.sectionName === scope.split('|')[2]);

                    targetStructures.sort((a,b) => a.className.localeCompare(b.className) || a.sectionName.localeCompare(b.sectionName));

                    targetStructures.forEach(struct => {
                        const secSlots = allData.filter(t => t.className === struct.className && t.section === struct.sectionName);
                        if(secSlots.length === 0) return;
                        
                        const uniqueRanges = sortTimeRanges(secSlots.map(s => s.timeRange));
                        if(uniqueRanges.length === 0) return;

                        exportHtml += `
                            <div class="page-break" style="margin-bottom: 30px;">
                                <table border="1" cellpadding="8" style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; table-layout: auto;">
                                    <thead>
                                        <tr>
                                            <th colspan="${DAYS_OF_WEEK.length + 1}" style="font-size: 24px; background-color: #047857; color: #ffffff; padding: 12px; text-align: center; text-transform: uppercase;">
                                                ${struct.className} - SEC: ${struct.sectionName}
                                            </th>
                                        </tr>
                                        <tr>
                                            <th style="background-color: #f8fafc; color: #0f172a; width: 140px; font-size:14px; border: 2px solid #0f172a;">TIME / DAY</th>
                                            ${DAYS_OF_WEEK.map((day, idx) => `<th style="background-color: ${COL_COLORS[(idx + 1) % COL_COLORS.length]}; color: #0f172a; font-size:16px; border: 2px solid #0f172a;">${day}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>`;
                        
                        uniqueRanges.forEach(range => {
                            exportHtml += `<tr>
                                <td style="background-color: #f8fafc; color: #000000; font-weight: bold; text-align: center; font-size:14px; border: 2px solid #0f172a; white-space: nowrap;">${range}</td>`;
                            
                            DAYS_OF_WEEK.forEach((day, idx) => {
                                const slotsHere = secSlots.filter(s => s.day === day && s.timeRange === range);
                                const bgCol = COL_COLORS[(idx + 1) % COL_COLORS.length];
                                exportHtml += `<td style="background-color: ${bgCol}; text-align: center; vertical-align: top; border: 2px solid #0f172a; min-width: 140px;">`;
                                
                                if(slotsHere.length > 0) {
                                    slotsHere.forEach((slot, sIdx) => {
                                        if (sIdx > 0) exportHtml += `<hr style="border: 1px dashed #94a3b8; margin: 8px 0;">`;
                                        if(SPECIAL_SUBJECTS.includes(slot.subject)) {
                                            exportHtml += `<div style="font-weight:bold; font-size:16px; color:#000000; text-transform:uppercase;">${slot.subject}</div>`;
                                        } else {
                                            let subColor = '#000000';
                                            if (slot.subject.toUpperCase().includes('CHEMISTRY')) subColor = '#b91c1c';
                                            if (slot.subject.toUpperCase().includes('PHYSICS')) subColor = '#1d4ed8';
                                            if (slot.subject.toUpperCase().includes('MATH')) subColor = '#047857';
                                            exportHtml += `
                                                <div style="color: ${subColor}; font-size: 16px; font-weight: bold; text-transform: uppercase;">${slot.subject}</div>
                                                ${slot.remark ? `<div style="font-size: 12px; font-style: italic; color: #475569; margin-top:4px;">(${slot.remark})</div>` : ''}
                                                ${slot.teacher !== 'NONE' ? `<div style="font-size: 14px; color: #0f172a; font-weight: bold; margin-top:6px;">${slot.teacher}</div>` : ''}
                                                ${slot.room ? `<div style="font-size: 12px; color: #64748b; font-weight: bold; margin-top:2px;">RM: ${slot.room}</div>` : ''}
                                            `;
                                        }
                                    });
                                }
                                exportHtml += `</td>`;
                            });
                            exportHtml += `</tr>`;
                        });
                        exportHtml += `</tbody></table></div>`;
                    });
                }

                if (!exportHtml) exportHtml = "<h2 style='text-align:center; font-family:sans-serif;'>No schedule data found for the selected options.</h2>";

                wrapper.innerHTML = exportHtml;
                hiddenArea.innerHTML = exportHtml;
                
                document.getElementById('print-modal').classList.replace('flex', 'hidden');
                document.getElementById('export-preview-modal').classList.replace('hidden', 'flex');

            } catch(e) { 
                console.error(e);
                alert("Error formatting grid: " + e.message); 
            } finally { 
                btn.innerText = "Generate Layout"; btn.disabled = false; 
            }
        }

        function closeExportPreview() {
            document.getElementById('export-preview-modal').classList.replace('flex', 'hidden');
            document.getElementById('print-render-area').innerHTML = "";
            document.getElementById('export-table-wrapper').innerHTML = "";
        }

        function executeBrowserPrint() {
            document.getElementById('export-preview-modal').classList.replace('flex', 'hidden');
            setTimeout(() => { 
                window.print(); 
                document.getElementById('print-render-area').innerHTML = ""; 
            }, 300);
        }

        function exportToExcel() {
            const tableHTML = document.getElementById('export-table-wrapper').innerHTML;
            const fullHTML = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>${tableHTML}</body>
                </html>
            `;
            const blob = new Blob(['\ufeff', fullHTML], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Minerva_Timetable_Export.xls';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        init();
    </script>
