<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Master Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .tt-grid { display: flex; overflow-x: auto; gap: 2px; background: #e2e8f0; padding: 2px; }
        .tt-cell { 
            min-width: 150px; background: white; padding: 8px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; border: 1px solid #f1f5f9;
        }
        .tt-header { background: #1e3a8a; color: white; font-weight: 800; text-transform: uppercase; font-size: 10px; padding: 4px; width: 100%; border-radius: 6px; margin-bottom: 6px; }
        .tt-subject { font-weight: 900; color: #e11d48; font-size: 12px; line-height: 1.2; text-transform: uppercase; }
        .tt-teacher { font-weight: 700; color: #059669; font-size: 10px; margin-top: 4px; }
        .tt-sidebar { width: 130px; flex-shrink: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; text-align: center; border-bottom: 2px solid white; padding: 10px; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black text-slate-800 uppercase tracking-tighter">Master Timetable</h1>
        </div>
        <div class="flex gap-2">
            <select id="day-selector" onchange="loadTimetable()" class="bg-slate-100 border-none rounded-lg px-4 py-2 font-black text-[10px] uppercase outline-none focus:ring-2 focus:ring-blue-500">
                <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option>
            </select>
            <button onclick="openAddModal()" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-lg shadow-blue-200 active:scale-95 transition-all">Add Period +</button>
        </div>
    </header>

    <main class="p-4 sm:p-8 overflow-hidden">
        <div id="timetable-container" class="space-y-8">
            </div>
    </main>

    <div id="slot-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl">
            <h3 class="font-black text-slate-900 mb-6 uppercase tracking-tight text-center border-b pb-4">New Period Entry</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Class / Batch</label>
                    <select id="m-class" onchange="updateSectionDropdown()" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold outline-none cursor-pointer">
                        <option value="">Select Class...</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Section</label>
                    <select id="m-sec" onchange="updateSubjectDropdown()" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold outline-none cursor-pointer" disabled>
                        <option value="">Select Section...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Time Slot</label>
                    <input type="text" id="m-time" placeholder="e.g., 08:15 AM - 09:00 AM" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold outline-none uppercase placeholder-slate-300">
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Subject</label>
                    <select id="m-sub" onchange="highlightRelevantTeachers()" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold outline-none text-rose-600 cursor-pointer" disabled>
                        <option value="">Select Subject...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Teacher</label>
                    <select id="m-teacher" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl font-bold outline-none text-emerald-600 cursor-pointer">
                        <option value="NONE">No Teacher (Break/Assembly)</option>
                    </select>
                </div>

                <div class="flex gap-2 pt-4">
                    <button onclick="closeModal()" class="flex-1 font-black uppercase text-[10px] text-slate-400 bg-slate-50 rounded-xl py-3 hover:bg-slate-100">Cancel</button>
                    <button onclick="saveSlot()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest text-[10px] shadow-md active:scale-95">Save Entry</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];
        let allTeachers = [];

        async function init() {
            await Promise.all([fetchStructure(), fetchTeachers()]);
            loadTimetable();
        }

        // 1. Load Structure Data (Classes, Sections, Subjects)
        async function fetchStructure() {
            const snap = await db.collection("institute_structure").get();
            structureData = snap.docs.map(d => d.data());
            
            const classes = [...new Set(structureData.map(s => s.className))].sort();
            const classSelect = document.getElementById('m-class');
            classSelect.innerHTML = '<option value="">Select Class...</option>' + classes.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        // 2. Load Teachers
        async function fetchTeachers() {
            const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
            allTeachers = snap.docs.map(doc => {
                const data = doc.data();
                // Find name and department dynamically
                const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                
                return {
                    name: nameKey ? data.details[nameKey] : data.email,
                    dept: deptKey ? data.details[deptKey] : 'General'
                };
            });
            renderTeacherDropdown();
        }

        // --- CASCADING DROPDOWNS LOGIC ---
        function updateSectionDropdown() {
            const selClass = document.getElementById('m-class').value;
            const secSelect = document.getElementById('m-sec');
            const subSelect = document.getElementById('m-sub');
            
            if (!selClass) {
                secSelect.innerHTML = '<option value="">Select Section...</option>'; secSelect.disabled = true;
                subSelect.innerHTML = '<option value="">Select Subject...</option>'; subSelect.disabled = true;
                return;
            }

            const sections = structureData.filter(s => s.className === selClass).map(s => s.sectionName).sort();
            secSelect.innerHTML = '<option value="">Select Section...</option>' + sections.map(s => `<option value="${s}">${s}</option>`).join('');
            secSelect.disabled = false;
            updateSubjectDropdown(); // Reset subjects
        }

        function updateSubjectDropdown() {
            const selClass = document.getElementById('m-class').value;
            const selSec = document.getElementById('m-sec').value;
            const subSelect = document.getElementById('m-sub');

            if (!selSec) {
                subSelect.innerHTML = '<option value="">Select Subject...</option>'; subSelect.disabled = true;
                return;
            }

            // Find the exact mapping for this class + section
            const mapping = structureData.find(s => s.className === selClass && s.sectionName === selSec);
            if (mapping && mapping.subjects) {
                subSelect.innerHTML = '<option value="">Select Subject...</option>' + mapping.subjects.map(sub => `<option value="${sub}">${sub}</option>`).join('');
                subSelect.innerHTML += '<option value="BREAK / ASSEMBLY">BREAK / ASSEMBLY</option>'; // Always allow Break
                subSelect.disabled = false;
            }
            highlightRelevantTeachers();
        }

        function renderTeacherDropdown() {
            const tSelect = document.getElementById('m-teacher');
            tSelect.innerHTML = '<option value="NONE">No Teacher (Break/Assembly)</option>';
            allTeachers.forEach(t => {
                const deptString = Array.isArray(t.dept) ? t.dept.join(', ') : t.dept;
                tSelect.innerHTML += `<option value="${t.name}">Mr./Ms. ${t.name} (${deptString})</option>`;
            });
        }

        function highlightRelevantTeachers() {
            // Optional: You could write logic here to re-order the teacher dropdown so teachers matching the subject appear at the top.
        }

        // --- TIMETABLE RENDERING ---
        async function loadTimetable() {
            const day = document.getElementById('day-selector').value;
            const container = document.getElementById('timetable-container');
            container.innerHTML = '<div class="text-center py-20 font-black text-slate-300 animate-pulse uppercase tracking-widest text-[10px]">Cloud Syncing...</div>';

            const snap = await db.collection("timetable").where("day", "==", day).get();
            const allData = snap.docs.map(d => ({id: d.id, ...d.data()}));

            // Basic sort by time string
            allData.sort((a,b) => a.timeRange.localeCompare(b.timeRange));

            // Group by className -> then by sectionName
            const groupedData = {};
            allData.forEach(item => {
                if(!groupedData[item.className]) groupedData[item.className] = {};
                if(!groupedData[item.className][item.section]) groupedData[item.className][item.section] = [];
                groupedData[item.className][item.section].push(item);
            });

            container.innerHTML = "";
            
            if(Object.keys(groupedData).length === 0) {
                container.innerHTML = `<div class="text-center py-20 font-bold text-slate-400 uppercase tracking-widest text-xs border-2 border-dashed border-slate-200 rounded-3xl">No schedule entries for ${day}</div>`;
                return;
            }

            Object.keys(groupedData).sort().forEach(className => {
                let groupHtml = `
                    <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
                        <div class="bg-blue-600 text-white p-3 text-center font-black text-[11px] uppercase tracking-[0.2em] shadow-inner">${className}</div>
                        <div class="overflow-x-auto">`;
                
                Object.keys(groupedData[className]).sort().forEach(sectionName => {
                    const rowItems = groupedData[className][sectionName];
                    
                    groupHtml += `
                        <div class="flex border-b border-slate-100 last:border-0">
                            <div class="tt-sidebar">
                                <span class="opacity-50 text-[8px] tracking-widest">SEC</span><br>
                                ${sectionName}
                            </div>
                            <div class="flex flex-1 tt-grid">
                                ${rowItems.map(item => `
                                    <div class="tt-cell group relative" onclick="deleteSlot('${item.id}')">
                                        <div class="tt-header">${item.timeRange}</div>
                                        <div class="tt-subject">${item.subject}</div>
                                        <div class="tt-teacher">${item.teacher !== 'NONE' ? item.teacher : ''}</div>
                                        
                                        <div class="absolute inset-0 bg-red-600/90 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all cursor-pointer backdrop-blur-[2px]">
                                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                });
                
                groupHtml += `</div></div>`;
                container.innerHTML += groupHtml;
            });
        }

        async function saveSlot() {
            const data = {
                day: document.getElementById('day-selector').value,
                className: document.getElementById('m-class').value,
                section: document.getElementById('m-sec').value,
                timeRange: document.getElementById('m-time').value.toUpperCase(),
                subject: document.getElementById('m-sub').value,
                teacher: document.getElementById('m-teacher').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if(!data.className || !data.section || !data.timeRange || !data.subject) {
                return alert("Please fill all required fields!");
            }

            const btn = document.querySelector('button[onclick="saveSlot()"]');
            btn.innerText = "Saving..."; btn.disabled = true;

            try {
                await db.collection("timetable").add(data);
                closeModal();
                loadTimetable();
                document.getElementById('m-time').value = ''; // clear time for next entry
            } catch (err) {
                alert(err.message);
            } finally {
                btn.innerText = "Save Entry"; btn.disabled = false;
            }
        }

        async function deleteSlot(id) {
            if(confirm("Remove this period from the timetable?")) {
                await db.collection("timetable").doc(id).delete();
                loadTimetable();
            }
        }

        function openAddModal() { document.getElementById('slot-modal').classList.replace('hidden', 'flex'); }
        function closeModal() { document.getElementById('slot-modal').classList.replace('flex', 'hidden'); }

        init();
    </script>
</body>
</html>
