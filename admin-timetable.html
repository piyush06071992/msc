<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Master Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .tt-grid { display: flex; overflow-x: auto; gap: 2px; background: #e2e8f0; padding: 2px; min-height: 80px; }
        .tt-cell { min-width: 150px; background: white; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 1px solid #f1f5f9; }
        .tt-header { background: #1e3a8a; color: white; font-weight: 800; text-transform: uppercase; font-size: 10px; padding: 4px; width: 100%; border-radius: 6px; margin-bottom: 2px; }
        .tt-duration { font-size: 9px; font-weight: 900; color: #0284c7; margin-bottom: 4px; text-transform: uppercase; }
        .tt-subject { font-weight: 900; color: #e11d48; font-size: 12px; line-height: 1.2; text-transform: uppercase; }
        .tt-remark { font-size: 9px; font-style: italic; color: #64748b; font-weight: bold; margin-top: 2px; line-height: 1.1; text-align: center; }
        .tt-teacher { font-weight: 700; color: #059669; font-size: 10px; margin-top: 4px; }
        .tt-room { font-weight: 800; color: #94a3b8; font-size: 9px; margin-top: 2px; }
        .tt-sidebar { width: 130px; flex-shrink: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; text-align: center; border-bottom: 2px solid white; padding: 10px; }
        
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* EXPORT PREVIEW MODAL SETTINGS */
        #export-preview-modal { backdrop-filter: blur(5px); }
        #export-table-wrapper { max-height: 70vh; overflow: auto; background: white; padding: 1rem; border-radius: 10px; border: 1px solid #e2e8f0; }
        
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body * { visibility: hidden; }
            #print-render-area, #print-render-area * { visibility: visible; }
            #print-render-area { position: absolute; left: 0; top: 0; width: 100%; font-family: 'Arial', sans-serif; background: white; }
            .no-print { display: none !important; }
            .page-break { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            tfoot { display: table-footer-group; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm no-print">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black text-slate-800 uppercase tracking-tighter">Master Timetable</h1>
        </div>
        <div class="flex gap-2 items-center">
            <div class="bg-blue-50 rounded-lg flex items-center border border-blue-100 p-1">
                <select id="day-selector" onchange="loadTimetable()" class="bg-transparent text-blue-700 border-none px-4 py-1.5 font-black text-[12px] uppercase outline-none cursor-pointer">
                    <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option>
                </select>
            </div>
            
            <button onclick="openPrintModal()" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-emerald-500 transition-all ml-2">🖨️ Export / Print</button>
            <button onclick="window.location.href='admin-timetable-auth.html'" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-indigo-500 transition-all ml-2" title="Manage Staff Permissions">🔐 Delegations</button>
        </div>
    </header>

    <main class="p-4 sm:p-8 overflow-hidden transition-all duration-300" id="main-content">
        <div id="timetable-container" class="space-y-8"></div>
    </main>

    <div id="print-render-area" class="hidden"></div>

    <div id="export-preview-modal" class="fixed inset-0 bg-slate-900/70 z-[200] hidden flex-col items-center justify-center p-4 no-print">
        <div class="bg-white rounded-3xl p-6 w-full max-w-7xl shadow-2xl flex flex-col h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <h3 class="font-black text-slate-900 text-2xl uppercase tracking-tighter">Timetable Preview</h3>
                <div class="flex gap-3">
                    <button onclick="exportToExcel()" class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                        <span>📊</span> Download Excel
                    </button>
                    <button onclick="executeBrowserPrint()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all flex items-center gap-2">
                        <span>🖨️</span> Save PDF / Print
                    </button>
                    <button onclick="closeExportPreview()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-3 rounded-xl font-black uppercase tracking-widest text-xs transition-all">
                        ✕ Close
                    </button>
                </div>
            </div>
            
            <div id="export-table-wrapper" class="flex-1"></div>
        </div>
    </div>

    <div id="weekly-editor-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[200] hidden flex-col p-4 sm:p-6 no-print">
        <div class="bg-slate-100 w-full h-full rounded-[2rem] shadow-2xl flex flex-col overflow-hidden border border-slate-300">
            
            <div class="bg-white p-5 border-b border-slate-200 flex justify-between items-center shrink-0">
                <div>
                    <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Weekly Editor Board</h2>
                    <p id="weekly-editor-title" class="text-blue-600 font-bold text-sm uppercase tracking-widest mt-1">Class - Section</p>
                </div>
                <div class="flex gap-3 items-center">
                    <button onclick="saveWeeklySchedule()" id="weekly-save-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-black uppercase tracking-widest text-xs shadow-lg transition-all active:scale-95">Verify & Save Entire Week</button>
                    <button onclick="closeEditor()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-4 rounded-xl font-black uppercase tracking-widest text-xs transition-all">Close without saving</button>
                </div>
            </div>

            <div class="flex-1 overflow-x-auto overflow-y-hidden p-6 flex gap-6 items-start" id="weekly-columns-container">
                </div>
        </div>
    </div>

    <div id="print-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl">
            <h3 class="font-black text-slate-900 text-xl uppercase mb-6 border-b pb-4">Export Options</h3>
            
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Scope</label>
                    <select id="p-scope" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer">
                        <option value="ALL">Entire Institute</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Matrix Layout</label>
                    <select id="p-timeframe" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer text-blue-700">
                        <option value="DAY">Daily Matrix (Columns = Sections)</option>
                        <option value="WEEK">Weekly Matrix (Columns = Days)</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="document.getElementById('print-modal').classList.replace('flex', 'hidden')" class="flex-1 py-3 bg-slate-100 text-slate-600 font-black rounded-xl text-[10px] uppercase">Cancel</button>
                <button onclick="generateExportData()" id="print-exec-btn" class="flex-1 py-3 bg-blue-600 text-white font-black rounded-xl text-[10px] uppercase shadow-md">Generate Layout</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];
        let allTeachers = [];
        let currentDayTimetable = []; 
        let globalTimetable = []; // Stores entire DB for clash checks
        let currentEditClass = "";
        let currentEditSection = "";
        const SPECIAL_SUBJECTS = ['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'];
        const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        // Matrix colors applied inline for Excel compatibility
        const COL_COLORS = ['#f8fafc', '#f0fdf4', '#fefce8', '#eff6ff', '#faf5ff', '#fff1f2', '#f0fdfa'];

        async function init() {
            await Promise.all([fetchStructure(), fetchTeachers()]);
            loadTimetable();
        }

        async function fetchStructure() {
            const snap = await db.collection("institute_structure").orderBy("className").get();
            structureData = snap.docs.map(d => d.data());
            
            const pScope = document.getElementById('p-scope');
            pScope.innerHTML = '<option value="ALL">Entire Institute</option>';
            const grouped = {};
            structureData.forEach(s => {
                if(!grouped[s.className]) grouped[s.className] = [];
                grouped[s.className].push(s.sectionName);
            });
            Object.keys(grouped).forEach(c => {
                let optGroup = `<optgroup label="Print ${c} Only">`;
                optGroup += `<option value="CLASS|${c}">Entire ${c}</option>`;
                grouped[c].sort().forEach(sec => { optGroup += `<option value="SEC|${c}|${sec}">Section ${sec} Only</option>`; });
                optGroup += `</optgroup>`;
                pScope.innerHTML += optGroup;
            });
        }

        async function fetchTeachers() {
            const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
            allTeachers = snap.docs.map(doc => {
                const data = doc.data();
                const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                return { name: nameKey ? data.details[nameKey] : data.email, dept: deptKey ? data.details[deptKey] : 'General' };
            });
        }

        async function loadTimetable() {
            const day = document.getElementById('day-selector').value;
            const container = document.getElementById('timetable-container');
            container.innerHTML = '<div class="text-center py-20 font-black text-slate-300 animate-pulse uppercase tracking-widest text-[10px]">Cloud Syncing...</div>';

            const snap = await db.collection("timetable").where("day", "==", day).get();
            currentDayTimetable = snap.docs.map(d => ({id: d.id, ...d.data()}));

            const renderGroups = {};
            structureData.forEach(struct => {
                if(!renderGroups[struct.className]) renderGroups[struct.className] = {};
                renderGroups[struct.className][struct.sectionName] = []; 
            });

            currentDayTimetable.forEach(item => {
                if(renderGroups[item.className] && renderGroups[item.className][item.section]) renderGroups[item.className][item.section].push(item);
            });

            container.innerHTML = "";
            Object.keys(renderGroups).sort().forEach(className => {
                let groupHtml = `
                    <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200 class-group" data-class="${className}">
                        <div class="bg-blue-900 text-white p-3 text-center font-black text-[11px] uppercase tracking-[0.2em] shadow-inner">${className}</div>
                        <div class="overflow-x-auto">`;
                
                Object.keys(renderGroups[className]).sort().forEach(sectionName => {
                    const rowItems = renderGroups[className][sectionName].sort((a,b) => a.start24.localeCompare(b.start24));
                    groupHtml += `
                        <div class="flex border-b border-slate-100 last:border-0 relative section-row" data-section="${sectionName}">
                            <div class="tt-sidebar">
                                <span class="opacity-50 text-[8px] tracking-widest">SEC</span><br>${sectionName}
                                <button onclick="openEditor('${className}', '${sectionName}')" class="mt-3 px-3 py-1.5 bg-rose-600 text-white text-[8px] uppercase tracking-widest rounded-lg shadow-md hover:bg-rose-500 active:scale-95 transition-all no-print">Edit Week</button>
                            </div>
                            <div class="flex flex-1 tt-grid">
                                ${rowItems.length === 0 ? `<div class="w-full flex items-center justify-center text-slate-300 font-bold text-xs uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-xl m-2">No Schedule</div>` : ''}
                                ${rowItems.map(item => {
                                    let subColor = '#e11d48'; 
                                    if (item.subject === 'BREAK') subColor = '#94a3b8'; 
                                    else if (item.subject === 'ASSEMBLY') subColor = '#ea580c'; 
                                    else if (item.subject === 'EXAM') subColor = '#8b5cf6'; 
                                    else if (item.subject === 'EVENT') subColor = '#14b8a6'; 

                                    let detailsLine = '';
                                    if (item.room) {
                                        if (item.subject === 'BREAK') detailsLine = `${item.room}`;
                                        else if (item.subject === 'EXAM') detailsLine = `Exam: ${item.room}`; 
                                        else if (item.subject === 'EVENT') detailsLine = `Event: ${item.room}`; 
                                        else if (item.subject === 'ASSEMBLY') detailsLine = `Loc: ${item.room}`;
                                        else detailsLine = `RM: ${item.room}`;
                                    }

                                    return `
                                    <div class="tt-cell">
                                        <div class="tt-header">${item.timeRange}</div>
                                        <div class="tt-duration">${item.duration}</div>
                                        <div class="tt-subject" style="color: ${subColor}">${item.subject}</div>
                                        ${item.remark ? `<div class="tt-remark">(${item.remark})</div>` : ''}
                                        ${item.teacher !== 'NONE' ? `<div class="tt-teacher">${item.teacher}</div>` : ''}
                                        ${detailsLine ? `<div class="tt-room">${detailsLine}</div>` : ''}
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>`;
                });
                groupHtml += `</div></div>`;
                container.innerHTML += groupHtml;
            });
        }

        // --- NEW INLINE-STYLED EXPORT GENERATOR ---
        function openPrintModal() { document.getElementById('print-modal').classList.replace('hidden', 'flex'); }

        async function generateExportData() {
            const scope = document.getElementById('p-scope').value;
            const timeframe = document.getElementById('p-timeframe').value;
            const wrapper = document.getElementById('export-table-wrapper');
            const hiddenArea = document.getElementById('print-render-area');
            const btn = document.getElementById('print-exec-btn');
            
            btn.innerText = "Building..."; btn.disabled = true;

            try {
                const snap = await db.collection("timetable").get();
                const allData = snap.docs.map(d => d.data());

                const sortTimeRanges = (ranges) => {
                    const cleanRanges = ranges.filter(r => r && typeof r === 'string' && r.includes(' - '));
                    return [...new Set(cleanRanges)].sort((a,b) => {
                        const timeA = a.split(' - ')[0]; 
                        const timeB = b.split(' - ')[0];
                        return new Date('1970/01/01 ' + timeA) - new Date('1970/01/01 ' + timeB);
                    });
                };

                let exportHtml = "";

                if (timeframe === "DAY") {
                    const selectedDay = document.getElementById('day-selector').value;
                    const targetClasses = scope === "ALL" ? [...new Set(structureData.map(s => s.className))] : [scope.split('|')[1]];
                    
                    targetClasses.sort().forEach(cName => {
                        let targetSections = structureData.filter(s => s.className === cName).map(s => s.sectionName);
                        if (scope.startsWith("SEC|")) targetSections = [scope.split('|')[2]];
                        
                        const classSlots = allData.filter(t => t.className === cName && targetSections.includes(t.section) && t.day === selectedDay);
                        if(classSlots.length === 0) return; 
                        
                        const uniqueRanges = sortTimeRanges(classSlots.map(s => s.timeRange));
                        if(uniqueRanges.length === 0) return;
                        
                        exportHtml += `
                            <div class="page-break" style="margin-bottom: 30px;">
                                <table border="1" cellpadding="8" style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; table-layout: auto;">
                                    <thead>
                                        <tr>
                                            <th colspan="${targetSections.length + 1}" style="font-size: 24px; background-color: #1e3a8a; color: #ffffff; padding: 12px; text-align: center; text-transform: uppercase;">
                                                ${cName} - ${selectedDay}
                                            </th>
                                        </tr>
                                        <tr>
                                            <th style="background-color: #f8fafc; color: #0f172a; width: 140px; font-size:14px; border: 2px solid #0f172a;">TIME / SEC</th>
                                            ${targetSections.map((sec, idx) => `<th style="background-color: ${COL_COLORS[(idx + 1) % COL_COLORS.length]}; color: #0f172a; font-size:16px; border: 2px solid #0f172a;">${sec}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>`;
                        
                        uniqueRanges.forEach(range => {
                            exportHtml += `<tr>
                                <td style="background-color: #f8fafc; color: #000000; font-weight: bold; text-align: center; font-size:14px; border: 2px solid #0f172a; white-space: nowrap;">${range}</td>`;
                            
                            targetSections.forEach((sec, idx) => {
                                const slot = classSlots.find(s => s.section === sec && s.timeRange === range);
                                const bgCol = COL_COLORS[(idx + 1) % COL_COLORS.length];
                                
                                exportHtml += `<td style="background-color: ${bgCol}; text-align: center; vertical-align: top; border: 2px solid #0f172a; min-width: 140px;">`;
                                
                                if(slot) {
                                    if(SPECIAL_SUBJECTS.includes(slot.subject)) {
                                        exportHtml += `<div style="font-weight:bold; font-size:16px; color:#000000; text-transform:uppercase;">${slot.subject}</div>`;
                                    } else {
                                        let subColor = '#000000';
                                        if (slot.subject.toUpperCase().includes('CHEMISTRY')) subColor = '#b91c1c';
                                        if (slot.subject.toUpperCase().includes('PHYSICS')) subColor = '#1d4ed8';
                                        if (slot.subject.toUpperCase().includes('MATH')) subColor = '#047857';

                                        exportHtml += `
                                            <div style="color: ${subColor}; font-size: 16px; font-weight: bold; text-transform: uppercase;">${slot.subject}</div>
                                            ${slot.remark ? `<div style="font-size: 12px; font-style: italic; color: #475569; margin-top:4px;">(${slot.remark})</div>` : ''}
                                            ${slot.teacher !== 'NONE' ? `<div style="font-size: 14px; color: #0f172a; font-weight: bold; margin-top:6px;">${slot.teacher}</div>` : ''}
                                            ${slot.room ? `<div style="font-size: 12px; color: #64748b; font-weight: bold; margin-top:2px;">RM: ${slot.room}</div>` : ''}
                                        `;
                                    }
                                }
                                exportHtml += `</td>`;
                            });
                            exportHtml += `</tr>`;
                        });
                        exportHtml += `</tbody></table></div>`;
                    });

                } else {
                    let targetStructures = structureData;
                    if(scope.startsWith("CLASS|")) targetStructures = structureData.filter(s => s.className === scope.split('|')[1]);
                    if(scope.startsWith("SEC|")) targetStructures = structureData.filter(s => s.className === scope.split('|')[1] && s.sectionName === scope.split('|')[2]);

                    targetStructures.sort((a,b) => a.className.localeCompare(b.className) || a.sectionName.localeCompare(b.sectionName));

                    targetStructures.forEach(struct => {
                        const secSlots = allData.filter(t => t.className === struct.className && t.section === struct.sectionName);
                        if(secSlots.length === 0) return;
                        
                        const uniqueRanges = sortTimeRanges(secSlots.map(s => s.timeRange));
                        if(uniqueRanges.length === 0) return;

                        exportHtml += `
                            <div class="page-break" style="margin-bottom: 30px;">
                                <table border="1" cellpadding="8" style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; table-layout: auto;">
                                    <thead>
                                        <tr>
                                            <th colspan="${DAYS_OF_WEEK.length + 1}" style="font-size: 24px; background-color: #047857; color: #ffffff; padding: 12px; text-align: center; text-transform: uppercase;">
                                                ${struct.className} - SEC: ${struct.sectionName}
                                            </th>
                                        </tr>
                                        <tr>
                                            <th style="background-color: #f8fafc; color: #0f172a; width: 140px; font-size:14px; border: 2px solid #0f172a;">TIME / DAY</th>
                                            ${DAYS_OF_WEEK.map((day, idx) => `<th style="background-color: ${COL_COLORS[(idx + 1) % COL_COLORS.length]}; color: #0f172a; font-size:16px; border: 2px solid #0f172a;">${day}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>`;
                        
                        uniqueRanges.forEach(range => {
                            exportHtml += `<tr>
                                <td style="background-color: #f8fafc; color: #000000; font-weight: bold; text-align: center; font-size:14px; border: 2px solid #0f172a; white-space: nowrap;">${range}</td>`;
                            
                            DAYS_OF_WEEK.forEach((day, idx) => {
                                const slot = secSlots.find(s => s.day === day && s.timeRange === range);
                                const bgCol = COL_COLORS[(idx + 1) % COL_COLORS.length];
                                
                                exportHtml += `<td style="background-color: ${bgCol}; text-align: center; vertical-align: top; border: 2px solid #0f172a; min-width: 140px;">`;
                                
                                if(slot) {
                                    if(SPECIAL_SUBJECTS.includes(slot.subject)) {
                                        exportHtml += `<div style="font-weight:bold; font-size:16px; color:#000000; text-transform:uppercase;">${slot.subject}</div>`;
                                    } else {
                                        let subColor = '#000000';
                                        if (slot.subject.toUpperCase().includes('CHEMISTRY')) subColor = '#b91c1c';
                                        if (slot.subject.toUpperCase().includes('PHYSICS')) subColor = '#1d4ed8';
                                        if (slot.subject.toUpperCase().includes('MATH')) subColor = '#047857';

                                        exportHtml += `
                                            <div style="color: ${subColor}; font-size: 16px; font-weight: bold; text-transform: uppercase;">${slot.subject}</div>
                                            ${slot.remark ? `<div style="font-size: 12px; font-style: italic; color: #475569; margin-top:4px;">(${slot.remark})</div>` : ''}
                                            ${slot.teacher !== 'NONE' ? `<div style="font-size: 14px; color: #0f172a; font-weight: bold; margin-top:6px;">${slot.teacher}</div>` : ''}
                                            ${slot.room ? `<div style="font-size: 12px; color: #64748b; font-weight: bold; margin-top:2px;">RM: ${slot.room}</div>` : ''}
                                        `;
                                    }
                                }
                                exportHtml += `</td>`;
                            });
                            exportHtml += `</tr>`;
                        });
                        exportHtml += `</tbody></table></div>`;
                    });
                }

                if (!exportHtml) exportHtml = "<h2 style='text-align:center; font-family:sans-serif;'>No schedule data found for the selected options.</h2>";

                wrapper.innerHTML = exportHtml;
                hiddenArea.innerHTML = exportHtml;
                
                document.getElementById('print-modal').classList.replace('flex', 'hidden');
                document.getElementById('export-preview-modal').classList.replace('hidden', 'flex');

            } catch(e) { 
                console.error(e);
                alert("Error formatting grid: " + e.message); 
            } finally { 
                btn.innerText = "Generate Layout"; btn.disabled = false; 
            }
        }

        function closeExportPreview() {
            document.getElementById('export-preview-modal').classList.replace('flex', 'hidden');
            document.getElementById('print-render-area').innerHTML = "";
            document.getElementById('export-table-wrapper').innerHTML = "";
        }

        function executeBrowserPrint() {
            document.getElementById('export-preview-modal').classList.replace('flex', 'hidden');
            setTimeout(() => { 
                window.print(); 
                document.getElementById('print-render-area').innerHTML = ""; 
            }, 300);
        }

        function exportToExcel() {
            const tableHTML = document.getElementById('export-table-wrapper').innerHTML;
            const fullHTML = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="utf-8">
                    </head>
                <body>
                    ${tableHTML}
                </body>
                </html>
            `;
            const blob = new Blob(['\ufeff', fullHTML], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Minerva_Timetable_Export.xls';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- NEW FULL-SCREEN WEEKLY EDITOR ---
        async function openEditor(className, sectionName) {
            currentEditClass = className; 
            currentEditSection = sectionName;
            document.getElementById('weekly-editor-title').innerText = `${className} - Section ${sectionName}`;
            
            // 1. Fetch entire timetable instantly for global clash checks
            const snap = await db.collection("timetable").get();
            globalTimetable = snap.docs.map(d => ({id: d.id, ...d.data()}));

            // 2. Build the 6 columns dynamically
            let colsHtml = '';
            DAYS_OF_WEEK.forEach(day => {
                colsHtml += `
                    <div class="w-[360px] shrink-0 bg-slate-50 border border-slate-300 rounded-2xl flex flex-col shadow-sm max-h-full">
                        <div class="bg-slate-800 text-white p-3 rounded-t-2xl flex justify-between items-center shadow-md z-10">
                            <span class="font-black uppercase tracking-widest text-[13px]">${day}</span>
                            <button onclick="cloneDay('${day}')" class="text-[10px] bg-slate-700 hover:bg-blue-600 px-3 py-1.5 rounded font-bold uppercase tracking-widest transition-colors flex items-center gap-1" title="Copy this day to all other empty days">📋 Copy</button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="editor-rows-${day}"></div>
                        <div class="p-3 border-t border-slate-200 bg-white rounded-b-2xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                            <button onclick="addEmptyRow('${day}')" class="w-full py-3 bg-slate-50 border-2 border-dashed border-slate-300 text-slate-500 font-black text-[11px] uppercase rounded-xl hover:border-blue-400 hover:text-blue-600 transition-colors">+ Add Period</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('weekly-columns-container').innerHTML = colsHtml;

            // 3. Inject existing data
            const existingSlots = globalTimetable.filter(t => t.className === className && t.section === sectionName);
            
            DAYS_OF_WEEK.forEach(day => {
                const daySlots = existingSlots.filter(s => s.day === day).sort((a,b) => a.start24.localeCompare(b.start24));
                if (daySlots.length === 0) {
                    // Start with 1 empty row for convenience
                    addEmptyRow(day);
                } else {
                    daySlots.forEach(slot => addRowToEditor(day, slot.start24, slot.end24, slot.duration, slot.subject, slot.teacher, slot.room, slot.remark || ""));
                }
            });

            document.getElementById('weekly-editor-modal').classList.replace('hidden', 'flex');
            document.body.style.overflow = 'hidden'; 
        }

        function closeEditor() { 
            document.getElementById('weekly-editor-modal').classList.replace('flex', 'hidden'); 
            document.body.style.overflow = '';
        }

        function addEmptyRow(day) { 
            addRowToEditor(day, "", "", "", "BREAK", "NONE", "", ""); 
        }

        function addRowToEditor(day, sTime, eTime, duration, subject, teacher, room, remark) {
            const container = document.getElementById(`editor-rows-${day}`);
            const rowId = 'row_' + Date.now() + Math.random().toString(36).substr(2, 9);
            const struct = structureData.find(s => s.className === currentEditClass && s.sectionName === currentEditSection);
            const validSubjects = struct ? struct.subjects : [];
            const div = document.createElement('div');
            div.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm row-item transition-all";
            div.id = rowId;
            div.setAttribute('data-day', day); // Tag the row with its day for clash checking

            let subOptions = `<option value="BREAK">BREAK</option><option value="ASSEMBLY">ASSEMBLY</option><option value="EXAM">EXAM</option><option value="EVENT">EVENT</option>`;
            validSubjects.forEach(s => { subOptions += `<option value="${s}" ${s === subject ? 'selected' : ''}>${s}</option>`; });
            if (subject && !validSubjects.includes(subject) && !SPECIAL_SUBJECTS.includes(subject)) subOptions += `<option value="${subject}" selected>${subject}</option>`;

            // Vertical stacked block optimized for column layout
            div.innerHTML = `
                <div class="flex gap-2 w-full mb-3">
                    <input type="time" class="r-start flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-bold outline-none text-center focus:border-blue-400" value="${sTime}" onchange="calcDuration('${rowId}')">
                    <span class="flex items-center justify-center text-slate-400 font-bold">-</span>
                    <input type="time" class="r-end flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-bold outline-none text-center focus:border-blue-400" value="${eTime}" onchange="calcDuration('${rowId}')">
                </div>
                
                <select class="r-sub w-full mb-3 p-2 bg-slate-50 border border-slate-200 rounded-lg font-black text-rose-600 text-[11px] outline-none cursor-pointer" onchange="handleSubjectChange('${rowId}')">${subOptions}</select>
                
                <div class="flex gap-2 w-full mb-3 items-center r-teacher-wrapper">
                    <select class="r-teacher flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-emerald-600 text-[11px] outline-none cursor-pointer" data-selected="${teacher}" onchange="checkTeacherOccupancy('${rowId}')"></select>
                    <label class="text-[10px] font-black text-slate-400 flex items-center cursor-pointer uppercase tracking-widest shrink-0"><input type="checkbox" class="r-showall w-3 h-3 accent-blue-600 mr-1" onchange="handleSubjectChange('${rowId}')"> All</label>
                </div>

                <div class="flex gap-2 w-full mb-3">
                    <input type="text" class="r-room w-[35%] p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-[11px] outline-none placeholder-slate-400" placeholder="Room" value="${room}">
                    <input type="text" class="r-remark flex-1 p-2 bg-amber-50 border border-amber-200 rounded-lg font-bold text-[11px] text-amber-700 outline-none placeholder-amber-400" placeholder="Remarks (Opt)" value="${remark}">
                </div>

                <div class="flex justify-between items-center w-full mt-1 pt-3 border-t border-slate-100">
                    <span class="r-duration text-[10px] font-black text-blue-600 uppercase tracking-widest">${duration || '-- MINS'}</span>
                    <div class="r-teacher-warn text-[9px] font-bold text-amber-600 leading-tight text-right flex-1 mx-2"></div>
                    <button onclick="document.getElementById('${rowId}').remove()" class="text-slate-300 hover:text-red-500 bg-slate-50 hover:bg-red-50 p-2 rounded-lg transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                </div>
            `;
            container.appendChild(div);
            handleSubjectChange(rowId); 
        }

        function handleSubjectChange(rowId) {
            const row = document.getElementById(rowId);
            const sub = row.querySelector('.r-sub').value;
            const tWrapper = row.querySelector('.r-teacher-wrapper');
            const roomInput = row.querySelector('.r-room');
            const tSelect = row.querySelector('.r-teacher');

            if (SPECIAL_SUBJECTS.includes(sub)) {
                tWrapper.classList.add('hidden'); tSelect.value = "NONE";
                if (sub === 'BREAK') roomInput.placeholder = "Type (e.g. Lunch)";
                else if (sub === 'EXAM') roomInput.placeholder = "Name (e.g. Maths UT)";
                else if (sub === 'EVENT') roomInput.placeholder = "Name (e.g. Lecture)";
                else if (sub === 'ASSEMBLY') roomInput.placeholder = "Location";
            } else {
                tWrapper.classList.remove('hidden'); roomInput.placeholder = "Room No.";
                updateTeacherDropdown(rowId, sub);
            }
        }

        function calcDuration(rowId) {
            const row = document.getElementById(rowId);
            const s24 = row.querySelector('.r-start').value;
            const e24 = row.querySelector('.r-end').value;
            const durLabel = row.querySelector('.r-duration');
            if(!s24 || !e24) { durLabel.innerText = '-- MINS'; return; }
            const [sh, sm] = s24.split(':').map(Number);
            const [eh, em] = e24.split(':').map(Number);
            const totalMins = (eh * 60 + em) - (sh * 60 + sm);
            if (totalMins <= 0) { durLabel.innerText = 'INVALID'; durLabel.classList.replace('text-blue-600', 'text-red-600'); }
            else { durLabel.classList.replace('text-red-600', 'text-blue-600'); durLabel.innerText = `${totalMins} MINS`; }
            checkTeacherOccupancy(rowId); sortEditorRows(row.getAttribute('data-day'));
        }

        function sortEditorRows(day) {
            const container = document.getElementById(`editor-rows-${day}`);
            const rows = Array.from(container.querySelectorAll('.row-item'));
            rows.sort((a, b) => { return (a.querySelector('.r-start').value || "99:99").localeCompare(b.querySelector('.r-start').value || "99:99"); });
            rows.forEach(r => container.appendChild(r));
        }

        function format12Hour(time24) {
            if(!time24) return ""; let [h, m] = time24.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
        }

        function updateTeacherDropdown(rowId, subject) {
            const row = document.getElementById(rowId);
            const tSelect = row.querySelector('.r-teacher');
            const showAll = row.querySelector('.r-showall').checked;
            const prevSelected = tSelect.getAttribute('data-selected');

            tSelect.innerHTML = '<option value="NONE">No Teacher</option>';
            allTeachers.forEach(t => {
                const deptStr = Array.isArray(t.dept) ? t.dept.join(',').toLowerCase() : t.dept.toLowerCase();
                if (showAll || deptStr.includes(subject.toLowerCase())) {
                    const isSelected = (t.name === prevSelected) ? 'selected' : '';
                    tSelect.innerHTML += `<option value="${t.name}" ${isSelected}>${t.name} (${Array.isArray(t.dept) ? t.dept.join(',') : t.dept})</option>`;
                }
            });
            tSelect.setAttribute('data-selected', ''); checkTeacherOccupancy(rowId);
        }

        function checkTeacherOccupancy(rowId) {
            const row = document.getElementById(rowId);
            const tName = row.querySelector('.r-teacher').value;
            const warnLabel = row.querySelector('.r-teacher-warn');
            const s24 = row.querySelector('.r-start').value;
            const e24 = row.querySelector('.r-end').value;
            const rowDay = row.getAttribute('data-day');

            if (tName === "NONE" || !s24 || !e24) { warnLabel.innerText = ""; return; }
            const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
            const rStart = sh * 60 + sm; const rEnd = eh * 60 + em;

            // Check against global db (excluding the current section which we are replacing)
            const overlaps = globalTimetable.filter(slot => {
                if (slot.day !== rowDay) return false;
                if (slot.teacher !== tName) return false;
                if (slot.className === currentEditClass && slot.section === currentEditSection) return false;
                const [ssh, ssm] = slot.start24.split(':').map(Number); const [seh, sem] = slot.end24.split(':').map(Number);
                return (rStart < (seh * 60 + sem) && rEnd > (ssh * 60 + ssm));
            });
            if (overlaps.length > 0) warnLabel.innerText = `⚠️ Busy: ${overlaps.map(o => `${o.section} ${o.timeRange}`).join(', ')}.`;
            else warnLabel.innerText = "";
        }

        // --- NEW DUPLICATE DAY FUNCTION ---
        function cloneDay(sourceDay) {
            if(!confirm(`Do you want to copy ${sourceDay}'s schedule to all other empty days?`)) return;
            
            const sourceContainer = document.getElementById(`editor-rows-${sourceDay}`);
            const sourceRows = Array.from(sourceContainer.querySelectorAll('.row-item')).filter(r => r.querySelector('.r-start').value !== "");
            
            if(sourceRows.length === 0) return alert(`There is nothing scheduled on ${sourceDay} to copy!`);

            DAYS_OF_WEEK.forEach(targetDay => {
                if (targetDay === sourceDay) return;
                const targetContainer = document.getElementById(`editor-rows-${targetDay}`);
                const hasExistingData = Array.from(targetContainer.querySelectorAll('.row-item')).some(r => r.querySelector('.r-start').value !== "");
                
                // Only copy to days that are currently empty
                if (!hasExistingData) {
                    targetContainer.innerHTML = ""; // Clear the empty placeholders
                    sourceRows.forEach(row => {
                        const sTime = row.querySelector('.r-start').value;
                        const eTime = row.querySelector('.r-end').value;
                        const dur = row.querySelector('.r-duration').innerText;
                        const sub = row.querySelector('.r-sub').value;
                        const teacher = row.querySelector('.r-teacher').value;
                        const room = row.querySelector('.r-room').value;
                        const remark = row.querySelector('.r-remark').value;
                        
                        addRowToEditor(targetDay, sTime, eTime, dur, sub, teacher, room, remark);
                    });
                }
            });
        }

        async function saveWeeklySchedule() {
            const rows = Array.from(document.querySelectorAll('.row-item'));
            let baseSlots = []; 
            let conflictMsg = "";

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const day = row.getAttribute('data-day');
                const s24 = row.querySelector('.r-start').value; const e24 = row.querySelector('.r-end').value;
                const dur = row.querySelector('.r-duration').innerText; const sub = row.querySelector('.r-sub').value;
                const teacher = row.querySelector('.r-teacher').value || "NONE"; const room = row.querySelector('.r-room').value.trim();
                const remark = row.querySelector('.r-remark').value.trim();

                // Skip completely empty placeholder rows
                if (!s24 && !e24 && sub === 'BREAK') continue;

                if (!s24 || !e24) { conflictMsg = `Found a missing time on ${day}.`; break; }
                const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
                const sMins = sh * 60 + sm; const eMins = eh * 60 + em;

                if (sMins >= eMins) { conflictMsg = `Invalid Time for ${sub} on ${day}.`; break; }
                
                // Internal section overlap check
                for (let j = 0; j < baseSlots.length; j++) {
                    const prev = baseSlots[j];
                    if (prev.day === day && sMins < prev.eMins && eMins > prev.sMins) { conflictMsg = `🛑 CONFLICT on ${day}: ${sub} overlaps with ${prev.subject}.`; break; }
                }
                if(conflictMsg) break;

                const timeRange = `${format12Hour(s24)} - ${format12Hour(e24)}`;
                
                let teacherEmail = "";
                if (teacher !== "NONE") {
                    const tObj = allTeachers.find(t => t.name === teacher);
                    if (tObj) teacherEmail = tObj.email || ""; 
                }

                baseSlots.push({ day: day, className: currentEditClass, section: currentEditSection, start24: s24, end24: e24, timeRange, duration: dur, subject: sub, teacher, teacherName: teacher, teacherEmail: teacherEmail, room, remark, sMins, eMins });
            }

            if (conflictMsg) return alert(conflictMsg);
            const btn = document.getElementById('weekly-save-btn'); btn.innerText = "Saving to Database..."; btn.disabled = true;

            try {
                const batch = db.batch();

                // 1. Delete ALL existing slots for this entire section for the whole week
                const snap = await db.collection("timetable")
                    .where("className", "==", currentEditClass)
                    .where("section", "==", currentEditSection)
                    .get();
                snap.docs.forEach(doc => { batch.delete(doc.ref); });
                
                // 2. Add all new slots
                baseSlots.forEach(slot => {
                    const { sMins, eMins, ...cleanSlot } = slot;
                    batch.set(db.collection("timetable").doc(), cleanSlot);
                });

                await batch.commit(); 
                closeEditor(); 
                loadTimetable(); 
            } catch (err) { alert("Error saving: " + err.message); } 
            finally { btn.innerText = "Verify & Save Entire Week"; btn.disabled = false; }
        }

        init();
    </script>
