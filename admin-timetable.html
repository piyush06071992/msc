<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Admin | Timetable Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .timeline-track { min-width: 1200px; position: relative; height: 80px; background: #f8fafc; border-radius: 1rem; margin-bottom: 0.5rem; }
        .time-block { position: absolute; height: 60px; top: 10px; border-radius: 0.75rem; padding: 0.5rem; color: white; font-size: 10px; font-weight: 800; cursor: pointer; transition: all 0.2s; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
        .time-block:hover { transform: scale(1.02); z-index: 10; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <header class="h-20 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl transition-all">
                <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-xl font-black text-slate-800 uppercase tracking-tighter">Timeline Timetable</h1>
        </div>
        <div class="flex gap-3">
            <select id="day-selector" onchange="loadTimetable()" class="bg-blue-50 border-none rounded-xl px-4 py-2 font-black text-blue-700 text-xs uppercase tracking-widest outline-none">
                <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option>
            </select>
            <button onclick="openAddModal()" class="bg-blue-700 text-white px-6 py-2 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg shadow-blue-200 active:scale-95 transition-all">Add Slot +</button>
        </div>
    </header>

    <main class="p-4 sm:p-8">
        <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden">
            <div class="flex border-b border-slate-100 bg-slate-50 overflow-x-auto">
                <div class="w-48 shrink-0 p-4 border-r font-black text-[10px] uppercase text-slate-400 text-center">Class / Section</div>
                <div class="flex-1 relative min-w-[1200px] h-12">
                    <div class="absolute inset-0 flex">
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">08:00 AM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">09:00 AM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">10:00 AM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">11:00 AM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">12:00 PM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">01:00 PM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">02:00 PM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">03:00 PM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">04:00 PM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">05:00 PM</div>
                        <div class="flex-1 border-r border-slate-200 p-2 font-black text-[9px] text-slate-400">06:00 PM</div>
                        <div class="flex-1 p-2 font-black text-[9px] text-slate-400">07:00 PM</div>
                    </div>
                </div>
            </div>

            <div id="timetable-rows" class="overflow-x-auto">
                </div>
        </div>
    </main>

    <div id="slot-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl border border-white">
            <h3 class="text-xl font-black text-slate-900 mb-6 uppercase tracking-tighter">Add Schedule Block</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Class</label>
                        <select id="m-class" class="w-full p-3 bg-slate-100 rounded-xl font-bold outline-none border-none">
                            <option>Class 10</option><option>Class 11</option><option>Class 12</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Section</label>
                        <input type="text" id="m-sec" placeholder="e.g. A" class="w-full p-3 bg-slate-100 rounded-xl font-bold outline-none border-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Start Time</label>
                        <input type="time" id="m-start" class="w-full p-3 bg-slate-100 rounded-xl font-bold outline-none border-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">End Time</label>
                        <input type="time" id="m-end" class="w-full p-3 bg-slate-100 rounded-xl font-bold outline-none border-none">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Subject / Activity</label>
                    <input type="text" id="m-sub" placeholder="e.g. Maths, Break, Test" class="w-full p-3 bg-slate-100 rounded-xl font-bold outline-none border-none">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Teacher & Room</label>
                    <div class="flex gap-2">
                        <select id="m-teacher" class="flex-1 p-3 bg-slate-100 rounded-xl font-bold outline-none border-none"></select>
                        <input type="text" id="m-room" placeholder="RM 1" class="w-24 p-3 bg-slate-100 rounded-xl font-bold outline-none border-none">
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal()" class="flex-1 py-4 text-slate-400 font-black uppercase text-[10px]">Cancel</button>
                    <button onclick="saveSlot()" class="flex-1 py-4 bg-blue-700 text-white rounded-2xl font-black uppercase text-[10px] shadow-lg">Save Block</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const COLORS = ['#1d4ed8', '#059669', '#7c3aed', '#db2777', '#ea580c', '#4b5563'];

        async function init() {
            await fetchTeachers();
            loadTimetable();
        }

        async function fetchTeachers() {
            const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
            const sel = document.getElementById('m-teacher');
            sel.innerHTML = '<option value="">Select Teacher</option>';
            snap.forEach(doc => {
                const name = doc.data().details['Staff Name'] || doc.data().email;
                sel.innerHTML += `<option value="${name}">${name}</option>`;
            });
            sel.innerHTML += `<option value="NONE">No Teacher / Break</option>`;
        }

        async function loadTimetable() {
            const day = document.getElementById('day-selector').value;
            const area = document.getElementById('timetable-rows');
            area.innerHTML = '<div class="p-20 text-center text-slate-300 font-black animate-pulse">LOADING...</div>';

            const snap = await db.collection("timetable").where("day", "==", day).get();
            const data = snap.docs.map(d => ({id: d.id, ...d.data()}));

            // Group by Class + Section
            const groups = {};
            data.forEach(item => {
                const key = `${item.className}-${item.section}`;
                if(!groups[key]) groups[key] = [];
                groups[key].push(item);
            });

            area.innerHTML = "";
            Object.keys(groups).sort().forEach(key => {
                const [cName, sName] = key.split('-');
                let rowHtml = `
                    <div class="flex border-b border-slate-50 items-center">
                        <div class="w-48 shrink-0 p-6 border-r bg-white sticky left-0 z-20">
                            <h4 class="font-black text-slate-900 text-sm">${cName}</h4>
                            <p class="text-blue-600 font-bold text-[10px] uppercase">Section ${sName}</p>
                        </div>
                        <div class="flex-1 timeline-track">
                            ${groups[key].map(slot => renderSlot(slot)).join('')}
                        </div>
                    </div>`;
                area.innerHTML += rowHtml;
            });
        }

        function renderSlot(slot) {
            // Logic to convert time (e.g. 09:30) to percentage width
            // Timeline range: 8 AM to 8 PM (12 hours)
            const startHour = 8;
            const totalHours = 12;
            
            const [sh, sm] = slot.startTime.split(':').map(Number);
            const [eh, em] = slot.endTime.split(':').map(Number);
            
            const startPct = (((sh - startHour) * 60) + sm) / (totalHours * 60) * 100;
            const endPct = (((eh - startHour) * 60) + em) / (totalHours * 60) * 100;
            const width = endPct - startPct;
            
            const color = slot.subject.toLowerCase().includes('break') ? '#94a3b8' : COLORS[Math.floor(Math.random() * COLORS.length)];

            return `
                <div class="time-block" style="left: ${startPct}%; width: ${width}%; background: ${color}" onclick="deleteSlot('${slot.id}')">
                    <span class="truncate">${slot.subject}</span>
                    <span class="opacity-80 text-[8px] truncate">${slot.teacher} | ${slot.room}</span>
                    <span class="mt-1 font-black opacity-60">${slot.startTime}-${slot.endTime}</span>
                </div>`;
        }

        async function saveSlot() {
            const data = {
                day: document.getElementById('day-selector').value,
                className: document.getElementById('m-class').value,
                section: document.getElementById('m-sec').value,
                startTime: document.getElementById('m-start').value,
                endTime: document.getElementById('m-end').value,
                subject: document.getElementById('m-sub').value,
                teacher: document.getElementById('m-teacher').value,
                room: document.getElementById('m-room').value
            };

            if(!data.startTime || !data.endTime) return alert("Fill times!");

            await db.collection("timetable").add(data);
            closeModal();
            loadTimetable();
        }

        async function deleteSlot(id) {
            if(confirm("Delete this schedule block?")) {
                await db.collection("timetable").doc(id).delete();
                loadTimetable();
            }
        }

        function openAddModal() { document.getElementById('slot-modal').classList.replace('hidden', 'flex'); }
        function closeModal() { document.getElementById('slot-modal').classList.replace('flex', 'hidden'); }

        init();
    </script>
</body>
</html>
