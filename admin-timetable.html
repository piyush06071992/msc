<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Master Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .tt-grid { display: flex; overflow-x: auto; gap: 2px; background: #e2e8f0; padding: 2px; min-height: 80px; }
        .tt-cell { 
            min-width: 150px; background: white; padding: 8px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; border: 1px solid #f1f5f9;
        }
        .tt-header { background: #1e3a8a; color: white; font-weight: 800; text-transform: uppercase; font-size: 10px; padding: 4px; width: 100%; border-radius: 6px; margin-bottom: 6px; }
        .tt-subject { font-weight: 900; color: #e11d48; font-size: 12px; line-height: 1.2; text-transform: uppercase; }
        .tt-teacher { font-weight: 700; color: #059669; font-size: 10px; margin-top: 4px; }
        .tt-room { font-weight: 800; color: #94a3b8; font-size: 8px; margin-top: 2px; }
        .tt-sidebar { width: 130px; flex-shrink: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; text-align: center; border-bottom: 2px solid white; padding: 10px; position: relative; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black text-slate-800 uppercase tracking-tighter">Master Timetable</h1>
        </div>
        <div class="flex gap-2">
            <select id="day-selector" onchange="loadTimetable()" class="bg-blue-50 text-blue-700 border-none rounded-lg px-6 py-2 font-black text-[12px] uppercase outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option>
            </select>
        </div>
    </header>

    <main class="p-4 sm:p-8 overflow-hidden">
        <div id="timetable-container" class="space-y-8">
            </div>
    </main>

    <div id="editor-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 max-w-4xl w-full shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <div>
                    <h3 class="font-black text-slate-900 text-xl uppercase tracking-tight">Edit Daily Schedule</h3>
                    <p id="editor-title" class="text-rose-600 font-bold text-xs uppercase tracking-widest">Class - Section</p>
                </div>
                <button onclick="closeEditor()" class="text-slate-400 hover:text-red-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            
            <div class="flex-1 overflow-y-auto pr-2 space-y-3" id="editor-rows">
                </div>

            <div class="mt-4 pt-4 border-t border-slate-100 flex justify-between items-center">
                <button onclick="addEmptyRow()" class="px-4 py-2 bg-slate-100 text-slate-600 font-black text-[10px] uppercase rounded-xl hover:bg-slate-200 transition-colors">+ Add Blank Period / Break</button>
                <button onclick="saveSchedule()" id="save-btn" class="px-8 py-3 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest text-xs shadow-md active:scale-95 transition-all">Save Full Day</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];
        let allTeachers = [];
        let currentEditClass = "";
        let currentEditSection = "";

        async function init() {
            await Promise.all([fetchStructure(), fetchTeachers()]);
            loadTimetable();
        }

        async function fetchStructure() {
            const snap = await db.collection("institute_structure").orderBy("className").get();
            structureData = snap.docs.map(d => d.data());
        }

        async function fetchTeachers() {
            const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
            allTeachers = snap.docs.map(doc => {
                const data = doc.data();
                const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                
                return {
                    name: nameKey ? data.details[nameKey] : data.email,
                    dept: deptKey ? data.details[deptKey] : 'General'
                };
            });
        }

        // --- MAIN RENDER LOGIC ---
        async function loadTimetable() {
            const day = document.getElementById('day-selector').value;
            const container = document.getElementById('timetable-container');
            container.innerHTML = '<div class="text-center py-20 font-black text-slate-300 animate-pulse uppercase tracking-widest text-[10px]">Cloud Syncing...</div>';

            const snap = await db.collection("timetable").where("day", "==", day).get();
            const allData = snap.docs.map(d => ({id: d.id, ...d.data()}));

            // We must render EVERY section from structureData, even if empty
            const renderGroups = {};
            structureData.forEach(struct => {
                if(!renderGroups[struct.className]) renderGroups[struct.className] = {};
                renderGroups[struct.className][struct.sectionName] = []; // initialize empty array
            });

            // Fill arrays with existing timetable data
            allData.forEach(item => {
                if(renderGroups[item.className] && renderGroups[item.className][item.section]) {
                    renderGroups[item.className][item.section].push(item);
                }
            });

            container.innerHTML = "";
            
            Object.keys(renderGroups).sort().forEach(className => {
                let groupHtml = `
                    <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200">
                        <div class="bg-blue-900 text-white p-3 text-center font-black text-[11px] uppercase tracking-[0.2em] shadow-inner">${className}</div>
                        <div class="overflow-x-auto">`;
                
                Object.keys(renderGroups[className]).sort().forEach(sectionName => {
                    // Sort items by time string (basic sort)
                    const rowItems = renderGroups[className][sectionName].sort((a,b) => a.timeRange.localeCompare(b.timeRange));
                    
                    groupHtml += `
                        <div class="flex border-b border-slate-100 last:border-0 relative">
                            <div class="tt-sidebar">
                                <span class="opacity-50 text-[8px] tracking-widest">SEC</span><br>
                                ${sectionName}
                                <button onclick="openEditor('${className}', '${sectionName}')" class="mt-3 px-3 py-1.5 bg-rose-600 text-white text-[8px] uppercase tracking-widest rounded-lg shadow-md hover:bg-rose-500 active:scale-95 transition-all">Edit Day</button>
                            </div>
                            <div class="flex flex-1 tt-grid">
                                ${rowItems.length === 0 ? `<div class="w-full flex items-center justify-center text-slate-300 font-bold text-xs uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-xl m-2">No Schedule. Click Edit Day.</div>` : ''}
                                
                                ${rowItems.map(item => `
                                    <div class="tt-cell">
                                        <div class="tt-header">${item.timeRange}</div>
                                        <div class="tt-subject">${item.subject}</div>
                                        <div class="tt-teacher">${item.teacher !== 'NONE' ? item.teacher : ''}</div>
                                        ${item.room ? `<div class="tt-room">RM: ${item.room}</div>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                });
                
                groupHtml += `</div></div>`;
                container.innerHTML += groupHtml;
            });
        }

        // --- SMART EDITOR LOGIC ---
        async function openEditor(className, sectionName) {
            currentEditClass = className;
            currentEditSection = sectionName;
            document.getElementById('editor-title').innerText = `${className} - Section ${sectionName}`;
            
            const day = document.getElementById('day-selector').value;
            const container = document.getElementById('editor-rows');
            container.innerHTML = '<div class="text-center py-4 text-xs font-bold text-slate-400">Loading...</div>';
            document.getElementById('editor-modal').classList.replace('hidden', 'flex');

            // 1. Get existing slots for this day/class/section
            const snap = await db.collection("timetable")
                .where("day", "==", day)
                .where("className", "==", className)
                .where("section", "==", sectionName)
                .get();
            
            let existingSlots = snap.docs.map(d => d.data()).sort((a,b) => a.timeRange.localeCompare(b.timeRange));

            // 2. If empty, auto-generate based on structure
            if (existingSlots.length === 0) {
                const struct = structureData.find(s => s.className === className && s.sectionName === sectionName);
                if (struct && struct.subjects) {
                    existingSlots = struct.subjects.map(sub => ({
                        timeRange: "", subject: sub, teacher: "", room: ""
                    }));
                }
            }

            container.innerHTML = "";
            existingSlots.forEach(slot => addRowToEditor(slot.timeRange, slot.subject, slot.teacher, slot.room));
        }

        function addEmptyRow() {
            addRowToEditor("", "BREAK / ASSEMBLY", "NONE", "");
        }

        function addRowToEditor(time, subject, teacher, room) {
            const container = document.getElementById('editor-rows');
            const rowId = 'row_' + Date.now() + Math.random().toString(36).substr(2, 9);
            
            // Get valid subjects for this section to build dropdown
            const struct = structureData.find(s => s.className === currentEditClass && s.sectionName === currentEditSection);
            const validSubjects = struct ? struct.subjects : [];
            
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-slate-50 p-3 rounded-2xl border border-slate-200 row-item";
            div.id = rowId;

            let subOptions = `<option value="BREAK / ASSEMBLY">BREAK / ASSEMBLY</option>`;
            validSubjects.forEach(s => { subOptions += `<option value="${s}" ${s === subject ? 'selected' : ''}>${s}</option>`; });
            // Add current subject if it was somehow deleted from structure but exists in history
            if (subject && !validSubjects.includes(subject) && subject !== "BREAK / ASSEMBLY") {
                subOptions += `<option value="${subject}" selected>${subject}</option>`;
            }

            div.innerHTML = `
                <input type="text" class="r-time w-[20%] p-3 bg-white border border-slate-200 rounded-xl font-bold text-xs outline-none uppercase placeholder-slate-300 focus:border-blue-400" placeholder="08:00 AM - 09:00 AM" value="${time}">
                
                <select class="r-sub w-[25%] p-3 bg-white border border-slate-200 rounded-xl font-black text-rose-600 text-xs outline-none cursor-pointer" onchange="updateTeacherDropdown('${rowId}')">
                    ${subOptions}
                </select>

                <div class="w-[35%] flex flex-col">
                    <select class="r-teacher w-full p-3 bg-white border border-slate-200 rounded-xl font-bold text-emerald-600 text-xs outline-none cursor-pointer" data-selected="${teacher}">
                        </select>
                    <label class="text-[9px] font-black text-slate-400 mt-1 flex items-center gap-1 cursor-pointer uppercase tracking-widest pl-1">
                        <input type="checkbox" class="r-showall custom-checkbox" onchange="updateTeacherDropdown('${rowId}')"> Show All Staff
                    </label>
                </div>

                <input type="text" class="r-room w-[15%] p-3 bg-white border border-slate-200 rounded-xl font-bold text-xs outline-none placeholder-slate-300" placeholder="Room" value="${room}">
                
                <button onclick="document.getElementById('${rowId}').remove()" class="w-[5%] text-slate-300 hover:text-red-500 transition-colors flex justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
            `;
            container.appendChild(div);
            updateTeacherDropdown(rowId);
        }

        // The Smart Filter
        function updateTeacherDropdown(rowId) {
            const row = document.getElementById(rowId);
            const sub = row.querySelector('.r-sub').value;
            const tSelect = row.querySelector('.r-teacher');
            const showAll = row.querySelector('.r-showall').checked;
            const previouslySelected = tSelect.getAttribute('data-selected');

            tSelect.innerHTML = '<option value="NONE">No Teacher</option>';

            allTeachers.forEach(t => {
                const deptStr = Array.isArray(t.dept) ? t.dept.join(',').toLowerCase() : t.dept.toLowerCase();
                
                // Show if "Show All" is checked OR if their department matches the subject
                if (showAll || deptStr.includes(sub.toLowerCase())) {
                    const deptDisplay = Array.isArray(t.dept) ? t.dept.join(',') : t.dept;
                    const isSelected = (t.name === previouslySelected) ? 'selected' : '';
                    tSelect.innerHTML += `<option value="${t.name}" ${isSelected}>${t.name} (${deptDisplay})</option>`;
                }
            });
            // Clear the attribute so manual changes work next time
            tSelect.setAttribute('data-selected', ''); 
        }

        async function saveSchedule() {
            const day = document.getElementById('day-selector').value;
            const rows = document.querySelectorAll('.row-item');
            
            let newSlots = [];
            let hasError = false;

            rows.forEach(row => {
                const time = row.querySelector('.r-time').value.trim().toUpperCase();
                const sub = row.querySelector('.r-sub').value;
                const teacher = row.querySelector('.r-teacher').value;
                const room = row.querySelector('.r-room').value.trim();

                if (!time) hasError = true;
                newSlots.push({ day, className: currentEditClass, section: currentEditSection, timeRange: time, subject: sub, teacher, room });
            });

            if (hasError) return alert("Please ensure all rows have a Time Slot entered (or delete empty rows).");

            const btn = document.getElementById('save-btn');
            btn.innerText = "Saving..."; btn.disabled = true;

            try {
                // 1. Delete old slots for this day/class/section
                const snap = await db.collection("timetable")
                    .where("day", "==", day).where("className", "==", currentEditClass).where("section", "==", currentEditSection).get();
                
                const batch = db.batch();
                snap.docs.forEach(doc => { batch.delete(doc.ref); });

                // 2. Add new slots
                newSlots.forEach(slot => {
                    const newRef = db.collection("timetable").doc();
                    batch.set(newRef, slot);
                });

                await batch.commit();
                closeEditor();
                loadTimetable();
            } catch (err) {
                alert("Error saving: " + err.message);
            } finally {
                btn.innerText = "Save Full Day"; btn.disabled = false;
            }
        }

        function closeEditor() { document.getElementById('editor-modal').classList.replace('flex', 'hidden'); }

        init();
    </script>
</body>
</html>
