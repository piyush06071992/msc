<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Master Timetable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        .tt-grid { display: flex; overflow-x: auto; gap: 2px; background: #e2e8f0; padding: 2px; min-height: 80px; }
        .tt-cell { min-width: 150px; background: white; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 1px solid #f1f5f9; }
        .tt-header { background: #1e3a8a; color: white; font-weight: 800; text-transform: uppercase; font-size: 10px; padding: 4px; width: 100%; border-radius: 6px; margin-bottom: 2px; }
        .tt-duration { font-size: 9px; font-weight: 900; color: #0284c7; margin-bottom: 4px; text-transform: uppercase; }
        .tt-subject { font-weight: 900; color: #e11d48; font-size: 12px; line-height: 1.2; text-transform: uppercase; }
        .tt-remark { font-size: 9px; font-style: italic; color: #64748b; font-weight: bold; margin-top: 2px; line-height: 1.1; text-align: center; }
        .tt-teacher { font-weight: 700; color: #059669; font-size: 10px; margin-top: 4px; }
        .tt-room { font-weight: 800; color: #94a3b8; font-size: 9px; margin-top: 2px; }
        .tt-sidebar { width: 130px; flex-shrink: 0; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; text-align: center; border-bottom: 2px solid white; padding: 10px; }
        
        #editor-drawer { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .drawer-open { transform: translateX(0%); }
        .drawer-closed { transform: translateX(100%); }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* NOTICEBOARD MATRIX PRINT SETTINGS */
        @media print {
            @page { size: A4 landscape; margin: 8mm; }
            body * { visibility: hidden; }
            #print-render-area, #print-render-area * { visibility: visible; }
            #print-render-area { position: absolute; left: 0; top: 0; width: 100%; font-family: 'Arial', sans-serif; background: white; }
            .no-print { display: none !important; }
            .page-break { page-break-after: always; }
            
            /* Clean Matrix Styling matching your reference images */
            .matrix-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
            .matrix-table th, .matrix-table td { border: 2px solid #1e293b; padding: 6px; text-align: center; }
            .matrix-time-header { background-color: #fef08a !important; color: #000 !important; font-size: 12px; font-weight: 900; -webkit-print-color-adjust: exact; }
            .matrix-section-cell { font-weight: 900; font-size: 16px; text-transform: uppercase; color: white !important; -webkit-print-color-adjust: exact; }
            .matrix-content-cell { vertical-align: top; background-color: white !important; -webkit-print-color-adjust: exact; }
            .matrix-subject { font-size: 13px; font-weight: 900; text-transform: uppercase; margin-bottom: 2px; }
            .matrix-teacher { font-size: 11px; font-weight: bold; color: #0f172a; margin-top: 4px; }
            .matrix-remark { font-size: 10px; font-style: italic; color: #475569; font-weight: bold; }
            .matrix-room { font-size: 10px; font-weight: bold; color: #64748b; margin-top: 2px; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-20">

    <header class="h-16 bg-white border-b flex justify-between items-center px-6 sticky top-0 z-50 shadow-sm no-print">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='admin.html'" class="p-2 hover:bg-slate-100 rounded-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h1 class="text-lg font-black text-slate-800 uppercase tracking-tighter">Master Timetable</h1>
        </div>
        <div class="flex gap-2 items-center">
            <div class="bg-blue-50 rounded-lg flex items-center border border-blue-100 p-1">
                <select id="day-selector" onchange="loadTimetable()" class="bg-transparent text-blue-700 border-none px-4 py-1.5 font-black text-[12px] uppercase outline-none cursor-pointer">
                    <option value="Monday">Monday</option><option value="Tuesday">Tuesday</option><option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option><option value="Friday">Friday</option><option value="Saturday">Saturday</option>
                </select>
                <button onclick="openCopyModal()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-[10px] font-black uppercase hover:bg-blue-500 shadow-sm" title="Replicate this day's schedule">📋 Copy Day</button>
            </div>
            
            <button onclick="openPrintModal()" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-emerald-500 transition-all ml-2">🖨️ Print Setup</button>
            <button onclick="window.location.href='admin-timetable-auth.html'" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-md hover:bg-indigo-500 transition-all ml-2" title="Manage Staff Permissions">🔐 Delegations</button>
        </div>
    </header>

    <main class="p-4 sm:p-8 overflow-hidden transition-all duration-300" id="main-content">
        <div id="timetable-container" class="space-y-8"></div>
    </main>

    <div id="print-render-area"></div>

    <div id="editor-drawer" class="fixed top-0 right-0 w-[500px] h-full bg-white shadow-[0_0_40px_rgba(0,0,0,0.2)] z-[100] drawer-closed flex flex-col no-print border-l border-slate-200">
        <div class="p-5 border-b border-slate-100 bg-slate-50 flex justify-between items-start">
            <div>
                <h3 class="font-black text-slate-900 text-xl uppercase tracking-tight">Edit Schedule</h3>
                <p id="editor-title" class="text-rose-600 font-bold text-xs uppercase tracking-widest">Class - Section</p>
            </div>
            <button onclick="closeEditor()" class="text-slate-400 hover:text-red-500 p-2 bg-white rounded-lg shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>

        <div class="p-4 border-b border-slate-100 bg-indigo-50/50 flex gap-2 items-center">
            <select id="template-selector" class="flex-1 p-2 bg-white border border-indigo-100 rounded-lg text-[10px] font-black text-indigo-700 uppercase outline-none cursor-pointer">
                <option value="">-- Load Template --</option>
            </select>
            <button onclick="loadTemplate()" class="px-3 py-2 bg-indigo-600 text-white rounded-lg font-black text-[9px] uppercase shadow-sm">Load</button>
            <button onclick="saveAsTemplate()" class="px-3 py-2 bg-white text-indigo-600 border border-indigo-200 rounded-lg font-black text-[9px] uppercase shadow-sm hover:bg-indigo-50">Save As</button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-white" id="editor-rows"></div>

        <div class="p-5 border-t border-slate-100 bg-slate-50 flex flex-col gap-3">
            <button onclick="addEmptyRow()" class="w-full py-2 bg-white border-2 border-dashed border-slate-300 text-slate-500 font-black text-[10px] uppercase rounded-xl hover:border-blue-400 hover:text-blue-600 transition-colors">+ Add Blank Period</button>
            
            <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-xl mt-2">
                <label class="block text-[9px] font-black text-indigo-800 uppercase tracking-widest mb-2">Apply this schedule to:</label>
                <div class="flex flex-wrap gap-2" id="multi-day-checkboxes">
                    <label class="flex items-center gap-1 text-[10px] font-bold text-slate-600 cursor-pointer"><input type="checkbox" value="Monday" class="day-cb accent-indigo-600"> Mon</label>
                    <label class="flex items-center gap-1 text-[10px] font-bold text-slate-600 cursor-pointer"><input type="checkbox" value="Tuesday" class="day-cb accent-indigo-600"> Tue</label>
                    <label class="flex items-center gap-1 text-[10px] font-bold text-slate-600 cursor-pointer"><input type="checkbox" value="Wednesday" class="day-cb accent-indigo-600"> Wed</label>
                    <label class="flex items-center gap-1 text-[10px] font-bold text-slate-600 cursor-pointer"><input type="checkbox" value="Thursday" class="day-cb accent-indigo-600"> Thu</label>
                    <label class="flex items-center gap-1 text-[10px] font-bold text-slate-600 cursor-pointer"><input type="checkbox" value="Friday" class="day-cb accent-indigo-600"> Fri</label>
                    <label class="flex items-center gap-1 text-[10px] font-bold text-slate-600 cursor-pointer"><input type="checkbox" value="Saturday" class="day-cb accent-indigo-600"> Sat</label>
                </div>
            </div>

            <button onclick="saveSchedule()" id="save-btn" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-all">Verify & Save</button>
        </div>
    </div>

    <div id="copy-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl">
            <h3 class="font-black text-slate-900 text-xl uppercase mb-2">Replicate Schedule</h3>
            <p class="text-sm text-slate-500 font-medium mb-6">Copy the entire <span id="copy-source-lbl" class="font-bold text-blue-600">Monday</span> timetable to:</p>
            
            <div class="grid grid-cols-2 gap-3 mb-6" id="copy-targets">
                <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50"><input type="checkbox" value="Monday" class="cb-copy"> Monday</label>
                <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50"><input type="checkbox" value="Tuesday" class="cb-copy"> Tuesday</label>
                <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50"><input type="checkbox" value="Wednesday" class="cb-copy"> Wednesday</label>
                <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50"><input type="checkbox" value="Thursday" class="cb-copy"> Thursday</label>
                <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50"><input type="checkbox" value="Friday" class="cb-copy"> Friday</label>
                <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-slate-50"><input type="checkbox" value="Saturday" class="cb-copy"> Saturday</label>
            </div>
            
            <div class="p-3 bg-amber-50 text-amber-700 text-xs font-bold rounded-lg mb-6 border border-amber-200">
                ⚠️ Warning: This will overwrite any existing schedules on the selected target days.
            </div>

            <div class="flex gap-2">
                <button onclick="document.getElementById('copy-modal').classList.replace('flex', 'hidden')" class="flex-1 py-3 bg-slate-100 text-slate-600 font-black rounded-xl text-[10px] uppercase">Cancel</button>
                <button onclick="executeCopy()" id="copy-exec-btn" class="flex-1 py-3 bg-blue-600 text-white font-black rounded-xl text-[10px] uppercase shadow-md">Confirm & Copy</button>
            </div>
        </div>
    </div>

    <div id="print-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[150] hidden items-center justify-center p-4 no-print">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl">
            <h3 class="font-black text-slate-900 text-xl uppercase mb-6 border-b pb-4">Print Options</h3>
            
            <div class="space-y-4 mb-8">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Scope</label>
                    <select id="p-scope" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer">
                        <option value="ALL">Entire Institute</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Timeframe</label>
                    <select id="p-timeframe" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none cursor-pointer text-blue-700">
                        <option value="DAY">Noticeboard: Daily Matrix</option>
                        <option value="WEEK">Noticeboard: Weekly Matrix</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2">
                <button onclick="document.getElementById('print-modal').classList.replace('flex', 'hidden')" class="flex-1 py-3 bg-slate-100 text-slate-600 font-black rounded-xl text-[10px] uppercase">Cancel</button>
                <button onclick="executeAdvancedPrint()" id="print-exec-btn" class="flex-1 py-3 bg-emerald-600 text-white font-black rounded-xl text-[10px] uppercase shadow-md">Generate Print</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ",
            authDomain: "shop-portal-bbbbb.firebaseapp.com",
            projectId: "shop-portal-bbbbb",
            storageBucket: "shop-portal-bbbbb.firebasestorage.app",
            messagingSenderId: "701377739976",
            appId: "1:701377739976:web:99998220272090e56e79fd"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let structureData = [];
        let allTeachers = [];
        let currentDayTimetable = []; 
        let currentEditClass = "";
        let currentEditSection = "";
        const SPECIAL_SUBJECTS = ['BREAK', 'ASSEMBLY', 'EXAM', 'EVENT'];
        
        // Matrix colors for section rows (Matching your uploaded screenshots)
        const MATRIX_COLORS = ['#65a30d', '#dc2626', '#d97706', '#0284c7', '#7c3aed', '#059669', '#be123c', '#0f766e'];

        async function init() {
            await Promise.all([fetchStructure(), fetchTeachers(), fetchTemplatesDropdown()]);
            loadTimetable();
        }

        async function fetchStructure() {
            const snap = await db.collection("institute_structure").orderBy("className").get();
            structureData = snap.docs.map(d => d.data());
            
            const pScope = document.getElementById('p-scope');
            pScope.innerHTML = '<option value="ALL">Entire Institute</option>';
            const grouped = {};
            structureData.forEach(s => {
                if(!grouped[s.className]) grouped[s.className] = [];
                grouped[s.className].push(s.sectionName);
            });
            Object.keys(grouped).forEach(c => {
                let optGroup = `<optgroup label="Print ${c} Only">`;
                optGroup += `<option value="CLASS|${c}">Entire ${c}</option>`;
                grouped[c].sort().forEach(sec => { optGroup += `<option value="SEC|${c}|${sec}">Section ${sec} Only</option>`; });
                optGroup += `</optgroup>`;
                pScope.innerHTML += optGroup;
            });
        }

        async function fetchTeachers() {
            const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
            allTeachers = snap.docs.map(doc => {
                const data = doc.data();
                const nameKey = Object.keys(data.details).find(k => k.toLowerCase().includes('name'));
                const deptKey = Object.keys(data.details).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                return { name: nameKey ? data.details[nameKey] : data.email, dept: deptKey ? data.details[deptKey] : 'General' };
            });
        }

        async function fetchTemplatesDropdown() {
            const snap = await db.collection("timetable_templates").get();
            const sel = document.getElementById('template-selector');
            sel.innerHTML = '<option value="">-- Load Template --</option>';
            snap.docs.forEach(doc => { sel.innerHTML += `<option value="${doc.id}">${doc.data().templateName}</option>`; });
        }

        async function loadTimetable() {
            const day = document.getElementById('day-selector').value;
            const container = document.getElementById('timetable-container');
            container.innerHTML = '<div class="text-center py-20 font-black text-slate-300 animate-pulse uppercase tracking-widest text-[10px]">Cloud Syncing...</div>';

            const snap = await db.collection("timetable").where("day", "==", day).get();
            currentDayTimetable = snap.docs.map(d => ({id: d.id, ...d.data()}));

            const renderGroups = {};
            structureData.forEach(struct => {
                if(!renderGroups[struct.className]) renderGroups[struct.className] = {};
                renderGroups[struct.className][struct.sectionName] = []; 
            });

            currentDayTimetable.forEach(item => {
                if(renderGroups[item.className] && renderGroups[item.className][item.section]) renderGroups[item.className][item.section].push(item);
            });

            container.innerHTML = "";
            Object.keys(renderGroups).sort().forEach(className => {
                let groupHtml = `
                    <div class="bg-white shadow-xl rounded-2xl overflow-hidden border border-slate-200 class-group" data-class="${className}">
                        <div class="bg-blue-900 text-white p-3 text-center font-black text-[11px] uppercase tracking-[0.2em] shadow-inner">${className}</div>
                        <div class="overflow-x-auto">`;
                
                Object.keys(renderGroups[className]).sort().forEach(sectionName => {
                    const rowItems = renderGroups[className][sectionName].sort((a,b) => a.start24.localeCompare(b.start24));
                    groupHtml += `
                        <div class="flex border-b border-slate-100 last:border-0 relative section-row" data-section="${sectionName}">
                            <div class="tt-sidebar">
                                <span class="opacity-50 text-[8px] tracking-widest">SEC</span><br>${sectionName}
                                <button onclick="openEditor('${className}', '${sectionName}')" class="mt-3 px-3 py-1.5 bg-rose-600 text-white text-[8px] uppercase tracking-widest rounded-lg shadow-md hover:bg-rose-500 active:scale-95 transition-all no-print">Edit Week</button>
                            </div>
                            <div class="flex flex-1 tt-grid">
                                ${rowItems.length === 0 ? `<div class="w-full flex items-center justify-center text-slate-300 font-bold text-xs uppercase tracking-widest border-2 border-dashed border-slate-200 rounded-xl m-2">No Schedule</div>` : ''}
                                ${rowItems.map(item => {
                                    let subColor = '#e11d48'; 
                                    if (item.subject === 'BREAK') subColor = '#94a3b8'; 
                                    else if (item.subject === 'ASSEMBLY') subColor = '#ea580c'; 
                                    else if (item.subject === 'EXAM') subColor = '#8b5cf6'; 
                                    else if (item.subject === 'EVENT') subColor = '#14b8a6'; 

                                    let detailsLine = '';
                                    if (item.room) {
                                        if (item.subject === 'BREAK') detailsLine = `${item.room}`;
                                        else if (item.subject === 'EXAM') detailsLine = `Exam: ${item.room}`; 
                                        else if (item.subject === 'EVENT') detailsLine = `Event: ${item.room}`; 
                                        else if (item.subject === 'ASSEMBLY') detailsLine = `Loc: ${item.room}`;
                                        else detailsLine = `RM: ${item.room}`;
                                    }

                                    return `
                                    <div class="tt-cell">
                                        <div class="tt-header">${item.timeRange}</div>
                                        <div class="tt-duration">${item.duration}</div>
                                        <div class="tt-subject" style="color: ${subColor}">${item.subject}</div>
                                        ${item.remark ? `<div class="tt-remark">(${item.remark})</div>` : ''}
                                        ${item.teacher !== 'NONE' ? `<div class="tt-teacher">${item.teacher}</div>` : ''}
                                        ${detailsLine ? `<div class="tt-room">${detailsLine}</div>` : ''}
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>`;
                });
                groupHtml += `</div></div>`;
                container.innerHTML += groupHtml;
            });
        }

        // --- NEW BULLETPROOF MATRIX PRINT ENGINE ---
        function openPrintModal() { document.getElementById('print-modal').classList.replace('hidden', 'flex'); }

        async function executeAdvancedPrint() {
            const scope = document.getElementById('p-scope').value;
            const timeframe = document.getElementById('p-timeframe').value;
            const printArea = document.getElementById('print-render-area');
            const btn = document.getElementById('print-exec-btn');
            
            btn.innerText = "Generating Grid..."; btn.disabled = true;

            try {
                // Fetch ALL timetable data
                const snap = await db.collection("timetable").get();
                const allData = snap.docs.map(d => d.data());

                // IRONCLAD SORTER: Automatically filters out ghost data with missing times
                const sortTimeRanges = (ranges) => {
                    const cleanRanges = ranges.filter(r => r && typeof r === 'string' && r.includes(' - '));
                    return [...new Set(cleanRanges)].sort((a,b) => {
                        const timeA = a.split(' - ')[0]; 
                        const timeB = b.split(' - ')[0];
                        return new Date('1970/01/01 ' + timeA) - new Date('1970/01/01 ' + timeB);
                    });
                };

                let printHtml = "";

                if (timeframe === "DAY") {
                    // MATRIX FORMAT 1: Daily Noticeboard (Rows = Sections, Cols = Timeslots)
                    const selectedDay = document.getElementById('day-selector').value;
                    const targetClasses = scope === "ALL" ? [...new Set(structureData.map(s => s.className))] : [scope.split('|')[1]];
                    
                    targetClasses.sort().forEach(cName => {
                        let targetSections = structureData.filter(s => s.className === cName).map(s => s.sectionName);
                        if (scope.startsWith("SEC|")) targetSections = [scope.split('|')[2]];
                        
                        const classSlots = allData.filter(t => t.className === cName && targetSections.includes(t.section) && t.day === selectedDay);
                        if(classSlots.length === 0) return; // Skip if empty
                        
                        const uniqueRanges = sortTimeRanges(classSlots.map(s => s.timeRange));
                        if(uniqueRanges.length === 0) return;
                        
                        let colorIdx = 0;

                        printHtml += `
                            <div class="page-break" style="padding: 10px;">
                                <h2 style="text-align: center; font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; background: #ea580c; color: white; padding: 8px; border: 2px solid #000; -webkit-print-color-adjust: exact;">
                                    TIME TABLE ${cName} - ${selectedDay}
                                </h2>
                                <table class="matrix-table">
                                    <thead>
                                        <tr>
                                            <th style="background-color: #ea580c; color: white; width: 110px;">SECTION</th>
                                            ${uniqueRanges.map(r => `<th class="matrix-time-header">${r}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>`;
                        
                        targetSections.sort().forEach(sec => {
                            const secSlots = classSlots.filter(s => s.section === sec);
                            if(secSlots.length === 0) return; 
                            
                            const rowColor = MATRIX_COLORS[colorIdx % MATRIX_COLORS.length];
                            colorIdx++;

                            printHtml += `<tr>
                                <td class="matrix-section-cell" style="background-color: ${rowColor};">${sec}</td>`;
                            
                            uniqueRanges.forEach(range => {
                                const slotsHere = secSlots.filter(s => s.timeRange === range);
                                printHtml += `<td class="matrix-content-cell">`;
                                
                                if(slotsHere.some(s => SPECIAL_SUBJECTS.includes(s.subject))) {
                                    const spSlot = slotsHere.find(s => SPECIAL_SUBJECTS.includes(s.subject));
                                    printHtml += `<div style="font-weight:900; font-size:14px; color:#0f172a; text-transform:uppercase;">${spSlot.subject}</div>`;
                                } else {
                                    slotsHere.forEach(slot => {
                                        // Auto-color code specific common subjects
                                        let subColor = '#000';
                                        if (slot.subject.toUpperCase().includes('CHEMISTRY')) subColor = '#dc2626';
                                        if (slot.subject.toUpperCase().includes('PHYSICS')) subColor = '#2563eb';
                                        if (slot.subject.toUpperCase().includes('MATH')) subColor = '#000';

                                        printHtml += `
                                            <div class="matrix-subject" style="color: ${subColor};">${slot.subject}</div>
                                            ${slot.remark ? `<div class="matrix-remark">(${slot.remark})</div>` : ''}
                                            ${slot.teacher !== 'NONE' ? `<div class="matrix-teacher">${slot.teacher}</div>` : ''}
                                            ${slot.room ? `<div class="matrix-room">RM: ${slot.room}</div>` : ''}
                                        `;
                                    });
                                }
                                printHtml += `</td>`;
                            });
                            printHtml += `</tr>`;
                        });
                        printHtml += `</tbody></table></div>`;
                    });

                } else {
                    // MATRIX FORMAT 2: Weekly Noticeboard (Rows = Days, Cols = Timeslots)
                    const daysOrder = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                    let targetStructures = structureData;
                    if(scope.startsWith("CLASS|")) targetStructures = structureData.filter(s => s.className === scope.split('|')[1]);
                    if(scope.startsWith("SEC|")) targetStructures = structureData.filter(s => s.className === scope.split('|')[1] && s.sectionName === scope.split('|')[2]);

                    targetStructures.sort((a,b) => a.className.localeCompare(b.className) || a.sectionName.localeCompare(b.sectionName));

                    targetStructures.forEach(struct => {
                        const secSlots = allData.filter(t => t.className === struct.className && t.section === struct.sectionName);
                        if(secSlots.length === 0) return;
                        
                        const uniqueRanges = sortTimeRanges(secSlots.map(s => s.timeRange));
                        if(uniqueRanges.length === 0) return;

                        printHtml += `
                            <div class="page-break" style="padding: 10px;">
                                <h2 style="text-align: center; font-size: 22px; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; background: #2563eb; color: white; padding: 8px; border: 2px solid #000; -webkit-print-color-adjust: exact;">
                                    TIME TABLE ${struct.className} - SEC: ${struct.sectionName}
                                </h2>
                                <table class="matrix-table">
                                    <thead>
                                        <tr>
                                            <th style="background-color: #2563eb; color: white; width: 110px; font-size:14px;">DAY</th>
                                            ${uniqueRanges.map(r => `<th class="matrix-time-header">${r}</th>`).join('')}
                                        </tr>
                                    </thead>
                                    <tbody>`;
                        
                        let colorIdx = 0;
                        daysOrder.forEach(day => {
                            const daySlots = secSlots.filter(s => s.day === day);
                            if(daySlots.length === 0) return;
                            
                            const rowColor = MATRIX_COLORS[colorIdx % MATRIX_COLORS.length];
                            colorIdx++;

                            printHtml += `<tr>
                                <td class="matrix-section-cell" style="background-color: ${rowColor}; font-size: 14px;">${day}</td>`;
                            
                            uniqueRanges.forEach(range => {
                                const slotsHere = daySlots.filter(s => s.timeRange === range);
                                printHtml += `<td class="matrix-content-cell">`;
                                
                                if(slotsHere.some(s => SPECIAL_SUBJECTS.includes(s.subject))) {
                                    const spSlot = slotsHere.find(s => SPECIAL_SUBJECTS.includes(s.subject));
                                    printHtml += `<div style="font-weight:900; font-size:14px; color:#0f172a; text-transform:uppercase;">${spSlot.subject}</div>`;
                                } else {
                                    slotsHere.forEach(slot => {
                                        let subColor = '#000';
                                        if (slot.subject.toUpperCase().includes('CHEMISTRY')) subColor = '#dc2626';
                                        if (slot.subject.toUpperCase().includes('PHYSICS')) subColor = '#2563eb';
                                        
                                        printHtml += `
                                            <div class="matrix-subject" style="color: ${subColor};">${slot.subject}</div>
                                            ${slot.remark ? `<div class="matrix-remark">(${slot.remark})</div>` : ''}
                                            ${slot.teacher !== 'NONE' ? `<div class="matrix-teacher">${slot.teacher}</div>` : ''}
                                            ${slot.room ? `<div class="matrix-room">RM: ${slot.room}</div>` : ''}
                                        `;
                                    });
                                }
                                printHtml += `</td>`;
                            });
                            printHtml += `</tr>`;
                        });
                        printHtml += `</tbody></table></div>`;
                    });
                }

                if (!printHtml) {
                    printHtml = "<h2 style='text-align:center; margin-top:50px; font-family:sans-serif;'>No schedule data found for the selected options.</h2>";
                }

                printArea.innerHTML = printHtml;
                document.getElementById('print-modal').classList.replace('flex', 'hidden');
                
                setTimeout(() => { 
                    window.print(); 
                    printArea.innerHTML = ""; 
                }, 500);

            } catch(e) { 
                console.error(e);
                alert("Error formatting print view: " + e.message); 
            } finally { 
                btn.innerText = "Generate Print"; btn.disabled = false; 
            }
        }

        // --- DRAWER EDITOR ---
        async function openEditor(className, sectionName) {
            currentEditClass = className; currentEditSection = sectionName;
            document.getElementById('editor-title').innerText = `${className} - Section ${sectionName}`;
            
            document.querySelectorAll('.day-cb').forEach(cb => cb.checked = true);

            document.getElementById('editor-drawer').classList.replace('drawer-closed', 'drawer-open');
            document.getElementById('main-content').style.paddingRight = '520px'; 
            
            let existingSlots = currentDayTimetable.filter(t => t.className === className && t.section === sectionName).sort((a,b) => a.start24.localeCompare(b.start24));
            document.getElementById('editor-rows').innerHTML = "";
            if (existingSlots.length === 0) {
                const struct = structureData.find(s => s.className === className && s.sectionName === sectionName);
                if (struct && struct.subjects) existingSlots = struct.subjects.map(sub => ({ start24: "", end24: "", duration: "", subject: sub, teacher: "NONE", room: "", remark: "" }));
            }
            existingSlots.forEach(slot => addRowToEditor(slot.start24, slot.end24, slot.duration, slot.subject, slot.teacher, slot.room, slot.remark || ""));
        }

        function closeEditor() { 
            document.getElementById('editor-drawer').classList.replace('drawer-open', 'drawer-closed'); 
            document.getElementById('main-content').style.paddingRight = '2rem';
        }

        function addEmptyRow() { addRowToEditor("", "", "", "BREAK", "NONE", "", ""); }

        function addRowToEditor(sTime, eTime, duration, subject, teacher, room, remark) {
            const container = document.getElementById('editor-rows');
            const rowId = 'row_' + Date.now() + Math.random().toString(36).substr(2, 9);
            const struct = structureData.find(s => s.className === currentEditClass && s.sectionName === currentEditSection);
            const validSubjects = struct ? struct.subjects : [];
            const div = document.createElement('div');
            div.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm row-item transition-all mb-3";
            div.id = rowId;

            let subOptions = `<option value="BREAK">BREAK</option><option value="ASSEMBLY">ASSEMBLY</option><option value="EXAM">EXAM</option><option value="EVENT">EVENT</option>`;
            validSubjects.forEach(s => { subOptions += `<option value="${s}" ${s === subject ? 'selected' : ''}>${s}</option>`; });
            if (subject && !validSubjects.includes(subject) && !SPECIAL_SUBJECTS.includes(subject)) subOptions += `<option value="${subject}" selected>${subject}</option>`;

            div.innerHTML = `
                <div class="grid grid-cols-12 gap-2 w-full">
                    <div class="col-span-4 flex items-center border border-slate-200 rounded-lg overflow-hidden focus-within:border-blue-400 bg-white">
                        <input type="time" class="r-start w-1/2 p-2 text-[10px] font-bold outline-none text-center border-r" value="${sTime}" onchange="calcDuration('${rowId}')">
                        <input type="time" class="r-end w-1/2 p-2 text-[10px] font-bold outline-none text-center" value="${eTime}" onchange="calcDuration('${rowId}')">
                    </div>
                    <select class="r-sub col-span-4 p-2 bg-slate-50 border border-slate-200 rounded-lg font-black text-rose-600 text-[10px] outline-none cursor-pointer min-w-0" onchange="handleSubjectChange('${rowId}')">${subOptions}</select>
                    <input type="text" class="r-room col-span-3 p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-[10px] outline-none placeholder-slate-400 min-w-0" placeholder="Room" value="${room}">
                    <button onclick="document.getElementById('${rowId}').remove()" class="col-span-1 text-slate-300 hover:text-red-500 flex justify-center items-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                </div>
                
                <div class="grid grid-cols-12 gap-2 w-full mt-2 items-center">
                    <div class="col-span-6 flex gap-2 items-center r-teacher-wrapper min-w-0">
                        <select class="r-teacher flex-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-bold text-emerald-600 text-[10px] outline-none cursor-pointer min-w-0" data-selected="${teacher}" onchange="checkTeacherOccupancy('${rowId}')"></select>
                    </div>
                    <label class="col-span-2 text-[9px] font-black text-slate-400 flex items-center cursor-pointer uppercase tracking-widest whitespace-nowrap"><input type="checkbox" class="r-showall w-3 h-3 accent-blue-600 mr-1" onchange="handleSubjectChange('${rowId}')"> All</label>
                    <input type="text" class="r-remark col-span-4 p-2 bg-amber-50 border border-amber-200 rounded-lg font-bold text-[10px] text-amber-700 outline-none placeholder-amber-400 min-w-0" placeholder="Remarks (Opt)" value="${remark}">
                </div>

                <div class="flex justify-between items-center w-full mt-2 px-1">
                    <span class="r-duration text-[9px] font-black text-blue-600 uppercase tracking-widest">${duration || '-- MINS'}</span>
                    <div class="r-teacher-warn text-[9px] font-bold text-amber-600 leading-tight"></div>
                </div>
            `;
            container.appendChild(div);
            handleSubjectChange(rowId); 
        }

        function handleSubjectChange(rowId) {
            const row = document.getElementById(rowId);
            const sub = row.querySelector('.r-sub').value;
            const tWrapper = row.querySelector('.r-teacher-wrapper');
            const roomInput = row.querySelector('.r-room');
            const tSelect = row.querySelector('.r-teacher');

            if (SPECIAL_SUBJECTS.includes(sub)) {
                tWrapper.classList.add('hidden'); tSelect.value = "NONE";
                if (sub === 'BREAK') roomInput.placeholder = "Type (e.g. Lunch)";
                else if (sub === 'EXAM') roomInput.placeholder = "Name (e.g. Maths UT)";
                else if (sub === 'EVENT') roomInput.placeholder = "Name (e.g. Lecture)";
                else if (sub === 'ASSEMBLY') roomInput.placeholder = "Location";
            } else {
                tWrapper.classList.remove('hidden'); roomInput.placeholder = "Room No.";
                updateTeacherDropdown(rowId, sub);
            }
        }

        function calcDuration(rowId) {
            const row = document.getElementById(rowId);
            const s24 = row.querySelector('.r-start').value;
            const e24 = row.querySelector('.r-end').value;
            const durLabel = row.querySelector('.r-duration');
            if(!s24 || !e24) { durLabel.innerText = '-- MINS'; return; }
            const [sh, sm] = s24.split(':').map(Number);
            const [eh, em] = e24.split(':').map(Number);
            const totalMins = (eh * 60 + em) - (sh * 60 + sm);
            if (totalMins <= 0) { durLabel.innerText = 'INVALID'; durLabel.classList.replace('text-blue-600', 'text-red-600'); }
            else { durLabel.classList.replace('text-red-600', 'text-blue-600'); durLabel.innerText = `${totalMins} MINS`; }
            checkTeacherOccupancy(rowId); sortEditorRows();
        }

        function sortEditorRows() {
            const container = document.getElementById('editor-rows');
            const rows = Array.from(container.querySelectorAll('.row-item'));
            rows.sort((a, b) => { return (a.querySelector('.r-start').value || "99:99").localeCompare(b.querySelector('.r-start').value || "99:99"); });
            rows.forEach(r => container.appendChild(r));
        }

        function format12Hour(time24) {
            if(!time24) return ""; let [h, m] = time24.split(':');
            let ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
            return `${h.toString().padStart(2, '0')}:${m} ${ampm}`;
        }

        function updateTeacherDropdown(rowId, subject) {
            const row = document.getElementById(rowId);
            const tSelect = row.querySelector('.r-teacher');
            const showAll = row.querySelector('.r-showall').checked;
            const prevSelected = tSelect.getAttribute('data-selected');

            tSelect.innerHTML = '<option value="NONE">No Teacher</option>';
            allTeachers.forEach(t => {
                const deptStr = Array.isArray(t.dept) ? t.dept.join(',').toLowerCase() : t.dept.toLowerCase();
                if (showAll || deptStr.includes(subject.toLowerCase())) {
                    const isSelected = (t.name === prevSelected) ? 'selected' : '';
                    tSelect.innerHTML += `<option value="${t.name}" ${isSelected}>${t.name} (${Array.isArray(t.dept) ? t.dept.join(',') : t.dept})</option>`;
                }
            });
            tSelect.setAttribute('data-selected', ''); checkTeacherOccupancy(rowId);
        }

        function checkTeacherOccupancy(rowId) {
            const row = document.getElementById(rowId);
            const tName = row.querySelector('.r-teacher').value;
            const warnLabel = row.querySelector('.r-teacher-warn');
            const s24 = row.querySelector('.r-start').value;
            const e24 = row.querySelector('.r-end').value;

            if (tName === "NONE" || !s24 || !e24) { warnLabel.innerText = ""; return; }
            const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
            const rStart = sh * 60 + sm; const rEnd = eh * 60 + em;

            const overlaps = currentDayTimetable.filter(slot => {
                if (slot.teacher !== tName) return false;
                if (slot.className === currentEditClass && slot.section === currentEditSection) return false;
                const [ssh, ssm] = slot.start24.split(':').map(Number); const [seh, sem] = slot.end24.split(':').map(Number);
                return (rStart < (seh * 60 + sem) && rEnd > (ssh * 60 + ssm));
            });
            if (overlaps.length > 0) warnLabel.innerText = `⚠️ Busy: ${overlaps.map(o => `${o.section} (${o.subject}) ${o.timeRange}`).join(', ')}. Ok if combining classes.`;
            else warnLabel.innerText = "";
        }

        async function saveAsTemplate() {
            const name = prompt("Enter Template Name (e.g. 'UT Day Template' or 'OT 3-Hour')");
            if(!name) return;
            const rows = Array.from(document.querySelectorAll('.row-item'));
            const slots = rows.map(row => ({
                start24: row.querySelector('.r-start').value, end24: row.querySelector('.r-end').value, duration: row.querySelector('.r-duration').innerText,
                subject: row.querySelector('.r-sub').value, teacher: row.querySelector('.r-teacher').value || "NONE", room: row.querySelector('.r-room').value.trim(),
                remark: row.querySelector('.r-remark').value.trim()
            })).filter(s => s.start24 !== ""); 
            await db.collection("timetable_templates").add({ templateName: name, slots });
            alert("Template Saved!"); fetchTemplatesDropdown();
        }

        async function loadTemplate() {
            const tempId = document.getElementById('template-selector').value;
            if(!tempId) return;
            const doc = await db.collection("timetable_templates").doc(tempId).get();
            const slots = doc.data().slots;
            document.getElementById('editor-rows').innerHTML = "";
            slots.forEach(s => addRowToEditor(s.start24, s.end24, s.duration, s.subject, s.teacher, s.room, s.remark || ""));
            sortEditorRows();
        }

        async function saveSchedule() {
            const selectedDays = Array.from(document.querySelectorAll('.day-cb:checked')).map(cb => cb.value);
            if (selectedDays.length === 0) return alert("Please select at least one day to save this schedule to.");

            const rows = Array.from(document.querySelectorAll('.row-item'));
            let baseSlots = []; 
            let conflictMsg = "";

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const s24 = row.querySelector('.r-start').value; const e24 = row.querySelector('.r-end').value;
                const dur = row.querySelector('.r-duration').innerText; const sub = row.querySelector('.r-sub').value;
                const teacher = row.querySelector('.r-teacher').value || "NONE"; const room = row.querySelector('.r-room').value.trim();
                const remark = row.querySelector('.r-remark').value.trim();

                if (!s24 || !e24) { conflictMsg = "All rows must have a Start and End time."; break; }
                const [sh, sm] = s24.split(':').map(Number); const [eh, em] = e24.split(':').map(Number);
                const sMins = sh * 60 + sm; const eMins = eh * 60 + em;

                if (sMins >= eMins) { conflictMsg = `Invalid Time for ${sub}.`; break; }
                for (let j = 0; j < baseSlots.length; j++) {
                    const prev = baseSlots[j];
                    if (sMins < prev.eMins && eMins > prev.sMins) { conflictMsg = `🛑 CONFLICT: ${sub} overlaps with ${prev.subject}.`; break; }
                }
              if(conflictMsg) break;

                const timeRange = `${format12Hour(s24)} - ${format12Hour(e24)}`;
                
                let teacherEmail = "";
                if (teacher !== "NONE") {
                    const tObj = allTeachers.find(t => t.name === teacher);
                    if (tObj) teacherEmail = tObj.email || ""; 
                }

                baseSlots.push({ className: currentEditClass, section: currentEditSection, start24: s24, end24: e24, timeRange, duration: dur, subject: sub, teacher, teacherName: teacher, teacherEmail: teacherEmail, room, remark, sMins, eMins });
            }

            if (conflictMsg) return alert(conflictMsg);
            const btn = document.getElementById('save-btn'); btn.innerText = "Saving to Database..."; btn.disabled = true;

            try {
                const batch = db.batch();

                for (const tDay of selectedDays) {
                    const snap = await db.collection("timetable")
                        .where("day", "==", tDay)
                        .where("className", "==", currentEditClass)
                        .where("section", "==", currentEditSection)
                        .get();
                    
                    snap.docs.forEach(doc => { batch.delete(doc.ref); });
                    
                    baseSlots.forEach(slot => {
                        const { sMins, eMins, ...cleanSlot } = slot;
                        cleanSlot.day = tDay; 
                        batch.set(db.collection("timetable").doc(), cleanSlot);
                    });
                }

                await batch.commit(); 
                closeEditor(); 
                loadTimetable(); 
            } catch (err) { alert("Error saving: " + err.message); } 
            finally { btn.innerText = "Verify & Save"; btn.disabled = false; }
        }

        // --- GLOBAL COPY MODAL ---
        function openCopyModal() {
            const currentDay = document.getElementById('day-selector').value;
            document.getElementById('copy-source-lbl').innerText = currentDay;
            document.querySelectorAll('.cb-copy').forEach(cb => {
                cb.checked = false;
                cb.disabled = (cb.value === currentDay);
                cb.parentElement.style.opacity = cb.disabled ? "0.5" : "1";
            });
            document.getElementById('copy-modal').classList.replace('hidden', 'flex');
        }

        async function executeCopy() {
            const sourceDay = document.getElementById('day-selector').value;
            const targetDays = Array.from(document.querySelectorAll('.cb-copy:checked')).map(cb => cb.value);
            
            if(targetDays.length === 0) return alert("Select at least one day to copy to.");
            if(currentDayTimetable.length === 0) return alert(`There is no schedule saved on ${sourceDay} to copy.`);

            const btn = document.getElementById('copy-exec-btn');
            btn.innerText = "Processing..."; btn.disabled = true;

            try {
                const batch = db.batch();
                
                for (const tDay of targetDays) {
                    const snap = await db.collection("timetable").where("day", "==", tDay).get();
                    snap.docs.forEach(doc => batch.delete(doc.ref));
                }

                for (const tDay of targetDays) {
                    currentDayTimetable.forEach(slot => {
                        const { id, ...slotData } = slot; 
                        slotData.day = tDay; 
                        batch.set(db.collection("timetable").doc(), slotData);
                    });
                }

                await batch.commit();
                document.getElementById('copy-modal').classList.replace('flex', 'hidden');
                alert(`Successfully copied schedule to: ${targetDays.join(', ')}`);
            } catch(e) { alert("Error copying: " + e.message); } 
            finally { btn.innerText = "Confirm & Copy"; btn.disabled = false; }
        }

        init();
    </script>
</body>
