<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva Secure Gateway</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: #1e293b; padding: 40px; border-radius: 20px; border: 2px solid #334155; max-width: 500px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .icon { font-size: 80px; margin: 0; line-height: 1; }
        .success-icon { color: #10b981; }
        .error-icon { color: #ef4444; }
        .title { margin-top: 15px; font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .key-box { background: #064e3b; color: #34d399; padding: 20px; font-family: monospace; font-size: 22px; font-weight: 900; border-radius: 12px; margin: 20px 0; border: 2px dashed #10b981; word-wrap: break-word; }
        .btn { background: #3b82f6; color: white; border: none; padding: 16px 32px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 10px; width: 100%; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .btn:hover { background: #2563eb; }
        .error-bg { background: #450a0a !important; border-color: #7f1d1d; }
    </style>
</head>
<body>
    <div class="card" id="main-card">
        <!-- Content injected by JS -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const keyName = urlParams.get('key') || 'UNKNOWN_KEY';
            const targetUrl = urlParams.get('target');
            
            // SECURITY CHECK: Ensure they are in SEB (if on desktop)
            const isUsingSEB = navigator.userAgent.includes("SEB");
            const isDesktop = !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            // If on a laptop/desktop, ENFORCE Safe Exam Browser
            if (isDesktop && !isUsingSEB) {
                document.body.style.background = "#7f1d1d";
                document.getElementById('main-card').classList.add('error-bg');
                document.getElementById('main-card').innerHTML = `
                    <div class="icon error-icon">✖</div>
                    <div class="title" style="color:#f87171;">SECURITY VIOLATION</div>
                    <div class="subtitle" style="color:#fca5a5;">Access Denied. You must launch this exam using the official Exam Key (.seb) provided in your student portal. Do not use standard browsers.</div>
                `;
                return; // Stop execution entirely
            }

            // SUCCESS STATE: Show the Lobby
            document.getElementById('main-card').innerHTML = `
                <div class="icon success-icon">🛡️</div>
                <div class="title">SECURE ENVIRONMENT ACTIVE</div>
                <div class="subtitle">Please wait for the invigilator to verify your screen before starting the exam.</div>
                
                <div class="key-box">${keyName}</div>
                
                <button class="btn" id="proceed-btn">Proceed to Exam</button>
            `;

            const btn = document.getElementById('proceed-btn');
            btn.addEventListener('click', () => {
                if (!targetUrl) {
                    alert("Error: No target URL provided by administrator.");
                    return;
                }
                btn.innerText = "Loading Exam...";
                btn.disabled = true;
                // Redirect them seamlessly into the third-party exam site
                window.location.href = decodeURIComponent(targetUrl);
            });
        });
    </script>
</body>
</html>
