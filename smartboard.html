<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Smart Board Receiver</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; overflow: hidden; }
        .key-input { background: rgba(30, 41, 59, 0.5); border: 2px solid #334155; text-align: center; font-size: 3rem; font-weight: 900; letter-spacing: 0.5rem; transition: all 0.3s; }
        .key-input:focus { border-color: #6366f1; box-shadow: 0 0 30px rgba(99, 102, 241, 0.3); outline: none; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <!-- LOGIN OVERLAY -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-6">
        <div class="max-w-md w-full text-center space-y-8">
            <div class="space-y-2">
                <h1 class="text-4xl font-black tracking-tighter uppercase text-white">Classroom Access</h1>
                <p class="text-slate-400 font-bold text-sm tracking-widest uppercase">Enter 6-Digit Magic Key</p>
            </div>
            
            <input type="text" id="magic-key" maxlength="6" autofocus
                   class="w-full py-6 rounded-3xl key-input text-indigo-400" 
                   placeholder="------" autocomplete="off">

            <button onclick="unlockVault()" id="unlock-btn"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 py-6 rounded-3xl font-black text-lg uppercase tracking-widest transition-all shadow-xl shadow-indigo-600/20">
                Unlock Lectures
            </button>
        </div>
    </div>

    <!-- CONTENT HUB (Hidden initially) -->
    <div id="lecture-hub" class="hidden w-full h-full p-8 sm:p-12 flex flex-col">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-indigo-400 font-black text-xs uppercase tracking-widest mb-1">Faculty: <span id="faculty-name" class="text-white">---</span></h2>
                <h1 class="text-3xl font-black tracking-tighter uppercase">Minerva Classroom Vault</h1>
            </div>
            <button onclick="location.reload()" class="bg-slate-800 px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-widest border border-slate-700">Lock Board</button>
        </header>

        <div id="board-lecture-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 overflow-y-auto pr-4 custom-scroll">
            <!-- Lectures will load here -->
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function unlockVault() {
            const key = document.getElementById('magic-key').value;
            const btn = document.getElementById('unlock-btn');
            if(key.length !== 6) return;

            btn.disabled = true; btn.innerText = "Verifying...";

            try {
                const keyDoc = await db.collection("classroom_keys").doc(key).get();
                
                if(!keyDoc.exists) {
                    alert("Invalid or expired key.");
                    btn.disabled = false; btn.innerText = "Unlock Lectures";
                    return;
                }

                const data = keyDoc.data();
                if(Date.now() > data.expiresAt) {
                    alert("Key has expired.");
                    return;
                }

                // Key valid! Load the lectures
                loadFacultyLectures(data.teacherEmail);

            } catch(e) { alert("Access Error."); btn.disabled = false; }
        }

        async function loadFacultyLectures(email) {
            const snap = await db.collection("classroom_lectures")
                .where("teacherEmail", "==", email)
                .orderBy("timestamp", "desc").get();
            
            const lectures = snap.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('faculty-name').innerText = lectures[0]?.teacherName || email;
            
            const list = document.getElementById('board-lecture-list');
            list.innerHTML = lectures.map(l => `
                <div class="glass p-8 rounded-[3rem] space-y-6 hover:border-indigo-500/50 transition-all group">
                    <div class="w-16 h-16 bg-indigo-600/20 rounded-2xl flex items-center justify-center text-3xl">🎥</div>
                    <div>
                        <h3 class="text-xl font-black uppercase tracking-tight line-clamp-2">${l.title}</h3>
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2">Saved ${new Date(l.timestamp).toLocaleDateString()}</p>
                    </div>
                    <button onclick="launchLecture('${l.id}')" 
                            class="w-full bg-white text-slate-950 py-4 rounded-2xl font-black text-xs uppercase tracking-widest group-hover:bg-indigo-500 group-hover:text-white transition-all">
                        Launch Presentation
                    </button>
                </div>
            `).join('');

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('lecture-hub').classList.remove('hidden');
        }

        function launchLecture(id) {
            // Fetch directly from the already loaded array for speed
            db.collection("classroom_lectures").doc(id).get().then(doc => {
                const data = doc.data();
                const win = window.open("", "_blank");
                win.document.write(data.htmlCode);
                win.document.close();
            });
        }

        // Auto-focus and Enter key support
        document.getElementById('magic-key').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') unlockVault();
        });
    </script>
</body>
</html>
