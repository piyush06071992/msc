<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minerva | Smart Board Receiver</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; overflow: hidden; overscroll-behavior: none; touch-action: none; }
        
        /* Login Styles */
        .key-input { background: rgba(30, 41, 59, 0.5); border: 2px solid #334155; text-align: center; font-size: 3rem; font-weight: 900; letter-spacing: 0.5rem; transition: all 0.3s; }
        .key-input:focus { border-color: #6366f1; box-shadow: 0 0 30px rgba(99, 102, 241, 0.3); outline: none; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Scrollbar for Hub */
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950 p-6 transition-all duration-500">
        <div class="max-w-md w-full text-center space-y-8">
            <div class="space-y-2">
                <h1 class="text-4xl font-black tracking-tighter uppercase text-white">Classroom Access</h1>
                <p class="text-slate-400 font-bold text-sm tracking-widest uppercase">Enter 6-Digit Magic Key</p>
            </div>
            
            <input type="text" id="magic-key" maxlength="6" autofocus
                   class="w-full py-6 rounded-3xl key-input text-indigo-400" 
                   placeholder="------" autocomplete="off">

            <button onclick="unlockVault()" id="unlock-btn"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 py-6 rounded-3xl font-black text-lg uppercase tracking-widest transition-all shadow-xl shadow-indigo-600/20">
                Unlock Lectures
            </button>
        </div>
    </div>

    <div id="lecture-hub" class="hidden fixed inset-0 z-50 bg-[#020617] w-full h-full p-8 sm:p-12 flex-col">
        <header class="flex justify-between items-center mb-12 shrink-0">
            <div>
                <h2 class="text-indigo-400 font-black text-xs uppercase tracking-widest mb-1">Faculty: <span id="faculty-name" class="text-white">---</span></h2>
                <h1 class="text-3xl font-black tracking-tighter uppercase">Minerva Classroom Vault</h1>
            </div>
            <button onclick="location.reload()" class="bg-slate-800 px-6 py-3 rounded-2xl font-black text-xs uppercase tracking-widest border border-slate-700 hover:bg-slate-700 transition-colors">Lock Board</button>
        </header>

        <div id="board-lecture-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 overflow-y-auto pr-4 custom-scroll flex-1">
            </div>
    </div>

    <div id="presentation-view" class="hidden flex-1 flex flex-col w-full h-full bg-black">
        <header class="h-14 bg-slate-900 border-b border-slate-800 flex justify-between items-center px-4 shrink-0 shadow-md z-40">
            <div class="flex items-center gap-3">
                <button onclick="exitLecture()" class="bg-white/10 hover:bg-white/20 text-white p-1.5 px-3 rounded-lg transition-colors font-black text-xs uppercase">🔙 Back to Vault</button>
                <h1 class="font-black text-white uppercase tracking-widest text-sm ml-4"><span class="text-indigo-400">Minerva</span> Presenter</h1>
            </div>
            <h2 id="current-lecture-title" class="text-slate-400 font-bold text-xs uppercase tracking-widest truncate max-w-xs">Lecture Title</h2>
        </header>

        <main class="flex-1 flex flex-col w-full overflow-hidden relative">
            
            <div class="absolute top-2 left-2 bg-black/50 text-white text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded backdrop-blur-sm z-10 pointer-events-none">Presentation Layer</div>
            
            <iframe id="presentation-frame" class="flex-1 w-full bg-white border-none"></iframe>
            
            <div class="h-16 bg-slate-800 flex items-center justify-center gap-6 shrink-0 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.3)] z-20">
                <button onclick="controlAnim('restart')" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center transition-colors shadow-sm" title="Restart">⏮</button>
                <button onclick="controlAnim('reverse')" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center transition-colors shadow-sm" title="Step Back">⏪</button>
                <button onclick="controlAnim('toggle')" id="btn-playpause" class="w-12 h-12 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-black flex items-center justify-center transition-all shadow-md shadow-indigo-900 text-lg" title="Play/Pause">⏸</button>
                <button onclick="controlAnim('play')" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center transition-colors shadow-sm" title="Step Forward">⏩</button>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // 1. FIREBASE AUTH LOGIC
        // ==========================================
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function unlockVault() {
            const key = document.getElementById('magic-key').value;
            const btn = document.getElementById('unlock-btn');
            if(key.length !== 6) return;

            btn.disabled = true; btn.innerText = "Verifying...";

            try {
                const keyDoc = await db.collection("classroom_keys").doc(key).get();
                if(!keyDoc.exists) {
                    alert("Invalid or expired key.");
                    btn.disabled = false; btn.innerText = "Unlock Lectures";
                    return;
                }
                const data = keyDoc.data();
                if(Date.now() > data.expiresAt) {
                    alert("Key has expired.");
                    return;
                }
                // Key valid! Load the lectures
                loadFacultyLectures(data.teacherEmail);
            } catch(e) { alert("Access Error."); btn.disabled = false; }
        }

        async function loadFacultyLectures(email) {
            const snap = await db.collection("classroom_lectures")
                .where("teacherEmail", "==", email)
                .orderBy("timestamp", "desc").get();
            
            const lectures = snap.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('faculty-name').innerText = lectures[0]?.teacherName || email;
            
            const list = document.getElementById('board-lecture-list');
            list.innerHTML = lectures.map(l => `
                <div class="glass p-8 rounded-[3rem] space-y-6 hover:border-indigo-500/50 transition-all group flex flex-col justify-between">
                    <div>
                        <div class="w-16 h-16 bg-indigo-600/20 rounded-2xl flex items-center justify-center text-3xl mb-4">🎥</div>
                        <h3 class="text-xl font-black uppercase tracking-tight line-clamp-2">${l.title}</h3>
                        <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-2">Saved ${new Date(l.timestamp).toLocaleDateString()}</p>
                    </div>
                    <button onclick="launchLecture('${l.id}', '${l.title.replace(/'/g, "\\'")}')" 
                            class="w-full bg-white text-slate-950 py-4 rounded-2xl font-black text-xs uppercase tracking-widest group-hover:bg-indigo-500 group-hover:text-white transition-all mt-4">
                        Launch Presentation
                    </button>
                </div>
            `).join('');

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('lecture-hub').classList.replace('hidden', 'flex');
        }

        // Auto-focus and Enter key support
        document.getElementById('magic-key').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') unlockVault();
        });

        // ==========================================
        // 2. PRESENTATION CONTROLLER
        // ==========================================
        function launchLecture(id, title) {
            document.getElementById('lecture-hub').classList.replace('flex', 'hidden');
            document.getElementById('presentation-view').classList.replace('hidden', 'flex');
            document.getElementById('current-lecture-title').innerText = title;

            db.collection("classroom_lectures").doc(id).get().then(doc => {
                let htmlContent = doc.data().htmlCode;
                
                // Auto-inject a click listener so tapping the board advances the slide
                const tapScript = `
                    <script>
                        document.addEventListener('click', () => {
                            if(window.mainTl && window.mainTl.paused()) window.mainTl.play();
                        });
                    </scr` + `ipt></body>`;
                
                if (htmlContent.includes('</body>')) {
                    htmlContent = htmlContent.replace('</body>', tapScript);
                } else {
                    htmlContent += tapScript;
                }

                // Inject directly into the iframe on this page (No new tabs)
                const iframe = document.getElementById('presentation-frame');
                iframe.srcdoc = htmlContent;
            });
        }

        function exitLecture() {
            // Clear the iframe securely
            const iframe = document.getElementById('presentation-frame');
            iframe.removeAttribute('srcdoc');
            iframe.src = 'about:blank';
            
            // Switch views back to the Hub
            document.getElementById('presentation-view').classList.replace('flex', 'hidden');
            document.getElementById('lecture-hub').classList.replace('hidden', 'flex');
        }

        function controlAnim(action) {
            const iframe = document.getElementById('presentation-frame');
            const tl = iframe.contentWindow.mainTl;
            const playBtn = document.getElementById('btn-playpause');

            if (!tl) {
                // Flash red if AI didn't provide a timeline
                playBtn.classList.add('bg-rose-600');
                setTimeout(() => playBtn.classList.remove('bg-rose-600'), 500);
                console.log("No GSAP timeline found named 'mainTl'.");
                return;
            }

            if (action === 'restart') { tl.restart(); playBtn.innerText = '⏸'; }
            if (action === 'reverse') { tl.reverse(); playBtn.innerText = '▶'; }
            if (action === 'play') { tl.play(); playBtn.innerText = '⏸'; }
            if (action === 'toggle') {
                if (tl.paused() || tl.reversed()) {
                    tl.play(); playBtn.innerText = '⏸';
                } else {
                    tl.pause(); playBtn.innerText = '▶';
                }
            }
        }
    </script>
</body>
</html>
