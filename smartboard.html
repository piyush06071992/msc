<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minerva Lecture Engine</title>
    <!-- Load MathJax for LaTeX support -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: auto; padding: 20px; }
        .theory { background: #f4f4f9; padding: 15px; border-left: 5px solid #333; }
        .question { margin-top: 20px; border: 1px solid #ccc; padding: 15px; }
    </style>
</head>
<body>

    <div id="lecture-content"></div>

    <script>
        // Your JSON Data (You can fetch this from an external file later)
        const lectureData = {
            "chapter": "Trigonometry",
            "topic": "Trigonometric Identities",
            "theory": "The fundamental identity is $\\sin^2\\theta + \\cos^2\\theta = 1$.",
            "questions": [
                "Prove that $\\frac{1-\\cos\\theta}{1+\\cos\\theta} = (\\csc\\theta - \\cot\\theta)^2$"
            ]
        };

        const container = document.getElementById('lecture-content');
        container.innerHTML = `
            <h1>${lectureData.chapter}</h1>
            <h2>${lectureData.topic}</h2>
            <div class="theory">${lectureData.theory}</div>
            <h3>Practice Questions</h3>
            ${lectureData.questions.map(q => `<div class="question">${q}</div>`).join('')}
        `;
    </script>
</body>
</html>
