<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Timetable Authorization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex items-center gap-4 shadow-lg sticky top-0 z-50">
        <button onclick="window.location.href='admin.html'" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
            <h1 class="text-lg sm:text-xl font-black tracking-widest uppercase">Timetable Delegation</h1>
            <p class="text-[10px] text-indigo-300 font-bold uppercase tracking-widest mt-1">Manage Faculty Editing Permissions</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <div class="bg-white border-2 border-indigo-100 rounded-[2rem] p-6 sm:p-8 shadow-sm h-fit">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-2xl mb-4">🔐</div>
            <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter mb-6">Grant Access</h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">1. Select Department</label>
                    <select id="dept-select" onchange="populateStaff()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer">
                        <option value="">-- Choose Department --</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">2. Select Staff Member</label>
                    <select id="staff-select" disabled class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer disabled:opacity-50">
                        <option value="">-- Choose Faculty --</option>
                    </select>
                </div>

                <button onclick="grantAccess()" class="w-full py-4 mt-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-black uppercase tracking-widest text-[11px] shadow-lg shadow-indigo-500/30 transition-all active:scale-95">
                    Authorize to Edit Timetable
                </button>
            </div>
        </div>

        <div class="bg-slate-100/50 border border-slate-200 rounded-[2rem] p-6 sm:p-8 shadow-inner">
            <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter mb-2">Currently Authorized</h2>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-6">Staff with timetable editing rights</p>
            
            <div id="authorized-list" class="space-y-3">
                <div class="text-center py-10 text-slate-400 font-bold text-xs uppercase animate-pulse">Loading data...</div>
            </div>
        </div>

    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStaff = [];

        window.onload = async () => {
            await fetchStaffData();
        };

        async function fetchStaffData() {
            try {
                // Fetch only approved staff
                const snap = await db.collection("staff_applications").where("status", "==", "approved").get();
                
                allStaff = snap.docs.map(doc => {
                    const data = doc.data();
                    const nameKey = Object.keys(data.details || {}).find(k => k.toLowerCase().includes('name'));
                    const deptKey = Object.keys(data.details || {}).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                    
                    return { 
                        id: doc.id, 
                        name: nameKey ? data.details[nameKey] : data.email, 
                        dept: deptKey ? data.details[deptKey] : 'General',
                        canEditTimetable: data.canEditTimetable || false
                    };
                });

                populateDepartments();
                renderAuthorizedList();
            } catch (e) {
                console.error("Error fetching staff:", e);
                alert("Failed to load staff data.");
            }
        }

        function populateDepartments() {
            const deptSelect = document.getElementById('dept-select');
            
            // Extract unique departments, handling potential arrays if teachers have multiple subjects
            let departments = new Set();
            allStaff.forEach(s => {
                if (Array.isArray(s.dept)) s.dept.forEach(d => departments.add(d.trim()));
                else departments.add(s.dept.trim());
            });

            deptSelect.innerHTML = '<option value="">-- Choose Department --</option>';
            [...departments].sort().forEach(dept => {
                deptSelect.innerHTML += `<option value="${dept}">${dept}</option>`;
            });
        }

        function populateStaff() {
            const deptVal = document.getElementById('dept-select').value;
            const staffSelect = document.getElementById('staff-select');
            staffSelect.innerHTML = '<option value="">-- Choose Faculty --</option>';
            
            if(!deptVal) { staffSelect.disabled = true; return; }
            staffSelect.disabled = false;

            // Filter staff by department AND who don't already have permission
            const availableStaff = allStaff.filter(s => {
                const matchesDept = Array.isArray(s.dept) ? s.dept.includes(deptVal) : s.dept === deptVal;
                return matchesDept && !s.canEditTimetable;
            }).sort((a, b) => a.name.localeCompare(b.name));

            if(availableStaff.length === 0) {
                staffSelect.innerHTML = '<option value="">No eligible staff found in this dept</option>';
                staffSelect.disabled = true;
                return;
            }

            availableStaff.forEach(s => {
                staffSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
        }

       async function grantAccess() {
            const staffId = document.getElementById('staff-select').value;
            if(!staffId) return alert("Please select a staff member first.");

            try {
                // We save the center name instead of 'true'
                await db.collection("staff_applications").doc(staffId).update({
                    canEditTimetable: activeCenter 
                });
                
                alert("Authorization granted successfully!");
                
                // Reset dropdowns and refresh
                document.getElementById('dept-select').value = "";
                document.getElementById('staff-select').innerHTML = '<option value="">-- Choose Faculty --</option>';
                document.getElementById('staff-select').disabled = true;
                
                await fetchStaffData();
            } catch (e) {
                console.error(e);
                alert("Error updating permissions.");
            }
        }

        async function revokeAccess(staffId, staffName) {
            if(!confirm(`Are you sure you want to revoke timetable editing rights from ${staffName}?`)) return;

            try {
                await db.collection("staff_applications").doc(staffId).update({
                    canEditTimetable: false
                });
                await fetchStaffData();
            } catch (e) {
                console.error(e);
                alert("Error revoking permissions.");
            }
        }

        function renderAuthorizedList() {
            const listArea = document.getElementById('authorized-list');
            const authorizedStaff = allStaff.filter(s => s.canEditTimetable).sort((a, b) => a.name.localeCompare(b.name));

            if (authorizedStaff.length === 0) {
                listArea.innerHTML = `<div class="bg-white border-2 border-dashed border-slate-200 p-6 rounded-2xl text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">No faculty authorized yet.</div>`;
                return;
            }

            listArea.innerHTML = authorizedStaff.map(s => `
                <div class="bg-white border border-slate-200 p-4 rounded-xl flex justify-between items-center shadow-sm">
                    <div>
                        <h3 class="font-black text-slate-800 text-sm uppercase tracking-tighter">${s.name}</h3>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${Array.isArray(s.dept) ? s.dept.join(', ') : s.dept}</p>
                    </div>
                    <button onclick="revokeAccess('${s.id}', '${s.name}')" class="bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white px-4 py-2 rounded-lg font-black text-[9px] uppercase tracking-widest transition-colors shadow-sm border border-rose-100">
                        Revoke
                    </button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
