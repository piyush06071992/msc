<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Timetable Authorization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex items-center gap-4 shadow-lg sticky top-0 z-50">
        <button onclick="window.location.href='admin-timetable.html'" class="p-2 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
            <h1 class="text-lg sm:text-xl font-black tracking-widest uppercase">Timetable Delegation</h1>
            <p class="text-[10px] text-indigo-300 font-bold uppercase tracking-widest mt-1">Manage Faculty Editing Permissions</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <div class="bg-white border-2 border-indigo-100 rounded-[2rem] p-6 sm:p-8 shadow-sm h-fit">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-2xl mb-4">🔐</div>
            <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter mb-6">Grant Access</h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">1. Select Center</label>
                    <select id="center-select" onchange="populateDepartments()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer">
                        <option value="">-- Choose Center --</option>
                        <option value="GHUMARWIN">Ghumarwin</option>
                        <option value="DHARAMSHALA">Dharamshala</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">2. Select Department</label>
                    <select id="dept-select" disabled onchange="populateStaff()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer disabled:opacity-50">
                        <option value="">-- Choose Department --</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">3. Select Staff Member</label>
                    <select id="staff-select" disabled class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:border-indigo-500 cursor-pointer disabled:opacity-50">
                        <option value="">-- Choose Faculty --</option>
                    </select>
                </div>

                <button onclick="grantAccess()" class="w-full py-4 mt-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-black uppercase tracking-widest text-[11px] shadow-lg shadow-indigo-500/30 transition-all active:scale-95">
                    Authorize to Edit Timetable
                </button>
            </div>
        </div>

        <div class="bg-slate-100/50 border border-slate-200 rounded-[2rem] p-6 sm:p-8 shadow-inner">
            <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter mb-2">Currently Authorized</h2>
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-6">Staff with timetable editing rights</p>
            
            <div id="authorized-list" class="space-y-3">
                <div class="text-center py-10 text-slate-400 font-bold text-xs uppercase animate-pulse">Loading data...</div>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://lpccpiozrqgxgusculbs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwY2NwaW96cnFneGd1c2N1bGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzMzNzQsImV4cCI6MjEwOTU0OTM3NH0.b2cNwu7y-uoFTOOK-Qy2-XX7QbrSMYzJ5Ja2EBO98Hc";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allStaff = [];

        window.onload = async () => {
            await fetchStaffData();
        };

        async function fetchStaffData() {
            try {
                const { data, error } = await supabaseClient
                    .from("staff_applications")
                    .select("*");

                if (error) throw error;

                const approvedRows = (data || []).filter(row => {
                    const details = (row.details && typeof row.details === "object") ? row.details : {};
                    const statusVal = String(row.status || details.status || "").toLowerCase();
                    // Keep approved rows, or rows where status isn't explicitly rejected/pending if status column isn't used
                    return statusVal === "approved" || (!row.status && !details.status);
                });

                allStaff = approvedRows.map(row => {
                    const details = (row.details && typeof row.details === "object") ? row.details : {};
                    const nameKey = Object.keys(details).find(k => k.toLowerCase().includes("name"));
                    const deptKey = Object.keys(details).find(k => k.toLowerCase().includes("department") || k.toLowerCase().includes("subject"));
                    const centerKey = Object.keys(details).find(k => k.toLowerCase().includes("cent"));

                    const branchMap = { "1": "GHUMARWIN", "2": "DHARAMSHALA" };
                    const rawBranch = centerKey ? details[centerKey] : (row.branch_id ?? row.center ?? "GHUMARWIN");
                    const mappedBranch = branchMap[String(rawBranch)] || String(rawBranch).toUpperCase();

                    const permissionVal =
                        row.canEditTimetable !== undefined ? row.canEditTimetable :
                        row.can_edit_timetable !== undefined ? row.can_edit_timetable :
                        (details.canEditTimetable !== undefined ? details.canEditTimetable : false);

                    return {
                        id: String(row.id),
                        name: nameKey ? details[nameKey] : (row.name || row.email || "Unknown Staff"),
                        dept: deptKey ? details[deptKey] : (row.hod_dept || row.department || "General"),
                        center: mappedBranch,
                        canEditTimetable: permissionVal || false,
                        rawDetails: details,
                        hasTopLevelCamel: Object.prototype.hasOwnProperty.call(row, "canEditTimetable"),
                        hasTopLevelSnake: Object.prototype.hasOwnProperty.call(row, "can_edit_timetable")
                    };
                });

                renderAuthorizedList();

                if (document.getElementById("center-select").value) {
                    populateDepartments();
                }
            } catch (e) {
                console.error("Error fetching staff from Supabase:", e);
                alert("Failed to load staff data from Supabase.");
            }
        }

        function populateDepartments() {
            const centerVal = document.getElementById("center-select").value;
            const deptSelect = document.getElementById("dept-select");
            const staffSelect = document.getElementById("staff-select");

            deptSelect.innerHTML = '<option value="">-- Choose Department --</option>';
            staffSelect.innerHTML = '<option value="">-- Choose Faculty --</option>';
            staffSelect.disabled = true;

            if (!centerVal) {
                deptSelect.disabled = true;
                return;
            }
            deptSelect.disabled = false;

            const departments = new Set();
            allStaff.forEach(s => {
                if (s.center.includes(centerVal)) {
                    if (Array.isArray(s.dept)) s.dept.forEach(d => departments.add(String(d).trim()));
                    else departments.add(String(s.dept).trim());
                }
            });

            [...departments].sort().forEach(dept => {
                deptSelect.innerHTML += `<option value="${dept}">${dept}</option>`;
            });
        }

        function populateStaff() {
            const centerVal = document.getElementById("center-select").value;
            const deptVal = document.getElementById("dept-select").value;
            const staffSelect = document.getElementById("staff-select");

            staffSelect.innerHTML = '<option value="">-- Choose Faculty --</option>';

            if (!deptVal || !centerVal) {
                staffSelect.disabled = true;
                return;
            }
            staffSelect.disabled = false;

            const availableStaff = allStaff.filter(s => {
                const matchesCenter = s.center.includes(centerVal);
                const matchesDept = Array.isArray(s.dept) ? s.dept.includes(deptVal) : s.dept === deptVal;
                const hasPermission = s.canEditTimetable === centerVal || s.canEditTimetable === true;
                return matchesCenter && matchesDept && !hasPermission;
            }).sort((a, b) => a.name.localeCompare(b.name));

            if (availableStaff.length === 0) {
                staffSelect.innerHTML = '<option value="">No eligible staff found</option>';
                staffSelect.disabled = true;
                return;
            }

            availableStaff.forEach(s => {
                staffSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
        }

        async function updateTimetablePermission(staffId, value) {
            const staffObj = allStaff.find(s => s.id === String(staffId));
            let updatePayload = {};

            if (staffObj && staffObj.hasTopLevelSnake) {
                updatePayload = { can_edit_timetable: value };
            } else if (staffObj && staffObj.hasTopLevelCamel) {
                updatePayload = { canEditTimetable: value };
            } else {
                const updatedDetails = { ...(staffObj ? staffObj.rawDetails : {}), canEditTimetable: value };
                updatePayload = { details: updatedDetails };
            }

            const { error } = await supabaseClient
                .from("staff_applications")
                .update(updatePayload)
                .eq("id", staffId);

            if (error) throw error;
        }

        async function grantAccess() {
            const centerVal = document.getElementById("center-select").value;
            const staffId = document.getElementById("staff-select").value;
            if (!centerVal) return alert("Please select a center first.");
            if (!staffId) return alert("Please select a staff member first.");

            try {
                await updateTimetablePermission(staffId, centerVal);

                alert(`Authorization granted for ${centerVal}!`);

                document.getElementById("center-select").value = "";
                document.getElementById("dept-select").innerHTML = '<option value="">-- Choose Department --</option>';
                document.getElementById("dept-select").disabled = true;
                document.getElementById("staff-select").innerHTML = '<option value="">-- Choose Faculty --</option>';
                document.getElementById("staff-select").disabled = true;

                await fetchStaffData();
            } catch (e) {
                console.error(e);
                alert("Error updating permissions in Supabase.");
            }
        }

        async function revokeAccess(staffId, staffName) {
            if (!confirm(`Are you sure you want to revoke timetable editing rights from ${staffName}?`)) return;

            try {
                await updateTimetablePermission(staffId, false);
                await fetchStaffData();
            } catch (e) {
                console.error(e);
                alert("Error revoking permissions in Supabase.");
            }
        }

        function renderAuthorizedList() {
            const listArea = document.getElementById("authorized-list");
            const authorizedStaff = allStaff.filter(s => s.canEditTimetable).sort((a, b) => a.name.localeCompare(b.name));

            if (authorizedStaff.length === 0) {
                listArea.innerHTML = `<div class="bg-white border-2 border-dashed border-slate-200 p-6 rounded-2xl text-center text-[10px] font-black text-slate-400 uppercase tracking-widest">No faculty authorized yet.</div>`;
                return;
            }

            listArea.innerHTML = authorizedStaff.map(s => {
                const branchText = (typeof s.canEditTimetable === "string") ? s.canEditTimetable : "Global";
                const safeName = String(s.name).replace(/'/g, "\\'");
                return `
                <div class="bg-white border border-slate-200 p-4 rounded-xl flex justify-between items-center shadow-sm">
                    <div>
                        <div class="flex items-center gap-2">
                            <h3 class="font-black text-slate-800 text-sm uppercase tracking-tighter">${s.name}</h3>
                            <span class="bg-indigo-100 text-indigo-700 text-[8px] px-1.5 py-0.5 rounded font-black uppercase">${branchText}</span>
                        </div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">${Array.isArray(s.dept) ? s.dept.join(", ") : s.dept}</p>
                    </div>
                    <button onclick="revokeAccess('${s.id}', '${safeName}')" class="bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white px-4 py-2 rounded-lg font-black text-[9px] uppercase tracking-widest transition-colors shadow-sm border border-rose-100">
                        Revoke
                    </button>
                </div>
            `}).join("");
        }
    </script>
</body>
</html>
