<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Staff Login</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.1); }
        .input-field { background: #f1f5f9; border: 1px solid transparent; border-radius: 16px; padding: 16px 20px; font-size: 14px; font-weight: 700; color: #0f172a; outline: none; transition: all 0.2s; }
        .input-field:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #ffffff; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative">

    <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-[300px] sm:w-[400px] h-[300px] sm:h-[400px] bg-emerald-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[300px] sm:w-[400px] h-[300px] sm:h-[400px] bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
    </div>

    <div class="w-full max-w-md my-auto">
        <div class="flex justify-between items-start mb-6 sm:mb-8">
            <button onclick="window.location.href='index.html'" class="p-3 bg-white rounded-2xl shadow-sm border border-slate-200 text-slate-400 hover:text-blue-600 transition-all active:scale-95">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="text-right">
                <img src="logo.png" onerror="this.style.display='none'" class="w-10 sm:w-12 ml-auto mb-2">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Teacher Portal</p>
            </div>
        </div>

        <div class="glass-card p-6 sm:p-10 rounded-[2.5rem] sm:rounded-[3rem]">
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tighter mb-2">Welcome Back.</h1>
            <p class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest mb-8">Sign in to your Minerva Account</p>

            <form id="login-form" class="space-y-5" onsubmit="handleEmailMobileLogin(event)">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Email or Mobile Number</label>
                    <input type="text" id="login-identifier" required autocomplete="username" placeholder="Enter Email or 10-digit Mobile" class="w-full input-field">
                </div>

                <div class="space-y-2 relative">
                    <div class="flex justify-between items-end mb-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2">Password</label>
                        <button type="button" onclick="openResetModal()" class="text-[10px] font-bold text-blue-600 hover:underline transition-all">Reset Password?</button>
                    </div>
                    <div class="relative">
                        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" class="w-full input-field pr-12">
                        <button type="button" onclick="togglePasswordVisibility('login-password')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                    
                    <div class="flex items-center mt-3 ml-2">
                        <input type="checkbox" id="remember-me" class="w-4 h-4 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 cursor-pointer">
                        <label for="remember-me" class="ml-2 text-[10px] font-black text-slate-500 uppercase tracking-widest cursor-pointer">Remember ID & Password</label>
                    </div>
                </div>

                <p id="error-msg" class="text-rose-500 text-[10px] font-black uppercase tracking-widest text-center hidden"></p>

                <button type="submit" id="login-btn" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-blue-700 transition-all active:scale-95 uppercase tracking-widest text-xs mt-4">
                    Sign In Securely
                </button>
            </form>

            <div class="flex items-center gap-4 my-8" id="google-divider">
                <div class="h-px bg-slate-100 flex-1"></div>
                <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">OR</span>
                <div class="h-px bg-slate-100 flex-1"></div>
            </div>

            <button onclick="handleGoogleLogin()" id="google-btn" class="w-full bg-white border-2 border-slate-100 text-slate-700 font-black py-4 rounded-2xl hover:bg-slate-50 transition-all active:scale-95 flex items-center justify-center gap-3 uppercase tracking-widest text-xs">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 15.02 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/><path fill="none" d="M1 1h22v22H1z"/></svg>
                Continue with Google
            </button>
        </div>
    </div>

    <div id="reset-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[100] hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] p-8 max-w-md w-full shadow-2xl transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-black text-slate-900 tracking-tight">Reset Password</h3>
                <button onclick="closeResetModal()" class="text-slate-400 hover:text-rose-500"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>

            <div id="reset-step-1" class="space-y-4">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 leading-relaxed">Verify Identity with registered Email and Mobile.</p>
                <input type="email" id="reset-email" placeholder="Registered Email ID" class="w-full input-field">
                <input type="number" id="reset-mobile" placeholder="Registered Mobile Number" class="w-full input-field">
                <p id="reset-error" class="text-rose-500 text-[10px] font-black uppercase tracking-widest text-center hidden"></p>
                <button onclick="verifyForReset()" id="verify-btn" class="w-full bg-slate-900 text-white font-black py-4 rounded-xl mt-2 uppercase tracking-widest text-[11px] hover:bg-slate-800 transition-all">Verify Identity</button>
            </div>

            <div id="reset-step-2" class="space-y-4 hidden">
                <p class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest mb-4">✓ Identity Verified. Create new password.</p>
                <div class="relative">
                    <input type="password" id="new-pass" placeholder="New Password (Min 6 chars)" class="w-full input-field pr-12">
                    <button type="button" onclick="togglePasswordVisibility('new-pass')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></button>
                </div>
                <input type="password" id="confirm-pass" placeholder="Confirm New Password" class="w-full input-field">
                <button onclick="updatePassword()" id="update-pass-btn" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl mt-2 uppercase tracking-widest text-[11px] shadow-lg hover:bg-blue-700 transition-all">Update & Login</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lpccpiozrqgxgusculbs.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwY2NwaW96cnFneGd1c2N1bGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5NzMzNzQsImV4cCI6MjEwOTU0OTM3NH0.b2cNwu7y-uoFTOOK-Qy2-XX7QbrSMYzJ5Ja2EBO98Hc";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let targetResetRow = null;
        let nativeFCMToken = null;
        let handlingOAuthCallback = false;

        function isApprovedRow(row) {
            const det = (row.details && typeof row.details === "object") ? row.details : {};
            const statusVal = String(row.status ?? det.status ?? "approved").toLowerCase();
            return statusVal === "approved";
        }

        function togglePasswordVisibility(inputId) {
            const p = document.getElementById(inputId);
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        function showError(msg, elId = 'error-msg') {
            const el = document.getElementById(elId);
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function generateSessionId() {
            return Date.now().toString() + Math.random().toString(36).substr(2, 9);
        }

        function extractTeacherInfo(rowData) {
            let staffName = rowData.email ? rowData.email.split('@')[0] : "Teacher";
            let staffDept = rowData.hod_dept || rowData.hodDept || "General";

            if (rowData.name) staffName = rowData.name;
            if (rowData.TeacherName) staffName = rowData.TeacherName;
            if (rowData.Department) staffDept = rowData.Department;

            const det = (rowData.details && typeof rowData.details === "object") ? rowData.details : {};
            for (let key in det) {
                const lowerKey = key.toLowerCase();
                if (lowerKey.includes('name')) staffName = det[key];
                if (lowerKey.includes('depart') || lowerKey.includes('subject')) staffDept = det[key];
            }

            const centerKey = Object.keys(det).find(k => k.toLowerCase().includes('cent'));
            const staffCenter = centerKey ? String(det[centerKey]).toUpperCase() : "GHUMARWIN";

            return { name: staffName, dept: staffDept, center: staffCenter };
        }

        async function persistSessionAndTokens(userRow, updatePayload) {
            const det = (userRow.details && typeof userRow.details === "object") ? { ...userRow.details } : {};
            const payload = { ...updatePayload };

            // Try updating top-level columns first; if any optional column doesn't exist in schema, fall back to storing inside `details`
            const { error } = await sb
                .from("staff_applications")
                .update(payload)
                .eq("id", userRow.id);

            if (error && String(error.message || "").toLowerCase().includes("column")) {
                const mergedDetails = { ...det, ...payload };
                const { error: fallbackErr } = await sb
                    .from("staff_applications")
                    .update({ details: mergedDetails })
                    .eq("id", userRow.id);
                if (fallbackErr) throw fallbackErr;
            } else if (error) {
                throw error;
            }
        }

        async function processLoginSuccess(userRow) {
            const sessionId = generateSessionId();
            const updatePayload = { currentSessionId: sessionId };

            if (nativeFCMToken) {
                const det = (userRow.details && typeof userRow.details === "object") ? userRow.details : {};
                const existingTokens = Array.isArray(userRow.fcmTokens)
                    ? userRow.fcmTokens
                    : (Array.isArray(det.fcmTokens) ? det.fcmTokens : []);
                if (!existingTokens.includes(nativeFCMToken)) existingTokens.push(nativeFCMToken);
                updatePayload.fcmTokens = existingTokens;
                updatePayload.tokenUpdatedAt = Date.now();
                updatePayload.platform = 'Android App';
            }

            await persistSessionAndTokens(userRow, updatePayload);

            const info = extractTeacherInfo(userRow);
            const sessionData = {
                uid: userRow.id,
                email: userRow.email,
                name: info.name,
                dept: info.dept,
                center: info.center,
                sessionId: sessionId
            };
            localStorage.setItem('minervaActiveStaff', JSON.stringify(sessionData));

            if (document.getElementById('remember-me').checked) {
                localStorage.setItem('minervaSavedCreds', JSON.stringify({
                    id: document.getElementById('login-identifier').value.trim(),
                    password: document.getElementById('login-password').value
                }));
            } else {
                localStorage.removeItem('minervaSavedCreds');
            }

            window.location.href = 'teacher-portal.html';
        }

        async function completeGoogleOAuthSignIn(email) {
            if (handlingOAuthCallback) return;
            handlingOAuthCallback = true;

            const btn = document.getElementById('google-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loader border-slate-400 border-top-slate-700"></span> Validating...';
            btn.disabled = true;
            document.getElementById('error-msg').classList.add('hidden');

            try {
                const cleanEmail = String(email || "").trim().toLowerCase();
                const { data, error } = await sb
                    .from("staff_applications")
                    .select("*")
                    .ilike("email", cleanEmail);

                if (error) throw error;
                const approvedMatch = (data || []).find(isApprovedRow);

                if (!approvedMatch) {
                    await sb.auth.signOut();
                    throw new Error("This Google account is not registered or approved.");
                }

                await processLoginSuccess(approvedMatch);
            } catch (err) {
                showError(err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
                handlingOAuthCallback = false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const savedCreds = localStorage.getItem('minervaSavedCreds');
            if (savedCreds) {
                try {
                    const creds = JSON.parse(savedCreds);
                    document.getElementById('login-identifier').value = creds.id || '';
                    document.getElementById('login-password').value = creds.password || '';
                    document.getElementById('remember-me').checked = true;
                } catch (_) {}
            }

            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                document.getElementById('google-btn').style.display = 'none';
                const orDivider = document.getElementById('google-divider');
                if (orDivider) orDivider.style.display = 'none';

                const PushNotifications = Capacitor.Plugins.PushNotifications;
                try {
                    PushNotifications.addListener('registration', (token) => {
                        nativeFCMToken = token.value;
                    });
                    PushNotifications.addListener('pushNotificationReceived', (notification) => {
                        alert(`${notification.title}\n${notification.body}`);
                    });
                    let permStatus = await PushNotifications.checkPermissions();
                    if (permStatus.receive === 'prompt') {
                        permStatus = await PushNotifications.requestPermissions();
                    }
                    if (permStatus.receive === 'granted') {
                        await PushNotifications.register();
                    }
                } catch (err) {
                    console.error('Push setup failed:', err);
                }
            }

            sb.auth.onAuthStateChange(async (event, session) => {
                if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user?.email) {
                    await completeGoogleOAuthSignIn(session.user.email);
                }
            });
        });

        async function handleEmailMobileLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const idVal = document.getElementById('login-identifier').value.trim().toLowerCase();
            const passVal = document.getElementById('login-password').value;

            btn.innerHTML = '<span class="loader"></span>';
            btn.disabled = true;
            document.getElementById('error-msg').classList.add('hidden');

            try {
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const PushNotifications = Capacitor.Plugins.PushNotifications;
                    let permStatus = await PushNotifications.checkPermissions();
                    if (permStatus.receive !== 'granted') {
                        permStatus = await PushNotifications.requestPermissions();
                        if (permStatus.receive !== 'granted') {
                            throw new Error("Access Denied: You must allow notifications. If blocked, enable them in your phone's App Settings.");
                        }
                    }
                }

                const isEmail = idVal.includes('@');
                const query = isEmail
                    ? sb.from('staff_applications').select('*').ilike('email', idVal)
                    : sb.from('staff_applications').select('*').eq('mobile', idVal);

                const { data, error } = await query;
                if (error) throw error;

                const approvedRow = (data || []).find(isApprovedRow);
                if (!approvedRow) throw new Error("No approved account found with this ID.");

                const det = (approvedRow.details && typeof approvedRow.details === "object") ? approvedRow.details : {};
                const storedPassword = approvedRow.password ?? det.password;
                if (storedPassword !== passVal) throw new Error("Incorrect Password.");

                await processLoginSuccess(approvedRow);
            } catch (err) {
                showError(err.message);
                btn.innerHTML = 'Sign In Securely';
                btn.disabled = false;
            }
        }

        async function handleGoogleLogin() {
            const btn = document.getElementById('google-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loader border-slate-400 border-top-slate-700"></span> Redirecting...';
            btn.disabled = true;
            document.getElementById('error-msg').classList.add('hidden');

            try {
                const redirectUrl = window.location.origin + window.location.pathname;
                const { error } = await sb.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: redirectUrl }
                });
                if (error) throw error;
            } catch (err) {
                showError(err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function openResetModal() {
            document.getElementById('reset-modal').classList.replace('hidden', 'flex');
            document.getElementById('reset-step-1').classList.remove('hidden');
            document.getElementById('reset-step-2').classList.add('hidden');
            document.getElementById('reset-error').classList.add('hidden');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.replace('flex', 'hidden');
            targetResetRow = null;
        }

        async function verifyForReset() {
            const email = document.getElementById('reset-email').value.trim().toLowerCase();
            const mobile = document.getElementById('reset-mobile').value.trim();
            const btn = document.getElementById('verify-btn');
            const errEl = document.getElementById('reset-error');

            if (!email || !mobile) {
                errEl.innerText = "Please enter both Email and Mobile.";
                errEl.classList.remove('hidden');
                return;
            }

            btn.innerText = "Verifying...";
            btn.disabled = true;
            errEl.classList.add('hidden');

            try {
                const { data, error } = await sb
                    .from("staff_applications")
                    .select("*")
                    .ilike("email", email)
                    .eq("mobile", mobile);

                if (error) throw error;
                const matched = (data || []).find(isApprovedRow);
                if (!matched) throw new Error("Details do not match any approved record.");

                targetResetRow = matched;
                document.getElementById('reset-step-1').classList.add('hidden');
                document.getElementById('reset-step-2').classList.remove('hidden');
            } catch (e) {
                errEl.innerText = e.message;
                errEl.classList.remove('hidden');
            } finally {
                btn.innerText = "Verify Identity";
                btn.disabled = false;
            }
        }

        async function updatePassword() {
            const pass1 = document.getElementById('new-pass').value;
            const pass2 = document.getElementById('confirm-pass').value;
            const btn = document.getElementById('update-pass-btn');

            if (pass1.length < 6) return alert("Password must be at least 6 characters.");
            if (pass1 !== pass2) return alert("Passwords do not match!");
            if (!targetResetRow) return alert("Session expired. Please verify again.");

            btn.innerText = "Updating...";
            btn.disabled = true;

            try {
                await persistSessionAndTokens(targetResetRow, { password: pass1 });
                alert("Password updated successfully! You can now login with your new password.");
                closeResetModal();
                document.getElementById('login-identifier').value = document.getElementById('reset-email').value;
            } catch (e) {
                console.error(e);
                alert("Error updating password. Please try again.");
            } finally {
                btn.innerText = "Update & Login";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
