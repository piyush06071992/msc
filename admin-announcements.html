<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerva | Admin Announcements</title>
    <script src="tailwind-engine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-checkbox { accent-color: #4f46e5; width: 1.25rem; height: 1.25rem; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-24 relative">

    <header class="bg-[#1e1b4b] text-white p-4 sm:px-8 sm:py-5 flex flex-col sm:flex-row sm:items-center justify-between shadow-xl sticky top-0 z-50 gap-4 border-b-4 border-pink-600">
        <div class="flex items-center justify-between w-full sm:w-auto gap-4">
            <button onclick="window.location.href='admin.html'" class="p-3 sm:p-4 bg-indigo-800 hover:bg-indigo-700 rounded-xl transition-colors shadow-sm shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="flex items-center gap-3">
                <h1 class="text-xl sm:text-2xl font-black tracking-widest uppercase leading-none">Announcements Hub</h1>
                <select id="global-center-switch" onchange="switchAdminCenter(this.value)" class="text-[10px] font-black text-pink-700 bg-pink-50 border border-pink-200 outline-none rounded px-2 py-0.5 cursor-pointer uppercase tracking-widest shadow-sm">
                    <option value="GHUMARWIN">📍 Ghumarwin</option>
                    <option value="DHARAMSHALA">📍 Dharamshala</option>
                </select>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto">
            <button onclick="switchTab('make')" id="btn-tab-make" class="flex-1 sm:flex-none justify-center bg-pink-600 text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all">
                📢 Make Announcement
            </button>
            <button onclick="switchTab('past')" id="btn-tab-past" class="flex-1 sm:flex-none justify-center bg-slate-800 text-slate-300 hover:text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all">
                📜 Past Announcements
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-8 mt-4">
        
        <!-- VIEW 1: MAKE ANNOUNCEMENT -->
        <div id="view-make" class="glass p-6 sm:p-10 rounded-[2.5rem] shadow-xl border border-white space-y-8">
            <div class="border-b border-slate-200 pb-4">
                <h2 class="text-xl sm:text-2xl font-black text-slate-900 uppercase tracking-tighter">Create New Announcement</h2>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Broadcast targeted alerts to staff, students, and parents</p>
            </div>

            <div class="space-y-6">
                <!-- Heading & Description -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-black text-slate-600 uppercase tracking-widest mb-2">Announcement Heading</label>
                        <input type="text" id="ann-heading" placeholder="e.g., Urgent Staff Meeting / Holiday Notice" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-pink-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-600 uppercase tracking-widest mb-2">Brief Description</label>
                        <textarea id="ann-desc" rows="4" placeholder="Enter detailed message description here..." class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-pink-500 transition-all custom-scroll"></textarea>
                    </div>
                </div>

                <!-- Date & Time Selector -->
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-black text-slate-700 uppercase tracking-widest">Schedule Duration</label>
                        <label class="flex items-center gap-2 cursor-pointer bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm">
                            <input type="checkbox" id="ann-fullday" onchange="toggleTimeSelectors()" class="custom-checkbox">
                            <span class="text-xs font-black text-slate-700 uppercase tracking-widest">Full Days (No Time)</span>
                        </label>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">Start Date & Time</label>
                            <input type="date" id="ann-start-date" class="w-full p-3.5 bg-white border border-slate-300 rounded-xl font-bold text-xs outline-none">
                            <input type="time" id="ann-start-time" class="w-full p-3.5 bg-white border border-slate-300 rounded-xl font-bold text-xs outline-none time-input">
                        </div>
                        <div class="space-y-2">
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest">End Date & Time</label>
                            <input type="date" id="ann-end-date" class="w-full p-3.5 bg-white border border-slate-300 rounded-xl font-bold text-xs outline-none">
                            <input type="time" id="ann-end-time" class="w-full p-3.5 bg-white border border-slate-300 rounded-xl font-bold text-xs outline-none time-input">
                        </div>
                    </div>
                </div>

                <!-- Audience Targeting -->
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-6">
                    <h3 class="text-xs font-black text-slate-800 uppercase tracking-widest border-b border-slate-200 pb-3">Audience Targeting</h3>

                    <!-- Centers / Branches -->
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Target Branches / Centers</label>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-2 cursor-pointer bg-white px-4 py-2 rounded-xl border border-slate-200">
                                <input type="checkbox" class="custom-checkbox cb-center" value="GHUMARWIN" checked>
                                <span class="text-xs font-bold text-slate-700 uppercase">Ghumarwin</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer bg-white px-4 py-2 rounded-xl border border-slate-200">
                                <input type="checkbox" class="custom-checkbox cb-center" value="DHARAMSHALA" checked>
                                <span class="text-xs font-bold text-slate-700 uppercase">Dharamshala</span>
                            </label>
                        </div>
                    </div>

                    <!-- Roles (Staff, Students, Parents) -->
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Target Roles (Multi-select)</label>
                        <div class="flex flex-wrap gap-4">
                            <label class="flex items-center gap-2 cursor-pointer bg-white px-4 py-2 rounded-xl border border-slate-200">
                                <input type="checkbox" id="role-staff" class="custom-checkbox cb-role" value="STAFF" onchange="handleRoleChange()">
                                <span class="text-xs font-bold text-slate-700 uppercase">Staff</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer bg-white px-4 py-2 rounded-xl border border-slate-200">
                                <input type="checkbox" id="role-students" class="custom-checkbox cb-role" value="STUDENTS" onchange="handleRoleChange()">
                                <span class="text-xs font-bold text-slate-700 uppercase">Students</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer bg-white px-4 py-2 rounded-xl border border-slate-200">
                                <input type="checkbox" id="role-parents" class="custom-checkbox cb-role" value="PARENTS" onchange="handleRoleChange()">
                                <span class="text-xs font-bold text-slate-700 uppercase">Parents</span>
                            </label>
                        </div>
                    </div>

                    <!-- Conditional Staff Filters (Departments & Specific Staff) -->
                    <div id="staff-filter-box" class="hidden space-y-4 pt-4 border-t border-slate-200 animate-in fade-in">
                        <h4 class="text-xs font-black text-indigo-900 uppercase tracking-widest">Staff Sub-Targeting</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Departments</label>
                                <select id="ann-dept-select" onchange="filterStaffByDept()" class="w-full p-3.5 bg-white border border-slate-300 rounded-xl font-bold text-xs outline-none cursor-pointer">
                                    <option value="ALL">All Departments</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Specific Staff (Leave blank for all in dept)</label>
                                <select id="ann-staff-select" multiple class="w-full p-2 bg-white border border-slate-300 rounded-xl font-bold text-xs outline-none custom-scroll h-24">
                                    <!-- Dynamically Populated -->
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Conditional Student/Parent Filters (Classes & Sections) -->
                    <div id="student-filter-box" class="hidden space-y-4 pt-4 border-t border-slate-200 animate-in fade-in">
                        <h4 class="text-xs font-black text-indigo-900 uppercase tracking-widest">Student / Parent Sub-Targeting</h4>
                        <div class="space-y-3">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="all-classes-cb" onchange="toggleAllClasses(this)" class="custom-checkbox" checked>
                                <span class="text-xs font-black text-slate-700 uppercase">Whole Institute / All Classes & Sections</span>
                            </label>
                            
                            <div id="classes-sections-container" class="hidden space-y-3 max-h-60 overflow-y-auto custom-scroll p-2 bg-white rounded-xl border border-slate-200">
                                <!-- Live Fetched Classes & Sections Checkboxes -->
                            </div>
                        </div>
                    </div>
                </div>

                <button onclick="saveAnnouncement()" id="save-ann-btn" class="w-full py-5 bg-pink-600 text-white rounded-2xl font-black uppercase tracking-widest text-sm shadow-xl hover:bg-pink-700 transition-all active:scale-95">
                    🚀 Broadcast Announcement
                </button>
            </div>
        </div>

        <!-- VIEW 2: PAST ANNOUNCEMENTS -->
        <div id="view-past" class="hidden space-y-6">
            <div class="border-b border-slate-200 pb-4">
                <h2 class="text-xl sm:text-2xl font-black text-slate-900 uppercase tracking-tighter">Past & Active Announcements</h2>
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">Review or revoke previously published broadcasts</p>
            </div>

            <div id="past-announcements-list" class="space-y-4">
                <div class="text-center py-20 bg-white rounded-[2.5rem] border border-slate-200">
                    <span class="loader mb-4"></span>
                    <div class="text-slate-400 font-black uppercase text-xs tracking-widest">Loading Past Broadcasts...</div>
                </div>
            </div>
        </div>

    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSXjpko1RN6D4a3yYqFYdsZOfdxord-MQ", authDomain: "shop-portal-bbbbb.firebaseapp.com", projectId: "shop-portal-bbbbb", storageBucket: "shop-portal-bbbbb.firebasestorage.app", messagingSenderId: "701377739976", appId: "1:701377739976:web:99998220272090e56e79fd" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let activeCenter = sessionStorage.getItem('minervaAdminCenter') || "GHUMARWIN";
        sessionStorage.setItem('minervaAdminCenter', activeCenter);

        function getCollection(name) {
            const globalCollections = ['configs', 'staff_applications', 'announcements'];
            if (globalCollections.includes(name)) return db.collection(name);
            return activeCenter === "GHUMARWIN" ? db.collection(name) : db.collection(`${activeCenter.toLowerCase()}_${name}`);
        }

        function switchAdminCenter(centerName) {
            activeCenter = centerName;
            sessionStorage.setItem('minervaAdminCenter', centerName);
            initLiveMetadata();
        }

        let liveStaffList = [];
        let liveDepartments = new Set();
        let liveStructure = [];

        window.onload = async () => {
            const authStatus = sessionStorage.getItem('minervaAdminAuth');
            if (authStatus !== 'true') {
                window.location.replace('admin-login.html');
                return;
            }

            document.getElementById('global-center-switch').value = activeCenter;
            
            // Set default date values
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('ann-start-date').value = today;
            document.getElementById('ann-end-date').value = today;

            await initLiveMetadata();
            loadPastAnnouncements();
        };

        function switchTab(tab) {
            document.getElementById('view-make').classList.toggle('hidden', tab !== 'make');
            document.getElementById('view-past').classList.toggle('hidden', tab !== 'past');

            document.getElementById('btn-tab-make').className = tab === 'make' ? "flex-1 sm:flex-none justify-center bg-pink-600 text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all" : "flex-1 sm:flex-none justify-center bg-slate-800 text-slate-300 hover:text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all";
            document.getElementById('btn-tab-past').className = tab === 'past' ? "flex-1 sm:flex-none justify-center bg-pink-600 text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all" : "flex-1 sm:flex-none justify-center bg-slate-800 text-slate-300 hover:text-white px-5 py-3 rounded-xl font-black uppercase tracking-widest text-xs shadow-md transition-all";
            
            if (tab === 'past') loadPastAnnouncements();
        }

        function toggleTimeSelectors() {
            const isFullDay = document.getElementById('ann-fullday').checked;
            document.querySelectorAll('.time-input').forEach(el => {
                el.style.display = isFullDay ? 'none' : 'block';
            });
        }

        async function initLiveMetadata() {
            try {
                // Live fetch staff and departments
                const staffSnap = await db.collection("staff_applications").where("status", "==", "approved").get();
                liveStaffList = [];
                liveDepartments.clear();

                staffSnap.forEach(doc => {
                    const data = doc.data();
                    const det = data.details || {};
                    const deptKey = Object.keys(det).find(k => k.toLowerCase().includes('department') || k.toLowerCase().includes('subject'));
                    const dept = deptKey ? det[deptKey] : (data.dept || 'General');
                    
                    if (dept) {
                        dept.split(',').forEach(d => liveDepartments.add(d.trim()));
                    }

                    const nameKey = Object.keys(det).find(k => k.toLowerCase().includes('name'));
                    const name = nameKey ? det[nameKey] : data.email;
                    
                    liveStaffList.push({
                        email: data.email,
                        name: name,
                        dept: dept
                    });
                });

                // Populate Dept Dropdown
                const deptSelect = document.getElementById('ann-dept-select');
                deptSelect.innerHTML = `<option value="ALL">All Departments</option>` + Array.from(liveDepartments).sort().map(d => `<option value="${d}">${d}</option>`).join('');
                filterStaffByDept();

                // Live fetch institute structure (classes & sections)
                const structSnap = await getCollection("institute_structure").orderBy("className").get();
                liveStructure = structSnap.docs.map(d => d.data());

                const classContainer = document.getElementById('classes-sections-container');
                let classMap = {};
                liveStructure.forEach(st => {
                    if (!classMap[st.className]) classMap[st.className] = [];
                    classMap[st.className].push(st.sectionName);
                });

                let structHtml = "";
                Object.keys(classMap).sort((a,b) => a.localeCompare(b, undefined, {numeric:true})).forEach(cls => {
                    structHtml += `
                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                            <label class="flex items-center gap-2 cursor-pointer font-black text-xs text-slate-800 uppercase">
                                <input type="checkbox" class="custom-checkbox class-master-cb" value="${cls}" onchange="toggleSpecificClass(this)">
                                <span>Class ${cls} (All Sections)</span>
                            </label>
                            <div class="pl-6 flex flex-wrap gap-3">
                    `;
                    classMap[cls].sort().forEach(sec => {
                        structHtml += `
                            <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-slate-600 uppercase">
                                <input type="checkbox" class="custom-checkbox section-cb class-${cls.replace(/[^a-zA-Z0-9]/g,'_')}" data-class="${cls}" value="${sec}">
                                <span>Sec ${sec}</span>
                            </label>
                        `;
                    });
                    structHtml += `</div></div>`;
                });
                classContainer.innerHTML = structHtml || '<p class="text-xs text-slate-400 font-bold text-center py-4">No classes configured in structure.</p>';

            } catch (e) {
                console.error("Metadata fetch error:", e);
            }
        }

        function handleRoleChange() {
            const isStaff = document.getElementById('role-staff').checked;
            const isStudents = document.getElementById('role-students').checked;
            const isParents = document.getElementById('role-parents').checked;

            document.getElementById('staff-filter-box').classList.toggle('hidden', !isStaff);
            document.getElementById('student-filter-box').classList.toggle('hidden', !isStudents && !isParents);
        }

        function filterStaffByDept() {
            const dept = document.getElementById('ann-dept-select').value;
            const staffSelect = document.getElementById('ann-staff-select');
            
            let filtered = liveStaffList;
            if (dept !== 'ALL') {
                filtered = liveStaffList.filter(s => s.dept.includes(dept));
            }

            filtered.sort((a,b) => a.name.localeCompare(b.name));
            staffSelect.innerHTML = filtered.map(s => `<option value="${s.email}">${s.name} (${s.email})</option>`).join('');
        }

        function toggleAllClasses(masterCb) {
            const container = document.getElementById('classes-sections-container');
            container.classList.toggle('hidden', masterCb.checked);
        }

        function toggleSpecificClass(masterCb) {
            const clsClean = masterCb.value.replace(/[^a-zA-Z0-9]/g,'_');
            document.querySelectorAll(`.section-cb.class-${clsClean}`).forEach(cb => cb.checked = masterCb.checked);
        }

        async function saveAnnouncement() {
            const heading = document.getElementById('ann-heading').value.trim();
            const desc = document.getElementById('ann-desc').value.trim();
            const isFullDay = document.getElementById('ann-fullday').checked;
            const startDate = document.getElementById('ann-start-date').value;
            const startTime = document.getElementById('ann-start-time').value;
            const endDate = document.getElementById('ann-end-date').value;
            const endTime = document.getElementById('ann-end-time').value;

            if (!heading || !desc || !startDate || !endDate) {
                return alert("Please fill in the Heading, Description, and Start/End dates.");
            }

            // Gather Centers
            const selectedCenters = Array.from(document.querySelectorAll('.cb-center:checked')).map(cb => cb.value);
            if (selectedCenters.length === 0) return alert("Select at least one target branch/center.");

            // Gather Roles
            const selectedRoles = Array.from(document.querySelectorAll('.cb-role:checked')).map(cb => cb.value);
            if (selectedRoles.length === 0) return alert("Select at least one target role (Staff, Students, or Parents).");

            let targetStaff = [];
            if (selectedRoles.includes('STAFF')) {
                const dept = document.getElementById('ann-dept-select').value;
                const specificStaff = Array.from(document.getElementById('ann-staff-select').selectedOptions).map(opt => opt.value);
                targetStaff = { department: dept, specificStaff: specificStaff };
            }

            let targetClasses = [];
            if (selectedRoles.includes('STUDENTS') || selectedRoles.includes('PARENTS')) {
                const isAllClasses = document.getElementById('all-classes-cb').checked;
                if (isAllClasses) {
                    targetClasses = "ALL_CLASSES";
                } else {
                    let classSectionMap = {};
                    document.querySelectorAll('.section-cb:checked').forEach(cb => {
                        const cls = cb.getAttribute('data-class');
                        const sec = cb.value;
                        if (!classSectionMap[cls]) classSectionMap[cls] = [];
                        classSectionMap[cls].push(sec);
                    });
                    targetClasses = classSectionMap;
                }
            }

            const btn = document.getElementById('save-ann-btn');
            const origText = btn.innerText;
            btn.innerText = "Broadcasting..."; btn.disabled = true;

            try {
                const payload = {
                    heading,
                    description: desc,
                    isFullDay,
                    startDate,
                    startTime: isFullDay ? "" : startTime,
                    endDate,
                    endTime: isFullDay ? "" : endTime,
                    centers: selectedCenters,
                    roles: selectedRoles,
                    targetStaff,
                    targetClasses,
                    createdAt: Date.now(),
                    author: sessionStorage.getItem('minervaAdminName') || "Admin"
                };

                await getCollection("announcements").add(payload);
                alert("✅ Announcement broadcasted successfully!");
                
                // Reset form
                document.getElementById('ann-heading').value = '';
                document.getElementById('ann-desc').value = '';
                switchTab('past');
            } catch (e) {
                console.error(e);
                alert("Failed to save announcement: " + e.message);
            } finally {
                btn.innerText = origText;
                btn.disabled = false;
            }
        }

        async function loadPastAnnouncements() {
            const container = document.getElementById('past-announcements-list');
            container.innerHTML = `<div class="text-center py-20 bg-white rounded-[2.5rem] border border-slate-200"><span class="loader mb-4"></span><div class="text-slate-400 font-black uppercase text-xs tracking-widest">Loading Broadcasts...</div></div>`;

            try {
                const snap = await getCollection("announcements").orderBy("createdAt", "desc").get();
                if (snap.empty) {
                    container.innerHTML = `<div class="text-center py-20 bg-white rounded-[2.5rem] border border-slate-200"><p class="text-slate-400 font-bold uppercase text-xs tracking-widest">No announcements found.</p></div>`;
                    return;
                }

                let html = "";
                snap.forEach(doc => {
                    const data = doc.data();
                    const dateFormatted = new Date(data.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    const timeRange = data.isFullDay ? `Full Days (${data.startDate} to ${data.endDate})` : `${data.startDate} ${data.startTime} → ${data.endDate} ${data.endTime}`;
                    const rolesStr = (data.roles || []).join(', ');
                    const centersStr = (data.centers || []).join(', ');

                    html += `
                        <div class="bg-white p-6 sm:p-8 rounded-[2rem] border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:shadow-md transition-all">
                            <div class="space-y-2 flex-1">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="bg-pink-100 text-pink-700 px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest border border-pink-200">${rolesStr}</span>
                                    <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest border border-indigo-200">Branches: ${centersStr}</span>
                                    <span class="text-slate-400 text-[10px] font-bold">${dateFormatted}</span>
                                </div>
                                <h3 class="font-black text-slate-900 text-lg uppercase tracking-tight">${data.heading}</h3>
                                <p class="text-xs font-bold text-slate-600 leading-relaxed whitespace-pre-wrap">${data.description}</p>
                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Active Schedule: ${timeRange}</p>
                            </div>
                            <button onclick="deleteAnnouncement('${doc.id}')" class="bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white px-4 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest transition-colors border border-rose-200 shadow-sm shrink-0">
                                🗑️ Revoke
                            </button>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="text-center py-20 bg-white rounded-[2.5rem] border border-slate-200"><p class="text-rose-500 font-bold uppercase text-xs tracking-widest">Error loading announcements.</p></div>`;
            }
        }

        async function deleteAnnouncement(id) {
            if (confirm("Revoke and delete this announcement?")) {
                try {
                    await getCollection("announcements").doc(id).delete();
                    loadPastAnnouncements();
                } catch (e) {
                    alert("Failed to delete announcement.");
                }
            }
        }
    </script>
</body>
</html>
